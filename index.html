<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Radha Keli Kunj</title>
  <link rel="icon" href="assets/images/unnamed.webp" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Noto+Serif+Devanagari:wght@400;600;700&family=Noto+Serif+Gujarati:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    /* Custom scrollbar based on project theme */
    ::-webkit-scrollbar {
      width: 10px;
      height: 10px;
    }
    ::-webkit-scrollbar-track {
      background: #f5f5f4;
    }
    ::-webkit-scrollbar-thumb {
      background-color: rgba(136, 19, 55, 0.3);
      border-radius: 5px;
      border: 2px solid #f5f5f4;
      transition: background-color 0.3s ease;
    }
    ::-webkit-scrollbar-thumb:hover {
      background-color: #881337;
    }
    * {
      scrollbar-width: thin;
      scrollbar-color: rgba(136, 19, 55, 0.3) #f5f5f4;
    }

    body {
      background-color: #faf9f6;
      background: linear-gradient(135deg, #fdfdfb 0%, #f4f3ec 100%);
      font-family: 'Outfit', sans-serif;
      margin: 0;
      padding: 0;
      color: #1e1e1a;
      min-height: 100vh;
      display: flex;
      justify-content: center;
    }

    .app-container {
      display: flex;
      flex-direction: row;
      max-width: 1400px;
      width: 100%;
      min-height: 100vh;
      box-sizing: border-box;
      gap: 40px;
      padding: 40px 20px;
    }

    /* Sidebar Styling */
    .sidebar {
      flex: 0 0 360px;
      position: sticky;
      top: 40px;
      height: fit-content;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.5);
      border-radius: 24px;
      padding: 30px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      box-sizing: border-box;
    }

    .sidebar-logo {
      width: 100%;
      height: auto;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
      margin-bottom: 25px;
    }

    .sidebar h1 {
      font-size: 2.2em;
      margin: 0 0 12px 0;
      color: #881337; /* Deep Crimson */
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .sidebar-desc {
      font-size: 1.05em;
      line-height: 1.6;
      color: #57534e;
      margin-bottom: 25px;
      font-family: 'Noto Serif Devanagari', serif;
    }

    

    /* Main Content Styling */
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 40px;
    }

    .navigation-sections {
      display: block;
      width: 100%;
    }

    .nav-section {
      display: flex;
      flex-direction: column;
      gap: 25px;
    }

    .nav-section h2 {
      font-size: 1.8em;
      color: #1c1917;
      margin: 0;
      border-left: 5px solid #881337;
      padding-left: 12px;
      font-weight: 600;
      transition: all 0.3s ease;
    }

    .nav-section h2.hindi-title {
      font-family: 'Noto Serif Devanagari', serif;
    }

    .nav-section h2.gujarati-title {
      font-family: 'Noto Serif Gujarati', serif;
    }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
    }

    .card {
      background: #ffffff;
      border: 1px solid #e7e5e4;
      border-radius: 16px;
      padding: 18px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      text-decoration: none;
      color: inherit;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.02), 0 2px 4px -1px rgba(0, 0, 0, 0.02);
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 0;
      background-color: #881337;
      transition: width 0.25s ease;
    }

    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 24px -5px rgba(136, 19, 55, 0.08), 0 8px 10px -6px rgba(136, 19, 55, 0.08);
      border-color: #fca5a5;
    }

    .card:hover::before {
      width: 4px;
    }

    .card-text {
      font-size: 1.2em;
      font-weight: 600;
      color: #292524;
      transition: color 0.2s ease;
    }

    .card-text.devanagari {
      font-family: 'Noto Serif Devanagari', serif;
    }

    .card-text.gujarati {
      font-family: 'Noto Serif Gujarati', serif;
    }

    .card:hover .card-text {
      color: #881337;
    }

    .card-arrow {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #f5f5f4;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #78716c;
      transition: all 0.25s ease;
    }

    .card:hover .card-arrow {
      background: #881337;
      color: #ffffff;
      transform: translateX(4px);
    }

    /* Premium Language Toggle Switch */
    .lang-switch-container {
      background: #f2f0ea;
      border: 1px solid #e7e5e4;
      border-radius: 30px;
      padding: 4px;
      display: flex;
      gap: 4px;
      width: 100%;
      box-sizing: border-box;
      margin-top: 20px;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.03);
    }

    .lang-switch-btn {
      flex: 1;
      border: none;
      background: transparent;
      padding: 10px 0;
      font-size: 0.95em;
      font-weight: 600;
      border-radius: 24px;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      color: #57534e;
      font-family: 'Outfit', sans-serif;
      text-align: center;
    }

    .lang-switch-btn.active {
      background-color: #881337;
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(136, 19, 55, 0.15);
    }

    .lang-switch-btn:hover:not(.active) {
      color: #881337;
      background-color: rgba(136, 19, 55, 0.03);
    }

    .accordion-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Group Accordion Styles */
    .group-accordion {
      background: #ffffff;
      border: 1px solid #e7e5e4;
      border-radius: 16px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.02), 0 2px 4px -1px rgba(0, 0, 0, 0.02);
      overflow: hidden;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .group-header {
      padding: 18px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      background: #ffffff;
      transition: background-color 0.25s ease;
      user-select: none;
    }

    .group-accordion.open {
      border-color: #fca5a5;
      box-shadow: 0 10px 15px -3px rgba(136, 19, 55, 0.04), 0 4px 6px -2px rgba(136, 19, 55, 0.04);
    }

    .group-header:hover {
      background-color: rgba(136, 19, 55, 0.01);
    }

    .group-title {
      font-size: 1.25em;
      font-weight: 700;
      color: #292524;
      transition: color 0.2s ease;
    }

    .group-title.devanagari {
      font-family: 'Noto Serif Devanagari', serif;
    }

    .group-title.gujarati {
      font-family: 'Noto Serif Gujarati', serif;
    }

    .group-header:hover .group-title,
    .group-accordion.open .group-title {
      color: #881337;
    }

    .group-chevron {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #f5f5f4;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #78716c;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .group-header:hover .group-chevron,
    .group-accordion.open .group-chevron {
      background: #881337;
      color: #ffffff;
    }

    .group-accordion.open .group-chevron {
      transform: rotate(180deg);
    }

    /* Group Content Area */
    .group-content {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      background: #fafaf9;
      border-top: 0 solid #f5f5f4;
    }

    .group-accordion.open .group-content {
      border-top-width: 1px;
    }

    .group-books-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      padding: 24px;
    }

    @media (max-width: 768px) {
      .group-books-grid {
        grid-template-columns: 1fr;
        padding: 16px;
      }
    }

    /* Responsive styling */
    @media (max-width: 1024px) {
      .app-container {
        flex-direction: column;
        padding: 30px 15px;
        gap: 30px;
      }
      .sidebar {
        flex: 1;
        position: relative;
        top: 0;
        width: 100%;
        max-width: 100%;
      }
    }

    @media (max-width: 768px) {
      .cards-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

    <div class="sidebar">
      <img src="assets/images/p_0.jpg" alt="Radha Keli Kunj" class="sidebar-logo">

      <div class="lang-switch-container">

      </div>

          <div class="accordion-list" id="cardsGrid">

          </div>
        </div>
      </div>
    </div>
  </div>

          bookIds: [
            'mangalacharan',
            'shri-hit-mangal-gaan',
            'shri-yamunashtakam-without-meaning',
            'priyajukinamavali',
            'laljukinamavali',
            'rasiknaamavali',
            'yugaldhyaan',
            'bhaktanamavali',
            'shri-vrindavan-dham-namavali',
            'ishtaradhanprakaran',
            'ishtstuti',
            'kirtanjaykara',
            'shriradhakenaam',
            'padavali'
          ]
        },
        {
          id: 'stotravali',
          hi: 'स्तोत्रावली',
          gu: 'સ્તોત્રાવલી',
          bookIds: [
            'gopal',
            'radhakripakataksh',
            'krishnastakam',
            'madhurastakam',
            'bhajgovindam',
            'gopigeet'
          ]
        },
        {
          id: 'utsav-ke-pad',
          hi: 'उत्सव के पद',
          gu: 'ઉત્સવના પદ',
          bookIds: [
            'jhulankepad',
            'lalju-ki-janm-badhai',
            'vyahula',
            'bhaktarchan'
          ]
        }
      ];

      const langData = {
        hi: {
          desc: "राधावल्लभ सम्प्रदाय के रसिक संत एवं आचार्य प्रणीत ग्रन्थों का दिव्य संग्रह।",
          sectionTitle: "दिव्य ग्रन्थ संग्रह"
        },
        gu: {
          desc: "રાધાવલ્લભ સંપ્રદાયના રસિક સંતો અને આચાર્યો દ્વારા રચિત ગ્રંથોનો દિવ્ય સંગ્રહ.",
          sectionTitle: "દિવ્ય ગ્રંથ સંગ્રહ"
        }
      };

      let openGroupId = localStorage.getItem('openGroupId') || null;

      function toggleGroup(groupId) {
        const accordion = document.getElementById('group-' + groupId);
        const content = document.getElementById('content-' + groupId);
        if (!accordion || !content) return;
        
        const isOpen = accordion.classList.contains('open');
        
        document.querySelectorAll('.group-accordion').forEach(acc => {
          acc.classList.remove('open');
          const accContent = acc.querySelector('.group-content');
          if (accContent) accContent.style.maxHeight = '0px';
        });
        
        if (isOpen) {
          openGroupId = null;
          localStorage.removeItem('openGroupId');
        } else {
          accordion.classList.add('open');
          content.style.maxHeight = content.scrollHeight + 'px';
          openGroupId = groupId;
          localStorage.setItem('openGroupId', groupId);
        }
      }

      function setLanguage(lang) {
        localStorage.setItem('preferredLanguage', lang);
        updateUI(lang);
      }

      function updateUI(lang) {
        const data = langData[lang];

        // Update texts
        document.getElementById('sidebarDesc').textContent = data.desc;

        const sectionTitle = document.getElementById('sectionTitle');
        sectionTitle.textContent = data.sectionTitle;
        sectionTitle.className = lang === 'hi' ? 'hindi-title' : 'gujarati-title';

        // Update active class on switch buttons
        document.querySelectorAll('.lang-switch-btn').forEach(btn => {
          const isActive = btn.getAttribute('data-lang') === lang;
          btn.classList.toggle('active', isActive);
        });

        // Render card containers (accordions + standalone)
        const cardsGrid = document.getElementById('cardsGrid');
        cardsGrid.innerHTML = '';

        // Render Groups
        groups.forEach(group => {
          const groupTitleText = lang === 'hi' ? group.hi : group.gu;
          const titleFontClass = lang === 'hi' ? 'devanagari' : 'gujarati';

          const groupBooks = group.bookIds.map(id => books.find(b => b.id === id)).filter(Boolean);

          let booksHtml = '';
          groupBooks.forEach(book => {
            const titleText = lang === 'hi' ? book.hi : book.gu;
            const fontClass = lang === 'hi' ? 'devanagari' : 'gujarati';
            booksHtml += `
              <a href="${group.id}/${book.id}.html" class="card">
                <span class="card-text ${fontClass}">${titleText}</span>
                <div class="card-arrow">
                  <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" style="width: 16px; height: 16px;">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3" />
                  </svg>
                </div>
              </a>
            `;
          });

          const isGroupOpen = openGroupId === group.id;
          const openClass = isGroupOpen ? 'open' : '';
          const maxHeightStyle = isGroupOpen ? 'style="max-height: none;"' : '';

          const groupHtml = `
            <div class="group-accordion ${openClass}" id="group-${group.id}">
              <div class="group-header" onclick="toggleGroup('${group.id}')">
                <span class="group-title ${titleFontClass}">${groupTitleText}</span>
                <div class="group-chevron">
                  <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" style="width: 16px; height: 16px;">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25l-7.5 7.5-7.5-7.5" />
                  </svg>
                </div>
              </div>
              <div class="group-content" id="content-${group.id}" ${maxHeightStyle}>
                <div class="group-books-grid">
                  ${booksHtml}
                </div>
              </div>
            </div>
          `;
          cardsGrid.innerHTML += groupHtml;
        });

        // Render standalone cards
        const groupedIds = new Set(groups.flatMap(g => g.bookIds));
        const standaloneBooks = books.filter(b => !groupedIds.has(b.id));

        standaloneBooks.forEach(book => {
          const titleText = lang === 'hi' ? book.hi : book.gu;
          const fontClass = lang === 'hi' ? 'devanagari' : 'gujarati';

          const cardHtml = `
            <a href="${book.id}.html" class="card">
              <span class="card-text ${fontClass}">${titleText}</span>
              <div class="card-arrow">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" style="width: 16px; height: 16px;">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3" />
                </svg>
              </div>
            </a>
          `;
          cardsGrid.innerHTML += cardHtml;
        });
      }

      // Expose setLanguage and toggleGroup globally
      window.setLanguage = setLanguage;
      window.toggleGroup = toggleGroup;

      // Load initial language
      const currentLang = localStorage.getItem('preferredLanguage') || 'hi';
      updateUI(currentLang);

      // Restore scroll position
      const savedScroll = localStorage.getItem('homeScrollPosition');
      if (savedScroll) {
        setTimeout(() => {
          window.scrollTo(0, parseInt(savedScroll));
        }, 50);
      }

      // Track scroll position changes
      window.addEventListener('scroll', () => {
        localStorage.setItem('homeScrollPosition', window.scrollY);
      });
    })();
  </script>

</body>
