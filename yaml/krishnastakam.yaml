- verseNumber: ""
  verseText: | 
    भजे व्रजैकमण्डनं समस्तपापखण्डनं,
    स्वभक्तचित्तरञ्जनं सदैव नन्दनन्दनम् ।
    सुपिच्छगुच्छमस्तकं सुनादवेणुहस्तकं,
    अनंगरङ्गसागरं नमामि कृष्णनागरम् ॥1॥

    व्याख्या - व्रजभूमि के एकमात्र भूषण (शृंगार), समस्त पापों को नष्ट करने वाले तथा अपने भक्तों के चित्त को आनन्द प्रदान करने वाले नन्दनन्दन को मैं सदैव भजता हूँ; जिनके मस्तक पर मोरमुकुट है, हाथों में सुमधुर बांसुरी है तथा जो प्रेमरस की तरंगों के सागर हैं, उन नटनागर श्रीकृष्णचन्द्र को मैं नमस्कार करता हूँ।

    मनोजगर्वमोचनं विशाललोललोचनं,
    विधूतगोपशोचनं नमामि पद्मलोचनम् ।
    करारविन्दभूधरं स्मितावलोकसुन्दरं,
    महेन्द्रमानदारणं नमामि कृष्णवारणम् ॥2॥

    व्याख्या - कामदेव के गर्व का नाश करने वाले, बड़े-बड़े सुन्दर चंचल नेत्रों वाले तथा व्रजगोपों का शोक हरने वाले कमलनयन भगवान् श्रीकृष्ण को मेरा नमस्कार है; जिन्होंने अपने करकमलों पर गिरिराज को धारण किया था तथा जिनकी मुस्कान और चितवन अति मनोहर है, देवराज इन्द्र का मान-मर्दन करने वाले, गजराज के सदृश मत्त श्रीकृष्णचन्द्र को मैं नमस्कार करता हूँ।

    कदम्बसूनकुण्डलं सुचारुगण्डमण्डलं,
    व्रजाङ्गनैकवल्लभं नमामि कृष्ण दुर्लभम् ।
    यशोदया समोदया सगोपया सनन्दया,
    युतं सुखैकदायकं नमामि गोपनायकम् ॥3॥

    व्याख्या - जिनके कानों में कदम्बपुष्पों के कुंडल हैं, जिनके अत्यन्त सुन्दर कपोल हैं तथा व्रजबालाओं के जो एकमात्र प्राणाधार हैं, ऐसे दुर्लभ (केवल प्रेमा-भक्ति के द्वारा ही प्राप्त किये जाने वाले) भगवान् श्रीकृष्ण को मैं नमस्कार करता हूँ; जो गोपगण और नन्दबाबा के सहित अति प्रसन्न यशोदा मैया से युक्त हैं और एकमात्र आनन्द देने वाले हैं, उन गोपनायक भगवान् श्रीकृष्ण को मैं नमस्कार करता हूँ।

    सदैव पादपङ्कजं मदीयमानसे निजं
    दधानमुत्तमालकं नमामि नन्दबालकम् ।
    समस्तदोषशोषणं समस्तलोकपोषणं,
    समस्तगोपमानसं नमामि नन्दलालसम् ॥4॥

    व्याख्या - जिन्होंने मेरे मनरूपी सरोवर में अपने चरणकमलों को स्थापित कर रखा है, उन अति सुन्दर घुँघराली अलकों वाले नन्दनंदन को मैं नमस्कार करता हूँ तथा समस्त दोषों को दूर करने वाले, समस्त लोकों का पालन करने वाले और समस्त व्रजगोपों के हृदय तथा नन्दबाबा की वात्सल्य लालसा के आधार भगवान् श्रीकृष्णचन्द्र को मैं नमस्कार करता हूँ।

    भुवोभरावतारकं भवाब्धिकर्णधारकं,
    यशोमतीकिशोरकं नमामि चित्तचोरकम् ।
    दृगन्तकान्तभङ्गिनं सदासदालसङ्गिनं,
    दिने दिने नवं नवं नमामि नन्दसंभवम् ॥5॥

    व्याख्या - भूमि का भार उतारने वाले, भवसागर से तारने वाले कर्णधार श्रीयशोदाकिशोर चित्तचोर को मेरा नमस्कार है। कमनीय कटाक्ष चलाने की कला में प्रवीण सर्वदा दिव्य सखियों से सेवित, नित्य नए-नए प्रतीत होने वाले नन्दलाल को मेरा नमस्कार है।

    गुणाकरं सुखाकरं कृपाकरं कृपापरं,
    सुरद्विषन्निकन्दनं नमामि गोपनन्दनम् ।
    नवीनगोपनागरं नवीनकेलिलंपटं,
    नमामि मेघसुन्दरं तटित्प्रभालसत्पटम् ॥6॥

    व्याख्या - गुणों की खान और आनन्द के निधान, कृपा पर कृपा करने के लिए तत्पर, देवताओं के शत्रु दैत्यों का नाश करने वाले गोपनन्दन को मेरा नमस्कार है। नवीन-गोप नटवरनागर एवं नवीन खेल खेलने के लिए लालायित, घनश्याम अंग वाले, बिजली सदृश सुन्दर पीताम्बरधारी श्रीकृष्ण भगवान् को मेरा नमस्कार है।

    समस्तगोपनन्दनं हृदंबुजैकमोदनं,
    नमामि कुञ्जमध्यगं प्रसन्नभानुशोभनम् ।
    निकामकामदायकं दृगन्तचारुसायकं,
    रसालवेणुगायकं नमामि कुञ्जनायकम् ॥7॥

    व्याख्या - समस्त गोपों को आनन्दित करने वाले, हृदयकमल को प्रफुल्लित करने वाले, निकुंज के बीच में विराजमान, प्रसन्नमन सूर्य के समान प्रकाशमान श्रीकृष्ण भगवान् को मेरा नमस्कार है। सम्पूर्ण अभिलिषित कामनाओं को पूर्ण करने वाले, वाणों के समान चोट करने वाली चितवन वाले, मधुर मुरली में गीत गाने वाले, निकुंजनायक को मेरा नमस्कार है।

    विदग्ध-गोपिका-मनोमनोज्ञ-तल्प-शायिनं,
    नमामि कुञ्जकानने प्रवृद्ध-वह्नि-पायिनम् ।
    किशोरकान्ति रञ्जितं दृगन्जनं सुशोभितम्,
    गजेन्द्र मोक्ष कारिणं, नमामि श्रीविहारिणम् ॥8॥

    व्याख्या - चतुर गोपिकाओं की मन रूपी शैया पर पर शयन करने वाले, कुंजवन में बढ़ी हुई विरह अग्नि को पान करने वाले, किशोरावस्था की कान्ति से सुशोभित अंग वाले, अंजन लगे सुन्दर नेत्रों वाले, गजेन्द्र को ग्राह से मुक्त करने वाले, श्रीजी के साथ विहार करने वाले श्रीकृष्णचन्द्र को मैं नमस्कार करता हूँ।

    यदा तदा यथा तथा तथैव कृष्णसत्कथा,
    मया सदैव गीयतां तथा कृपा विधीयताम् ।
    प्रमाणिकाष्टकद्वयं जपत्य-धीत्य यः पुमान्
    भवेत्स नन्दनन्दने भवे भवे सुभक्तिमान् ॥9॥

    व्याख्या - प्रभो! मेरे ऊपर ऐसी कृपा हो कि मैं जहाँ-कहीं जैसी भी परिस्थिति में रहूँ, सदा आपकी सत्कथाओं का गान करता रहूँ। जो पुरुष इस श्रीकृष्णाष्टक का नित्य पाठ करता है, वह प्रत्येक जन्म में नन्दनन्दन श्रीश्यामसुंदर की भक्ति से सम्पन्न होकर श्रीकृष्ण कृपा-करुणा को प्राप्त करता है। 

    ॥ श्री कृष्णाष्टकम् की जै जै श्रीहित हरिवंश ॥
