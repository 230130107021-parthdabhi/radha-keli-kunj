- verseNumber: "1. भक्तार्चन"
  verseText: |

    वांछा कल्पतरुभ्यश्च कृपा-सिन्धुभ्य एव च ।
    पतितानां पावनेभ्यो वैष्णवेभ्यो नमो नमः ॥

    भक्त भक्ति भगवन्त गुरु चतुर नाम वपु एक ।
    इनके पद वन्दन किये नासहिं विघ्न अनेक ॥
    
    चारि युगन में भक्त जे तिनके पद की धूरि । 
    सर्वसु सिर धरि राखिहौं मेरी जीवन मूरि ॥

    अजहूँ सोचि बिचारि कैं, गहि भक्तनि पद ओट । 
    हरि कृपालु सब पाछिली, छमि हैं तेरी खोट ॥

    - श्रीमते परात्पर प्रेमस्वरूप महाप्रभु श्रीहित हरिवंशचंद्राय नमः  
    - श्रीमते पूज्य श्रीगौरांगी शरणाय नमः 
    - श्रीमते स्वामी हरिदासाय नमः 
