- verseNumber: ""
  verseText: | 
    दिनमपि रजनी सायं प्रात: शिशिरवसन्तौ पुनरायात:।
    काल: क्रीडति गच्छत्यायुस्तदपि न मुञ्चत्याशावायु: ।।1।।
    भज गोविन्दं भज गोविन्दं भज गोविन्दं मूढ़मते।
    प्राप्ते सन्निहिते मरणे नहि नहि रक्षति डुकृञ् करणे।। (ध्रुवपद्म)

    व्याख्या - दिन और रात, सायंकाल और प्रातःकाल, शिशिर और वसन्त पुनः-पुनः आते हैं; इसी प्रकार काल की लीला होती रहती है और आयु बीत जाती है, किन्तु आशा रूपी वायु छोड़ती ही नहीं; अतः हे मूढ ! निरन्तर गोविन्द को ही भज, क्योंकि मृत्यु के समीप आने पर 'डुकृञ् करणे' यह रटना रक्षा नहीं कर सकेगी।
    (व्याकरण में 'डुकृञ् करणे' एक धातु है, इसे एक ब्राह्मण को वृद्ध होने पर भी रटते देखकर श्रीशङ्कराचार्यजी ने यह उपदेश किया।)

    अग्रे वह्नि: पृष्ठे भानू रात्रौ चिबुकसमर्पितजानु:।
    करतलभिक्षा तरुतलवासस्तदपि न मुञ्चत्याशापाश: ।।2।।

    व्याख्या - दिन में आगे अग्नि और पीछे सूर्य से शरीर तपाते हैं, रात्रि के समय जानुओं में ठोड़ी दबाये पड़े रहते हैं, हाथ में ही भिक्षा माँग लाते हैं, वृक्ष के तले ही पड़े रहते हैं, फिर भी आशा का जाल जकड़े ही रहता है; अतः हे मूढ ! निरन्तर गोविन्द को ही भज, क्योंकि मृत्यु के समीप आने पर 'डुकृञ् करणे' यह रटना रक्षा नहीं कर सकेगी।   
    
    यावद्वित्तोपार्जनसक्तस्तावन्निजपरिवारो रक्त:।
    पश्चाद्धावति जर्जरदेहे वार्तां पृच्छति कोऽपि न गेहे ।।3।।
    
    व्याख्या - अरे, जब तक तू धन कमाने में लगा हुआ है तभी तक तेरा परिवार तुझसे प्रेम करता है, जब जराग्रस्त होगा तो घर में कोई बात भी न पूछेगा; अतः हे मूढ ! निरन्तर गोविन्द को ही भज, क्योंकि मृत्यु के समीप आने पर 'डुकृञ् करणे' यह रटना रक्षा न कर सकेगी। 
    
    जटिलो मुण्डी लुञ्चितकेश: काषायाम्बरबहुकृतवेष:।
    पश्यन्नपि च न पश्यति लोको ह्युदरनिमित्तं बहुकृतशोक: ।।4।।
    
    व्याख्या - जटाजूटधारी होकर, मुण्डित होकर, लुञ्चित केश होकर, काषाय अम्बरधारी होकर, ऐसे नाना प्रकार के वेष धारण करके यह मनुष्य देखता हुआ भी नहीं देखता और पेट के लिये ही नाना प्रकार से शोक किया करता है; अतः हे मूढ़ ! निरन्तर गोविन्द को ही भज, क्योंकि मृत्यु के समीप आने पर यह 'डुकृञ् करणे' रटना रक्षा न कर सकेगी। 
    
    भगवद्गीता किञ्चिदधीता गंगाजललवकणिकापीता।
    सकृदपि यस्य मुरारिसमर्चा तस्य यम: किं कुरुते चर्चाम् ।।5।।
    
    व्याख्या - जिसने भगवद्गीता को कुछ भी पढ़ा है, गङ्गाजल की जिसने एक बूँद भी पी है, एक बार भी जिसने भगवान् श्रीकृष्णचन्द्र का अर्चन किया है, उसकी यमराज क्या चर्चा कर सकता है ? अतः हे मूढ ! निरन्तर गोविन्द को ही भज, क्योंकि मृत्यु के समीप आने पर 'डुकृञ् करणे' रटना रक्षा न कर सकेगी। 
    
    अगं गलितं पलितं मुण्डं दशनविहीनं जातं तुंडम्।
    वृद्धो याति गृहीत्वा दण्डं तदपि न मुञ्चत्याशा पिण्डम् ।।6।।
    
    व्याख्या - अङ्ग गलित हो गये, सिर के बाल पक गये, मुख में दाँत नहीं रहे, बूढ़ा हो गया, लाठी लेकर चलने लगा, फिर भी आशा पिण्ड नहीं छोड़ती; अरे मूढ ! निरन्तर गोविन्द को भज, क्योंकि मृत्यु के समीप आनेपर 'डुकृञ् करणे' रटना रक्षा न कर सकेगी। 
    
    बालस्तावत्क्रीडा सक्तस्तरुणस्तावत्तरुणीरक्त:।
    वृद्धस्तावच्चिन्तामग्न: पारे ब्रह्माणि कोऽपि न लग्न: ।।7।।
    
    व्याख्या - बालक तो खेल-कूद में आसक्त रहता है, तरुण तो स्त्री में आसक्त है और वृद्ध भी नाना प्रकार की चिन्ताओं में मग्न रहता है, परब्रह्म में तो कोई संलग्न नहीं होता; अतः अरे मूढ ! तू सदा गोविन्द का ही भजन कर, क्योंकि मृत्यु के समीप आने पर 'डुकृञ् करणे' यह रटना रक्षा न कर सकेगी। 
    
    पुनरपि जननं पुनरपि मरणं पुनरपि जननीजठरे शयनम्।
    इह संसारे खलु दुस्तारे कृपयापारे पाहि मुरारे ।।8।।
    
    व्याख्या - इस संसार में पुनः-पुनः जन्म, पुनः-पुनः मरण और बारंबार माता के गर्भ में रहना पड़ता है,अतः हे मुरारे ! मैं आपकी शरण हूँ, इस दुस्तर और अपार संसार से कृपया पार कीजिये; इस प्रकार अरे मूढ ! तू तो सदा गोविन्द का ही भजन कर, क्योंकि मृत्यु के समीप आनेपर 'डुकृञ् करणे' यह रटना रक्षा न कर सकेगी। 
    
    पुनरपि रजनी पुनरपि दिवस: पुनरपि पक्ष: पुनरपि मास: ।
    पुनरप्ययनं पुनरपि वर्षं तदपि न मुञ्चत्याशामर्षम् ।।9।।
    
    व्याख्या - रात्रि, दिन, पक्ष, मास, अयन और वर्ष कितनी ही बार आये और गये तो भी लोग ईर्ष्या और आशा को नहीं छोड़ते, अतः अरे मूढ ! तू सदा गोविन्द का भजन कर, क्योंकि मृत्यु के समीप आनेपर यह 'डुकृञ् करणे' रटना रक्षा न कर सकेगी। 
    
    वयसि गते क: कामविकार: शुष्के नीरे क: कासार:।
    नष्टे द्रव्ये क: परिवारो ज्ञाते तत्वे क: संसार: ।।10।।
    
    व्याख्या - अवस्था ढलने पर काम-विकार कैसा ? जल सूखने पर जलाशय क्या ? तथा धन नष्ट होने पर परिवार ही क्या ? इसी प्रकार तत्त्वज्ञान होने पर संसार ही कहाँ रह सकता है ? अतः हे मूढ ! सदा गोविन्द को भज, क्योंकि मृत्यु के समीप आनेपर यह 'डुकृञ् करणे' रटना रक्षा न कर सकेगी। 
    
    नारीस्तनभरनाभिनिवेशं मिथ्यामायामोहावेशम्।
    एतन्मांसवसादिविकारं मनसि विचारय बारम्बारम् ।।11।।
    
    व्याख्या - नारी के स्तनों और नाभि निवेश में मिथ्या माया और मोह का ही आवेश है, ये मांस और मेद के ही विकार हैं- ऐसा बार-बार मनमें विचार, हे मूढ ! सदा गोविन्द का भजन कर, क्योंकि मृत्यु के समीप आनेपर यह 'डुकृञ् करणे' रटना रक्षा न कर सकेगी। 
    
    कस्त्वं कोऽहं कुत आयात: का मे जननी को मे तात:।
    इति परिभावय सर्वमसारं विश्वं त्यक्त्वा स्वप्नविचारम् ।।12।।
    
    व्याख्या - स्वप्नवत् मिथ्या संसार की आस्था छोड़कर 'तू कौन है, मैं कौन हूँ कहाँसे आया हूँ, मेरी माता कौन है और पिता कौन है ?' - इस प्रकार सबको असार समझ तथा हे मूढ ! निरन्तर गोविन्द का भजन कर, क्योंकि मृत्यु के निकट आनेपर 'डुकृञ् करणे' यह रटना रक्षा न कर सकेगी। 
    
    गेयं गीतानामसहस्त्रं ध्येयं श्रीपतिरूपमजस्त्रम्।
    नेयं सज्जनसंगे चित्तं देयं दीनजनाय च वित्तम् ।।13।।
    
    व्याख्या - गीता और विष्णुसहस्रनाम का नित्य पाठ करना चाहिये, भगवान् विष्णु के स्वरूप का निरन्तर ध्यान करना चाहिये, चित्त को संतजनों के सङ्ग में लगाना चाहिये और दीनजनों को धन दान करना चाहिये और हे मूढ ! नित्य गोविन्दका ही भजन कर, क्योंकि मृत्यु के निकट आनेपर 'डुकृञ् करणे' यह रटना रक्षा न कर सकेगी। 
    
    यावज्जीवो निवसति देहे कुशलं तावत्पृच्छति गेहे।
    गतवति वायौ देहापाये भार्या बिभ्यति तस्मिन्काये ।।14।।
    
    व्याख्या - जब तक प्राण शरीर में है तबतक ही लोग घर में कुशल पूछते हैं, प्राण निकलने पर शरीर का पतन हुआ कि फिर अपनी स्त्री भी उससे भय मानती है; अतः हे मूढ ! नित्य गोविन्द को ही भज, क्योंकि मृत्यु के निकट आने पर 'डुकृञ् करणे' यह रटना रक्षा न कर सकेगी। 
    
    सुखत: क्रियते रामाभोग: पश्चाद्धन्त शरीरे रोग:।
    यद्यपि लोके मरणं शरणं तदपि न मुंचति पापाचरणम् ।।15।।
    
    व्याख्या - पहले तो सुख से स्त्री-सम्भोग किया जाता है, किन्तु पीछे शरीर में रोग घर कर लेते हैं, यद्यपि संसार में मरना अवश्य है तथापि लोग पापाचरण को नहीं छोड़ते; अतः हे मूढ ! सदा गोविन्द का भजन कर, क्योंकि मृत्यु के निकट आने पर 'डुकृञ् करणे' यह रटना रक्षा न कर सकेगी। 
    
    रथ्याचर्पटविरचितकंथ: पुण्यापुण्यविवर्जितपन्थ:।
    नाहं न त्वं नायं लोकस्तदपि किमर्थं क्रियते शोक: ।।16।।
    
    व्याख्या - गली में पड़े चिथड़ों की कन्था बना ली, पुण्यापुण्य से निराला मार्ग अवलम्बन कर लिया, 'न मैं हूँ, न तू है और न यह संसार है' - (ऐसा भी जान लिया), फिर भी किस लिये शोक किया जाता है ? अतः हे मूढ ! सदा गोविन्द का भजन कर, क्योंकि मृत्यु के निकट आनेपर 'डुकृञ् करणे' यह रटना रक्षा न कर सकेगी। 
    
    कुरुते गंगासागरगमनं व्रतपरिपालनमथवा दानम्।
    ज्ञानविहीन: सर्वमतेन मुक्तिं न भजति जन्मशतेन ।।17।।
    
    व्याख्या - चाहे गङ्गा-सागर को जाय, चाहे नाना व्रतोपवासों का पालन अथवा दान करे तथापि बिना ज्ञान के इन सबसे सौ जन्म में भी मुक्ति नहीं हो सकती; अतः हे मूढ ! सर्वदा गोविन्द का भजन कर, क्योंकि मृत्यु के निकट आने पर 'डुकृञ् करणे' (अथवा हा धन ! हा कुटुम्ब !! हा संसार !!!) यह रटना रक्षा न कर सकेगी।
    
    इति श्रीशङ्कराचार्यविरचितं चर्पटपञ्जरिकास्तोत्रं सम्पूर्णम् ।