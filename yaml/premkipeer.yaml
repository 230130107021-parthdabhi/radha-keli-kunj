- verseNumber: "intro"
  verseText: |
    श्री गुरु वन्दना
    रस घन गुरु पादाः व्यास पुत्रस्तथैव,
    जयति रसिक नाथो राधिका बल्लभश्च ।
    वन हिम कर मुख्यो नाद बिंदु स्वरूप:
    रसिक नृपति वंशो में गति: सर्वदास्तु ॥
- verseNumber: "1."
  verseText: |
    ॥ दोहा ॥ 
    मेरे जीवन प्राण धन, श्री गुरु चरण सरोज ।
    ध्यान धरत प्रगटत हृदय, दम्पति केलि मनोज ॥॥ 
- verseNumber: "2."
  verseText: |
    गुरु पद नख की चाँदनी, मेटत भव अंधियार ।
    कोटि कोटि चिन्तामणी, जिन पर डारौं वार ॥॥ 
- verseNumber: "3."
  verseText: |
    भली -भली सब लेत हैं, वस्तु परखि कै ठीक ।
    खोटे दास अनाथ के, तुम ही गाहक नीक ॥॥
- verseNumber: "4."
  verseText: | 
    श्री राधा जानूँ नहीं, नहिं जानूँ घनश्याम ।
    तव पद पंकज बिन कहूँ, मोहि न सूझत ठाम ॥॥ 
- verseNumber: "5."
  verseText: |
    श्रीजी सन्‍मुख कहत जे, विनय गीत प्रति द्यौस ।
    तेई इत संग्रह करों, करुणा कोर भरोस ॥॥
- verseNumber: "6."
  verseText: | 
    श्री गुरु गोपीलाल मम, श्री गोवर्धन लाल ।
    इष्ट देव हरिवंश हित, पोच पतित प्रतिपाल ॥॥
- verseNumber: "7."
  verseText: |
    श्री गुरुचरण रेणु बलि जाऊँ ।
    श्रीहित रूप प्रकट गोवर्धन लाल, चरण युग पंकज ध्याऊँ ।
    तुमसों मोहि मचलिबौ अब तौ, ज्यौ त्यों श्री हित दर्शन पाऊँ ॥ 
    भरि भरि नयन माधुरी पी-पी, मत्त मुदित बलिहारी जाऊँ ।
    भोरी हित कृपाल करुणा निधि, तुम बिनु और न दूजौ ठाऊँ ॥ 
- verseNumber: "8."
  verseText: |
    श्री गुरुचरण रेणु चित लाऊँ ।
    श्री हित गोपीलाल कृपा पर, बार -बार बलि जाऊँ ॥ 
    पामर पोच पतित अति दुखिया, तुम्हरौ तदपि कहाऊँ ।
    कबहूँ चरण कमल की महिमा, निरखि निरखि सचु पाऊँ ॥ 
    श्री हरिवंश कृपालु दरस कौ, बार -बार ललचाऊँ ।
    कौन भाँति भरि नयन देखि कै, दुर्बल बाँह गहाऊँ ॥ 
    तुम्हरी बल हियरा में मेरे, तुम्हें पुकारि सुनाऊँ ।
    भोरी हित जग विदित रावरौ, पोच निवाहन पाऊँ ॥ 
- verseNumber: "9."
  verseText: |
    श्रीहित हरिवंश वन्दना

    जय जय श्री हरिवंश गुसाई ।
    जय मोहन कर कमल युगल पर, वेणु रूप श्रुति गाई ॥ 
    जय-जय लीला ललित मनोहर, मानस राज मराला ।
    जय सुख सागर रूप उजागर, कारण रहित कृपाला ॥ 
    आरति हरण शरण सुख दायक, करुणा सिन्धु दयाला ।
    जय-जय-अधम उधारण रसनिधि, रसिक सभा प्रतिपाला ॥ 
    जय शरणागत वत्सल हित वपु, रहसि केलि विस्तारी ।
    माया मानुष रूप मनोहर, हरण मोह भ्रम भारी ॥ 
    अशरण शरण सहज करुणानिधि, राधा चरण उपासी ।
    राधा प्राण देह तन सरबस, कुंज केलि सुख रासी ॥ 
    जद्दपि मोहन अधर सुधा रस, पान करत सुख पाई ।
    तद्यपि राधा नाम रटत नित, गुप्त रीति प्रगटाई ॥ 
    महिमा अमित कहा मुख वरणौ, शारद पार न पावै ।
    हौं तो चरण शरण करुणानिधि, तासौं कछु कहि आवै ॥ 
    यह जानत हौं अवसि कृपा करि, कबहूँ पार लगै हौ ।
    यह माँगत दै दरशन कबहुँक, हँसि-हँसि जूठन दैहौ ॥ 
    तब जो करो भली सो सबही, अब तौ यह मन भावै ।
    भोरी जूठन खाइ उदर भरि, बैठि विमल गुन गावै ॥ 
- verseNumber: "10."
  verseText: |
    और न राधा, श्याम न दूजे ।
    सब विधि दोउ प्रसन्न करुणानिधि, श्रीहरिवंश चरण रज पूजे ॥ 
    प्रीति रीति बिनु व्याकुल भोरी, ठौर ठीक नहिं अब कहुँ सूझै ।
    व्यास सुवन बिनु को अस दुजौ, जो अब पीर हिये की बूझै ॥ 
- verseNumber: "11."
  verseText: |
    का जानों कब भाग जागि है ।
    श्री हरिवंश चरण रज उर धरि, जुगल रूप रस पागि है ।
    रसिकन सों नित मिलबौ-जुलबौ, विमुख संग हठ त्यागि है ॥ 
    बढ़ि है नित उर मिलन चटपटी, चरण कमल अनुरागि है ।
    भोरी रसिक कृपा सों कबहूँ, प्रीति अनोखी लागि है ॥ 
- verseNumber: "12."
  verseText: |
    ऐसी तुमहिं कि बूझिये हरिवंश कृपाला ।
    हौं तो लगी चरण से, उर आस विशाला ॥ 
    अवलम्ब इक तिहारी, कोऊ न और मेरौ ।
    पुण्य नहीं गाँठ कछू, पाप तौ घनेरौ ॥ 
    जो कछु अब होइ - होइ, हौं न कछू माँगौं ।
    ऐसौ मन मेरौ करौ, चरणन अनुरागौं ॥ 
    रिपु सम सब लगै जगत, पंकज पग प्यारे ।
    दिन तौ कटै गुणन गनत, रात गिनत तारे ॥ 
    जुगल मिलन चटपटी, उर में अधिकावै ।
    असन बसन जगत्प्रीति, नेक ना सुहावै ॥ 
    सहज कृपा सिंधु बेगि, मेटहु भव भारी ।
    भोरी हिय प्रेम देहु, चरणन बलिहारी ॥ 
- verseNumber: "13."
  verseText: |
    क्यों न द्रवहु हरिवंश कृपाला ।
    बहुत बेर भई करत बीनती, आरत हरण दयाला ॥ 
    हौं तौ दामन लगी तिहारे, सुनहु अधम प्रतिपाला ।
    भोरी बलि अब बेर न कीजिय , तन मन होत विहाला ॥ 
- verseNumber: "14."
  verseText: |
    व्यास कुँवर हँसि कहौ लाडिले, यह कैसे बनि आवै ।
    शिव सनकादिक विष्णु ब्रह्मादिक , जेहि पद रज सिर लावै ॥ 
    सो मोहन जेहि मुख रस बतियाँ, सुनिवे नित ललचावै ।
    किस विधि सो कृपालु अलबेली, हँसि मोसौं बतरावै ॥ 
    पापी अधम पतित अति खोटी, तौहू धीर न आवै ।
    भोरी की यह भोरी आसा, तुम बिन कौन पुजावै ॥ 
- verseNumber: "15."
  verseText: |
    उमड़त रस पयोधि अँखियन में ।
    श्रीहित सखी कृपाल सुनों अब, तुम तौ श्रेष्ठ सभी सखियन में ॥ 
    सब पर सहज कृपा रस बरसत , कृपा सुदृष्टि कनखियन में ।
    क्यों न पुकार सुनों , रस प्यासी भोरी टेर रही दुखियन में ॥ 
- verseNumber: "16."
  verseText: |
    श्री हरिवंश कृपा बलि कीजै ।
    निज सरबस भरि नयन दिखावहु, मो सरबस सब लीजै ॥ 
    ऐसो मो हिय करहु कृपानिधि, छिन छिन उमगि पसीजै ।
    बिनु देखे पल धीर न आवै, विरह ताप तन छीजै ॥ 
    लोचन छके रहैं वा मुख पै, हियौ रंग सों भीजै ।
    बिनु हित बढ़न न और सुहावै, नित नव माधुरि पीजै ॥ 
    तुम बिनु कछु न सुनै नहिं देखै, देख-देख छवि जीजै ।
    भोरी दीन दुखारी याचक, रीझ दान यह दीजै ॥ 
- verseNumber: "17."
  verseText: |
    श्री हरिवंश चरन चित धरि हौं ।
    तुम्हरे बल कृपाल करुणा निधि, सब ही शंक बिसरि हौं ।
    कबहूँ भाग जगै हौ ऐसे, उमगत पाँव पकरि हौं ॥ 
    मत्त मुदित डोलत रस छाकी, सब की लाज निदरि हौं ।
    भोरी हित बल चरण कमल के, गरजत-गरजत मरि हौं ॥ 
- verseNumber: "18."
  verseText: |
    ऐसी हौंस बढ़त उर माहीं ।
    हित हरिवंश कृपालु कृपानिधि , कबहुँ गहौ हँसि बाहीं ॥ 
    जद्दपि पोच पतित शठ मोसौ, दूजौ त्रिभुवन नाहीं ।
    गरजत तदपि फिरौंगी निर्भय, पग पंकज की छाहीं ॥ 
    त्रिभुवन वैभव तृनलौं गनिहौं ,शिव अज भाग सराहीं ।
    भोरी हित पद कंज गहे बिनु, जीवन जनम वृथाहीं ॥ 
- verseNumber: "19."
  verseText: |
    हौं हरिवंश के द्वार डरी ।
    काहू के न उठाये उठि हौं, इन सौं मचल परी ॥ 
    कोटि जन्म लगि रगर कृपानिधि, हौं हठ करि जु अरी ।
    बनिहै जो पै बनैहौ तुम ही, बात नतर बिगरी ॥ 
    काहू सों नहिं काज कछू अब, हौं जु भई तुम्हरी ।
    भोरी हित रस प्यासी याचक, विलपत द्वार खरी ॥ 
- verseNumber: "20."
  verseText: |
    श्री राधाबल्लभ लाल

    श्री राधाबल्लभ रंग भरे लाल ।
    कबहूँ मोहि कृपा करि हेरौ , चरण शरण प्रतिपाल ॥ 
    कबहूँ हरौ हृदय कठिनाई, कोमल चित्त कृपाल ।
    ऐसी प्रीति हिये में दीजै, जरहूँ विरह की ज्वाल ॥ 
    त्रिभुवन विदित किशोर- किशोरी , परम उदार दयाल ।
    भोरी हृदय प्रीति हँसि दीजै, विलपत द्वार विहाल ॥ 
- verseNumber: "21."
  verseText: |
    जय जय राधाबल्लभ रसिक रसीले ।
    कोटि मदन-मन-मथन मनोहर ,राका कोटि चन्द्र शरमीले ॥ 
    करुणा धाम किशोर कृपानिधि, रसिक शिरोमणि रंग रँगीले ।
    युगल एक वपु दुगुणित शोभा, कृपा अपार छबीले ॥ 
    हित हरिवंश लाड़िले प्यारे, दीन जनन के दिल दरदीले ।
    भोरी ओर कृपा करि हेरौ , चरण शरण की लाज लजीले ॥ 
- verseNumber: "22."
  verseText: |
    मेघ श्याम मुकुन्द कृपाला ।
    मधुर मधुर आनन्द मूर्ति तुम, छवि निधि रूप रसाला ।
    गाढ़ी प्रीति हिये में दीजै, करुणा सिंधु दयाला ॥ 
    प्रिय पद दरश चटपटी लागै, बाढ़े विरह विशाला ।
    भोरी श्री हरिवंश वचन बल, याचत तोहि गुपाला ॥ 
- verseNumber: "23."
  verseText: |
    कोमल चित मन मोहन , कबहू मेरी सुरति करैहौ ।
    सहज कृपाल दयानिधि प्यारे, जब तब अवसर पैहौ ।
    सहज द्रवन की बान सदा ही, दिल दरदीले कहैहौ ॥ 
    आरत हरण दीन दुखिया की, विनय सुनत चित लैहौ ।
    भोरी बलि-बलि जाइ चरण पै, सोयो भाग जगैहौ ॥ 
- verseNumber: "24."
  verseText: |
    सुन्दर मोहन रसिक रसीले ।
    अखिल लोक चूड़ामणि प्यारे, कोटि कलानिधि बदन छबीले ॥ 
    ब्रह्मा विष्णु शंभु सनकादिक, महिमा रहे बिचार बिचारी ।
    हारे वेद पुराण शास्त्र सब, गुनगन गिनत न पावत पारी ॥ 
    परब्रह्म परमारथ प्यारे, मुरलीधर कृपाल रसदानी ।
    अधम उधारण रसिक शिरोमणि, प्यारी चरण सहज रति मानी ॥   
    शीश किरीट श्रवण मणि कुंडल, पीताम्बर ओढे चटकीलौ ।
    नीलाम्बुद सुन्दर तन प्यारे,चंचल चितवन चारु हँसीलौ ॥ 
    भोरी भाल कु अंक मिटावौ, प्रणत पाल दिल के दरदीले ।
    नव -नव नेह प्रिया पद दीजै, चतुर मुकुट मणि रंग रँगीले ॥ 
- verseNumber: "25."
  verseText: |
    श्री हरिवंश किशोर तिहारे नयन कृपा रस बरसे ।
    जिहि दिस छिन करि कृपा विलोकौ , हृदय प्रेम रस सरसे ॥ 
    कारण रहित कृपा पतितन पै, हिये माधुरी दरसै ।
    कठिन अभाग कौन विधि कहिये , भोरी अब लग तरसै ॥ 
- verseNumber: "26."
  verseText: |
    श्री हरिवंश किशोर लाड़ले तुम सौं भाँवर पारी ।
    तुम्हरे संग कटी सब जग ते सब विधि भई तिहारी ॥ 
    अब तौ काज न कछू काहू सों लोक-लीक सों न्यारी ।
    त्रिभुवन चरण कमल पर वारौं कोटि प्राण बलिहारी ॥ 
    तुम बिनु को मम आस पुजावै कहिहौ काहि पुकारी ।
    जो रुचि होइ करौ करुणानिधि मैं मुख कहौं कहारी ॥ 
    पोच प्राण की भेंट चढ़ावत, लाज लगत अति भारी ।
    दृग भरि रूप माधुरी पीवों माँगत गोद पसारी ॥ 
    नातर गाढ़ी पीर विरह की , मिलन चटपटी भारी ।
    बन -बन देहु भटकिबौ भोरी, टेरत नाम सदारी ॥ 
- verseNumber: "27."
  verseText: |
    हित हरिवंश किशोर लाड़िले , तुम्हरे द्वार अरी ।
    टारे टरत न बरजी मानत, तुम सौं मचल परी ।
    कब की रूप माधुरी प्यासी, टेरत द्वार खरी ॥ 
    लै लै नाम विनय बहु भाखी , भनक न कान परी ।
    अब तौ ठान लई वरु जन्मन, बिनती करहूँ ररी ॥ 
    तुम सों रगर जन्म कोटिन लगि, आस एक तुम्हरी ।
    जो कछु होइ सु होइ कृपानिधि, रहि हों द्वार डरी ॥ 
    तुम पर मोहि फ़कीरिन हौनौ, टेक यही हमरी ।
    भोरी श्री हरिवंश स्वामिनी, कृपा पियूष भरी ॥ 
- verseNumber: "28."
  verseText: |
    कबहूँ मोहि उमगि अपनैहौ ।
    हित हरिवंश किशोर लाडिले कब ढिंग टेर बुलैहौ ।
    सजल पौंछि दृग बाँह पकरि कै मन्द मन्द मुसिकैहौ ॥ 
    पूछत कुशल कृपाल लाडिले हिय को शूल मिटैहौ ।
    रँग भरौ रूप दिखे हौ नित-नित अँखियन माहि समैहौ ॥ 
    दैहौ बास पावँ पंकज में लोचन कोर चितैहौ ।
    भोरी हित अति दीन दुखी की कब बिनती चित लैहौ ॥ 
- verseNumber: "29."
  verseText: |
    व्याकुल मन कबहूँ समझावौ ।
    हित हरिवंश किशोर कृपानिधि, सपने दरस दिखावौ ।
    धीरज देहु अधीर दुखी कौं, सब ही शंक मिटावौ ॥ 
    नातौ सत्य करौ अपने मुख, चरणन सुवस बसावौ ।
    भोरी दीन दुखी याचक की, अब विनती चित लावौ ॥ 
- verseNumber: "30."
  verseText: |
    तुम्हरी बल हिय मेरे रँगीले ।
    मो सम पतित पोच नहिं कोऊ, तुम जैसे न बसीले ।
    मो सम दीन दुखारी को है, तुम सम दिल दरदीले ॥ 
    मो सम निलज न तुम सम प्यारे, निज जन लाज लजीले ।
    भोरी हित शरणागत वत्सल, प्रिय पद रसिक रसीले ॥ 
- verseNumber: "31."
  verseText: |
    श्री हरिवंश किशोर लाड़िले, बिनती कबहूँ विचारौगे ।
    दीन दुखी भुज गहन कृपानिधि , कोमल बाँह पसारौगे ॥ 
    निज मुख सत्य करौगे नातौ, सूल हिय की टारौगे ।
    सब विधि पामर नीच निबल अति , पोच पतित प्रतिपारौगे ॥ 
    उमगत सहज कृपा कौ सागर, लै-लै नाम पुकारौगे ॥ 
    भोरी विलपत द्वार दुखी तन, करुणा कोर निहारौगे ॥ 
    श्री प्रिया वन्दना
- verseNumber: "32."
  verseText: |
    लटकि रहै मन लटकी लट सों ।
    रंग भरौ छिन अनत न जावै, रंग भरे जमुना तट सों ॥ 
    मान करत रोग भरी वधूटी, रंग भरे नागर नट सों ।
    पिय कर जोर निहोरत भोरी, छ्वे-छ्वै चरण मुकट सों ॥ 
- verseNumber: "33."
  verseText: |
    महिमा अमित कही न परै ।
    शिव अज पद रज चाहत जाकी, सो तेरे पावँ परै ।
    एक सबल सर्वोपरि प्यारी, श्रुति नित सुयस ररै ॥ 
    कोटि पतित पल-पल निस्तारत, सब भव ताप हरै ।
    भोरी सठ की सब बनि आवै, जो छिन चित्त धरै ॥ 
- verseNumber: "34."
  verseText: |
    जयति नव नागरी , रूप छवि आगरी ।
    कृपा चितवन भरी, नेह जल निधि हिलौरे ॥ 
    जयति करुणा भरी, सहज सोभा भरी ।
    मन्द मुसिकान में श्याम कौ चित्त चोरै ॥ 
    जयति चन्द्राननी, सुधा- धारा धनी ।
    माधुरी नित नई बरसि तिहूँ लोक बोरै ॥ 
    जयति जग वन्दनी, हास मृदु चंदनी ।
    जीति आधीन किये, श्याम नैना चकोरै ॥ 
    जयति हित स्वामिनी, श्याम घन दामिनी ।
    भोरी द्वारे खरी, याचती नैन कोरै ॥ 
- verseNumber: "35."
  verseText: |
    बिंधे विलोचन चोर किशोरी,
    मोहन चन्द्र चकोर किशोरी ।
    बरबस विवस किये मन मोहन,
    नेक निरखि मुख मोरि किसोरी ।
    त्रिभुवन मोहन मन अलि राखे,
    कनक कमल कुच कोर किशोरी ।
    पिय दृग चपल जुगल खग खंजन,
    बांधे अलकन डोर किशोरी ।
    जय-जय नवल नागरी राधा,
    बरसत प्रेम अथोर किशोरी ।
    लाज लगत निज ओर निहारे,
    कस देखहूँ तब ओर किशोरी ।
    देखहु मन की उमंगे मेरी,
    कैसी बढ़त बर जोर किशोरी ।
    इतनी विनय मानिये मेरी 
    श्री हरिवंश किशोर किशोरी । 
    तोहि तजि मैं निज ओर न देखों,
    तुम तौ लखौ मम ओर किशोरी ।
    मो हिय तप्त कीजिये सीतल,
    नेक सींच दृग कोर किशोरी ।
    मन कुरंग बन विषय भुलानौ,
    दीजिय तेहि रंग बोर किशोरी ।
    मन मेरो बाँधि राखिये लट सों,
    विषय डोर सों छोर किशोरी ।
    जानी दृग कृपाल उमड़ेंगे,
    बाढ़त कृपा हिलोर किशोरी ।
    हा कृपालु कब प्रगट दिखैहो 
    मुख मृदु मूसिकन थोर किशोरी । 
    भरि दृग देखि वारि कब डारीं,
    कोटि प्राण तृण तोरि किशोरी ।
    ढरिहौ बान आपनी कबहूँ,
    करिहौ भावती मोर किशोरी ।
    तेरे चरण कमल सों लागी,
    हौंसें भोरी करोर किशोरी ।
- verseNumber: "36."
  verseText: |
    प्रिया स्वभाव

    नवल वयस योवन मतवारी ।
    व्रज नव तरुणि कदंव नागरी, कृपा सिंधु सुकुमारी ।
    रूप रुचिर अङ्ग-अङ्ग  माधुरी, कोक कलानिधि प्यारी ॥ 
    छिन छिन कुशल सुधंग अङ्ग में, पोच पतित अधिकारी ।
    मत्त करिनि गति ढरत किशोरी, अङ्ग-अङ्ग  छवि न्यारी ॥ 
    काहू भलै जानि नहिं पाई, श्रीहित कृपा बिना री ।
    भोरी हित जन्मन की याचक, ललकत गोद पसारी ॥ 
- verseNumber: "37."
  verseText: |
    पतित पावनी प्यारी हमारी ।
    जब सुभाव हिय समझत तेरी, हर्ष होत अति भारी ॥ 
    पतित शिरोमणि मैं अघ खानी, तजत सुभाव न जैसे ।
    त्रिभुवन विदित कृपालु स्वामिनी , आपुन तजिय कि तैसे ॥ 
    हौं चलि  हौं हठ पंथ नरक की, बरबस आइ बचैहौ ।
    करि हौं पातक पुंज कोटि विधि, सकल मेटि मुसिकैहौ ॥ 
    विषय पंक मोहि मग्न देखि कै, लैहौ दौरि उबारी ।
    सहज कृपालु बान पर भोरी, बार बार बलिहारी ॥ 
- verseNumber: "38."
  verseText: |
    सर्वोपरि म्हारी महारानी ।
    जीत लियौ घनश्याम लाडलौ,स्ववस एक रस दानी ॥ 
    ललितादिक संग सखी सहचरी, वृन्दावन रज धानी ।
    ब्रह्मा विष्णु शंभु सनकादिक , महिमा नैकु न जानी ॥ 
    वेद पुराण सबै पचि हारे, श्री हरिवंश बखानी ।
    भोरी ओर कृपा करि हेरौ , अलबेली ठकुरानी ॥ 
- verseNumber: "39."
  verseText: |
    दिल दरदीली भानु दुलारी ।
    कोमल चित्त सहज करुणानिधि , पोच निबाहन हारी ॥ 
    जब जब सुमिरत मृदुल सुभाऊ, हर्ष होत हिय भारी ।
    कहा भयौ तजि शास्त्र वेद पथ, लोक रीति हठ टारी ॥ 
    कहा भयौ जो सन्त जनन की, आयसु सीस न धारी ।
    कहा भयौ नहिं भजन कियो जो, खोई आयु वृथा री ॥ 
    कहा भयौ जम नरक द्वार पै, देखत बाट हमारी ।
    कौन की शंक परी जो सिर पर, समरथ राखन हारी ॥ 
    गरव गहेली अति अलबेलौ, अखिल लोक -पति प्यारी ।
    भोरी तो बल गिनत न काहू, सोवत पावँ पसारी ॥ 
- verseNumber: "40."
  verseText: |
    तेरी नेह निबाह की बान सुहाई ।
    छलिया ढीठ महारस लंपट, कपटी चोर कन्हाई ॥ 
    तासों प्रीति की रीति निबाहत, नित नव नेह सदाई ।
    यही कृपा के भरोसे भोरी, चरण शरण चलि आई ॥ 
    युक्ति वचन सों विनती ठानी, ऊँचे टेर सुनाई ।
    सो सुनि चितै लाल के मुख तन, श्यामा मृदु मुसिकाई ॥ 
- verseNumber: "41."
  verseText: |
    करुणाधाम कृपालु किशोरी ।
    अधम उधारण पतित पावनी, कोमल चित नव गोरी ॥ 
    आरत हरण दयालु दयानिधि , दृष्टि कृपा रस बोरी ।
    सहज कृपालु दोष भय भंजन, बेगि लखौ दृग कोरी ॥ 
    शरणागत प्रति पाल लाड़िली, सदा सुखद सबको री ।
    भोरी भाग्य हीन पर तौहू, नहीं निठुरता थोरी ॥ 
- verseNumber: "42."
  verseText: |
    कोमल चित्त लाड़िली प्यारी ।
    कपटी कुटिल सबै अपनावत, सहजहि भुजा पसारी ॥ 
    गनत न अवगुण कोटि दयानिधि, कृपा सिंधु सुकुमारी ।
    पातक पुंज कोटि जन्मन के, मेटत नेक निहारी ॥ 
    सहज कृपा की बान सुहाई, सबकौ सुखद सदारी ।
    प्रीति रीति जानत दरदीली , अधम निबाहन हारी ॥ 
    तेहि दै पीठ विषय में दीन्हे, तकत धाम धन नारी ।
    भोरी सठ उपजाइ जननि जड़, लाजन मरत बिचारी ॥ 
- verseNumber: "43."
  verseText: |
    जानत प्रीति की रीति किशोरी ।
    कोमल चित कृपालु करुणा निधि , सदय हृदय ब्रज गोरी ॥ 
    ताकौ त्यागि विषय मन दीन्हौ, जीवन यों ही गयौ री ।
    कोटिक भाँति कुकर्म कमाये, छिन नहिं नाम जपयौ री ॥ 
    भोरी धृग-धृग वृथा मातु कौ, तव तारुण्य हर्यौ री ।
- verseNumber: "44."
  verseText: |
    रूप भरी रँग भरी रँगीली ।
    रसभरी गुणभरी भरी दया सौं, सुखभरी छविसौं भरी छबीली ॥  
    भरी भाग अनुराग सुहागिन, लाज सँकोच भरी सरमीली । 
    करुणा मृदुता भरी कृपा सौं, कोमलता सौं भरी रसीली ॥ 
    गरव भरी वात्सल्य भरी री, नेह भरी जन दिल दरदीली ।
    भोरी आरत टेर पुकारत, चरण शरण की लाज लजीली ॥ 
- verseNumber: "45."
  verseText: |
    कब मेरी सुधि करि हौ वृषभानु लड़ैती राधा ।
    कोमल चित्त किशोरी प्यारी, करुणा सिंधु अगाधा ॥ 
    अधम उधारणि पतित पावनी, हरन सकल भव बाधा ।
    धर्म कर्म तजि कोटि पाप किय, साधन कछू न साधा ॥ 
    टेर सुनत ऐसेहु पतितन की, विरमत नहिं पल आधा ।
    भोरी अब सब भाँति भरोसौ, चरण कमल सौं बांधा ॥ 
- verseNumber: "46."
  verseText: |
    कोमल चित्त स्वामिनी प्यारी ।
    कोमल चित्त सहचरी आली , जे सँग रहत सदारी ॥ 
    कोमल चित्त कृपालु लाड़िलौ, मोहन गिरवर धारी ।
    कोमल चित्त श्री कीरति रानी, श्री वृषभान बबा री ॥ 
    श्री हरिवंश सबहिं में कोमल, जस गावत श्रुति चारी ।
    कोमल चित सब सिखवन हारे, कोमल चित सुकुंवारी ॥ 
    तौहू इती निठुरता मोपै, यह इक अचरज भारी ।
    कठिन अभाग्य मिटत नहिं भोरी, टेर-टेर कै हारी ॥ 
- verseNumber: "47."
  verseText: |
    कृपा सिंधु दृग लेत हिलोर ।
    ऐसी कृपा करहु नित यह तनु, जरै विरह सौं मोर ॥ 
    विरह विकल जब प्राण चलैं हठ, तन सौ नातौ तोर ।
    सहज कृपालु उमगि चलि आवौ,बरषत कृपा अथोर ॥ 
    सब तन ताप हरहु हँसि राखौ, सुधा माधुरी बोर ।
    मुख मयंक मृदु हास चाँदनी, मम दृग करहु चकोर ॥ 
    प्रेम मगन अटकी वा छबि पै, लखौ न काहू ओर ।
    भोरी दीन द्वार पै ठाड़ी, याचत लोचन कोर ॥ 
- verseNumber: "48."
  verseText: |
    प्यारी मैं तो तिहारी दासी,
    तरसत अजहूँ दरस की प्यासी ।
    बार-बार लोचन अकुलावैं,
    मन अधीर नहिं धीरज आवै ।
    अब तौ देहु कृपालु किशोरी,
    सहज कृपा कर कुंज खवासी ।
    निशि दिन बदन सरोज निहारौं,
    सहज रूप पर तन मन वारौं ।
    सपनेहूँ और न देखहुँ कोऊ,
    चरण सरोज अनन्य उपासी ।
    नैन दरस सुख निशि दिन लूटै,
    सहज प्रीति कौ तार न टूटे ।
    कौन की संक कीजिये भोरी,
    सिर पर अलबेली राधा सी ।
- verseNumber: "49."
  verseText: |
    सकुचत कहत कहावत दासी ।
    कहूँ मैं अधम नीच अति पामर, कह तुम नवल निकुंज निवासी ॥ 
    निज कारण देखौं जग माहीं, नित सब करत रावरी हाँसी ।
    याही सोच जरत निज छाती, व्यापी रहत हृदय चिन्ता सी ॥ 
    भूषण भार असन विष लागत, सुखद सेज जनु जरत चिता सी ।
    भोरी दुख सब हरहु कृपानिधि, करि पद कंज अनन्य उपासी ॥ 
- verseNumber: "50."
  verseText: |
    श्री प्रिया-चरण कमल

    सजल जलज सुन्दर प्यारी पद नीके,
    साधन और लगत अति फ़ीके ।
    सीतल मकरंद भरे सुख रस भीने,
    श्याम मधुप जिन रस बस कीन्‍हे ।
    सुन्दर श्याम प्यारी दावानल पीकै,
    जियत आसरे मनु इनहीं के ।
    प्रेम विवस निसि दिन इनहि हिय लावै,
    नाग राज विष ताप मिटावै ।
    चूमि-चूमि इनकौं इनके रस पाग्यौ,
    तुरत पूतना विष सब भाग्यौ ।
    जब घुमड़ि मैन सैन बाँकी आवै,
    तब मोहन शरण यहाँ पावै ।
    सुर तरु पतितन के अधमन उद्धारण,
    मो अभाग्य मिटबे के कारण ।
    सरबस श्री हरि के दाता सब केरे,
    आशा धन जीवन गति मेरे ।
    इतनौ नित टेर-टेर माँगै भोरी,
    राखिये मोहि चरण रस बोरी ।
- verseNumber: "51."
  verseText: |
    कौन भाग्य पद पंकज पावौं ।
    सजल जलज मृदु सुन्दर शीतल, उर धरि ताप बुझावौं ॥ 
    मृदु सहराय लाय हिय राखौं, हुलरावौं दुलरावौं ।
    दृग चकोर नख चंद महा छबि, माधुरी पान करावौं ॥ 
    दृग भरि-भरि अवलोकत निशिदिन, देह गेह बिसरावौं ।
    छोड़ौं बहुरि न कबहूँ भोरी, दृढ़ गहि हृदय बसावौं ॥ 
- verseNumber: "52."
  verseText: |
    बड़े भाग्य पग पंकज पेखौं ।
    मुक्ति भुक्ति सुख-दुख सम लागैं, आपनि और न देखौं ॥ 
    डोलत मस्त दिवानी बन -बन, डगर-बगर नहिं पेखौं ।
    तन मन पल-पल वारौं भोरी, नित नव जोवन लेखौं ॥ 
- verseNumber: "53."
  verseText: |
    जीवन सफल कमल पग पेखे ।
    कौन काज श्रुति मारग संजम, साधन बहुत परेखे ॥ 
    संपति भोग मुक्ति स्वर्गादिक, करि विचार सब देखे ।
    भोरी बिनु पद कंज छटा के, सपनेहु सुखद न लेखे ॥ 
- verseNumber: "54."
  verseText: |
    चरण कमल पर तन मन वारौं ।
    कोटि कलप लगि छिन न बिसारौं, जो भरि नयन निहारौं ॥ 
    दृढ़ लै हिये बसावौं निसि दिन, मन की उमंग निकारौं ।
    भोरी छिन इक दरसन आसा, कोटि प्राण तजि डारौं ॥ 
- verseNumber: "55."
  verseText: |
    अधम उधारण पद रज प्यारी ।
    त्यों पद कंज, चंद नख तैसे, त्यौ नख चन्द छटा री ॥ 
    मृदु मुसिकान मनोहर चितवन, अङ्ग-अङ्ग  द्युति न्यारी ।
    कोटि पतित पल पार लगावत, राधा नाम सदारी ॥ 
    जेते पतित उधारन सिर पर, गिनत गिनत हठ हारी ।
    भोरी जो अब भव निधि डूबे, तौ इक अचरज भारी ॥ 
- verseNumber: "56."
  verseText: |
    सो पद कमल छटा मन भावै ।
    जेहि पद कंज महावर दैवे, मोहन नित ललचावै ॥ 
    जेहि पद कंज हिये धर गोपी, रसिक प्राण पति पाये ।
    जे पद कोमल कमल मनोहर, रहत रसिक चितलाये ॥ 
    जे पद मोहन प्राण जीवन धन,चांपत नित हिय लाई ।
    जे पद धरि -धरि मुकट लाड़िले, मानिनि मान मनाई ॥ 
    जिन पद रज ब्रह्मादिक जांचत, बड़े भाग जो पावैं ।
    जिन पद नख की विमल चाँदनी, हिय कौ तिमिर नसावैं ।
    जे पद कमल रास में प्यारौ, नव-नव गति प्रगटावैं ।
    जिन पद लोभ रसिक जग-सम्पति, श्रुति पथ चित्त न लावैं ॥ 
    जे पद पंकज हिये धरि प्यारी,मनमथ ताप निवारें ।
    सेवत नित हरिवंश चरण जे, सुभग सिंगार सिंगारें ॥ 
    ते पद नूपुर-कलरव संयुक्त, जीवन धन नित मेरे ।
    भोरी जो छिन एक दिखावों, वारीं प्रान घनेरे ॥ 
- verseNumber: "57."
  verseText: |
    कोटिक प्राण चरण पर वारौं ।
    कैसे हैं सो चरण लाड़िली, सपने नेक निहारौं ।
    त्रिभुवन सोभा धाम लाड़िले, जेहि नित हिये लगावैं ।
    कैसे सीतल सजल जलज सो, तेरे चरण सुहावैं ॥ 
    श्रीहरिवंश स्व सरबस भाख्यौ, अधिक प्राण ते प्यारे ।
    पिय दृग अटक रहे जँह प्यारी, सो शुभ चरण तिहारे ॥ 
    शिव श्रीहरि अज पद रज चाही, गोपिन सिर पर धारे ।
    कैसे सरस चरण सो प्यारी,नित रस बरसत हारे ॥ 
    श्रवनन सुनत लगत अति प्यारे देखन दृग ललचावै ।
    भोरी कृपा करहु अलबेली, बार-बार बलि जावै ॥
- verseNumber: "58."
  verseText: |
    श्री प्रिया कर कमल

    तेहि कर छाँह राखिवै प्यारी ।
    जेहि कर पिय कर पेलहु मानिनि, मान भरी सुकुमारी ॥ 
    जेहि कर लिये रंग पिचकारी, रँग भरी खेलत होरी ।
    जेहि कर कमल लाल की प्यारी, हँसत मुरलिया चोरी ॥ 
    गिरत नागरी दास जौन कर, रोक लिये रँग भीने ।
    जेहि कर, कर गहि रस बस मोहन खेंचि भुजा भर लीन्हे ॥ 
    जेहि कर कमल कृपा कर बाँधत, पिय सिर मुकुट संभारी ।
    जेहि कर कंज धरत अंसन पै, पुलकत कुञ्ज बिहारी ॥ 
    जेहि कर कमल करत जल केली, जल कन अधिक उड़ावै ।
    जेहि कर कमल फेरि करुणानिधि, निज गुन शुकन पढ़ावै ॥ 
    जेहि कर बैठि जुगल कुच पिय कौं, रस बस चित्र बनावैं ।
    तेहि कर मोहि कृपालु किशोरी, बांह पकरि अपनावैं ॥ 
    बार-बार हठ बिनती ठानों , विलग भये दुख पावों ।
    भोरी बेगि कृपा अब कीजै, चरण कमल बलि जावों ॥ 
- verseNumber: "59."
  verseText: |
    जलज -दाम सुन्दर भुज प्यारी ।
    जिहि भुज बाँधि जीति बस कीन्हें, मोहन गिरवर धारी ॥ 
    सकल लोक चूड़ामणि प्यारौ, सो भयौ आज्ञाकारी ।
    सहज प्रीति की डोर बंध्यौ नित, डोलत रहत पिछारी ॥ 
    सो ऐसी भुज परम मनोहर, केहि विधि देखिय प्यारी ।
    याही सोच जरत निज छाती, दृग ललचात सदारी ॥ 
    ऐसौ भाग्य कौन दिन जागै, रहत बिचार बिचारी ।
    भोरी प्यारी कुञज्जन डोलै, भुजा कण्ठ सोई डारी ॥ 
- verseNumber: "60."
  verseText: |
    सुधि करत कमल कर पोरन की ।
    वीणा कर लै ग्रीव ढुरेबौ ,भरि-भरि तान झकोरन की ।
    भौह विलास तिरिछी चितवन, हँसि- हँसि पिय चित चोरन की ॥ 
    आनन्द कन्द मन्द मुख हाँसी, पिय मुख चन्द चकोरन की ।
    तन मन अति अकुलात किशोरी , भोरी बलि दृग कोरन की ॥ 
- verseNumber: "61."
  verseText: |
    रंग भरे कोमल अँगुरिन पोरैं ।
    जो गड़ि रहे श्याम हियरा में, रस बस लेत हिलोरैं ।
    नख उजियार कौंध दृग चौन्धत, दीप लियें चित चोरैं ॥ 
    परम निशंक करत मन भायौ, निगम श्रृंखला तोरैं ।
    शिव अज मति परसत हू नाहीं, छबि बरनैं कवि कोरैं ॥ 
    देखें एक श्याम नैना भरि , सो देखत भये बौरैं ।
    काहू भाँति भेद नहिं पायौ, अमित जतन करि छोरैं ॥  
    सुधि बुधिसकल चतुरई हारे, नव मधु छके झकोरैं ।
    चजञ्चल मधुर अरुण अति कोमल , मनीौ प्रेम रँग बोरैं ॥ 
    हां अति पतित तदपि करुणानिधि , इनकी आसा मोरैं ।
    भोरी हित कब तलक विलोकौं, टेरत अपनी ओरैं ।
- verseNumber: "62."
  verseText: |
    श्री प्रिया मुख-कमल

    प्यारी तेरौ मुख चन्द नयोरी ।
    कैसौ सो शशि जाहि देखि कै, हरि दृग भये चकोरी ॥ 
    तीन लोक इक मदन किये बस, सहज चाप टंकोरी ।
    कोटि मदन दल दलन मनोहर, सो यह जीत लयौरी ॥ 
    ललकत दृग छिन दरसन आसा, करुणा धाम किशोरी ।
    एक झलक हँसे नेंक दिखावौ, बार-बार बलि भोरी ॥ 
- verseNumber: "63."
  verseText: |
    हँसि-हँसि मोहि किन घायल कीजै ।
    जोपै इतनी कृपा कृपानिधि, तौ यह मांगे दीजै ।
    छिन इक भरि-भरि लोचन प्यारी रूप माधुरी पीजै ॥ 
    पुनि निशिवासर विरह ताप सौं , यह तनु पल-पल छीजै ।
    भोरी सहज कृपाल किशोरी, अब बिलम्ब नहिं कीजै ॥ 
- verseNumber: "64."
  verseText: |
    तुमने आज लों बात न पूछी, को द्वारे चिल्‍लात न पूछी ।
    जीवन बीत्यौ गोद पसारे, कहा लोभ ललचात न पूछी ॥ 
    मैं नित हौंस मरी कहिवे की, हँसि कबहू कुसलात न पूछी ।
    कोटि उपाय किये पै तुमने, का सोचत दिन रात न पूछी ॥ 
    दृग-सर घाव फूलि कै सहिवे, कस हियरा अकुलात न पूछी ।
    नित प्रति कुटिल अलक में फँसिवे, कस लोचन ललचात न पूछी ॥ 
    कैसे कटत दिवस-निशि तेरे, का दुख सूखत गात न पूछी ।
    भोरी दीन दुखी आरत सौं, बिहँसि हृदय की बात न पूछी ॥ 
- verseNumber: "65."
  verseText: |
    अधर मधुर राजत मुसिकान ।
    कुञ्ज भवन बैठी अलबेली, कुल दीपक वृषभान ।
    रंग भरे नयन, रंग भरयौ आनन, रँग भीजी बतरान ॥ 
    रँग भरे श्याम चन्द्र मुख हेरत, करत सुधारस पान ।
    भोरी याचक विलपत द्वारे, हा-हा कृपा निधान ॥ 
- verseNumber: "66."
  verseText: |
    ठग मुसिकान चोर चित केरी ।
    लूट लेत हित सरबस बरबस , ऐसे चोर सुनेरी ॥ 
    दन्त कौमुदी जग विस्तारत, चाँदनी चारु घनेरी ।
    तेहि प्रकाश तम हरन हरत मन, ढीठ निसंक बड़ेरी ॥ 
    तिहँ पुर बान विदित यह इनकी, मैं नित लटकत टेरी ।
    भोरी हित चित चोरत क्‍यों ना, दीन दुखी की बेरी ॥ 
- verseNumber: "67."
  verseText: |
    सुन्दर बदन मन्द मृदु हँसिबौ ।
    छिन इक भरि दृग देखन दीजै, हिल-मिल सुधा बरसिबौ ॥ 
    श्याम गौर भुज केलि परस्पर, नयन-नयन में फँसिबौ ।
    भोरी हित छिन देखन ललकत , भुज भरि हिये हुलसिबौ ॥ 
- verseNumber: "68."
  verseText: |
    श्री प्रिया नयन-कमल

    नयनन सो नित देखिबौ कीजै ।
    कर सौं चरण सरोरुह चाँपत, श्रवन माधुरी पीजै ।
    नयन पुतरि लौं चखन बसैये, लाय-लाय हिय लीजै ।
    असन बसन सुधि-बुधि परिहरिये, देखि -देखि कै जीजै ।
    भोरी विमल युगल छवि ऊपर, बारि-बारि जल पीजै ।
- verseNumber: "69."
  verseText: |
    नैनन कोटि मनोज बसाये ।
    ना मानहु मोहन सों बूझहू, जिन्हें जीत कै आये ।
    चंचल भौंह भाल पर राखीं, करत सदा मन भाये ।
    ठग मुसिकान ओंठ पर राजत, मन हर लेत पराये ।
    औरहु मुख का कहौं किशोरी, अंग-अंग चोर सुहाये ।
    चंचल चपल चोर मन मेरौ, रुकत न कोटि उपाये ।
    भोरी घटत कहा करुणानिधि, एक याहि अपनाये ।
- verseNumber: "70."
  verseText: |
    सुधि करत कमल दल लोचन की ।
    लाज छकी महि ओर विलोकन, नई-नई भेंट सकोचन की ॥ 
    रूप छकी छकी द्वार रहन की, कर गहि ढिंग लैजैबे की ।
    कुसुम सेज पै नवल लाल ढिंग, हठ कर लाइ बिठेबे की ।
    कहि-कहि मृदु बतियाँ रस भींजी, अधिक प्रेम सरसैवे की ।
    रस सौं रसिक रसीली स्वामिनि, हँसि-हँसि तोहि हँसैवे की ॥ 
    कुज्जरंध्र तोहि देखन हू की, नूपुर धुनि सचु पैवे की ।
    कहँ लौं कहौं किशोरी प्यारी, मुख सों कछू न कहिवे की ॥ 
    तरसत दरस लालची लोचन, हौंस बढ़त कहूँ पैवे की ।
    प्रगट कृपालु करहु किन बातें, भोरी आस पुजैवे की ॥ 
- verseNumber: "71."
  verseText: |
    वा चितवन पर तन मन दीजै ।
    बरसत सहज कृपा रस धारा, भृकुटि कुटिल नयन रस भीजै ॥ 
    तोरि-तोरि तृन त्रिभुवन बारिय, पी-पी रूप माधुरी जीजै ।
    भोरी कौन भाग्य सौं प्यारी, रँग भरी नयन कोर तेरी लीजै ॥ 
- verseNumber: "72."
  verseText: |
    सो दृग कब गड़ि हैं उर मेरे ।
    जिनकी कोर ललित लीला सौं , उपजत छिन-छिन मदन घनेरे ॥ 
    जिनके हाथ बिकाने मोहन, परम प्रवीन भये तेरे चेरे ।
    जे नित अधमन पै रस बरसत, सहज कृपा रस सौं उमड़ेरे ॥ 
    जे नित सोयौ भाग जगावत, भाल कु अंक मिटत जिन हेरे ।
    भोरी कौ यह भाग्य कृपानिधि, फिर है एक इन्हीं के फेरे ॥ 
- verseNumber: "73."
  verseText: |
    जय-जय राधा दृग की कोरैं ।
    खञ्जन कंजन मीन मृग जिन पै बारौं कोटि चकोरैं ॥ 
    बरसत सहज माधुरी धारा, त्रिभुवन रस में बोरैं ।
    बंक विलोकन चंचल मानहूँ, करुणा सिंधु हिलोरैं ॥ 
    इनको ही अवलम्ब किशोरी, एक सदा हिय मोरैं ।
    भोरी प्रीति-रीति सौं रीती, विनय करत कर जोरैं ॥ 
- verseNumber: "74."
  verseText: |
    जय-जय राधा नयन सुरंग ।
    जिनके चपल दृगचंल ही सौं, उपजत कोटि अनंग ॥ 
    जिनकी बंक विलोकन मानों, उमड़त प्रेम तरंग ॥ 
    निज जन हृदय सिंधु उमगावत, नित नव नेह उमंग ।
    भोरी कौं इक आस रावरी, दीजै प्रेम अभंग ॥ 
- verseNumber: "75."
  verseText: |
    अशरण शरण प्रिया दृग तेरे ।
    मदन मथन मोहन भय भागै, कोटिन-कोटि मनोज बसेरे ॥ 
    नील कमल सर वर्षत मानों, सहज बंक अवलोकन प्रेरे ।
    जीत लिये श्री मधुरिपु मोहन, रस बश किये आपने चेरे ॥ 
    मोकौं एक आसरौ इनकौ, यह तौ कृपा सिंधु उमड़ेरे ।
    कहा कहौं किन दोषन भोरी, अजहूँ मो तन नैक न हेरे ॥ 
- verseNumber: "76."
  verseText: |
    करुणा भरे प्रिया दृग तोरैं ।
    सहज कृपा की उठत तरंगे, त्रिभुवन रस में बोरैं ॥ 
    उमड़त कृपा सिन्धु परि पूरण, दिस-दिस लेत हिलोरैं ।
    भोरी परम अभागी तौहू, इनकौ आसरी मोरैं ॥ 
- verseNumber: "77."
  verseText: |
    कहाँ छुपाये प्यारी लोचन चपल शिकारी हो ।
    जेहि देखत हिय बेधत ताकौ, सब जग कहत पुकारी हो ।
    अखिल लोक चूड़ामणि मोहन, चपल चतुर गिरधारी हो ॥ 
    बरबस पकरि जकरि छबि राख्यौ, डोलत नित जु पिछारी हो ।
    चंचल चित्त कुरंग हमारौ, हों तासौं अति हारी हो ।
    गगन-पताल गिनत नहिं कछुवै, डोलत विषय मंझारी हो ।
    जो तेहि वेधि बाँधि कै राखौ, कर निज आज्ञाकारी हो ॥ 
    सब विधि सबल नवल अलबेली, मानौं जीत तिहारी हो ।
    भोरी आस इनहिं अँखियन सों, चितवन पर बलिहारी हो ॥ 
- verseNumber: "78."
  verseText: |
    जो अलि होत प्रिया दृग मेरे ।
    तौ उड़ि क्‍यों न करत करुणानिधि , पंकज पाँव बसेरे ॥ 
    मुदित मत्त नित छके एक रस, गिनत न साँझ सबेरे ।
    लव निमेष छिन होत विलग ना, छवि ही मनों पगेरे ॥ 
    लौट न मोहि देखते कबहूँ, मुसिकन फंद परे रे ।
    हा प्यारी कछु बन न परी तब, हठ थकी हार रहे रे ॥ 
    उड़न चह्यो उड़िबौ नहिं आयौ, तरसत विकल भये रे ।
    का अब कही कृपालु लाडिले, सालत अधिक हियेरे ॥ 
    ता पर और निलजता ऐसी, अजहूँ विषय के चेरे ।
    भोरी हित फूटत तक नाहीं, वादि कहावत मेरे ॥ 

- verseNumber: "79."
  verseText: |
    ललकत नयन-नयन में फँसिवे ।
    वा छवि छके मुदित मतवारे, पी-पी सुधा हुलसिवे ॥ 
    हिय अकुलात धीर नहिं आवत, पंकज पांव परसिवे । 
    राखे प्राण वारिवे तुम पै, ते अब चहत निकसिवे ॥ 
    रंग बरसात रँगीली आवौ, कबहूँ हियरे धसिवे ।
    भोरी पोच पतित ललकत है, हित बल कुंजन बसिवे ॥ 
- verseNumber: "80."
  verseText: |
    खंजन खग दृग चपल तिहारे ।
    छिन ठहरात समात नहीं कहूँ, कमल श्रेणि सित बरसन हारे ॥ 
    उलट-पलट चहूँ चलत दृगंजल, बंक निशंक अरुण अनियारे ।
    करुणा कोर बोरिहै सहजहि , विलपत दुखी देखि निज द्वारे ॥ 
    हौं तजि शंक आजहू सोबत, यही आस निज जीवन हारे ।
    भोरी हित उमड़त रस सागर, हरत दोष दारुण दुख भारे ॥ 
- verseNumber: "81."
  verseText: |
    सुरतान्त
    ॥ छन्द चारी ॥ 

    नव छवि भोर निहारों, तन मन जीवन वारों ।
    तन मन जीवन वारों जब ही, आलस बस अंगरावौ ॥ 
    झुक-झुक परत परस्पर अंसन, मंद-मंद मुसिकाबौ ।
    लटकि-लटकि पग चलन मनोहर, देखि-देखि मन हारौं ॥ 
    कबहूं भाग जगावहु ऐसौ, नव छवि भोर निहारौं ।
- verseNumber: "82."
  verseText: |
    पलटे विमल दुकूले । देखि-देखि मन भूले ॥ 
    देखि-देखि मन भूलै प्यारी, अटपट बचन उचारौ ।
    शिथिलित गिरा देह गति शिथिलित, डगमग मग पग धारौ ॥ 
    निशि जागर लोचन मद माते, अरुण कमल से फूले ।
    प्रात समय कुंजन सों आवत, पलटे विमल दुकूले ॥ 
- verseNumber: "83."
  verseText: |
    अलक कपोलन छाई, जनु अलि रहे भुलाई ।
    जनु अलि रहे भुलाई आनन, पंकज के रस भीने ॥ 
    बिनु गुन हार कुसुम झर लागी, गंड ललाई लीने ।
    देखि चिन्ह रजनी के सजनी, नैनन में मुसिकाई ॥ 
    कुच रस-कलसन मृग मद छुट्यौ, अलक कपोलन छाईं ।
- verseNumber: "84."
  verseText: |
    मदन मनोहर वेषा, विथुरित सुन्दर केशा ।
    विथुरित सुन्दर केशा स्वामिनी, नख छत हृदय सुहाये ॥ 
    अधरन रंग दृगन कों दीनौ, अंजन पलटे पाये ।
    माँग गिरा जमुना कच डूबी, भाल तिलक रुचि लेशा ॥ 
    कौन भाग नित प्रात निहारों, मदन मनोहर वेषा ।
- verseNumber: "85."
  verseText: |
    जय-जय नवल नागरी राधा ।
    प्रात समय जागी रस माती, सखियन कौ सुख साधा ।
    लाल-लाल लोचन के कोये, बरसत प्रेम अगाधा ।
    शिथिलित गात अलक लट छूटी, तिलक भाल पर आधा ।
    भोरी सहज कृपालु कृपा करि, हरहु सकल भव-बाधा ॥ 
- verseNumber: "86."
  verseText: |
    नित नव दरस भोर कब पैहौं ।
    शिथिल गात नव कुंज भवन सों, भोर उनीदी ऐहौं ॥ 
    छाके नयन देह सब थाकी, बुधि बल सुरत दुरैहौं ।
    हँसि-हँसि झुक-झुक परत किशोरी, झुकि-झुकि हँसि-हँसि जैहौं ॥  
    विलुलित शिथिल लसे लट छूटी, कच सों कुसुम गिरेहौं ।
    भोरी नित नव दरशन पाऊँ, कब मेरी आस पुजैहौं ॥ 
- verseNumber: "87."
  verseText: |
    रंग भरी टहल कौन विधि पावौं ।
    प्रात भये नव कुंज भवन में, सोबत जाइ जगावौं ।
    विथुरे कच शिर सुभग बनाऊँ, काजर दृगन लगावौं ।
    टूटे हार कंठ पहिरावौं, माथे तिलक बनावौं ।
    बहुरि मांग भरि सैंदुर रेखा, भूषन वसन सजावौं ॥ 
    ओठन रँग कुच चन्दन चर्चित, रति के चिन्ह दुरावौं ।
    भोरी रँग भरी नवल किशोरी, देखि-देखि बलि जावौं ॥ 
- verseNumber: "88."
  verseText: |
    कैसे रहस-दास्य हौं पावौं ।
    भोर उनींदी उठौ किशोरी, देखत नैन सिरावौं ॥ 
    निशि जागर आलस तनु छायौ,मज्जन बेगि करावौं ॥ 
    सजि तन नील बसन आभूषण, मधु मेवा लै आवौं ।
    किसलय शयन संभारि किशोरी , हँसि-हँसि लै पौढावौं ॥ 
    भाग्य भरी हौ बैठि पायँते, मृदु तरुवा सहरावौं ।
    भोरी सोवत नवल नागरी, देखि- देखि बलि जावौं ।
- verseNumber: "89."
  verseText: |
    सोच-सोच पुनि-पुनि अकुलावौं ।
    भोरहिं कौन भाग्य सौं प्यारी, रंग भरे कुञ्जन आवौं ॥ 
    अंग राग अंगन सौं छूटे , लै निज अंग लगावौं ।
    टूटे परे हार मालावलि , निज तनु सुभग बनावौं ॥ 
    तुम कौं उबट न्हवाय किशोरी, नव श्रृंगार सजावौं ।
    भूषण बसन प्रसादी माला, बड़े भाग्य सौं पावौं ॥ 
    कीजै कृपा कृपालु किशोरी, चरण कमल बलि जावौं ।
    भोरी यह सुख सोचि-सोचि के, बार-बार ललचावौं ॥ 

- verseNumber: "90."
  verseText: |
    रंग भरे दरसन नित-नित दीजै ।
    लटकत आवें भोर कुंज सों, बचन कहत रस भीजै ।
    आलस भरे नैन लट छूटी, देखि-देखि छबि जीजै ॥ 
    हँस-हँस कहत अटपटी बतियाँ, श्रवण माधुरी पीजै ।
    भोरी मन या सुख पै भूल्यौ, कहा मुक्ति लै कीजै ॥ 

- verseNumber: "91."
  verseText: |
    स्फुट लीला

    ऐसी लीला की सुधि आवै, मन मेरौ बार-बार अकुलावै ।
    लिये आरसी निज छबि देखत, प्यारी मृदु मुसिकावै ॥ 
    ताही छिन रचि रास लाडिलौ, मुरली मंद बजावै ॥ 
    सुनि धुनि आतुर चलत निकुंजन, रस बस पंथ भुलावै ॥ 
    तब हठ हाथ गहौ अलबेली, सो लखि हँसि सकुचावै ।
    धरि भुज अंस लाड़सौं चलिवो, लटकि चाल अति भावै ॥ 
    मृदु-मृदु बैन अमी रस बरसत, हँसन दसन चमकावै ।
    कंकण किंकिणी नूपुर बाजत, आगम सरस जनावै ॥ 
    कीजै कृपा कृपाल किशोरी , तन मन अति अकुलावै ।
    भोरी छिन यह सुख की आशा , बार-बार ललचावै ॥ 
- verseNumber: "92."
  verseText: |
    सुधि आवत खेल खिलैबे की ।
    नवल निकुंज भवन में प्यारी, हिल मिल ब्याह रचैबे की ॥ 
    बन विहरन यमुना तट चलिबौ, झूला डार झूलैबे की ।
    हिलमिल चौपर खेल खेलिबौ, भूषण मुरलि चुरैबे की ॥  
    रंग भरी होरी खेलत दोऊ, मुखन अबीर लगैबे की ।
    जब-जब होड़ परत दोउन में, तब-तब न्याब चुकैबे की ।
    यह अभिलाष अटपटी लागत, छिन ऐसे हियौ सिरैबे  की ।
    भोरी बाते प्रगट करहु अब, बाँह पकरि अपनैबे की ॥ 
- verseNumber: "93."
  verseText: |
    कब बाट हेरिहौं तेरे आवन की ।
    सोचत करुणाधाम किशोरी, ललित-ललित गति धावन की ।
    फहरत अंचल अंग झलकिबो , मुख पर छवि मुसिकावन की ॥ 
    हँसि-हँसि करुणा कोर हेरिबौ, मधुर-मधुर बतरावन की ।
    भोरी हिय अकुलात किशोरी, हौंसन हियौ सिरावन की ॥ 
- verseNumber: "94."
  verseText: |
    कब आवत जानि किशोरी प्यारी, तेरे पथ में नैन लगैहौं ।
    नूपुर धुनि सुनिवे के लोभन, श्रवन दिये चित लैहौं ।
    सोच-सोच मुसिकान माधुरी, छिन-छिन प्रति अकुलैहौं ॥ 
    नित-नित नाम रटत करुणानिधि, नैनन नीर बहैहौं ।
    ऐसौ भाग जगै कब भोरी, रँग भरे द्योस बितैहौं ॥ 

- verseNumber: "95."
  verseText: |
    सुधि आवत मान मनैबे की ।
    चंचल दृग थिर किये किशोरी, अवनी ओर चितैबे की ॥ 
    कर दै विमल कपोलन प्यारी, भृकुटि कुटिल लचैबे की ।
    कंज बदन मूँदे करुणानिधि, सुन्दर ग्रीव झुकैबे की ॥ 
    परि-परि पाव मनावन हू की, कर सों ठेलि हटैबे की ।
    भोरी हौंसन मरत किशोरी, कहि रस बैन हँसैबे की ॥ 
- verseNumber: "96."
  verseText: |
    रंग भरे नयन रँग भरी भौहैं ।
    रंग भरे भवन विराजित प्यारी, रँग भरे श्याम सुन्दर मुख जोहैं ॥ 
    रंग भरे वचन कहत हँसि दोऊ, रँग भरे चितवत कछु तिरछौहैं ।
    रंग भरी कुसुम सेज सखि निर्मित, रँग भरे दृग राजत अलसोंहैं ॥ 
    रंग भरी छबि-लव विमलछटा सौं, रँग भरे तिहँपुर कौ मन मोहैं ।
    भोरी याचक द्वार पुकारत, दरस लोभ लोचन ललचौहैं ॥ 
- verseNumber: "97."
  verseText: |
    शयन

    सुधि करत कमल दल शयनन की ।
    हियरा अकुलत जब सुधि आवै, मधुर मनोहर बैनन की ।
    झुकि-झुकि झूमि भवन कौ चलिबौ, अद्भुत शोभा नैनन की ।
    भोरी बलि-बलि जाइ किशोरी, सुभग तिरीछी सैनन की ॥ 
- verseNumber: "98."
  verseText: |
    कब ऐसौ भाग्य जाग है प्यारी ।
    फूले फूल पँखुरियन रस बस, शैय्या रचौं सुधारी ॥ 
    कुज्ज रंध्र रस केलि विलोकित, हर्ष होत हिय भारी ।
    करहु कृपा बलि भोरी स्वामिनि, बहुत विनय कर हारी ॥ 
- verseNumber: "99."
  verseText: |
    किसलय शयन पधारौ किशोरी ।
    रजनी ढुरी गयौ दुरि चन्दा, समय भयौ अब पौढन कौरी ॥  
    लटकत चलिये कुञ्ज भवन कौं, झूमत मोहन अंसन कोरी ।
    आलस बलित शिथिल मुख वाणी, छाई नयन अरुणई थोरी ॥ 
    नवल सेज नव दलन सँवारी, सफल मनोहर सुन्दर जोरी । 
    भोरी परम कृपालु कृपानिधि, पौढि हिये सुधि कीजिये मोरी ॥  
- verseNumber: "100."
  verseText: |
    कुञ्जनि चलौ नवल अलबेली ।
    सुर तरु कुञ्ज कमल दल सैय्या, पौढि करहु किन केलि ॥ 
    चलत मोहि भरि नयन निहारौ, छबि निधि गरव गहेली ।
    तुम बिनु कछु अवलम्ब न मेरैं, विलपत बिकल अकेली ॥  
    सहज कृपालु कृपा करि राखौ,निगम-नीति-हठ ठेली ।
    भोरी हित चरणन सों लागी, ज्यों तरुवर सों बेली ॥ 
- verseNumber: "101."
  verseText: |
    नव निकुञ्ज नव सेज सुहाई ।
    दोऊ नवल किशोर रूप निधि, पौढि करौ मन भाई ॥ 
    नवल सखी मिल करत बधाई, आरती गावत गीत बधाई ।
    श्यामल गौर गात मिल उरझन, उर उमंग अधिकाई ॥ 
    ललकत दृग छिन देखन कारन,लीला ललित लुभाई ।
    भोरी हित अलबेली स्वामिनि , दीजै आस पुजाई ॥ 
- verseNumber: "102."
  verseText: |
    किसलय शयन पधारौ प्यारे ।
    हिल मिल करौ भावती बतियाँ, रूप सुधा मतवारे ।
    हौंतौ दीन दुखारी पामर, आरत बिलपत द्वारे ॥ 
    मेरीहूँ हँसि चरचा कीजो, श्याम मोरपछ बारे ।
    भोरी हित दरदीले मोहन, पोच निबाहन हारे ॥  
- verseNumber: "103."
  verseText: |
    चौसर

    प्रेम की चौसर खेलैं पिया प्यारी ।
    हारे मोहन जीती प्रिया तू, वे जीते तू हारी ।
    दोऊ हारे दोऊ जीते, कोधों कहों बिचारी ॥ 
    हार जीत मिल एक भये री, गौर श्याम सुखकारी ।
    एक देह इक प्राण एक वपु, सलिल-तरङ्ग न न्यारी ॥ 
    तन मन प्राण दुहूँ नै हारे, ऐसे अजब खिलारी ।
    दोऊ कोटि गुणित करि पाये, प्रीति रीति रिझवारी ॥ 
    तुम सम प्रीति रीति को जानें, मैं मुख कहों कहारी ।
    भोरी को भुज गहौ लाड़िली, नेह निबाहन हारी ॥ 
- verseNumber: "104."
  verseText: |
    प्रीति की बाजी खेलियें प्यारी ।
    हौ तौ काची प्रीति लै आई, साँची प्रीति लाऊँ सुकुंवारी ।
    हौं तौ बाजी अवसि हारिहौं, जीति करौ निज आज्ञाकारी ॥ 
    ऐसी चेरी करो आपनी, छिन न हौंउ चरणन सौं न्यारी ।
    तेरी सहज बान पै भोरी, बार-बार जाऊँ बलिहारी ॥ 
- verseNumber: "105."
  verseText: |
    प्रीति की बाजी रची, अब खेलौ प्यारी ।
    जोपै हारौं तौ दासी हौं तेरी, चरणन सौं न करौ छिन न्यारी ।
    जोपै जीतौं तौ बसौ हिय मेरे, कोमल चित्त कृपानिधि प्यारी ॥ 
    नित प्रति दरस मोहि देहु कृपानिधि, प्रीति रीति हिय नैन खुमारी ।
    विनती एती मानो कृपालु किशोरी, भोरी चरण कमल पर वारी ।
- verseNumber: "106."
  verseText: |
    वेणी

    पीठ बिराजत सुन्दर बैनी ।
    फूलन सों पिय प्यारे ने गूँथी, लाँबी भली बनी सुख दैनी ॥ 
    मोतिन सों कच प्यारे सँवारे, बीच विराजत सैनदुर ऐनी ।
    भाग्य सौं चौंर ढुराइहौं भोरी, तौ हियकी मिट जैहै कुचैनी ॥ 
- verseNumber: "107."
  verseText: |
    भौंरन लौं बैनी पर अटके ।
    यह वर देहु रीझि कै प्यारी, मन मेरी अनत न भटकै ॥ 
    यह अति चंचल रुकत न क्यौंहूँ, विषयन में सिर पटकै ।
    भोरी तौ थिर होइ छिनक में, जो अलबेली हटकै ॥ 
- verseNumber: "108."
  verseText: |
    जावक

    जावक लौं पाँयन सौं लागै ।
    नूपुर लौं गुन गाय निरन्तर, पद रज लों अनुरागै ।
    कुंजन लों हिय सदन बसाबै, किंकिन लों रस पागै ॥ 
    छाया लों बन डोलत प्यारी, मन छिन पास न त्यागै ।
    यह मेरी आस पुजावहु भोरी, प्रीति अटपटी जागै ॥ 
- verseNumber: "109."
  verseText: |
    रसिक रँगीली गोरी । नागरि नवल किशोरी ॥ 
    नागरि नवल किशोरी प्यारी, नवल लाल गिरधारी ।
    कोटि काम अभिराम लाड़िले, करत केलि सुख कारी ॥ 
    चरण महावर दैन रसिक, भरि- लाये रंग कटोरी ।
    बैठी मृदु मुसिकावत देखौं, रसिक रँगीली गोरी ॥ 
    भरि रंग अंगुरिनु माहीं । पिय पग परसन चाहीं ॥ 
    पिय पग परसन चाहीं जौंलौं, बीच भई चित चोरी ।
    दोऊ चन्द चकोरी है गये, अरुझि नैन की कोरी ॥ 
    पियैं रूप मधु छके खुमारी, तन मन की सुधि नाहीं ।
    इक टक बदन विलोकित प्यारे, भरि रँग अँगुरिन मांहीं ॥ 
    प्रेम पगी हौं आवौं । महावर पगन लगावौ ॥ 
    महावर पगन लगावौं हँसि-हँसि , दोऊ नेक न जाने ।
    टेर कहौं पुनि रसिक लाड़िले, काधौं रहे भुलाने ॥ 
    प्रेम गहर सौं काढ़ि किशोरी, हँसि-हँसि दुहुन हँसावौ ।
    कबधौं रहसि कुंज अलबेली, प्रेम पगी हों आवौं ॥ 
    बार-बार मुस्कावैं | तन की तपन बुझावैं ॥ 
    तन की तपन बुझावत दोऊ, लगे महावर देखी ।
    रुक-रुक हँसि-हँसि परत लाड़िले, पुनि-पुनि मो मुख पेखी ॥ 
    हास चाँदनी छिटकी चहूँ दिशि, हृदय उमँग रसावैं ।
    भोरी देत रीझि कै माला, बार-बार मुसिकावैं ॥ 
- verseNumber: "110."
  verseText: |
    रुचिर बधू नव कुंज किशोरी ।
    निज कर दैन महावर बैठी, रंग अँगुरियन बोरी ॥ 
    निज पद मुकुर मनोहर मूरति , देखत बैठि सराहैं ।
    पुनि-पुनि रंग अँगुरियन बोरत, छाकी अमित उछाहैं ॥ 
    पिय की छबि सों निज छबि तोलत, जबहि अचक रहि जावौ ।
    दैन महावर लगौं आइ तब, सो लखि मृदु मुसिकावौ ॥ 
    हँसि-हँसि मो मुख देखौ, जब-जब , छवि छकि-छकि रहि जावौ ।
    बार-बार बलि जाऊँ लाड़िली, यह मेरी आस पुजावौ ॥ 
- verseNumber: "111."
  verseText: |
    अभिसार

    ऐसी हौंस बढ़ैं हिय माहीं ।
    श्री यमुना तट बैठे नागर, कल्प वृक्ष की छाहीं ॥ 
    अति अनुराग भरे दृग मूंदै, टेर-टेर पुलकाहीं ।
    हौं लै आऊं कृपालु किशोरी, आतुर तोहि तहाँहीं ॥ 
    वे टेरैं तुम ढाँप तबै दृग, मंद हंसौं तेहि ठाँहीं ।
    भोरी मन यह लोभ लुभानौ, देखन दृग अकुलाहीं ॥ 
- verseNumber: "112."
  verseText: |
    स्वप्न

    ऐसौ स्वप्न मोहि अति भावै ।
    नैन समीप मोहिनी मूरत, मंद-मंद मुसिकावै ॥ 
    कोटि चन्द छवि सुन्दर आनन, रूप सुधा बरसावै ।
    भोरी रंग भरी अलबेली, हिय में आइ समावै ॥ 
- verseNumber: "113."
  verseText: |
    प्यारी हो, मोहि ऐसो सपनौ भावै ।
    उर धरि पंकज पांव लाड़िलौ, मंद-मंद सहरावै ॥ 
    बार-बार हिय मांहि लगावत, तन की ताप बुझावै ।
    बैठि पाँयते सरस् रागिनी, मंजु मधुर धुनि गावै ।
    दरस माधुरी देखत छिन-छिन , अपने नैन सिरावै ।
    भोरी रूप सुधा रस छाकी, छिन सम रैन बितावै ॥ 
- verseNumber: "114."
  verseText: |
    सखी

    ललिता ललित रूप तनु श्यामा ।
    जुगल माधुरी पियत निरन्तर, कुंज भवन अभिरामा ।
    सहज कृपालु उदार सुन्दरी , कोमल तनु नव बामा ॥ 
    आरत हरन चरण सुखदायक, पोच पतित बिश्रामा ।
    अखियाँ जासु बड़ी दरदीली, उमगत करुणा धामा ॥ 
    श्री बन वास विलास विलोकत, निशि दिन आठौ जामा ।
    कबहूँ द्रवौं कृपानिधि मोपै , तोहि करहूँ परनामा ॥ 
    इतनी सुधि कराउ हित जू कौं , कोउ इक भोरी नामा ।
    पोच पतित विलपत प्रतिपारी, जदपि परम निकामा ॥ 
- verseNumber: "115."
  verseText: |
    सखी विशाखा अति सुकुमारी ।
    छोटी वयस बड़ी-बड़ी अखियाँ, उमगत कृपा अंबुनिधि प्यारी ॥ 
    पोच पतित प्रतिपाल सुन्दरी, अति उदार रिझवार महारी ।
    कोमल तन कोमल मन नागरि, मृदुल स्वभाव रूप उजियारी ॥ 
    करुणा धाम कहा कहि वरणौं, आरत टेर सकत सहि नारी ।
    श्री बन वास रास रस छाकी, छिन न होत प्यारी सौं न्यारी ॥ 
    मेरी ओर कृपा करि हेरौ, निरवलंब अति देखि दुखारी ।
    कुंज वास है तेरो सजनी, हित जू कौ सुधि मेरी करा री ॥ 
    कहियत सहज कृपालु लाड़िली, अधम उधारन बान तिहारी ।
    पूछत क्यों न कुशल भोरी सौं, विलपत आरत द्वार पुकारी ॥ 
- verseNumber: "116."
  verseText: |
    जय राधा चरनन की दासी ।
    ललितादिक जे सखी संग की,प्रिय पद कंज निवासी ॥ 
    शिव ब्रह्मादिक वन्दते पद रज, राधा चरण उपासी ।
    जिनकौं जोर-जोर कर बिनवत, मोहन कुंज-विलासी ॥ 
    महिमा अमित अपार अगोचर, सहज नेह की रासी ।
    सिध-निधि कोटि-कोटि की दाता, आरत कल्पलतासी ॥ 
    श्री दम्पति मन लिये रहत नित, निश दिन करत खवासी ।
    हित नाते सुध करहु-करावहु, भोरी सठ रस प्यासी ॥ 
- verseNumber: "117."
  verseText: |
    नख-सिख

    लाड़िली प्यारी हो ऐसौ रूप मोहि भावै ।
    बयस किशोर रस भरी प्यारी, तनु छवि कोटि मनोज लजावै ।
    अंग-अंग द्युति झलकत नीकी, चौंधि-कौंधि  दृग ठहर न पावै ।
    सिर सीमंत सुभग कच गूंथित, बैनी भुवंग पीठ छवि छावै ।
    बरसत नैन कमल सित श्रैनी, भूकुटि मरोर न बरणी जावै ।
- verseNumber: "118."
  verseText: |
    सुन्दर सहज कृपानिधि प्यारी ।
    पूरण कोटि शरद शशि सुन्दर, मुख चन्दा उजियारी ।
    खंजरीट द्वय खेलत तामें , भूकुटि धनुष छवि न्यारी ॥ 
    ओठ दन्त द्युति युत मृदु हाँसी, उपमा कहौं कहारी ।
    मनु अनुराग अमी मिलि बरसत, चाँदनी अति सुखकारी ॥ 
    आनँद में तिहुँ लोक डुबोये, कोर कटाक्ष छटारी ।
    जन हिय प्रेम सुधा रस सागर, उमगन अमित अपारी ॥ 
    संत शास्त्र श्रुति सब ही गावत, सबकौं सुखद सदारी ।
    भोरी शठ पर इती निठुरता, सपनेहूँ नाहिं निहारी ॥ 
- verseNumber: "119."
  verseText: |
    कैसे देखिये भरि-भरि नैन ।
    चंचल नयन खये थिर दुंहूँ दिशि, टारे नैंक टरैं न ।
    जनु चकोर रस उमंग अटक रहे, मुख मयंक छबि ऐन ॥ 
    भूषण बसन देह सुधि बिसरी, घटिका याम गिनै न ।
    दै भुज अंस बदन अवलोकत, इक टक पलहु लगै न ॥ 
    बार-बार मृदु-मृदु मुसिकावत, मुख कछु कहत बनै न ।
    भोरी किशोरी अति अलबेली, श्याम सुन्दर सुख दैन ॥ 
- verseNumber: "120."
  verseText: |
    कबहूँ देखि हौं भरि-भरि नैन ।
    नर्तन रास दिये गलबाहीं, विमल शरद की रैन ।
    अरुझे नील निचोल पीत पट, सैनन अरुझी सैन ॥ 
    श्यामल गौर गात मिल अरुझे, मुख आवत नहीं बैन ।
    प्रेम उमंग देह सुधि बिसरी, नव-नव उलहत मैन ॥ 
    हिल मिल दोऊ एक भयेरी, सो क्‍यों हूं सुरझे न ।
    भोरी दृग अकुलात किशोरी, पल छिन धीर धरै न ॥ 
- verseNumber: "121."
  verseText: |
    कुँवर दोऊ ऐसे बसौ दृग मेरे ।
    इक रस मगन रहौं वा छवि पै, गिनौं न साँझ सबेरे ॥ 
    सुन्दर सुखद मनोहर जोरी, हिय में करहु बसेरे ।
    मंद-मंद मुसिकान महा छबि, दैदै बाँह गरे रे ॥ 
    ता छबि माँहिं फंसे दोऊ अँखियाँ, टारी नाहिं टरैं रे ।
    भोरी नैन दरस रस प्यासे, करहु आपने चेरे ॥ 
- verseNumber: "122."
  verseText: |
    सुन्दर स्वामिनि प्यारी हमारी, छबि निधि सहज रूप उजियारी ।
    मुख छबि कोटि चन्द सौं नीकी, हँसन दसन द्युति भांवती जीकी ।
    चितवन बरसत वृष्टि अमी की, रंग भरी छबि सुखद सुखारी ॥ 
    लोचन रहत रूप ललचाने, सपनेहु तुम बिनु और न जाने ।
    शिशु लौं बार-बार हठ ठाने, चहूँ दिशि रहत निहार निहारी ॥ 
    हँसि कृपाल बिधु बदन दिखावौ, सहज माधुरी पान करावौ ।
    भोरी हिय की आस पुजावी, तन मन रहौं चरण पर वारी ॥ 
- verseNumber: "123."
  verseText: |
    विनती मेरी तुम्हारे तलक, दृग नेक दिखावौ रूप झलक ।
    मोतिन लौं कच सौं लगि लटकै, मधुकर लौं मुख पंकज अटकै ।
    मन मेरौ अनत कहूं नहि भटकै, रहै बुलाक ज्यौं अधर हलक ॥ 
    काजर लौं दृग कमल समावै, मृग मद सरस भाल पर छावै ।
    पायँन जावक रूप सुहावै, यही आस नित रहहु ललक ॥ 
    दरसन देहु लाड़िली प्यारी, आस पूजावहु नव सुकुमारी ।
    भोरी तन मन जीवन वारी, देखत दृग न लगाऊँ पलक ॥ 
- verseNumber: "124."
  verseText: |
    जय-जय राधे रूप उजारी ।
    जय अलबेली सहज सुन्दरी, श्री वृषभान दुलारी ॥ 
    जय रस दायन स्ववश बिहारिनि , सर्वोपरि सुखकारी ।
    जाकी भ्रू विलास बस मोहन, लाग्यौ रहत पिछारी ॥ 
    जय मंगल धुनि गावत किंकिन, पग नूपुर झंकारी ।
    गुन गन अमित पार नहिं पायौ, पचि हारे श्रुति चारी ॥ 
    त्रिभुवन विदित भानु कुल-दीपक, सबकौं सुखद सदारी ।
    भोरी शठ पर परम निठुरता , टेरत-टेरत हारी ॥ 
- verseNumber: "125."
  verseText: |
    जय-जय नवल निकुञ्ज नागरी, निज सर मनु जीत त्याग री ।
    मदन विमोहन कौ मन मोह्यो, गावत किंकिन विजय राग री ॥ 
    मोहन मंत्रन उधघटत नूपुर, छवि निधि सहज सरुप आग री ।
    भोरी ओर कृपा करि हेरौ, सोबत स्वप्न जगाऊ भाग री ॥ 
- verseNumber: "126."
  verseText: |
    बिनु छिन दरसन पाये क्‍यों धीरज धारौं ।
    पद नख चंद्र चंद्रिका ऊपर कोटि-कोटि चिन्तामणि वारौं ॥ 
    कोटि मराल चाल पर वारौं, चरण कमल पर कोटिक कंजन |
    कोटि-कोटि केहरि कटि ऊपर, दृग पर कोटि-कोटि वर खंजन ॥ 
    कोटि-सुमेर दिव्य कुच ऊपर,कोटि-कोटि मन्मथ धनु भौंहन ।
    कोटिक चन्द्र मन्द हाँसी पै बरबस विवस किये मन मोहन ॥ 
    कोटिक कुंद दन्त पर वारौं, बैनी ऊपर कोटि भुवंगन ।
    कोटि कोटि ब्रह्मांड सुभगता, बार डारिये अंगन-अंगन ॥ 
    कोटिक प्राण छिनक दरसन पै वारौं, सहज कृपालु किशोरी ।
    नेक कृपा करि दरसन दीजै, आरत टेर पुकारत भोरी ॥ 
- verseNumber: "127."
  verseText: |
    वे अधर मधुर वैसे मृदु-मृदु बैन ।
    वैसी छिटकी हँसन चाँदनी, वैसे रँग भरे नैन ।
    वैसी बैनी लसत पीठ पै, त्रिभुवन सुखमा ऐन ।
    वैसी झुकन बजन नूपुर की, वैसी गति सुख दैन ॥ 
    सोच-सोच अकुलावत हियरा, पल छिन धीर धरै न ।
    मणिबिनु फणिज्यों व्याकुल भोरी, पलछिन परत न चैन ॥ 
- verseNumber: "128."
  verseText: |
    वह छटा छिन हू दिखावौगी कहौ,
    माधुरी हँसि-हँसि पियावौगी कहौ ।
    मन कुटिल अलकन में मेरौ घेरि कैं,
    सब कुटिलता कब मिटावौगी कहौ ॥ 
    अपने कोमल पाँव धरि मेरे हिय,
    सब कठिनता कब नसावौगी कहौ ।
    ओठ पै अनुपम लसे अनुराग रस,
    हँसि सुधा धारा झरावौगी कहौ ।
    हौं तौ तेरे पंथ में व्याकुल पड़ी,
    लाड़ सौं नूपुर बजावौगी कहौ ।
    है हियौ मम तप्त तीनहूँ ताप सौं,
    अपने पद सौं कब सिरावौगी कहौ ॥ 
    हौंजु सोती दै दरस कब स्वप्न में,
    भाग्य सोये कौं जगावौगी कहौ ।
    अपने कच के संग मो मन बाँधिहौ,
    अपनी छवि में दृग फँसावौगी कहौ ॥ 
    नयन कोयन सों बरसि कै माधुरी,
    मेरी मन रंग में डुबावौगी कहौ ।
    मेरी भोरी कहिकै हँसि-हँसि लाड़िली,
    सब सौं कब नाता छुड़वौगी कहौ ॥ 
    हौं तौं व्याकुल टेर नित द्वारे करत,
    अब तौ मेरे हिय समावौगी कहौ ।
- verseNumber: "129."
  verseText: |
    वा अलक में चित्त फँसि रहि है कभू,
    पीर साँचे प्रेम की सहि है कभू ॥ 
    लेत सांसें बैठि दुख सौं लाड़िली,
    दौ विरह की देह यह दहि है कभू ।
    जैसे चातक मेघ कौं टेरत सदा,
    तैसी हठ यह जीभ हू गहि है कभू ॥ 
    वा सुधा मुस्कान भरि दृग पान कौ,
    दृग चकोरी से विकल चहिहैं कभू ।
    भोरी नित-नित द्वार पै बिनती करै,
    रीझ तेरी लाड़िली लहि है कभू ॥ 
- verseNumber: "130."
  verseText: |
    अलक कुटिल मन मेरौ फँसावौ, नयन कोर हिय माहि धसावौ ।
    हां ती विलपत बिकल अकेली, आइ हंसौ छिन मोहू हँसावौ ॥ 
    जाकौ ठीक-ठौर नहिं कितहूँ, तेहि भुज गहि बरसाने बसावौ ।
    चरण धूर लगि धूर मिली में, अब न कृपालु बहुत तरसावौ ॥ 
    लोचन मृदु मुस्कान लुभाने,छिन इक छटा विहँसि दरसावौ ।
    भोरी चातक दीन पुकारत, हँसि-हँसि क्यौं न सुधा बरसावौ ॥  
- verseNumber: "131."
  verseText: |
    नवल वयस झूमत रँग भीनी ।
    कौन भाग भरि नयन निहारौं, शोभा नित्य नबीनी ।
    चंचल चखन तिरिछी चितवन, कुण्डल लोल कपोला ।
    अधर बिंब मृदु हास मनोहर , सुधाधार मधु बोला ॥ 
    चंपक कनक बरन तन शोभा, अंग-अंग छबि न्यारी ।
    झूमत चलत ढरत करनी लौं, नव यौवन मतवारी ॥ 
    गूंथित चिकुर रुचिर सिर सैंदुर, मुक्ता पंक्ति सुहाई ।
    भाल विशाल तिलक मोहत मन, भृकुटि बंक छबि छाई ॥ 
    चिबुक चारु सुन्दर भुज ग्रीवा, मूरति रंग रँगीली ॥ 
    करुणा धाम किशोरी राधे, दीन दुखी दरदीली ॥ 
    श्रवनन सुनत बिकानी छवि पै, अखियाँ धरत न धीरा ।
    कभू उमगि करुणानिधि पूछौ, हँसि-हँसि हिय की पीरा ॥ 
    ये अँखियाँ रिझवार बड़ी री, इनकौ भरोसौ भारी ।
    भोरी हित इत नजर जो फेरी, तौ बड़ बात कहा री ॥ 
- verseNumber: "132."
  verseText: |
    करिवर चाल चलत मतवारी ।
    नवल वयस यौवन मदमाती, झूमत झुकत ढुरत सुकुमारी ।
    फहरत अञ्चल चञ्चल कुण्डल, किंकिणि कल नूपुर झंकारी ॥ 
    नवल निकुंज चलत अति आतुर, नवल वधू वृषभान दुलारी ।
    भोरी हित मग कबहूँ ठहरि हौ, बूझन कुशल कृपानिधि प्यारी ॥ 
- verseNumber: "133."
  verseText: |
    सेवा अभिलाषा

    नयनन सौं नित देखिबौ कीजै ।
    कर सौं चरण सरोरुह चाँपत, श्रवण माधुरी पीजै ।
    नयन-पुतरि लौं चखन बसैये, लाय-लाय हिय लीजै ॥ 
    असन-बसन सुध-बुध परि हरिये, देखि-देखि कै जीजै ।
    भोरी विमल जुगल छबि ऊपर, वारि-वारि जल पीजै ।
- verseNumber: "134."
  verseText: |
    रचि-रचि अर्पहुँ कंठन माला ।
    हिलमिल डोलहूँ लगि-लगि पीछे, गावत गीत रसाला ।
    रचि-रचि रास लाडिले नाचत, सोभा विशद विशाला ॥ 
    कंकन किंकिनि नूपुर बाजत, लाजत मोर मराला ।
    वारौं तन मन जीवन कोटिन, देखि-देखि तिहि काला ॥ 
    लै -लै पंखी पीछे डोलहुं, हरि श्रम होत निहाला ।
    यह मम आस पूजाइय भोरी, शरणागत प्रतिपाला ॥ 
- verseNumber: "135."
  verseText: |
    मन मेरौ बार-बार अभिलाखै ।
    ऐसौ भाग जागिहै कबहूँ, रूप माधुरी चाखै ।
    रचि-रचि विमल माल पहिरावै, रस की बतियाँ भाखै ॥ 
    नित-नित नव-नव लाड़ लड़ावत, पुतरिन लौं दृग राखैं ।
    तन मन पल-पल बारत भोरी, निगम श्रृंखला नाखैं ॥ 
- verseNumber: "136."
  verseText: |
    रस भरी टहल कौन विधि पावौं ।
    नूतन मृगमद लिये लाड़िली, कुच पर पत्र बनावौं ॥ 
    अनुपम देह दिव्य द्युति राजै, देखि अचक रहि जावौं ।
    मो गति देखि कृपालु किशोरी, मन्द-मन्द मुस्कावौं ॥ 
    निज कर पत्र रचन जब लागौ, देखि-देखि पछितावौं ।
    भोरी या सुख टहल आस पर, कोटिक जन्म गमावौं ॥ 
- verseNumber: "137."
  verseText: |
    प्यारी मोहि ऐसौ जीवन भावै ।
    आलस भरी लता के गृह में, रचि शैया पौढावै ॥ 
    तुम सोवौ मैं ब्यार डुलावौं, भाग्य कह्यो नहिं जावै ।
    तुम हूं अकेली मैं हूं अकेली, आनन्द उर न समावै ॥ 
    बार-बार छवि देखि-देखि कैं, उमगि नैंन भरि आवैं । 
    भोरी भुक्ति मुक्ति नहिं चाहत, छिन इक वह सुख पावै ॥ 
- verseNumber: "138."
  verseText: |
    सोवत कबहूं प्यारी तोहि भरि-भरि नैंन निहारौं ।
    तुम तौ पौढीं फ़ूलन की सैया, मैं तो बायु करीं तन बसन सम्भारौं ॥ 
    देखौं कबहूँ मुख आवत हाँसी, कोटि प्राण ताहि ता छवि पर वारौं ।
    कबहूँ कहत पिय छोड़ौजी छोड़ौ, तब पुलकित गात तोपे जीवन हारौं ॥ 
    कबहूँ आनन्द भरी तेरी देह सुहावै, अंसुवा पौछ सम्भारौं ।
    भोरी हित यह आस पुजाबौ, बिन देखे नैंन लागत अंधियारौं ॥ 
- verseNumber: "139."
  verseText: |
    ऐसी सेवा की सुधि आवै ।
    अतर अरगजा माँग महावर, भूषण बसन सजावै ॥ 
    मज्जन भोग सिंगार आरती, रचि सैया पौढावै ।
    चन्दन मृग मद सेंदुर काजल, तेल फुलेल लगावै ॥ 
    लै बीना मृदु गाइ किशोरी, जुगल किशोर रिझावै ।
    कबहूँ रीझि देहु यह सेवा, भोरी बलि-बलि जावै ॥ 
- verseNumber: "140."
  verseText: |
    भाव हिल मिल सैया रचिवौ ।
    पिय के चाटु बैन तेरी नाहीं, प्रणय कोप सौं लचिवौ ॥ 
    श्याम गौर भुज कलह मनोहर, भृकुटि नैन कौ नचिवौ ।
    यह सुख छिन नहिं पायौ भोरी, वृथा सृष्टि नचि पचिवौ ॥ 
- verseNumber: "141."
  verseText: |
    मेरे मन भावै अलक संभारिवौ ।
    बीन नवीन फूल रचि रुचि सौं, हार गरे में डारिवौ ॥ 
    बैनी चारु चमेली फ़ूलन, मुतियन लरी सुधारिवौ ।
    रुचिर चिकुर भरि सैंदुर कबहूँ, देखत तन मन बारिबौ ॥ 
    काजर कोर अनोखी अखियन, बंक निसंक निहारवौ ।
    अद्भुत अधर अरुणई तापै, मृदु हाँसी विस्तारिवौ ॥ 
    भावत भोर भुजा अंसन दै, लटक-लटक पग धारिवौ ।
    नख सिख रूप अनूप निरखि दृग, कोटिक जीवन हारिवौ ॥ 
    कंज दाम छवि मृदुल मनोहर, उमगत बाँह पसारिवौ ।
    भोरी हित अति दीन दुखी कौं, कुशल बूझि प्रतिपारिवौ ॥ 
- verseNumber: "142."
  verseText: |
    ब्रज-वृन्दावन वास

    कब बसिहौ ब्रज बीथिन माहीं ।
    जहँ नित डोलत जुगल लाडिले, दिये विमल गलबाहीं ।
    मगन चलत डगमग पग धावन, छिन-छिन पंथ भुलाहीं ॥ 
    ठहर-ठहर मुख कंज बिलोकत, मंद-मंद मुस्काहीं ।
    फहरत अञ्चल चञ्चल कुंडल, परत कपोलन झांहीं ॥ 
    कोटि मनोज अंग छबि मिल-मिल , चौगुन होत सदाहीं ॥ 
    भोरी किशोरी तन मन अकुलत, देखन दृग ललचाहीं ॥ 
- verseNumber: "143."
  verseText: |
    कब बसिहौं ब्रज कुञ्जन माहीं ।
    ह्वै मृग बन मृगनैनी ढूँढ़त, फिरौं कदम्बन छाहीं ॥ 
    पीछे लगि नित रहौं किशोरी, छिन संग छाँड़त नाहीं ।
    भोरी जबकर फेरि बिलोकौ , शिव अज लखि ललचाहीं ॥ 
- verseNumber: "144."
  verseText: |
    दीजै मोहि वास व्रज माहीं ।
    जुगल नाम कौ भजन निरन्तर, और कदम्बन छाहीं ॥ 
    ब्रज बासिन के जूठन टूका, अरु जमुना कौ पानी ।
    रसिकन की सत संगति दीजै, सुनिवौ रस भरी बानी ॥ 
    कुञ्जन कौ नित डोलिबौ दीजै, दीजौ भोर बुहारी ।
    मिल्वे की हिय माँहिं चटपटी, प्रीति हिये अति भारी ॥ 
    कोटि प्राण नित बारिबौ दीजै, देखत चरण छटारी ।
    इतनी आस पूजावहु प्यारी, भोरी बलि बलिहारी ॥ 
- verseNumber: "145."
  verseText: |
    श्री वृन्दावन तोहि करूँ परनाम ।
    रंग भरी केलि करत जहँ नित-नित , रँग भरे श्यामा श्याम ।
    रंग भरौ जमुना तीर सुहायौ, रंग भरे राजत धाम ॥ 
    रंग भरे कुंज लता तरु पल्‍लव, शोभा अति अभिराम ।
    रंग भरे खग रँग भरे द्रुमन पै, टेरत राधा नाम ॥  
    रंग भरी ललित रागिनी गावत, रंग भरी सहचरी बाम ।
    भोरी हृदय रँग में बोरौ, देहु प्रीति निष्काम ॥ 
- verseNumber: "146."
  verseText: |
    बन्दिय चातक मोर चकोरन ।
    बन्दिय मृग जे सँग लगि डोलत, बंधे प्रेम के डोरन ॥ 
    बन्दिय खग जे गुण गण गावत, भीजे प्रीति हिलोरन ।
    बन्दिय हंस प्रिया पुचकारत, देखि कृपा की कोरन ॥  
    औरौ जेते जीव चराचर, जे अपनाये किशोरन ।
    भोरी इक-इक रज कण ऊपर, वारिय प्राण करोरन ॥ 
- verseNumber: "147."
  verseText: |
    यमुना पुलिन*

    श्री यमुना पग वंदन कीजै ।
    कबहूँ बड़े भाग तट बसिये, ताप हिय कौ छीजै ॥ 
    जहँ हिलमिल जल केलि करत नित पिय प्यारी रस भीजै ।
    केसर मृग मद चन्दन मिश्रित, बड़े भाग्य जल पीजै ॥ 
    जूठन खाय थार की रहिये, गाइ-गाइ गुण जीजै ।
    भोरी के हिय रँग भरी यमुना, प्रीति अटपटी दीजै ॥ 
- verseNumber: "148."
  verseText: |
    कब हिय उठ विरह कौ शूल ।
    व्याकुल ढूंढौं जुगल लाडिले, विहरत जमुना कूल ।
    इकटक नाम रटत निशिवासर , सपनेहु परै न भूल ॥ 
    नैंन सनीर गात पुलकावलि, सुधि नहिं देह दुकूल ।
    ऐसी प्रीति देहु अलबेली, भोरी जीवन मूल ॥ 
- verseNumber: "149."
  verseText: |
    कब हिय बढ़ै हिये की पीर ।
    तन मन अति अकुलात आइ कब, बैठहूँ जमुना तीर ॥ 
    चहूँ दिस हेरि-हेरि कै टेरत, ढरत नैन सौं नीर ।
    लोटत भूमि देह रज छाई, विलपत धरत न धीर ॥ 
    डगर बगर नहिं नैकु निहारत, ढूंढत कुंज कुटीर ।
    भोरी बिना प्रेम उर आये, धृग-धृग जन्म शरीर ॥ 
- verseNumber: "150."
  verseText: |
    यमुना कूल कदम्बन नीचै ।
    चहूँ दिस हेर-हेर अति दुख सौं, बैठी अँखियाँ मीचै ॥ 
    गहरी लेत उसाँस प्रेम कौ, मनौ पयोधि उलीचै ।
    भोरी विरह-ताप तन सँचरत, दृग जल धार न सींचै ॥ 
- verseNumber: "151."
  verseText: |
    यमुना तट कब रात बितावौं ।
    दरसन आस लुभानी बैठी, छिन न निमेष लगावौं ॥ 
    कबहूं हेर-हेर दिस टेरत, नैनन बारि बहावौं ॥ 
    व्याकुल गात देह रोमांचित, नाम टेर रट लावौं ।
    कबहूँ संभ्रम रूप लुभानी उठि उठि इत उत धावौं ॥  
    कबहूँ गुन गन गुनत दयानिधि, बैठि-बैठि अकुलावौं ।
    यह मेरी आस पुजाइय भोरी, बार-बार बलि जावौं ॥ 
- verseNumber: "152."
  verseText: |
    अटकि रहै मन जमुना कूलन ।
    रचि-रचि माल कंठ पहिरावै, नील सरोरुह फ़ूलन ॥ 
    झूलैं नैन कदम्बन डारन, रंग हिंडोरे झूलन ।
    मिल निरवारत बलि-बलि भोरी, अरुझे विमल दुकूलन ॥ 
- verseNumber: "153."
  verseText: |
    मन मेरौ भानु सुता तट डोलै ।
    कानन बात सुने नहिं प्यारी, मुख सौं कछू न बोलै ॥ 
    करि श्रृंगार बदन अवलोकैं, रूप छकी छबि तोलै ।
    पुनि-पुनि तन मन बारत भोरी, गाँठ प्रीति की खोलै ।
- verseNumber: "154."
  verseText: |
    नवल निकुंज

    मन मेरौ नवल निकुंजन डोलै ।
    जहँ रंग भरी नवल अलबेली, दरपन लै छबि तोलै ।
    डगर-बगर हठ मिलत अकेले, करत नैन में मोलै ।
    भोरी किशोरी बदन दुरावत, पिय हँसि घूँघट खोलै ॥ 
- verseNumber: "155."
  verseText: |
    भावत मोहि निकुंजन बसिबौ ।
    दम्पति मुख की छबि दृग देखे, छिन-छिन हिये हुलसिबौ ।
    तन मन की न संभार किशोरी, जुगल माधुरी फँसिबौ ।
    हिल मिल कै तेरी बतियाँ सुनिबौ, ओठन सुधा बरसिबौ ॥ 
    रस भरी चोज कछू मुख कहिवौ, तुम हँसाय कै हँसिबौ ।
    सहज कृपालु कृपा बिन भोरी, कबलौं बैठि तरसिबौ ॥ 
- verseNumber: "156."
  verseText: |
    मेरे मन भावै कुज्जन रहिबौ ।
    युगल माधुरी पान निरन्तर, रस की बतियाँ कहिबौ ॥ 
    उबटन मज्जन भोग आरती, वस्तु प्रसादी लहिबौ ।
    निशिदिन तोहि अवलोकत प्यारी, शशि-चकोर गति गहिबौ ॥ 
    इतनी हौंस बढ़त उर माहीं , सपनेहु और न चहिबौ ।
    सहज कृपालु दरस बिनु भोरी, लै लै नाम करहिबौ ॥ 
- verseNumber: "157."
  verseText: |
    जहँ राजत नवल निकुंजन प्यारी ।
    जहँ पग देत महावर मोहन, जहँ हित बाँधत बैनि संभारी ॥ 
    ललिता ललित विशाखा राजत, सेवा करत सखी सुख भारी ।
    जहँ की महिमा वेद न जानत, शिव अज रहत बिचारी ॥ 
    जहँ मन-बुद्धि-वचन नहिं पहुँचत, व्यापत नहीं काल माया री ।
    भाग्य हीन पामर भोरी की, किस विधि तहाँ होइ चरचा री ॥ 
- verseNumber: "158."
  verseText: |
    लाड़ भरी मुसिकात लजीली, झुकि देखत निज पाँय ।
    लालच भरे लाल के लोचन, ललकि रहे तह छाय ॥ 
    युगल बदन संगम अति सुन्दर, पद पंकज उर लाल ।
    लालत ललित लाड़िली भोरी, चूमि-चूमि बलि जाय ॥ 
- verseNumber: "159."
  verseText: |
    रस फिर गयौ दुहुन पर माई, प्रेम गहर की थाह न पाई ।
    सावधान सजनी सम्भरावे, बहुत उपायन चेत करावैं ।
    मीठी जुगति न कछु बनि आई, तब यह तीखी बुद्धि उपाई ॥ 
    मान तज मान तज प्यारी, पिय की ओर निहार ।
    बिनु आगस रूसी काहे, हौंजु पियौं जल बार ॥ 
    बिनु जल क्यों जीवै मछरी, अपने जिय विचार ।
    तू घन वे चातक प्यासे, व्याकुल करत पुकार ॥ 
    आतुर उठ भैंटौ हा-हा , जोलौं घट में प्रान ।
    सुन संभ्रम चोंकै दोऊ, विरह व्यथा जिय जान ॥ 
    सहसा पिय पाई सन्मुख, प्रिया परम अनुकूल ।
    प्यारी हँसि चितई सादर, पकरि नाह भुजमूल ॥ 
    वे जु ढुरे चरनन लीन्हें इन जु खेंच हिय लाय ।
    ऐसे हित डूबत काढ़े , झूँठौं मान मनाय ॥ 
    वह मिलन परस्पर फूलन, झूलन उमगन प्यार ।
    बलि-बलि हित भोरी, पुनि-पुनि पीवत पानी वार ॥ 
- verseNumber: "160."
  verseText: |
    बलि-बलि जाऊँ कोकिल तेरी, प्यारी-प्यारी गावौ री ।
    मेरौ सौ रंग रूप तिहारौ, मोसौं मनहि मिलावौ री ॥ 
    यह जु नाम है जीवन मेरी, प्यासे श्रवण सिरावो री ।
    रँग में रंग बढ़ावौ हा-हा, उमगि-उमगि रट लावौ री ॥ 
    तन मन प्राण निछावर तेरी, अब न अधिक तरसावौ री ।
    भोरी हित यह सुधा सजीवन, मेरी जिय जिवावौ री ॥ 
- verseNumber: "161."
  verseText: |
    रसिक संग एवं कृपा बल

    रसिक संग बिनु सब ही झूठे ।
    झूठे मन इन्द्रिय अरु काया, धर्म पुंजी हठ लूटे ॥ 
    झूठे राज साज सुख सम्पति, ह्वै-ह्वै  सबकौ छूटे ।
    झूठे कुटुम, बन्धु, सुत, नारी, अन्त जु नातौ टूटे ॥ 
    झूठे कर्म, धर्म, व्रत, संजम, हिय न प्रेम रस घूटे ।
    कठिन घड़ी जब आवत भोरी, सबके भांडे फूटे ॥ 
- verseNumber: "162."
  verseText: |
    रसिक संग बिनु प्रेम न होई ।
    बिनु पद प्रेम भये अलबेली, भव सौं छुटत न कोई ॥ 
    कीजै कृपा कृपालु किशोरी, रसिक संग जो पावौं ।
    जासौं उपजै भाव हिये में, चरण कमल चित लावौं ॥ 
    निशि वासर करि तिन की सेवा, तन की तपन मिटैये ।
    तन मन जीवन वारिय भोरी, आँखिन माँहिं बसैये ॥ 
- verseNumber: "163."
  verseText: |
    रसिक रूप रस भीने । रहत सदा रुचि लीने ॥ 
    रहत सदा रुचि लीने सेवत, नवल निकुञ्ज निवासी ।
    जस जग जगमग रीति अटपटी, निकुञ्ज करत खवासी ॥ 
    छबि मधु छके खुमारी निशदिन, रहत चरण चित दीन्हे ।
    अधम उधारण कारण डोलत, रसिक रूप रस भीने ॥ 
    कारण रहित कृपाला । शरणागत प्रति पाला ॥ 
    शरणागत प्रतिपाल कृपानिधि, निर्मल जस श्रुति गायौ ।
    जुगल रूप जग जीव उधारन, अन्तर नैंक न पायौ ॥ 
    तद्यपि हौं कछु अन्तर मानौं, सो सुनिये नव बाला ।
    तब पद-धन यह दाता ताके, कारण रहित कृपाला ॥ 
    देखन हियौ सिरावौं । तन की ताप भुजावौं ॥ 
    तन की ताप भुजावों प्यारी, चरण कमल हिय राखौं ।
    नित-नित नव-नव सेवा ठानौं, कोमल बतियाँ भाखौं ॥ 
    तिन की कृपा -कोर अलबेली, बान रसीली पावौं ।
    मूरति भव-भय हरण मनोहर, देखत हियौ सिरावौं ॥ 
    कृपा कोर टुक हेरी । भव भय हरहु घनेरौ ॥ 
    भव भय हरहु घनेरौ मेरौ,जुगल प्राण सों प्यारे ।
    नित नव प्रीति रीति रस छाके, हिय में बसौ हमारे ॥ 
    ब्रज कौ बास प्रेम की आसा, हिय में जुगल बसेरौ ।
    माँगत भोरी गोद पसारै, कृपा कोर टुक हेरौ ॥ 
- verseNumber: "164."
  verseText: |
    रसिकन की सत संगत दीजै ।
    जासौं विमल भाव उर आवै, हियौ प्रेम रस भीजै ॥ 
    तन मन धन पद ऊपर वारिय, नित-नित सेवा कीजै ।
    भोरी भाग्य बड़े सौं कबहूं, जूठन लै लै जीजै ॥ 
    रसिक चित्त स्थिति 
- verseNumber: "165."
  verseText: |
    बिनती सुनियो नव नागरी ।
    अमल कमल पद निरखि सिरात । लोचन सो न विषय लालचात ॥ 
    नूपुर धुनि सचु मानत कान । सुनत न सो श्रुति कथा पुरान ॥ 
    मदन कदन विधु बदन निहार । जरत न सो तिय रूप दँवार ॥ 
    मृग मद लौं दृग लोभित भाल । परत न सो भव-भँवर विशाल ॥ 
    मृदुल हँसन पर वारत प्रान । देखत सो दृग खोलि न आन ॥ 
    उमड़त हिय अनुराग अपार । करत न सो तन-बसन सम्भार ॥ 
    जगमग-जगमग तिन के भाग । निवहत सो नित प्रीति की लाग ।।
    भोरी विलपत दरशन चाह । करहु कृपानिधि नेह-निवाह ॥ 
- verseNumber: "166."
  verseText: |
    मन मेरौ सुन्दर छवि पर झूलै ।
    छाकौ पियै प्रेम रस प्यालौ, असन -बसन सुधि भूलै ॥ 
    बिरमै विमल कदम्बन छाहीं, हंस सुता के कूलै ।
    मोहन मूरति देखत भोरी, उमगि-उमगि अति फूलै ॥ 
- verseNumber: "167."
  verseText: |
    मन मेरौ रहै प्रेम रस छाकौ ।
    विरमै मंजुल कुञ्जन माँहीं, तट न तजै यमुना कौ ॥ 
    रीझ-रीझ कै तन मन वारै, देखत रूप छटा कौ ।
    हिल मिल डोलत भोरी किशोरी, लाल बिहारी बाँकौ ॥ 

- verseNumber: "168."
  verseText: |
    जे जन चरणन के रस पागे । तीन लोक तिन्‍ह तृण सम लागे ॥ 
    छिन-छिन दरसन कौ मन लौभा । तिन कौ धूरि स्वर्ग की सोभा ॥ 
    पंकज-पावँ छटा अति भावै । हियरा टूक-टूक ह्लै जावै ॥ 
    लीला ललित सदा सुधि आवै । तिनकों कछू न देखि सुहावै ॥ 
    युगल मिलन की आसा धारैं । काहू ओर कभू न निहारें ॥ 
    सोचि-सोचि कार्ट दिन राती । दुखसौं फटत छिनैं-छिन छाती ॥ 
    ऐसेन की जो जूठन पावौ । तौ अपनौ सौभाग्य मनावौ ॥ 
    विषय पंक में बूढ़त भोरी । करहु कृपा अब सहज किशोरी ॥ 
- verseNumber: "169."
  verseText: |
    रूपहि दृष्टि समाय रही री, रूप हिराने नैना ।
    बानी रूप हिरानी मुख सौं, क्यों कहि आवै बैना ॥ 
    रूपहि श्रवन विमोहे ऐसे, शब्द न देत सुनाई ।
    नासा गंध न सूंघ सकै री, रूप जु घ्राण समाई ॥ 
    तनु कौ परस रूप हरि लीन्हौ, शीत उष्ण नहिं कोई ।
    कहा खात कछु जीह न जानत, स्वाद रूप में खोई ॥ 
    अचल भयो मन रूप समानो , सकल कल्पना त्यागी ।
    फुरत विचार-विवेक न कोई, बुद्धि रूप में पागी ॥ 
    चित-चिंतन हरि लियो रूप ने, कछू न आवत ध्यानै ।
    अहं भाव हू रूप समान्यौं, को मैं कहाँ न जाने ॥ 
    अखिल विश्व लय भयों रूप में, जाग्रत रूप हरि है ।
    इक रस स्वप्र-सुषुप्ति-तुरीया, रुपहिं में धगरी है ॥ 
    रूप कौ रूप फूल ही दीसत, देखत तन मन फूलै ॥ 
    फूल कौ रूप भूल है कैंधौं, फूल अपनपौ भूलै ॥ 
    भूलहि भूल अधिक अधिकावै, रूप कौ स्वाद न पावै ।
    जल के दरस मरै जो प्यासौ, कैसे तृषा बुझावै ॥ 
    भूल के सिंधु अथाह रूप रस, प्यास बढ़ै उर भारी ।
    समरथ श्री हित सजनी ताकी, एक पिवावन हारी ॥ 
    प्यास अनन्त करौ हियरे में, रूप अनन्त पिवावौ ।
    भूल अनन्त माधुरी मादक, चाह अनन्त जगावौ ॥ 
    उछरि-उछरि कै डूबत फिर-फिर डूब-डूब कै उछरै ।
    पीवत तृषित रहै हित भोरी, जो हित कृपा करै ॥ 
- verseNumber: "170."
  verseText: |
    जो नैंननि नैंना अरुझाते ।
    तो लै स्वाति बूँद सीपी लौं, पलक मूँद रहि जाते ॥ 
    डूबत अधिक-अधिक गहरे अति, थाह न कबहूँ पाते ।
    बाहिर कौ कछु दीख न परतौ, अन्धे लौं हहराते ॥ 
    जियन मरन कछु समझि न परतौ, सब ही द्वंद नसाते ।
    हित भोरी का कहिये कैसे, केतौ काल बिताते ॥ 
- verseNumber: "171."
  verseText: |
    जो नैंननि नैंना अरुझाते ।
    तौ मेरी गति औरहि होती, जो हित मे हित आते ।
    भूख प्यास नहिं शीत न गर्मी, सुख दुख सकल सिराते ॥ 
    बाहिर पंथ दीख नहिं परतौ, कर टटोर मग पाते ।
    श्रवण शब्द सुनते नहिं मुख सौं, बचन कहत लड़खाते ॥ 
    सब तन शिथिल पुलकि झरतौ जल, ज्ञान सकल बहि जाते ।
    छिन-छिन अधिक-अधिक उमगत हिय, हुलसि-हुलसि बौराते ॥ 
    हँसि-हँसि अधिक-अधिक ही हँसते, बार-बार बलि जाते ।
    जियत मरे बौरे मतबारे, भोरी जगत हँसाते ॥ 
- verseNumber: "172."
  verseText: |
    जो नैंननि नैंना अरुझाते ।
    तौ नैंननि धँसि रहते नैंना, नैंननि व्यथा सुनाते ।
    नैंननि कुशल बूझते नैंना, नैंननि पर बलि जाते ॥ 
    नैंननि पीर समझि कैं नैना, उमगि-उमगि भर आते ।
    नैंना बरसत नैना पीवत, नैंन तरसि अकुलाते ॥ 
    नैंन अथाह पैंरते नैंना, ना थकते न अघाते ।
    नैंनन हौंस समुझकैं नैंना, नैंनन में मुस्काते ॥ 
    नैंननि नैंन विहार देखते, नैंननि नैंन सिराते ।
    नैंननि कौ हित जानत नैंना, नैंननि धीर बंधाते ॥ 
    नैंननि व्यथा नैंन ही सुनते, नैंन नैंन उर लाते ।
    ज्यों-ज्यों नैंना नैंननि मिलते, मिलन प्यास अधिकाते ॥ 
    नैंननि की गति अद्भुत देखत, नैंना जिय पछताते ॥ 
    नैंना हँसत नैंन ही विलपत, नैंना उमगत गाते ॥ 
    नैंननि की अरुझन नैंननि में, तोरत सबसों नाते ।
    हित भोरी यह दुखिया नैंना, जो कबहूँ मिल पाते ॥ 
- verseNumber: "173."
  verseText: |
    जो नैंननि नैंना अरुझाते ।
    जल में जल ज्यों दीठ-दीठ यों, फिर न कभू विलगाते ॥ 
    छिन पल घड़ी याम निशि वासर, मास बरस जुग जाते ।
    परती खबर न कैहूं जोपै, कोटिन कल्प सिराते ॥ 
    इक टक पलक न लगते कबहूं, जाग्रत नींद भुलाते ।
    उमग-उमग उमगत ही रहते, कोयन नीर चुचाते ॥ 
    चकित शिथिल गति , थके-थके छवि मतवारे मदमाते ।
    अन्धे से कछु देख न सकते, तम प्रकास बिसराते ॥ 
    डूबत अधिक-अधिक अति प्यासे, छिन ही छिन बौराते ।
    हित भोरी हित माहिं समाते, हेरत हुलसि हिराते ॥ 
- verseNumber: "174."
  verseText: |
    क्यों विलपत तू बैठि अकेली, कौन सुनै को जानें ॥ 
    जो परि जाय श्रवण हूं कबहूं, को साँची करि मानै ॥ 
    मत जु सुनौं मत जानौं मानौं, मोहि विलपिबौ प्यारौ ।
    नहिं बस चलैं न सूझे कोऊ, दुख में और सहारौ ॥ 
    वे जु हँसैं झूठी करि मानें, नाव धरैं सब मोकौं ।
    पै का करौं समात नहीं हिय, रुकै न कैसे रोकौं ॥ 
    जो चुप रहौं बढ़े व्याकुलता, बरबस बैठि कराहौं ।
    मैं कब कहौं हँसौं मत कोऊ, साँची कहौं सराहौं ॥ 
    मोहि लगै हिय परम अकबकी, ऊँचे टेर बुलाऊँ ।
    जो सब हँसे बुरौ कहूँ काकौं, सबकौ मन बहलाऊँ ॥ 
    सबनि विनोद मोद हिय मेरे, कछु-कछु धीरज होई ।
    भोरी हित कछु लेत काहु कौ, निजु दिन काटत रोई ॥ 
- verseNumber: "175."
  verseText: |
    कहा कहौं गति परम अटपटी, का खोयौ का पायौ । 
    पावन हारौ कहौ कौन जब, आपते आप हिरायौ ॥  
    छवि आई ह्वै दरद जु हियरा, दरद होय दुलरायौ ।
    दरदहि दरद मिलत दिन दूनों, दरद हिये अधिकायौ ॥ 
    जल-थल-गगन विश्व सब भूल्यौ, तन मन प्राण गंवायो । 
    ज्यों भीतर त्यों बाहिर इक रस, एक दरद ही पायौ ॥  
    किन अनभयौ कौन सो जान्यौं, बचन कहत बहकायौ । 
    हित भोरो हित कृपा कोर के, मादक ही  बौरायौ ॥ 
- verseNumber: "176."
  verseText: |
    मुख चन्द्र की यह चाँदनी, हिय कुज्ज में छाई रहै ।
    छवि पान मत्त चकोर अखियाँ, देखि बौराई रहै ॥ 
    यह कोर करुणा सिंधु की,लहरी हिलोरत ही रहै ।
    यह प्रेम की उमगन उमंग जुत, जीय बोरत ही रहै ॥ 
    यह बंक चितवन नैंन की, हियरा में नित धँसती रहै ।
    यह चारु छूटी लटन ऊपर, मो सुरत फँसती रहै ॥ 
    यह बाँह फरकीली सदा , भुज दीन पकरत रहै ।
    यह माधुरी के जाल तन-मति, मेरी जकरत ही रहै ॥ 
    नख चन्द की यह ज्योति हिय, तम-तोम टारत ही रहै ।
    यह बाण करुणा की सदा, बिगड़ी सुधारत ही रहै ॥ 
    यह आँख मेरी लाडिले, मग रावरौ हेरत रहै ।
    यह मेरी रसना चातकी, रस-घन तुम्हें टेरत रहै ॥ 
    जहँ-जहँ परै मम दीठ जागत रावरौ छवि लखि परै ।
    सोवते-सपने न हिय सौं, आपकी मूरति टरै ॥ 
    भोरी हित जन दीन की, बिनती अबसि यह मानिये ।
    कोटि जन्मन की भिखारिन, आपुनी पहिचानिये ॥ 
- verseNumber: "177."
  verseText: |
    कहा कहौं कछु कही न जाय । 
    तुम हिय तुम ही दरद हिय कौ,औषध वैद उपाय ॥ 
    तुम ही अगनि , जरनि ही हौ, तुम पुनि लेत बुझाय ।
    तुम ही सुधा हहा विष तुम ही,मारत लेत जिवाय ॥ 
    हौं बलि कबहूँ उमगि हित प्यारी, हेरौ मृदु मुसिकाय ।
    कहा कहौ गति कौन भई यह, मरम न जान्यौ जाय ॥ 
    हुती हौंस हियरे लै राखौ,मृदु मूरत दुलराय ।
    सो न मिली ना ललकन, उलटौ हियरा गयौ हिराय ॥ 
    रह गई पीर पिरात, कहारी को विलपत बिललाय ।
    बिनु जिय-जियत लाड़िली दासी, कहौ कौन पतियाय ॥ 
    मृदु मुसिकात छबीली छबि सौं, रहौ दृगन में छाय ।
    विलुलित-ललित संभारत बारन, भुजा मृनाल उठाय ॥ 
    भृकुटि मरोरि तिरीछी चितवन, सुधा सिन्धु बरसाय ।
    बलि-बलि जात ललित हित प्यारी, प्रियतम हा-हा खाय ॥ 
- verseNumber: "178."
  verseText: |
    सब विधि मैं हित की हित मेरे ।
    परिहरि संक सकुच सब ही की, प्रकट कहत हौं टेरे ॥ 
    मैं जानों हित जानत नीकैं,रीझि बोलि लई नेरे ।
    मतलब नहीं कछु काहू सौं, मिटि गये झगरे-झेरे ॥ 
    कोऊ निन्दत कोऊ बन्दत, वृथा बकत बहुतेरे ।
    अपनी दूल्हा राजी चहिए, जा संग पारे फेरे ॥ 
    यहै प्रतीति प्रबल उर अन्तर, तदपि न चैन हियेरे ।
    हित भोरी बलिहार लाडिले, आवहु उमगि सबेरे ॥ 
- verseNumber: "179."
  verseText: |
    प्रीति रीति कैसे कहि आवै ।
    करि बिचार हिय हार रहत हौं, क्यौ हूँ मन न समावै ॥ 
    चन्दहि रहत एक टक देखत, सो जग धन्य चकोरी ।
    टूटे सीस दीठ ना छुटै, तदपि प्रीति अति थोरी ॥ 
    तन मन होइ चकोरी चन्दा, शशि ह्वै शशि छबि पीवै ।
    तौ कछु स्वाद और ही पावै, पियत जु प्यासी जीवै ॥ 
    तद्यपि प्रीति इकंगी कहियै, जहाँ न प्रेमी दोऊ ।
    उघरहि रस जु चकोरहि, इक टक चाहै चन्दा सोऊ ॥ 
    ह्वै चकोर वह चहै चकोरहि, यह चन्दा ह्वै चन्दहि ।
    छिन-छिन में तन पलटें दोऊ, अरुझि प्रेम के फन्दहि ॥ 
    याकौ वामें वाकौ यामें, पलटि-पलटि हित पावै ।
    छिन-छिन प्रेम पयोनिधि संगम अधिक-अधिक अधिकावै ॥ 
    ज्यौं द्वै दरपन बीच दीप की, अगनित आभा दरसे ।
    द्विगुण चौगुनौ फेर अठगुनौ, त्यौ अनन्त हित सरसें ॥ 
    अनुप्रमान अनुमान कह्यौ यह, प्रीत बात कछु ओरें ।
    ताकौ थाह कौन अबगाहै , दुरहि तैं मति बौरै ॥ 
    भोरी हित जब द्रवै व्यास सुत, गूंगे लौं गुर खाऊँ ।
    रोम-रोम भरि रहै मिठाई, ना कछु कहौं कहाऊँ ॥ 
- verseNumber: "180."
  verseText: |
    श्री हित कृपा कोर की लीला, मोपै कही न जाय ।
    अति मीठी अति पैनी कसकै,रोम-रोम गई छाय ॥ 
    बिन देखी देखी सी लागै, यह अचरज गति हाय ।
    मादक बिना पियै मतवारी, निलज फिरौं बौराय ॥ 
    जो कोऊ कछू पूछे हा-हा , कहा कहौं समझाय ।
    अंधेरे कौ उन्‍माद रूप कौ, कहौ कौन पतियाय ॥ 
    रोमनि रोम अग्नि सी व्यापै, तदपि न देह जराय ।
    जो कोऊ काढ़ि करेजौ देखे, सो समझे उर घाय ॥ 
    मन-मन आप-आप ही खीझौं, आप रीझि बलि जाय ।
    आप ही हँसै आप ही रोवै, फूल उठे मुरझाय ॥ 
    होतौ हिय तौ मरम बूझतौ,सोऊ गयौ हिराय ।
    तौहू पीर कहौ को मानै, बिनु हिय कहा पिराय ॥ 
    छिन छिन बरस बरस से बीतैं, कबधौं हित उर आय । 
    कोऊ कछु अबलम्ब बतावी, जैसे विरह सिराय ॥ 
    हित भोरी बलिहारी वाकी,जो हित के गुण गाय ।
    डूबत दीन दुखी दुख सागर भुज गहि लेहि जिवाय ॥ 
- verseNumber: "181."
  verseText: |
    हम रूप सुधा रस वारे, कोई का जानें बेचारे ।
    पड़े रहत अलमस्त एक रस, छके प्रेम मतवारे ।
    अटके छबि जनु भौंर कंज पर, तन-मन-धन सब हारे ॥ 
    भुक्ति मुक्ति अरु कुगति-सुगति लौं भरि दृग छिन न निहारे ।
    भोरी श्री हरिवंश कृपा बल, जागे भाग्य हमारे ॥ 
- verseNumber: "182."
  verseText: |
    मेरी लटक रही बैनी घुटुअन लौं मोपै नीकैं गुही न जाय ।
    जौलौं पकरि सम्भारन लागौं, हिय जिय जात हिराय ।
    रुचिर मनोहर कोमल चिकनी, नागिन ज्यों बल खाय ॥ 
    याके फन्द कौन निरवारै, देखत सुरत ठगाय ।
    गहरु वृथा ही होत टहल में, समुझत जीय पिराय ॥ 
    अपनी छबि पर आप सखी री, मन मेरौ पछिताय ।
    श्री हित रूप प्रसादी रीझन, हित भोरी बलि जाय ॥ 
- verseNumber: "183."
  verseText: |
    सहज सुभाव परयौ इन अँखियन, देखत हूँ अकुलाय ।
    टरत न टारी बदन चन्द्र सौं, पान करत न अघाय ॥ 
    छकी मत्त बलि जात रंक तऊ, महा तृषित पछिताय ।
    रोम-रोम मिलि एक हौंन कौं, अरवराय बौराय ॥ 
    डूबत थाह न रूप सिन्धु में, पैरत पार न पाय ।
    छबि की तुङ्ग-तरंगन झोकन, कहा मीन ठहराय ॥ 
    डूबत उछरत रहत निरन्तर, चैन नैकु हूँ नाय ।
    दरसन हानि अकबकी लागै, जहँ की तहँ न समाय ॥ 
    हेरत हहा हिराय जात हैं, अति व्याकुल विललाय ।
    इनकौं सुख न कहूँ सपनेहूँ, मिली-मिली बिलगाय ॥ 
    गद-गद कंठ हियौ भरि आयौ, कोये उमगि चुचाय ।
    आतुर उठीं भुजा भरि भोरी, चख चूमत बलि जाय ॥ 
- verseNumber: "184."
  verseText: |
    हिय के भीतर अरुझैं अँखियाँ, बाहिर कछू न दिखावैं ।
    हिय के भीतर श्रवण समावै, बाहिर की न सुनावैं ॥  
    हिय के भीतर बानी विरमै, बाहिर बचन न आवैं ।
    स्वाद घ्राण रस परस हिये में, बाहिर मन नहिं धावैं ॥ 
    हिय भीतर प्रगटै हित जोरी, सब द्वारे मूँदि जावैं ।
    तब हिय पैठि बैठि हित भोरी, उमगन लाड़ लड़ावैं ।
    हित कौ बन हित की ही जमुना , हित की कुञ्ज सुहावै ।
    हित के दम्पति हित की सजनी, हित सों हित दुलरावैं ॥ 
    भोरी हित हित ही की याचक, कृपा कोर हित पावैं ।
    हित तन हित मन हित की इन्द्रिय, हित हिय हितहि सिरावैं ॥ 
- verseNumber: "185."
  verseText: |
    हिय मेरौ प्यारी भयौ, नैना मोहन लाल ।
    नैना अटके हिय सौं, हित भोरी बेहाल ॥ 
    जब सौं वह छवि हिय गढ़ी, हिय गति कही न जाय ।
    नित सिरात नित ही तपत, टूटि-टूटि जुरि जाय ॥ 
    कठिन पीर है प्रेम की, बिरले जानें ताहि ।
    जो जानें ते कहैं नहिं,सहै सराहि-सराहि ॥ 
    ना काहू सों बोलिबौ, ना कोई ब्यौहार ।
    अपनी कुंवरि कृपालु कौं, जियत निहार-निहार ॥ 
    जिय तोहि ऐसी चाहिये, सब ही कि सहि लेहि ।
    घट-घट में प्रभु रमि रह्यौ, उत्तर काकौं देहि ॥ 
    तन छुटिवे लौं हद्द है, सहि लै मन धरि धीर ।
    क्यों इतनी ममता करै, कोटिन छाँड़ि शरीर ॥ 
    क्यों काहू कौं बाबरे, अपनों दुख सुनाय ।
    वह हिय में दु:ख पावई, तेरी पीर न जाय ॥ 
    रे मूरख क्यों चतुर बनि, अरुझत बारम्बार ।
    भलौ-भलौ कहि छाँड़ि दै, बहु बातन ब्यौहार ॥ 
    हठ करि पक्ष न रोपिये, नहिं करिये उपदेस ।
    सब सों नमि नीचे रहौ, छांडि बड़प्पन लेस ॥ 
    सब ज्ञानी सब ही चतुर, उर प्रेरक हित-चंद ।
    कहैं-करैं सो सब भली , तू न बोल मति मंद ॥ 
    कठिन पीर है प्रेम की, बिरले जानें ताहि ।
    जे जाने ते कहैं नहीं, जहैं सराहि-सराहि ॥ 
    जब सों वह छवि हिय गढ़ी, हिय गति कही न जाय ।
    नित सिरात नित ही तपत, टूटि-टूटि जुरि जाय ॥ 
- verseNumber: "186."
  verseText: |    
    आत्म -निवेदन

    हरिवंश हित जोरी उमगि, ऐसी कृपा मोपै करौ ।
    परिजाय यह जु सुभाव सहजहि, कबहूँ अन्तर जनि परौ ॥ 
    जे नाम मुख सौं लैहि तुम्हरौं, उमगि तिन पायन परौं ।
    तिन सौं सदा आधीन बनौं, दीन वाणी उच्चरौं ॥ 
    छवि रावरी देखत उमगि जे नैन जल भर लावहीं ।
    तिन दरस इक टक करत कबहूँ, नैन मम न अघावहीं ।
    जे प्रीति सों रस रीति के, मृदु गीत उमगत गावहीं ।
    ते प्राणहू के प्राण लागैं, सदा हिय मम भावहीं ॥ 
    अपराध मन क्रम वचन तिनके, कबहूँ जिन करबाइयो ।
    जैसे लहैं सुख सोई करौं, यह बुद्धि जिय उपजाइयो ॥ 
    अभिमान तिन सौं ना करौं,कबहूं बराबर ना बनौं ।
    मत्सर न कबहूं होय तिन उत्कर्ष हिय लखि सुख सनौं ।
    जो त्रासन कोटिन दैहिं मोकौं, शस्त्र लै लै मारहीं ।
    तऊ भाव बढती ही रहै, जिय लेश दुख मानें नहीं ॥ 
    नर-नारि साधु-असाधु राजा-रंक जिय में न धरौं ।
    जन रावरे जिय जानि मैं तौ दौरि पायँन ही परौं ॥ 
    अति पातकी अति स्वारथी लंपट न जिय जानौं तिन्‍हें ।
    जन जानि तुम्हरे नाथ तुम हूं ते अधिक मानों तिन्हें ॥ 
    मोसौं सदा सुख ही लहैं , मोपै कृपा नित ही करें ।
    यह बीनती साँची करौ, मेरी न वे सुधि बिसरैं ॥ 
    तिनकौ न छोड़ौं संग चाहे विश्व सब निन्दा करैं ।
    तिनसों न होय कुभाव तिनमें कोउ न अवगुण लखि परै ॥ 
    जौलौं जियों तिन संग रहि, तिनकी कृपा अनुभव करौं ।
    हित भोरी तिनके ढिंग मरों, ह्वै छार तिन पद पर परौं ॥ 
- verseNumber: "187."
  verseText: |
    भव सिंधु बही हौं जात ।
    बार-बार हरिवंश लाडिले, टेर-टेर अकुलात ॥ 
    नाना भौर तरँग कामना, इत उत गोता खात ।
    भोरी तुम सौं क्‍यों बन आबै, खड़े-खड़े मुसिकात ॥ 
- verseNumber: "188."
  verseText: |
    ऐसी क्यों बनि आवत प्यारी ।
    तुम ठाडो तट पै मुस्कावत, हौं डूबत भव सिंधु मंझारी ।
    व्याकुल चित्त शिथिल सब देही, परी भँवर हौं पैरत हारी ॥ 
    अब विलंब जिन करहु लाड़िली, पल-छिन कठिन जात सुकुमारी ।
    हौं भोरी पीछै पछितै हौं, आप आपनी ओर निहारी ॥ 
- verseNumber: "189."
  verseText: |
    मोहि टेरन की कछु बान परी री ।
    दानी बड़ी सुनी त्रिभुवन में, तासों द्वार पै आइ अरी री ।
    टरिहौं नहीं न याचहूँ औरें, अब तेरे द्वार डरी सो डरी री ॥ 
    अजरज हौं कब की जु पुकारत, भनक न अजहु कान परी री ॥ 
    तब हूं तौ मोरी बनि आई, हो भोरी यह कीर्ति खरी री ।
    कहि हौ बिकल कबहूँ इक कोऊ, भोरी टेरत तलफ मरी री ॥ 
- verseNumber: "190."
  verseText: |
    मोहि परी अड़िबे की बान ।
    तुम अजहूँ हेरत न कृपा करि, मैं टेरत हठ ठान ॥ 
    तुम पर हार जन्म हौं बैठी, श्री पद शपथ प्रमान ।
    अब बलिहार नैंक हँसि हेरो, भोरी आपनि जान ॥ 
- verseNumber: "191."
  verseText: |
    कोमल चित्त लाड़िली प्यारी, क्यों निष्ठुरता आनी ।
    कारण रहित कृपाल सुन्दरी, सर्वोपरि महारानी ॥ 
    अधम उधारन प्रगट लोक तिहूँ, कोमल चित ठकुरानी ।
    मेरेहि ओर न हेरत अजहूँ हौं टेरत अकुलानी ॥ 
    आपनि बानि न छांड़िय भोरी, मोहि अभागिन जानी ॥ 
- verseNumber: "192."
  verseText: |
    अब मैं काहि सुनावौं टेरी ।
    श्री राधाबल्लभ लाल लाडिले, ओर सुनै को मेरी ॥ 
    यह संसार मूंज-बन भटकत, विपत सही बहुतेरी ।
    अब पद कंज छाड़ि मन मधुकर, कित ले जावौं फेरी ।
    नहिं मांगौ बैकुण्ठ स्वर्ग कछु, माँगत लाज हियेरी ।
    भुक्ति-मुक्ति कौ भार चलै क्यों, क्षीण अवस्था मेरी ॥ 
    प्रीति रीति परबीन जुगल वर, गत जानों हिय केरी ।
    लाग्यौ नेह निबाहव भोरी, कृपा कोर सौं हेरी ।
- verseNumber: "193."
  verseText: |
    प्यारी हो, मेरी हृदय अकुलावै ।
    जमुना तीर मूंद दृग अब कब, चरण कमल चित लावै ॥ 
    अरबराय दृग खोलि निहारत, आरत टेर सुनावै ।
    कबहूँ भाग सराहत अपनी, रीझि-रीझि गुन गावै ।
    कबहूँ समझि अभाग सहमि, दृग जल ढारत मुरझावै ॥ 
    आयु सिरानी जात छिनहि छिन, धीरज नैक न आवै ।
    मन माने मन करत मनोरथ, हौंसन जन्म गवावै ।
    सहज कृपाल स्वामिनी भोरी, छिन इक दरसन पावै ॥ 
- verseNumber: "194."
  verseText: |
    सुनि राधे तोहि ऐसी न चहिये ।
    कब लौं नरक सरिस विषयन में, दारुण दुख सहैये ॥ 
    कब लौं कोटि प्रलय सी स्वामिनी, विरह अग्नि तनु दहिये ॥ 
    भोरी की स्वामिनी अलबेली, हठ बरबस भुज गहिये ।
    जन्म-जन्म लगि सहज किशोरी, नित नव नेह निबहिये ॥ 
- verseNumber: "195."
  verseText: |
    सुनौ विनय दे कान नवेली ।
    नंद-नन्दन बस करन राधिके, छबि निधि गरव गहेली ॥ 
    तौं बल साधन धर्म-कर्म-ब्रत, निगम-नीति हठ ठेली ।
    सहज कृपालु कृपा घर बैठे, चाहत लूट सकेली ॥ 
    भोरी पाँव पसारे सोवत, सिर स्वामिनी अलबेली ।
- verseNumber: "196."
  verseText: |
    कस न लाड़िली द्रवहु दया करि ।
    मेटहु विषम जगत की ज्वाला, सजल जलज से चरण हृदय धरि ॥ 
    सूझ परत न साधना कोऊ, चहूँ दिशि हेरत टेरत डरि-डरि ।
    भोरी मूर्छि परि तेहि भेटिय, लै उठाय उर लाय भुजा भरि ॥ 
- verseNumber: "197."
  verseText: |
    टेरि सुनौ वृषभान किशोरी ।
    बीती वृथा आयु बहुतेरी, शेष रही अति थोरी ॥ 
    मन अकुलात उपाय न सूझत, शरण गही दृढ़ तोरी ।
    भोरी सहज कृपालु निहारौ, नैक कृपा की कोरी ॥ 
- verseNumber: "198."
  verseText: |
    तुम तौ दोऊ रहत रस छाके ।
    नित नव हास विलास रास रस, मगन सदा सुख ताके ॥ 
    भोरी आरत टेरत द्वारे, बचन सुनै को ताके ।
    प्रण की लाज कृपालु सुन्दरी, हरौ अशुभ-शुभ वाके ॥ 
- verseNumber: "199."
  verseText: |
    हो प्यारी यह माँगे जु दीजै ।
    नित पद लग्यौ रहै अनुरागै, ऐसौ मो मन कीजै ॥ 
    मैं जु चहत तोहि भेंट चढावन, सो बरबस लै लीजै ।
    हौं हारत निज तन-मन-जीवन, जीति आपनौं कीजै ॥ 
    भोरी हित पद-कंज छटा कौ, आसा धरि-धरि जीजै ॥ 
- verseNumber: "200."
  verseText: |
    ऐसौ शुभ दिन कबहूँ जु आवै ।
    जमुना तट पै विकल विरहनी, दृग जल धार बहावै ॥ 
    जब दृग मूँदि उच्च स्वर टेरौं, स्वामिनी मृदु मुसिकावै ।
    जब हौं विकल परौं धरणी पै, भुज गहि आइ उठावै ॥ 
    कोटि चन्द्र छबि बदन मनोहर, मृदु मुसिकान सुहावै ।
    भोरी छिन दृग दरसन आसा, बार-बार ललचावै ॥ 
- verseNumber: "201."
  verseText: |
    कब हौं कुञ्ज गली चलि जैहौं ॥ 
    लै लै नाम पुकारत आरत, चहूँ दिसि चकित चितैहीं ।
    दरसन लोभ मगन हौं इक टक, हेरत पल न लगैहौं ॥ 
    आवत परम कृपालु स्वामिनी, लोट पन्थ में जैहौं ।
    भोरी अधर अरुण रँग रंजित, मुसिकन दृगन बसैहौं ॥ 
- verseNumber: "202."
  verseText: |
    देखत-देखत दिन सब बीते ।
    तुम अटूट अनुराग की दाता, हम अजहूँ रीते के रीते ॥ 
    हृदय न प्रेम न नैम नाम कौ, साधन सकल तजे अबहीते ।
    बिनु पद पंकज भोरी स्वामिनि, कितहूँ ठौर न ठीक सुभीते ॥ 
- verseNumber: "203."
  verseText: |
    बीत गये दिन सोच न अबहूँ ॥ 
    ध्यान कियौ छिन नाम लियौ ना, हृदय न भाव भयौ कबहूँ ।
    सन्त मार्ग तजि छाड़े कुल ब्रत, और कुकर्म किये सबहूँ ॥ 
    ठाँव न कोटि नरक में दीसत, नहिं पछितात बैठिकै लबहूँ ।
    भोरी की स्वामिनी अलबेली, चरण कंज की आसा तबहूँ ॥ 
- verseNumber: "204."
  verseText: |
    शरण-शरण कहि आरत ठानी ॥ 
    किये कुकर्म कोटि विधि जग में,प्रीति रीति बिनु सहमि सकानी ।
    लोक-वेद की रीति न जानी, निशि दिन विषय रही लपटानी ॥ 
    अब सूझत सब ही अँधियारौ, आयु सिरात जानि पछतानी ।
    तामस तन कछु भजन बनत ना, चरण विमुख मति अवगुनखानी ॥ 
    तिन भय विकल काँपत तन भोरी, दीन पुकार करी घबरानी ।
    कोमल चित्त कृपाल स्वामिनी, आरत टेर करत अकुलानी ॥ 
- verseNumber: "205."
  verseText: |
    चकित चितै चहूँ ओर पुकारी ।
    गहन विपिन संसार माहिं चहूँ, लागी विषय दवारी ।
    जरत देखिये साधन सब ही, भक्ति आदि सुखकारी ॥ 
    कितहूँ न ठौर भ्रमत मन मेरौ, पल छिन बीतत भारी ।
    त्राहि-त्राहि शरणागत भोरी, श्री वृषभान दुलारी ॥ 
- verseNumber: "206."
  verseText: |
    माई मोकौं बधिक भयौ मन मेरौ ।
    विषय डोर सौं बांधे मोकौं, खेंचि खेंचि झकझेरौ ॥ 
    दै-दै घाव तलफिवौ देखै, नित-नित नयौ बखेरौ ।
    कोटि जन्म कौ बैरी अजहूँ , करत न हाय निबेरौ ॥ 
    तिहि भय विकल पुकारत आरत, भोरी मोतन हेरौ ।
    सहज कृपालु अभय करि दीजै, श्री पद माहिं बसेरौ ॥ 
- verseNumber: "207."
  verseText: |
    रोकत चित्त रुकत नहीं प्यारी ।
    विषय प्रवाह बह्यौ ही जावै, रोकि-रोकि हठ हारी ।
    हां असमर्थ न कछु बन आवै, लगत नैंन अँधियारी ॥ 
    लीजै खेंचि कृपालु कृपा करि, प्रेम पाश गल डारी ।
    भोरी की अलबेली स्वामिनि, सब विधि राखन हारी ॥ 
- verseNumber: "208."
  verseText: |
    मो मन मोहि नित नाच नचावै ।
    विषयन में भटकै निशि बासर, नित नव त्रास दिखावै ॥ 
    हौं तासौं अति आरत टेरत,तो बिनु कौन छुड़ावै ।
    भोरी स्वामिनि बेर न कीजिय, तन मन अति अकुलावै ॥ 
- verseNumber: "209."
  verseText: |
    श्री वृषभान लाड़िली प्यारी, अब जिन बिलंब लगावौ ।
    मैं घबरात परी विषयानल, बेगि धाई किन आवौ ॥ 
    हौं त्रय ताप तप्त अति विह्वल, सो तुम सहज मिटावौ ।
    कोमल कमल चरण अति शीतल, हिय धरि हृदय सिरावौ ॥ 
    मो मन चञ्चल इत उत दौरत, तिहि निज रूप फँसावौ ।
    विषय महाविष पियत बरजि हठ, प्रेम सुधा रस प्यावौ ॥ 
    हौं इतनी जु कृपा करि, छिन इक सन्मुख आवौ ।
    कोटि चन्द द्युति फीकी करि कै, मंद-मंद मुसक्यावौ ॥ 
    प्यासे नैन चकोर वदन विधु, माधुरि पान करावौ ।
    मनमोहन मन हरन महाछवि, सो मम हृदय बसावौ ॥ 
    अधम उधारन सहज कृपानिधि, भुजा पकरि अपनावौ ।
    भोरी की अलबेली स्वामिनि, त्रिभुवन सुयश बढ़ावौ ॥ 
- verseNumber: "210."
  verseText: |
    हरि-हरि जन्म बीत्यौ जाय ।
    योग यज्ञ जप साधन संयम, सब ही कठिन दिखात ॥ 
    भक्ति न भाव न नेम नाम कौ, चित्त न छिन ठहरात ।
    विषय मत्त निज दशा निहारत, हौं पुनि-पुनि पछतात ॥ 
    बहु विधि यत्न हेरि हौं हारी, कछु नहिं बनत दिखात ।
    भय व्याकुल लै नाम तिहारौं, टेर-टेर अकुलात ॥ 
    भोरी की अलबेली स्वामिनि, सुनि-सुनि मृदु मुसिकात ॥ 
- verseNumber: "211."
  verseText: |
    कटि कसि मुकुट सम्भार स्वामिनी, वेगहि आवहु धाई ।
    विषय अग्नि की ज्वाल जरत तनु, भोरी अति घबराई ॥ 
    हेरत दिशा नाम लै तेरी, आरत टेर लगाई ।
    यह उद्धार समय है वाकौ, दुख अब सह्मौ न जाई ॥ 
    इतनी करहु कृपालु स्वामिनी, छिन इक प्रगटौ आई ।
    मन्द हास्य मुख कंज माधुरी, देखि जु नैन सिराई ॥ 
    सोई स्वरूप दृग भरौ सदा ही, सोई चहूँ ओर दिखाई ।
    रोम-रोम रमि रहै लाड़िली, तौ सब भाँति भलाई ॥ 
    पुनि न स्वर्ग वैकुण्ठ चहत कछु, नरकन सौं न डराई ।
    लीला नाम रूप जो तुम्हरौ, तिन मन रहै समाई ॥ 
    सेवा करै मगन मन निशि दिन, बहु विधि लाड़ लड़ाई ।
    गावत गीत माधुरी छाकी, लीला ललित लुभाई ॥ 
    करत मनोरथ बहु विधि नित-नित , तेरी आस सदाई ।
    अधम उधारन सहज कृपा करि, देहु जु आस पूजाई ॥ 
    जानत हौं सब ही बनि ऐहै, स्वामिनि तोरि बनाई ।
    भोरी बलि अलबेली अब ही, प्रगट करहु प्रभुताई ॥ 
- verseNumber: "212."
  verseText: |
    बैठी कहा रूप गर्वीली ।
    नँदनन्दन मन हरण लाड़िली, वारिज मुख पर भौंह लचीली ॥ 
    अधर बिंब रंजित मृदु हाँसी, शरद कोटि विधु बरन छबीली ।
    चिकुर चन्द्रिकन बीच अरध विधु, चिबुक चारु दृग चपल रसीली ॥ 
    कोमल तनु कोमल मन प्यारी, प्रीति रीति सँकोच लजीली ।
    हौं बूड़त भव सिंधु माँझ  अब, थकि-थकि देह भई सब ढीली ॥ 
    है इतनी उर उमंग लाड़िली, छिन इक देखो रंग रंगीली ।
    हा-हा अब विलंब नहिं कीजै, मत तरसावौ दिल दरदीली ॥ 
    भोरी की अलबेली स्वामिनि, श्याम सुन्दर रस रसिक रसीली ॥ 
- verseNumber: "213."
  verseText: |
    अब मोहि कछु ऐसी जान परै ।
    हौं जु पतित सब भाँति अभागी, स्वामिनि नहीं निज ढरनि ढरै ॥ 
    कांपत देह त्रास हिय भारी, अब न चित्त छिन धीर धरै ।
    साधन नेम न ठौर ठिकानौ, व्याकुल द्वार पै दीन ररै ॥ 
    कहौ कृपा करि कै अलबेली, भोरी शठ कित जाइ मरै ॥ 
- verseNumber: "214."
  verseText: |
    आपनि दिस देखत त्रास बढ़ै ।
    नीची अति सब ही पतितन में, का बनाय कै बात गढ़ै ॥ 
    का मुँह लै बिनती हठ ठानै, लाज सौं बैन न एक कढै ।
    अलबेली जु रुचै सोई कीजै, अब तौ भोरी असीस पढै ॥ 
- verseNumber: "215."
  verseText: |
    का मुँह लै बहु बिनय सुनावै ॥ 
    सबै भाँति पतितन में नामी, गढ़ि-गढ़ि कै बात बनावै ।
    झूठी प्रीति चलै किमि तोसौं, कैसे कौन कुकर्म छिपावै ॥ 
    विषयन में घूमत नित भोरी, भक्ति किये बिनु अति पछतावै ।
    याहू पै अचरज न कछू जो, अलबेली हँसि पार लगावै ॥ 
- verseNumber: "216."
  verseText: |
    विषय दवार लगी जग बन अति घोर ।
    सुनहु विनय अब मेरी नागरी नवल किशोरी ॥   
    मंजु कुञ्ज सुख पुञ्ज सु शीतल छाँव ।
    जमुना कूल कदम्बन स्वामिनि मोहि बसाव ॥ 
    भजन नहीं अनुराग न ठीक न ठाँव ।
    ताकौं बास बतावहु बरसानौ निज गाँव ॥ 
    मो मन ऐसौ करौ कृपा की कोर ।
    तजि पद पंकज विषय में कबहूँ रमै न फेरि बहोरि ॥ 
    नाम रटत निशि वासर झूमत नैन ।
    गाबत डोलौं ब्रज में श्री राधा जस बैन ॥ 
    रहसि निकुञ्ज देखि गोवर्धन भूमि ।
    फटै हृदय विरहाकुल पुनि-पुनि गिरौं जु झूमि ॥ 
    तुम हिय बसौ न दूजौ छिनहु दिखाव ।
    भाल कु अंक मेटि हठ भुजा पकरि अपनाव ॥ 
    दरस चटपटी बाढ़ै प्रेम अभंग ।
    आइ मिलौ तब कबहूँ लै नट नागर संग ॥ 
    श्याम तिलक पट श्यामा नदी सुहाइ ।
    श्यामा नाम आप लिय श्याम सौं नेह लगाइ ॥ 
    श्याम हृदय मम तामें नीके वास ।
    आइ करहु अलबेली मेटहु त्रास ॥ 
    टेढौ वेष भृकुटि तिमि लोचन रंग ।
    टेढ़ी मूरति टेड़े ही कौ निशि दिन संग ॥ 
    टेढ़ी मति अति मेरी टेढौ हीय ।
    टेढ़े आइ अडौ तहँ दोऊ प्यारी पीय ॥ 
    मिट सोच नित नव-नव होइ हुलास ।
    भागै दूर अभाग तम देखि चरन परकास ॥ 
    विनवत नित-नित भोरी आरति ठानि ।
    सुनि कृपालु अलबेली स्वामिनि मृदु मुसिकानि
- verseNumber: "217."
  verseText: |
    सुन मेरी विनय छबीली राधा, तू तौ करुणा सिन्धु अगाधा ।
    मैं सब भाँतिन अधम अभागी, तो पद -कंज नहीं अनुरागी ।
    सकल भाँति विषयन में पूरी, प्रीति-प्रतीत भजन सौं दूरी ।
    बीती आयु समुझि पछताती, तौहू फटै न दुख सौं छाती ।
    तू सब भाँति राखिवे वारी, सर्वोपरि अलबेली प्यारी ।
    नँदनन्दन बस करन छबीली, सहज कृपानिधि दिल दरदीली ।
    देखहु सहज कृपा की कोरी, विपिन विहारिन नवल किशोरी ।
    मेटहु सब भव ताप हमारी, सीतल चरण कंज हिय धारी ।
    भय सब हरौं नेंक हँसि हेरौ, हस्त कमल सिर ऊपर फेरौ ।
    चन्द्र बदन नीकी मुस्कावन, दृष्टि कृपामृत रस सरसावन ।
    छिन इक दरस दिखावौ नीकौ, सब सुख सिन्धु भांवती जीकौ ।
    साधन -साध्य न और सुहावै, दरस लालसा दृग अकुलावें ।
    बार-बार विनवौं कर जोरी, चरण शरण हठ राखिये भोरी
- verseNumber: "218."
  verseText: |
    सुन्दर श्याम सौं सीख उपाई ।
    दुखिया दीन सभीत लाड़िली, हौं  तोहि याचन आई ॥ 
    वाकौं बकी पयोधर लिप्ट्यौ, दीन्हौ गरल पिवाई ।
    तो पद कंज सजीवन हिय धरि, विष तन दियौ मिटाई ॥ 
    हौं जो विषम विषय विष पीयौ, हृदय ताप अधिकाई ।
    सोई चरण चहौं लै राखौ,तप्त हृदय सौं लाई ॥ 
    सो नाथयौ अहि-नाथ कालिया, त्रिभुवन भई बड़ाई ।
    तब पद नख-मणि मंजु छटा सौं, विष की व्यथा न पाई ॥ 
    हौं संसार महा अहि काटी, तासौं अति घबराई ।
    सोई पद नख-मणि छटा लाड़िली, याचत विनय सुहाई ॥ 
    दावानल तिन पान कियौ हौ, अग्नि प्रबल सुख पाई ।
    सजल जलज पद युगल तिहारे, सहजहि ताप बुझाई ॥ 
    हौं त्रय ताप तपत निशि वासर, पीर प्रचण्ड सदाई ।
    सो पद सीतल कंज कृपा करि, हिय पर धारौ आई ॥ 
    इन अति कठिन कुरोगन कौ कहूँ, कछु उपचार न माई ।
    तू तौ है अलबेली स्वामिनि, विश्व विदित प्रभुताई ॥ 
    देखि बिलम्ब भई अति व्याकुल, रोवत टेर सुनाई ।
    भोरी सहज कृपालु किशोरी, करुणा कहाँ भुलाई ॥ 
- verseNumber: "219."
  verseText: |
    आज लौं लखी न नैंन , आसहू कछू परै न,
    कौन भाँति धीर धरौं, कृपा सिन्धु स्वामिनी ।
    फाटत नहिं हीय हाय , छिन-छिन प्रति घटत आयु,
    विषयन में नयौ नेह, बाढ़त नित भामिनी ॥ 
    खान पान सोई ठाठ, प्रेम की मिली न बाट,
    सोच-सोच दिन कटै न, रोइ-रोइ जामिनी ।
    भोरी दृग बार-बार , व्यर्थ जन्म जिय विचार,
    अब तौ इक आस तोरी, नँदनन्दन कामिनी ॥ 
- verseNumber: "220."
  verseText: |
    मन में नहिं लाज नेंक, चित्त में न प्रेम टेक,
    सूझत नहिं यत्न कोऊ, बीतत दिन सकल जात ।
    विषयन रँग नैन रंगे, झूमत नहिं प्रेम पगे,
    बोलत नहिं रुकत कण्ठ, इत उत बहु करत बात ॥ 
    बाढ़त ना प्रेम हाय, विषयन चित फैसत जाय,
    बीतत सब जात आयु, साधन ना कछु लखात ।
    भोरी अति बड़ अभाग, चरनन नहिं प्रेम लाग,
    अब तौ सब भाँति लाज, स्वामिनि इक तेरे हाथ ॥ 
- verseNumber: "221."
  verseText: |
    देखन दै नैक छटा नीकी ।
    चहूँ दिशि ललित भूमि हरियाली, ऊपर झुकी घटा नीकी ॥ 
    चपला कोटि दिव्य द्युति मूरति, ठाड़ी मंजु अटा नीकी ।
    पल में हठ अपनाइय भोरी, निगम की रीति हटा नीकी ॥ 
- verseNumber: "222."
  verseText: |
    दरसन दै नैक बिहँसि प्यारी ।
    सहज कृपालु लाड़िली राधा, सर्वोपरि सुखकारी ॥ 
    जीति लियौ घनश्याम लाडिलौ, विहँसि अपुनपौ हारी ।
    वृन्दावन रजधानी राजत, तीन लोक सौ न्यारी ॥ 
    शिव सनकादिक सन्त मुनि महिमा, रहे विचार विचारी ।
    पचि हारे श्रुति बरनि-बरनि कै, क्यों हू न पायौ पारी ॥ 
    उमा रमा ब्रह्मादि भवानी, चाहत चरण छटारी ।
    त्रिभुवन विदित कृपालु किशोरी, सबकौं राखन हारी ॥ 
    युग-युग पतित अनेक उधारे, जस गावत श्रुति चारी ।
    भोरी ओर कृपा करे हेरौ , श्री हरिवंश दुलारी ॥ 
- verseNumber: "223."
  verseText: |
    बिनु देखे किमि होवै प्यारी नेहु,
    तासों नैक नैन भरि दरसन देहु ।
    तिरछी चारु नजरिया मृदु मुसिकान,
    उर में गड़े नैन छिन लखै न आन ।
    कुटिल भौंह मुख कंज सुभग कच चारु,
    छिन इक भरि दृग प्यारी लेहु निहार ।
    पुनि न बिसरिहौं कबहूं सुन्दर रूप,
    हिय में नित्य वसैहौं छटा अनूप ।
    जबही हीय आइ है मृदु मुसिकानि,
    तब कि लोक श्रुति रीति रहै कुलकानि ।
    जबहि माधुरी पिये बढ़ै उन्माद,
    भाजै तुरत अभाग धर्म-मरजाद ।
    जब पद पंकज रस मन रहै लुभाई,
    विषय महाविष चाखन फिर क्‍यों जाई ।
    कठिन प्रीति की रीति सुगम अति ताहि,
    छिन इक दर्शन देहु प्रगट ह्वै जाहि ।
    तासौं टेर-टेर नित बिनवत भोरी,
    देहु दरस अलबेली नवल किशोरी ॥ 
- verseNumber: "224."
  verseText: |
    जो कहूँ चरण कमल रति होवै ।
    तौ क्यों भटकत विषय गहन बन, जन्म अकारथ खोवै ॥ 
    तौ क्‍यों मित्र सभा मिलि बैठे, दीन भयौ युवती मुख जोवै ।
    करै कुकर्म कहौ कस दिन भर, रात निसंक कहौ किमि सोवै ॥ 
    हौं पछितात यही नित सोचत, कैसे चरण कंज मन लोभे ।
    कैसे हिय में लगे चटपटी, दरस प्यास निसि वासर रोवै ॥ 
    कैसे पुलकि-पुलकि गुण गावै, भाल कुअंक कौन विधि धोवै ।
    करहु कृपा अलबेली भोरी, तुम बिन कौन अशुभ सब खोवै ।
- verseNumber: "225."
  verseText: |
    दीजिये मोहि नेह की वान ।
    व्याकुल प्रेम अधीर निरन्तर, पुलकन रुदन हेर पछितान ।
    छिन -छिन मगन भाव मिलिवे के, प्रफुलित गात हर्ष मुसिकान ॥ 
    छिन-छिन जरत हियौ विरहानल, सहमि सूखि गिरीबौ मुरझान ।
    कबहूँ गदगद कंठ हर्ष सौं, रीझि-रीझि जस निर्मल गान ॥ 
    कबहूँ विरह पीर अति गाढ़ी, गुण गण गिन-गिन दिवस सिरान ।
    अड़त चकोर चन्द्र पै जैसे, रहत भौर ज्यूँ कंज लुभान ॥ 
    त्यों निशि बासर मत्त एक रस, रूप माधुरी करिबौ पान ।
    झूमत नैन अधिक श्रम चलिबौ, बैन सिथिल कछु सुनत न कान ॥ 
    मत्त गयंद मनहूँ रस छाके, चले छाँड़ि कुल-कान अलान ।
    अति अलिमस्त सबन सौं न्यारे, रहत अनन्य पतित्रत ठान ॥ 
    एक नाम हिय रहत समायौ, एक रूप पर वारत प्रान ।
    मुदित सम्भारत कच मुख छूटे, श्रवनन सुनत सरस बतरान ॥ 
    श्री हरिवंश चरण बल हिय में, श्यामा चरण-कञ्ज अभिमान ।
    याचक भोरी आस पुजावौ, दिल दरदीली कृपा निधान ॥ 
- verseNumber: "226."
  verseText: | 
    हो प्यारी, यह दीजिये दान ।
    जैसे दृगन हेरियत नित ही, जैसे झार बैठियत थान ।
    जैसे श्रवनन सुनियत शब्दन, तृषित कीजियत ज्यों पय पान ॥ 
    हाथ धोइ ज्यों करत रसोई, जैसे पीवत पानी छान ।
    हो प्यारी कबहूँ मोहि दैहौ, ऐसेहि सहज रसीली बान ॥ 
    निशि दिन रूप सुधारस पीवौ, प्रेम छकी करिबौ गुन गान ।
    नई-नई छवि नित्य हेरिबौ, नित्य बारिबौ कोटिन प्रान ॥ 
    कीजै विनय कान अलबेली, गरव गहेली कृपा निधान ।
    रसिक रसीली भोरी किशोरी, मंडन विमल वंश वृषभान ॥ 
- verseNumber: "227."
  verseText: |
    विनय करत मेरी बनि आई ।
    येहु बड़े भाग्य जो प्यारी, याचक तोरि कहाई ।
    याचक सबहि जगत में जेते, सुर-नर-मुनि समुदाई ॥ 
    मोसौं बड़ौ न याचक कोऊ,का मुख कहाँ बड़ाई ।
    जाकौ जाचत श्याम लाडिलौ, तीन लोक कौ साईं ॥ 
    भूरि भाग्य सौं भरी लाडिलौ, हौं तोहि जाचन आई ।
    यह तौ बात सबै विधि मेरी, अति आछी बनि आई ॥ 
    और द्वार मन जाइ न छिन अब, यह वर माँगहु माई ।
    दीजै सहज कृपा करि भोरी, सुनि श्यामा मुसिकाई ॥ 
- verseNumber: "228."
  verseText: |
    जब पाँव तुम्हारे देखौं, तब जन्म सुफल करि लेखौं ।
    जब पीर उठै हिय गाढ़ी, तब जानहूँ कछु रति बाढ़ी ।
    जब निशि दिन हृदय बसावौं, तब अपनौ भाग मनावौं ।
    जब देखि कै नैन सिराउं, तब आपनि आस पूजाऊँ ।
    जब टेरि कै पास बिठावौ, तब जिय की त्रास मिटावौ ।
    जब बाँह गहौं हँसि नीकी, तब करहु भांवती जीकी ।
    जब आइ भुजा भरि भेटौ, तब सूल हिये कौ मेटौ ।
    जब हेर कै अंक लगावौ, तब तन की ताप बुझावौ ।
    जब बाँह पकरि अपनेहौ, तब सब सौँ नेह छुड़ैहौं ।
    जब लगि नहिं आस पुजैहौं, तब लग नित टेर सुनैहौ ।
    तब लग मैं परम अभागी, जब लग नहिं पाँव सौं लागी ।
    इति गदित भोरी अकुलाई, तुम छमियो मोरि ढिठाई ॥ 
- verseNumber: "229."
  verseText: |
    कुमति कुटिल पन सब हरियो ।
    रँग रँगीली सौं रँग बढ़े नित, रँग रँगीले कृपा करियो ॥ 
    रसिक रसीले ससि सरसीले, दिल दरदीले अवसि ढरियो ।
    भोरी प्यारी पद रस चाहत, हठ कर भुजा पकरियो ॥ 
- verseNumber: "230."
  verseText: |
    अजहूँ कस न उठत अकुलाई ।
    डूबत भव निधि माहिं छिनक में, कठिन घरी चली आई ।
    थकि-थकि शिथिल भई सब देही, बनि नहिं परत उपाई ॥ 
    दरसन कौं तरसावत अबहूँ, फिर रहिहौ पछिताई ।
    कोमल चित कृपालु बलि भोरी, दया सिन्धु सुखदाई
- verseNumber: "231."
  verseText: |
    जो कबहूँ मुख देखन पावौं ।
    इकटक रीझ रहौं वा छबि पर, छिन न निमेष लगावौं ॥ 
    ताही रँग रँगौं दोऊ अखियाँ, पुतरिन माँहिं बसावौं ।
    छिन-छिन पियत सरुप माधुरी, इक रस द्यौस गंवावौं ॥ 
    नाचत हँसत मत्त रस छाकी, डोलत जगत हँसावौं ।
    भोरी सपनेहु आन न देखौं, देह-गेह बिसरावौं ॥ 
- verseNumber: "232."
  verseText: |
    कबहूँ नैन भरि रूप दिखावौ ।
    नेना दरस रूप रस प्यासे, अब न बहुत तरसावौ ॥ 
    मृदु मुसिकान मनोहर आनन, तनक-तनक दरसावौ ।
    भोरी व्याकुल बिलपै कब लगि, सपने नेंक हंसावौ ॥ 
- verseNumber: "233."
  verseText: |
    हिय में आइ बसौ वर जोरी ।
    दीन्हैं जुगल विमल गलबाँहीं, सोभा सुखद न थोरी ॥ 
    मंद-मंद मुसिकात लाडिले, नागर नवल किशोरी ।
    भोरी श्री हरिवंश चरण बल, आस पुजावौ मोरी ॥ 
- verseNumber: "234."
  verseText: |
    रसना कौ अब नाम मिटावौ ।
    कै यह सरस् करौ रस दाइनि, कै जर सौं उपटावौ ।
    बहु बकवाद स्वाद सौं रोकौं, आपन नाम रटावौ ॥ 
    पर निन्दा पर अस्तुति बरजौ, निज गुन-गन प्रगटावौ ।
    भोरी दासी मूक भली नतु, जर सौं याहि कटावौ ॥ 
- verseNumber: "235."
  verseText: |
    नूपुर की झनकार सुनावौ ।
    हौं व्याकुल दृग मूंद पुकारत, रुनक झुनक चलि आवौ ॥ 
    तन मन अति अकुलात दयानिधि, धीरज आइ बंधावौ ।
    भोरी बलि अलबेली कबहूँ, सपने दरस दिखावौ ॥ 
- verseNumber: "236."
  verseText: |
    मन मेरौ बार-बार ललचावै ।
    लोचन रहत रूप के प्यासे, धीरज नैंक न आवै ॥ 
    उर में बढ़त विरह दिन दूनौ, असन बसन नहिं भावै ।
    भोरी परम कृपालु स्वामिनी, सपने दरसन पावै ॥ 
- verseNumber: "237."
  verseText: |
    दरसन दीजै नैक दया कर ।
    हास-चाँदनी हँसि छिटकाबौ, मेटहु हिय कौ तिमिर कृपा कर ॥ 
    भव की ताप मिटाइय प्यारी, चितबहु नयन कोर करुणाकर ।
    भोरी दृग रस विकल चकोरी, अलबेली मुख विमल सुधाकर ॥ 
- verseNumber: "238."
  verseText: |
    मधुर-मधुर हँसि बचन सुनावौ ।
    श्रवन माधुरी रस के प्यासे, तिन्है सुधारस प्यावौ ॥ 
    दसन चाँदनी जग विस्तारी, दृग कौ तिमिर मिटावौ ।
    अधर अरुणई विमल छटा सौं, हृदय प्रेम सरसावौ ॥ 
    रूप सुधारस बरसि-बरसि कें, सब भव ताप मिटावौ ।
    नैंन कृपा रस बरसत भोरी, सबहिं भाँति अपनावौ ॥ 
- verseNumber: "239."
  verseText: |
    रंग रंगीली के रंग रँगौंगी ।
    अब लगि सोवत रही लुभानी, अब तौ अवसि जगौंगी ॥ 
    अब न काहु की ओर चितेहौं, दृढ़ है पगन लगौंगी ।
    या विधि सोचि-सोचि कै प्यारी, प्रीति के दाग दगौंगी ।
    भोरी बलि हँसि कहौ कृपानिधि, कब हौं प्रेम पगौंगी ॥ 
- verseNumber: "240."
  verseText: |
    नैननि बसौ नवल नवेली ।
    वृन्दावन रजधानी राजत,जुगल करत नित केलि ॥ 
    दोऊ मिलि कुञ्ज-निकुंजनि डोलत,भुजा अंस पर मेली ।
    जीति लियौ घनश्याम लाड़िली, तिहि बल गरब गहेली ॥ 
    तो बल निदरि वेद के साधन, सन्त सीख हठ ठेली ।
    अब गहि भुजा राखिये भोरी, बिलपत बिकल अकेली ॥ 
- verseNumber: "241."
  verseText: |
    या जीवन कौ करौं कहा री ।
    बिन नख चन्द छटा अलबेली, तिहूँपुर अति अँधियारी ॥ 
    नैन पसारि कहा अब देखिय, सुनिये कान पसारी ।
    कौन भाँति मन धीरज धरिये, बैठि बिचार बिचारी ॥ 
    परम कृपालु लाड़िली राधा, त्रिभुवन कीर्ति उजारी ।
    भोरी पर इतनी निठुराई, काधौं कहौं पुकारी ॥ 
- verseNumber: "242."
  verseText: |
    ऐसी प्रीति देहु मन माहीं ।
    बिनु पद पंकज विमल छटा के, मन कहूँ जावै नाहीं ॥ 
    प्रमुदित मत्त रूप रस छाक्‍यौ, फिरे कदम्बन छाहीं ।
    हँसत विलोकै भोरी किशोरी, लाल देत गलबाहीं ॥ 
- verseNumber: "243."
  verseText: |
    ऐसौ जीवन कब लौं जीजै ।
    लीला ललित जबहि सुधि आवै, हियरा भरि-भरि लीजै ।
    पंकज पाँव छटा कौं तरसत, तन निशि वासर छीजै ।
    भजन भाव बिनु बरबस पुनि-पुनि , विषय महा विष पीजै ॥ 
    तन मन अकुलत बैठि उमंगन, रचि-रचि बिनती कीजै ।
    तौहू हिय रीते कौ रीतौ, रति-रस नैकु न भीजै ॥ 
    झौंकिय भार शस्त्र हिय छेदिये, घोर गरल लै पीजै ।
    कहा करौं कछु बनत न भोरी, प्राण कौन विधि दीजै ॥ 
- verseNumber: "244."
  verseText: |
    कबहूँ हृदय प्रेम रस भीजै ।
    पीजै रूप उमंगन जीजै, प्राण निछावर कीजै ॥ 
    तन मन वारि वारि पद पंकज, देखि-देखि कै जीजै ।
    भोरी हिय अकुलात कृपानिधि, हँसि-हँसि दरसन दीजै ॥ 
- verseNumber: "245."
  verseText: |
    तुम अनेक चंचल अपनाये । 
    सबमें चंचल रसिक साँवरे, जेहि हिय रहत लगाये ॥  
    चंचल  नैन भौह अति चंचल, चंचल बदन सुहावे । 
    चंचल चरण कंज कर चंचल, चंचल हिय मन भावै ॥  
    चंचल द्युति सब अंगन छाई, कवि जन कहत विचारी । 
    चपला कोटि चमक चपलाई, चंचल मूरति प्यारी ॥  
    चंचल मो मन कीन अपनावौ, क्यौं धारी निठुराई । 
    भोरी दृग भरि देखन आसा, टेर टेर अकुलाई ॥   
- verseNumber: "246."
  verseText: |
    बाढ़ै प्रीति हृदय केहि भाँती ।
    यमुना तीर विकल तनु डोलौं, चुवत नैन जल स्वाती ॥ 
    जुगल नाम की रट नित लागै, टेर-टेर अकुलाती ।
    ढूँढ़त जुगल लाडिले कुञ्जन, फिरहूँ रूप रस माती ॥ 
    पुलकित गात देह सुधि बिसरी, गुण गावत दिन राती ।
    यह विधि भाग जगै कब भोरी, जरत सोच सों छाती ॥ 
- verseNumber: "247."
  verseText: |
    झूठौ भयौ दृगन कौ नेम ।
    तब तौ नीर बहाबन लागे, अति ही काचे प्रेम ॥ 
    दृग भरि कछु न देखन हु की, हठ तब कीन्‍ही होई ।
    अब पुनि विषयन ढूंढन लागे, निलज लाज सब खोई ॥ 
    मेरे ह्वै मोसों बैर विसायौ, कुसमय धोखो दीन्‍हौ ।
    का मुख कहों अनीति कृपानिधि, जन्म अकारथ कीन्हौ ॥ 
    जड़ कठोर ताहू पै चंचल, तिनहूँ दोष न भोरी ।
    तुम तौ कृपा कोर टुक हेरौ, कोमल चित्त किशोरी ॥ 
- verseNumber: "248."
  verseText: |
    तुम रूठत सब रूठत प्यारी ।
    तेरी कृपा कृपा सब ही की, तो रिस विपद सदारी ॥ 
    जब सौं तुम उर धरि निठुरता, सब ही प्रीति विसारी ।
    मन-इन्द्रिय-काया करुणा निधि, अधिक शत्रुता धारी ॥ 
    रोके रुकत न बरजे मानत, चाहत बात बिगारी ।
    जिनकौं कहत हुतौ नित आपनौ, जिनकौ भरोसौ भारी ॥ 
    सोतौ ऐसे भये कृपानिधि, निलज लाज लौं टारी ।
    झूँठ साँच तुम सब ही जानत, कीजै न्याव बिचारी ॥ 
    हौंतौ आरत हरण कृपानिधि, जस गावत श्रुति चारी ।
    भोरी बेगि कृपा करि हेरी, अधम निबाहन हारी ॥ 
- verseNumber: "249."
  verseText: |
    एक सोच नित ही उर मेरे ।
    सोच न लोचन पोचन ही कौ, निशिदिन विषयन हेरे ॥ 
    सोच नहीं पद कंज बिसारे, प्रेम भाव बिनु पाये ।
    सोच नहीं मन सदा विषय के, रहत लोभ ललचाये ॥ 
    गरजत काल सामने ठाड़ौ, सोच ताहू कौ नाहीं ।
    घोर यातना सुनत नरक की, सोच नहीं मन माहीं ॥ 
    इतनौ सोच कृपाल किशोरी, कोमल चित सुकुंवारी ।
    नित की बान छाड़ि के भोरी, अब तौ निठुरता धारी ॥ 
- verseNumber: "250."
  verseText: |
    बैठि-बैठि नित सोचिबौ कीजै ।
    रचि-रचि विनय नित्य ही कहिये, रोइ-रोइ कै जीजै ।
    इत अभाग उत बान कृपा की, सोचत नित तन छीजै ॥ 
    लीला ललित जबहि सुधि आवै, हियरा भरि-भरि लीजै ।
    भोरी सहज निठुरता पर हू, प्राण निछावर दीजै ॥ 
- verseNumber: "251."
  verseText: |
    भलौ-भलौ सब ही कौं प्यारौ ।
    खोटी कुटिल कुबुद्धि अभागी, मोहि सकल मिलि टारौ ॥ 
    औरन की का कहौं कृपानिधि, को जग हितू हमारौ ।
    अपने कहियत इन्द्रिय-काया, घनौ बैर उर धार्यौ ॥ 
    अब तौ ठौर कहूँ नहिं सूझत, मैं सब भाँति विचार्यौ ।
    तुम ही सहज कृपा करि भोरी, चरण शरण प्रतिपारौ ॥ 
- verseNumber: "252."
  verseText: |
    इतनी बात कृपा करि दीजै ।
    सब ही सुख अति खारी लागै, विरह ताप तन छीजै ॥ 
    सोच-सोच दृग ढारत आँसू, नैन नींद नहिं आवै ।
    हा राधे मेरो और न कोऊ, टेर-टेर अकुलावै ॥ 
    नाम रटै चौंकै चहूँ हेरे, पुलके सकल सरीरा ।
    मिल्वे की अति लगै चटपटी, पल छिन परै न धीरा ॥ 
    हिय में पीर उठे अति गाढ़ी, छिन-छिन फाटै छाती ।
    ऐसी कृपा करौ अलबेली, करुणा कोमल गाती ॥ 
- verseNumber: "253."
  verseText: |
    इतनी बात माँगिवे आई ।
    तेरे द्वार दीन नित टेरौं, छिन हू आस करौं न पराई ।
    नित प्रति प्रीति नाम सौं तेरे, दरस आस नित रहौं लुभाई ॥ 
    रसिक संग हिय ध्यान चरण कौ, गाढ़ी पीर हिये अधिकाई ।
    कुगति-सुगति कौ सोच न भोरी, करियो जो कछु तुमहिं सुहाई ॥ 
- verseNumber: "254."
  verseText: |
    सोबत बीत गईं बहु रतियाँ ।
    कानन सुने न दोऊ रँग भीने, करत भाँवती बतियाँ ॥ 
    सैनन माहिं संकेत बतावत, पुरबत रति रस घतियाँ ।
    भोरी सो छवि सुमिरत अजहूँ, दुख सों फटत न छतियाँ ॥ 
- verseNumber: "255."
  verseText: |
    जन्म सब योंहि बीत गयौ ।
    प्रीति रीति हिय माहिं न जागी, नहिं सत्संग भयौ ॥ 
    कोटि कुकर्म किये निसि बासर, छिनहूँ न नाम लह्यौ ।
    भजन -भावना हिये न परसी, विषयन सहज गह्यौ ॥ 
    हा राधे नहिं कोऊ मेरौ, कबहूँ न टेरि कह्यौ ।
    सब ही भाँति कुटिलपन लीन्हों , कोटि प्रपंच ठयौ ।
    अब अबलम्ब न कोऊ सूझत, तन मन बिकल भयौ ।
    एक कृपालु बान कौ भोरी, हिये भरोस रहौ ॥ 
- verseNumber: "256."
  verseText: |
    मोसौं मोसी करौ तौ कहा बसि आई ।
    सहज कृपालु किशोरी राधे, का मुख कहौं बनाई ॥ 
    कोटि जन्म जो बसौं नरक में, नित नव त्रास सदाई ।
    तौहू निघटै नहीं किशोरी, मेरी कुमति कमाई ॥ 
    सो सब उचित सुनौ करुणानिधि, आयु जो व्यर्थ गँवाई ।
    पतित उधारण चरण न ध्याये, विषयन रही भुलाई ॥ 
    तोसों प्रीति करी नहिं प्यारी, अब उघरी सठताई ।
    तैं छिन हूं मेरी सुधि न बिसारी, मैं छिन-छिन चितलाई ॥ 
    याहू पै जो सहज कृपानिधि, हठ राखौ सकुचाई ।
    भोरी नीच कहा मुख भाखै, तुम ही सौं बनि आई ॥ 
- verseNumber: "257."
  verseText: |
    मोसौं मोसी करौ तौ कहा बस मेरौ ।
    सुनौ कृपालु किशोरी राधे, अब तौ आसरी तेरौ ।
    कोटिक जन्म नरक में भोगूँ, सहि-सहि त्रास घनेरौ ॥ 
    ऐसे पातक पुञ्ज कृपानिधि, तदपि न होय निबेरौ ।
    अब तौ ठीक-ठौर नहिं सूझत,नैननि लगत अँधेरौ ॥ 
    कहियत यही किशोरी प्यारी, कृपा कोर टुक हेरौ ।
    भोरी हिय सौं छिनहु टरौ जिन, निशि दिन साँझ-सबेरौ ॥ 
- verseNumber: "258."
  verseText: |
    यही सोच हिय अजहुँ न टूट्यौ ।
    सहज कृपालु किशोरी पद तजि, विषयन कौ रस घूट्यौ ॥ 
    ता पर और निलजता ऐसी, प्रेम जनावत झूठ्यौ ।
    भोरी कहा कहै करुणानिधि, भाग्य सबै विधि फूट्यौ ॥ 
- verseNumber: "259."
  verseText: |
    यही सोच हिय फटत न छाती ।
    सहज कृपालु कृपा लखि तेरी, दरकत कुलिस सिला पिघलाती ।
    यानै ऐसी गही निलजता , कहा कहौं कछु कही न जाती ॥ 
    पद सौं प्रीति होत न प्यारी, झूठौ प्रगट प्रेम बहु भाँती ।
    अब तौ कृपा करौ अलबेली, भोरी प्रीति बिना पछताती ॥ 
- verseNumber: "260."
  verseText: |
    यह इक सोच रहत मन मांहीं ।
    सहज कृपालु किशोरी चरणन यह मन लागत नाहीं ॥ 
    गढ़ि-गढ़ि मुख बहु बात बनावै हिय रीती की रीती ।
    ऐसे कहौ रीझिहौ कैसे अति ही काची प्रीति ॥ 
    हौं तौ प्रीति करत परघट की तुम घट-घट की जानौ ।
    बड़े भाग्य जो काची प्रीति हिय साँची कर मानौ ॥ 
    नातर सहज कृपालु किशोरी प्रीति रीति हिय दीजै ।
    भोरी बलि-बलि जाइ चरण पै सोच पोच हरि लीजै ॥ 
- verseNumber: "261."
  verseText: |
    मन तैं काके चरण विसारे ।
    सहज कृपालु किशोरी राधे, हरिजू जाके झाँकत द्वारे ॥ 
    शिव ब्रह्मादिक पद रज चाहत, गूढ़ भाव उर धारे ।
    महिमा अमित कहा कहि वरनौ , वेद सबै पचि हारे ॥ 
    यह प्रभाव तउ बान कृपा की, पतित अनेक उबारे ।
    आवत धाइ बेर नहिं लावत , आरत टेर पुकारे ॥ 
    सो कृपालु सौं विमुख भयौ तैं, छिन न नाम उच्चारे ।
    धृग-धृग निलज प्राण ये भोरी, अजहूँ टरत न टारे ॥ 
- verseNumber: "262."
  verseText: |
    बिनती सुनौ अधम प्रतिपाला ।
    हिय में दीजै मिलन चटपटी उर में बिरह विसाला ।
    छिन-छिन चहुँदिशि फिरि-फिरि देखौं आबत जान कृपाला ॥ 
    सजल नैन गदगद स्वर पुलकत टेरौं नाम रसाला ।
    दीप शिखा लौं जरौं दिवस निस कठिन बिरह की ज्वाला ॥ 
    ऐसी प्रीति रीति हिय दीजै करुणा सिन्धु दयाला ।
    भोरी पामर दीन पुकारत सुनौ नवल ब्रज बाला ॥ 
- verseNumber: "263."
  verseText: |
    या मन की शठता हठ रोकौ ।
    काची प्रीति कहा फल पैहै, हरहु सकल भ्रम धोखौ ।
    साँची प्रीति हिये में दीजै, करुणा कोर विलोकौं ॥ 
    तुम ही नेह निबाहौ प्यारी, पार लगावौ मोकौं ।
    हौं तौ प्रीति रीति बिनु भोरी आरत टेरत तोकौं ॥ 
- verseNumber: "264."
  verseText: |
    कहँ मैं कुटिल कुमति अघरासी ।
    कहँ विधि हरि-हर अगम चरण रज अलबेली राधा सी ॥ 
    सहज कृपालु कृपा की आसा, ठानी बिनती खासी ।
    मुख आबत सो कहत कृपा निधि, प्रीति रीति की प्यासी ॥ 
    उर में बिरह-पीर हँसि दीजै, करि दृढ़ चरण उपासी ।
    भोरी सहज किशोरी राधे, दीजै कुञ्ज खवासी ॥ 
- verseNumber: "265."
  verseText: |
    कहँ मैं पापी मूढ़ दुराचारी,
    कहँ विधि हरि-हर अगम चरण रज प्यारी ।
    कहँ श्रुति अगम श्याम नट नागर,
    लीला ललित कृपालु रस सागर ।
    कहँ हरिवंश जुगल वपु लीन्हें,
    चरण शरण प्रतिपाल माधुरी भीने ।
    मैं तौ कुटिल कुमति अघरासी,
    सन्‍तन कौ मग छाँड़ि विषय अभिलाषी ।
    हौं तौ सबै भाँति बिसराई,
    तद्यपि सहज कृपाल न मोहि भुलाई ।
    कुलिस कठिन हिय फटत न मेरी,
    तदपि अधम प्रतिपाल आसरौ तेरौ ।
    हौं तौ प्रीति करी अति काची,
    तुम अब देवहु पीर हिये अति साँची ।
    मुख बहु बिनय करौ केहि भाँती,
    भोरी उर यह सोच फटी नहिं छाती ॥ 
- verseNumber: "266."
  verseText: |
    कठिन अभाग्य कहा मुख कहिये ।
    आपनि खोटी दसा दयानिधि, देखि-देखि चुप रहिये ॥ 
    सागर बास नीर कौ टोटौ, अग्नि ज्वाल सौं दहिये ।
    कल्पवृक्ष की छाँह कुटी रचि, भूख प्यास नित सहिये ॥ 
    कैसे दूर कहौं करूणानिधि, रोम रोम में कहिये ॥  
    इतने निकट कृपालु किशोरी, तऊ न दरसन लहिये ।
    भोरी भाग्य कुटिलता ऐसी, सब कछु सहिबौ चहिये ॥ 
- verseNumber: "267."
  verseText: |
    कौन भाग्य भरि नैन निहारौ ।
    बिनु नख चन्द्र चन्द्रिका देखे, त्रिभुवन सब अँधियारौ ॥ 
    सहज छबीली छबि के ऊपर, त्रिभुवन सोभा वारौ ।
    भोरी छिन इक़ दरसन कारण, कोटि प्राण तजि डारौ ॥ 
- verseNumber: "268."
  verseText: |
    भाग अभाग कर्म गति न्यारी ।
    भागवान कौ सब ही मङ्गल, भाग्य हीन कौं दुखद सदारी ॥ 
    यह नित चाल बिलोकी जग की, अचरज एक तहाँ ये प्यारी ।
    सकल अभाग्य हरण करुणानिधि, भाग्यहीन लखि बान बिसारी ॥ 
    कछु बस नहीं न कछु कहि आवै, खोटी पामर दीन दुखारी ।
    असरण-सरण न केहि अपनायौ, सहज कृपालु कृपा न बिचारी ॥ 
    अधम उधारण को न उधारयौ, जुग-जुग बिदित कहत श्रुतिचारी ।
    भोरी बिरियाँ रीति बिसरि गई, आरत टेरत-टेरत हारी ॥ 
- verseNumber: "269."
  verseText: |
    अधम उधारण सुनियत प्यारी ।
    पतितन पै नित बान कृपा की, जस गावत श्रुति चारी ॥ 
    ह्याँते  चूक परी नहिं मोपै, सब में प्रथम सदारी । 
    कोटि पतित नहिं सरवर मेरे, कहौं पुकारी ॥ 
    तौ हू परम कृपालु किशोरी, क्यों न द्रवी सुकुंवारी ।
    इतनी हौ हँसि कहौ कृपानिधि, अब हिय कहा बिचारी ॥ 
- verseNumber: "270."
  verseText: |
    ऐसी तोहि कि बूझिये वृषभान किशोरी ।
    तू घन हौं चातकी , तू चन्दा हौं चकोरी ॥ 
    तू जल हौं मीन प्यारी, तू दानी हौं भिखारी ।
    तू पतित पावन हौं पतित, इक आस नित तिहारी ॥ 
    तू आरत हर हौं दीन दुखी, आरत नित टेरौं ।
    चिन्तामणि तू रंक सु मैं, चहत शरण तेरौं ॥ 
    तू स्वामिनि सबल सदा, दासि नवल भोरी ।
    हौं तौ छिन चहत दरस, मन्द हँसन थोरी ॥ 
- verseNumber: "271."
  verseText: |
    ऐसी तोहि कि बूझिये वृषभान दुलारी ।
    वेद विदित प्रणतारति भंजन , सबकौं  सुखद सदारी ॥ 
    हौं तौ चरणन तिहारे, पुनि-पुनि टेर पुकारी ।
    मेरी लाज रावरे हाथन, मुख सौं कहां कहारी ॥ 
    हौं तौ किये कुकर्म , कोटि विधि लादयो बोझौ भारी ।
    विषय विपिन कुञ्जर , ज्यौं मातौ, तकत धाम-धन-नारी ॥ 
    ठाड़े गगन बाट यम देखत, हँसत देत कर तारी ।
    सब विधि निज बस जानि, भयंकर नरक रहे मुँह फारी ॥ 
    तब कछु सूझ परी न कृपानिधि, सब बिधि आयु बिगारी ।
    अब पुनि ठीक ठौर नहिं सूझत, लगत नयन अंधियारी ॥ 
    गाढ़े संकट कोऊ न सहायक, सोच-सोच हिय हारी ।
    भोरी करत बिलम्ब कहा अब, पोच निवाहन हारी ॥ 
- verseNumber: "272."
  verseText: | 
    मैं तौ प्रीति करी अति काची ।
    झूठौ भजन भावना झूठी, कोटि कुटिलता साँची ॥ 
    साँची झूठ झूठ की साँची, तो बिन कौन करै री ।
    इतनी समरथ और कौन की, जसौं काज सरै री ॥  
    तुम सर्वोपरि सहज कृपानिधि , वेद विमल यश गावै ।
    जो तुम सहज कृपा उर धारौ, तौ सब विधि बनि आवै ॥ 
    सहज कृपालु किशोरी राधे, जो यह कीरति साँची ।
    तौ यह विनय सत्य हठ कीजै, भोरी जो मन राँची ॥ 
- verseNumber: "273."
  verseText: |
    झूठी प्रीति हिये में मेरे ।
    साँची कोटि कुकर्म कुटिलता, पातक पुञ्ज घनेरे ॥ 
    ऐसौ कौन कृपालु किशोरी, अवगुण चित्त न आनै ।
    झूठी किंचित प्रीति कृपानिधि , ताहि सत्य करि मानै ॥ 
    कोटि कुटिलता चित्त धरै नहिं, आरति सुनि प्रतिपारै ।
    नातौ प्रीति रीति कौ मानै, सबही दोष विसारै ॥ 
    ऐसौ और दिखात न तिहुँपुर, सोच-सोच हिय कारी ।
    अब तौ द्वार रावरे भोरी, आरत टेर पुकारी ॥ 
- verseNumber: "274."
  verseText: |
    प्रीति रीति उल्टी जग गाई ।
    काहू सौं सो बन न परत है, जस तुम सौं बनि आई ।
    प्रीति-रीति परबीन राधिके, सब मे श्रेष्ठ सदाई ॥ 
    उलटौ जो मानों करुणाकर, तौ सब भाँति भलाई ।
    झूठौ प्रेम सत्य करि जानौ, झूठी करि कुटिलाई ॥ 
    बिन आगस-अपराध रुठिवौ, श्री हरिवंश बताई ।
    बिनु गुन क्यों न रीझिये तैसे, सब ही दोस विहाई ॥ 
    ज्यों-त्यों बाँह गहौ अलबेली, कृपा करौ मुसिकाई ।
    भोरी की तुम भोरी स्वामिनि, चतुरन चतुर सदाई ॥ 
- verseNumber: "275."
  verseText: |
    सुनि राधे तोहि ऐसी न चहिये ।
    तुम घन हौं चातक रस प्यासी, कब लौं दीन रटैये ।
    तुम आधार एक ही मोकौ, कहि-कहि कहा सुनैये ॥ 
    क्यों नहिं सहज कृपालु कृपा करि, माधुरि नैन पिवैये ।
    भोरी यह न उचित अलबेली, काहे कौ देर लगैये ॥ 
- verseNumber: "276."
  verseText: |
    तुम सौं बात हिये की कहिये ।
    भजन-भक्ति बन परत न मोसौं,काहे कौं बात बनैये ।
    विषयन सौं मन रुकत न रोक्यो, रोकि-रोकि रह जैये ॥ 
    दीजै प्रीति हिये करुणानिधि , बिरह अधिक सरसैंये ।
    व्याकुल देह रटत श्रीराधा, नैनन नीर ढरैये ॥ 
    तन मन की न सम्भार रहै कछु, इतनी आस पुजैये ।
    और कहा मुख मांगो भोरी, छिन इक छटा दिखैये ॥ 
- verseNumber: "277."
  verseText: |
    तुम सौं कहत हिये की बात ।
    ऐसौ मन यह करहु कृपानिधि, जस कछु मोहि सुहात ।
    विष सम सब सुख लगै किशोरी, बिना चरण जलजात ॥ 
    नाते कुटुम मित्र सुत नारी, जननि जनक अरु भ्रात ।
    बिनु पद पंकज दुखद सब लागै ज्यों चकई कौ रात ॥ 
    तुम बिनु और न नेह काहु सौं, नहिं दृग देख्यौ जात ।
    भरि-भरि नैननि नीर बहावौ, सोचत दिवस बितात ॥ 
    इतनी करहु कृपा अलबेली, तन मन अति अकुलात ।
    भोरी भाग अभाग लाड़िली, एक तिहारे हाथ ॥ 
- verseNumber: "278."
  verseText: |
    या जीवन की चरचा न चलैये ।
    प्राणनाथ सौं पोच प्राण की, बात कौन विधि कहिये ॥ 
    असन-बसन-तन सोचि पोच सब, पानी माहिं बहैये ।
    मिलन आस पर तन मन वारिय, बड़े भाग्य जो पैये ॥ 
    नातर बैठि-बैठि भरि साँसें, सोचत द्योस बितैये ।
    सजल नयन तनु पुलक मगन मन, नाम टेर रट लैये ॥ 
    गाढ़ी पीर बढ़े उर अंतर, मुख सौं कछू न कहिये ।
    टूक-टूक हिय कीजिय भोरी, औषध वैध न चहिये ॥ 
- verseNumber: "279."
  verseText: |
    अस कछु आस होत हिय माहीं,
    वे दिन ज्यौं न रहे, ये रहि हैं नाहीं ।
    परिहै कहूँ कान भनक जाई,
    आरत हरण कृपालु आइ हैं धाई ।
    दीन गरीब दुखी सब भाँती,
    आपनि जानि प्रिया ऐहै सकुचाती ।
    तजहि न चन्द सुधा जैसे,
    सहज कृपा की बान बिसरिहै कैसे ।
    मिटि है कठिन अभाग पलक में,
    सब बनाव बनि जैहै एक झलक में ।
    लहि हौं सहज कृपा की कोरन,
    रहि हौं अटकि जैसे चन्द चकोरन ।
    कढ़ि हैं उमंग हिये केरी,
    बसि हौं हिलमिल कुञ्ज छाँव में तेरी ।
    इक रस कटि हैं दिन राती,
    किये माधुरी पान फिरौंगी माती ।
    भोरी तौ सब भाँति अभागी,
    सहज कृपा की आस रावरी जागी ।
- verseNumber: "280."
  verseText: |
    इतनी कहौ कृपालु किशोरी ।
    कबहूँ तौ तुम मोहि देखिहौ, सहज कृपा की कोरी ।
    कबहूँ तौ व्याकुल भटकैहौ, ढूँढ़त निधुवन खोरी ॥ 
    कबहूँ तौ भुज गहि मुसिकेहौ, सहज पौंछ दृग भोरी ।
    कबहूँ तौ छिन दरस दिखैहौ, मन्द हँसन मुख थोरी ॥ 
    इटनौ हँसि अवलंब दीजिये, ज्यों थिर होय हियौ री ।
    भोरी नेक मिलन आसा पर, काटौ जन्म करोरी ॥ 
- verseNumber: "281."
  verseText: |
    जौ पै कृपा रावरी होती ।
    तौ क्‍यों मन रमतौ विषयन में, आयु व्यर्थ क्यों खोती ॥ 
    तौ किन मिटत कोटि कुटिलाई, क्यों कुकर्म हठ करती ।
    पकंज चरण हरण भव बाधा, क्यों नहिं बैठि सुमरती ॥ 
    क्यों न अनन्य ब्रतहिं लै प्यारी, लीला में मन देती ।
    सोच-सोच नित दिवस गंवावत, हिय किन भरि-भरि लेती ॥ 
    मिलन चटपटी बढ़त न हिय क्‍यों, मिटत न क्‍यों जग प्रीति ।
    काहे कौ मुख सौं गढ़ि बातें, अजहूँ रहत हिय रीती ॥ 
    जान परत नहिं प्रगट कृपा कछु, सुनहु कृपानिधि प्यारी ।
    तासौं कहियत सहज किशोरी, काहे निठुरता धारी ॥ 
    भोरी यह चाहत करुणा निधि, दास्य रावरौ दीजै ।
    मेटिय शूल मलिन मन कल्पित, प्रगट कृपा किन कीजै ॥ 
- verseNumber: "282."
  verseText: | 
    दुविधा में कछु लख न परै ।
    सोच-सोच चुप रहिये प्यारी, मुख सौं कहा उचरै ॥ 
    जब हौं अपनी ओर निहारत, आसा कछु न परै ।
    कहँ मैं कहँ अलबेली राधा, काहे कौं चित्त धरै ॥ 
    जब अपनी करतूत बिचारत, हियरा अधिक डरै ।
    हौं तौ नीच निन्द्य शठ लम्पट, सो क्‍यों भुज पकरै ॥ 
    सहज कृपाल बान जब सोचत, हृदय उमंग भरै ।
    पतित उधारन बान प्रिया की, सो कैसे बिसरै ॥ 
    नित-नित यही रीति चलि आई, अवगुण चित न धरै ।
    आरत टेर सुनत करुणानिधि, छिन न विलम्ब करै ॥ 
    यह विधि सोचत रहत निरन्तर, निश्चय कछु न परै ।
    बेगि कृपा किन करत किशोरी, भोरी दीन ररै ॥ 
- verseNumber: "283."
  verseText: |
    उमड़ि-उमड़ि नयना जल बरसे ।
    भीजत जाइ रङ्ग में देही, हृदय प्रेम सरसें ॥ 
    तन मन विकल नाम रट लागै, निशि-दिन परै न जानी ।
    छिन-छिन गावत नाचत रोवत, बन-बन फिरौं दिवानी ॥ 
    झूमत नयन कछू नहिं सूझत, पुलकावली सरीरा ।
    ऐसे कबहूँ बसैहौ भोरी, रंग भरी यमुना तीरा ॥ 
- verseNumber: "284."
  verseText: |
    उमड़ि-उमड़ि दृग नीर बहावै ।
    कबहूँ भाग्य होयगौ ऐसौ, नयन अँधेरौ छावै ॥ 
    जुगल रूप हिय मध्य प्रकासै, बाहिर कछु न दिखावै ।
    झूमत झुकत फिरत ब्रज वीथिन, पुनि-पुनि पंथ भुलावै ॥ 
    टेढ़ी लगी हिये अभिलाषा, सो कैसे कै पावै ।
    भोरी सहज कृपाल किशोरी, टेर-टेर अकुलावै ॥ 
- verseNumber: "285."
  verseText: |
    कपटी कुटिल कौन प्रतिपारै ।
    ऐसी और न बान काहु की, अवगुण चित न धारै ॥ 
    तन मन अति अकुलात किशोरी, चहुँदिसि चकित निहारै ।
    करि अनुमान सबहि कौं देखेउ, बिगरी कोऊ न सम्भारै ॥ 
    चित्त अधीर नहिं धीरज आवै, नैनन सौं जल डारै ।
    सहज कृपालु लाड़िली राधा, भोरी विलपत द्वारै ॥ 
- verseNumber: "286."
  verseText: |
    दिल कौ दरद कौन सौं कहिये ।
    दिल दरदीली और न तो बिनु, जाकी आसा गहिये ।
    अब तौ यह जिय आवत प्यारी, नित-नित रोवत रहिये ॥ 
    अबहूँ सहज कृपालु कृपा सौं, कृपा कोर हठ लहिये ।
    भोरी कोटि जन्म लग नातर, सोच-सोच तन दहिये ।
- verseNumber: "287."
  verseText: |
    कहा कहौ कछु कहि नहिं आवै ।
    तजि पद -कञ्ज छटा अलबेली, विषयन में मन धावै ।
    नैनन नीर बहावत निशि दिन,इनकौं सैर सुहावै ॥ 
    ये सब पातक के फल मेरे, भजन भाव क्‍यों भावै ।
    ये तौ सहज जन्म के बैरी, काहे न बैर बिसावै ॥ 
    तुम तौ सहज कृपालु किशोरी, वेद विमल जस गावै ।
    भोरी सोच यही करुणानिधि, क्यों न बिहँसि अपनावै ॥ 
- verseNumber: "288."
  verseText: | 
    आपनि दसा कहा अब कहिये ।
    अचरज देखि कृपालु किशोरी, समुझि-समुझि चुप रहिये ।
    कामधेनु लै भूखन मरिये, सर बिच प्यास जु सहिये ॥ 
    चिन्तामणि कर रंक तऊ अति, भीख मांग कै खैये ।
    सिंह सरण गीदड़ मिलि मार्यौ, जग उपहास करैये ॥ 
    मन भावै सो करहु कृपानिधि, तुमहिं कहा समुझैये ।
    श्री हित चरण सरण भोरी की, ऐसी दसा कि चहिये ॥ 
- verseNumber: "289."
  verseText: |
    ऐसी पीर होत हिय भारी ।
    सुनिये करुणाधाम किशोरी, सहज कृपानिधि प्यारी ॥ 
    ज्यों सजि आई वेष कामिनी, हॉंसन अधिक सिंगारी ।
    पिय लखि फेरि बदन जब लीनौ, बहन लग्यो दृग वारी ॥ 
    मूँज -विपिन अलि भटकत भूल्यो, पाइ सुगन्धित ब्यारी ।
    हौंसन कंज निकट जब आयौ, गज तेहि खाइ रहा री ॥  
    सरवर आस तृषित मृग भाजेउ, लागत विपिन दवारी ।
    सूखौ सर लखि भाग कुटिलता, बिकल भयौ सुकुमारी ॥ 
    प्यासौ पपिहा घन अवलोकयो , बहुविधि कीन्ह पुकारी ।
    बिनु इक बूंद दिये घन मिटिगौ, रहिगौ चौन्च पसारी ॥ 
    रचि-रचि हौंसन करत बीनती, सो सब होत वृथा री ।
    भोरी कृपा कहाँ सो बिसरी, पोच निबाहन हारी ॥ 
- verseNumber: "290."
  verseText: | 
    करहु कृपा अब श्यामा श्याम ।
    करुणा सिंधु लाडिले प्यारे, दीन बन्धु सुख धाम ।
    आरत हरण अधम प्रतिपालक, कृपा मूर्ति अभिराम ।
    भोरी दुखिया दीन पुकारत,टेरत लै लै नाम ।
- verseNumber: "291."
  verseText: |
    कहौ जो मुख कहि आवत बात ।
    ऐसी और न बान काहु की, सत्य कहौं सौं खात ।
    सकल लोक चूड़ामणि प्यारौ, चरणन सीस नबात ।
    सो चमार के हेत लिये जल, धावत आधी रात ॥ 
    जाकौ नाम सुनत मन मोहन, नयनन नीर बहात ।
    सोई अली किशोरी प्यारी, टेर सुनत अकुलात ॥ 
    सोतौ नारि विरह सौं व्याकुल, छिन-छिन टेर सुनात ।
    कारण रहित कृपालु महल में, सुनि-सुनि कै सकुचात ॥ 
    भोरी पामर नीच अधम अति, सब जग नाम धरात ।
    तौहू तुम्हें सुरत हिय ताकी, अस जिय जानी जात ।
- verseNumber: "292."
  verseText: |
    आपनि दसा कहा अब कहिये ।
    तुम कौं सब ही उचित कृपानिधि, मोकौं ऐसी न चहिये ॥ 
    कब लगि विषयन में मन दैकै, चरण कमल बिसरैये ।
    कब लगि दासी कहत कहावत, सब जग नाम धरैये ॥ 
    कब लगि बान राबरी समुझत, हिय कठोरता गहिये ।
    कब लगि यह न फटैगी छाती, सोचि-सोचि पछितैये ॥ 
    यह बिनती अब करत कृपानिधि, ऐसी रहन मिटैये ।
    गाढ़ी प्रीति हिये में दीजै, ज्यौं पद पंकज लहिये ॥   
- verseNumber: "293."
  verseText: |
    जोपै सोचेहु इतनी कृपा प्यारी ।
    तौ किन देत प्रीति हिय गाढ़ी, कृपासिंधु वृषभान दुलारी ॥ 
    जोपै ऐसी रीति रावरी दीन अधीन सकहु न बिसारी ।
    तौ किन ऐसौ करौ मन मेरौ छिन न तजौं पद कंज सुखारी ॥ 
    जोपै सत्य कृपा कछु मोपै मेटहु कृपा करि हिय भ्रम भारी ।
    सहज कृपालु करहु अस भोरी ज्यौं देखै भरि नयन छटारी ॥ 
- verseNumber: "294."
  verseText: |
    श्री राधे तोहि कैसे कै जानौं ।
    कैसो रूप कहा छबि सोभा, बैठ-बैठ अनुमानौ ॥ 
    कहा सुभाव माधुरी लीला , कोटि कल्पना ठानौ ।
    ऐसौ भाग्य जागि है कबहूँ, देखि-देखि हिय आनौ ॥ 
    एहो करुणा धाम किशोरी, जो हिय की पहिचानौ ।
    तौ किन भोरी प्रगट करत अब, सहज कृपा कौ बानौ ॥ 
- verseNumber: "295."
  verseText: |
    युगल रूप कैसे चितलावौं ।
    लीला ललित बैठि अनुमानत, नित-नित जुगति लड़ावौं ॥ 
    ऐसी कृपा करौ अलबेली, छिन इक झाँकी पावौं ।
    भोरी श्याम-गौर नव जोरी, हृदय निकुञ्ज बसावौं ॥ 
- verseNumber: "296."
  verseText: |
    छिन इक तुम मोहि देखौ न प्यारी ।
    छिन इक मैं तेरौ बदन विलोकौं, भरि-भरि कै नयना री ॥ 
    छिन इक तुम मोसौं कहौ कृपानिधि, रस भीजे बयनारी ।
    छिन इक मैं कछु तुमहिं सुनावौं, आपनि बात बिचारी ॥ 
    कबहूँ तौ यह भाँति लाड़िली, कीजै प्रगट कृपा री ।
    भोरी कोटि वारिये तो पर, मुख सौं कहौं कहा री ॥ 
- verseNumber: "297."
  verseText: |
    ऐसी कृपा किन करहु किशोरी ।
    उर में गड़ै मनोहर मूरति, मन्द हँसी मुख थोरी ।
    हियरा नयन बाण सौं बेधहु, हँसि-हँसि भौंह मरोरी ॥ 
    घायल करि भटकावहु प्यारी, झूमत निधुवन खोरी ।
    जियरा टूक-टूक ह्वै जावै, इतनौ माँगत भोरी ॥ 
- verseNumber: "298."
  verseText: |
    हौं प्यारी तोहि कैसे कै पावौं ।
    जो तुम बन में मिली कृपानिधि, तौ बन को उठि धावौं ॥ 
    जो बरसाने करहु अनुग्रह, तौ बरसाने आवौं । 
    गहवर वन यमुना तट बैठी, आरत टेर सुनावौं ॥ 
    जेहि विधि रीझौ कुँवरि किशोरी, सो मोसौं करवावौं ।
    भोरी पै तौ कृपा सदा ही, हँसि किन दरस दिखावौं ॥ 
- verseNumber: "299."
  verseText: |
    हौं प्यारी तोहि मन की बात सुनावौं ।
    कारण रहित कृपालु किशोरी, कौन भाँति तोहि पावौं ॥ 
    जो मन बस में होत कृपानिधि, चरणन ध्यान लगावौं । 
    जो तन सौं सहि जात लाड़िली, तौ तप योग करावौं ॥ 
    जो उर प्रीति होत करुणामय, तौ छाती दरकावौं ।
    हियरा टूक-टूक करि छिन में, सकल अभाग्य मिटावौं ॥ 
    सो तौ ऐक बनत न दयानिधि, कहा करौं कित जावौं ।
    भोरी ललकि-ललकि दरसन कौ, रोइ-रोइ रहि जावौं ॥ 
- verseNumber: "300."
  verseText: |
    अब कब मेरी सुधि करिहौ प्यारी ।
    नवल निकुंज महल में बैठी, श्री वृषभान दुलारी ।
    ललितादिक सखि संग सहचरी, टहल करत गिरधारी ॥ 
    शिव-हरि-अज श्रुति नेंक न जानी , रहे विचार विचारी ।
    सो कृपालु भोरी की स्वामिनि, सब विधि राखन हारी ॥ 
- verseNumber: "301."
  verseText: |
    अब कब मेरी सुधि करहु कृपाला ।
    नवल निकुंज विराजत प्यारी, करुणासिन्धु दयाला ।
    जहँ ललितादिक टहल में ठाड़ी , गावत गीत रसाला ॥ 
    जहँ हरिवंश संवारत बारन, शोभा विशद विशाला ।
    जहँ पग कंजन देत महावर, उमगि-उमगि नन्दलाला ॥ 
    अनुपम थल मुनि ध्यान अगोचर, जड़ वपु आप गुपाला ।
    तहँ भोरी की चरचा करि हौ, हँसि-हँसि नव ब्रजबाला ॥ 
- verseNumber: "302."
  verseText: |
    जय राधा चरणन की प्यासी ।
    ललितादिक जे सखी सँग की, प्रिय पद कंज निवासी ॥ 
    शिव ब्रह्मादिक वन्दत पद रज, राधा चरण उपासी ।
    जिनकौ जोरि-जोरि कर बिनवत, मोहन कुञ्ज विलासी ॥ 
    महिमा अमित अपार अगोचर, सहज नेह की रासी ।
    सिध-निधि कोटि-कोटि की दाता, आरत कलपलता सी ॥ 
    श्री दम्पति मन लिये रहत नित, निसि दिन करत खवासी ।
    हित नाते सुधि करहु करावहु, भोरी शठ रस प्यासी ॥ 
- verseNumber: "303."
  verseText: |
    कबहूँ तौ सुधि मेरी करै हौ ।
    श्री ललितादिक सखी सँग की, चरचा कबहूँ चलैहौ ॥ 
    श्री हरिवंश नाम की महिमा, सबै भाँति प्रगटैहौ ।
    कहि हौ करहु कृपा अलबेली, अब कब लौं तरसैहौ ॥ 
    कुञ्जन में तुम बसत सदाही, अवसि सु अवसर पैहौ ।
    भोरी पामर दीन दुखी तन, करुणा कोर चितैहौ ॥ 
- verseNumber: "304."
  verseText: |
    मेरौ मन बात इती चाहै ।
    तुम बिनु सब सुख विष सम लागै, लै लै नाम कराहै ।
    तोसौं प्रीति बढ़े अति गाढ़ी, तो बिन और न चाहै ॥ 
    निशि वासर नित नेम नाम कौ, नित नव नेह निबाहै ।
    भोरी जो करि कृपा विलोकौं, तौ कछु कठिन कहाहै ॥   
- verseNumber: "305."
  verseText: |
    सब कछु बदल जात जग माहीं ।
    या मन की यह कठिन कुटिलता, कैसेहु बदलत नाहीं ।
    अजहूँ विषयन लोभ लुभायौ, तजि निधिवन द्रुम छाहीं ॥ 
    कोटिन जन्म बीत गये ऐसे, यह पुनि जात वृथा हीं ।
    भोरी सहज कृपालु किशोरी, अब तौ गहौ हठ बाहीं ॥ 
- verseNumber: "306."
  verseText: |
    कोटि कुलिस सौ कठिन हियौरी ।
    अजहूँ दरकत नहीं दयानिधि, करुणाधाम किशोरी ।
    किस विधि प्रीति रीति उर ऐहै, सोचे यत्न करोरी ॥ 
    तौहू सुनहु कृपालु सुन्दरी, कछु नहिं ठीक पर्योरी ॥ 
    भोरी कहा कहै अलबेली, तुम ही बिंहसि कहौरी ॥ 
- verseNumber: "307."
  verseText: |
    सोइ-सोइ सब जागत प्यारी ।
    आधी बीते, भोर भये कै, सब कोऊ आँख उचारी ॥ 
    मेरी भाग्य कौन गत सोयौ, अजहूँ जागत नारी ।
    कोटिक जन्म बीत गये यौ ही,यह पुनि जात वृथारी ॥ 
    दिन-दिन आयु सिरात किशोरी, त्रास होत हिय भारी ।
    भोरी करुणा धाम लाड़िली, करुणा कहाँ बिसारी ॥ 
- verseNumber: "308."
  verseText: |
    ऐसौ दुख दीजै हिय माहीं ।
    बिनु पद-कंज छटा दृग देखे, कोऊ सुहावै नाहीं ॥ 
    नाम रटै दृग ढारै आँसू, छिन-छिन अति अकुलाहीं ।
    काहू सौं मिलिबौ न सुहावै, बातन सौं घबराहीं ॥ 
    बस्ती छोड़ि एकान्त बैठिबौ, जग सब शून्य दिखाहीं ।
    भोरी ऐसे दुख बिनु प्यारी, जीवन जन्म वृथा हीं ॥ 
- verseNumber: "309."
  verseText: |
    दीजै हिय में गाढ़ विरह दुख ।
    बिनु पद-कंज कछू न सुहावै, विष सम लगै सबै जग कौ सुख ॥ 
    आपनि दसा कहा कहि बरनौ, हियरा तौ निदरत कोटि कुलिष ।
    कौन काज जननी जड़ जाई, भोरी शठ सब ही भाँति विमुख ॥ 
- verseNumber: "310."
  verseText: |
    ऐसी पीर हिये में व्यापै ।
    नयना सजल नाम रट लागै, अंग-अंग अति कांपै ॥ 
    कोऊ दृग देख्यौ न सुहावै, अति दुख नैनन ढाँपै ।
    भोरी लै-लै नाम रावरी , ऊंचे टेर अलापै ॥ 
- verseNumber: "311."
  verseText: |
    सो छवि नयनन में न बसीरी ।
    त्रिभुवन मोहन श्यामसुन्दर दृग, जा छवि माहिं फसीरी ॥ 
    बरसत सहज माधुरी धारा, मृदु मुसिकान लसीरी ।
    अँग-अँग भूषन बसन मनोहर, कंचुकि कसिब कसीरी ॥ 
    भरि-भरि नेन न सो छवि देखी, जैसे चकोर शशीरी ।
    भोरी धृग-धृग जीवन ऐसौ, सब जग करत हँसीरी ॥ 
- verseNumber: "312."
  verseText: |
    अब तौ आई हौं सरमात ।
    करि अपराध कुकर्म कोटि विधि, कछु-कछु हृदय डरात ।
    जैसे नारि भूलि पति आज्ञा, पीछे अति पछितात ॥ 
    लाजन सन्मुख दृष्टि करत नहिं, भय सौं काँपत गात ।
    तुम तौ सब विधि हिय की जानत, कहा बनावौं बात ॥ 
    करुणाधाम किशोरी राधे, त्रिभुवन जस विख्यात ।
    भोरी सहज कृपा की आसा , अवनि देखि रह जात ॥ 
- verseNumber: "313."
  verseText: |
    यह मन तौ न भयौ मेरौ ।
    जिहि देखत ताही सँग लागत, सब विषयन कौ चेरौ ॥ 
    अब तौ प्रीति रीति बिनु प्यारी, नयनन लगत अँधेरौ ।
    भोरी अब तुम ही करुणानिधि, कृपा कोर हँसि हेरौ ॥ 
- verseNumber: "314."
  verseText: |
    पोच प्राण की गिनती कीनी ।
    वा पद कंज छटा पर वारौं, त्रिभुवन शोभा जितनी ॥ 
    दृग भरि कबहूँ माधुरी प्यावौ,आस पुजावौ इतनी ।
    स्वर्ग-मुक्ति-सम्पति-सिधि भोरी, तृन सम गिनत न तितनी ॥ 
- verseNumber: "315."
  verseText: |
    झूठी प्रीति हिये में थोरी ।
    सो झूठी साँची कर मानत, यह अंधेर बड़ौरी ।
    ताहू पै मिलिबे की आसा, हिय में उमंग करोरी ॥ 
    सेवा के बहु भाँति मनोरथ, करत बहोर-बहोरी ।
    भोरी के या भोरे पन पै, रीझत क्यों न किशोरी ॥ 
- verseNumber: "316."
  verseText: |
    इतनो तौ कबहूँ हँसे दैहौ ।
    सुनहु कृपालु किशोरी राधे, अवसि कृपा की कोर चितै हौ ।
    तुम मोहि मिलौ -मिलौ न कृपा करि, मोकौ ढूँढ़त तौ भटकै हौ ।
    तुम मेरी सुनौ-सुनौ न किशोरी, मोकौं तौ नित दीन रटै हौ ॥ 
    तुम मेरी बाँह गहौ न गहौ हँसि, भुज पसार मोसौं विनय करै हौ ।
    तुम मेरे दृग पौंछौ मत पौंछौ, मोसौं नित दृग नीर ढरै हौ ॥ 
    हौं अति नीच कहा मुख मांगौं, इतनी तौ तऊ आस पुजैहौ ।
    भोरी नेम बढ़े तुम ही सौं, सब जग सौं सम्बन्ध छुड़ैहौ ॥ 
- verseNumber: "317."
  verseText: |
    इतनी बात कृपा करि दीजै ।
    मिलन चटपटी हिय में लागै, विरह ताप तन छीजै ।
    तुम तौ मिलौ मिलौ न कृपा करि, मो चित प्रेम सौं भीजै ।
    नयनन नीर बहै निशि वासर, हियौ कठोर पसीजै ।
    भोरी कौ अबलम्ब न दूजौ, टेरि-टेरि कै जीजै ।
- verseNumber: "318."
  verseText: |
    कबहूँ बढ़े विरह दिन दूनौं ।
    बिनु भरि नयन माधुरी देखे, सब जग लागै सूनौं ॥ 
    मिलिबौ-हँसिबौ-कहिबौ-सुनिबौ , चित कछू न सुहावै ।
    सब सौं जाइ बैठियत न्यारे, बात करत घबरावै ॥ 
    कहत सुनत तेरौ नाम किशोरी, उमगि नयन भरि आवै ।
    लीला ललित बिचारत जब-जब , हियरा टूटत जावै ॥ 
    विष सम लगै विषय सुख जेती, मुक्ति स्वर्ग नहिं चाहै ।
    मूँदे नयन पुलक तन पुनि-पुनि , लै-लै नाम कराहै ॥ 
    भोरी की अभिलाषा इतनी, बार-बार सोई मांगै ।
    कौन भाग्य सौं कुँवर किशोरी, प्रीति हिये में जागै ॥ 
- verseNumber: "319."
  verseText: |
    कबहूँ मो तन विहँसि चितै हौ ।
    सब विधि निराधार शरणागत, कृपा कोर अपनैहौ ।
    सहज कृपालु किशोरी राधे, सकल अभाग्य मिटैहौ ॥ 
    हिय की हरिहौ कठिन कुटिलता, प्रीति रीति हँसि दैहौ ।
    भोरी सहज बान करुणा की, अब कब लौं बिसरैहौ ॥ 
- verseNumber: "320."
  verseText: |
    या हिय की कठोरता कहि न परै ।
    काहू भाँति न टूटत प्यारी, कोटि कुलिस निदरै ॥ 
    कोटि जतन करि हार रही मैं, कछु पै बनि न परै ।
    यह अजहूँ जैसे कौ तैसौ, दिन-दिन कठिन परै ॥ 
    अब तौ कछु उपाय नहिं सूझत, इक तेरी आस करै ।
    भोरी तोहि सब सहज किशोरी, तो तै चित्त धरै ॥ 
- verseNumber: "321."
  verseText: |
    हँसि-हँसि क्यों न बोलियत प्यारी ।
    कोमल चित्त किशोरी प्यारी, यामें घटत कहारी ॥ 
    नातर इतनीं देहु कृपा कर, माँगहु गोद पसारी ।
    याही सोच दिवस निशि काटी, सुमिर-सुमिर लीलारी ॥ 
    काहू सौं करिबौ न सुहावै, हिल मिल हँसि बतियाँ री ।
    भोरी सहज किशोरी तो बिनु , जीवन जन्म वृथा री ॥ 
- verseNumber: "322."
  verseText: |
    दीजै प्रेम रावरे पग सौं ।
    तुम बिन और न काज काहूसौं, नातौ टूट जाय सब जग सौं ॥ 
    ऐसौ मन मेरी करौ किशोरी, छिन-छिन टेरौ तोहि उमंग सौं ।
    तेरी सहज कृपा की उमगन, बोर देय भोरी कौ रँग सौं ॥ 
- verseNumber: "323."
  verseText: |
    कबहूं उठिहौ उमंगि किशोरी ।
    तन मन कौ संभार नहिं रहि है, देखि दीनता मोरी ॥ 
    हौं तौ कब की दीन पुकारत, आसा करत करोरी ।
    भोरी कुटिल पतित अति पामर, तौ हू सब बिधि तोरी ॥ 
- verseNumber: "324."
  verseText: |
    कृपा सिंधु उमड़ौगी कबहूँ ।
    हौं कब की तोहि टेरत आरत, तैं न सुनत अबहूँ ॥ 
    हौं तौ हाथ बिकानी भोरी, सोच नहीं लबहूँ ।
    बीत जाइ वरु जन्म किशोरी, हठ न तजों कबहूँ ॥ 
- verseNumber: "325."
  verseText: |
    तूने हाय कहा कियौ मन रे ।
    कौन काज या जग में भूल्यौ, विषय महाविष चाखन रे ।
    जेहि सरुप घनश्याम बिकान्यौ, सो न लख्यौ भरि आँखन रे ॥ 
    अब किन सोच-सोच दिन काटत , रोइ-रोइ कै रातन रे ।
    भोरी सहज किशोरी छवि पर, वारौ कोटिक प्राणन रे ॥ 
- verseNumber: "326."
  verseText: |
    कैसे तोहि पाईऐ वृषभान दुलारी ।
    विधि-हरि-हर तेरी पद रज चाहत, रंग भरी चितवन कुंजबिहारी ।
    भक्त सखा जेते मोहन जू के, सबकौं अगम सहज सुकुमारी ॥ 
    पचि हारे श्रुति पार न पायौ, मुनि मन ध्यान न आवत प्यारी ।
    केहि गुण रीझि मोहि अपनैहौ, मैं तो पामर दीन दुखारी ॥ 
    इतनी बान रावरी जानत, निरवलम्ब कौं राखन हारी ।
    तासौं आस परत यह प्यारी , करि हौं कबहूँ उमगि कृपारी ॥ 
- verseNumber: "327."
  verseText: |
    ऐसी कौन से ठौर दुरी सुकुमारी ।
    जहँ इन पायन दौरि न जइये, जहां दृगन सकिये न निहारी ॥ 
    जहँ कौ पन्थ न वेदन जान्यौ, जहँ कौ शब्द परत श्रुति ना री ।
    जहँ मन बुद्धि बचन नहिं पहुँचत, जहँ की रज जांचत त्रिपुरारी ॥ 
    कौन भाँति तहाँ ढूँढन आवै, मोसी पामर दीन दुखारी ।
    भोरी यत्न न सूझत कोऊ, तासौं पुनि-पुनि करत पुकारी ॥ 
- verseNumber: "328."
  verseText: |
    कौन भाँति रीझौगी प्यारी ।
    जिहि विधि रीझो सहज कृपानिधि, सोइ करौ सुकुमारी ॥ 
    तुम तौ सब विधि बुद्धि अगोचर, लोक लीक सौं न्यारी ।
    ना जानों तुम रीझिहौ कैसे, यही त्रास हिय भारी ।
    तुम ही क्यों न कहौ अलबेली, हौं तो शरण तिहारी ।
    ज्यों -ज्यों उमगि रीझि हँसि मिलिये, भोरी बलि-बलिहारी ॥ 
- verseNumber: "329."
  verseText: |
    कौन भाँति तुम रीझौ किशोरी ।
    ज्यों रीझौ सोइ करों कृपानिधि, जहँ लगि चलि है मोरी ॥ 
    मोहि तौ जतन नयन नहिं सूझत, मन बुधि वेग थक्‍यौरी ।
    भोरी सहज कृपालु लाड़िली, आपुन क्यों न कहौरी ॥ 
- verseNumber: "330."
  verseText: |
    श्रीराधे उर आइ हीं कैसे ।
    सहज कृपाल किशोरी कब लग, दिवस काटियत ऐसे ॥ 
    कौन भाग्य ऐसौ दिन देखौं, छिन टारौ न हिये से ।
    भोरी आस पूजावहु प्यारी, अब बनि आवै जैसे ॥ 
- verseNumber: "331."
  verseText: |
    कोटि जन्म लगि हठ यह मोरी ।
    बिनु पद कञ्ज और नहिं लैहौ, करुणा सिन्धु किशोरी ।
    तीन लोक सम्पति नहिं चाहौ, रिधि-निधि-सिद्धि करोरी ॥ 
    कैतौ मिलौ कै दीन रटावौ, हौं तौ सब विधि तोरी ।
    कोटि जन्म वरु रोवत काटौ, हठ न तजौं भोरी ॥ 
- verseNumber: "332."
  verseText: |
    कृपा सो कैसे विसरि गई ।
    नित की बान हुती करुणा की, अब विपरीत भई ॥ 
    नहिं सहि जात टेर दुखियन की, मूरति कृपा मई ।
    हौं अब टेरत कौन बेर की, अँगुरी कान दई ॥ 
    युग-युग वही चाल चलि आई, अब कछु नई भई ।
    भोरी बिरियाँ सहज कृपानिधि, कौन सी रीति ठई ॥ 
- verseNumber: "333."
  verseText: |
    बिनती बार-बार का भाखौं ।
    जो कछु कान करौ अलबेली, तौ बहुरौ अभिलाखौं ॥ 
    सम्पति-साज लीद नहिं चाहौं, प्रेम सुधा रस चाखौं ।
    हौं तौ कोटि जन्म लगि प्यारी, आस रावरी राखौं ॥ 
    तेरी चरण रेणु पर कोटिन, प्राण गली में नाखौं ।
    आरत रटन न छांड़ौ भोरी, लोभ दिखावहु लाखौं ॥ 
- verseNumber: "334."
  verseText: |
    सब विधि सांचौ कठिन अभाग ।
    काहू विधि टारे न टरत री, लगन देत नहिं लाग ।
    कोटिक जन्म बीत गए ऐसे, याकौ येई राग ॥ 
    कर्म-धर्म सुभ साधन जितने, तिन पर डारी आग ।
    हो प्यारी , हौं बहु विधि चाहत, पद न बढ़त अनुराग ॥ 
    अब तौ सरण तिहारे आई, रही चरण सौं लाग ।
    यह डर सहज कृपानिधि भोरी, बान न दीजौ त्याग ॥ 
- verseNumber: "335."
  verseText: |
    मृदु मुसिकान हिये न समाई ।
    जीवन सबै अकारथ बीत्यौ, का मुख कहौं बनाई ॥ 
    तन-मन -प्रान कोटि नहिं वारे, उमगि-उमगि निधि पाई ।
    सजल नयन तनु पुलकि जमुन तट, निशि कबहूँ न गंवाई ॥ 
    युगल माधुरी पान न कीन्हीं, नहीं छवि रही लुभाई ।
    गह्वर गिरिवर खोर साँकरी, ऊँचे न टेर सुनाई ॥ 
    दरसन मिल्यौ न प्रेम जग्यौ हिय, दिन सब गये सिराई ।
    भोरी धृग-धृग जीवन ऐसौ, सब जग होत हँसाई ॥ 
- verseNumber: "336."
  verseText: |
    जड़ अखियाँ न कभू उमड़ीं ।
    या छबि दरस लोभ अकुलाती, धरि-धरि हठ न अड़ी ॥ 
    सुन्दर मृदुल मनोहर प्यारी, मूरति उर न गड़ी ।
    भोरी धृग-धृग जीवन ऐसौ, सब विधि विपद बड़ी ॥ 
- verseNumber: "337."
  verseText: |
    कठिन दैव गति टरत न टारी ।
    सोयो भाग्य न जागत प्यारी, टेर-टेर हौं हारी ॥ 
    तब कछु जानहूँ कृपा रावरी, फटन लगै हियरा री ।
    विषय भोग जग प्रीति न भाव, दिन दूनौ विरहा री ।
    सब सौं अलग बैठियत व्याकुल, पीर हिये अति भारी ।
    दिन नहिं भूख रैन नहिं निद्रा, रहत निहार निहारी ॥ 
    इतनी आस पुजावौ मेरी, हौं तौ सरण तिहारी ।
    भोरी प्रीति रीति बिनु धृग-धृग , जीवन जन्म वृथारी ॥ 
- verseNumber: "338."
  verseText: |
    कैसो बरनौ कठिन अभाग ।
    मूँद-मूँद दृग बैठत नित-नित , हिय न कछू अनुराग ॥ 
    तुम कौं धोखौ दैन कृपानिधि, रचत बहुत से स्वांग ।
    लै लै नाम नीर भरि लावत, जनु बैठी रस पाग ॥ 
    ह्वै हौ हँसि-हँसि देत लाड़िली, देखि-देखि सो राग ।
    छिन हूँ ऐसे हँसौ जु प्यारी, तौ मेरे बड़ भाग ॥  
    गोद पसारी नवल अलबेली, रीझ लेउँ कछु माँग ।
    भोरी दीजै चरण कमल सौं , हिय की गाढ़ी लाग ॥ 
- verseNumber: "339."
  verseText: |
    कै तुम उमगौ कै मोहि उमगावौ ।
    कै तौ आइ मिलौ करुणानिधि, कै मोकौं ढूँढ़त भटकावौ ।
    कै भव ताप हरौ हँसि प्यारी, विरह ताप कै देह तपावौ ॥ 
    कै दै दरस जुड़ावौ हियरा, कै वियोग दुख सौं दरकावौ ।
    कै भुज गहौ कृपालु कृपा करि, कै सब ही सौं नेह छुड़ावौ ॥ 
    कै दृग आइ अचानक मुंदौ, कै मोहि हेरत बाट बिठावौ ।
    कै मुस्कान माधुरी देवौ, कै मोहि तन मन विकल फिरावौ ॥ 
    कै हँसि कहौ कभू द्वै बतियाँ, कै मोसौं किन दीन रटावौ ।
    कै मोहि राखौ निकट आपने, कै तुम मेरे हिये समावौ ॥ 
    द्वय में रुचि आवै सो कीजै, कै दोऊ करि सुयश बढ़ावौ ।
    भोरी चरण शरण अलबेली, कृपा कोर की आस पुजावौ ॥ 
- verseNumber: "340."
  verseText: |
    श्री प्यारी जी कौं मेरी सुधि कौन करावै ।
    कौन कृपालु गरीब दुखी की, बरबस बाँह गहावै ।
    कहँ मैं कहँ अलबेली राधा, समझत हिय अकुलावै ॥ 
    मन-बुद्धि-बचन अगोचर प्यारी, टेर कौन विधि जावै ।
    श्री हरिवंश चन्द्र बिनु भोरी, को यह आस पुजावै ॥ 
- verseNumber: "341."
  verseText: |
    सहज कृपालु कृपा की आस ।
    जब-जब बैठि प्रभाव विचारत, हिय अति होत हरास ।
    कहँ मैं कहँ अलबेली राधा, कहाँ मिलन की प्यास ॥ 
    कौन भाग्य छिन प्रगट देखि हौं, मुसिकन बदन बिकास ।
    भोरी सहज कृपालु किशोरी, वेग हरहु भव त्रास ॥ 
- verseNumber: "342."
  verseText: |
    इतनी विनय मेरी मानों कृपाला ।
    झूठी प्रीति करौ सब साँची , करुणा सिन्धु दयाला ॥ 
    जनु पति मरत जरन उठि धाई, काची विरहिन बाला ।
    काँची प्रीति सत्य सब ह्वै गई, जब तन लागी ज्वाला ॥ 
    हौं तौ रावरे दाग दगी अब, दीजै विरह विसाला ।
    व्याकुल तन बन-बन भटकाबौ, टेरत नाम रसाला ॥ 
    ऐसौ मन मेरौ करौ कृपानिधि, छिन-छिन होऊँ विहाला ।
    हा ! राधे विलम्ब ना कीजै, भोरी जन प्रतिपाला ॥ 
- verseNumber: "343."
  verseText: |
    अब कब तोहि ढूंढन उठि धावौं ।
    तृन सम तजि सुत नारि धाम धन, त्रिभुवन चित्त न लावौं ।
    बिन देखे मन धीर न आवै, बार-बार अकुलावौं ॥ 
    छिन ठहरत नहिं बने किशोरी, नयनन नीर बहावौं ।
    हा राधे कहि संभ्रम इत-उत , डोलत लोग हंसावौं ॥ 
    तन मन की न सम्भार रहै कछु, खान-पान विसरावौं ।
    चहूँ दिशि चकित विलोकत प्यारी, हिय कठोर दरकावौं ॥ 
    कैतौ रूप स्वाति जल पीवौ, कै टेरत मर जावौं ।
    भोरी चातक की गति लखि-लखि , अब कब लौं पछितावौं ॥ 
- verseNumber: "344."
  verseText: |
    सोई ब्रज भूमि विराजित नीकी ।
    सो वृन्दावन सोई जमुना, सोई कुञ्ज भांवती जीकी ॥ 
    हा राधे तुम कौं बिन देखे, चहूँ चितवत अकुलावौ ।
    किहि विधि कहाँ पाइये सोचत, धीरज चित्त न लावौ ॥ 
    तुम बिन सब जग सुनौ लागै, कछु देख्यौ न सुहावै ।
    श्री राधा कृपालु अलबेली, छिन-छिन टेर सुनावै ॥ 
    विलपत पुलकत अकुलत हेरत, नयनन नीर बहावै ।
    छिन-छिन मूर्छि परै अवनी पै, छिन संभ्रम उठि धावै ॥ 
    कौन भाग्य ऐसौ दिन अैहैं, विरहा देह जरावै ।
    भोरी टूटि-टूटि के हियरा, टूक-टूक ह्वै जावै ॥ 
- verseNumber: "345."
  verseText: |
    कबलौं जियावौगी बिनु देखैं ।
    ब्रज नव तरुणि कदम्ब नागरी, मृदुल मनोहर बेखैं ।
    गुंथित अलक तिलक कृत सुन्दर, नयनन काजर रेखैं ॥  
    अंग अंग छवि अटक रहत दृग, लखत लगत न निमेखैं ।
    भोरी सो छबि बिना निहारे, जीवन कबने लेखैं ॥ 
- verseNumber: "346."
  verseText: |
    जूठन टूक न पायौ अब लौं ।
    सहज कृपाल किशोरी राधे, तरसाबोगी कब लौं ॥ 
    तुम्हरे संग कटी सब ही ते, सब विधि भई तिहारी ।
    जूठन के टूका कौं तरसत, ललकत गोद पसारी ॥ 
    स्वामिनि सबल नवल किशोरी, सर्वोपरि ठकुरानी ।
    हौं तौ तेरे चरण की चेरी, तेरे हाथ बिकानी ॥ 
    ऐसी रीति कौन सी नागरि, सहज कृपालु किशोरी ।
    भोरी उमंगि द्रवहु न कृपानिधि, सुनत याचना मोरी ॥ 
- verseNumber: "347."
  verseText: |
    भव सौं मेरौ तपत हियौरी ।
    इती आस उर बढ़त लाड़िली, करुणा धाम किशोरी ॥ 
    कबहूँ बसन छोर सौं शीतल, चलै समीर भलौरी ।
    अंग-अंग मो परसि दयानिधि , हरै ताप सब मोरी ॥ 
    कबहूँ बरसौ सहज कृपा की, दृग सौं दृष्टि अथोरी ।
    मेटि दाह सब सहज कृपानिधि , रस में राखौं बोरी ॥ 
    छिन-छिन अधिक अधीर लाड़िली, आस करत नित तोरी ।
    कुञ्ज कुटीर तीर यमुना के, भुज गहि राखौ भोरी ॥ 
- verseNumber: "348."
  verseText: |
    कबहूँ तौ लाड़िली ऐसी कृपा करौ री ।
    हौं तौ लोटि रहौं कुञ्जन मग, तुम हिय आइ कै पाँव धरौ री ॥ 
    हौं तौ लागि रहौं चरणन सौं, तुम झुक बिहँसि भुजा पकरौ री ।
    हौं तौ नैंक उठौ न उठाये, तुम बल कर हठ भुजन भरौ री ॥ 
    हौं तौ सब विधि अधम अपावन, तुम तौ आपनी ढरनि ढरौ री ।
    भोरी नीच सबै नीचन में, कृपा आस नित द्वार ररौं री ॥ 
- verseNumber: "349."
  verseText: |
    भव निधि मेरौ मन मीन भयौरी ।
    सहज कृपालु किशोरी राधे, बिनय मानिये मोरी ।
    लीजै खेंचि सहज करुणानिधि , डार प्रीति की डोरी ॥ 
    तुम बिन और बने यह कासौं , हौं बिनवत कर जोरी ।
    भोरी चरण शरण चलि आई, याचत लोचन कोरी ॥ 
- verseNumber: "350."
  verseText: |
    अब तौ हिय अति लाज लगै ।
    सारंग संग शलभ , शशि ऊपर रहत चकोर ठगे ।
    नादहि दिये कुरंग रहत मन, मारत शर न डगै ॥ 
    पति सँग जरत चिता पर नारी, प्रेम हिये उमगै ।
    भोरी धृग-धृग जीवन ऐसौ, अजहूँ न प्रेम पगै ॥ 
- verseNumber: "351."
  verseText: |
    मो सम कौन निलज जग माहीं ।
    चातक मीन शलभ गति देखत, लाज लेस हिय नाहीं ॥ 
    पति बिन नारि प्राण नहिं राखत, उमगि सँग जरि जाहीं ।
    मरिबौ अबसि अन्त काहू दिन, जीवन निपट वृथाहीं ॥ 
    कहा करौं बस चलत कछू ना, यह उर सोच सदाहीं ।
    अजहूँ दरस बिना धृग भोरी, पामर प्राण न जाहीं ॥ 
- verseNumber: "352."
  verseText: | 
    लाड़िली प्यारी कभू मेरी ताप हरि कै जाइयौ ।
    नेह कौ सम्बन्ध अब तौ, सत्य करि कै जाइयौ ॥ 
    हौं जु ढूँढ़त गिर रहौंगी, हार थकि कै राह में ।
    हेरि मृदु मुसकाइ मेरी, भुज पकरि कै जाइयौ ॥ 
    बंक चितवन बाण सौं , मेरौ हियौ हँसि बेधियो ।
    जाल छबि में नयन खंजन, द्वय जकरि कै जाइयौ ॥ 
    टेर मेरी तीर सी, हिय में न लग जावै कहूँ ।
    हाँ किशोरी लाड़िली, इतसौं सम्भरि कै जाइयौ ॥ 
    नयन करुणा सिन्धु ये तो, आज उमड़ेंगे अबसि ।
    पाँव पंकज पाँ परौ, तुम हू ठहरि कै जाइयौ ॥ 
    धूर में मोकौं मिलावौ, बात पै मानौ इती ।
    हाय मेरी धूर पै फिर, पाँव धरि कै जाइयौ ॥ 
- verseNumber: "353."
  verseText: |
    तब लगि विषयन में मन धावै ।
    जब लगि मन्द मनोहर हाँसी, हिय में नाहिं समावै ।
    कठिन अभाग न मिटि हैं तौलौं, प्रीति हिये नहिं आवै ॥ 
    तासौं पुनि-पुनि गोद पसारै, आरत टेरि सुनावै ।
    दिल दरदीली सहज किशोरी, भोरी भाग जगावै ॥ 
- verseNumber: "354."
  verseText: |
    ऐसौ विरह हिये अधिकावै ।
    छिन-छिन प्रीति उठे अति गाढ़ी, धीरज नैंक न आवै ॥ 
    जब-जब पात वायु सौं खरकै, तब-तब उठि-उठि धावै ।
    आवत जान कृपालु किशोरी, दरसन कौं अकुलावै ॥ 
    जब-जब बढ़त ताप दृग मूँदे, नाम टेर रट लावै ।
    शीतल वायु त्रास तन परसत, रोम-रोम पुलकावै ॥ 
    हियरा फटत जाय अलबेली, नैनन नीर बहावै ।
    भोरी सहज कृपालु किशोरी, तुम बिनु कछु न सुहावै ॥ 
- verseNumber: "355."
  verseText: |
    प्यारी हौं तेरे आगे गोद पसारौं ।
    जब लौं चार दिना यह जीवन, तेरौ नाम उचारौं ॥ 
    ऊँचे टेर सुनाऊँ छिन-छिन, नैनन सौं जल ढारौं । 
    अति व्याकुल भटकौं बरसाने , ढूँढत धीर न धारौं ॥ 
    तन-मन धूर करौं निज भोरी, तेरे पथ में डारौं ।
    का जानौं मेरौ भाग जग उठै, जो उत में पग धारौं ॥ 
- verseNumber: "356."
  verseText: |
    प्रेमिन में यह साँचे चकोर ।
    एक चन्द्र सौं जोर रहत दृग, सब ही सौं तृन तोर ॥ 
    साँचे शलभ प्राण तजि डारत, उमगत प्रेम अथोर ।
    साँची नारि जरत जो पति सँग, बंधी प्रेम की डोर ॥ 
    लागत लाज देखि कै अपनी, झूठी हियौ कठोर ।
    भोरी लाज राखिये स्वामिनि, देखि आपनी ओर ॥ 
- verseNumber: "357."
  verseText: |
    बिनती सुनहु रसिक सिरताज ।
    शलभ चकोर मीन मृग चातक, प्रेमिन जुरयौ समाज ॥ 
    सन्मुख दृग करि देख सकत नहिं, अति खिसियानी आज ।
    भोरी सहज कृपालु कृपा करि, रखिये जन की लाज ॥ 
- verseNumber: "358."
  verseText: |
    कबहूँ मेरौ यह मिटि है तरसबौ ।
    बड़े भाग्य कहूँ मिलिहै मन कौं, अलक कुटिल में फसिबौ ॥ 
    चन्द्र बदन छवि बिमल चाँदनी, नित नव सुधा बरसिंबौ ।
    ओठन पै अद्भुत अरुणाई, ता पर मृदु-मृदु हँसिबौ ॥ 
    बचन मनोहर सुधा धार कौ, बदन कंज सौं ख़्सिबौ
    लगि है हाथ तिरिछी चितवन, नयन कोर हिय धँसिबौ ॥ 
    पद पंकज रस माती प्यारी, श्री यमुना तट बसिबौ ।
    भोरी सहज किशोरी छबि कौं, नित-नित देख हुलसिबौ ॥ 
- verseNumber: "359."
  verseText: |
    किन सिखई तोहि दीन न पूछौ ॥ 
    मोसी खीन मलीन, न पूछौं ॥  
    कीने कही सबल अलबेली,
    सब विधि सौं बल हीन न पूछौ ॥ 
    तुम नित केलि करौ आनंद में,
    टेरत द्वार अधीन न पूछौ ॥ 
    भजन भक्ति जप बनत न जासौं,
    यों पुरुषार्थ छीन न पूछौ ॥ 
    हौं माँगत नित पीर विरह की,
    याचक ऐसी नवीन न पूछौ ॥ 
    विलपत दीन दुखी भोरी सौं,
    कस तब बदन मलीन न पूछौ ॥ 
- verseNumber: "360."
  verseText: |
    प्रीति साँची हिय जगावौगी, कहौ,
    ढूँढती व्याकुल फिरावौगी कहौ ॥ 
    चारु कच के पेच के नित ध्यान में,
    मेरौ मन व्याकुल भरमावौगी कहौ ॥ 
    जल की बूंदन की न कछु परतीति अब,
    खून नैनन सौं ढ़रावौगी कहौ ॥ 
    अति विकल अंग-अंग पुलकित लाडली,
    नाम अपनो नित रटावौगी कहौ ॥ 
    आयु बीती जाय टेरत द्वार पै,
    मरिबे तक दरसन दिखावौगी कहौ ॥ 
    जौलौं मेरी मृत्यु मुख मूँदे नहीं,
    चार दिन करुणा करावौगी कहौ ॥ 
    गिर रहौँ मैं तौ उमंग कै राह में,
    झुकि विहँसि भुज गहि उठावौगी कहौ ।
    तेरी मृदु मुसिकान पै भोरी बिकी,
    स्वामिनी मेरी कहावौगी कहौ ॥ 
- verseNumber: "361."
  verseText: |
    जब श्री राधे टेर सुनावौं ।
    दैउ छुड़ाय चकोर चन्द्र सौं, चातक रटन भुलावौं ॥ 
    खग मृग जीव जगत के जेते, ते सब ही उमगावौं ।
    सहज प्रेम सागर की उमगन, तीनहूँ लोक डुबावौं ॥ 
    हौं तौ प्रीति रीति सौं रीति, निज गति कहा सुनावौं ।
    भोरी सत्य होय यह सब ही, कृपा कोर जो पावौं ॥ 
- verseNumber: "362."
  verseText: |
    कपट नीर नैनन ढ़रकायौ ।
    कछुवै करत बन्यौ न किशोरी, नाहक जगत हँसायौ ॥ 
    पर तिय द्रव्य लोभ लोचन में, अब लौं रहत समायौ ।
    प्रेम प्रवाह उमगि अलबेली, ताहि न धोइ बहायौ ॥ 
    उर में प्रीति नेंक नहिं आई, झूठौ स्वांग बनायौ ।
    भोरी धृग धर्म ध्वज पापी, जननी जनक लजायौ ॥ 
- verseNumber: "363."
  verseText: |
    हा!आयु सब सिरानी, जाग्यौ न भाग्य मेरौ ।
    अब तौ कृपालु प्यारी, अवलम्ब एक तेरौ ।
    मुस्कान माधुरी कौं, तरसत रही सदाही ।
    ना ओंठ खुलत देखे, ना दन्त कौ उजेरौ ॥ 
    दिन चार नीर ढारत, ढूँढ़त फिरौं दिवानी ।
    फिर अन्त धूर ह्वै है, सब चातुरी-बखेरौ ॥ 
    राख्यौ न मन दिवानौ, मो बाँधि तुमने लट सौं ।
    जो अब विषय मे भटकै तौ खोट कौन मेरौ ॥ 
    मधु देत जो मरै री, विष दीजिये की ताकौं ।
    क्यों दुख सौं मोहि मारौ, हँसि नेक क्यों न हेरौ?
    ललकत रहौं सदा ही, वे कंज पग परसिवे ।
    कर धूर निज गली में, किन दीजियौ बसेरौ ।
    ऐसी कठिन निलजता , अब लौं न देह छूटै ।
    बिनु देखे तोहि जीवन, यह कौन काम केरौ ।
    भोरी सौं काहे रुठौ, वा दिन अति निबल की ।
    कब तुमने बाँह पकरी, कब तुमने हँसि कै हेर्यौ ?
- verseNumber: "364."
  verseText: |
    मेरे कोटिक प्राण, हँसि-हँसि लीजिये,
    करि कृपा छिन एक दरसन दीजिये ।
    तुच्छ जो यह भेंट अनुचित यह विनय,
    तौ गली की धूरि अपनी कीजिये ॥ 
    जो न इतनौं भाग मेरी लाड़िली,
    तौ विरह की ताप नित तनु छीजिये ।
    यह उमंग नित ही बसे मेरे हिये,
    कैसे वह छवि नयन भरि-भरि पीजिये ॥ 
    तनु पुलक फाटत हियौ नयना सजल,
    अति विकल तो नाम लै-लै जीजिये ।
    भोरी दौं लागै विरह की देह में,
    तेरे द्वारे प्राण तलफत दीजिये ॥ 
- verseNumber: "365."
  verseText: |
    इतनौ माँगौ और या बिनु, कछु न माँगौ लाड़िली,
    तेरी मृदु मुस्कान देखत, प्राण त्यागौं लाड़िली ।
    प्रेम की तपि ताप पाहन, हीय पिघलैगौ कभू,
    बनि महावर कौन विधि, तो पाँव लागौं लाड़िली ॥ 
    चार दिन व्याकुल भटकती , तोहि बन ढूँढ़त फिरौं,
    एक क्षण धरि शीश पग पै, प्राण त्यागौं लाड़िली ।
    हाय बीते जन्म कितने, तुहि न देख्यौ आज लौं,
    आयु यह पुनि ढर चली, कब सोइ जागौं लाड़िली ॥ 
    उन युगल खंजन को धरि, राखी निछावर तुच्छ यह,
    आयु बीती तुम बिना, किमि प्राण त्यागौं लाड़िली ।
    अब तौ भोरी करि कृपा, मेरी भुजा हँसि कै गही,
    छोड़ि सब तृन तुल्य, तव पद प्रेम पागौं लाड़िली ॥ 
- verseNumber: "366."
  verseText: |
    तोहि ढूँढन कुंज आवौंगी अवसि,
    टेर द्वारे पै लगावौगी अवसि ।
    कौन मुख लै लौट जावौंगी विमुख,
    प्राण द्वारे पै गवावौंगी अवसि ॥ 
    जब लौं उमगौगी न मेरी लाड़िली,
    टेरती जीवन बितावौंगी अवसि ।
    कैसे मेरी ओर देखौंगी नहीं,
    तो कृपा यह हठ छुड़ावौंगी अवसि ॥ 
    गुरु कृपा अवलम्ब यदि पैहौं कछू,
    टेर सौं तिहुँ  पुर डुलावौंगी अवसि ।
    तुम उबारौ मत उबारौ करि कृपा,
    भौर में नौका चलावौंगी अवसि ॥ 
    प्रेम पथ की अग्नि जोपै अति कठिन,
    हौं शलभ गति तामें धावौंगी अवसि ॥ 
    जो कभू वह छवि समावै नयन में,
    ढाँपि दृग हिय में छिपावौंगी अवसि ।
    जो सुधा मुस्कान मिलिवे की नहीं,
    द्वार पै विष तेरे खावौंगी अवसि ॥ 
    खून जोपै नयन सौं बरसत नहीं,
    बैठि कैं आँसू बहावौंगी अवसि ।
    भोरी जो रुचि होइ सो तुम कीजिये,
    मैं तौ तेरी ही कहावौंगी अवसि ॥ 
- verseNumber: "367."
  verseText: |
    दरद देह , फिर दवा किशोरी,
    पहलै प्रेम, निबाह बहोरी ।
    तजि सब बिकल बिपिन भटकावौ,
    ओचक बाँह गहौ फिर मोरी ॥ 
    पहलै बिरह की ताप तपावौ,
    फिर मिलि देहु रँग में बोरी ।
    पहिले तौ हिय अति उमगावौ,
    फिर तहँ आप समाइ रहौरी ॥ 
    प्रथम टेरती भूमि गिरावौ,
    फिर उठाइवे धाइ झुकौरी ।
    व्याकुल प्रथम नीर ढरबाबौ,
    फिर दिखाऊ मुसकान जु थोरी ॥ 
    मूँदे नयन ध्यान करबाबौ,
    अचक मूंद दृग मन्द हँसौरी ।
    पहिले मन मेरौ करहु दिवानौ,
    फिर लट बांध राखो बरजोरी ॥ 
    ज्यों रीझौं सो मोपै करावौं,
    फिर हँसि रीझौ कृपालु किशोरी ।
    पहिले आरत बिनय कहावौ,
    उमगि सत्य फिर कीजिये भोरी ॥ 
- verseNumber: "368."
  verseText: |
    अपनी दिवानौ , राखौ आप सम्हारी ।
    यह मन मेरौ सम्भार्यौ न सम्भरत, हौं जु सम्भारत हारी ॥ 
    लोक लाज कुल मैड़ छाड़ि कै, कर्म-धर्म-ब्रत टारी ।
    यह तौ उमगि-उमगि उठि धावत, सब ही संक बिसारी ॥ 
    भाग-अभाग गिनत न किशोरी, भलौ बुरौ न बिचारी ।
    कुगति-सुगति कौ सोच नहीं कछु, चाहत रूप सुधारी ॥ 
    राखौ बाँधि आपनी लटसौं, कोमल चित सुकुमारी ।
    यह तौ प्यासौ तेरे रूप कौ, ललकत रहत सदारी ॥ 
    हौं तौ तोहि आज ही सौंपत, कहत पुकार पुकारी ।
    भोरी अन्त कहूँ जो भटकै , तौ अब भूल तिहारी ॥ 
- verseNumber: "369."
  verseText: |
    ढारि-ढारि जल धोये नैन ।
    कबहूँ अमल कमल पग इन में, धरि हौ करुणा ऐन ।
    वेग उमगि किन उठत किशोरी, श्यामसुन्दर सुख दैन ॥ 
    दरसन कौ तन-मन अकुलावै, हिय नहिं आवै चैन ।
    भोरी दीन दुखारी आरत, टेरत धीर धरैन ॥ 
- verseNumber: "370."
  verseText: |
    कठिन अभाग देखि कै अपनीं, हा-हा हौं पछतात ।
    कहा कहौं तुम बिनु करुणानिधि, देह न छाड़ि जात ॥ 
    नहिं दृग मूंद ध्यान धरि बैठत, नहिं देखन अकुलात ।
    नहिं बन धाइ ढुंढिवे आवत, तलफि न प्राण पठात ॥ 
    वृथा दिवस बीतत करुणानिधि, व्यर्थ जात सब रात ।
    लागत लाज हिये अति प्यारी,मुख नहिं आवत बात ॥ 
    हित हरिवंश प्रेम रस सागर, त्रिभुवन जस विख्यात ।
    भोरी सहज प्रीति की याचक, तुम्हें टेरि रहि जात ॥ 
- verseNumber: "371."
  verseText: |
    हा! राधे प्राण चले जैहैं ।
    मन की हौंस रहैगी मन मे, तुम पै वारि न पैहैं ।
    इक दिन मरन अवसि अलबेली, कब लग राखे जैहैं ॥ 
    जीवन तौ बीतयौ पछताते, मरत अधिक पछितैहैं ।
    भोरी सहज कृपालु किशोरी, तुम बिन काहि चितैहैं ॥ 
- verseNumber: "372."
  verseText: | 
    पद पंकज मन मधुप बसत ना,
    जगजंजाल तजि अलक फसत ना ।
    कोटिक यत्न हेरि हिय हारी,
    नयन कोर हिय माहिं धसत ना ।
    इतनौ सोच रहत मन माहीं,
    मुकुर सरस छवि हिय निकसत ना ।
    दृग जल बहत कबहूँ करुणानिधि,
    पै तब चरण कमल परसत ना ।
    विलपत आयु बीतिहै जानी,
    दृग सन्मुख तुम कबहुँ हँसत ना ।
    कैसे प्राण कोटि तजि डारौं,
    सो छवि नयन छिनहु दरसत ना ।
    कृपा कोर तिहँ लोक डुबोये,
    मो चातक पै कछु बरसत ना ।
    झूठी प्रीति जनावत तुमकौं,
    लखि कृपालु क्‍यौं रीझि हँसत ना ॥ 
    काधौं करौं कहौ हँसि प्यारी,
    हिय में प्रेमभाव विकसत ना ।
    भोरी मिटै अभाग कौन विधि,
    जो तब विरह प्राण निकसत ना ।
- verseNumber: "373."
  verseText: |
    इतनौं मांगौ प्राण दैकै हाथ में,
    लट सम्भारो तेरी लैके हाथ में ।
    कब किशोरी लाड़िली करुणायतन,
    भुज गहौ हँसि-हँसि चितैकै हाथ में ॥ 
    कुञ्ज गलियन ढूंढिबै तुम कौं कभू,
    आइ हौं निज सीस लैके हाथ में ।
    तब दरस बिन अबतौ प्यारी रहि गयौ,
    प्राण दिवौ विष अंचैकै हाथ में ॥ 
    कौन भागन होऊँगी रति-कुज्ज फूल,
    खेलि हौ छिन मोहि लैकै हाथ में ॥ 
    धूरि पै भोरी के जो आवौ कभू,
    प्यारी रज लीजौ चितैकै हाथ में ॥ 
- verseNumber: "374."
  verseText: |
    तेरे द्वारे प्राण दैवे आइहौं,
    अब न खाली , लौट जैवै आइहौं ।
    कब तलक रहि हौं मनोरथ ही करत,
    झूठ कौ सच कर दिखैवै आइहौं ।
    अब तौं बिलपत द्वार आरत टेरि कैं,
    लोग या ब्रज के हँसेवै आइहौं ।
    तेरे पद कोमल कमल की आस पै,
    राह में लोचन बिछावै आइहौं ।
    तेरे पद की धूरि लैवे के लिये,
    धूरि में तन-मन मिलैवे आइहौं ।
    हौंस मन की अब तौ कर गुजरौं अवसि,
    सीस दैवे , रीझि लैवे आइहौं ।
    भोरी तुम उमगौ न उमगौ लाड़िली,
    मैं तौ हठ प्राणन गंवैवे आइहौं ॥ 
- verseNumber: "375."
  verseText: |
    कबहूँ हृदय हठ ठान न देखी,
    कुल दीपक वृषभान न देखी ।
    रहि हैं प्राण पोच तन कबलौं,
    परखि कृपा की बान न देखी ॥ 
    सब जग देखि कहा दृग पायौ,
    जो तेरी मुस्कान न देखी ।
    सुनियत कृपा सुधानिधि प्यारी,
    पै कबहूँ तजि प्रान न देखी ॥ 
    ललकत रही जखम खैवे कौ,
    दृग-सर भौंह-कमान न देखी ।
    आरत टेरि पुकारि किशोरी,
    उमड़त कृपा निधान न देखी ॥ 
    तुम बिनु राखत प्राण आज लौं,
    ऐसी निलज जग आन न देखी ।
    उमड़त क्यों न कृपानिधि भोरी,
    पै मोसी अघ खान न देखी ॥ 
- verseNumber: "376."
  verseText: |
    ऐसौ दिन आवे कि तेरे द्वार टेरें ही बनें,
    प्राण दीन्हें ही बनै, मुस्कान हेरे ही बने ।
    ऐसी गिर मग में रहौं, तुमकौं कृपानिधि लाड़िली,
    हाथ गहते ही बने, दृग-दृष्टि फेरे ही बनै ॥ 
    रुठि चलि हैं प्राण छिन में, छाँड़ि कै जब देह कौं,
    तुमकों आते ही बनै,रहिबे कौ मेरे ही बने ।
    या दिवाने मन को जब सौंपौंगी तेरे हाथ में,
    लट सौं बांधे ही बने, जग सौं निबेरे ही बने ॥ 
    ऐसौ मन अकुलायगौ दरसन कौ मेरौ कौन दिन,
    नीर ढारै ही बने, भरि नयन हेरे  ही बनै ।
    भव गहन बन में भटकती दीन दुखिया मोहि कौं,
    हाथ पकरे ही बनै, हियरा उजेरे ही बनै ॥  
    आबतौ साधन मोसों कछुवै बनि न आवैं लाड़िली,
    आबतौ डूबे ही बनै, या तुमको टेरे ही बने । 
    भोरी मेरी ओर तुम भरि नयन हेरत नहीं,
    विष पिये ही अब बनै, हिय सर घुसेरे ही बने ॥ 
- verseNumber: "377."
  verseText: |
    सुधि किशोरी मेरी करि हौ कौन दिन,
    ताप या हियरा की हरिहौ कौन दिन?
    कब उमगि टेरौंगी मैं तुमकों कुँवरि,
    सुनि उमगि तुम दौर परिहौ कौन दिन?
    लोट रहिहौं कब विकल तो पंथ में,
    तुम अचक हिय पाँव धरिहौ कौन दिन?
    मैं तौ सुधि तजिहौं विरह की ज्वाल जरि,
    तुम सुधा दैवे ठहरि हौ कौन दिन?
    देखि सोवत सीस पत्थर पै दियै,
    हँसि कृपानिधि गोद धरिहौ कौन दिन?
    हौं पतित अति नीच पै आसा इति,
    आन अपनी आप ढरिहौ कौन दिन?
    गीत मेरे सुनिकै भोरी लाड़िली,
    रीझि मेरी भुज पकरि हौ कौन दिन?
- verseNumber: "378."
  verseText: |
    माधुरी भरि नयन पीजै कौन दिन,
    छबि तिहारी देखि जीजै कौन दिन?
    मौ हियौ नित तीन तापन सौं तपत,
    तेरे पद रस-रँग भीजै कौन दिन?
    टेर मेरी दुख भरी सुनिकै पुलकि,
    लाड़िली मेरी पसीजै कौन दिन?
    हा किशोरी, तुम कौं देखे बिनु कहौ,
    मेरौ तन पल-पल में छीजै कौन दिन?
    देखिके भरि नयन तेरी माधुरी,
    लाभ निज जीवन कौ लीजै कौन दिन?
    हौं कहावत रावरी दासी सदा,
    बाँह गहि बलि अपनी कीजै कौन दिन?
    तेरी लट पर प्राण कोटिक वारिये,
    इनकौं दीजै याहि लीजै कौन दिन?
    बारि छवि पै कै विरह दुख सौं तलफि,
    भोरी तुम पर प्राण दीजै कौन दिन?
- verseNumber: "379."
  verseText: |
    ऐसी द्वार कब टेर लगावौं,
    उमगौ और ताहि उमगावौं ।
    हौं तौ दीन छीन तन प्यारी,
    केहि विधि बहुविध बात बनावौं ।
    श्री हरिवंश कृपा मति पाऊँ,
    श्रील गुरु-महिमा प्रगट दिखावौं ॥ 
    लै तब नाम साँस जब खेंचौ,
    निज तन शलभ समान जरावौं ।
    बिल्व पात लौं सहज किशोरी,
    टेरत तीनहु लोक डुलावौं ॥ 
    खग मृग मूर्छि अवनि पर पटकौ,
    सरवर सोखि शैल दरकावौं ।
    रवि ससि चकित पंथ बिसरावै,
    सरित सिन्धु तरुवर उमगावौं ॥ 
    देब अदेव सिद्ध नर किन्नर,
    सबके सब व्यवहार भुलावौं ।
    कै देखौ भरि नयन किशोरी,
    कै तृण सम तिहूँ लोक जरावौं ॥ 
    बाढ़त नयन नीर झर लगै,
    प्रलय पयोधि उमगि उमड़ावौं ।
    बिनु देखे छिन धीर धरों नहिं,
    आप मिटौं सब विश्व मिटावौं ॥ 
    यह सब सम्भव सुनहु किशोरी,
    तेरी कृपा कोर जो पावौं ।
    भोरी बल तब हिये कृपानिधि,
    हौं तौ बहुत कहत सकुचावौं ॥ 
- verseNumber: "380."
  verseText: |
    रूठि प्राण तन छाँड़ि चलैंगे ।
    तो पद लोभ लुभाने प्यारी, धरि-धरि हठ मचलैंगे ।
    रूठे पथिक मनावन एहौ, कठिन अभाग्य टलैगे ॥ 
    आतुर पाँव पंथ में परि हैं, कुंडल कान हलैंगे ।
    उमगत कृपा-अम्बुनिधि लोचन, सब विधि अशुभ दलैगे ॥ 
    ललित चाल नूपुर धुनि नीकी, सब ही सुकृत फलैगे ।
    भरि दृग छबि अवलोकत भोरी, भले भाग्य संभलेंगे ॥ 
- verseNumber: "381."
  verseText: |
    कुंवर किशोरी विनती मानौं । 
    कब की टेरत द्वार रावरे, बार-बार हठ ठानौं ॥ 
    छिन इक उमगि कृपा किन कीजिय, हियको पीर पिछानौं । 
    दिल दरदीली सहज कृपानिधि, सहज कृपा कौ बानौं ॥  
    तो छबि दरस आस अकुलावत, मो मन प्रेम दिवानौं । 
    जो हिय हौंस सबहि तुम जानत, मुख केहि भाँति बखानौं ॥  
    कहि कछु कोमल चित्त किशोरी, दीन दुखी सन्मानौं । 
    जेहि विधि रहै रावरी छबि में, भोरो चित्त भुलानौं ॥

    ॥  दोहा ॥ 
    त्रिभुवन तृण सम त्यागि कै, गुरु पद कोजिय वास ।
    भोरी हित बलि हिय बढ़ै, जुगल मिलन की आस ॥ 
- verseNumber: "382."
  verseText: | 
    अखियाँ देहु रूप रस मातीं ।
    अरबरात मिलिवे कौ निसि दिन, छिन-छिन अति अकुलातीं ।
    उड़ि-उड़ि रहत कञ्ज मुख ऊपर, अलि लौं उमगि सुहातीं ॥ 
    इक टेर हेर रहत हठ अरि-अरि , गिनत द्यौस ना रातीं ।
    चन्द चकोर सरस मिलि अटकत, रस की तृषा बुझातीं ॥ 
    करत कलोल अगाध रूपनिधि, परी मीन की भाँतीं ।
    ह्वै फकीर नित रहत रूप की, तन मन लौं विसरातीं ॥ 
    एक नैम छबि पान निरन्तर, ज्यौं चातक जल स्वाँतीं ।
    हुलसत उमगत बरसत झूमत, छकित चकित रोग रातीं ॥ 
    मृग मद सरस भाल पै, अँखियन काजर लौं जु समातीं ।
    वह छवि छाँड़ि न हेरत काहू, नहिं विषयन ललचातीं ॥ 
    अति रिझवार उदार सुन्दरी, करुणा कोमल गातीं ।
    भोरी हित हँसि आस पुजावौ, छिनक हेरि मुस्कातीं ॥ 
- verseNumber: "383."
  verseText: |
    ऐसौ गिरिवौ कुंवर किशोरी, कब मोसौं बनि आवै ।
    कोमल कनक कमल कर कबहूँ, उमगि कृपालु उठावै ।
    ऐसी टेर कौन दिन करि हौं, बरबस धीर छुड़ावै ॥ 
    कोमल चित्त कृपालु किशोरी, अति आतुर उठि धावै ।
    तन-मन की सँम्भार रहै कछु, भूषण वसन भुलावै ॥ 
    धीरज धरत बने नहिं क्‍यौं हू, पल-पल अति अकुलावै ।
    भोरी हित मेरी कहि मुख सौं, बार ही बार बुलावै ॥ 
- verseNumber: "384."
  verseText: |
    कबहूँ बदन कमल दिखरैहौ ।
    कोमल चित कृपालु करुणानिधि , हँसि-हँसि हृदय समैहौ ॥ 
    गूँथित अलक तिलक माथे पै, सैंदूर माँग पुरैहौ ।
    नाक बुलाक नयन अंजन जुत, चितवन बंक चलैहौ ॥ 
    चिबुक चारु भृकुटि अति बाँकी, अधर मधुर मुस्कैहौ ।
    कोटि मयंक बदन की सोभा, हास सुधा बरसैहौ ॥ 
    साँवल बिंदु चिबुक पर राजत, सो छबि हृदय बसैहौ ।
    भोरी बहुत कहा मुख कहिये, अँखियाँ तृषित सिरैहौ ॥ 
- verseNumber: "385."
  verseText: |
    बिनु देखे कैसे धारौं धीर ।
    त्रिभुवन शोभा धाम किशोरी, बिहरत जमुना तीर ॥ 
    नव-नव गति लै ढरत रास में, फहरत अंचल चीर ।
    झलकत गात निचोल नील में, जनु ससि जमुना नीर ॥ 
    लटकत लर च्वै चली सुधा मनु, बाजत मृदु मंजीर ।
    चंपक कनक कांति मिलि सोहत, कोमल कमल शरीर ॥ 
    ऐसे अधिक सिकारी कीन्‍हें, भृकुटि धनुष दृग तीर ।
    सांवल बिंदु श्याम मन डारे, चिबुक कूप गम्भीर ॥ 
    देखन कौं नयना अकुलावै, हियौ तपत भव पीर ।
    कौन भाग तनु परसहि प्यारी, अंचल डुलत समीर ॥ 
    सहज कृपालु किशोरी स्वामिनि, हरहु सकल भव भीर ।
    भोरी दीन दुखारी राखौ, भुज गहि कुञ्ज कुटीर ॥ 
- verseNumber: "386."
  verseText: |
    कैसे धीर हिये में आनौं ।
    सो छवि अजहूँ देखियत नाहीं, जो लखि श्याम बिकानौं ॥ 
    सो दृग कोर गड़ी न उर में, सो वपु दृगन समानौं ।
    सो मुसिकान माधुरी देखत, हियरा तौ न जुड़ानौं ॥ 
    हा हरिवंश किशोर लाडिले, जीवन वृथा सिरानौं ।
    मोकौं इक अबलम्ब रावरौ, हौं कछु और न जानौं ॥ 
    सहज कृपाल कृपा करि कीजै, प्रगट कृपा कौ बानौं ।
    भोरी गोद पसारि रावरे, द्वारे बिनती ठानौं ॥ 
- verseNumber: "387."
  verseText: |
    जो पै जिवावौ तो ऐसे जियावौ ।
    करुणा धाम कृपाल कृपानिधि, सन्मुख मृदु मुस्कावौ ।
    मोहन प्रान जीवन धन सरबस, सो मो हृदय समावौ ॥ 
    मुदित सम्भारत कच मुख छूटे, कर गहि हृदय जुड़ावौ ।
    तुम बिन और लखों नहिं काहू, दृग छवि में अटकावौ ॥ 
    नित नव छबि नव रूप माधुरी, दृग पुट भरि-भरि प्यावौ ।
    भोरी दीन दुखारी श्री हित, चरणन सुवस बसावौ ॥ 
- verseNumber: "388."
  verseText: |
    कहौ कृपालु मोल मोहि लैहौ ।
    खोटी दीन दुखारी पामर, कृपा कोर अपनैहौ ॥ 
    तिहुँपुर सुयश विदित अलबेली, मेरी विनय चित लैहौ ।
    सर्वोपरि उमगीली राधे, मोसी पोच निभैहौ ॥ 
    साधन साध्य निदरि हौ सब ही, श्रुति की लीक मिटैहौ ।
    भोरी श्री हित नातौ नीकौ, चरणन सुबस बसैहौ ॥ 

- verseNumber: "389."
  verseText: |
    द्वार रावरे मरिबौ नीकौ, विरह ताप सौं जरिवौ नीकौ ।
    जो तुम ठहरौ भरि दृग देखन, विकल पंथ में परिवौ नीकौ ।
    जो तुम उमगि सुधारन आवौ, तौ यह भाग्य बिगरिवौ नीकौ ॥ 
    दरस प्यास अकुलात किशोरी, ढूँढ़त बिपिन बिचरिवौ नीकौ ।
    जीवन व्यर्थ गयौ सब हा-हा, दृग दो दिन जल ढरिबौ नीकौ ।
    उठिबौ भलौ न भुज बिन पकरै, आरत द्वार पै ररवौ नीकौ
    रहिबौ भलौ अटकि कै छबि में, सुधि बुधि सबहि बिसरिवौ नीकौ ॥ 
    कृपा सिन्धु हित दीन दुखी की ,उमगत बाँह पकरिबौ नीकौ ।
    कुञ्जन जात नवल अलबेली, बूझन कुसल ठहरिवौ नीकौ ॥ 
    छूटी लटन सम्भारत मुख पै, अचक पाँव हिय धरिवौ नीकौ ।
    सुनिवौ भलौ न आरत बानी, दसन-छटा तम हरिबौ नीकौ ॥ 
    मेचक कच दृग काजर रेखें, हिय समाइ उर अरिबौ नीकौ ।
    किसलय सयन पधारन प्यारी, भोरी की सुधि करिबौ नीकौ ॥ 
- verseNumber: "390."
  verseText: |
    तुम बिन जीवन भावत जाहि, जीवत कहौ कौन विधि ताहि ।
    जीवन लाहु यही करुणानिधि, अटक रहैं लोचन छवि माहिं ॥ 
    वा रंग रँगे नयन हित झूमै, विषयन में ना कबहूँ जाहिं ।
    इती मोहि अभिलाष किशोरी, बसहूँ सदा पद-पंकज छाहिं ॥ 
    विष सम लगै और सुख जेतौ, तुम बिन कछू सुहावै नाहिं ।
    मो पामर तन नयन जु फेरहु, शिव ब्रह्मादिक देखि सिहाहिं ॥ 
    कै भरि नयन दरस सुख पाऊँ, कै तन त्यागौं द्वार कराहिं ।
    इतनौ याचत भोरी किशोरी, पाहि-पाहि दरदीली पाहि ॥ 
- verseNumber: "391."
  verseText: |
    चलत-चलत हँसि हेरिये इत छिन ।
    कोमल चित्त कृपालु किशोरी, तुम बिन बीत गये बहुते दिन ।
    विलपत ढूँढ़त दिवस कटैं कब, निशा बीति है गुण-गण गिन-गिन ॥ 
    छिन-छिन अति अकुलैहै हियरा, देखौ कछु न रुचे कब आँखिन ।
    हा-हा अब न जियावौ प्यारी, भोरी दृग भरि दरस मिले बिन ॥ 
- verseNumber: "392."
  verseText: |
    चलत-चलत मो तन हँसे हेरौ ।
    आलस बलित नयन अरुणारे, कृपा कोर छिन इत हू फेरौ ॥ 
    आरत टेरत आयु सिरानी, तुम बिन और न कोऊ मेरौ ।
    पूछौ कुशल बिहँसि करुणानिधि, दारूण त्रास हरहु हिय केरौ ॥ 
    मुख मयंक छिन प्रगट दिखावौ, जेहि बिन तिहुँपुर लगत अँधेरौ ।
    भोरी चरण शरण चली आई, अब सब भाँति भरोसौ तेरौ ॥ 
- verseNumber: "393."
  verseText: |
    चलत-चलत हँसि हेरिय प्यारी ।
    कृपासिंधु दरदीली स्वामिनि, कोमल चित सुकुमारी ॥ 
    उमगि बेगि किन द्रवहु किशोरी, टेरत दीन दुखारी ।
    खोटी रंक अभागी पामर, सब विधि पोच भिखारी ॥ 
    तुम सौं आस तदपि करुणानिधि, ठाड़ी गोद पसारी ।
    नीच पतित भरि नयन निहारौं, समरथ राखन हारी ॥ 
    तुम बिन ठौर कहूँ नहिं सूझत, नयन लगत अंधियारी ।
    भोरी त्रिभुवन सूनौ तुम बिनु, कछुव सुनावत नारी ॥ 
- verseNumber: "394."
  verseText: |
    अधमन हित चिरजीवहु प्यारी ।
    तुम नित राज करौ दरदीली, औरन सौं कहु काज कहारी ॥ 
    सेवा गुण लखि रीझत सब ही, पोच देत द्वारे सौं टारी ।
    पामर पतित निबाहन कारन, त्रिभुवन कीरति विदित तिहारी ॥ 
    कोऊ रहौ जाहु करुणानिधि, तुम रस बिलसहु स्वबस सदारी ।
    भोरी हित द्वारे पै ठाड़ी, देत असीस जात बलिहारी ॥ 
- verseNumber: "395."
  verseText: |
    पतितन हित नित कीजिय राज ।
    अधम उधारण सहज कृपानिधि, सकल लोक सिरताज ।
    स्वारथ के सब मीत जगत में, अन्त न आवत काज ॥ 
    तुम बिन कौन राखिबे बारौ, पामर जन की लाज ।
    नित की बान सहज करुणा की, कहाँ बिसारी आज ॥ 
    तुम बिन कौन काम के प्यारी, जीवन सम्पति साज ।
    भोरी ऐसेहि जुग-जुग राजहु , नवल निकुञ्ज समाज ॥ 
- verseNumber: "396."
  verseText: |
    कुञ्ज जात छिन इतहूँ चितैये ।
    कोमल चित कृपालु करुणानिधि, हिय की ताप बुझैये ।
    हौं कब की ललचात किशोरी, हँसि-हँसि आस पुजैये ॥ 
    नयन कोर रँग बोर कृपा करि, चरणन सुवस बसैये ।
    भोरी कुसुम-सेज दोऊ राजहु, कोटिक काम लजैये ॥ 
- verseNumber: "397."
  verseText: |
    कहौ कृपालु कहा मन ठानी ।
    निज हिय की बहु बेर कही मैं, हिय अभिलाष कहानी ।
    निज हिय की अब कहौ कृपा करि, कोमल चित सुखदानी ॥ 
    मैं तो द्वार टेरि हौं तुम्हरे, हौं तौ हाथ बिकानी ।
    तुम हू कभू कुशल बूझौगी, अपनी जान दिवानी ॥ 
    नित की बान सहज करुणा की, सुनहु सुबस महारानी ।
    भोरी दीन दुखारी याचक, टेरि-टेरि घबरानी ॥ 
- verseNumber: "398."
  verseText: |
    आरत टेर सुनहु दुखिया की, टेरत द्वार भिखारी सदा की ।
    जप-तप-संयम-नियम अपारी, वेद शास्त्र सब कहत पुकारी ।
    मोकौं भली इक आस तिहारी, तुमकौं भली यह बान कृपा की ॥ 
    मोकौं भलौ थकि भ्रम महि परिबौ, तुमकौं भलौ झुकि बाँह पकरिबौ ।
    मोकौं भलौ तोहि टेरत मरिबौ, तुमकौं बरसिबौ वृष्टि सुधा की ॥ 
    तुमहि निबाह करौ पोचन की, हरिबौ ताप दुखारी जन कौ ।
    मोहि भलौ इतनौ अलबेली, सब जग कहत दासी राधा की ॥ 
    तुमकौं भलौ अभाग मिटैबौ, मोकौं भलौ अभागिन ह्वै बौ ।
    भोरी पतित , पतितपावन तुम, लाड़ लड़ैती भानु बबा की ॥ 
- verseNumber: "399."
  verseText: |
    अँखियाँ बार-बार हठ ठानत ।
    बिनु विधु-बदन बिलोके प्यारी, एकहु ज्ञान न मानत ॥ 
    स्वर्ग-मुक्ति सुर दुर्लभ पदवी, तृन लौं चित न आनत ।
    साधन तुच्छ अल्प फल तिन के, सुगति-कुगति नहिं जानत ॥ 
    सहज कृपालु बान बिन कोऊ, उर अबलम्ब न मानत ।
    भोरी हित टेरत अति आरत, एक तुमहिं पहिचानत ॥ 
- verseNumber: "400."
  verseText: | 
    इन नैनन कौ मोहि भरोसौ ।
    इन समान को पतित उधारन, पतित पोच को मोसौ ॥ 
    उमड़त कृपा नीर-निधि लोचन, परि है सुरंग छटारी ।
    तन मन भीजि छिनक में जैहै, सुनहु कृपानिधि प्यारी ॥ 
    इनकी बान सहज दरदीली, सोई आसरौ मेरे ।
    कठिन अभाग पलक में मिटि है, एक नजर भर हेरे ॥ 
    इनकी आस जन्म में हार्यौ, अब जो होइ सु होई ।
    भोरी सहज कृपालु लाड़िली, तुम बिन और न कोई ॥ 
- verseNumber: "401."
  verseText: | 
    छिन कृपालु मो तन हँसि हेरहौ ।
    हौं नित टेरत द्वार रावरे, तुम तौ कभू मोहि टेरौ ॥ 
    तुम बिनु वृथा जियत सुख संपति, लागत त्रास घनेरौ । 
    असन-बसन-विष तन मन बोझौ, तिहुँपुर सबहि अँधेरौ ॥ 
    सब नातौ तुम हो सौं प्यारो, तुम बिन और न मेरौ । 
    भोरी हित अलबेली कबहूँ, दीजै चरण बसेरौ ॥ ।
- verseNumber: "402."
  verseText: |
    चन्द्र बदन मुस्कान विलोकौं, त्रिभुवन सुषमा-खान विलोकौं ।
    उमगत नाहिं आजहू प्यारी, पै कबहूँ दै प्रान विलोकौं ॥ 
    कौन भाग्य ऐसौ दिन आवै, उमगत कृपा निधान विलोकौं ।
    हौं किम प्रीति-रीति सौं रीति, परखि कृपा की बान विलोकौं ॥ 
    नैनन-नयन फँसे दोऊ प्यारे, करत माधुरी-पान विलोकौं ।
    श्रीहरिवंश कृपालु कृपा सौं, मोहन प्रान की प्रान विलोकौं ॥ 
    आलस भरी प्रात चलि आवौ, नींद विवस अंगड़ान विलोकौं ।
    पतित निबाह बान हित भोरी, छाँड़ि निगम कुलकान विलोकौं ॥ 
- verseNumber: "403."
  verseText: |
    अँखियाँ जो पै चकोरी होती ।
    तौ उड़ि चन्द्र बदन लगि रहती, बैठि-बैठि क्‍यों रोती ॥ 
    इक टक सुधा-माधुरी छाकी, उमगि-उमगि पग धोती ।
    भोरी हित नित तरसत द्वारे, वृथा जन्म क्‍यों खोती ॥ 
- verseNumber: "404."
  verseText: |
    खँजन खग जो होते नैन ।
    तौ उड़ि श्री बन किन चलि आते, लाहु जन्म कौ लैन ॥ 
    अलकन फन्द फँसे ही रहते, मत्त मूँदि दिन-रैन ।
    करि हठ हौंस हार ही मानी, करतब कछुब बनेन ॥ 
    सब विधि पोच पतित पामर हौं, सुनहु श्याम सुख दैन ।
    दृग ललचात माधुरी प्यासे, हृदय न आवत चैन ॥ 
    कबहूँ उमगि द्रवौ अलबेली, प्यारी करुणा ऐन ।
    भोरी हित अकुलात द्वार पै, टेरत आरत बैन ॥ 
- verseNumber: "405."
  verseText: |
    लट सम्भारत लाड़िली आवौ कभू,
    मेरौ मन हँसि बाँधि लै जावौ कभू ।
    दिन बहुत तुम बिनु जियत बीते प्रिया,
    यह निलजता मेटि मुसिकावौ कभू ॥ 
    नयन प्यासे देखिबे तरसत बिकल,
    माधुरी पीयूष बरसावौ कभू ।
    मेरौ मन मचलत तुम्हें दृग देखिबे,
    ये दिबानौ अपनौ समझावौ कभू ॥ 
    टेर द्वारे पै करत बीत्यौ जन्म,
    अब तौ करुणा सिन्धु उठि आवौ कभू ।
    तेरी तन-मन भेंट मृदु मुस्कान की,
    आइ कै यह मोल निबटावौ कभू ॥ 
    जो पै हिय की ताप झूठहि हौं कहत,
    पग हृदय धरि मोहि सरमावौ कभू ।
    हौं बिकी हरिवंश हित के नाम पै,
    भोरी हित गहि बाँह अपनावौ कभू ॥ 
- verseNumber: "406."
  verseText: |
    सब नातौ मैं तुम सौं मानत ।
    इतनी कबहूँ कहौ हँसि तुमहू, हौकि नहीं मोहि जानत ॥ 
    कबहूँ मैं गुण बरनत तुम्हरे, कबहूँ बिनती ठानत ।
    कहौ कभू सुधि तुमहूँ करत हौ, निज चेरी करि मानत ॥ 
    तुम बिन और न कोऊ मेरे, सौं नित टेरि बखानत ।
    कहौ दीन दरदीली तुमहूँ, दीन दुखी पहिचानत ॥ 
    तुम्हरी कृपा एक बल मेरै, भाग-अभाग न जानत ।
    कहि द्वय बचन कभू हित भोरी, क्यों न प्रिया सन्मात ॥ 
- verseNumber: "407."
  verseText: |
    मो मन कहत कृपालु किशोरी, कभू कृपा करि आवौगी ।
    आरत टेर दीन दुखिया की, सुनत उमंगि उठि धावौगी ॥ 
    कुंतल कुटिल सम्भारत धावत, हँसि-हँसि हृदय लगावौगी ।
    फहरत अंचल चंचल कुंडल, पल-पल अति अकुलावौगी ॥ 
    ललित चाल नव वयस मनोहर, नूपुर मधुर बजावौगी ।
    बरसत रंग रँगीली अँखियाँ, रँग में मोहि डुबावौगी ॥ 
    अति बलहीन छीन दुखिया कौं, भुज गहि आइ उठावौगी ।
    भोरी हित यह रीति सदा की, अब फिर प्रगट दिखावौगी ॥ 
- verseNumber: "408."
  verseText: |
    काके बल अभिमान करौंगी ।
    बिनु भुज गहै कृपालु लाडिले, किस विधि धीर धरौंरींगी ।
    हिय में नव उमंग छिन ही छिन, करि-करि हौंस मरौंगी ॥ 
    कौन भाग सन्मुख दृग देखत, पंकज पाँव परौंगी ।
    केहि बल भुक्ति-मुक्ति सुर दुर्लभ, पदवी हिय न धरौंगी ॥ 
    अति निसंक सब ही सौं न्यारी, निगम नीति निदरौंगी ।
    भोरी हित-प्रभु पद मधुमाती, कब कुंजनि बिचरौंगी ॥ 
- verseNumber: "409."
  verseText: |
    मृदु मुस्कान देखिबौ भावै ।
    अरबरात दृग चातक प्यासे, पल छिन धीर न आवै ॥ 
    मृदुल मनोहर मूरत सुन्दर, देखत मन ललचावै ।
    सब जग सूनौ लगत कृपानिधि, तुम बिनु कछु न सुहावै ॥ 
    वृथा भानु उगत नभ चन्दा, वायु त्रिविध बहि आवै ।
    त्रिभुवन निबिड़ अँधेरी तुम बिन, ताप अधिक अधिकावै ॥ 
    सोचत समझत बनत न कछुवै, तन-मन अति अकुलावै ।
    भोरी श्री हित द्वार याचकी, ललक-ललक रहि जावै ॥ 
- verseNumber: "410."
  verseText: |
    ठाड़ी द्वार भिखारिन कब की ।
    लै-लै नाम पुकारत आरत, अँखियाँ प्यासी छबि की ।
    नहीं दृग ढरत न फरकत बैयाँ, रीति नई यह अब की ॥ 
    चलत उतावल पंथ , परत नहीं श्रुति, धुनि नूपुर रब की ।
    सब कोऊ कहत पोच प्रति पालक, राखन हारी सब की ॥ 
    मैं केहि भाँति कहौ करुणानिधि, उलटि कथा अनुभव की ।
    भोरी हित बलि विनय विचारौ, बिरद सम्भारौ अब की ॥ 
- verseNumber: "411."
  verseText: |
    मैं भोरी मेरी भोरी किशोरी ।
    मैं भोरी सी बिनती लाई, तुम रीझन में भोरी ।
    छोटे मुख बड़ विनय लाड़िली, विहँसि बेगि पुजवौरी ॥ 
    भोरी स्वामिनि भोरी चेरी, नातौ नेह भलौरी ।
    भोरी हित हरिवंश कृपा बल, सत सम्बन्ध जुरौरी ॥ 
- verseNumber: "412."
  verseText: |
    कमल दल नैनन की आस ।
    कबहूँ उमगि बूझि हौ मेरे, मन की हौंस-हुलास ॥ 
    उमड़त कृपा सिन्धु परिपूरण, सब सुषमा की रास ।
    चितवन चपल हिलोरत चहुँ दिसि, तापर भृकुटि विलास ॥ 
    दरदीले रिझवार दीन हित, अति उदारता वास ।
    सील सँकोच स्नेह सुभगता, लाज रूप रस हास ॥ 
    मधु मद भरे रँगीले प्यारे कोमल कमल विकास ।
    भोरे चतुर लड़ैंते पैने, करत दीन भय नास ॥ 
    जाकी पद रज शिव-अज याचत,सो जिनकौ निज दास ।
    भोरी हित देखन कौं ललचत, छिन-छिन छवि की प्यास ॥ 
- verseNumber: "413."
  verseText: |
    इतनौ है पुरुषारथ मेरौ ।
    जप तप योग याग नहिं जानौ, साधन नियम बखेरौ ॥ 
    इतनी बात बनि परै मोसौं, कबहूँ अबेर सबेरौ ।
    भोरी ढार-ढार दृग आँसू, नाम पुकारूँ तेरौ ॥ 
- verseNumber: "414."
  verseText: |
    यों सुधि लीजौ नवल किशोरी ।
    वृन्दावन की ललित लतन में,गिनती कीजौ मोरी ॥ 
    गोरी घटा साँवरी हिलमिल, उमड़त प्रेम हिलोरी ।
    कबहुँ-कबहुँ बलि सींचत रहियौं, लाड़ भरी दृग कोरी ॥ 
    कबहूँ दिये ललित गलबहियाँ, छाँह विरमियौ थोरी ।
    कबहूँ झूला डारि झूलियो, रसिक रँगीली जोरी ॥ 
    फूलि-फूलि कै चटकत कलियन,खोलौं आँख करोरी ।
    निसि बासर देखत न अघाऊँ, इतनौ जाँचत भोरी
- verseNumber: "415."
  verseText: |
    शरणागति

    लग्यौ नेह सब भाँति निभैहौ ।
    ये मेरे मन सुदृढ भरोसौ, बाँह गहे की लाज लजैहौ ॥ 
    लोक वेद परलोक जाति कुल, पाप पुण्य दुख द्वन्द छुड़ैहौ ।
    भोरी आपनि जान कृपा करि, श्री पद-पंकज सुबस बसैहौ ॥ 
- verseNumber: "416."
  verseText: |
    तो बिन और न कोऊ मेरे ।
    तन मन चित्त प्राण करुणामय, सब विषयन के चेरे ।
    यह बैरी निशि वासर मोकों, देत जु त्रास घनेरे ॥ 
    तिनकौ कौन आसरौ मोकों, मैं गरजत बल तेरे ।
    हठ हिय आइ बसौ अलबेली, भोरी भाग्य जगेरे ॥ 
- verseNumber: "417."
  verseText: |
    मैं तो रावरे हाथ बिकानी ।
    भव जलनिधि सौं अब न डरौंगी, सत्य कहौं हठ ठानी ।
    रहौ कि जाहु सोच नहिं मेरे, लोक लाज कुल कानी ॥ 
    संजम व्रत श्रुति साधन जेते, तिन सब कौं दियौ पानी ।
    भोरी सब विधि अधम उधारण, अलबेली ठकुरानी ॥ 
- verseNumber: "418."
  verseText: |
    तेरी ह्वै अब कौन सौं डरि हौं ।
    नर्कन की न कछू मोहि चिन्ता, रुचि ऐहै सोई करि हौं ।
    डर न कछू इंद्रिन कौ मन कौ, अब स्वछन्द विचरि हौं ॥ 
    सोच न पोच कहाये जग में, यम की भीति न धरि हौं ।
    जानत हौं तुम आइ अबहूँ हठ, भोरी बाँह पकरि हौं ॥ 
- verseNumber: "419."
  verseText: |
    भाग्य हीन खोटी को लैहै ।
    को नित लाड़ लड़ाय राखि है, नित मुँह मांगौ दैहै ॥ 
    को सब दोष मेटिहै पल में, हृदय प्रेम सरसेहै ।
    भुज दै अंस कुञ्ज को चलि है, करुणा कोर चितैहै ॥ 
    को भव-ताप सहज हँसि हरिहै , रोवत आइ हँसेहै ।
    को दयाल महि परत विकल तनु, भुज गहि आइ उठैहै ॥ 
    को भव-भँवर बहत करुणानिधि, कर गहि पार लगैहै ।
    सुर मुनि दुर्लभ सहज सुगति दै, को नित सुबस बसैहै ॥ 
    सुनहु कृपालु किशोरी ऐसी, आसा कौन पुजैहै ।
    तुम बिन कौन कृपानिधि भोरी, बाँह पकरि अपनैहै ॥ 
- verseNumber: "420."
  verseText: |
    भाग अभाग न जानत अपने ।
    तन मन अकुलत जब सुधि आवत, पातक पुंज घने ॥ 
    सहज कृपालु बान की आसा, धीरज होत मनै ।
    मेरी बिगरी जद्दपि बिगरत, तेरी बनाई बनै ॥ 
    यह वर देहु कृपालु किशोरी, मति रस-रीति सनै ।
    तुम बिन और न बान यह काकी, जो अवगुन न गनै ॥ 
    कोटिक दोष मेटि अपनावै, देखि अधीन जनै ।
    भोरी के हिय बसहु निरन्तर, जगत-नींद-सपने ॥ 
- verseNumber: "421."
  verseText: |
    श्री राधा इक आस हमारी ।
    सबल सबै बल के बल गाजत, अबलनि कौ बल तैं सुकुमारी ॥ 
    समरथ तैर चले भव सागर, पोचन कौ तोहि सोच सदारी ।
    पर के उड़ चले व्याध विलोकित, बेपर की तू राखिबे हारी ॥ 
    भाग्यवान निज भाग्य सराहत, भाग्य हीन कौं आस तिहारी ।
    पुण्य करत सो शुभ फल पावत, पतितन कौ तू पावन प्यारी ॥ 
    सब विधि सौ अबलम्ब न जाकै, तू नित ताहि निबाहन हारी ।
    भोरी भाग्य हीन अति खोटी, सबल स्वामिनी सिर पर प्यारी ॥ 
- verseNumber: "422."
  verseText: |
    जेहि विधि तोहि अति प्यारी लागौं ।
    तैसी मोहि कीजिये प्यारी, बार-बार यह मांगौं ॥ 
    और नहीं कछु काज काहु सौं, तुम ही सौं अनुरागौं ।
    भोरी तेरी रीझ लहन कौ, त्रिभुवन तृन सम त्यागौं ॥ 
- verseNumber: "423."
  verseText: |
    जेहि विधि तोहि अति लागौं प्यारी ।
    सो गुण तैसी रहन दीजिये, करुणा कोर निहारी ॥ 
    हौं तौ तेरे हाथ बिकानी, तू इक राखन हारी ।
    तेरी सहज रीझ नित चाहौं, और सौं काज कहारी ॥ 
    कोटि प्राण तेरे पग पर वारौं, छिन हू देखि छटारी ।
    भोरी दृग भरि दरसन दीजै, माँगौ गोद पसारी ॥ 
- verseNumber: "424."
  verseText: |
    कोटि-कोटि ब्रह्मांड न लैहौं ।
    बिन पद कञ्ज छटा दृग देखे, बार-बार पछितैहौं ॥ 
    धन ग्रह कुटुम्ब राज सुख सम्पति, कहा सँग लजैहौं ।
    योग सिद्धि नवनिधि जग गाई, सपनेहूँ चित्त न लैहौं ॥ 
    मुक्ति स्वर्ग ब्रह्मादिक पदवी, लै-लै कहौ कहा पैहौं ।
    चरण सरोज नैन बिनु देखे, नाहक जन्म गंवैहौं ॥ 
    यह तजि और कछू नहिं चाहौं, आरत टेरि सुनैहौं ।
    भोरी छिन इक भरि दृग देखे, प्राण निछावर दैहौं ॥ 
- verseNumber: "425."
  verseText: |
    सब विधि शरण गहि अब तोरी ।
    अब की टेरत द्वार रावरे, क्यों सहि जात किशोरी ।
    उठिहौ उमगि कभू करुणानिधि , देखि दीनता मोरी ।
    अबगुण कोटि समुझि नहिं रुकिहौ, उमड़त कृपा अथोरी ॥ 
    हौं जानत तोहि मेरी स्वामिनि, करुणा मृदुल हियौरी ।
    जो पै प्रीति हिये नहिं तोहू, आस न छाँड़त भोरी ॥ 
- verseNumber: "426."
  verseText: |
    हौं तौ और कछू नहिं चाहौं ।
    ऐसौ मन मेरौ करौ कृपानिधि, तेरे द्वार पै नित्य कराहौं ॥ 
    सम्पति सुख कछु और न चहिये, याही सुख निज भाग सराहौं ।
    भोरी सहज किशोरी राधे, कुगति-सुगति कछू सोचत नाहौं ॥ 
- verseNumber: "427."
  verseText: |
    काहू भाँति रीझिये प्यारी ।
    जो चाहौ सौ करहु कृपानिधि, हौं तौ शरण तिहारी ।
    जो दुख चाहौ सबहि सहावौ, हौं सहिहौं सुकुँवारी ॥ 
    नर्क-स्वर्ग गति-कुगति न सोचौ , तुम हिय बसौ सदारी ।
    कीर्ति हानि धन हानि कृपानिधि, प्राण हानि दुख भारी ॥ 
    सब ही देहु कृपाल किशोरी, जो रुचि होइ तुम्हारी ।
    कोटि प्राण तेरे पर वारौं, कबहूँ दिखाऊँ छटारी ॥ 
- verseNumber: "428."
  verseText: |
    निठुर कहौं न कठोर कहौं री, कोमल चित चितचोर कहौं री ।
    जो भटकावौ बन-बन व्याकुल, दीन्ही बंध सौं छोर कहौं री ॥ 
    जो दृग बाण करौ हिय घायल, लखी कृपा की कोर कहौं री ।
    जो सब सौं सम्बन्ध छुड़ावौ, गही बाँह बरजोर कहौं री ॥ 
    जो सब भाँति मिलाऔ धूरि में, करी भांवती मोर कहौं री ।
    दृग-जल-धार नहाइ उठौ जो, दीन्ही मोहि रँग बोर कहौं री ॥ 
    तलफत विरह-ताप तनु त्यागूँ, दीन्ही कीर्ति अथोर कहौं री ।
    भोरी टेर सुनौं न दयानिधि, तौ निज भाग की खोट कहौं री ॥ 
- verseNumber: "429."
  verseText: |
    या द्वारे सौं नातौ हमारौ ।
    खोटे पतित निबाहन कारन, प्रगट रावरौ द्वारौ ।
    कितहू ठौर न ठीक दयानिधि, इक अवलम्ब तिहारौ ॥ 
    साधन और कछू नहिं सूझत, दृग लागत अँधियारौ ।
    भोरी की अलबेली स्वामिनि, चरण शरण प्रतिपारौ ॥ 
- verseNumber: "430."
  verseText: |
    मैं हूँ कभू अभिमान करौंगी ।
    सिर पर सबल स्वामिनी राधा, तिहि बल भय बिसरौंगी ।
    तृन सम मुक्ति-स्वर्ग सुख गिनहौं, श्रुति साधन निदरौंगी ॥ 
    पातक पुंज अपार भूलि हौं, सुगति-कुगति न डरौंगी ।
    मत्त मुदित रस छकी खुमारी, राधा नाम ररौंगी ॥ 
    श्रीबन नवल निकुञ्ज-निकुंजनि, गरजि-गरजि बिचरौंगी ।
    भोरी हित स्वामिनि सौं मचलत, हठ करि द्वार अरौंगी ।
- verseNumber: "431."
  verseText: |
    गरजत मैं हूँ फिरौंगी प्यारी ।
    तुम्हरे बल न गिनौंगी काहू, फिरिहौं संक बिसारी ॥ 
    निगम नीति कुलकानि मेटि तजि, लोक लीक सौं न्यारी ।
    श्रीबन मत्त मुदित बिचरौंगी, प्रिया रूप मतवारी ॥ 
    सिर पर हँसत स्वामिनी राधा, समरथ राखन हारी ।
    भोरी पोच पतित अति पामर, तदपि हौंस हिय भारी ॥ 
- verseNumber: "432."
  verseText: |
    श्रीराधा-नाम

    अहो लड़ैती इतनी मोपै, कृपा करौ बलि जाऊँ ।
    जागत सोवत रटौं निरन्तर, राधा-राधा नाऊँ ॥ 
    हिय जिय रसना स्वास-स्वास प्रति रोम-रोम रट लाऊँ ।
    जौलौं नाम साँस तब ही लौं, एक मेक द्वै जाऊँ ॥ 
    नाम रूप मय, रूप नाम मय, विवि मय ह्वै दुलराऊं ।
    पियत छकी मतवारी प्यासी, प्यास पियत न अघाऊँ ॥ 
    जान परै नहिं साँझ सबेरौ, ऐसे जन्म गमाऊँ ।
    श्री हित बेगि ढ़रौ भोरी पै, हुलसि-हुलसि जस गाऊँ ॥ 
- verseNumber: "433."
  verseText: |    
    कुंडलियाँ 

    भाग अभाग लिख्यौ जु विधि, ताकौ मोहि न ख्याल ।
    अपने कर लिख लेत हौं, नाम तिहारौ भाल ॥ 
    नाम तिहारौ भाल, भाग निजु याकौ मानों ।
    याही की नित आस, आन सपने नहिं जानौं ॥ 
    विषयन सौं न बिराग चित, नहिं चरणन अनुराग ।
    तदपि भाल राधा प्रगट, हित भोरी कौ भाग ॥ 
- verseNumber: "434."
  verseText: |
    मेरौ जिय घबरात रहत नित, ऐसे तौ मन धीर न आवै ।
    नाम-स्वास दोऊ बिलग चलत हैं, इनकौ भेद न मोकौं भावै ॥ 
    स्वासहि नाम, नाम ही स्वासा , नाम-स्वास कौ भेद मिटावै ।
    रोम-रोम रग-रग जब बोलै, तब कछु स्वाद नाम कौ पावै ॥ 
    इन्द्रिय मन सब होइ नाम जब , सकल विषय फुरना जु नसावै ।
    बाहिर कछु न कछु तब भीतर, जिय और नाम एक ह्वै जावै ॥ 
    तब निज रूप नाम कौ प्रगटै, तन में श्रीबन सहज दिखावै ।
    ह्वै मृदु भूमि चरण तल चूमे, जमुना ह्वै जु ललित लहरावै ॥ 
    जल-थल विविध कुसुम ह्वै फूले, सीतल पवन सुरभि लै धावै ।
    अंबर ह्वै अंग अंगनि लिपटे, विविध अनिल हठि ताहि उड़ावै ॥ 
    प्रफुलित लता लपटि भई कुंजै, पुहुप सेज ह्वै तहँ जु सुहावै ।
    तापै हित उमगिली जोरी, तन मन उमगि-उमगि उमगावै ॥ 
    तन हित, मन हित , प्रान तहाँ हित, हित मे ह्वै हित रूप समावै ।
    हित कौ कोक कला सब हित की, हित पानिप , हित रँग चुचावै ॥ 
    हित अनखान भौंह कौ चढिवौ, हित मिठास मृदु मुसिकन भावै ।
    हित नीवी-बन्ध खोलत, हित भुज गौर-श्याम हित कलह मचावै ॥ 
    हित कौ खेत, जुरे भट हित के, हित कौ खेल अधिक अधिकावै ।
    हित उमगीली हित उमगीलौ, हित उमगै हित ही उमगावै ॥ 
    हित जु विवस, हित चेतत छिन-छिन , हित पानी हित प्यास कहावै ।
    बिच-बिच मृदु-मृदु बोलनि की, हित पसेब हित आनन छावै ॥ 
    हित पौंछे हित बिजन डुलावै, हित समीर ह्वै सुख जु बढ़ावै ।
    हित नख-छत ह्वै लसत कुचन पै, हित रद-छद अधरनि दरसावै ॥ 
    हित चुम्बन, हित ही परिरम्भन, भुजनि कसनि हित, हित लपटावै ।
    हित जु झरत कुसुमावलि टूटी, हित लट छुटी कपोलन दावै ॥ 
    हित कौ रूप उमंग कौ सागर, क्षुभित अनन्त लहर अकुलावै ।
    तामें बून्द मिली हित भोरी, सो कहि कौन भाँति ठहरावै ॥ 
- verseNumber: "435."
  verseText: |
    सोहनी महिमा

    ॥ दोहा ॥ 

    रे मन नवल निकुंज की, सुमिर सोहनी प्रात ।
    लपटी प्यारी चरण रज, लसत सहचरी हाथ ॥

    अहो सोहनी सोहनी, यह मति मौको देहु ।
    अति अधीनता दीनता, पद रज सों नित नेहु ॥

    तो समान कब सहचरी, मोहू कौ अपनाय ।
    नव निकुंज रति माधुरी, प्रात सुनावैं गाय ॥

    विरमि -विरमि हा सोहनी, देखि प्रिया पद अंक ।
    प्रियतम मन अटक्यो जहां,मेटत तिन्हैं निसंक ॥

    श्री प्यारी पद रैनुं में, उमगत लोटत लाल ।
    कोमल कर चुटकीनु लै, तिलक बनावत भाल ॥

    कण-कण में जा रेणु के, बसत लाल के प्रान ।
    हाय सोहनी ताहि यों , साधारण मत मान ॥

    अहो सोहनी सोहनी , यह न सोहनी रीति ।
    मो प्राणन की प्राण रज, ता संग करत अनीति ॥

    कण-कण पै वारौं यहाँ, कोटिन तन-मन-प्रान ।
    सो रज दूर न डार तू, नेकु निहारौ मान ॥

    अवसि झारि जो डारिबौ, यह रज प्राण अधार ।
    तौ मो तन-मन-प्राण में, हिय में, जिय में डार ॥

    कोटि विश्व ऐश्वर्य सुख, नहिं जु एक कण तूल ।
    सो रज तोकौं खेल है,मेरी जीवन मूल ॥

    हरि-हर विधि ललकत रहत, लहत नहीं कण एक ।
    ताहि झारि यौ फैंकिवौ, तुम्हें कौन यह टेक ॥

    इतने हू पर सोहनी, लागौ प्यारी मोहि ।
    अहो कौन यह मोहिनी, लेत जु प्राणन मोहि ॥

    मो प्राणन की प्राण रज, तासन करत अनीति ।
    तदपि सोहनी तोहि में, बाढ़त मेरी प्रीति ॥

    रसिक सहचरी करन कौ,पायौ तुमने प्यार ।
    तेहि मद माती चलत हौ, नीति अनीति बिसार ॥

    याही सौं प्यारी लगो, जदपि करत विपरीत ।
    छकन छकी रति केलि की, सुन सहचरी मुख गीत ॥

    अहो सोहनी मोहिनी , सर्वोपरि यह प्रीति ।
    यह रस मादक है जहां,तहां न नीति अनीति ॥

    यह रज, यह गति , यह रहनि, यह सुहाग यह भाग ।
    देहु सोहनी करि कृपा ,यह अपनौ अनुराग ॥

    तुम मेरे हाथन परौ, मो मन तुम तन माहिं ।
    एकमेक ह्वै सोहनी,चरण रेणु बिलसाहिं ॥

    मैं रज मिलि रज हौऊँगी, तुम जु बुहारी आय ।
    तुम मोहि ठेलत चलौगी,मैं तुम सों लपटाय ॥

    प्यारी प्रीतम चरण रज,दुर्लभ देहु मिलाय ।
    धन्य धन्य वे रसिक जन,मन तन कुञ्जन आय ॥

    अहो सोहनी मम हृदय,रहै तोहि लपटाय ।
    तुम्हें हाथ लै सोहनी,भवन बुहारत गाय ॥

    या तनहू में प्रीति सों,तुम ही कों दुलरात ।
    श्री बन वीथिनु रमत हैं,लिये सोहनी हाथ ॥

    तिन चरणन में सोहनी,देहु प्रीति अति मोहि ।
    हित भोरी यह आस धरि,दिन-दिन सुमिरों तोहि ॥ 
- verseNumber: "436."
  verseText: |
    हितोत्सव की बधाईयाँ 

    आवहु ललिता आजु बधाई जु गाईये,
    मेरे प्रान के प्रान लड़ैती लड़ाईयै ।
    लावहु साजि समाज सखी सब सोहनी,
    बलि-बलि प्रीतम लेहु मुरलिया मोहिनी ॥ 
    यह मो जीवन मूरि सखी हित-रूपिणी,
    सकल सार कौ सार अधार स्वरूपिणी ।
    यह मो अँखियन ज्योति हृदय सम्पुट मनी,
    सुख सम्पति सर्वस्व हमारे धन-धनी ॥ 
    यह ह्वै वंशी लेत अधर पिय स्वाद कौ,
    धुनि ह्वै मम श्रुति पैठि करत उन्माद कौं ।
    पोषत वृंदा रूप लता तरु-बेलि कौं,
    ह्वै हित सजनी हमें सिखावत केलि कौं ।
    कोटि प्राण यह एक अनेकन वपु धरै,
    परम प्रेम सौं तोषि-तोषि हियरा हरै ।
    याके गुण जु अपार , कोटिक मुख क्‍यों कहौं,
    मीन जलधि की थाह दीन कैसे लहौं ।
    याके बल हम जियें, जिवाबनहार ये,
    याही कौ सब खेल खिलावनहार ये ।
    याकी सकल विभूति अनूपम धाम ये,
    याकी सब रस-केलि परम विश्राम ये ।
    याके बल सब रास विलासन हम करैं,
    याकी भुज अवलंबि सुरत-सागर तरै ।
    यही डुबावै प्रेम, उछारै केलि में,
    आप एक रस रहै उभय रस झेल में ।
    यह जल हम हैं मीन सदा ज्याये जियें,
    यही प्यास यह नीर पिवावै ज्यों पियें ।
    याही कौ ब्रत एक हमारै जानिये,
    दोउन हिय की सार परम निधि मानिये ।
    हम याके आधीन सदा रुख लै रहैं,
    जाकौ यह दै देइ सु ताके ह्वै रहैं ।
    जहँ याकौ सम्बन्ध रंच हू देखिये,
    तहँ पहिले आधीन जुगल हम लेखिये ।
    याके तन-मन-प्राण, प्राण की प्राण हौं,
    यह मो तन-मन-प्राण सखी साँची कहौं ।
    मेरे हित अवतार अवनि इनने लियौ,
    मोसों लै निज-मन्त्र प्रकाशित जग कियौ ।
    धन्य-धन्य बलि जाऊँ द्योस यह चन्द कौ,
    उदय आज हरिवंश रसिक रस कन्द कौ ।
    धन्य-धन्य यह मास गही हित टेक ही,
    राधा माधव नाम युगल वपु एक ही ।
    बलि-बलि ग्रह-तिथि-पक्ष-ऋक्ष ओ पलघरी,
    मेरे मन की साध सबै पूरन करी ।
    छिन-छिन बाढ़ै उमंग हृदय नहिं माय री,
    रोम-रोम रस-सिन्धु अधिक अकुलाय री ।
    तुंग तुरंगन पर्यौ न चित ठहराय री,
    प्रेम-प्रवाह अथाह बह्यो सो जाइ री ।
    कहत-कहत तनु कम्प पुलक गद-गद भई,
    स्नेह-सलिल दृग दौरि सखी भुज भर लई ।
    काहे होत अधीर कहौ बलि हीय की,
    तुम जु प्रिया अवलम्ब हमारे जीय की ।
    बढतौ जान्यौ सोच भुजा ललिता गई,
    कहा अनमनी होत आजु, हँसि कै कही ।
    श्री हरिवंश सु जन्म द्योस उत्साह सौं,
    अपने हिय की बात कहौ जु उमाह सौं ।
    सत्य-सत्य सुन सखी बात तोसों कहौ,
    लेय जु याकी नाम ऋणि ताकी रहों ।
    याकी तन की वायु परसि जाकौ करे,
    बलि-बलि ताकी जाऊँ जु पद-रज सिर धरै ।
    जिनकौ यासौं हेत मोल मोहि तिन लई,
    जाकौं चाहैं दैंय जु तिन कर बिक गई ।
    ता मुख की बलि जाऊँ जु नाम सुनावहीं,
    सर्वस ता पर दैऊँ जु हित गुण गावही ।
    याके भजतन भजै , भजै पुनि ताहि जो,
    सर्वोपरि सब भाँति हमारै आहि सो ।
    ज्यों-ज्यों सरिता नीर जु नीचौ जावही,
    त्यों-त्यों गहरी होय पार को पावही ।
    तैसे यह हित-हेत सदा बढतौ रहै,
    बलि-बलि ताकी जाऊँ सरण हित की गहै ।
    हम दोऊ तन-मन-प्राण एक ही जानिये,
    दुहँन प्राण कौ प्राण व्याससुत मानिये ।
    छाँड़ि खेल कौ भाव प्रगट जब यों कही,
    तब प्रियतम हू उमगि साखि कीन्हीं सही ।
    हाँ ललिता यह सत्य-सत्य उर आनिये,
    हम तन मन हिय जीय यही निधि जानिये ।
    हम अधनी धन-धनी यही दातार हैं,
    अति उदार रिझवार खुले दरबार हैं ।
    जहाँ नाम हरिवंश प्रिया तहँ देखिये,
    प्यारी हू ते प्रथम मोहि तहँ लेखिये ।
    दै जु अचल विश्वास दृढ़ाऊं प्रीति मैं,
    अपने बल लै आऊँ खेंचि रस-रीति में ।
    भूलि स्वप्न हूं माहिं शरण हित की गहै,
    झूठी साँची होय सु दुर्लभ गति लहै ।
    सुनि फूली ललितादि बलैयां लेत है,
    चिरजीवौ हरिवंश असीसै देत है ।
    अटल होय तुव राज जगत सब उद्धरौ,
    भोरी हू से महा पतित पावन करौ ।
    जय-जय ध्वनि ह्वै रही, सकल लोकन छई,
    सुनि हित भोरी दौरि , शरण हित की लई ।
    प्यारी जु की प्रीति कही क्यों जावही,
    बून्द दिखाये सिन्धु न हियरे आवही ।
- verseNumber: "437."
  verseText: |
    अहो चलि देखौ री रसिकन नैन लाल रँगीलौ व्यास कौ ।
    अहो तन मन आनन्द दैन, लाल रंगिलौ व्यास कौ ॥ 
    सार रूप के रूप कौ, यह रस के रस कौ सार ।
    दम्पति हिय सुख-सार कोई यह अद्भुत प्रगट्यौ प्यार ॥  
    मो अँखियन की आँख यह, हिय के हिय कौ सार ।
    तन मन कोटिन प्राण बलि, जाकै दैऊँ नाम पै वार ॥  
    नेह सलिल दृग डहडहे , जाके बरसत प्यारी-पीय ।
    रोम-रोम अमृत झरैं, मेरी सहज जिबावै जीय ॥  
    गोरी की सब गौरता, अरु श्याम श्यामता सार ।
    दोउन हिये के हेत की, निधि प्रगटी मेरे लार ॥  
    प्यारी कौ जु सुहाग पिय, प्यारी पिय कौ भाग ।
    दुहँन भाग कौ भाग मेरे, जगमग सीस सुहाग ॥  
    छिनु-छिनु में रस सिंधु की, लहरिनु उमड़त रँग ।
    दम्पति जीय जीवाबनी, सुधासार सब अंग ॥  
    देखत ही देखत दृगन, लगत और ही और ।
    उलहत छवि सौं छवि नई, ललित मनोहर गौर ॥  
    कोटि विश्व की माधुरी, महा सार कौ सार ।
    सार-सार में नित नयौ, नैन न पावै पार ॥  
    देखत अन देखौ लगै, हेरत हियौ हिराय ।
    मधु मादक मूरति मधुर, झलकन मति बौराय ॥  
    मृदुता पग चूमत डरै, छवि दूरहि सौं बलि जाय ।
    सरस सुदीठ स्नेह की, परसत जीय डराय ॥  
    सुन्दरता सब विश्व की, करि कोटि गुनी अनुमान ।
    नहिं जोग निछावर रोम की, कहँ तुच्छ जु मेरे प्रान  ॥ 
    मो मन मोहै सीस सुठि, अरुण जरकसी पाग ।
    परयौ पेच में पेच मन, पिय प्यारी अनुराग ॥  
    कुंचित कोमल कुटिल लट, रुचिर मनोहर श्याम ।
    अलिकुल व्याकुल ह्वै चल्यौ, पद-पंकज तकि ठाम ॥  
    उन्नत भाल विशाल पर, सोहत तिलक ललाम ।
    ता मधि नाम जु राधिका, सेवत बैंदी श्याम ॥  
    ललित भौंह सोहै बनी, पत्रावली सुरंग ।
    मानहुँ काम कमान ढिंग, कुसुमन कौ जु निषंग ॥  
    अरुण श्याम सित चखन पै, पियौं जु पानी वार ।
    हित पिय-प्यारी सहज ही, मिले रहत अति प्यार ॥  
    जलधि सरस उमड़े रहैं, करुणा तुङ्ग तरङ्ग ।
    जलधर लौं बरसे सदा , गौर श्याम विवि रङ्ग ॥  
    इन नैनन सौं होय जब, जिन नैनन कौ मेलि ।
    तब सूझै वृंदा विपिन, कुञ्ज माधुरी केलि ॥ 
    एकमेक ह्वै कै रहौ, इन नैनन मो नैन ।
    श्री वृन्दावन हित माधुरी , अवलोकौं दिन रैन ॥ 
    विलग जो इनते ह्वै रहैं, ते अखियाँ जरि जाय ।
    वस्तु न देखैं आँधरी, नित भव-पीर पिरांय ॥  
    वारौं रुचिर कपोल पर, कोटि आरसी मंजु ।
    अति अद्भुत झलकत जहां, नील-पीत विवि कंजु ॥  
    अलक लड़े हित लाडिले, दुहूँ दिस लिये उछंग ।
    प्रिया दाहिनी, वाम पिय , छवि बरसत अंग अंग ॥  
    गौर-श्याम छबि सिंधु दुहूँ, अति अगाध लहराहिं ।
    प्रतिबिम्बित मिलि परस्पर, हित अंग-अंगनि मांहि ॥ 
    कैं राजैं हित गोद यह, कै हित हियरे माहिं ।
    हित दृग हित की दीठ बिनु, देखि सकै कोऊ नाहिं ॥  
    बेसर में मोती नचें, सो कैसे ठहराँय ।
    विवि विधु मुख छबि रँग-रँगे, ललकि-ललकि लुभियाँय ॥  
    अरुण अधर की ज्योति मिलि, उज्ज्वल हाँसि सुहात ।
    विवि मुख कमलन पै छई, रवि किरणें जनु प्रात ॥  
    चारु अंस ग्रीवा ललित, गौर श्याम तहाँ वाहि ।
    नील पीत कमलन मई, माला पहिरी आहि ॥  
    भुज विसाल जु मृणाल जुग, सोहत ललित ललाम ।
    जिन बिच फूले कमल द्वय, गौर श्याम अभिराम ॥  
    बलि-बलि हित के हृदय की, प्रेम पयोधि अपार ।
    भीतर बाहर लसत जहां, हित जोरी सुकुमार ॥  
    त्रिभुवन में उपमा जिती, लौटत उल्टे पाँय ।
    परम सूक्ष्म कटि-भाग लौं, कोऊ पहुँचत नाँय ॥ 
    पृथु नितंब रंभा जघन, पद-अंबुज गज चाल ।
    कोटि मदन मन मोहिनी, वैस किशोर रसाल ॥  
    प्यारी पिय अनुहार सब, रूप रङ्ग अँग अंग ।
    उमड़त रोमनि रोम में, पिय प्यारी कौ रङ्ग ॥  
    श्री हित-सिन्धु अथाह है, पिय प्यारी जु तरङ्ग ।
    रोमनि रोम झरे परै, उमंगि युगल इक़ सङ्ग ॥  
    अति जु सूक्ष्म रोमावली ,उपमा क्यों कहि जाय ।
    जनु निज हित की सूक्ष्मता, प्रगट विराजी आय ॥  
    नख-सिख लौं यह माधुरी, रमौ जु मो दृग माहिं ।
    या छबि सौं बिलगाइकै, मो दृग अनत न जाहिं ॥  
    इन नैनन नैना मिलौ, हिय में हिय रहौ भोइ ।
    भीतर बाहर एक रस, हित गौर-श्याम तहाँ दोइ ॥  
    तब लौं जीवन जिन गनौं, बीतत काल वृथाहिं ।
    हित चरणन की सरन में, जब लगि आवत नाहिं ॥  
    दृग सोहै देखौं सदा, लिये गोद दोऊ लाल ।
    कै हित दृग हित हृदय में, देखौं केलि रसाल ॥  
    जियौं तौ ऐसे ही जियौं, देखत निमिष विसारि ।
    मरौं तौ या छवि पै मरौं, प्राण निछावर वारि ॥ 
    बरस-गांठ रीझन यही, जाँचों गोद पसार ।
    भोरी हित बलि बकसियौ, हित रिझबार उदार ॥
- verseNumber: "438."
  verseText: |
    गजल बधाई

    अनूठा आज मंगल है चलौ मिलि व्यास घर आली ।
    कुँवरि कीरति ओ नन्‍दलाला, हुए हितरूप धरि आली ॥ 
    मिटी अब मैंड़ वेदौं की बही सब लोक की लज्जा ।
    चढ़ा है प्रेम का दरिया , उमड़ता जोर पर आली ॥ 
    अजब वह चाँद सा मुखड़ा, गजब मुसिकन जुन्हैया सी ।
    कि तन-मन होवै मतवाला, जु देखै भर नज़र आली ॥ 
    जुगल मन हित के साँचे में ढली कञ्चन सी यह मूरति ।
    कि हौं कन्दर्प न्यौछावर चरण-रज चूम कर आली ॥ 
    उमड़ता रोम-रोमों में अजब दरिया है लावन का ।
    बरसता प्रेम का झरना लगी करुणा की झर आली ॥ 
    हमें यह राधिकाबल्लभ सदा देने को आया है ।
    करम का, काल का, मेटा सभी माया का डर आली ॥ 
    जु रोमनि रोम हौं अखियाँ जु देखै एक टक कोई ।
    न हो इक रोम, छबि पूरी हज़ारों कल्प भर आली ॥ 
    अभी कुछ और फिर कुछ और , फिर कुछ और छिन-छिन में ।
    जभी देखौ नई मूरत, नया लाबन का भर आली ॥ 
    ये धनि-धनि मास माधव की उजारी धन्य ग्यारस है ।
    ये धनि-धनि जन्म का उत्सव, सभी रसिकौं के घर आली ॥ 
    पड़ी द्वारे पै हित भोरी नज़र भर देख लो मुझको ।
    यही दो रीझि, तन-मन-प्राण वारु पाँव पर आली ॥ 
    हुआ है जग में उजियाला, हुआ रसिको का भूपाला ।
    यही वृषभान की बाला, यही है नन्‍द का लाला ॥ 
    यही मोहन की वंशी है, यही राधा प्रसंसी है ।
    यही रस-सर की हंसी है, यही दम्पति की उरमाला ॥ 
    यही नव कुञ्ज की केली, यही अनुराग की बेली ।
    यही राधा की निज चेरी, यही मोहन की प्रतिपाला ॥ 
    रसिक रस प्राण भी ये ही,मनावैं मान भी ये ही ।
    करै हित दान भी ये ही, सदा निज दीन जन पाला ॥ 
    खिलारी खेल मतवारे, खिलौना खेल के प्यारे ।
    यही है खेल श्री बन का, खिलाने खेलने वाला ॥ 
    यही हित प्यास का सागर, यही हित प्रेम का पानी ।
    यही हित प्रेम का दाता, यही हित प्रेम मतवाला ॥ 
    रसिक घर-घर बधाई है, भली तिथि आज आई है ।
    छटा हित प्रेम की छाई, कि कलि-कल्मष को धो डाला ॥ 
    रसिक जन भाग जागा है, जुगल अनुराग पागा है ।
    ये मांगे रीझि हित भोरी, कि मेटौ मोह-जंजाला ॥ 

- verseNumber: "439."
  verseText: |
    सुन्दर अनूप छबि है श्री व्यास जू कौ लाला ।
    नख चन्द्र जिसकी चाँदनी , त्रिभुवन हुआ उजाला ॥ 
    नव कुञ्ज नित बिहारी दोनों का हित अपारा ।
    उमड़ा प्रवाह आली सम्भला नहीं सम्भारा ॥ 
    दोनों के हिय में भरि कैं सखियों को रँग में बोरा ।
    समाया न कुञ्ज बन में वह भूमि पर हिलोरा ॥ 
    अवनी का भाग जागा, घर-घर बजी बधाई ।
    सो वर्षगांठ आली हित जू की आज आई ॥ 
    हित से बरसि बहा फिर, होकर के हित की वाणी ।
    चौरासी अरु सुधानिधि , फुटकर सुनौं प्रमानी ॥ 
    मही बोरता चला जो रस की हिलोरें खाता ।
    रसिकों को दे रसिकता , साधन का गुण डुबाता ॥ 
    ह्वै नाद -बिंदु धारा द्वै रूप में बहा है ।
    हित सो प्रभाव अब भी जग में छा रहा है ॥ 
    है आज ही का वो दिन रस रीति जग में आई ।
    अद्भुत सु आज मंगल , तिहुँ लोक धूम छाई ॥ 
    रसिकों की शुभ सभा है, आनँद उमंग फूली ।
    हित माधुरी की मूरति हित के स्नेह झूली ॥ 
    हित भोरी यों असीसें रस रीति यह अचल हो ।
    जग तारने को हित के, दोनों ही कुल अटल हौं ॥ 
- verseNumber: "440."
  verseText: |
    होली

    हिलमिल एकहि भाय, रसिक रस होरी खेंलें ।
    दोऊ रँग दोऊ पिचकारी, दोऊ मेलत धाय ।
    दोऊ बरसे दोऊ भीजैं, दोऊ तन पुलक चुँचाय ॥ 
    दोऊ मादक दोऊ घूम, पी-पी मन न अघाय ।
    दोऊ रीझि-रीझि हित भोरी, दोउन पै वलि जाय ॥ 

- verseNumber: "441."
  verseText: |
    धमार

    मम दृग बरसत रँग, उमगि । दोऊ होरी खेलैं ।
    गौर श्याम मिलि अँग, उमगि । हित फागुन खेलैं ॥ 
    सागर रस लहराय , उमगि । पलकनि में न समाय उमगि ॥
    श्री हित सेज सुदेस, उमगि । भरे प्रेम आवेश , उमगि ॥
    बरसत लोचन कोर, उमगि । दोऊ में दोऊ सराबोर , उमगि ॥
    भरन भुजन अति गाढ़, उमगि । छिन-छिन रस की बाढ़, उमगि ॥
    पानिप पानी रँग, उमगि । पिचकारी अँग-अँग , उमगि ॥
    कुच कुम-कुम की मार, उमगि । मची मदन रन रारि, उमगि ॥
    नहिं तन बसन संभार, उमगि । विलुलित छूटे बार, उमगि ॥
    मत्त रसासव स्वाद, उमगि । चढ्यो प्रेम उन्‍माद, उमगि ॥
    नहिं तहँ श्याम न गौर, उमगि । छिन-छिन औरहि और, उमगि ॥
    छिनहि एक छिन दोय, उमगि । हित निधि मथत विलोय, उमगि ॥
    हित सागर मित नाय ,उमगि । महा मत्स्य न समांय , उमगि ॥
    उरझि-उरझि उरझात, उमगि । अदल बदल है जाय , उमगि ॥
    अंगनि-अंग सिंगार, उमगि । अंगनि-अंग आहार, उमगि ॥
    झलकनि हित की बूंद , उमगि । पुलकि पलक दृग मूँदि, उमगि ॥
    उर सौं उर मिलि पेलि, उमगि । रस की ठेलम ठेल, उमगि ॥
    अधर-अधर मिलि जोत,उमगि । दामिनी दसन उदोति , उमगि ॥
    मोती मूँगन सँग,उमगि । विलसत अपने रँग, उमगि ॥
    उरज कमल पर आय, उमगि । रहे कमल पर छाय, उमगि ॥
    दोऊ दिसि कमलनि माहि, उमगि । नख ससि दीसत नाहिं,उमगि ॥
    अँग-अँग अद्भुत जोति , उमगि । मिलि मिलि करत उदोत उमगि ॥ 
    ज्योति-ज्योति सौं मेल उमगि । ज्योति-ज्योति सौं खेल , उमगि ॥
    रस में रस की  रेल, उमगि । रस की रस सौं झेल, उमगि ॥
    झूलत सुरत हिंडोर, उमगि । मचकत जोवन जोर, उमगि ॥
    झोटा तरल झकोर, उमगि । बढ़त उरप दुहूँ ओर, उमगि ॥
    विरम-विरम मुख बात, उमगि । पुलकि-पुलकि लपटाय, उमगि ॥
    जल में जल एकमेक, उमगि । को करि सकै विवेक, उमगि ॥
    श्यामल गौर तरँग , उमगि । प्रेम जलधि एक रँग, उमगि ॥
    घुमड़ि-घुमड़ि इक भाइ, उमगि । स्वेद फेन झलकाय, उमगि ॥
    नीलम कनक खचाई, उमगि । जनु मोती दिये छाय, उमगि ॥
    तन मन प्राननि प्रान , उमगि । डूबि-डूबि उछरान, उमगि ॥
    एक होय अकुलायेँ, उमगि । विलग होय पछितायेँ , उमगि ॥
    मिले रहैं दिन रात, उमगि । मिलिवै को अकुलात, उमगि ॥
    मिले मिलन ललकाहिं, उमगि । मनहूँ मिले ही नाहिं, उमगि ॥
    बीते कल्प अपार, उमगि । इक रस करत बिहार, उमगि ॥
    भई न तौहू चिन्हार , उमगि । अद्भुत मूरति प्यार, उमगि ॥
    नित नव दुलहिनि बाल, उमगि । नित नव दूलह लाल, उमगि ॥
    नित नव सँग कराय, उमगि । अंगनि-अंग मिलाय, उमगि ॥
    लाड़त हित लै हीय, उमगि । तदपि चैन नहिं जीय, उमगि ॥
    पानी प्यासौं होय उमगि । सो कहँ पीवै तोय उमगि ॥
    प्यास ललकि जल होय, उमगि । पियत प्यास ही सोय, उमगि ॥
    दोऊ सागर रँग, उमगि । नहिं जल तहँ न तरँग, उमगि ॥
    उमड़नि-घुमड़नि क्षोभ, उमगि । दोऊ लोभ ही लोभ , उमगि ॥
    सो इक घुमड़ उमंग, उमगि । गौरश्याम विवि रंग, उमगि ॥
    प्यारी प्रियतम रूप, उमगि । प्यारौ प्रिया स्वरूप, उमगि ॥
    प्यारी पीय न कोय, उमगि । हित विलसत वपु दोय, उमगि ॥
    तामें सहज मिलाप, उमगि । सहज विरह की ताप, उमगि ॥
    पान छकन रस स्वाद, उमगि । चाह ताप उन्माद, उमगि ॥
    काल क्रिया क्रम नाँय उमगि । कहत कहाँ नहिं जाय, उमगि ॥
    सकल अँग भये नैंन , उमगि । देखत पलक परै न, उमगि ॥
    गये कलप यों बीत, उमगि । नहिं दरसन परतीति, उमगि ॥
    ललकि-ललकि अकुलाय, उमगि । मनहूँ मिले ही नाय, उमगि ॥
    अँग-अँग की यह रीति, उमगि । विरह मिलन परतीति उमगि ॥
    प्यासे पियें न अघाहिं , उमगि । प्यासे रहत सदाहिं, उमगि ॥
    पियत प्यास कौ प्यास, उमगि । कहा तृप्ति की आस, उमगि ॥
    हित मादक उन्माद, उमगि । अति अद्भुत रस स्वाद , उमगि ॥
    अति तीखौ अति मिष्ट, उमगि । अति पैनौं अति इष्ट, उमगि ॥
    किरचि-किरचि करि हीय , उमगि ।अतिहिं जुड़ावत जीय, उमगि ॥
    बढ़त फूल में फूल, उमगि । तन-मन की तहँ भूल, उमगि ॥
    भूल फूल कौ खेल, उमगि । फूलि-फूलि रस झेल, उमगि ॥
    यह हित अँखियन खेल, उमगि । नहीं काम-रस केलि, उमगि ॥
    नहीं वर वधु न कोय, उमगि । हित दृग तारे दोय, उमगि ॥
    हित दृग सागर रंग, उमगि । उमड़त तुंग तरंग, उमगि ॥
    हित के हिय कौ प्यार, उमगि । हित कौ लाड़ अपार, उमगि ॥
    हित ललकन हित प्यास, उमगि । हित कौ सुरत विलास, उमगि ॥
    हित सिज्या हित धाम, उमगि । हित के आठों याम, उमगि ॥
    हित आत्मा हित प्राण, उमगि । हित बिनु तहँ नहिं आन , उमगि ॥
    हित कौ हित आवेश, उमगि । नहीं प्राकृत कौ लेश, उमगि ॥
    श्रीहित कृपा जु होय यह, उमगि ।यह रस समझै सोय, उमगि ॥
    हित ही हित के दृग होय , उमगि ।और न परसे कोय, उमगि ॥
    विधि हरि-हर ललचाहिं, उमगि । तिन उर आवत नाहिं, उमगि ॥
    निगम अगोचर रीति, उमगि । सर्वोपरि हित प्रीति, उमगि ॥
    सो हित भोरी गाइ, उमगि । कृपा कोर बलि जाइ, उमगि ॥
- verseNumber: "442."
  verseText: |
    स्फुट-पद

    श्री वृन्दावन तोहि करूँ परनाम ।
    रँग भरी केलि करत जहाँ नित-नित, रँग भरे श्यामा-श्याम ।
    रँग भरौ यमुना तीर सुहायौ, रँरंग भरे राजत धाम ॥ 
    रँग भरे कुञ्ज लता तरु पल्‍लव, शोभा अति अभिराम ।
    रँग भरे खग रँग भरे द्रुमन पै, टेरत राधा नाम ॥ 
    रँग भरी ललित रागनी गावत, रँग भरी सहचरी वाम ।
    भोरी हृदय रँग में बोरौ, देहु प्रीति निष्काम ॥ 
- verseNumber: "443."
  verseText: |
    ॥ दोहा ॥ 

    मृदुल मूर्ति सुकुमार अति, दीठ छुअत कुम्हलाय ।
    देखै बिना न जी सकौं, देखत जीय डराय ॥
    सुख आपनी चाहै नहीं, यही प्रीति की रीति ।
    पै बिच लोचन लालची, बरबस करत अनीति ॥
    बीतत जो मो जीय पै, सुनि दुख पैहौ हाय ।
    कह न सकौं ना सह सकौं, चुप हू रहौ न जाय ॥
    श्री यमुना के नीर लौं, दिन-दिन आपहि आप ।
    थिर न रहौं व्याकुल बहौं, सूखत हौं चुपचाप ॥
    अंगन अंग मिलाइ कैं, इकठाँ बैठिय जोय ।
    पै हिय सौं हिय बिनु मिले, शत योजन बिच होय ॥
    ना काहू सों बोलिबो, ना कोई व्यवहार ।
    अपनी कुँवरि कृपालु कौं, जियत निहार-निहार ॥ 

- verseNumber: "444."
  verseText: |
    राजी रहौ हँसौ ही मुख छवि नहिं तुमसौं कछु चहिये ।
    जी देकर जी के सुख दुख की चरचा किस मुख कहिये ।
    हिय कौ दरद छिपाये हिय में मुख मूँदे सब सहिये ॥ 
    जहँ कोऊ देखे सुनै न जानें तहँ कहूँ बैठि करहिये ।
    हित भोरी मुख कमल माधुरी, सदा सराहत रहिये ॥ 
- verseNumber: "445."
  verseText: |
    ह्वै है कब चैन, जब देखौं भरि नैन ।
    जब राखौं भरि नैन, कैंधौं नैन करि राखौंरी ॥ 
    ह्वै हैं दोऊ नैन, तब पै हौं क्यों चैन ।
    तब देखे बिनु नैन, तृषित व्याकुल अभिलाखौंरी ॥ 
    जब ही बिलगाऊँ, तब मिलिबे अकुलाऊँ ।
    जब रस ही ह्वै जाऊँ कहा स्वाद जाहि चाखौंरी ॥ 
    मिलेहु मिलत न पलहू बिलगात नहीं ।
    बलि भोरी हित रूप, जापैं बारि प्राण नाखौंरी ॥ 
- verseNumber: "446."
  verseText: |
    कबहूँ-कबहूँ मन में यों आवै क्यों अभिमान न करिये ।
    अपने प्रभु की ओर देखि टुक त्रिभुवन क्यों न निदरिये ॥ 
    नहिं गुण नहिं बल भागन वैभव सान संक उर धरिये ।
    आप समान आन नहिं देखौं फूली गरब जु मरिये ॥ 
    गुण मेरी हरिवंश लाडिलौ जाकी ज्योतिन बरिये ।
    बलि मेरो हरिवंश लाडिलौ गरजत काहु न डरिये ॥ 
    जगमगात हरिवंश भाग मम सकल सोच परिहरिये ।
    वैभव अति अपार हित दम्पति विलसि विलसि मुद भरिये ॥ 
    फिर आवत हिय यों नहिं बकिये निपट गरीबी ढरिये ।
    हित भोरी हित बपु जु दीनता सपनेहु सो न बिसारिये ॥ 
- verseNumber: "447."
  verseText: |
    कौन प्यास तृप्ति रूप, कौन तृप्ति प्यास मई ।
    प्रेम कौ अनूठो खेल कैसे हिये लाइये ॥ 
    कौन विरह मिलन रूप, विरह रूप मिलन कौन ।
    विरह मिलन एक जहां कौन स्वाद पाइये ॥ 
    कौन प्रिया पीय रूप, प्रिया रूप पीय कहाँ ।
    प्रिया-पीय एकमेक कैसे कै मिलाइये ॥ 
    जुगल हीय कुञ्ज जहाँ जुगल केलि होत तहाँ ।
    जुगल हृदय वृत्ति होय कैसे के लड़ाईये ॥ 
    मनहूँन आवै जौन बुद्धि हू न पहुंचे जहाँ ।
    अद्भुत हित रूप हहा भोरी कैसे पाईये ॥ 
- verseNumber: "448."
  verseText: |
    कौन रूप कौन रंग कौन शोभा अङ्ग-अङ्ग 
    माधुरी अपार ताहि रंचकौऊ जानैंना ।
    लाड़िली कौ रूप लाल प्यारो नित्य देखै ताहि,
    बीते किते कल्प तउ देख्यौ नेकु मानैना ॥ 
    लाड़िले कौ रूप त्योंही लाड़िली न पावै थाह,
    कुञ्ज की निकाई भूले दोऊ कोऊ छानैना ॥ 
    हित कौ स्वरूप जहाँ देखिये न पार कहूँ,
    देखे भरि नैन सोतौ काहू कौ पिछानैना ।
    भोरी बलिहार मोपै कीजिये कृपा की कोर,
    यही सोच नैन यहाँ आजु लौं हिरानेना ॥ 
- verseNumber: "449."
  verseText: |
    प्यारी हौं तेरी भौहैं देखि डरात ।
    सहज सुभाव सामुहे देखत, बिनु कारण सतरात ।
    कुटिल कटाच्छ बाण तीच्छन जुत, ज्यों कमान झुकि जात ॥ 
    मेरे हिय के सन्‍मुख हा-हा , विकट तकत हैं घात ।
    मन मेरौ भय बिकल पखेरू , देखि निपट घबरात ॥ 
    उड़न चहत उड़ जाय न डर सौं, चैन नहीं दिन रात ।
    तबहीं तौ कछु धीरज आवै, जब तैं मृदु मुसिकात ॥ 
    यह रस सुधा पान कौं ललकत, मेरी मन अकुलात ।
    हा हरिवंश कृपा कब करिहौ, हित भोरी बलि जात ॥ 
- verseNumber: "450."
  verseText: |
    छूटी लट अब तैं न सम्हार ।
    जैहै उरझि अरी दृग तेरे अद्भुत रूप निहार ॥ 
    इनके फंद पर्यौ कईं निकसै श्याम सरीखे बार ।
    तासों विनय मान लै मेरी तोपें पियों जल वार ॥ 
    तैं अति भोरी लाड़ लड़ैती यातै अति रिझवार ।
    हौं अति सुभग बनाऊँ इनकौ रचि-रचि गूंथि सम्भार ॥ 
    कब यह भाँति कहौ कछु बातें नव-नव युक्ति बिचार ।
    हँसि-हँसि सेवा देहु किशोरी नव निकुञ्ज सरकार ॥ 
    तन-मन अति अकुलात लाड़िली हौंसन मरत गंवार ।
    भोरी हित अब आस रावरी ठाड़ी गोद पसार ॥ 
- verseNumber: "451."
  verseText: |
    रैन अँधेरी श्याम घन ढूँढ़त श्यामा श्याम ।
    कौन भाग भटकत फिरौं श्री वृन्दावन धाम | ।
    श्री वृन्दावन धाम चुबत दृग अँसुवन धारा ।
    खगमृग पुलकित वृक्ष उमगि जब करहूँ पुकारा ॥ 
    खगमृग पुलकित वृक्ष उमगि ढिंग लैहौँ टेरी ।
    भोरी हित केहि भाग सघन बन रैन अंधेरी ॥ 
- verseNumber: "452."
  verseText: |
    रैन अँधेरी मेह झर पवन चलत झकझोर ।
    नौका टूटी राखियौ हित हरिवंश किशोर ॥ 
    हित हरिवंश किशोर बोझ पापन कौ भारी ।
    भवनिधि ओर न छोर परी अब तौ मँझधारी ॥  
    भवनिधि ओर न छोर शरण करुणानिधि तेरी ।
    भोरी हित तट दूर मेह अरु रैन अँधेरी ॥ 
- verseNumber: "453."
  verseText: |
    सब कोऊ हँसत हमें हित प्यारे ।
    तुम किन हसौं छिनक ह्वै सन्मुख रसिक सभा रखवारे ॥ 
    इन्द्रिय हँसत हँसत पुनि देही विषय देत दुख भारे ।
    मन खल हँसत हँसावत चहुँदिशि दया न नैक विचारे ॥ 
    मीच हँसत लखि विषय भुलानौ जम हँसि बाँह पसारे ।
    सब जन हँसत निलजता देखत कुल की मैंड़ विसारे ॥ 
    तियगन हँसत चलावत भौंहन भरि अभिमान निहारे ।
    जनु यह कहत जगत हम जीतौ यह खेल कौन उवारे ॥ 
    त्रिभुवन विजयी सुभट कुसुम सर हँसत चाँप टँकारे ।
    हारेहू पग परत न मानत तकि-तकि बानन मारे ॥ 
    डूबत भव जग जुरौ तमाशौ सब कोऊ हँसि किलकारे ।
    तरसत तऊ तुमहिं देखन कौं हँसि बरसात सुधारे ॥ 
    सब जग हँसत देखि हिय फाटौ प्रफुलित हँसत तुम्हारे ।
    सो मृदु हास स्वप्नेहु दुर्लभ ऐसे भाग्य हमारे ॥ 
    ऐहो परम कृपाल लाडिले पोच निबाहन हारे ।
    भोरी हित क्यों न अब उमगत व्यास भवन उजियारे ।
- verseNumber: "454."
  verseText: |
    जब जब ऐसी बात सुनत हौं तब तब हियरा अधिक डरावै ।
    कनक कामिनी में मन जौलौं तौलौं श्याम न हिये में आवै ॥  
    मैं मन बैठि बहुत सोचत हौं कनक कामिनी कौन छुड़ावै ॥ 
    जो यह बात बने न तुम सौं तौ हम पै कैसे बनि आवै ।
    कनक कामिनी ग्राह ग्रसित ग़ज़ माया सर बूड़त घबरावै ॥ 
    निज उद्यम जो छूटि सकै तौ शरण-शरण क्‍यों टेर बुलावै ।
    निबल मन्दमति पामर पापी अति भयभीत जु टेरि लगावै ॥ 
    कनक कामिनी जीति कौन विधि कहौं नाथ सो तुमहिं रिझावै ।
    डूबत मध्य भौर सौं कैसे सिन्धु पैर तुम ढिंग तट धावै ॥ 
    जदपि दवार चहूँ दिशि व्यापी बिनु पर पँछी क्यों जु उड़ावै ।
    तुम राखौ तौ मारि सके को तुम त्यागौ तौ कौन जिबावै ॥ 
    तुम सिरमौर सबल सर्वोपरि तुमसौं बड़ौ न कोऊ दिखावै ।
    तुम आवौ हिय कौ बलि रोकै तुम पकरौ भुज को छुटकावै ॥ 
    कनक कामिनी कहा बिगारै जो कृपाल जनकों अपनावै ।
    माया कौन अभाग कहाँ कौ कौन नियति को कर्म कहावै ॥ 
    तनक कृपा कोरनि अवलोकनि छिन में कोटि विश्व तरिजावै ।
    तुम जु रुकौ डरपौ सकुचावौ तौ अब कौन जु पार लगावै ।
    तुम समर्थ हरिवंश शीश पै हित भोरी सब भय बिसरावै ।
    परी रहत द्वारे धरि आसा डरत न कौउ कितौ डरपावै ॥ 
- verseNumber: "455."
  verseText: |
    श्रीहित दम्पति रँग रँगीले रसिकनि की बलिहारी हौं ।
    श्रीहित चरण उपासक जन के चरण कमल पर वारी हौं ॥  
    हित हरिवंश नाम जे सिमरत तिन दासन की दासी हौं ।
    हित भोरी हित बिंदु नाद कुल कृपा कोर की प्यासी हौं ॥  
- verseNumber: "456."
  verseText: |
    जे हित गिरा माधुरी छाके प्रेम सुधा मतवारे हैं ।
    जे हित कृपा कोर पै बारे तन मन जीवन हारे हैं ।
    जे हित धर्म सुनावत समुझत उपदेशत ब्रत धारे हैं ।
    भोरी हित बलिहारी उनकी जे हित के हितवारे हैं ॥ 
- verseNumber: "457."
  verseText: |
    एक बार छवि देखी तिनकों त्रिभुवन तृन सा लागै है ।
    इस दर का जु भिखारी उससे सब जग भिक्षा मांगे है ।
    जो ह्याँ का फिर सो न अनत का दम्पति पानिप पागै है ।
    हित भोरी मतवारा बेसुध सोता सा जग जागै है ॥ 
- verseNumber: "458."
  verseText: |
    श्रीहत नाम बिचारा जबही हियरे हुआ उजाला है ।
    अब किसके मुंह मांगे याचक हुआ प्रेम मतवाला है ॥ 
    आँखों झरैं लरी मुतियों की तन पर पुलकि निराला है ।
    भोरी हित लखि तन-मन भूला पिया जु पानिप प्याला है ॥ 
- verseNumber: "459."
  verseText: |
    अब तौ क्या इस छवि पर बारौं यही सोच उर आवै है ।
    पल-पल रोम-रोम पर तन मन कोटिनु तुच्छ दिखावै है ॥ 
    कोटि विश्व इक रोम निछावर तउ संतोष न आवै है ।
    करना दूर, बनै न मनोरथ भोरी मन पछतावै है ॥ 
- verseNumber: "460."
  verseText: |
    कृपा की कोर टुक हेरौं बधाई जन्म की प्यारे ।
    न अब जाचक से मुँह फेरौ बधाई जन्म की प्यारे ॥ 
    न माँगू राजपदवी को न चाहूँ स्वर्ग मुक्ति को ।
    न जांचू द्रव्य बहुतेरी बधाई जन्म की प्यारे ॥ 
    जरा दृग सामने आना जरा आंखों में मुसिकाना ।
    जरा हँसि अपना कहि टेरौ बधाई जन्म की प्यारे ॥ 
    ये कहदो अब कि तुम मेरे ये कहदो हँस कि हम तेरे ।
    अभय कर शीष पर फेरौ बधाई जन्म की प्यारे ॥ 
    सदा का अब यह नाता है यही भोरी को भाता है ।
    न आवै इसमें झकझेरौ बधाई जन्म की प्यारे ॥ 
- verseNumber: "461."
  verseText: |
    कृपा की कोर हित करना बधाई जन्म की तेरे ।
    मुझे है द्वार पर अरना बधाई जन्म की तेरे ॥ 
    निछावर प्राण धन वारूँ पलक छवि देख जो पाऊँ ।
    बकस दे देखते मरना बधाई जन्म की तेरे ॥ 
    उमगती आँखें की कोरे हिलोरें प्रेम की लेकर ।
    बरसते रोम छवि झरना बधाई जन्म की तेरे ॥ 
    ललित ओठों की लाली पर निराली दांत की चमकन ।
    जरा मुस्काके मन हरना बधाई जन्म की तेरे ॥ 
    पड़ी हूँ खाक सी होकर तेरे कूचे में आशा से ।
    कभी आँखों में पग धरना बधाई जन्म की तेरे ॥ 
    सुधा पानिप पिया देना मृतक देही जिया लेना ।
    कहूँ क्या रीझ भुज भरना बधाई जन्म की तेरे ॥ 
    न इस लायक हूँ हा प्यारे कि चरणों से लगा लो प्यारे ।
    ढरन अपनी मगर ढुरना बधाई जन्म की तेरे ॥ 
    बना लेना जु बन पाऊँ न बन पाऊँ निभा लेना ।
    मगर निज प्रण से मत टरना बधाई जन्म की तेरे ॥ 
    मिटादो जग का सुख सपना फिराओ मस्त कर अपना ।
    उमग दो नाम का रटना बधाई जन्म की तेरे ॥ 
    न मेरे पार पापों का न नर्कों तक मे गुंजाइश ।
    तेरे द्वारे दिया धरना बधाई जन्म की तेरे ॥ 
    न जानौं भाग गति मुक्ति बना कुछ भी न बनता है ।
    न समझूँ डूबना तरना बधाई जन्म की तेरे ॥ 
    तेरे द्वारे की दासी हूँ तेरे पानिप की प्यासी हूँ ।
    पिला छवि चाहे जो करना बधाई जन्म की तेरे ॥ 
    तुही बल है मेरा कहाता दीन क्यों वानी ।
    बहुत सुन ली उमंग परना बधाई जन्म की तेरे ॥ 
    बरस की गांठ है तेरी पसारे गोद हूँ कह दे ।
    कि हित भोरी न अब डरना बधाई जन्म की तेरे ॥ 

    जै जै श्रीहित प्रेम की पीर की जै जै श्रीहित हरिवंश
