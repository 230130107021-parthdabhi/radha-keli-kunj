- verseNumber: 1
  verseText: |
    राग विभास
    ज़्यौंही ज़्यौंही तुम राखत हौ त्यौंही त्यौंही रहियत है हो हरि।
    और तो अचरचे पाँइ धरौं सो तौ कहौं कौन के पैंड़ भरि ।। 
    जद्यपि कियौ चाहौं अपनौ मन भायौ 
    सो तौ कैसे करि सकौं जो तुम राखो पकरि।
    कहिं श्रीहरिदास पिंजरा के जनावर लौं 
    तरफराइ रह्यौ उड़िवे कौं कितौक करि ।। 
- verseNumber: 2
  verseText: |
    राग विभास
    काहू कौ बस नाहिं तुम्हारी कृपा तें सब होइ बिहारी बिहारनि।
    और मिथ्या प्रपंच काहे कौं भाखिये सो तौ है हारनि ॥
    जाहि तुमसौं हित तासौं तुम हित करौ सब सुख कारनि।
    श्रीहरिदास के स्वामी स्यामा कुंजबिहारी प्राननि के आधारनि॥
- verseNumber: 3
  verseText: |
    राग विभास
    कबहुँ  कबहुँ मन इत उत जात यातेंब कौन अधिक सुख।
    बहुत भाँतिन घत आनि राख्यौ, नाहिं तौ पावतौ दुख ॥ .
    कोटि काम लावन्य बिहारी ताके, मुँहाचुही सब सुख लियें रहत रुख।
    श्रीहरिदास के स्वामी स्यामा कुंजबिहारी कौं,
    दिन देखत रहौं विचित्र मुख ।।
- verseNumber: 4
  verseText: |
    राग विभास
    हरि भजि हरि भजि, छाँड़ि न मान नर तन कौं  ।
    मति वंछै मति वंछै रे, तिल तिल धन कौं  ॥
    अनमाँग्यौ आगें आवैगौ, ज्यौं पल लागै पल कौं ।
    कहिं श्रीहरिदास मीच ज्यौं आवै, त्यौं धन है आपन कौं ।। 
- verseNumber: 5
  verseText: |
    राग बिलावल
    ए हरि मोसौ न बिगारनि कौं तोसौं न
    सँवारनि कौं, मोहिं तोहिं परी होड़।
    कौंन धौं जीतै कौन धौं हारै, पर बदी न छोड़ ॥
    तुम्हारी माया बाजी पसारी विचित्र
    मोहे सुर मुनि का के भूले कोड़ ।
    कहिं श्रीहरिदास हम जीते हारे तुम, तऊ न तोड़ ॥ 
- verseNumber: 6
  verseText: |
    राग आसावरी
    बंदे अखतियार भला चित न डुलाव ।  
    आव समाधि भीतर, न होहु अगला ॥
    न फिर दर-दर, पिदर-दर, न होहु अँधला।
    कहिं श्रीहरिदास करता किया सो हुआ, सुमेरु अचल चला ॥
- verseNumber: 7
  verseText: |
    राग आसावरी
    हित तौ कीजै कमलनैन सौं, जा हित कै आगें
    और हित लागै सब फीकौ।
    कै हित कीजै साधु संगति सौं, ज्यौं कलमष जाइ सब जी कौ ॥
    हरि कौ हित ऐसौ, जैसौ रंग मजीठ,
    ' संसार हित रंग कसूँभ दिन दुती कौ ।
    कहिं श्रीहरिदास हित कीजै बिहारीजू सौं,
    ओर निबाहू जानि जी कौ ॥ 
- verseNumber: 8
  verseText: |
    राग आसावरी
    तिनुका ज्यौं बयार के बस ।
    ज्यौं  चाहै त्यौं उड़ाय लै डारै, अपने रस ॥
    ब्रह्मलोक सिवलोक, और लोक अस ।
    कहिं श्रीहरिदास बिचारि देखौ, बिना बिहारी नाहिं जस ॥ 
- verseNumber: 9
  verseText: |
    राग आसावरि 
    संसार समुद्र,मनुष्य-मीन-नक्र-मगर और जीव बहु बंदसि ।
    मन-बयार प्रेरे सनेह फंद फंदसि।।
    लोभ पिंजर, लोभी मरजिया, पदारथ चारि खंद खंदसि ।
    कहिं श्रीहरिदास तेई जीव पार भए,
    जे गहि रहे चरन आनंद-नंदसि ॥
- verseNumber: 10
  verseText: |
    राग आसावरी
    हरि के नाम को आलस कत करत है रे,
    काल फिरत सर साँधैं ।
    बेर-कुबेर कछु नहिं जानत, चढ्यौ रहत है काँधैं ॥
    हीरा बहुत जवाहर संचे, कहा भयौ हस्ती दर बाँधैं ।
    कहिं श्रीहरिदास महल में बनिता बनि ठाढ़ी भई,
    एकौं न चलत, जब आवत अंत की आँधैं ॥ 
- verseNumber: 11
  verseText: |
    राग आसावरी 
    देखौ इन लोगन की लावनि ।
    बूझत नाहिं हरि चरन-कमल कौं 
    मिथ्या जनम गँवावनि ॥
    जब जमदूत आनि घेरत,
    तब करत आप मन-भावनि।
    कहिं श्रीहरिदास तबहिं चिरजीवौ,
    जब कुंजबिहारी चितावनि ।। 
- verseNumber: 12
  verseText: |
    राग आसावरी 
    मन लगाइ प्रीति कीजै, कर करुवा सौं,
    ब्रज-वीथिन दीजै सोहनी । 
    वृन्दावन सौं, बन-उपवन सौं, गुंज-माल हाथ पोहनी ॥
    गो गो-सुतन सौं मृगी मृग-सुतन सौं,और तन नेंकु न जोहनी । 
    श्रीहरिदास के स्वामी स्यामा-कुंजबिहारी-सौं चित, 
    ज्यौं सिर पर दोहनी॥
- verseNumber: 13
  verseText: |
    राग कल्याण 
    हरि कौ ऐसौई सब खेल।
    मृग तृष्ना जग व्यापि रह्यौ है, कहूं बिजौरौ न बेल।
    धन-मद, जोवन-मद, राज-मद, ज्यौं पंछिन में डेल।
    कहिं श्रीहरिदास यहै जिय जानौ, तीरथ कैसौ मेल ॥ 
- verseNumber: 14
  verseText: |
    राग कान्हरौ   
    झूँठी बात सांची करि-दिखावत हौ हरि नागर।
    निस-दिन बुनत-उधेरत जात, प्रपंच कौ सागर॥
    ठाठ बनाइ धर्यौ मिहरी कौ, है पुरुष तैं आगर।
    सुनि श्रीहरिदास यहै जिय जानौ, सपने कौ सौ जागर ॥
- verseNumber: 15
  verseText: |
    राग कान्हरौ   
    जगत प्रीति करि देखी, नाहिंनें गटी कौ कोऊ ।
    छत्रपति रंक लौं देखे, प्रकृति-विरोध बन्यौ नहीं कोऊ ॥
    दिन जो गये बहुत जनमनि के, ऐसैं जाउ जिन कोऊ ।
    कहिं श्रीहरिदास मीत भले पाये बिहारी, ऐसे पावौ सब कोऊ ॥ 
- verseNumber: 16
  verseText: |
    राग कान्हरौ   
    लोग तौ भूलैं भलैं भूलैं, तुम जिनि भूलौ मालाधारी।
    अपुनौ पति छँड़ि औरन सौं रति, ज्यौं दारनि में दारी ॥
    स्याम कहत ते जीव मोते बिमुख भए, 
    जिन दूसरी करि डारी।
    कहिं श्रीहरिदास जज्ञ-देवता-पितरन कों श्रद्धा भारी ॥
- verseNumber: 17
  verseText: |
    राग कान्हरौ
    जौलौं जीवै तौलौं हरि भज रे मन और बात सब बादि।
    द्यौस चार के हला-भला में कहा लेइगौ लादि
    माया-मद, गुन-मद, जोवन-मद भूल्यौ नगर विवादि।
    कहिं श्रीहरिदास लोभ चरपट भयौ, काहे की लगै फ़िरादि ॥
- verseNumber: 18
  verseText: |
    राग कान्हरौ 
    प्रेम-समुद्र रूप-रस गहरे, कैसैं लागैं घाट । 
    बेकार्यौं दै जान कहावत, जानिपन्यौं की कहा परी बाट ।। 
    काहू कौ सर सूधौ न परै, मारत गाल गली-गली हाट ।
    कहिं श्रीहरिदास जानि ठाकुर-बिहारी तकत ओट पाट ॥    
