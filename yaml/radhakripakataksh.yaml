- verseNumber: ""
  verseText: | 
    मुनीन्द्र–वृन्द–वन्दिते त्रिलोक–शोक–हारिणि
    प्रसन्न वक्त्र पङ्कजे निकुञ्ज भूविलासिनि
    व्रजेन्द्र भानु नन्दिनि व्रजेन्द्र सूनु संगते
    कदा करिष्यसीह मां कृपाकटाक्ष–भाजनम् ॥1॥

    व्याख्या - वृषभानुनंदिनी श्रीराधिके ! मुनीन्द्र-वृन्द आपके श्रीचरणों की वन्दना करते हैं, आप तीनों लोकों का शोक दूर करने वाली हैं, आपका मुखकमल सदा प्रफुल्लित रहता है, आप निकुंज-भवन में विलास करने वाली और श्रीव्रजेन्द्रनंदन की नित्य संगिनी हैं, आप मुझे इस लोक में अपने कृपाकटाक्ष का पात्र कब बनायेंगी ?
    
    अशोक–वृक्ष–वल्लरी वितान मण्डपस्थिते
    प्रवालज्वाल–पल्लव प्रभारुणांघ्रि कोमले ।
    वराभयस्फुरत्करे प्रभूतसम्पदालये
    कदा करिष्यसीह मां कृपाकटाक्ष–भाजनम् ॥2॥

    व्याख्या - अपार ऐश्वर्य की भण्डार श्रीराधिके ! आप अशोक वृक्ष की लताओं के वितान से सुशोभित मण्डप में विराजमान रहती हैं, आपके कोमल चरण मूँगे तथा नवीन लाल-लाल पल्लवों के सदृश अरुण वर्ण के हैं, आपके वरद हस्त सदा अभयदान देने के लिये उद्यत रहते हैं, आप मुझे इस लोक में अपने कृपाकटाक्ष का पात्र कब बनायेंगी ?

    अनङ्ग रङ्ग  मङ्गल प्रसङ्ग भङ्गुर भ्रुवां
    सुविभ्रम ससम्भ्रम दृगन्त–बाणपातनैः ।
    निरन्तरं वशीकृत प्रतीत नन्दनन्दने
    कदा करिष्यसीह मां कृपाकटाक्ष–भाजनम् ॥3॥

    व्याख्या - प्रेम-क्रीड़ा के रंग-मंच पर मंगलमय प्रसंग में बाँकी भृकुटियों के साथ सहसा परम विस्मयकारक कटाक्षरूप बाणों की वर्षा से श्रीनन्दनन्दन को विश्वासपूर्वक निरन्तर वश में कर लेने वाली श्रीराधिके! आप मुझे इस लोक में अपने कृपाकटाक्ष का पात्र कब बनायेंगी ?

    तडित्सुवर्ण चम्पक प्रदीप्त गौर विग्रहे
    मुखप्रभा परास्त कोटि शारदेन्दु मण्डले ।
    विचित्र चित्र सञ्चरच्चकोर शाव लोचने
    कदा करिष्यसीह मां कृपाकटाक्ष–भाजनम् ॥4॥

    व्याख्या - श्रीराधिके! आपका श्रीविग्रह बिजली, स्वर्ण तथा चम्पा के पुष्प के समान सुनहली कान्ति से देदीप्यमान गौर वर्ण का है, आपके मुख की प्रभा करोड़ों शारदीय चन्द्र-मण्डलों को परास्त करने वाली है, आपके नेत्र चंचल चकोर शावक के समान विचित्र भाव-भंगिमा से संचरित होते हैं, आप मुझे इस लोक में अपने कृपाकटाक्ष का पात्र कब बनायेंगी ?

    मदोन्मदाति–यौवने प्रमोद–मान–मण्डिते
    प्रियानुराग रञ्जिते कला विलास पण्डिते ।
    अनन्य धन्य कुञ्जराज कामकेलि कोविदे
    कदा करिष्यसीह मां कृपाकटाक्ष–भाजनम् ॥5॥

    व्याख्या - प्रियतम के अनुराग में अनुरक्त श्रीराधिके ! आप अपने अपूर्व रूप-यौवन के मद में मत्त, प्रमोदमय मान से विभूषित, क्रीडाकला में कुशल और सर्वातिशय महिमाशाली कुंजराज श्रीकृष्ण की प्रेम क्रीड़ाओं को जानने वाली हैं, आप मुझे इस लोक में अपने कृपाकटाक्ष का अधिकारी कब बनायेंगी ?

    अशेष हावभाव धीरहीरहार भूषिते
    प्रभूत शातकुम्भ कुम्भकुम्भि कुम्भसुस्तनि ।
    प्रशस्तमन्द हास्यचूर्ण पूर्णसौख्य सागरे
    कदा करिष्यसीह मां कृपाकटाक्ष–भाजनम् ॥6॥

    व्याख्या - अनन्त हाव-भाव, धीरता और रत्नहार से विभूषिता श्रीराधिके ! आपके उरोज सुवर्ण-कलश तथा हस्ति-कुम्भ के समान उन्नत एवं सुन्दर हैं तथा आपका प्रशस्त मन्द-हास्य तरंगों से परिपूर्ण आनन्दसिन्धु के समान है, आप मुझे इस लोक में अपने कृपाकटाक्ष का पात्र कब बनायेंगी ?

    मृणाल-वाल-वल्लरी तरङ्ग-रङ्ग-दोर्लते
    लताग्र लास्य–लोल–नील–लोचनावलोकने ।
    ललल्लुलन्मिलन्मनोज्ञ–मुग्ध–मोहिनाश्रिते
    कदा करिष्यसीह मां कृपाकटाक्ष–भाजनम् ॥7॥

    व्याख्या - श्रीराधिके! आपकी भुजाएँ जल-तरंगों के द्वारा प्रकम्पित नव-कमल-नाल के समान कोमल हैं, आप लताओं के हिलते हुए अग्रभाग के सदृश चंचल रतनारे नेत्रों से अवलोकन करती हैं और प्रलुब्ध होकर मिलन की आकांक्षा से ललचाये हुए पीछे-पीछे फिरने वाले मनोज्ञ मनमोहन की आश्रय-प्रदायिका हैं, आप मुझे इस लोक में अपने कृपाकटाक्ष का अधिकारी कब बनायेंगी?

    सुवर्णमालिकाञ्चिते त्रिरेख–कम्बु–कण्ठगे
    त्रिसूत्र–मङ्गली-गुण–त्रिरत्न-दीप्ति–दीधिते ।
    सलोल–नीलकुन्तले–प्रसून–गुच्छ–गुम्फिते
    कदा करिष्यसीह मां कृपाकटाक्ष–भाजनम् ॥8॥

    व्याख्या - श्रीराधिके! आपका कण्ठ सुवर्णमालाओं से अलंकृत एवं त्रिरेखांकित शंख के समान है और उसमें बँधे हुए मांगलिक त्रिसूत्र और त्रिरत्नों की प्रभा से उद्दीप्त हो रहा है। आपके हिलते काले घुँघराले केशोंमें सुन्दर पुष्पगुच्छ गुँथे हुए हैं, आप मुझे इस लोक में अपने कृपाकटाक्ष का पात्र कब बनायेंगी ?

    नितम्ब–बिम्ब–लम्बमान–पुष्पमेखलागुणे
    प्रशस्तरत्न-किङ्किणी-कलाप-मध्य मञ्जुले ।
    करीन्द्र–शुण्डदण्डिका–वरोहसौभगोरुके
    कदा करिष्यसीह मां कृपाकटाक्ष–भाजनम् ॥9॥

    व्याख्या - श्रीराधे! आपका कटि-प्रदेश ऐसी उत्तम रत्नजटित करधनी से सुशोभित है, जिसमें लटकते हुए रत्नजटित स्वर्ण-पुष्पों के समूह झनकार कर रहे हैं तथा आपका ऊरुभाग हाथी की सूँड़ के समान चढ़ाव-उतार वाला होने से अत्यन्त मनोहर है, आप मुझे इस लोक में अपने कृपाकटाक्ष का पात्र कब बनायेंगी ?

    अनेक–मन्त्रनाद–मञ्जु नूपुरारव–स्खलत्
    समाज–राजहंस–वंश–निक्वणाति–गौरवे ।
    विलोलहेम–वल्लरी–विडम्बिचारु–चङ्क्रमे
    कदा करिष्यसीह मां कृपाकटाक्ष–भाजनम् ॥10॥

    व्याख्या - श्रीराधे! आपके चरणकमलों में अनेक निगमागम-मन्त्रों की ध्वनि के समान सुन्दर झनकार करने वाले स्वर्णमय नूपुर कूजते हुए अत्यन्त मनोहर राजहंसों की पंक्ति-सदृश प्रतीत होते हैं तथा चलते समय आपके सुन्दर अंगों की छवि ऐसी शोभा देती है, मानो सुवर्ण-लता लहरा रही हो, आप मुझे इस लोक में अपने कृपाकटाक्षका पात्र कब बनायेंगी ?

    अनन्त–कोटि–विष्णुलोक–नम्र–पद्मजार्चिते
    हिमाद्रिजा–पुलोमजा–विरिञ्चजा-वरप्रदे ।
    अपार–सिद्धि–वृद्धि–दिग्ध–सत्पदाङ्गुली-नखे
    कदा करिष्यसीह मां कृपाकटाक्ष–भाजनम् ॥11॥

    व्याख्या - श्रीराधे! अनन्त कोटि विष्णुलोकों की अधिष्ठात्री श्रीलक्ष्मीजी से भी आप पूजित हैं, आप श्रीपार्वती, इन्द्राणी एवं सरस्वतीजी को भी वर प्रदान करने वाली हैं, आपके पादपद्मों के एक नखमात्र का ही ध्यान अपार सिद्धियों की वृद्धि करने वाला है, आप मुझे इस लोक में अपने कृपाकटाक्ष का पात्र कब बनायेंगी ?

    मखेश्वरि क्रियेश्वरि स्वधेश्वरि सुरेश्वरि
    त्रिवेद–भारतीश्वरि प्रमाण–शासनेश्वरि ।
    रमेश्वरि क्षमेश्वरि प्रमोद–काननेश्वरि
    व्रजेश्वरि व्रजाधिपे श्रीराधिके नमोस्तुते ॥12॥

    व्याख्या - व्रजेश्वरी श्रीराधिके ! आप सम्पूर्ण यज्ञों तथा शुभकर्मों की ईश्वरी हैं। स्वधेश्वरि! आप देवगणों, (ऋक्, यजुः, साम) त्रिवेद-मन्त्रों एवं प्रामाणिक सत्-शास्त्रों की ईश्वरी हैं। व्रजाधिपे! आप रमा, क्षमा एवं प्रमोद-कानन की ईश्वरी हैं, आपको नमस्कार है। 

    इतीदमद्भुतस्तवं निशम्य भानुनन्दिनि 
    करोतु संततं जनं कृपाकटाक्षभाजनम् । 
    भवेत्तदैव संचितत्रिरूपकर्मनाशनं
    लभेत्तदा व्रजेन्द्रसूनुमण्डलप्रवेशनम् ॥13॥

    व्याख्या - हे वृषभानुनन्दिनी श्रीराधिके ! मेरी इस अद्भुत स्तुति को श्रवणकर आप सदा के लिये इस दीन को कृपावलोकन का पात्र बना लीजिये। उक्त अभिलाषा की पूर्ति होते ही मेरे संचित, प्रारब्ध एवं क्रियमाण – ये तीनों तरह के कर्म विनष्ट हो जायेंगे और तत्क्षण श्रीव्रजेन्द्रनन्दन के मण्डल (नित्य तथा दिव्य लीला) में मेरा प्रवेश हो जायगा।

    राकायां च सिताष्टम्यां दशम्यां च विशुद्धया।
    एकादश्यां त्रयोदश्यां यः पठेत्साधकः सुधीः ॥14।। 

    यं यं कामयते कामं तं तं प्राप्नोति साधकः ।
    राधाकृपाकटाक्षेण भक्तिः स्यात् प्रेमलक्षणा ॥15॥

    ऊरूमात्रे नाभिमात्रे हृन्मात्रे कण्ठमात्रके। 
    राधाकुण्डजले स्थित्वा यः पठेत्साधकः शतम्।।16।। 
    
    तस्य सर्वार्थसिद्धिः स्याद् वाञ्छितार्थफलं लभेत्।
    ऐश्वर्यं च लभेत् साक्षाद् दृशा पश्यति राधिकाम्।।17।।

    तेन सा तत्क्षणादेव तुष्टा दत्ते महावरम्। 
    येन पश्यति नेत्राभ्यां तत्प्रियं श्यामसुन्दरम्।।18।।

    नित्यलीलाप्रवेशं च ददाति श्रीव्रजाधिपः।
    अतः परतरं प्राप्यं वैष्णवानां न विद्यते।।19।।

    ।। श्री ऊर्ध्वाम्नायतंत्रे शिव गौरी संवादे श्री राधा कृपा कटाक्ष स्तवराजः की जै जै श्रीहित हरिवंश ।।
