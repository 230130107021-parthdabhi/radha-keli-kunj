- verseNumber: "श्रीराधा के 28 नाम"
  verseText: | 
    'ऋग्वेदीय श्रीराधोपनिषद्' के अनुसार श्रुतियाँ श्रीराधा के 28 नामों का गान करती हैं, इन (अट्ठाईस) नामों का जो नित्य पाठ करता है, वह जीवन्मुक्त हो जाता है-ऐसा श्रीब्रह्माजी ने कहा है। 

    1. राधा
    2. रासेश्वरी
    3. रम्या
    4. कृष्णमन्त्राधिदेवता
    5. सर्वाद्या
    6. सर्ववन्द्या
    7. वृन्दावनविहारिणी
    8. वृन्दाराध्या
    9. रमा
    10. अशेषगोपीमण्डलपूजिता
    11. सत्या
    12. सत्यपरा
    13. सत्यभामा
    14. श्रीकृष्णवल्लभा 
    15. वृषभानुसुता 
    16. गोपी
    17. मूलप्रकृति
    18. ईश्वरी
    19. गान्धर्वा
    20. राधिका
    21. आरम्या
    22. रुक्मिणी
    23. परमेश्वरी
    24. परात्परतरा
    25. पूर्णा
    26. पूर्णचन्द्रनिभानना
    27. भुक्तिमुक्तिप्रदा
    28. भवव्याधिविनाशिनी

    