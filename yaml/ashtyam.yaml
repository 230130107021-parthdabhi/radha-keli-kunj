pages:
  - pageNumber: 1
    pageDescription: 1. प्रातः उत्थापन पद
    content:
      - type: video
        videoId: "-35oq9sMAbY"
      - type: text
        value: |
          आजु देखि ब्रजसुन्दरी मोहन बनी केलि । 
          अंस अंस बाहु दै किसोर जोर रूप रासि,
          मनौ तमाल अरुझि रही सरस कनक बेलि ॥ 
          नव निकुंज भ्रमर गुंज, मंजु घोष प्रेम पुंज, 
          गान करत मोर पिकन अपने सुर सों मेलि । 
          मदन मुदित अंग अंग, बीच बीच सुरत रंग, 
          पल पल हरिवंश पिवत नैंन चषक झेलि ॥
      - type: video
        videoId: "F-_E_L9-RVQ"      
      - type: text
        value: |
          अबहि नैंकु सोये हैं अरसाय ।
          काम केलि अनुराग रस भरे, जागे रैंन बिहाय ॥
          बार-बार सुपनेहू सूचत, सुरत रंग के भाय ।
          यह सुख निरखि सखीजन प्रमुदित, नागरीदासि बलि जाय ॥
      - type: video
        videoId: "6gMb0FyJ8BE"      
      - type: text
        value: |
          प्रात समै नव कुंज द्वार पै, ललिताजू ललित बजाई बीना ।
          पौढ़े सुनत स्याम श्रीस्यामा, दंपति चतुर प्रवीन प्रवीना ॥
          अति अनुराग सुहाग परस्पर, कोक-कला गुन निपुन नवीना ।
          श्रीबिहारीनदासि बलि-बलि बंदिस पर, मुदित प्रान न्यौछावर कीना ॥
      - type: video
        videoId: "sRwOHsUsozI"      
      - type: text
        value: |
          भोर भयै सहचरि सब आईं । यह सुख देखत करत बधाई ॥
          कोउ वीना-सारंगी बजावैं । कोउ इक राग विभासहि गावैं ॥
          एक चरन हित सौं सहरावै । एक वचन परिहास सुनावै ॥
          उठि बैठे दोउ लाल रँगीले । बिथुरी अलक सबै अँग ढीले ॥
          घूमत अरुन नयन अनियारे । भूषन-वसन न जात सम्हारे ॥
          कहुँ अंजन कहुँ पीक रही फबि । कैसैं कही जात है सो छबि॥
          हार-बार मिलिकै अरुझाने । निशि के चिह्न निरखि मुसिकाने॥        
      - type: text
        value: |
          निरखि-निरखि निशि के चिह्ननि रोमांचित ह्वै जाहिं ।
          मानौं अंकुर मैंन कै फिर उपजै तन माहिं ॥   
      - type: video
        videoId: "FNa_LC6V1m0"      
      - type: text
        value: |
          जागौ मोहन प्यारी राधा ।
          ठाढ़ीं सखी दरस के काजैं, दीजै दरस जु होय न बाधा ॥
          सुनत वचन हँसि उठे जुगलवर, मरगजे बागे फबि रहे दोऊ तन।
          वारत प्रानन लेत बलैया, निरखि-निरखि फूलत मन ही मन॥
          रंग भरे आनन्द जम्हावत, अंस अंस धरि बाहु रहे कसि ।
          जै श्री कमलनयन हित या छबि ऊपर, वारौं कोटिक भानु मधुर शशि ॥            
  - pageNumber: 2
    pageDescription: 2. मंगला भोग
    content:
      - type: video
        videoId: "hTES7DImYnw"
      - type: text
        value: |
          मंगल भोग अधिक रुचिकारी ।
          माखन, मिश्री, मोदक मेवा, सखियन आन धरी भरि थारी ॥
          आलस बलित नैंन झपकौहें, सोहैं करतल जुत सुकुमारी ।
          प्रियहिं निहोर मुख देत ग्रास पुनि, खात खवावत करत हहारी॥
          गान नृत्य अरु वाद्य करन हित, सब सखी आन भईं इकठाँरी।
          ललिता ललित देत मुख बीरी, (जै श्री) कमलनयन छबि पर बलिहारी ॥     
  - pageNumber: 3
    pageDescription: 3. मंगला आरती
    content:
      - type: video
        videoId: "pGJ4AISsl8Y"
      - type: text
        value: |
          प्रातहि मंगल आरति कीजै ।
          जुगल किशोर रूप रस माते, अद्भुत छवि नैननि भरि लीजै ॥
          ललिता ललित बजावति वीना, गुन गावति सोई जीवन जीजै ।
          जय श्रीरूपलाल हित मंगल जोरी, निरखि प्रान न्यौछावर कीजै॥

          निरखि आरती मंगल भोर । मंगल श्यामा श्याम किशोर ॥
          मंगल श्रीवृन्दावन धाम । मंगल कुंज महल अभिराम ॥
          मंगल घण्टा नाद सु होत । मंगल थार मणिनु की जोत ॥
          मंगल दुन्दुभि धुनि छबि छाई । मंगल सहचरि दरसन आईं ॥
          मंगल बीन मृदंग बजावैं । मंगल ताल झाँझ झर लावैं ॥
          मंगल सखी यूथ कर जोरैं । मंगल चँवर लियें चहुँ ओरै ॥ 
          मंगल पुष्पावलि वरषाई। मंगल जोति सकल वन छाई ॥ 
          जै श्री रूपलाल हित हृदय प्रकास । मंगल अद्भुत युगल विलास ॥
  - pageNumber: 4
    pageDescription: 4. सुरतान्त छवि वर्णन
    content:
      - type: video
        videoId: "qgb2_F8KV28"
      - type: text
        value: |
          आजु तौ जुवती तेरौ, वदन आनंद भर्यौ, 
          पिय के संगम के सूचत सुख चैन।
          आलस बलित बोल, सुरंग रँगे कपोल, 
          विथकित अरुन उनींदे दोउ नैंन।।
          रुचिर तिलक लेश, किरत कुसुम केश 
          सिर सीमंत भूषित मानौं तैं न।
          करुणाकर उदार, राखत कछु न सार
          दसन - वसन लागत जब दैन।।
          काहे कौं दुरत भीरु, पलटे प्रीतम चीरु,
          बस किये श्याम सिखै सत मैंन।
          गलित उरसि माल, सिथिल किंकनी जाल, 
          (जै श्री) हित हरिवंश लता गृह सैंन ।।
      - type: video
        videoId: "urTUc1WIRZk"      
      - type: text
        value: |
          कौन चतुर जुवती प्रिया, जाहि मिलत लाल चोर ह्वै रैन ।
          दुरवत क्यौंब दुरै सुनि प्यारे, रंग में गहिले चैंन में नैन ।।
          उर नख चंद्र विराने पट, अटपटे  से बैन ।
          (जै श्री) हित हरिवंश रसिक राधापति प्रमथित मैन ।।      
  - pageNumber: 5
    pageDescription: 5. प्रातः कालीन वन विहार
    content:
      - type: video
        videoId: "M6_wmZmqnzw"
      - type: text
        value: |
          वन की कुंजन कुंजन डोलन ।
          निकसत निपट साँकरी बीथिन, परसत नाहिं निचोलन ॥
          प्रात काल रजनी सब जागे, सूचत सुख दृग लोलन । 
          आलसवन्त अरुण अति व्याकुल, कछु उपजत गति गोलन ॥
          निर्तन भृकुटि बदन अम्बुज मृदु, सरस हास मधु बोलन ।
          अति आसक्त लाल अलि लम्पट, बस कीने बिनु मोलन ॥
          बिलुलित सिथिल श्याम छूटी लट, राजत रुचिर कपोलन ।
          रति विपरित चुंबन परिरंभन, चिबुक चारु टक टोलन ॥
          कबहुँ स्रमित किसलय सिज्या पर, मुख अंचल झक झोलन ।
          दिन हरिवंश दासि हिय सींचत, वारिधि केलि कलोलन ॥
      - type: video
        videoId: "aWv9CrAA3PY"      
      - type: text
        value: |
          आजु सँभारत नाँहिन गोरी ।
          फूली फिरत मत्त करिनी ज्यौं सुरत समुद्र झकोरी ।।
          आलस वलित अरुन धूसर मषि प्रगट करत दृग चोरी ।
          पिय पर करुन अमी रस बरषत अधर अरुनता थोरी ।।
          बाँधत भृंग उरज अंबुज पर अलक निबंध किसोरी ।
          संगम किरचि किरचि कंचुकि बँध सिथिल भई कटि डोरी ।।
          देति असीस निरखि जुवती जन जिनकें प्रीति न थोरी ।
          (जै श्री) हित हरिवंश विपिन भूतल पर संतत अविचल जोरी ।।
      - type: video
        videoId: "AiWXPPzmpNc"      
      - type: text
        value: |
          आवत लाल प्रिया भुज जोरैं ।
          डगमगात आरस रस भीने, अति सुरंग नैंननि की कोरैं । 
          चितवनि सहज चारु अति चंचल, मुसिकन मन्द मिथुन चित चोरैं ॥
          हित ध्रुव निरखि रसिक ललितादिक, डारति वारि प्रान तृन तोरैं ।
  - pageNumber: 6
    pageDescription: 6. झूलन पद
    content:
      - type: video
        videoId: "iuM8fiGHfZc"
      - type: text
        value: |
          झूलत दोऊ नवल किसोर । 
          रजनी जनित रंग सुख सूचत, अंग अंग उठि भोर ॥  
          अति अनुराग भरे मिलि गावत, सुर मंदर कल घोर । 
          बीच बीच प्रीतम चित चोरत, प्रिया नैंन की कोर ॥ 
          अबला अति सुकुमार डरत मन, वर हिंडोर झकोर । 
          पुलकि पुलकि प्रीतम उर लागत, दै नव उरज अँकोर ॥ 
          अरुझी विमल माल कंकन सौं, कुंडल सौं कच डोर । 
          वेपथ जुत क्यौं बनैं विवेचित, आनँद बढ्यौ न थोर ॥ 
          निरखि निरखि फूलत ललितादिक विवि मुख चन्द्र चकोर । 
          दे असीस हरिवंश प्रसंसत करि अंचल की छोर ॥  
  - pageNumber: 7
    pageDescription: 7. जल विहार
    content:
      - type: video
        videoId: "5hp-T69tdlM"
      - type: text
        value: |
          देखौ सखी री देखौ दोऊ बैठे नाव में ।
          गावत आवत चपल चलावत, सहचरि चंपा चाव में ॥ 
          श्यामाश्याम दिये गरबहियाँ, नौका बिच रस भाव में । 
          नागर नवल सखिन की अँखियाँ, लगि लपटीं लपटाव में ॥      
  - pageNumber: 8
    pageDescription: 8. स्नान तथा शृंगार पद
    content:
      - type: text
        value: |
          स्नान कुंज में दोऊ आये । रतन जटित जहँ हौज सुहाये ॥
          जल सुगन्ध तिनमें अति सोहैं।खिले कमल जिनमें मन मोहैं ॥
          तिन पर भ्रमर करत गुंजार । फूली फूल रहीं द्रुम डार ।।
          दोउ कुंज सुख-पुंज हैं, तिनको एक ही घाट।
          स्नान करत जहाँ जुगलवर, तहाँ अलिनु के ठाट॥
      - type: video
        videoId: "n2EW-a1g5Ww"      
      - type: text
        value: |
          अधर अरुन तेरे कैसैं कैं दुराऊँ।
          रवि-शशि-शंक भजन किय अपु बस, अद्भुत रंगनि कुसुम बनाऊँ।
          शुभ कौसेय कसिव कौस्तुभ मणि, पंकज-सुतनि लै अँगनि लुपाऊँ।
          हरषित इंदु तजत जैसे जलधर, सो भ्रम दूँढि कहाँ हौं पाऊँ।।
          अंबुनि-दंभ कछु नहिं व्यापत, हिमकर तपै ताहि कैसें कैं बुझाऊँ।
          जै श्रीहित हरिवंश रसिक नव रंग पिय, भृकुटी भौंह तेरे खंजन लराऊँ।    
      - type: text
        value: |
          मज्जन करि बैठी चौकी पर, हित कर निज सिंगार बनावत।
          कारी सारी हरी कंचुकी, अतरौटा पियरौ पहिरावत ॥
          लाल लाल चीरा उपरैना, पटुका- झँगा जु सूथन भावत।
          बहु भूषन पहिराय तिलक दै, हित ब्रजलाल सु भोग लगावत ॥    
      - type: text
        value: |
          करि सिंगार राजत रँग भीने, रीझि लाड़िली-लाल जिमावत।
          कौर-कौर प्रति छबि अवलोकत, बलि-बलि जूठन आपुन पावत।।
          ललितादिक लीने कर चौरनि, निरखि-निरखि नैननि जु सिरावत।
          जै श्रीहित हरिलाल निकट अलि रूपहि, पानदान लै पान खवावत ।।    
  - pageNumber: 9
    pageDescription: 9. शृंगार भोग
    content:
      - type: video
        videoId: "SWWy5oXfskc"      
      - type: text
        value: |
          सजनी कौ राख्यौ रुख ग्रास लैंन लागे मुख, 
          जो जो मन रुच्यो पाक बहुरि सो मँगायौ ॥ 
          कीनी मनुहारि धनी लाल रसिक चूड़ामनि, 
          प्यारी मन भाँवती सहेली जो चितायौ । 
          अदलि बदलि ग्रास लेत सखियनि आनन्द देत, 
          चंद्रकला घेवर ने स्वाद अति बढ़ायौ ॥

          बतरस परे स्याम गौर कहत जात लाउ और, 
          तुष्टि पुष्टि होत कियौ भोजन मन भायौ । 
          सिता मिल्यौ गाढ़ौ दही पीयौ पुनि ललक रही, 
          मेवा फल पाइ स्वाद अधिक सो जनायौ ॥ 
          शीतल अति मिष्ट जानि जमुनोदक कियौ पानि,
          वदन कर अँगौछि सखी पान रचि खवायौ ।
          बलि बलि वृन्दावन हित रूप साजि आरती कौ,
          पंच नाद होत सीस चँवर लै ढुरायौ ॥    
  - pageNumber: 10
    pageDescription: 10. श्रृंगार आरती
    content:
      - type: video
        videoId: "BkDClZFgrek"
      - type: text
        value: |
          आजु नीकी बनी श्रीराधिका नागरी।
          ब्रजजुवति-जूथ में रूप अरु चतुरई, 
          शील-सिंगार-गुन सबनि तें आगरी ॥
          कमल दच्छिन भुजा, वाम भुज अंश सखि,
          गावती सरस मिलि मधुर सुर राग री।
          सकल विद्या विदित, रहसि हरिवंश हित,
          मिलत नव कुंज वर श्याम बड़ भाग री।।

          आजु नागरी-किशोर, भाँवती विचित्र जोर,
          कहा कहौं अंग-अंग परम माधुरी।
          करत केलि कंठ मेलि, बाहु दंड गंड-गंड,
          परस सरस रास-लास मंडली जुरी ॥
          श्याम सुंदरी-बिहार, बाँसुरी मृदंग तार,
          मधुर घोष नूपुरादि किंकिनी चुरी।
          जै श्री देखत हरिवंश आलि निर्त्तनी सुधंग चालि,
          वारि फेर देत प्रान देह सौं दुरी ॥

          बनी श्रीराधा-मोहनजू की जोरी।
          इंद्र नीलमणि श्याम मनोहर, सातकुंभ तन गोरी ॥
          भाल विशाल तिलक हरि कामिनि, चिकुर चंद्र बिच रोरी।
          गज-नाइक प्रभु चाल गयंदनि, गति वृषभानुकिशोरी ॥
          नील निचोल जुवति मोहन पट, पीत अरुण सिर खोरी।
          जै श्री हित हरिवंश रसिक राधापति, सुरत रंग में बोरी ॥

          बेसर कौन की अति नीकी।
          होड़ परी लालन अरु ललना, चौंप बढ़ी अति जी की ॥
          न्याव पर्यौ ललिताजू के आगें, कौन ललित कौन फीकी।
          जै श्रीदामोदर हित विलग न मानौ, झुकनि झुकी प्यारीजू की॥
      - type: video
        videoId: "djLB75Ddjag"      
      - type: text
        value: |
          दिव्य दम्पति की आरती उतारो हे अली
          राजै नंद जू कौ लाल वृषभानु की लली
          राधामोहन जू की आरती उतारो हे अली

          पद नख मणिचन्द्रिका की उज्जवल प्रभा
          नील पीत पट कटि रहे मन को लुभा
          कटि कोधनी की शोभा अति लगत भली
          दिव्य दंपति की आरती उतारो हे अली

          दिव्य कांति गौर श्याम मुखचंद्र की छटा
          घुंघराली अलकावली सुजलज घटा
          द्युति कुंडल दसन सो चपल बिजली
          दिव्य दंपति की आरती उतारो हे अली

          शीश चन्द्रिका मुकुट त्रिभुवन धनी के
          अंग अंग दिव्य भूषण कनक मणि के
          सोहे श्यामा कर कंज श्याम कर मुरली
          दिव्य दंपति की आरती उतारो हे अली

          चितवनि मुसकनि प्रेम रस बरसे
          हिय हरषि नरायण चरन परसे
          जय जय जय  कहि बरसें देवता सुमन अंजलि
          दिव्य दम्पति की आरती उतारो हे अली  
  - pageNumber: 11
    pageDescription: 11. श्रीयुगल ध्यान
    content:
      - type: video
        videoId: "9hHrEM_jVIY"
      - type: text
        value: |
          (श्री) प्रिया वदन-छबि चंद मनौं, प्रीतम-नैंन चकोर । 
          प्रेम-सुधा रस-माधुरी, पान करत निसि-भोर ।।1।। 

          अंगनि की छबि कहा कहौं, मन में रहत विचार । 
          भूषन भये भूषननि कौ, अति सरूप सुकुमार ।।2।। 

          सुरंग माँग मोतिनु सहित, सीस-फूल सुख-मूल । 
          मोर-चंद्रिका मोहनी, देखत भूली भूल ।।3।।

          श्याम-लाल बैंदी बनी, सोभा बढ़ी अपार । 
          प्रगट विराजत ससिन पर, मनौं अनुराग सिंगार ।।4।। 

          कुंडल कल ताटंक चल, रहे अधिक झलकाइ । 
          मनौ छबि के ससि-भानु जुग, छबि कमलनि मिले आइ ।।5।। 

          नासा बेसरि-नथ बनी, सोहत चंचल नैंन । 
          देखत भाँति सुहावनी, मोहे कोटिक मैंन ।।6।। 

          सुन्दर चिबुक कपोल मृदु, अधर सुरंग सुदेस । 
          मुसिकनि बरषत फूल सुख, कहि न सकत छबि-लेस ।।7।। 

          अंगन भूषन झलकि रहे, अरु अंजन रंग पान । 
          नव-सत सरवर तें मनौ, निकसे करि स्नान ।।8।। 

          कहि न सकत अंगनि-प्रभा, कुंज-भवन रह्यौ छाइ । 
          मानौं बागे रूप के, पहिरे दुहुँनि बनाइ ।।9।। 

          रतनांगद पहुँची बनी, वलया-वलय सुढार । 
          अँगुरिनु मुंदरीं फब रहीं, अरु मेंहदी रंग-सार ।।10।। 

          चंद्रहार मुक्तावली, राजत दुलरी-पोति । 
          पानि पदिक उर जगमगै, प्रतिबिंबित अंग-जोति ।।11।।

          मनिमय किंकिनि-जाल छबि, कहौं जोइ सोइ थोर । 
          मनौ रूप दीपावली, झलमलात चहुँ ओर ।।12।। 

          जेहरि सुमिलि अनूप बनी, नूपुर अनवट चारि । 
          और छाँड़ि कै या छबिहि, हिय के नैंन निहारि ।।13।। 

          बिछुवनि की छबि कहा कहौं, उपजत रव रुचि-दैन । 
          मनौ सावक कल हंस के, बोलत अति मृदु बैंन ।।14।। 

          नख-पल्लव सुठि सोहने, सोभा बढ़ी सुभाइ । 
          मानौं छबि चंद्रावली, कंज-दलन लगी आइ ।।15।। 

          गौर वरन सांवल चरन, रचि मेंहदी के रंग । 
          तिन तरुवनि तर लुठत रहैं, रति-जुत कोटि अनंग ।।16।। 

          अति सुकुमारी लाड़िली, पिय किसोर सुकुमार । 
          इक छत प्रेम छके रहैं, अद्भुत प्रेम बिहार ।।17।। 

          अनुपम स्यामल-गौर छबि, सदा बसौ मम चित्त । 
          जैसे घन अरु दामिनी, एक संग रहै नित्त ।।18।। 

          बरने दोहा अष्ट-दस, जुगल-ध्यान रसखान । 
          जो चाहत विश्राम ‘ध्रुव’, यह छबि उर में आन ।।19।। 

          पलकनि के जैसे अधिक, पुतरिन सौं अति प्यार । 
          ऐसैहि लाड़िली-लाल के, छिन छिन चरन सँभार ।।
          ऐसेही राधावल्लभ लाल के पल पल चरण सम्भार ।।20।।

  - pageNumber: 12
    pageDescription: 12. राजभोग
    content:
      - type: text
        value: |
          आये भोजन कुंज किशोर री।
          कर वर ध्वाय धरे मणि पट्टा, बैठे एकै जोर री ॥
          कटि पटुका मुद्रिका उतारी, करि-करि अधिक निहोर री।
          वृन्दावन हित रूप परोसति, विंजन रचे न थोर री॥

          मिलि जेंवत लाड़िली-लाल दोऊ, षट विंजन चारु सबै सरसैं।
          मन में रस की रुचि जो उपजै, सखी माधुरी कुंज सबै हरसैं॥
          हटकैं मनमोहन हारि रह्यो भटू हाथ जिमावन कौं तरसैं।
          बीचहिं कर कंपित छूटि पर्यौ , कबहूँ मुख ग्रास लियें परसैं॥
          दृग सौं दृग जोरि दोऊ मुसिकाय, भरे अनुराग सुधा बरसैं।
          मनुहार विहार आहार करें, तन में मन प्रान परे करसैं ॥
          सखी सौंज लियें चहुँ ओर खरीं, हरषै निरखें परसैं दरसैं।
          सुख-सिन्धु अपार कह्यौ न परै, अवशेष सखी हरिवंश लसैं ॥

          सजनी समुझि दुहुँनि के मन की, जमुनोदक अचवावै हो।
          खरिका दैकैं करन ध्वाय कैं, पुनि वीरी रचि लावै हो॥
          पद-पाँवरी जटित मणि आगैं, राखि पौछि पहिरावै हो।
          वृन्दावन हित रूप रतन सिंहासन तहाँ बैठावै हो।
  - pageNumber: 13
    pageDescription: 13. राजभोग आरती
    content:
      - type: video
        videoId: "rxpPksubiLo"
      - type: text
        value: |
          आरती मदन गोपाल की कीजियै ।
          देव-ऋषि-व्यास-शुकदास सब कहत निज,
          क्यौं न बिन कष्ट रस-सिन्धु की पीजियै ॥
          अगर करि धूप कुमकुम मलय रंजित,
          नव वर्तिका घृत सों पूरि राखौ ॥
          कुसुम कृत माल नंदलाल के भाल पर,
          तिलक करि प्रगट यश क्यौं न भाखौ ॥
          भोग प्रभु योग भरि थार धरि कृष्ण पै,
          मुदित भुज दण्डवर चँवर ढारौ ॥
          आचमन पान हित, मिलत कर्पूर-जल,
          सुभग मुख वास, कुल-ताप जारौ ॥
          शंख दुन्दुभि पणव घंट कल वेणु रव,
          झल्लरी सहित स्वर सप्त नाचौं ॥
          मनुज-तन पाय यह दाय ब्रजराज भज,
          सुखद हरिवंश प्रभु क्यौं न याँचौ ॥
      - type: video
        videoId: "7zSmTBvqDyY"      
      - type: text
        value: |
          हौं बलिजाँऊ नागरी श्याम ।
          ऐसे ही रंग करौ निशि वासर, वृन्दाविपिन कुटी अभिराम ॥
          हास विलास सुरत रस सींचन, पशुपति-दग्ध जिवावत काम ।
          (जैश्री) हित हरिवंश लोल लोचन अलि, करहु न सफल सकल सुखधाम ॥  
  - pageNumber: 14
    pageDescription: 14. मध्याह्न शयन
    content:
      - type: video
        videoId: "SduXQfuCJLg"
      - type: text
        value: |
          कियौ गवन सैंन भवन प्रान प्यारी प्रान रवन,
          रचत चोंज रस मनोज पौढ़े सचु पाई।
          मणिनु कौ प्रकाश जहाँ सौरभ उद्‌गार तहाँ,
          पान-डबा झारी जल धरी तहाँ जाई॥
          नेह-भरी गुननि-भरी दंपति-सुख लार ढरी,
          मृदुल करन चाँपि चरन बाहरि सखि आई।
          बलि-बलि वृन्दावन हित रूप जुगल रसिक भूप,
          तिनकी रस-केलि हियें संपति सचि लाई॥
      - type: video
        videoId: "0XuZbBmNHZ0"      
      - type: text
        value: |
          नवलनागरि नवलनागर किसोर मिलि, 
          कुञ्ज कोमल कमल दलन सिज्या रची । 
          गौर स्यामल अंग रुचिर तापर मिले, 
          सरस मनि नील मनों मृदुल कंचन खची ॥ 
          सुरत नीबी निबंध हेत पिय मानिनी, 
          प्रिया की भुजनि में कलह मोहन मची । 
          सुभग श्रीफल उरज पानि परसत रोष,
          हुँकार गर्व दृग-भंगि भामिनि लची ॥ 
          कोक कोटिक रभस रहसि हरिवंश हित, 
          विविध कल माधुरी किमपि नाँहिन बची ।  
          प्रणयमय रसिक ललितादि लोचन चषक, 
          पिवत मकरंद सुख-रासि अंतर सची ॥ 
      - type: video
        videoId: "zkTp2RfIpZM"      
      - type: text
        value: |
          दोऊ पौढ़े हैं अरसाइ कैं। 
          अति सुकुमारि श्रमित कछु सजनी अंग अनंग लड़ाइकै ॥ 
          चाह सनेह सुरति हित सहचरि सेवा अवसर पाइकैं ।
          कोऊ बिजन टहल में प्रफुलित कोऊ पद चाँपत आइकें ॥
          कोऊ झमकि झरोखनि लागी भरि अति प्रेम सुभाइकैं  । 
          वृंदावन हितरूप जाउँ बलि रह्यौ रति रस सुख छाइकैं ॥
  - pageNumber: 15
    pageDescription: 15. उत्थापन समय
    content:
      - type: video
        videoId: "C71bbizTs2w"
      - type: text
        value: |
          जाहि री तू मन्दिर माँहिं दरे री।
          जुगल जगाइ रह्यौ दिन थोरौ, मानि वीनती मेरी ॥
          दंपति-अंग-सिंगारनि सामा, मैं रचि धरी घनेरी।
          गौर-श्याम कौ मुख देखें बिनु, सबै अरवरत एरी ॥
          यह सुनि सखी अलंकृत ह्वैकैं, सैंन भवन गई नेरी।
          बीन अंक लै गावत बलि-बलि, उठहु नींद दै डेरी ॥
          वन-कौतिक-लोभी सुनि जागे, बातनि रंग ढरे री।
          वृन्दावन हित रूप आइ जल, मज्जन वदन करे री ॥     
      - type: text
        value: |
          दुहुँनि तन सखिनु सिंगार किये हैं।
          अंजन दै पुनि तिलक भाल रचि, दर्पन करनि दिये हैं।
          धूप दीप करि चरचि सुगंधिनु, घृत पक भोग धरे हैं।
          मेवा मधुर मिष्ट फल नाना, जैंवत स्वाद ढरे हैं।
          सबके नाम बतावति सजनी, जैंवत करति बड़ाई।
          धनि-धनि चंपकलता हेत उर, अधिक भरी चतुराई॥
          तुष्ट-पुष्ट भये ग्रासनि लै पुनि, जमुनोदक अचवावै।
          वृन्दावन हित रूप अनुरागिनि, रचि-रचि पान खवावै॥
  - pageNumber: 16
    pageDescription: 16. उत्थापन शृंगार शोभा
    content:
      - type: video
        videoId: "6ijwNV5-dGI"
      - type: text
        value: |
          रुचिर राजत वधू कानन किशोरी ।
          सरस षोडस किए तिलक मृगमद दिये, मृगज लोचन उबटि अंग शिर खोरी ॥
          गंड पंडीर मंडित, चिकुर चंद्रिका, मेदिनी कवरि गूँथित सुरंग डोरी ।
          श्रवन ताटंक कै चिबुक पर बिंदु दै, कसूँभि कंचुकि दुरे उरज फल कोरी ॥
          वलय कंकन दोत, नखन जावक जोत, उदर गुन रेख, पट नील, कटि थोरी ।
          सुभग जघनस्थली, कुनित किंकिनि भली, कोक संगीत रस-सिंधु झकझोरी ॥
          विविध लीला रचित रहसि श्रीहरिवंश हित, रसिक सिर मौर राधारवन जोरी ।
          भृकुटि निर्जित मदन मंद सस्मित वदन, किये रस विवश घनश्याम पिय गोरी॥
      - type: video
        videoId: "ic4VRSXp5nU"      
      - type: text
        value: |
          देखौ माई सुन्दरता की सींवाँ ।
          ब्रज नवतरुनि कदंब नागरी, निरखि करत अधग्रीवाँ ॥
          जो कोऊ कोटि कलप लगि जीवै, रसना कोटिक पावै ।
          तऊ रुचिर वदनारविंद की, शोभा कहत न आवै ॥
          देवलोक, भू-लोक, रसातल, सुनि कवि-कुल मति डरिये ।
          सहज माधुरी अंग-अंग की, कहि कासौं पटतरिये ॥
          (जैश्री) हित हरिवंश प्रताप, रूप, गुण, वय, बल श्याम उजागर ।
          जाकी भ्रू-विलास बस पशुरिव, दिन विथकित रस सागर ॥
  - pageNumber: 17
    pageDescription: 17. उत्थापन धूप आरती
    content:
      - type: video
        videoId: "nLIs5Gnk3Ic"
      - type: text
        value: |
          श्रीराधा मेरे प्रानन हूँ ते प्यारी । 
          भूलिहूँ मान न कीजै सुन्दरि हौं तौ शरण तिहारी ॥ 
          नेकु चितै हँसि हेरिये मोतन खोलिये घूंघट सारी । 
          जैश्री कृष्णदास हित प्रीति रीति बस भर लई अंकन वारी ॥
  - pageNumber: 18
    pageDescription: 18. संध्या भोग
    content:
      - type: text
        value: |
          आय विराजे महल में, संध्या समयौ जान।
          आली ल्याईं भोग सब, मेवा अरु पकवान ॥

          संध्या भोग अली लै आईं।
          पेड़ा-खुरमा और जलेबी, लडुआ-खजला और इमरती,मोदक मगद मलाई।
          कंचन-थार धरे भरि आगें, पिस्ता अरु बादाम रलाई।
          खात-खवावत लेत परस्पर, हँसनि दसन-चमकनि अधिकाई॥

          अद्भुत मीठे मधुर फल, ल्याईं सखी बनाय ।
          खवावत प्यारेलाल कौं, पहिलैं प्रियाहिं पवाय॥

          पानि परसि मुख देत बीरी पिय, तब प्यारी नैंनन में मुसिकाई।
          ललितादिक जैश्रीकमलनयन हित, धनि दिन मानत आपनौं माई॥
  - pageNumber: 19
    pageDescription: 19. संध्या आरती
    content:
      - type: video
        videoId: "Ykoi870keoY"
      - type: text
        value: |
          पाग बनी पटुका बन्यौ, बन्यौ लाल कौ वेष।
          श्रीराधावल्लभलाल की, दौरि आरती देख ॥

          आरति कीजै श्यामसुन्दर की। नन्द के नंदन राधिकावर की॥
          भक्ति करि दीप प्रेम करि बाती । साधु संगति करि अनुदिन राती ॥
          आरति ब्रजयुवति जूथ मन भावै | श्यामलीला श्रीहरिवंश हित गावै ॥
          आरति राधाबल्लभलाल की कीजै। निरखि नयन छबि लाहौ लीजै ॥
          सखि चहुँओर चँवर कर लीयैं। अनुरागन सौं भीने हीयैं।
          सनमुख बीन मृदंग बजावैं। सहचरि नाना राग सुनावैं॥
          आरति राधाबल्लभलाल की कीजै। निरखि नयन छबि लाहौ लीजै ॥
          कंचन-थार जटित मणि सोहै। मध्य वर्तिका त्रिभुवन मोहै॥
          घंटा-नाद कह्यौ नहिं जाई। आनंद मंगल की निधि माई॥
          जयति जयति यह जोरी सुखरासी। जयश्रीरूपलाल हित चरन निवासी ॥
          आरति राधाबल्लभलालजू की कीजै। निरखि नयन छबि लाहौ लीजै॥
  - pageNumber: 20
    pageDescription: 20. इष्ट स्तुति
    content:
      - type: video
        videoId: "_-qCcnZ1XxE"
      - type: text
        value: |
          चन्द्र मिटै दिनकर मिटै, मिटै त्रिगुन विस्तार।
          दृढ़ व्रत श्रीहरिवंश कौ, मिटै न नित्य विहार।।
          जोरी जुगलकिशोर की, और रची विधि वादि।
          दृढ़ व्रत श्रीहरिवंश कौ, निवह्यौ आदि जुगादि॥
          निगम-ब्रह्म परसत नहीं, जो रस सबतें दूरि।
          कियौ प्रगट हरिवंशजू, रसिकनि जीवनि मूरि॥
          रूप-बेलि प्यारी बनी, सु प्रीतम प्रेम-तमाल।
          दोउ मन मिलि एकै भये, श्रीराधावल्लभलाल ॥
          निकसि कुंज ठाढ़े भये, भुजा परस्पर अंश।
          श्रीराधावल्लभ-मुख-कमल, निरखि नयन हरिवंश॥
          रे मन! श्रीहरिवंश भजि, जो चाहत विश्राम।
          जिहिं रस-बस ब्रज ब्रजसुन्दरिनु, छाँड़ि दिये सुख धाम ॥
          निगम नीर मिलि इक भयौ, भजन दुग्ध सम स्वेत।
          श्रीहरिवंश-हंस न्यारौ कियौ, प्रगट जगत के हेत।।
          श्रीराधावल्लभ लाड़िली, अति उदार सुकुमारि ।
          ध्रुव तौ भूल्यौ ओर तें, तुम जिन देहु बिसारि ॥
          तुम जिन देहु बिसारि, ठौर मोकौं कहुँ नाहीं।
          प्रिय रंग भरी कटाक्ष, नैंक चितवहु मो माँहीं॥
          बढ़े प्रीति की रीति, बीच कछु होय न बाधा।
          तुम हौ परम प्रवीन, प्राणवल्लभ श्रीराधा॥
          बिसरिहौं न बिसारिहौ, यही दान मोहिं देहु।
          श्रीहरिवंश के लाड़िले, मोहिं अपनी करि लेहु॥
          कैसैंहु पापी क्यों न होइ, श्रीहरिवंश नाम जो लेइ ।
          अलक लड़ैती रीझिकें, महल खवासी देइ।
          महिमा तेरी कहा कहूँ, श्रीहरिवंश दयाल।
          तेरे द्वारें बँटत हैं, सहज लाड़िली-लाल॥
          सब अधमनि कौ भूप हौं, नाहिंन कछु समुझन्त।
          अधम-उधारन व्यास-सुत, यह सुनिकें हर्षन्त ॥
          बन्दौं श्रीहरिवंश के, चरन-कमल सुख-धाम।
          जिनकों वन्दत नित्य ही, छैल छबीलौ श्याम ॥
          श्रीहरिवंश स्वरूप कौं, मन-वच करौं प्रणाम।
          सदा - सदा तन पाइये, श्रीवृन्दावन धाम ॥
          जोरी श्रीहरिवंश की, श्रीहरिवंश स्वरूप।
          सेवकवाणी-कुंज में, बिहरत परम अनूप॥
          करुणानिधि अरु कृपानिधि, श्रीहरिवंश उदार।
          वृन्दावन रस कहन कौं, प्रगट धर्यौ अवतार ॥
          हित की यहाँ उपासना, हित के हैं हम दास।
          हित विशेष राखत रहौं, चित नित हित की आस ।।
          हरिवंशी हरि-अधर चढ़ि, गुंजत सदा अमन्द।
          दृग-चकोर प्यासे सदा, प्याय सुधा मकरन्द ॥
          जै जै श्रीहरिवंशहि गाय मन, भावै जस हरिवंश।
          हरिवंश बिना न निकासिहौं, पद निवास हरिवंश ॥

          दीजौ श्रीवृन्दावन वास, निरखूँ श्रीराधावल्लभलाल कौं।
          लड़ैति-लाल कौं।।
          यह जोरी मेरे जीवनप्राण, निरखूँ श्रीराधावल्लभलाल कौं। लड़ैती-लाल कौं।।
          मोर मुकुट पीताम्बर, एजी पीताम्बर, उर बैजन्ती माल।
          हाँजी सोहै गल फूलनि की माल ॥ निरखूँ... । लड़ैती.... ॥
          जमुना पुलिन वंशीवट, एजी वंशीवट, सेवाकुंज निज धाम॥
          हाँजी मंडल सेवा सुख धाम, हाँजी मानसरोवर बादग्राम ॥ निरखूँ... । लड़ैती.... ॥
          वंशी बजावै प्यारौ मोहना, बजावै प्यारौ मोहना, लै-लै राधा-राधा नाम, हाँजी लै लै श्यामा-श्यामा नाम, हाँजी लै लै प्यारी-प्यारी नाम ॥ निरखूँ... । लड़ैती.... ॥
          देखौ या ब्रज की रचना, श्रीवृन्दावन की रचना, नाचें जुगलकिशोर, हाँजी नाचैं नवल किशोर ।। निरखूँ... ।। लड़ैती... ॥
          चन्द्रसखी कौ प्यारौ, श्रीराधाजू कौ प्यारौ, सखियन कौ प्यारौ। बिरज रखवारौ, श्रीहरिवंश दुलारौ ।। दरशन दीजौ दीनानाथ, हाँजी दर्शन दीजौ हित लाल ॥ निरखूँ... । लड़ैती.... ॥
          यह जोरी मेरे जीवन प्रान, दीजौ श्रीवृन्दावन वास, निरखूँ श्रीराधावल्लभलाल कौं । लड़ैति-लाल कौं।।
  - pageNumber: 21
    pageDescription: 21. संध्या पश्चात् रास के पद
    content:
      - type: video
        videoId: "_enxaGC4wOw"
      - type: text
        value: |
          आजु गोपाल रास रस खेलत, पुलिन कल्पतरु तीर री सजनी।
          शरद विमल नभ चंद विराजत, रोचक त्रिविधि समीर री सजनी ॥
          चंपक बकुल मालती मुकुलित, मत्त मुदित पिक-कीर री सजनी।
          देसी सुधंग राग-रंग नीकौ, ब्रज-जुवतिनि की भीर री सजनी ॥
          मघवा मुदित निसान बजायौ, व्रत छाँड्यौ मुनि धीर री सजनी।
          जै श्रीहित हरिवंश मगन मन श्यामा, हरत मदन घन पीर री सजनी ॥
      - type: video
        videoId: "DwJC4nIJL3U"      
      - type: text
        value: |
          श्याम सँग राधिका रास मंडल बनी।
          बीच नँदलाल ब्रजवाल चंपक वरन,
          ज्यौंव घन तड़ित बिच कनक मरकत मनी।।
          लेत गति मान तत्त थेई हस्तक भेद,
          स रे ग म प ध नि ये सप्त सुर नादिनी।
          निर्त रस पहिर पट नील प्रगटित छबी,
          वदन जनु जलद में मकर की चाँदिनी।।
          राग रागिनि तान मान संगीत मत,
          थकित राकेश नभ सरद की जामिनी।
          (जै श्री) हित हरिवंश प्रभु हंस कटि केहरी,
          दूरि कृत मदन मद मत्त गज गामिनी।।
  - pageNumber: 22
    pageDescription: 22. शयन भोग
    content:
      - type: text
        value: |
          लाड़िली-लाल राजत रुचिर कुंज में।
          अरगजा अंग रँग-रंग बागे बने,दोउ जन प्रेम सौं सने रस-पुंज में॥
          निर्तत ठाढ़ी अलीं भलीं गति भेद सौं, रैंन पहिलौ जाम एक अलि गुंज में।
          पर्यौ  परदा धर्यौ  सैंन कौ भोग,पूरी भरि थार ब्रजलाल कर मंजु में॥
      - type: video
        videoId: "a5OndH8RSZ4"      
      - type: text
        value: |
          सैंन भोग ल्याईं भरि थारी।
          रुचिर कचौरी पूआ पूरी, मोहनभोग जैंवत पिय-प्यारी ॥
          धरे कटोरा भरे मुरब्बा, सरस सधाने वर तरकारी।
          औट्यौ दूध रजत भाजन भरि, ता मधि पीस सिता बहु डारी॥
      - type: video
        videoId: "vLLFPowd618"      
      - type: text
        value: |
          भोजन सैंन समय करवावत।
          लुचई मोहनभोग इमरती, मिश्री फैंनी दूध मिलावत।
          दृग कोरनि मधि हँसत परस्पर, रद छद परसत ललन खवावत।।     
      - type: text
        value: |
          राधा मोहनलाल ब्यारू कीजै।
          पूरी दूध मलाई मिश्री, पहिलौ कौर प्रियाजू कौं दीजै।
          जैंवत लाल-लड़ैती दोऊ, ललितादिक निरखत सुख भींजै ॥   
      - type: video
        videoId: "s8ujjluvESg"     
      - type: text
        value: |
          करत राधा-मोहन ब्यारू बैठे सदन मिलि सोहैं।
          इक थारी एकै जलझारी, एक वैस इक रूप उजारी।
          मधु मेवा पकवान मिठाई, दंपति अति रुचिकारी ॥
          प्यारी कें कर पावत प्यारौ, प्यारे कें कर पावत प्यारी।
          दूध सिराय लै आईं श्रीललिता, प्यारीजू पियौ लाल करै मनुहारी।।  
  - pageNumber: 23
    pageDescription: 23. दुग्धपान पद
    content:
      - type: text
        value: |
          हँसि-हँसि दूध पीवत बाल।
          मधुर वर सौंधे सुवासित, रुचिर परम रसाल ॥
          भुव भंग रंग अनंग वितरत, चितै मोहन ओर।
          सुधानिधि मनौं प्रेम धारा, पुषित त्रिषित चकोर ॥
          प्यारौलाल रस लंपट सुकर, अँचवाय मुख छबि हेर।
          लेत तब अबशेष आपुन, परे मनमथ फेर।।
          रीझि - रीझि सराहि स्वादहिं, दियौ निजसखि पान। 
          पाइ अद्भुत हरषि 'सुख सखि', निरखि वारत प्रान ॥
      - type: video
        videoId: "CfJGsgNZsPo"      
      - type: text
        value: |
          हँसि-हँसि दूध पिवत पिय प्यारी। 
          चन्दन वारि कनक चिरु औट्यौ, वारों कोटि सुधारी ॥ 
          मिश्री लोंग चिरौंजी एला, कपूर सुगन्ध सँवारी। 
          उज्ज्वल सरस सचिक्कन सुन्दर, स्वाद सुमिष्ट महारी ॥
          ललिता कर पट लीयै ठाढी, चित्रा लै जल-झारी।
          सब सखियनि कौं दई प्रसादी, 'लाल सखी' बलिहारी ॥     
      - type: text
        value: |
          आचमन
          दुलहिनी दूलह रसिक रस भरे पौंढ़न हेत । 
          वृन्दावन हित रूप सहचरी अँचवन बीरी देत ॥ 
  - pageNumber: 24
    pageDescription: 24. शयन आरती
    content:
      - type: video
        videoId: "sk20r6yZqrE"
      - type: text
        value: |
          रस निधि सैन आरती कीजै, निरखि-निरखि छबि जीवन जीजै ।
          मणि-नग जगमग जोति जगमगै, दम्पति रूप प्रकाश रँगमगै॥
          सहचरि चँवर मोरछल ढोरैं, पुहुप वृष्टि अंजुलि चहुँ ओरैं।
          झाँझ ताल झालरि, दुन्दुभि-रव, निर्त गान अलि हरति मनोभव॥
          महा मोद धुनि मधुर मृदंगा, जै-जै वानी मिलि इक संगा।
          यह सुख रसिक उपासिक गावैं, जै श्रीरूपलाल हित चित दुलरावैं॥
      - type: video
        videoId: "JV9E-s4Ra7g"      
      - type: text
        value: |
          जै जै श्रीराधेजू मैं शरण तिहारी, प्यारी शरण तिहारी।
          लोचन आरती जाऊँ बलिहारी।। जै जै हो राधे जू॥
          पाट पटम्बर ओढ़े नील सारी,सीस के सैंदुर जाऊँ बलिहारी । जै जै हो राधे जू॥ 
          रतन (फूल) सिंहासन बैठौ श्रीराधे,आरति करें हम पिय संग जोरी। जै जै हो राधे जू॥
          झलमल झलमल मानिक मोती, अवलख मुनि मोहे पिय संग जोरी | जै जै हो राधे जू॥
          श्रीराधे पद पंकज भगति की आशा। दास मनोहर करत भरोसा ।। जै जै हो राधे जू॥ ।।   
  - pageNumber: 25
    pageDescription: 25. शयन
    content:
      - type: text
        value: |
          लड़ैतीजू के नैननि नींद घुरी ।
          आलस बस जोवन बस मद बस, पिय के अंस ढुरी ॥
          पिय कर परस्यौ सहज चिवुक वर, बाँकी भौंह मुरी ।
          बावरी सखी हित व्याससुवन बल, देखत लतनि दुरि ॥
      - type: video
        videoId: "nvNflery6hk"      
      - type: text
        value: |
          चाँपत चरण मोहनलाल ।
          परजंक पौढ़ी कुँवरि राधा नागरी नव-बाल ॥
          लेत कर धरि परसि नैंननि, हरषि लावत भाल ।
          लाइ राखत हृदै सौं तब गनत भाग विसाल ॥
          देखि पियकी अधीनता भई कृपासिंधु दयाल ।
          व्यासस्वामिनी लिये भुज भरि, अति प्रवीन कृपाल ॥
      - type: video
        videoId: "DZ4aaUzV22o"      
      - type: text
        value: |
          आजु वन क्रीडत श्यामा श्याम ।
          सुभग बनी निशि शरद चाँदनी, रुचिर कुंज अभिराम ॥
          खंडन अधर करत परिरम्भन, ऐंचत जघन दुकूल ।
          उर नख - पात तिरीछी चितवन, दंपति रस समतूल ॥
          वे भुज पीन पयोधर परसत, वाम दृशा पिय हार ।
          बसनन पीक अलक आकर्षत, समर श्रमित सत मार ॥
          पल - पल प्रबल चौंप रस लंपट, अति सुंदर सुकुमार ।
          (जैश्री) हित हरिवंश आजु तृन टूटत, हौं बलि विशद विहार ॥

          ॥  श्री अष्टयाम सेवा पद्धति की जै जै श्रीहित हरिवंश ॥