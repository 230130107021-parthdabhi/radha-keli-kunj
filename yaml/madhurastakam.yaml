- verseNumber: ""
  verseText: | 
    अधरं मधुरं वदनं मधुरं नयनं मधुरं हसितं मधुरं ।
    हृदयं मधुरं गमनं मधुरं मधुराधिपते रखिलं मधुरं ॥1॥

    व्याख्या - आपके अधर (होंठ) मधुर हैं, आपका मुख मधुर है, आपके नेत्र मधुर हैं, आपकी मुस्कान मधुर है, आपका हृदय मधुर है और आपकी गति भी अति मधुर है, मधुराधिपति हे श्रीकृष्ण! आपका सब कुछ मधुर है। 

    वचनं मधुरं चरितं मधुरं वसनं मधुरं वलितं मधुरं ।
    चलितं मधुरं भ्रमितं मधुरं मधुराधिपते रखिलं मधुरं ॥2॥

    व्याख्या - आपकी वाणी मधुर है, आपका चरित्र मधुर है, आपके वस्त्र मधुर हैं, आपकी अंगभंगी मधुर है, आपकी चाल मधुर है और आपका भ्रमण भी अति मधुर है, मधुराधिपति हे श्रीकृष्ण! आपका सब कुछ मधुर है। 

    वेणुर्मधुरो रेणुर्मधुरः पाणिर्मधुरः पादौ मधुरौ ।
    नृत्यं मधुरं सख्यं मधुरं मधुराधिपते रखिलं मधुरं ॥3॥

    व्याख्या - आपकी वेणु (बांसुरी) मधुर है, आपकी चरणरज मधुर है, आपके करकमल मधुर हैं, आपके चरण मधुर हैं, आपका नृत्य मधुर है और आपका सख्य भी अति मधुर है, मधुराधिपति हे श्रीकृष्ण! आपका सब कुछ मधुर है। 

    गीतं मधुरं पीतं मधुरं भुक्तं मधुरं सुप्तं मधुरं ।
    रूपं मधुरं तिलकं मधुरं मधुराधिपते रखिलं मधुरं ॥4॥

    व्याख्या - आपका गान मधुर है, आपका पान मधुर है, आपका भोजन मधुर है, आपका शयन मधुर है, आपका रूप मधुर है और आपका तिलक भी अति मधुर है, मधुराधिपति हे श्रीकृष्ण! आपका सब कुछ मधुर है।

    करणं मधुरं तरणं मधुरं हरणं मधुरं रमणं मधुरं ।
    वमितं मधुरं शमितं मधुरं मधुराधिपते रखिलं मधुरं ॥5॥

    व्याख्या - आपका कार्य करना मधुर है, आपका तारना (भव से पार करना) मधुर है, आपका हरण करना मधुर है, आपका रमण करना मधुर है, आपके उद्गार मधुर हैं और आपकी शांति भी अति मधुर है, मधुराधिपति हे श्रीकृष्ण! आपका सब कुछ मधुर है।

    गुञ्जा मधुरा माला मधुरा यमुना मधुरा वीची मधुरा ।
    सलिलं मधुरं कमलं मधुरं मधुराधिपते रखिलं मधुरं ॥6॥

    व्याख्या - आपकी गुंजा मधुर है, आपकी माला मधुर है, आपकी यमुना मधुर है, उसकी तरंगें मधुर हैं, उसका जल मधुर है और (श्रीयमुना जी में खिले) कमल भी अति मधुर हैं, मधुराधिपति हे श्रीकृष्ण! आपका सब कुछ मधुर है।

    गोपी मधुरा लीला मधुरा युक्तं मधुरं मुक्तं मधुरं।
    दृष्टं मधुरं सृष्टं मधुरं मधुराधिपते रखिलं मधुरं ॥7॥

    व्याख्या - आपकी गोपियाँ मधुर हैं, आपकी लीला मधुर है, आपका संयोग मधुर है, आपका वियोग मधुर है, आपका निरीक्षण मधुर है और आपका शिष्टाचार भी अति मधुर है, मधुराधिपति हे श्रीकृष्ण! आपका सब कुछ मधुर है। 

    गोपा मधुरा गावो मधुरा यष्टिर्मधुरा सृष्टिर्मधुरा ।
    दलितं मधुरं फलितं मधुरं मधुराधिपते रखिलं मधुरं ॥8॥

    व्याख्या - आपके गोप मधुर हैं, आपकी गौएँ मधुर हैं, आपकी लकुट मधुर है, आपकी रचना (सृष्टि करना) मधुर है, आपका दलन (विनाश करना) मधुर है और आपका वर देना भी अति मधुर है, मधुराधिपति हे श्रीकृष्ण! आपका सब कुछ मधुर है।