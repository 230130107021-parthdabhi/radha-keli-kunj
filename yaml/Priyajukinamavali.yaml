- verseNumber: "श्रीप्रियाजू की नामावली"
  verseText: |
    श्री राधे । नित्य किशोरी । वृन्दावन बिहारिनी । वनराज रानी। 
    निकुंजेश्वरी । रूप रँगीली। छबीली। रसीली। रस नागरी । 
    लाड़िली । प्यारी । सुकुँवारी । रसिकनी। मोहिनी । लाल- 
    मुखजोहिनी । मोहन-मन-मोहिनी । रति-विलास विनोदिनी। 
    लाल-लाड़-लड़ावनी। रंग केलि बढ़ावनी। सुरत-चंदन- 
    चर्चिनी । कोटि दामिनी दमकनी। लाल पर लटकनी। नवल 
    नासा - चटकनी। रस पुंजे वृंदावन प्रकाशिनी। रंग-विहार- 
    विलासिनी। सखी-सुख निवासिनी। सौन्दर्य रासिनी । 
    दुलहिनी। मृदु हासिनी। प्रीतम नैन-निवासिनी । नित्यानन्द- 
    बरसिनी। उरजनि पिय-परसिनी । अधर-सुधारस बरसिनी ।
    प्राणनि रस - सरसनी। रंग-बिहारिनी। नेह-निहारिनी। 
    पिय-हित-सिंगार-सिंगारिनी। प्यार सौं प्यारे को लै उर 
    धारिनी। मोहन- मैंन-विथा निरवारिनी। जान प्रवीन। उदार 
    सँभारनी। अनुराग सिंधे। स्यामा। बामा । भामा । भाँवती । 
    जुवतिन-जूथ-तिलका । वृंदावन -चंद्र-चंद्रिका । हास- 
    परिहास-रसिका । नवरंगिनी । अलकावलि-छवि-फंदिनी। 
    मोहन मुसिकन मंदिनी। सहज आनन्द कंदिनी। नेह- कुरंगिनी । 
    नैंन विशाला। महामधुर रस-कंदिनी। चंचल चित्त आकर्षिनी । 
    मदन-मान- खंडिनी। प्रेम-रंग-रंगिनी । बंक कटाक्षिनी । सकल
    विद्या-विचक्षिनी। कुँवर अंक विराजनी। प्यार-पट
    निवाजिनी। सुरत- समर-दल-साजिनी। मृगनैंनी । पिकबैंनी 
    सलज्ज अंचला । सहज चंचला । कोक कलानि- कुशला । 
    हाव-भाव चपला । चातुर्य चतुरा। माधुर्य मधुरा । बिनु भूषन 
    भूषिता । अवधि सौन्दर्यता । प्राण-वल्लभा । रसिक-रमनी। 
    कामिनी । भामिनी। हंस कल-गामिनी। घनश्याम अभिरामिनी । 
    चंद-विपिनी। मदन दवनी । रसिक-रवनी। केली कमनी। 
    चित्तहरनी। ललन- उर पर चरन धरनी । छवि कंज-बदनी। 
    रसिक आनंदिनी। रूप-मंजरी । सौभाग्य- रसभरी। सर्वांग 
    सुन्दरी । गौरांगी। रतिरस रंगी। विचित्र कोक कला अंगी । 
    छवि-चंद-वदनी । रसिक लाल बंदिनी। रसिक रस-रंगिनी । 
    सखिनु सभा मंडिनी। आनंद-कंदिनी । चतुर अरु भोरी । 
    सकल सुख - रासि सदने।

    प्रेम सिंधु के रतन ये, अद्भुत कुंवरि के नाम । 
    जाकी रसना रटै 'ध्रुव' सो पावै विश्राम ॥ 
    ललित नाम नामावली, जाके उर झलकंत। 
    ताके हिय में बसत रहैं, स्यामा स्यामल कंत ॥

    ललित रंगीली गाइये। तातें प्रेम रंग रस पाइये ॥ 
    राधा गोरी मोहिनी, नवल किशोरी भाँम । 
    नित्य विहारिनी लाड़िली, अलबेली वर वाम ॥ 
    स्यामा प्यारी भांवती, नागरि परम उदार । 
    वृंदाविपिन विनोदिनी कुंजनि-मनि सुकुंवारि ॥ 
    मृगनैंनी गजगामिनी, पिकबैंनी नव बाल । 
    अति सुंदर मृदु हासिनी, चंचल नैंन विसाल ॥ 
    कुंज - कामिनी भामिनी, छबि- दामिनी अनूप । 
    पिय-हिय-मोद - प्रकासनी, चंद वदनि रस रूप ॥ 
    रसिक रंगीली रंगभरी रही लाल उर-पूरि । 
    पियहि लड़ावनि सुख लड़ी, प्रीतम जीवन मूरि ॥ 
    मनहरनी सुठि सोहनी नवल छबीली भाँति । 
    वृंदावन जगमगि रह्यौ अंगनि की छवि काँति ॥ 
    कुंज बिलासिनि दुलहिनी, आनंद रूप निधान । 
    सखियनि-मोद बढ़ावनी, पिय प्राननि के प्रान ॥ 
    'हित ध्रुव' यह नामावली, जो करि है उर-माल । 
    ताके हियै दिनहिं बसैं, नेही मोहन लाल ॥