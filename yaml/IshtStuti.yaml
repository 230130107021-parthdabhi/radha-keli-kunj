- verseNumber: "इष्ट स्तुति"
  verseText: |
    चन्द्र मिटै दिनकर मिटै, मिटै त्रिगुन विस्तार । 
    दृढ़ व्रत श्रीहरिवंश कौ, मिटै न नित्य विहार ॥ 
    जोरी जुगल किशोर की, और रची विधि बादि । 
    दृढ़ व्रत श्रीहरिवंश कौ, निबह्यौ आदि युगादि ॥ 
    निगम ब्रह्म परसत नहीं, जो रस सबतैं दूरि । 
    कियौ प्रगट हरिवंश जू, रसिकन जीवन मूरि ॥ 
    रूप बेलि प्यारी बनी, (सु) प्रीतम प्रेम तमाल ॥

    दोउ मन मिलि एकै भये, श्रीराधावल्लभलाल ॥ 
    निकसि कुंज ठाड़े भये, भुजा परस्पर अंश । 
    श्रीराधावल्लभ-मुख कमल, निरखि नयन हरिवंश ॥ 
    रे मन! श्रीहरिवंश भजि, जो चाहत विश्राम । 
    जिहिं रस-बस ब्रज सुन्दरिनु, छोड़ि दिये सुख धाम ॥ 
    निगम नीर मिलि इक भयौ, भजन दुग्ध सम स्वेत । 
    हरिवंश हंस न्यारौ कियौ, प्रगट जगत के हेत ॥
    श्रीराधावल्लभ लाड़िली, अति उदार सुकुमारि ।
    ध्रुव तौ भूल्यौ ओर ते, तुम जिन देहु बिसारि ॥
    तुम जिन देहु बिसारि ठौर मोकौं कहुँ नाहीं ।
    पिय रंग भरी कटाक्ष, नैंकु चितवहु मो माँहीं ॥
    बढ़े प्रीति की रीति, बीच कछु होय न बाधा ।
    तुम हौ परम प्रवीन, प्राणवल्लभ श्रीराधा ॥
    बिसरिर्हो न बिसारिहौ, यही दान मोहिं देहु ।
    श्रीहरिवंश के लाड़िले, मोहिं अपनी करि लेहु ॥
    कैसेंहु पापी क्यौं न होइ, श्रीहरिवंश नाम जो लेइ ।
    अलक लड़ती रीझिकैं, महल खवासी देइ ॥
    महिमा तेरी कहा कहूँ, श्रीहरिवंश दयाल ।
    तेरे द्वारें बँटत हैं, सहज लाड़िली - लाल ॥
    सब अधमन कौ भूप हौं, नाहिन कछु समुझन्त । 
    अधम उधारन व्यास सुत, यह सुनिकैं हर्षन्त ॥
    बन्दौं श्रीहरिवंश के, चरन-कमल सुख-धाम । 
    जिनकौं वन्दत नित्य ही, छैल छबीलौ श्याम ॥
    श्रीहरिवंश स्वरूप कौं, मन वच करौं प्रणाम ।
    सदा - सदा तन पाइये, श्रीवृन्दावन धाम ॥
    जोरी श्रीहरिवंश की, श्रीहरिवंश स्वरूप । 
    सेवकवाणी कुंज में, विहरत परम अनूप ॥
    करुणानिधि अरु कृपानिधि, श्रीहरिवंश उदार ।
    वृन्दावन रस कहन कौं, प्रगट धर्यौ अवतार ॥
    हित की यहाँ उपासना, हित के हैं हम दास । 
    हित विशेष राखत रहौं, चित नित हित की आस ॥
    हरिवंशी हरि-अधर चढ़ि, गुंजत सदा अमन्द ।
    दृग चकोर प्यासे सदा, प्याय सुधा मकरन्द ॥
    श्रीहरिवंशहि गाय मन, भावै जस हरिवंश ।
    हरिवंश बिना न निकासिहौं, पद निवास हरिवंश ॥
    दीजौ श्रीवृन्दावन वास, निरखूँ श्रीराधावल्लभलाल कौं, 
    लड़ैती-लाल कौं ॥ 
    यह जोरी मेरे जीवन प्राण, निरखूँ श्रीराधावल्लभलाल कौं, 
    लड़ैती - लाल कौं ॥
    मोर मुकुट पीताम्बर, एजी पीताम्बर, उर बैजन्ती माल, 
    हाँजी सोहै गल फूलनि की माल ॥ निरखूँ श्रीराधावल्लभलाल कौं, 
    लड़ैती - लाल कौं ॥
    जमुना पुलिन वंशीवट, एजी वंशीवट, सेवाकुञ्ज निज धाम, 
    हाँजी मंडल सेवा सुख धाम, हाँजी मानसरोवर बादग्राम ॥
    निरखूँ श्रीराधावल्लभलाल कौं, 
    लड़ैती - लाल कौं ॥
    वंशी बजावै प्यारौ मोहना, बजावै प्यारौ मोहना, 
    लै-लै राधा-राधा नाम, हाँजी लै लै श्यामा-श्यामा नाम, 
    हाँजी लै लै प्यारी-प्यारी नाम ॥ 
    निरखूँ श्रीराधावल्लभलाल कौं, 
    लड़ैती - लाल कौं ॥
    देखो या ब्रज की रचना, श्रीवृन्दावन की रचना, 
    नाचैं जुगलकिशोर, हाँजी नाचैं नवलकिशोर ॥
    निरखूँ श्रीराधावल्लभलाल कौं, 
    लड़ैती - लाल कौं ॥
    चन्द्रसखी कौ प्यारौ, श्रीराधाजू कौ प्यारौ, सखियन को प्यारौ
    बिरज रखबारौ, श्रीहरिवंश दुलारौ । 
    दरसन दीजौ दीनानाथ, हाँजी दर्शन दीजौ हित लाल ॥
    निरखूँ श्रीराधावल्लभलाल कौं, 
    लड़ैती - लाल कौं ॥
    यह जोरी मेरे जीवन प्रान, निरखूँ श्रीराधावल्लभलाल कौं, 
    लड़ैती - लाल कौं, दीजौ श्रीवृन्दावन वास ॥
    निरखूँ श्रीराधावल्लभलाल कौं, 
    लड़ैती - लाल कौं ॥