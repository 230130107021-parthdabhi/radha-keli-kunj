- verseNumber: 1
  verseText: |
    राग कान्हरौ
    माई री सहज जोरी प्रगट भई
    जु रंग की गौर स्याम घन दामिनि जैसें।
    प्रथमहूँ हुती अबहूँ आगे हूँ रहिहै न टरिहै तैसें॥
    अंग अंग की उजराई सुघराई चतुराई सुंदरता ऐसें।
    श्रीहरिदास के स्वामी स्यामा कुंजबिहारी सम वैस वैसें ॥1॥

- verseNumber: 2
  verseText: |
    राग कान्हरौ
    रुचि के प्रकास परस्पर खेलन लागे।
    राग रागिनी अलौकिक उपजत नृत्य संगीत अलग लाग लागे॥
    राग ही में रंग रह्यौ रंग के समुद्र में दोऊ झागे ।
    श्रीहरिदास के स्वामी स्यामा कुंजबिहारी
    पै रंग रह्यौ रस ही में पागे।।

- verseNumber: 3
  verseText: |
    राग कान्हरौ
    ऐसेई देखत रहौं जनम सुफल करि मानौं।
    प्यारे की भाँवती भाँवती के प्यारे जुगल किसोरहि जानौं॥
    छिनु न टरौ पल होहु न इत उत रहौ एक ही तानौं।
    श्रीहरिदास के स्वामी स्यामा कुंजबिहारी मन रानौं॥

- verseNumber: 4
  verseText: |
    राग कान्हरौ
    जोरी विचित्र बनाई री माई काहू मन के हरन कौं।
    चितवत दृष्टि टरत नहिं इत उत
    मन वच क्रम याही संग भरन कौं॥
    ज्यौं घन दामिनि संग रहत नित
    बिछुरत नाहिंन और वरन कौं।
    श्रीहरिदास के स्वामी स्यामा कुंजबिहारी न टरन कौं॥

- verseNumber: 5
  verseText: |
    राग कान्हरौ
    इत उत काहे कौं सिधारति मेरी आँखिन आगे ही तू आव।
    प्रीति कौ हित हौं तौ तेरौ जानौं ऐसौई राखि सुभाव॥
    अमृत से वचन जिय की प्रकृति सौं मिले ऐसौई दे दाव।
    श्रीहरिदास के स्वामी स्याम कहत री प्यारी 
    प्रीति कौ मंगल गाव॥

- verseNumber: 6
  verseText: |
    राग कान्हरौ
    प्यारी जू जैसे तेरी आँखिन में हौं अपनपौ 
    देखत हौं ऐसे तुम देखति हौं किधौं नाहीं।
    हौं तोसौं कहौं प्यारे आँखि मूँदि रहौं
    तौ लाल निकसि कहाँ जाहीं।
    मोकौं निकसिवे कौं ठौर बतावौ
    साँची कहौ बलि जाऊँ लागौं पाँहीं।
    श्रीहरिदास के स्वामी स्यामा तुमहिं
    देख्यौ चाहत और सुख लागत काहीं॥

- verseNumber: 7
  verseText: |
    राग कान्हरौ
    प्यारी तेरौ वदन अमृत की पंक तामें बींधें नैन द्वै।
    चित चल्यौ काढ़नि  कौं विकच संधि संपुट में रह्यौ भ्बै॥
    बहुत उपाइ आही री प्यारी पै न करत स्वै।
    श्रीहरिदास के स्वामी स्यामा कुञ्जबिहारी ऐसेई रहौ ह्वै।।

- verseNumber: 8
  verseText: |
    राग कान्हरौ
    आवत जात बजावत नूपुर।
    मेरौ तेरौ न्याव दई के आगे जो कछु करौ सो हमारे सिर ऊपर॥
    निपट निकट मवास ह्वै रही प्यारी पैंड दूपर।
    श्रीहरिदास के स्वामी स्यामा कुंजबिहारी
    विलसत निहचल धूपर।।

- verseNumber: 9
  verseText: |
    राग कान्हरौ
    दृष्टि चेंप वर फंदा मन पिंजरा राख्यौ लै पंछी बिहारी।
    चुनों सुभाव प्रेम जल अंग श्रवत
    पीवत न अघात रहे मुख निहारी॥
    प्यारी प्यारी रटत रहत छिन ही छिन याके और न 
    कछू हिया री।
    सुनि हरिदास पंछी नाना रंग देखत ही देखत प्यारी जू न हारी॥
    
- verseNumber: 10
  verseText: |
    राग कान्हरौ
    भूलै भूलै हूं मान न करि री प्यारी
    तेरी भौहैं मैली देखत प्रान न रहत तन ।
    ज्यौं न्यौछावर करौं प्यारी तोपै
    काहे तें तू मूकी कहत स्याम घन ॥
    तोहिं ऐसें देखत मोहिंब कल कैसे होइ जु प्रान धन।
    सुनि श्रीहरिदास काहे न कहत यासों छाँड़िब छाँड़ि अपनौ पन।

- verseNumber: 11
  verseText: |
    राग कान्हरौ
    वात तौ कहत कहि गई अब कठिन परी बिहारी।
    प्रान तौ नाहिंने तन अस्तविस्त भये कहै कहा प्यारी॥
    भाँवते की प्रकृति देखत जु श्रम भयौ बहुत हिया री।
    श्रीहरिदास के स्वामी स्याम बाह सौं बाहु
    मिलाय रहे मुख निहारी॥

- verseNumber: 12
  verseText: |
    राग कान्हरौ
    कुंजविहारी हौं तेरी बलाइ लेऊँ नीके हौं गावत।
    राग रागिनीन के जूथ उपजावत॥
    तैसीयै तैसी मिली जोरी प्रिया जू कौ मुख देखत चंद लजावत।
    श्रीहरिदास के स्वामी स्यामा कौ नृत्य देखत काहि न भावत॥

- verseNumber: 13
  verseText: |
    राग कान्हरौ 
    एक समै एकांत वन में करत सिंगार परस्पर दोई। 
    वे उनके वे उनके  प्रतिबिंबनि देखत रहत परस्पर भोई |
    जैसे नीके आजु बने ऐसे न बने
    आरसी सब झूठी परी कैसीयैब कोई ।
    श्रीहरिदास के स्वामी स्यामा कुंजबिहारी रीझि परस्पर प्रीति नोई॥

- verseNumber: 14
  verseText: |
    राग कान्हरौ
    राधे चलि री हरि बोलत कोकिला अलापत
    सुर देत पंछी राग बन्यौ।
    जहाँ मोर काछ बाँधे नृत्य करत
    मेघ मृदंग बजावत बंधान गन्यौ।।
    प्रकृति की कोऊ नाहीं यातें सुरति के
    उनमान गहि हौं आई मैं जन्यौ।
    श्रीहरिदास के स्वामी स्यामा कुंजबिहारी की
    अटपटी बानि औरै कहत कछु औरै भन्यौ।॥।

- verseNumber: 15
  verseText: |
    राग कान्हरौ
    तेरौ मग जोवत लाल बिहारी।
    तेरी समाधि अजहूँ नहीं छूटत चाहत नाहिंने नेंकु निहारी।।
    औचक आइ द्वै कर सो मूँदे नैन अरबराइ उठी चिहारी।
    श्रीहरिदास के स्वामी स्यामा ढूँढ़त वन में पाई प्रिया दिहारी॥

- verseNumber: 16
  verseText: |
    राग कान्हरौ
    मानि तूब चल री एक संग रह्यौ कीजै 
    तौ कीजै जो बिन देखै जीजै ।।
    ये स्याम घन तुम दामिनी प्रेम पुंज वरषा रस पीजै।
    श्रीहरिदास के स्वामी स्यामा कुंजबिहारी सौं
    हिलि मिलि रंग लीजै॥

- verseNumber: 17
  verseText: |
    राग कान्हरौ
    तू रिस छाँड़ि री राधे राधे।
    ज्यौं ज्यौं तोकौं गहर त्यौं त्यौं मोकौं विथा री साधे साधे॥
    प्राननि कौं पोषत है री तेरे वचन सुनियत आधे आधे।
    श्रीहरिदास के स्वामी स्यामा कुंजबिहारी तेरी प्रीति बाँधे बाँधे ॥

- verseNumber: 18
  verseText: |
    राग कान्हरौ
    आजु तृन टूटत है री ललित त्रिभंगी पर।
    चरन चरन पर मुरली अधर धरैं चितवनि बंक छबीली भू पर॥
    चलहु न वेगि राधिका पिय पै जो भयौ चाहत हौ सर्वोपर।
    श्रीहरिदास के स्वामी कौ समयौ अब नीको बन्यौ 
    हिलि मिलि केलि अटल रति भई धू पर॥

- verseNumber: 19
  verseText: |
    राग कान्हरौ
    दिन डफ ताल बजावत गावत 
    भरत परस्पर छिन छिन होरी।
    अति सुकुमार वदन श्रम वरसत भलै मिलै 
    रसिक किसोर किसोरी॥
    वातनि बतबतात राग रंग रमि रह्यौ 
    इत उत चाहि चलत तकि खोरी।
    सुनि हरिदास तमाल स्याम सौं 
    लता लपटि कंचन की थोरी ।।

- verseNumber: 20
  verseText: |
    राग कान्हरौ
    द्वै लर मोतिन की एक पुंजा पोति कौ सादा
    नेत्रनि दृष्टि लागौ जिनि मेरी ।
    हाथनि चारि चारि चूरी पाँइनि इकसार चूरा 
    चौपहलू इकटक रहे हरि हेरी ।।
    एक मरगजी सारी तन तें कंचुकी न्यारी
    अरु अँचरा की बाँई गति मोरि उरसनि फेरी।
    श्रीहरिदास के स्वामी स्यामा कुंजबिहारी
    या रस ही बस भये हरैं हरैं सरकनि नेरी॥

- verseNumber: 21
  verseText: |
    राग कान्हरौ
    जोवन रंग रंगीली सोने से गात ढरारे नैना कंठ पोति मखतूली।
    अंग अंग अनंग झलकत सोहत काननि बीरें
    सोभा देत देखत ही बनें जौन्ह में जौन्ह सी फूली॥
    तनसुख सारी लाही अँगिया अतलस अतरौटा छबि
    चारि चारि चूरी पहुँचनि पहुँची खमकि बनी
    नकफूल जेब  मुख बीरा चौका कौंधे संभ्रम भूली।
    ऐसी नित्य बिहारिनि श्रीबिहारीलाल संग अति आधीन
    आतुर लटपटात ज्यौं तरु तमाल कुंजमहल
    हरिदासी जोरी सुरति हिंडोरे झूली।।

- verseNumber: 22
  verseText: |
    राग कान्हरौ
    राधे दुलारी मान तजि।
    प्रान पायौ जात है री मेरौ सजि॥
    अपनौ हाथ मेरे माथे धरि अभै दान दै अजि।
    श्रीहरिदास के स्वामी स्याम कहत री प्यारी
    रंग रुचि सौं बलि लजि॥

- verseNumber: 23
  verseText: |
    राग कान्हरौ
    गुन की बात राधे तेरे आगे को जानें
    जो जानें सो कछु उनहारि।
    नृत्य गीत ताल भेदनि के विभेद जानें
    कहूँ जिते किते देखे झारि॥
    तत्त्व सुद्ध स्वरूप रेख परमान
    जे विज्ञ सुघर ते पचे भारि।
    श्रीहरिदास के स्वामी स्यामा कुंजबिहारी नैंक
    तुम्हारी प्रकृति के अंग अंग और गुनी परे हारि॥

- verseNumber: 24
  verseText: |
    राग कान्हरौ
    सुघर भये हो बिहारी याही छाँह तें। 
    जे जे सुघर सुर जानपन्यौं की ते ते याही बाँह तें।।
    हुते तौ अधिक बढ़े सब ही तें
    पै इनकी कस न खटात याह तें।
    श्रीहरिदास के स्वामी स्यामा कुंजबिहारी 
    ज़कि रहे चाह तें।

- verseNumber: 25
  verseText: |
    राग कान्हरौ
    राधा रसिक कुंजबिहारी कहत जु हौं
    न कहूँ गयौ सुनि सुनि राधे तेरी सौं ।
    मोहिं न पत्याहु तो संग हरिदासी हुती 
    बूझि देखि भटू कहि धौं कहा भयौ मेरी सौं॥।
    प्यारी तोहिं गठोंद न प्रतीति छाँड़ि छिया
    जानि दै इतनीब एरी सौं।
    गहि लपटाइ रहे छैल दोऊ
    छाती सौं छाती लगाइ फेरा फेरी सौं।।

- verseNumber: 26
  verseText: |
    राग कान्हरौ
    प्यारी तेरी महिमा वरनी न जाय
    जिहिं आलस काम बस कीन।
    ताकौं दंड हमैं लागत है री भए आधीन॥
    साढ़े ग्यारह ज्यौं औटि दूजे नवसत साजि सहज ही
    तामें जवादि कर्पूर कस्तूरी कुमकुम के रंग भीन।
    श्रीहरिदास के स्वामी स्यामा कुंजबिहारी
    रस बस करि लीन॥

- verseNumber: 27
  verseText: |
    राग कान्हरौ
    श्रम जल कन नाहीं होत मोती माला कौ देहु।
    देखे बहुत अमोल मोल नहीं 
    तन मन धन न्यौछावर लेहु।।
    रति विपरीत प्रीति कौ आलस 
    नाहीं नायक तेरे मधि एहु।
    श्रीहरिदास के स्वामी स्यामा कुंजबिहारी
    प्रीति वर मिलए वेहु॥

- verseNumber: 28
  verseText: |
    राग कान्हरौ
    नील लाल गौर के ध्यान बैठे श्रीकुंजबिहारी।
    ज्यौं ज्यौं सुख पावत नाहीं त्यौं त्यौं दुख भयौ भारी॥
    अरबराइ प्रगट भई जु सुख भयौ बहुत हिया री।
    श्रीहरिदास के स्वामी स्यामा कुंजबिहारी करि मनुहारी॥

- verseNumber: 29
  verseText: |
    राग कान्हरौ
    आजु की बानिक प्यारे तेरी प्यारी तुम्हारी
    वरनी न जाइ छबि।
    इनकी स्यामता तुम्हारी गौरता
    जैसे सित असित बेनी रही भुवंगम ज्यौं दबि॥
    इनकौ पीताम्बर तुम्हारी नील निचोल
    ज्यौं ससि कुंदन जेब रवि।
    श्रीहरिदास के स्वामी स्यामा कुंजबिहारी की
    सोभा वरनी न जाय जो मिलैं रसिक कोटि कवि ।।

- verseNumber: 30
  verseText: |
    राग कान्हरौ 
    देखि देखि फूल भई।
    प्रेम के प्रकास प्रीति के आगे ह्वै जु लई॥
    सुनि री सखी बागौ बन्यौ आजु
    तुम पर तृन टूटत है जु नई।
    श्रीहरिदास के स्वामी स्यामा कुंजबिहारी
    सकल गुन निपुन ताताथेई ताथेई गति जु ठई ।।

- verseNumber: 31
  verseText: |
    राग केदारौ
    ऐसी तौ विचित्र जोरी बनी।
    ऐसी कहूँ देखी सुनी न भनी।।
    मनहुँ कनक सुदाह करि करि देह अद्भुत ठनी।
    श्रीहरिदास के स्वामी स्याम तमालै उछंगि बैठी धनी॥

- verseNumber: 32
  verseText: |
    राग केदारौ
    हँसत खेलत बोलत मिलत देखौ मेरी आँखिन सुख।
    बीरी परस्पर लेत खवावत ज्यौं घन दामिनि
    चमचमात सोभा बहु भाँतिन सुख ।।
    श्रुति घुरि राग केदारौ जम्यौ 
    अधराति निसा रोम रोम सुख ।
    श्रीहरिदास के स्वामी स्यामा कुंजबिहारी
    के मिलि गावत सुर देत मोर भयौ परम सुख ।।

- verseNumber: 33
  verseText: |
    राग केदारौ
    अद्भुत गति उपजति अति नृत्तत
    दोऊ मंडल कुँवर किसोरी ।
    सकल सुधंग अंग भरि भोरी पिय नृत्तत
    मुसिकनि मुख मोरी परिरंभन रस रोरी ॥
    ताल धरैं बनिता मृदंग चंद्रागति घात बजै थोरी थोरी ।
    सप्त भाइ भाषा विचित्र ललिता गाइनि चित चोरी ॥
    श्रीवृन्दावन फूलनि फूल्यौ ससि 
    त्रिविध पवन बहै थोरी थोरी ।
    गति विलास रस हास परस्पर भूतल अद्भुत जोरी ॥
    श्रीजमुनाजल विथकित पुहुपनि वरषा |
    रतिपति डारत त्रिन तोरी।
    श्रीहरिदास के स्वामी स्यामा कुंजबिहारी 
    कौ रस रसना कहै कोरी ॥

- verseNumber: 34
  verseText: |
    राग केदारौ
    प्यारी जू जब जब देखौं तेरौ मुख
    तब तब नयौ नयौ लागत ।
    ऐसौ भ्रम होत मैं कबहुँ देखी न री
    दुति कौं दुति लेखनी न कागत ॥
    कोटि चंद तैं कहाँ री दुराये नये नये रागत ।
    श्रीहरिदास के स्वामी स्याम कहत काम की सांति
    न होइ न होइ त्रिपति रहौं निसि दिन जागत ॥

- verseNumber: 35
  verseText: |
    राग  केदारौ 
    ऐसी जिय होत जो जिय सौं जिय मिलै
    तन सौं तन समाइ लैहुँ तौ देखौं कहा हो प्यारी ।
    तोही सौं हिलग आँखैं आँखिन सौं मिली रहैं
    जीवत कौ यहै लहा हो प्यारी ।।
    मोकौं इतौ साज कहाँ री हौं अति दीन तुब बस
    भुव छेप जाइ न सहा हो प्यारी ।
    श्रीहरिदास के स्वामी स्याम कहत राखि लै री 
    बाहु बल हौं बपुरा काम दहा हो प्यारी ॥

- verseNumber: 36
  verseText: |
    राग केदारौ
    आजु रहसि में देखियत प्यारी जू
    एक बोल माँगौं जो लिखि देहु ।
    साखी तेरे नैन दसन कच कुच
    कटि नितंब जो लिखि देहु ।।
    प्रीति द्रव्य रुचि ब्याज परस्पर
    मन वच क्रम करि जो लिखि देहु ।
    श्रीहरिदास के स्वामी स्यामा प्यारी पै 
    बोल बुलाय लियौ लिखि देहु ।।

- verseNumber: 37
  verseText: |
    राग केदारौ
    प्यारी तेरी बाँफिन बान सुमार लागै भौहै ज्यौं धनख ।
    एक ही बार यौ छूटत जैसे बादर वरषत इन्द्र अनख ॥
    और हथियार को गने री चाहनि कनख ।
    श्रीहरिदास के स्वामी स्यामा कुंजबिहारी सौं 
    प्यारी जब तू बोलति चनख चनख ।

- verseNumber: 38
  verseText: |
    राग केदारौ
    काहे तें आजु अटपटे से हरि ।
    लटपटी पाग अटपटे से बंद अटपटी देत आगें सरि ॥
    अटपटे पाँइ परत मै परखे जब आवत हे इत ढरि ।
    श्रीहरिदास के स्वामी स्याम जानि हौं पाये
    आजु लाल औरै परि ॥

- verseNumber: 39
  verseText: |
    राग केदारौ
    काहे कौं मान करत मोहिंब कत दुख देति ।
    बासे कीसी दृष्टि लियें रहौं तेरी जीवन तोहिं समेति ॥
    अब कछु ऐसी करौं जु भोंहनि टाटी
    जिनि देहु कहत इति नेति ।
    श्रीहरिदास के स्वामी स्यामा कुंजबिहारी
    छल कैं गरैं लगाइ भई रमेति ॥

- verseNumber: 40
  verseText: |
    राग केदारौ 
    रोम रोम जो रसना होती तऊ तेरे गुन न बखाने जात ।
    कहा कहौं एक जीभ सखी री बात की बात बात ॥
    भानु श्रमित और ससि हू श्रमित भये और जुवति जात ।
    श्रीहरिदास के स्वामी स्याम कहत री प्यारी
    तू राखति प्रान जात ।।

- verseNumber: 41
  verseText: |
    राग केदारौ 
    तुव जस कोटि ब्रह्मांड विराजै राधे  ।
    श्री सोभा वरनी न जाय अगाधे।
    बहुतक जनम विचारत ही गये साधे साधे।
    श्रीहरिदास के स्वामी स्याम कहत री प्यारी
    ए दिन मैं क्रम क्रम करि लाधे ।।

- verseNumber: 42
  verseText: |
    राग केदारौ 
    फूलीं सब सखी देखि देखि।
    जच्छ किन्नर नागलोक देव स्त्रीं
    रीझि रहीं भुव लेखि लेखि ।।
    कहत परस्पर नारि नारि सौं 
    यह सुन्दर्यता अवरेखि रेखि ।
    श्रीहरिदास के स्वामी स्यामा ए कैसे हूँ 
    चितयैं परेखि रेखि।।

- verseNumber: 43
  verseText: |
    राग केदारौ 
    पिय सौं तू जोई जोई करै सोई छाजै।
    और सेंघ करै जो तेरी सोई लाजै ।।
    तू सुर ज्ञान सब अंग सखी री मान करत बेकाजै ।
    श्रीहरिदास के स्वामी स्याम जिय में बसै 
    तू नित नित विराजै ॥

- verseNumber: 44
  verseText: |
    राग केदारौ
    सोई तो वचन मोसौं मानि 
    तैं मेरी लाल मोह्यौ री साँवरौ ।
    नव निकुंज सुख पुंज महल में सुबस बसौ यह गाँवरौ ॥
    नव नव लाड़ लड़ाइ लाड़िली 
    नहिं नहिं यह ब्रज जाँवरौ ।
    श्रीहरिदास के स्वामी स्यामा ए कुंजबिहारी पै 
    वारौंगी मालती भाँवरौ ॥

- verseNumber: 45
  verseText: |
    राग केदारौ
    जो कछु कहत लाडिलौ लाड़िली जू सुनियै कान दै ।
    जो जिय उपजै सो तिहारेई हित की कहत हौं आन दै ॥
    मोहिं न पत्याहु तौ छाती टकटोरि देखौ पान दै ।
    श्रीहरिदास के स्वामी स्यामा कुंजबिहारी जाचक कौं दान दै ॥

- verseNumber: 46
  verseText: |
    राग केदारौ
    प्यारी जू आगे चलि आगे चलि 
    गहवर वन भीतर जहाँ बोलै कोइल री ।
    अति ही विचित्र फूल पत्रनि की सेज्या रची
    रुचिर सँवारी तहाँ तूब सोइल री ॥
    छिन छिन पल पल तेरीऐ कहानी तुव मग जोइल री ।
    श्रीहरिदास के स्वामी स्याम कहत छबीलौ 
    काम रस भोइल री ॥

- verseNumber: 47
  verseText: |
    राग केदारौ 
    प्यारी अब सोइ गई ।
    ज्यौं ज्यौं जगावत त्यौं त्यौं नहिं जागत
    प्रेम रस पान करि भोइ गई ।।
    जागत होइ तौं जगाऊँ प्यारी तातेंब परम सचु 
    रस ही रसिक रस बोइ गई ।
    श्रीहरिदास के स्वामी स्यामा उठिकैं गरैं लगाई 
    नवल प्रीति सौं नोइ गई ।।

- verseNumber: 48
  verseText: |
    राग केदारौ
    डोल झूलत दुलहिनी दूलहु ।
    उड़त अबीर कुमकुमा छिरकत खेल परस्पर सूलहु ॥
    बाजत ताल रबाब और बहु तरनि तनया कूलहु ।
    श्रीहरिदास के स्वामी स्यामा कुंजबिहारी कौ 
    अनतब नाहिंने फूलहु ।।

- verseNumber: 49
  verseText: |
    राग केदारौ
    प्यारी पहिरें चूनरी ।
    तैसौई लहँगा बन्यौ सिलसिलौ
    पूरनमासी की सी पूनरी ।।
    हौं जु कहति चलिये मनमोहन मानैंगी नहिं घूनरी ।
    श्रीहरिदास के स्वामी स्यामा कुंजबिहारी 
    चरन लपटाने दुहूँन री ।।

- verseNumber: 50
  verseText: |
    राग केदारौ
    बनी री तेरे चारि चारि चूरी करनि ।
    कंठसिरी दुलरी हीरनि की नासा मुक्ता ढरनि ।।
    तैसौई नैननि कजरा फबि रह्यौ निरखि काम डरनि ।
    श्रीहरिदास के स्वामी स्यामा कुंजबिहारी 
    रीझि  रीझि  पग परनि ॥

- verseNumber: 51
  verseText: |
    राग केदारौ
    प्यारी अब क्यौं हूँ क्यौं हूँ आई है।
    इत तुम श्रमित अधिक मनमोहन
    मैं कोटि जतन समझाई है॥
    उत हठ करति बहुत नव नागरि तैसीये नई ठकुराई है।
    श्रीहरिदास के स्वामी स्याम कर जोरि मौन ह्वै
    दूबरे की राँधी खीर कहौ कौने खाई है॥

- verseNumber: 52
  verseText: |
    राग केदारौ
    सुनि धुनि मुरली वन बाजै हरि रास रच्यौ ।
    कुंज कुंज द्रुम बेलि प्रफुल्लित
    मंडल कंचन मनिन खच्यौ ।।
    नृत्तत जुगलकिसोर जुवति जन
    मन मिलि राग केदारौ मच्यौ ।
    श्रीहरिदास के स्वामी स्यामा कुंजबिहारी
    नीके री आजु प्यारौ लाल नच्यौ ॥ 

- verseNumber: 53
  verseText: |
    राग कल्यान
    जहाँ जहाँ चरन परत प्यारी जू तेरे 
    तहाँ तहाँ मन मेरी करत फिरत परछाहीं।
    बहुत मूरति मेरी चँवर ढुरावति
    कोऊ बीरी खवावति एकब आरसी लै जाहीं।॥
    और सेवा बहुत भाँतिन की जैसीयै कहैं कोऊ,
    तैसीयै करौं ज्यौं रुचि जानौं जाहीं
    श्रीहरिदास के स्वामी स्यामा कौं 
    भलै मनावत दाइ उपाहीं ॥

- verseNumber: 54
  verseText: |
    राग कल्यान
    यह कौन बात जु अबही और अबही और अबही औरे।
    देव नारि नाग नारि और नारि ते न होंइ और की औरै॥
    पाछैं न सुनी अब हूँ आगें हूँ न ह्वै है
    यह गति अद्भुत रूप की और की औरै।
    श्रीहरिदास के स्वामी स्यामा कुंजबिहारी
    या रस ही बस भये यह भई और की औरै॥

- verseNumber: 55
  verseText: |
    राग कल्यान
    माई ए वसीठ इनके ए इनके और धौं को परै बीच।
    हाथापाई करत जु श्रम भयौ अंग अरगजा की कीच॥।
    प्यारी जू के मुख अम्बुज को डहडहाट
    ऐसौ लागत ज्यौं अधरामृत की सींच।
    श्रीहरिदास के स्वामी स्यामा कुंजबिहारी के राग रंग
    लटपटानि के भेद न्यारे न्यारे जैसे पानी में पानी नरीच॥

- verseNumber: 56
  verseText: |
    राग कल्यान
    कस्तूरी कौ मर्दन अंग में कियें मुरली धरें
    पीताम्बर ओढ़ें कहति राधे हौं ही स्थाम।
    किसोर कुमकुम कौ सिंगार कियें
    सारी चुरी खुभी नेत्रनि दियें स्याम।।
    बाँह गहि लै चलै चलियै जू कुंज में
    चिते मुख हँसें मानौं एई स्याम।
    श्रीहरिदास के स्वामी स्याम 
    छाती सौं छाती लगायें गौर स्याम।।

- verseNumber: 57
  verseText: |
    राग कल्यान
    प्यारी तेरौ वदन चंद देखें
    मेरे हृदै सरोवर तें कमोदिनी फूली।
    मन के मनोरथ तरंग अपार सुन्दर्यता तहाँ गति भूली।॥।
    तेरी कोप ग्राह ग्रसें लियें जात छुड़ायौ न छूटत
    रह्यौ बुधि बल झूली।
    श्रीहरिदास के स्वामी स्यामा चरन बंसी सौं गहि
    काढ़ि रहे लटपटाइ गहि भुजमूली।।

- verseNumber: 58
  verseText: |
    राग कल्यान
    प्यारी तेरौ वदन कनक कौ कन श्रम जल कन सोभा देत री।
    तामें तिल दृष्टि परत ही मन हरि लेत री॥
    उर तन जाति पाति प्राननि कौ कटि सौं करि संकेत री।
    श्रीहरिदास की स्वामी स्यामा कुंजबिहारी कहत अचेत री॥

- verseNumber: 59
  verseText: |
    राग कल्यान
    वचन दै मान न करौं।
    कि मन वच क्रम तीन हुँ  तें न टरौं॥
    तेरेई कियें मान व्यापि होत तन कहि कैसे कै भरौं।
    श्रीहरिदास के स्वामी स्यामा कुंजबिहारी
    कहत री प्यारी कैसें कैं लरौं॥

- verseNumber: 60
  verseText: |
    राग कल्यान
    कुंजबिहारी नाचत नीके; लाडि़ली नचावति नीके।
    औघर ताल धरैं श्रीस्यामा ताताथेई
    ताताथेई गावति संग पी के।।
    तांडव लास और अंग को गनें जे जे रुचि उपजति जी के।
    श्री हरिदास के स्वामी स्यामा कौ मेरु 
    सरस भयौ और रस गुनी परे फीके।।

- verseNumber: 61
  verseText: |
    राग कल्यान
    डोलत झूलत बिहारी बिहारिनि राग रमि रहोौ।
    काहू के हाथ अधोटी काहू के वीन काहू के मृदंग
    कोऊ गहैं तार काहू कें अरगजा छिरकत रंग रह्यौ॥
    डॉंड़ीं छाड़ें खेल बढ़्यौ जु परस्पर
    नहिं जानियत पग क्यौं रह्यौ।
    श्रीहरिदास के स्वामी स्यामा कुंजबिहारी कौ
    खेल खेलत काहू न लह्यौ॥

- verseNumber: 62
  verseText: |
    राग कल्यान 
    हमारौ दान मार्यौ इनि; रातिनि बेचि बेचि जात। घेरौ सखा जानि ज्यौं न पावैं छियौ जिनि।। 
    देखौ हरि के ऊज उठाइवे की बात राति विराति बहू बेटी काहू की निकसति है पुनि। 
    श्रीहरिदास के स्वामी की प्रकृति न फिरी छिया छाँड़ौ किनि ।।

- verseNumber: 63
  verseText: |
    राग कल्यान 
    गुन रूप भरी विधिना सँवारी
    दुहूँ कर कंकन एक एक सोहै। 
    छूटे बार गरें पोति दिपति मुख की जोति 
    देखि देखि रीझे तोहिं प्रानपति नैन सलौनी मन मोहै।। 
    सब सखीं निरखि थकित भईं आली 
    ज्यौं ज्यौं प्रानप्यारौ तेरौ मुख जोहै। 
    रस बस करि लीने श्रीहरिदास के स्वामी स्यामा तेरी उपमा कौं कहिधौं को है।।

- verseNumber: 64
  verseText: |
    राग कल्यान
    अजहूँ कहा कहति है री मारै नैन आरनि।
    भौहैं ज्यौं धनुष चितवनि बान बॉंफिन
    फोंक धरें कहत स्याम प्यारनि॥।
    तू ही जीवन तू ही भूषन तू ही प्रान धन यारनि।
    श्रीहरिदास के स्वामी स्यामा कुंजबिहारी सौं 
    मेरु भयो बिहारनि॥

- verseNumber: 65
  verseText: |
    राग सारंग 
    प्यारी तू गुननि राइ सिरमौर।
    गति में गति उपजति नाना राग रागिनी
    तार मंदर सुर घोर।।
    काहू कछू लियौ रेख छाया तौ कहा भयौ झूठी दौर।
    कहिं श्रीहरिदास लेत प्यारी जू के
    तिरप लागनि में किसोर।।

- verseNumber: 66
  verseText: |
    राग सारंग
    प्यारी तोपै कितौक संग्रह छबिन कौ
    अंग अंग प्रति नाना भाइ दिखावति।
    हाथ किन्नरी मध्य सचु पाँइ सुलप
    राग रागिनी सौं तू मिलि गावति।।
    कहा कहौं एक जीभ गुन अगनित
    हारि पर्यौ कछु कहत न आवति।
    श्रीहरिदास के स्वामी स्यामकहत री प्यारी
    तू जे जे भाइ ल्यावति।।

- verseNumber: 67
  verseText: |
    राग सारंग
    परस्पर राग जम्यौ समेत किन्नरी मृदंग सुर तार।
    तीन हूँ सुरनि के तान बंधान धुर धुरपद अपार।।
    विरस लेत धीरज न रह्यौ 
    तिरप लाग डाट सुर मोरनि सार।
    श्रीहरिदास के स्वामी स्यामा जे जे अंग की
    गति लेत अति निपुन अंग अंग अहार।।

- verseNumber: 68
  verseText: |
    राग सारंग
    तोकौं पिय बोलत हैं री लाल ठाढ़े कदंब तर।
    अबकैं ऐसौ ज्यौ कियें कहा होत है री
    मारि रही कुसुम सर।।
    कुंजबिहारी अपनौ अंस तासौं क्‍यौं कीजै छदम बर।
    श्रीहरिदास के स्वामी स्यामा ढूंढ़त वन में पाई
    क्रम क्रम विषम डर॥

- verseNumber: 69
  verseText: |
    राग सारंग
    चलिये छबीली छबीलौ बोलत।
    आजु की बानिक पर तृन टूटत है
    कही न जाय कछु स्याम तोहिं रत॥
    सखी लै चली मनाय ज्यौं हित की आई घत।
    श्रीहरिदास के स्वामी स्यामा बीच ही आइ मिलै
    तन की सुबास सकल भँवर कलमत ।।

- verseNumber: 70
  verseText: |
    राग सारंग
    बेनी गूँथि कहा कोऊ जानें मेरी सी तेरी सौं । 
    विच विच फूल सेत पीत राते को करि सकै एरी सौं॥
    बैठे रसिक सॅंवारनि बारनि कोमल कर ककही सौं।
    श्रीहरिदास के स्वामी स्यामा नखसिख लौं बनाई
    दै काजर नख ही सौं ।।

- verseNumber: 71
  verseText: |
    राग सारंग
    प्यारी तेरी पुतरी काजर हू तें कारी
    मानौं द्वै भँवर उड़े री बराबरि।
    चंपे की डार बैठे कुंद अलि लागी है जेब अराअरि॥
    जब आनि घेरत कटक काम कौ तब जिय होत डराडरि।
    श्रीहरिदास के स्वामी स्यामा कुंजबिहारी
    दोऊ मिलि लरत झराझरि।।

- verseNumber: 72
  verseText: |
    राग सारंग
    स्यामकिसोर जू तुम कौं दोऊ रंग रंगित पीतांबर चूनरी।
    ऐसौ रूप कहाँ तुम पायौ अहरनिस सोच उधेर बूनरी॥
    मनमोहन सुर ज्ञान सिरोमनि
    सब अंगनि अंग कोक निपून री।
    श्रीहरिदास के स्वामी स्यामा तुम्हारी विचित्रताई
    प्रेम सौं पाइयत रस सूनरी॥

- verseNumber: 73
  verseText: |
    राग सारंग
    चौकी कहाँ बदलि परी हो प्यारे हरि।
    लाल पाट की हुती जंगाली ल्याए वरि॥
    वह तौ हुती हीरनि खचित पै यह दुरंग पन्ना
    लालहि मिलि लैहौं लरि।
    श्रीहरिदास के स्वामी स्यामा कुंजबिहारी
    की चतुराई रही भरि॥

- verseNumber: 74
  verseText: |
    राग सारंग
    आऔ लाल ऐसे मद पीजै तेरौ झगा मेरी अँगिया धरि।
    कुच की सुराही नैननि के प्याले
    दारू द्यौंगी यौं अंकौं भरि॥
    अधरनि चुवाइ लेउ सब रस
    तनिकौ न जानि देउ इत उत ढरि।
    श्रीहरिदास के स्वामी स्यामा कुंजबिहारी की
    सुहबति असर जहाँ आपुन हरि॥

- verseNumber: 75
  verseText: |
    राग सारंग
    डोल झूलत बिहारी बिहारिनि पुहुप वृष्टि होति।
    सुर पुर पुर गंधर्व और पुर
    तिनकी नारि देखति वारति लर मोति॥
    घेरा करति परस्पर सब मिलि
    कहूँ न देखी ऐसी जुवती जोति।
    श्रीहरिदास के स्वामी स्यामा कुंजबिहारिनि
    सादा चुरी खुभी पोति॥

- verseNumber: 76
  verseText: |
    राग विभास
    प्यारी जू बोलति नाहीं कै तू सूता उनींदी
    किधौं काहू कछु कह्यौ कै तेरौ ऐसौई सुभाव।
    मोहिं तेरे देखे बिनु कल न परै कै तू छाँड़ि कुभाव॥
    काहू की झुकि हमैं देत री उपजत दुभाव।
    श्रीहरिदास के स्वामी स्याम कहत
    ताके बस परे प्रगटत जु भाव॥

- verseNumber: 77
  verseText: |
    राग विभास
    आलस भीजे री नैन जँभाति आछी भाँति सुदेस।
    कर सौं कर टेकि अँगुरिन पेंच मानौं
    ससि मंडल बैठ्यो अति भाँति सुदेस।॥।
    मन के हरिवे कौं और सुख नाहिंने कोऊ
    प्यारी नख सिख भाँति सुदेस।
    श्रीहरिदास के स्वामी स्याम
    छाती सों छाती लगायें अंग अंग सुदेस।।

- verseNumber: 78
  verseText: |
    राग विभास
    प्यारी जू एक बात कौ मोहिं डर आवत है री
    मति कबहूँ  कुमया करि जाति।
    पल पल हित वंछत हौं री मति परे भाँति॥
    यह सचु ऐसेई रहौ री जिनि टरौ तेरी घाति।
    श्रीहरिदास के स्वामी स्याम कहत यौं बाढ़ौ
    ज्यौं पुरइनि जल की रीति तोहिं लौं सांति॥

- verseNumber: 79
  verseText: |
    राग विभास
    प्यारी जू हम तुम दोऊ एक कुंज के सखा रूसें क्यौं बनें।
    इहाँ न कोऊ हितू मेरौ न तेरौ जो यह पीर जनें।।
    हौं तेरौ वसीठ तू मेरौ और न बीच बनें ।
    श्रीहरिदास के स्वामी स्यामा कुंजबिहारी कहत प्रीति पनें॥

- verseNumber: 80
  verseText: |
    राग विभास
    चूनरी में जाड़ौ लागत है री कीजिये सुख सैन।
    घरी घरी कै रूसने पहर मनावत जात मीठे मीठे बैन।।
    उठि सदकें बलाइ लेऊॅं
    प्रकृति यौं न चाहियै चाहियै ज्यौं मैन।
    श्रीहरिदास के स्वामी स्यामा कुंजबिहारी
    गहि लपटाइ रहे मानि सबै सुख चैन।।

- verseNumber: 81
  verseText: |
    राग विभास
    दुहुँनि की सहज बिसाँति दोऊ मिलि सतरंज खेलत।
    उर रुख नैन चपल अस्व चतुर बराबरि झेलत।।
    आतुरता फील पयादे निग्रह
    फरजी चौंप अनूपम पेलत।
    श्रीहरिदास के स्वामी स्यामा कुंजबिहारी
    सह साह राखें खेलत।।

- verseNumber: 82
  verseText: |
    राग विभास
    होड परी मोरनि अरु स्यामहिं। 
    आवहु मिलहु मध्य सचु की गति लैहिं रंग धौं कामहिं॥
    हमारे तुम्हारे मध्यस्थ राधे और जाहि बदौ
    बूझि देखौ तृन दै कहा है यामहिं।
    श्रीहरिदास के स्वामी कौ चौपरि कौ सौ खेल
    इकगुन दुगुन त्रिगुन चतुरागुन री जाके नामहिं॥

- verseNumber: 83
  verseText: |
    राग विभास 
    कहौ यह काकी बेटी कहाधौं कुँवरि कौ नाँउ ।
    तुम सब रहौ री हौं ही उतर दैहौं 
    चले किनि जाहु ढोटा बाइ बावरौ गाँउ।।
    सब सखी मिलि छिरका खेलन लागीं 
    तोलौं तुम रहो री जोलौं हौं न्हॉंउ।
    श्रीहरिदास के स्वामी स्यामा कुंजबिहारी
    लै बुड़की गरैं लागि चौंकि परी कहाँ हौं जाँउ॥

- verseNumber: 84
  verseText: |
    राग विभास
    एक समै एकांत वन में डोल झूलत श्रीकुंजबिहारी।
    झोंटा देत परस्पर सब मिलि अबीर उड़ावत डारी॥
    कबहुँक वे उनके वे उनके हौं दुदुँनि की एक सारी।
    श्रीहरिदास के स्वामी स्यामा कुंजबिहारी
    बाढ़्यौ रंग भारी।।

- verseNumber: 85
  verseText: |
    राग विभास
    कुंज कुंज डोलनि मूदु बोलनि
    टूटी लर छूटी पोति अति छबि लागति।
    भँवर गुंजार करत संग डोलत  
    मानौं मेरु रागिनी के संग लीयें रागति।।
    जूथ अनेक सुघर जुवतिन के,
    तुम्हरी रीझि पलब नहिं लागति।
    श्रीहरिदास के स्वामी स्यामा कुंजबिहारी पर
    तन मन धन न्यौछावर करौं कागति॥

- verseNumber: 86
  verseText: |
    राग बिलावल
    प्रिया पिय के उठिवे की छबि
    वरनी न जाइ सब तें न्यारे।
    मानौं द्यौस रैनि इक ठौरे सोये न भये न्यारे॥
    बार लटपटे मानों भॅंवर जूथ लरत परस्पर
    कमल दलनि पर खंजरीट सोभा न्यारे।
    श्रीहरिदास के स्वामी स्यामा कुंजबिहारी पर
    कोटि कोटि अनंग कोटि ब्रह्मांड वारि किये न्यारे।।

- verseNumber: 87
  verseText: |
    राग बिलावल
    स्यामा स्याम आवत कुंजमहल तें रगमगे रगमगे।
    मगरजी वनमाल सिथिल कटि किंकिनी
    अरुन नैन चारों जाम जगे॥।
    सब सखीं सुघराई गावति बीन बजावति
    सब सुख मिलि संगीत पगे।
    श्रीहरिदास के स्वामी स्यामा कुंजबिहारी की
    कटाक्ष सौं कोटि काम दगे।।

- verseNumber: 88
  verseText: |
    राग मलार
    हिंडोरेंब झूलत लाल दिन दूलहु
    दुलहिनि बिहारिनि देखौ री ललना।
    गौर स्याम छबि अति दुति बहु भाँति री बलना॥
    नीलांबर पीतांबर अंचल चलत धुजा फरहराति कलना।
    श्रीहरिदास के स्वामी स्यामा कुंजबिहारी
    बिहारिनि अविचलना।।

- verseNumber: 89
  verseText: |
    राग मलार
    ऐसी रितु सदा सर्वदा जो रहै बोलत मोरनि।
    नीके बादर नीके धनुष चहुँ दिसि नीकौ श्रीवृन्दावन
    आछी नीकी मेघनि की घोरनि॥
    आछी नीकी भूमि हरी हरी आछी नीकी
    बूढ़नि की रेंगनि काम किरोरनि।
    श्रीहरिदास के स्वामी स्यामा के मिलि गावत
    राग मलार जम्यौ री किसोर किसोरनि॥

- verseNumber: 90
  verseText: |
    राग मलार
    आये दिन पावस के सचु के सुबोल बोलिये जू मान न करिहों।
    घरी घरी के रूसने क्यौं बनें ते बोल बोलिये जू मन क्रम वच के।।
    भयौ है बंधान बहुत जतननि करि बिसरे गुन गस के।
    श्रीहरिदास के स्वामी स्यामा कुंजबिहारी प्यारी बस के॥

- verseNumber: 91
  verseText: |
    राग मलार
    यह अचरज देख्यौ न सुन्यौ कहूँ नवीन मेघ संग बिजुरी एक रस।
    तामें मौज उठति अधिक बहु भाँति लस॥
    मन के देखिवे कौं और सुख नाहिंने चितवत चितहिं करत बस।
    श्रीहरिदास के स्वामी स्यामा कुंजबिहारी बिहारिनि जू कौ पवित्र जस॥

- verseNumber: 92
  verseText: |
    राग मलार
    बूँदें सुहावनी री लागति मति भींजै तेरी चूनरी।
    मोहिं दे उतारि धरि राखौं बगल में तू न री॥
    लागि लपटाइ रहैं छाती सौं छातीजो न आवबे तोहिं बौछार की फूनरी।
    श्रीहरिदास के स्वामी स्याम कहत बिजुरी कौंधे करि हाँ हूँ न री॥

- verseNumber: 93
  verseText: |
    राग मलार
    भीजन लागे री दोऊ जन।
    अँचरा की ओट करत दोऊ जन॥
    अति उन्मत्त रहत निसि वासर राग ही के रंग रंगे दोऊ जन ।
    श्रीहरिदास के स्वामी स्याम प्रेम परस्पर  नृत्य करत दोऊ जन।।

- verseNumber: 94
  verseText: |
    राग मलार
    नदित मन मृदंगी रास भूमि सुकांति अभिनय सु नव गति त्रिभंगी।
    धापि राधा नटति ललिता रसवती नागरी गाइतेग्रि नाभि तान तुंगी।।
    रसद बिहारी बंदे वल्लभा राधिका निसि दिन रंग रंगी।
    श्रीहरिदास के स्वामी स्यामा कुंजबिहारी संगीत संगी।।

- verseNumber: 95
  verseText: |
    राग मलार
    दामिनि कहति मेघ सौं हमारी उपमा देहिं 
    ते झूठे एई मेघ एई बिजुरी साँची।
    जिन जिन हमारी उपमा दीनी तिन तिन की मति काँची॥
    ऐसी कहूँ सुनी जु दूँद तें कन न्यारौता पटतर क्यौं दीजै समुद्र राँची।
    श्रीहरिदास के स्वामी स्यामा कुंजबिहारी 
    अटल अटल प्रीति माँची॥

- verseNumber: 96
  verseText: |
    राग गौड़
    नाचत मोरनि संग स्याम मुदित स्यामाहि रिझावत।
    तैसीयै कोकिला अलापत पपीहा देत सुरतैसेई मेघ गरजि मृदंग बजावत॥
    तैसीयै स्याम घटा निसि सी कारी तैसीये दामिनी कौंधि दीप दिखावत ।
    श्रीहरिदास के स्वामी स्यामा कुंजबिहारी रीझि राधे हँसि कंठ लगावत।।

- verseNumber: 97
  verseText: |
    राग गौड़
    हरि के अंग कौ चंदन लपटानौ तन तेरे देखियत जैसे पीत चोली।
    मरगजे अभरन वदन छिपावति छिपै न छिपायें मानौं कृष्ण बोली।।
    कहुँ अंजन कहुँ अलक रही खसि सुरति रंग की पोटैं खोली।
    श्रीहरिदास के स्वामी स्यामा बिहारिनि मिलत हार न रह्यौ कंठ बिच ओली।।

- verseNumber: 98
  verseText: |
    राग बसंत
    कुच गडुवा जोवन मौर कंचुकी वसन ढॉंपि लै राख्यौ बसंत।
    गुन मंदिर रूप बगीचा में बैठी है मुख लसंत।।
    कोटि काम लावण्य बिहारी जाहि देखत सब दुख नसंत।
    ऐसे रसिक श्रीहरिदास के स्वामी तिनकौं भरन आई मिलि हसंत॥
    
- verseNumber: 99
  verseText: |    
    राग वसंत
    श्रीकुंजबिहारी कौ बसंत सखि चलहु न देखन जाहिं।
    नव वन नव निकुंज नव पल्लव नव जुवतिन मिलि माहिं॥
    वंसी सरस मधुर धुनि सुनियत फूली अंग न माहिं।
    सुनि हरिदास प्रेम सौं प्रेमहि छिरकत छैल छुवाहिं॥

- verseNumber: 100
  verseText: |
    राग वसंत
    चलि री भीर तें न्यारेई खेलैं।
    कुंज निकुंज मंजु में झेलैं॥
    जहाँ पंछी न सहित सखी न संग कोऊ तिहिं वन चलि मिलि केलैं।
    श्रीहरिदास के स्वामी स्यामा प्रेम परस्पर बूका बंदन मेलैं।।

- verseNumber: 101
  verseText: |
    राग वसंत
    अबकैं बसंत न्यारेई खेलैं काहू सौं मिलि खेलैं न री तेरी सौं।
    दुचिते भये कछू न सचु पाइयत
    तू काहू सखी सों मिलि न री मेरी सौं॥
    देखैगी जु रंग उपजैगौ परस्पर राग रागिनीन के फेराफेरी सौं।
    श्रीहरिदास के स्वामी स्यामा कुंजबिहारी राग ही में रंग उपजेगौ एरी सौं॥

- verseNumber: 102
  verseText: |
    राग वसंत
    रहौ रहौ बिहारी जू मेरी आँखिन में बूका मेलत(हौ) कित अंतर होत मुख अवलोकन कौ।
    और भाँवती तिहारी मिल्यौ चाहत मिस कैं पैयाँ लागौं पन पन कौ॥ 
    गावत खेलत जो सुख उपजत सु तो कोटि वर है तन कौ। 
    श्रीहरिदास के स्वामी कौ मिलत खेलत कौ सुखक हाँ पाइयत ऐसौ सुख मन कौ॥

- verseNumber: 103
  verseText: |
    राग गौरी
    सौंधे न्हाय बैठी पहिरि पट सुंदरि
    जहाँ फुलवारी तहाँ सुखवति अलकैं।
    कर नख सोभा कल केस सँवारति ।
    मानौं नव घन में उड़गन झलकैं।।
    विविध सिंगार लियै आगें ठाढ़ी प्रियसखी भयौ भरु आनि रतिपति दल दलकैं।
    श्रीहरिदास के स्वामी स्यामा कुंजबिहारी की छबि निरखत लागत नाहीं पलकैं॥

- verseNumber: 104
  verseText: |
    राग गौरी
    चलौ सखी कुंजबिहारी सौं चित दै मिलि देखैं उनकी भाँवती।
    सुंदर सौं सुंदरि मिलि खेलत कैसैं धौं गाँवती॥
    औचक आइ परी सखी तहाँ पिय पै पाँइ चँपाँवती।
    श्रीहरिदास के स्वामी स्याम सौं मिलि पौंढ़ी तन मन राँवती ।।

- verseNumber: 105
  verseText: |
    राग गौरी
    राधा रसिक कुंजबिहारी खेलत फाग सब जुवती जन कहत हो हो होरी।
    भरत परस्पर काहू की काहू न सुधि हँसिकैं मन हरत मोहन गोरी॥
    कर सौं करब जोरि कटि सौं कटिब मोरि करत नृत्य काहू न रुचि थोरी।
    श्रीहरिदास के स्वामी स्यामा फिरत न्यारेई न्यारे सब सखियनि की दृष्टि-बचावत तकि तब खोरी॥

- verseNumber: 106
  verseText: |
    राग गौरी
    नव निकुंज ग्रह नवल आगे नवल वीना मध्य राग गौरी ठटी।
    मनों दस इंदु पीयूष वरषत सुखद चपल करजावली दृष्टि पिय की जटी॥
    रीझि रीझि पिय देत भूषन वसन दास उर रसन दसननि धरत निरखि सारंग कटी।
    रसद श्रीहरिदास बिहारी अंग अंग मिलत अतन उदोत करत सुरति आरंभटी॥

- verseNumber: 107
  verseText: |
    राग गौरी
    झूलत डोल दोऊ जन ठाढ़े।
    हॉंगत जोर सहित जैसौ जाके डाँडींब गहैं गाढ़े।।
    बिच बिच प्रीति रहसि रस रीति की राग रागिनीन के जूथ बाढ़े।
    श्रीहरिदास के स्वामी स्यामा कुंजबिहारी राग ही के रंग रंगि काढ़े।।

- verseNumber: 108
  verseText: |
    राग गौरी 
    झूलत डोल श्रीकुंजबिहारी।
    दूसरी ओर रसिक राधावर नागरि नवल दुलारी॥
    राखे न रहत हँसत कहि कहि प्रिया
    बिलबिलात पिय भारी।
    श्रीहरिदास के स्वामी स्याम कहत री प्यारी अबकैं राखि हहा री।।

- verseNumber: 109
  verseText: |
    राग नट
    कौन प्रकृति तिहारी छिया तुमही मिलत बेगि भोर द्वै जात।
    अथवत निमेष होइ पह फाटी देखियत पहिली सह मात द्वै जात।।
    आवत जात भारौ परै पीतौ मरि जात।
    श्रीहरिदास के स्वामी तुम्हारे माथे तृन कितौक सुख जात॥

- verseNumber: 110
  verseText: |
    राग नट
    जुव कवनी वैस किसोर दोऊ निकसि ठाढ़े भए सघन वन तें।
    तन तन में बसत मन मन में लसत सोभा बाढ़ी दुहँ दिसि मानों प्रगट भई दामिनि घन घन तें।।
    मोहन गहर गंभीर वदत पिक वानी उपजत मानौं प्रिया के वचन तें।
    श्रीहरिदास के स्वामी स्यामा कुंजबिहारी ऐसौ को जासौं मन लागै अनतें।।

    दोहा-
    समै समै के पद कहे, अवस्था करहु विचारि।
    तब निरखौ मुख माधुरी, जे करत हैं बिहारि।।

    ॥ जै जै श्री स्वामी हरीदास जू कृत श्रीकेलिमाल जू की जै जै श्रीहित हरिवंश ॥
