- verseNumber: "1"
  verseIntro: "गो० श्रीहित हरिवंशचन्द्र महाप्रभुजी कृत - (बधाई) राग बिलावल"
  verseText: |
    आनन्द आजु नंद के द्वार। 
    दास अनन्य भजन रस कारन प्रगटे लाल मनोहर ग्वार ॥ 
    चंदन सकल धेनु तन मंडित कुसुम दाम रंजित आगार। 
    पूरन कुंभ बने तोरन पर बीच रुचिर पीपर की डार ॥ 
    जुवति जूथ मिलि गोप विराजत, बाजत पणव मृदंग सु तार। 
    जय श्री हित हरिवंश अजिर वर वीथिन, दधि मधि दूध हरद के खार ॥१॥

- verseNumber: "2"
  verseIntro: "गो० श्रीकमलनैंनजी कृत- राग बिलावल"
  verseText: |
    मंगल आज नंद के धाम । 
    अखिल लोकपति सुत है जनम्यौ हित करि नाम धरायौ स्याम ॥१॥ 

    सुरपुर नरपुर बाजे बाजें ब्रज में घर-घर घोष रसाल। 
    प्रगट्यौ पुन्य पूरबलौ जसुदा, गोद खिलावत मोहन लाल ॥२॥ 

    नंद आनंद भरे अति राजत, नृपकुल देखि लज्याहीं। 
    दानन देत सम्हारत नाहिंन, फूले मन-मन माहीं॥३॥ 

    ता पाछें इक बरनी कपिला, कुल पूज्य विप्रन दीनी। 
    बहुत दूध की एक वैस सब, सूधी निपट नवीनी ॥४॥ 

    द्वै लख धौर द्विजन कौं, दीनी और गनी नहिं जात। 
    रूप सुभाव सील गुन दाता, कामधेंनु सब गात ॥५॥ 

    द्विज बंदी जन सूत रु चारन, जै जै निगम उचारैं। 
    जसुदा सुख मुख देखि लाल कौ, मुक्त रतन मणि वारें ॥६॥ 

    आवत गोपी गोप रंग भीने, हाथन थार सुहाये। 
    मनु रतिपति इंदीवर, इंदुहि करि मनुहार मिलाये ॥७॥ 

    दधि घृत दूध हरद मधु केशर, छिरकत अति सुख पावैं। 
    हरषत बरषत पट भूषन अति, आनँद मोद बढ़ावै ॥८॥ 

    जन्म-कर्म हरि के सुखकारी, गावैं सुनें सु नीकौ। 
    जै श्री कमलनैन हित बसि वृन्दावन, लड़ावै जीवन जीकौ ॥९॥

- verseNumber: "3"
  verseIntro: "गो० श्रीकमलनैंनजी कृत- राग मारू"
  verseText: |
    आज ढ़ाँढ़ी ढाँढ़िनि रँग भीने। 
    दान मान कछुवै नहिं चाहत विधना मनोरथ कीने ॥ 

    नाचत गावत प्रेम बढ़ावत, पहिरैं वसन नवीने। 
    रीझि परस्पर भूषन वारत, चारन बंदी जन दीने॥ 

    देखत सोभा नर अरु नारी, सुरपति पतिनी अधीने। 
    धन्य-धन्य ये सब ब्रजवासी, नैनन पल नहिं लीने ॥ 

    नंद गाँव बरसानौं गावैं, ते कवि परम प्रवीने। 
    जै श्री कमलनैंन हित जे अरु बरनत, ते किये विधि मति हीने ॥३॥

- verseNumber: "4"
  verseIntro: "गो० श्री रूपलालजी कृत-राग मारू-दोहा (वंशावली वरनन )"
  verseText: |
    दोहा-
    बरन्यौ चाहत कछुक अब, कृष्ण चंद्र परिवार। 
    देहु बुद्धि मति सुद्ध अति, श्री हरिवंश उदार ॥१॥ 

    गन उद्देश जु दीपिका, मध्य कही कछु रीति। 
    जै श्री रूप लाल हित सौं लिखत, सुनहु रसिक दै प्रीति॥२॥

    बिमल अस ढाँढ़ी करत बखान, बधत बधाई नंदराइ गृह प्रगट भयौ सुख दान ॥ टेक ॥

    ढाँदिन संग समाज साज लै सिंघ पौरि में नाचै। 
    लै लै नाम गोपवंशन के, सात साख तें बाँचे। 
    आये सिमिट सबै नर-नारी, कहत देहु जो जाँचै। 
    मोहि चाउ जसुदा सुत निरखन बात यहै सुन साँचै ॥१॥

    दोहा-
    सिंह पौरि ब्रजराज की, बड़ी भीर भई आनि । 
    विविध भाँति सौं गोप कुल, ढाँढी कहत बखानि ॥३॥

    चौतुका - 
    तीन भाँति के गोप बसें ब्रज, तिनकी बात बखानौं। 
    उत्तम वैश्य धरम गौ रक्षा, करि विवेक पहिचानों ।। 
    तिनहूँ तें अहीर मध्यम गो, गाय भैंस धन धानौं। 
    ब्रज के छोर बसत जे गूजर इनहूँ तें घटि जानौं ।॥२॥

    दोहा-
    सुनत नंद उपनंद सब, बैठे सभा बनाइ। 
    बरन आदि तें गोप कुल, ढाँढी लियौ बुलाइ ॥४॥

    चौतुका- 
    बरनन करत गोप वंशन कौ, ढाँढ़ी मन हुलसाई। 
    देव मीढ़ जदुकुल नरेस की, कथा पुरातन गाई। 
    जजन दान व्रत छत्र धर्म सब, विधि सौं करत सदाई। 
    कुँवर कान्ह के परदादे, भये सोम वंश के राई॥

    दोहा-
    देवमीढ घर द्वै भई, पतिव्रता पटरानि। 
    इक कन्या छत्रीन की, एक वैश्य की जान ॥५॥

    चौतुका- 
    छत्री कन्या तें उपजे सुत, सूरसैन सुखदाता। 
    अति ब्रह्मण्य सील सुभ कर्मा, वेद अर्थ के ज्ञाता ।। 
    तिन तें श्री वसुदेव भाग की, कहत न आबै बाता। 
    नंदराय के मित्र पियारे, रचिपचि किये हैं विधाता ॥४॥

    दोहा-
    जादब कुल वसुदेव लौं, ढाँढी कह्यौ सुनाइ। 
    अब बरनौं कुल गोप कौ, ब्रजपति कौं सिर नाइ॥

    चौतुका- 
    वैश्य कन्यका तें जु भये, परजन्य धर्म आधारा। 
    नारद कौ उपदेश पाइ, लक्ष्मीपति भजे भुवारा० ॥ 
    नंदीश्वर पुर वास करत तप, संतति हेत विचारा। 
    भई अकास विमल वानी सुनि तन मन रही न सँभारा ॥५॥

    सोरठा- 
    बानी भई अकास, सुफल फलौ अभिलाष सब। 
    ब्रज कौ निहचल वास, पाँच पुत्र है हैं जु अब ॥७॥ 

    चौतुका- 
    पाँच पुत्र है हैं तुम्हरे, तिनमें अति नंद पियारौ। 
    ताकैं लाल प्रगट है ऐसौ, तीन भुवन उजियारौ ।। 
    यह सुनि हरषि भयौ मन में जु, महावन वास बिचास्यौ। 
    केशी के डर डरपि गाँव सब, जमुना पार उतास्यौ ॥६॥

    दोहा-
    पाँच पुत्र परजन्य के, राज करत ब्रज माहिं। 
    सात दीप के भूप जे, इन सम कहे न जाँहि ॥८॥

    चौतुका- 
    बड़ भैया उपनंद सबन तें, गौर सुभग अँग ताकौ। 
    हरित वसन तन लाँबी दाढ़ी, नौ लख गोधन जाकौ ।। 
    तुंगी त्रिया सुभग लक्षन जुत, जासौं हित जसुदा कौ। 
    लै-लै गोद निरखि मुख हरि कौ, धनि धनि बोलन बाकौ ॥७॥

    दोहा- 
    बड़भ्राता उपनंद जू, तिनकी संपति गाइ। 
    अब बरनौं अभिनंद कौं, भरे कृष्ण के भाइ ॥९॥

    चौतुका- 
    इक अभिनंद नंद तें, जेठे गौर बरन अँग सोहै। 
    भरे खरिक सत गाइ लक्ष दस, दान समान न कोहै ॥ 
    कृष्ण प्रेम सौं छक्यौ कहत यौं, बात नंद सुनि होहै। 
    तिहारे सुत तें या ब्रज में कछु, प्यारौ नाहिन मोहै ॥८॥

    दोहा-
    नंदन एक सुनंद इक, कका कृष्ण के गाइ। 
    रीझि-रीझि ब्रज ईश तब, दैहैं दान बुलाइ ॥१०॥

    चौतुका- 
    एक सुनंद नंद तें लहुरे, बहुत देह के भारे। 
    षोडस लख गोधन ताके, घर बकुला नाम त्रिया रे ।। 
    इनहूँ तें लहुरे नंदन इक, दोऊ कृष्ण कका रे। 
    सात लाख गोधन धन जाके, नंदहि बहुत पियारे ॥९॥

    दोहा-
    सानंदा अरु नंदिनी, बहिन नंद की जान। 
    अब स्वरूप श्रीनन्द कौ, कहौं सुनौं धरि ध्यान ॥११॥

    करषा- 
    ढाँढी गाइ नन्दराइ कौ ध्यान धरि कैं। 
    द्वार ताके परीं सिद्धि नव निद्धि सब, माँगि तापै जाहि दरिद्र टरि कैं ।॥१॥ 

    सुभ्र चंदन खौर अंग छबि जगमगत, सजल घन सम वसन तनहिं साजैं। 
    फबी सिर पाग सौभाग्य लोचन विशद, भाल पर तिलक केसर बिराजैं ।॥ २ ॥ 

    श्रवण मणि जलज की जोति झलकत लसत, सेत अरु स्याम दाढ़ी बिराजै। 
    बाहु आजानु बड़ दान दानेश कौ, देखि मुख सकल दुख दूर भाजै ॥३॥

    दोहा-
    सब गोपन कौ जस कहत, ढाँढी मन न अघाइ। 
    सब वैभव श्रीनंद कौ, बरनत रह्यौ लुभ्याइ ॥१२॥

    चौतुका- 
    सहस्त्र खरिक दस सहस्त्र ग्वाल पै, गैया जाँइ न बरनी। 
    कामधेनु पय श्रवत फिरत सब, स्वेत करी ब्रज धरनी ॥ 
    जमुना तीर नीर पीवत नित, सदा हरित तृन चरनी। 
    कृष्ण कमल कर फिरत पीठ पर, कहा करी इन करनी ॥१०॥ 

    दोहा- 
    ये गैयाँ नन्दराइ की, चरत रहत ब्रज माहिं।
    शिव विरंचि मन चिंतवत, पद रज परसत नाहिं ॥१३॥

    चौतुका- 
    इन गैयन के काज स्याम, भैस्वर्ज सबै बिसरायौ। 
    अमृत छाँड़ि गोलोक धाम तें, ब्रज कौ गोरस भायौ।। 
    मुनि मन ध्यान ग्यान पचि हारे, पार न क्योहूँ पायौ। 
    महाभाग बड़ भाग जसोमति, औसौ सुत जिन जायौ ॥११॥ 

    अद्भुत रूप निरखि नख सिख तें, थके नैंन मन हारौ। 
    कोटि चंद की जोति सार कौ, बन्यौ इंदु इक न्यारौ ॥ 
    चंचल नैन सरद अंबुज मनु, महा मनोहर प्यारौ। 
    नन्दराइ सुनि आइ भवन धन, बाँटत खोलि भंडारौ ॥१२॥ 

    तब रीझे ब्रज ईश नन्द जू, भवन भंडार लुटायौ। 
    रतन जटित टोडर मणि नूपुर, ढाँढी कौं पहिरायौ।। 
    लहरविडार दिये बहु गोपन, भयौ विदा घर आयौ। 
    जै श्रीरूपलाल हित नव किशोर कौं, गाइ-गाइ सुख पायौ ॥१३॥

- verseNumber: "5"
  verseIntro: "राग देव गंधार-"
  verseText: |
    नन्द सदन सुख रासि बधाई। 
    जसुमति कूख कमल तें प्रगट्यौ, सुंदर स्याम कन्हाई।। 

    गोपी-गोप ओप तन मन उर, आनन्द उसँग न माई। 
    सुर विमान कुसुमावलि वरषत, जय-जय वानी छाई ।। 

    उदित मुदित ब्रज चंद चकोरी, ब्रज बनिता उठि धाई। 
    जै श्री हितअलि रूप सिंधु सुख, बाढ्यौ नेम मैंड़ बिसराई ॥५॥

- verseNumber: "6"
  verseIntro: "राग रामकली-"
  verseText: |
    आजु ब्रज़ मंगल मोद भयौ। 
    जसुमति कूख कमल तें प्रगटे, मोहन जनम लयौ ॥ 
    जैसैं पूरन ससि प्राची दिसि, उड़गन जुत उदयौ। 
    आनन्द किरन प्रकाश तिमिर हर, त्रिभुवन ताप गयौ।। 
    सींचे प्रेम सुधा नर नारी, अमर विमान छयौ। 
    जै श्री रूपलाल हित ललित त्रिभंगी, रंगी रंग नयौ ॥६॥

- verseNumber: "7"
  verseIntro: "राग धनाश्री-"
  verseText: |
    ब्रज बनिता मिलि मंगल गावत, नन्द सदन में आईं। 
    रमा उमा रति सची सरस्वती, निरखत रहीं लुभाई ॥ 
    जसुमति कूख मल्हाइ गाइ गुन, आनन्द उर न समाई। 
    मुख सुख सुंदर स्याम बिलोकत, तन मन नैंन सिराई ॥ 
    धनि श्री कृष्ण जनम दिन मंगल, धनि जे करत सदाई। 
    जै श्री हित चित रूप विलोकि त्रिभंगी, उर अभिलाष पुजाई ॥७॥

- verseNumber: "8"
  verseIntro: "राग चैती गौरी-"
  verseText: |
    बधावौ नन्द राइ कैं, अहो हेली, प्रगट्यौ है ब्रज चंद ॥ टेक ॥ 

    अहो हेली सानन्दा औरु नन्दिनी, सुनि लारें गवावत आइ॥ 
    अहो हेली बाजे बहु विध बाजहीं रानी जसुमति कूख मल्हाइ ॥ बधावौ० ॥१॥ 

    अहो हेली मोतिनु चौक पुराइ कैं, संग लियें सकल ब्रज नारि ॥ 
    अहो हेली मेवा अरु तिल चाँवरी बाँटत भरि-भरि थार ॥ बधावौ० ॥२॥ 

    अहो भाभी मन भायौ हम लैंहिगी तब धरिहैं साथिये द्वार ।। 
    अहो बेटी चित चिंतत विधना किये धन्य घरी यह वार।। बधावौ ० ॥३॥ 

    अहो भाभी माँड़ि धरौं अब साथिये अरु खिचरी चरुवा गाइ ॥ 
    अहो बेटी भूषन नख सिख लीजियै अरु पहिर पटंबर आइ ॥ बधावौ० ॥४॥ 
    
    अहो भाभी लैंहुगी हाथन कौ मूँदरा अरु नौसर हार मँगाइ ॥ 
    औरु राइ चढ़न कौं घोरिला गजराज सहित मन भाइ ॥ बधावौ० ॥५॥ 
    
    अहो बेटी जो चहियै सो लीजियै विधि पूरे हैं चित चाइ ॥ 
    बेटी मेवा औरु तंबोल कौं देहु ऊखल' कोऊ न जाइ॥ बधावौ०॥६॥ 
    
    अहो भाभी धरे हैं हुलासन साथिये औरु गनि-गनि रोपीं हैं सींक। 
    औरु चीतौ नागर पान है गज मुकतन की करि लीक॥ बधावौ०॥७॥ 
    
    अहो बेटी देहु असीस सुहावनी प्रभु कीने वांछित आजु। 
    अहो भाभी चिरुजीवौ तेरौ लाड़िलौ सुख संपति सहित समाजु॥ बधावौ०॥८॥ 
    
    पहिराईं सकल सवासिनी वे तौ देत चलीं हैं असीस। 
    जै श्री रूपलाल हित हिय बसौ यह प्रगट्यौ है ब्रज ईस ॥ बधावौ० ॥९॥८॥

- verseNumber: "9"
  verseIntro: "गो॰ श्रीकिशोरीलालजी कृत- राग आसावरी ताल रूपक-"
  verseText: |
    मोहन जनमत माई, आजु बजत बधाई घोष नृपति घर। 
    जसुमति सब सुख फलन फली की, कहा कहौं भाग निकाई ॥ आजु०॥ टेक ॥१॥ 

    नहिं समतूल सची रति रंभा, पन्नग नाहिं कुँवारी। 
    कृष्ण जनम दिन ते मग गवनीं, किधौं विरंचि सँवारी ॥२॥ 

    बगर-बगर तें बनि-बनि बनिता, निकसी भाँति भली हैं। 
    नन्द सदन मनु रूप उदधि छबि, सरिता मिलन चली हैं॥३॥ 

    उर दूग आरति कूल विदारत, सुनि सुत जनम सिहानी। 
    रुकि गये पथिक अमंगल जग के, सुजस नीर सरसानी ॥४॥ 
    
    वारिज वदन अलक अलि नैनी, कटि तट शब्द मराला। 
    नौका नैन कटाक्ष सु खेवक, कौतिक सरिता बाला॥५॥ 
    
    मुख ससि जोति चंद्रिका मंदिर, अतिसै ओप भई है। 
    लखि हरि धन्य कहत सब जसुमति, कुल मणि दयौ दई है।॥६॥ 
    
    पुनि-पुनि पद वंदन करि गावत, निर्त्तत पुलकित हीयें। 
    हरि शिशु रूप तृषित दूग भरि-भरि, रहि-रहि सादर पीयें ॥७॥ 
    
    बलि हित रूप चरित गुन वारिध, क्रीड़त ब्रजजन माहीं। 
    जै श्री किशोरी लाल हित देव विमानन, जा सुख कौं पछताहीं॥८॥९॥

- verseNumber: "10"
  verseIntro: "गो॰ श्रीगोपीलालजी कृत-राग झंझोटी ताल मूल-"
  verseText: |
    नन्द महर घर आजु बधाईयाँ। 
    बड़ भागिनि जसुमति महारानी, जाकी कूख सिराईयाँ । 
    बजत मृदंग तँबूरा नौबत, मीठी धुंनि सहनाईयाँ। 
    गावत गुनी विरद पढ़ें बंदी, कुल कीरति मन भाईयाँ। 
    मगन भये नाचत नर नारी, दधि कादौं जु मचाईयाँ। 
    गोपी लाल हित रूप असीसत, जुग जुग रहौ ठकुराईयाँ ॥१०॥ 

- verseNumber: "11"
  verseIntro: "श्रीहित किशोरदासजी कृत-राग विलावल-सूहौ"
  verseText: |
    आज सखी ब्रजराज कें, आँगन दुन्दुभी बाजै। 
    ब्रज नारी सब गावहीं, देखत गोप समाजै ।। 

    सात सींक द्वारन धरीं, रतनन जटित सुहाई। 
    जसुमति कूख उदित भई बाजत विविध बधाई। 

    मोतिन चौक पुराइ कैं, बिप्र वेद धुनि कीनी। 
    अमर नगर तें बरषहीं, सुर वधू पुहुप नवीनी ॥ 

    भिक्षुक जन पूरन किये, मन वांछित निधि दीनी। 
    हित किशोर मुख निरखि कें, हरखि बलैया लीनी ॥११॥

- verseNumber: "12"
  verseIntro: "श्रीव्यासजी कृत-राग गौरी"
  verseText: |
    चलौ भैया हो नन्द महर, घर बाजत आजु बधाई। 
    जायौ पूत जसोदा रानी, गोकुल की निधि आई ॥ 

    कोऊ वन जिनि जाहु गाय लै, आवहु चित्र बनाई। 
    करौ कुलाहल नाचौ गावौ, हेरी दै-दै भाई॥ 

    छिरकत चोबा चंदन बंदन, हरदी दूब धराई। 
    माखन दूध दही की कादौं, भादों मास मचाई॥ 

    नाचत गोपी मंगल गावत, घर-घर तें सब आई। 
    विहँसित वदन नैंन तन पुलकित, उर आनँद न समाई ॥ 

    बाजत झाँझ मृदंग ताल डफ, बीना वैनु सुहाई। 
    जै जै धुनि बोलत डोलत पुनि, कुसुमावलि बरषाई ।। 

    परम उदार सकल ब्रजवासिन, घर-घर बात लुटाई। 
    जाचक धनी भये बड़ भागी, व्यास चरन रज पाई ॥१२॥

- verseNumber: "13"
  verseIntro: "राग सारंग-"
  verseText: |
    नन्द वृषभान के हम भाट । 
    उदौ भयौ ब्रजबल्लव कुल कौ, मेटि हमारी नाट॥ 
    भूषन वसन जु आज लुटावौ, अरु गाइन के ठाट। 
    इतौ देहु जो मोल लैंहिं हम, सब मथुरा की हाट॥ 
    इन्द्र कुबेर हमारे भायें, ब्रज के गूजर जाट। 
    बढ्यौ वंश हरिवंश व्यास कौ, वास चीर के घाट ॥१३॥

- verseNumber: "14"
  verseIntro: "श्रीदामोदर स्वामीजी कृत-राग आसावरी"
  verseText: |
    बाजत बधाई सुनि आईं जुरि-जुरि । 
    आँगन महरि कें नाचत मुरि-मुरि ॥ 
    सुत जनम्यौ सुनि हर्षे उर-उर। 
    दुन्दुभी बाजें सुनि धुनि पुर पुर॥ 
    घोष कुलाहल मंगल घर-घर। 
    फूले सब हिये आनन्द भरि-भरि ॥ 
    ब्रज रवनी सिंगार सु करि-करि। 
    आईं सब कर थारन धरि-धरि ॥ 
    फूलीं भूली सब शोभा दिखि-दिखि। 
    मानौं चित्र राखी हैं लिखि-लिखि॥ 
    गोप छबीले आये बनि-बनि। 
    बोलत सब यह वासर धनि-धनि।। 
    नन्द महा मन दै धन हँसि-हँसि। 
    पुत्र जनम आनन्द सर धसि-धसि। 
    मोद मगन मन आनँद घुरि-घुरि। 
    दामोदर हित गये दुख दुरि-दुरि ।।१४।॥

- verseNumber: "15"
  verseIntro: "राग सारंग-"
  verseText: |
    परम सुख भस्यौ मुदित ब्रजराज। 
    अखिल भुवन मणि सुत है जनम्यौ, बजत बधावौ आज॥ 
    भवन-भवन मानौं सुत जनमे, यौं फूले ब्रजवासी। 
    निधि-सिधि डोलत सदन सदन प्रति गोकुल, आनन्द रासी ।। 
    त्रिभुवन छबि मोहन नव गोरी, नवल किशोरी बाल। 
    मंगल वस्तु लियें कर थारन, देखन चलीं नन्दलाल॥ 
    फूलीं तन मन सब जुवती जन, निरख्यौ आनन्द कंद। 
    देत असीसें दामोदर हित, जय वृन्दावन चंद॥१५॥

- verseNumber: "16"
  verseIntro: "राग भैरौं -"
  verseText: |
    राजैं सब राजन मणि आज नन्दराइ जू। 
    सकल विभूति पति कोटि ब्रह्माण्डन पति, 
    संत गति सुत भयौ ताके गृह आइ जू॥१॥ 

    बाजत दुन्दुभी द्वार मधुर मृदंग तार, 
    किन्नरी सुभेरि बाजैं और सहनाइ जू॥ 
    नाचत मगन ग्वार आनन्द बढ्यौ अपार, 
    घोरत हरद दही घृत धाइ-धाइ जू॥२॥ 

    गावत मंगल नारि आभूषण देत वारि, 
    देखि प्यारौ मुख कोऊ घर हूँ न जाइ जू। 
    मची है मंगल भीर तजत न गोपी तीर, 
    नैंन प्रान रहे लाल रूप में समाइ जू॥३॥ 

    पढ़त हैं बिप्र वेद तन मन गयौ खेद, 
    बंदी जन मागद पढ़त भले भाइ जू। 
    सबकौ दरिद्र भाज्यौ जस तिहुँ लोक गाज्यौ, 
    फूले हैं मंगत सब मन भायौ पाइ जू॥४॥ 

    करैं बहु सनमान हरखि-हरखि दान, 
    सोभा कहा कहौं जब लाग्यौ दैन न्हाइ जू। 
    सौने सौं सींग मढ़ाइ ताँबे सौं पीठ बनाइ, 
    रूपे खुर छाइ दीनी दोइ लक्ष गाइ जू॥५॥ 

    सक्र लोक विधि लोक दूरि भयौ सब सोक, 
    गावत कीरति मन आनन्द बढ़ाई जू। 
    मनु-वच-क्रम नित जाँचत दामोदर हित, 
    दीजिये बधाई गाऊँ सुजस अघाइ जू॥६॥१६॥

- verseNumber: "17"
  verseIntro: "राग जै-जैवंती भैरौं -"
  verseText: |
    बाजत बधाई आजु द्वार नन्दराइ कैं। 
    नेति जाकों कहें छंद ऐसौ वृन्दावन चंद, 
    भयौ है महरि कें भवन सुत आइ कैं॥१॥ 

    मनोरथ भये सिद्ध नाचत तरुन वृद्ध, 
    भयौ है उछाह अति हँसत हँसाइ कैं। 
    कछु न परत कही दूध घृत हरद दही, 
    खोर भई ऐसी दई सरिता बहाइ कैं॥२॥ 

    बढ्यौ है आपर सुख दूरि भयौ सब दुख, 
    पायौ दान द्विज बंदीजनहूँ अघाइ कैं। 
    आन जे मंगत जन सबन के पूरे मन, 
    मुदित उदार महीराज बेटा पाइ कैं ॥३॥ 

    सुनिकैं ब्रज की नारि नव पट तन धारि, 
    वदन उबटि मन आनन्द बढ़ाइ कैं। 
    राजत करन थार. रुरकत उर हार, 
    चलीं जैसी छबि सौं मदन चौंध लाइ कैं ।॥४॥ 

    आईं जसुदा के धाम जायौ जहाँ लौनौं स्याम, 
    देखि दूग अंग-अंग रहीं छबि छाइ कैं। 
    देत हैं असीस बाल चिरुजियौ तेरौ लाल, 
    पूरि हैं कामना कान्ह सबहीं की भाइ कैं॥५॥ 

    बाढ़ी तबही तें प्रीति दिन-दिन औरै रीति, 
    घिरि रहे आँगन सुमन्दिर विहाइकैं। 
    जाइ जो कबहुँ भौंन रह्यौ तहाँ परै तौन, 
    मीन ज्यौं मन की वृत्ति जो न देखै जाइकें ॥६॥ 
    
    भैसी भाँति सुख धाम प्रगटे जहाँ सुन्दर स्याम, 
    वृषभान गोप गृह बधाई बजाइ कैं। 
    दामोदर हित जोरी स्याम पिय राधा गोरी, 
    बसौ मेरे हिय नित जीऊँ जस गाइ कैं ।॥७॥१७॥

- verseNumber: "18"
  verseIntro: "राग रामकली -"
  verseText: |
    बाजन लागे आली बाजे सुहाये। 
    नन्द महर के धाम मनोहर मंगल, 
    निधि परमेश्वर आये ॥१॥ 

    आनन्द भयौ श्रवन सुनि सबकें, 
    नारिनु मिलि महा मंगल गाये। 
    लै लै तिलक गोप गोपी सब, 
    सदन-सदन तें गावत आये ॥२॥ 

    नाना रंग विचित्र बिछौना, 
    बगर सुढार सुधारि बिछाये। 
    झलकत मुक्ता माल चहूँ दिसि, 
    सोभित सुभग वितान तनाये।।३। 

    चटक छबीली अटकत लोचन, 
    लटकत तोरन रतन बनाये। 
    कंचन भीत सु विद्रुम देहरि, 
    मन्दिर दिपत दिनेश छिपाये ॥४॥ 

    फटिक जटित मर्कत मणि विद्रुम, 
    प्रतिविंवित ऊपर छबि छाये। 
    रंभा रोरी अंकुर अक्षत, 
    फल दीपावलि कलश भराये।॥५॥ 

    बड़ड़े गोप सभा जुरि बैठे, 
    तिनमें नन्द विराजत भाए। 
    मन की फूल दुकूल अनूपम, 
    पहिरें सुख सागर में न्हाए॥६॥ 

    इक नाचत इक दिखि-दिखि फूलत, 
    इक बैठे नाचत उठि धाए। 

    कौतिक भयौ गयौ सब कौ दुख, 
    सुख बरष्यौ सब लोक अघाए॥७॥ 

    कर्दम मची अजिर छबि बाढ़ी, 
    गोरस माँटन कर ढरकाए। 
    निर्त्तत रपटत लपटत अंकन, 
    हँसत लसत मन मोद बढ़ाए।॥८॥ 

    महा महोत्सव नन्द महर घर, 
    दान मान सब जन पहिराए। 
    देत असीस ईश ब्रजसुत कौं, 
    माँगि विदा सब सदन सिधाए॥९॥ 

    जै-जै-जै बानी तिहूँ पुर में, 
    उर-उर के सब सूल नसाए। 
    दामोदर हित साधु अमर हरि, 
    अपनी बाँह की छाँह बसाए ।॥१०॥१८॥

- verseNumber: "19"
  verseIntro: "राग बिहागरौ"
  verseText: |
    बाज ब्रज मंगल बजत बधाई। 
    प्राची दिसि जसुमति कें पूरन, 
    प्रगट्यौ हरि ससि माई ॥१॥ 

    फूले कुमुद साधु सुर जहाँ तहाँ, 
    मीन उदै सरसाई। 
    खल राजा अरु राक्षस कुल मनु, 
    कमल गए मुरझाई ॥२॥ 

    आनन्द सागर बढ्यौ गोप, 
    कुल प्रेम किरन दरसाई। 
    आईं निकट चकोरी गोपी पीवत सुन्दरताई॥३॥ 

    पाप ताप तन नास्यौ जग कौ, 
    सुजस सुधा बरसाई। 
    दामोदर हित गगन नन्द गृह, 
    बसत सदा सुखदाई ॥४॥१९॥

- verseNumber: "20"
  verseIntro: "राग देव गंधार-"
  verseText: |
    आजु बधाई मंगल गावत। 
    जायौ जसुमति लाल मनोहर, 
    सुनि-सुनि सब सचु पावत॥१॥ 

    ताल मृदंग दमामे गोमुख भेरी ढोल बजावत। 
    आनन्द बरषै सब ब्रज हरष्यौ जहाँ तहाँ तें धावत ॥२॥ 

    हाथन भेंट ललित गति कामिनि नन्द सदन में आवत। 
    निरखि-निरखि मोहन सोहन मुख फूलत नैंन सिरावत ॥३॥ 

    आँगन नाचत गोप छबीले अद्भुत रंग बढ़ावत। 
    लै-लै छिरकत दूध दही घृत हरदी कीच मचावत ॥४॥ 

    रोरी तिलक दुकूल सु भूषन नन्द सबन पहिरावत। 
    जस गावन कौं हित दामोदर दास बधाई पावत ॥५॥२०॥

- verseNumber: "21"
  verseIntro: "राग आसावरी-"
  verseText: |
    चलौ मिलि मंगल गावहु माई। 
    नन्द जसोदा के घर आनन्द प्रगट्यौ पूत कन्हाई ॥१॥

    बंदीजन मागद धुनि जै-जै मंगल बाजे बाजैं। 
    पढ़त वेद द्विज मंगल वानी सुनत अमंगल भाजैं।॥२॥ 

    करि सिंगार थार धरि कामिनि चलीं देखन नन्दलाला। 
    मानौं घन कौं मलन आवत है चंचल दामिनि माला॥३॥ 

    छबि सौं छिरकत गोप छबीले हरद दही घृत घोरि। 
    प्रेम मगन नाचत गावत हैं भुजा परस्पर जोरि ॥४॥ 

    नन्दराइ आनन्द भयौ मन देत न मानैं संक। 
    ते मंगत राजा से राजत आये जे माँगन रंक ॥५॥ 

    आनँद फूल्यौ फिरत सकल ब्रज घर-घर मंगल चार। 
    दामोदर हित ताही दिन तें असुभमिट्यौ संसार ।।६।॥२१॥

- verseNumber: "22"
  verseIntro: "श्रीहित अनूपजी कृत-राग बिलावल-सूहौ"
  verseText: |
    मिलि आवौ री सजनी मंगल गाईये ॥ टेक ॥ 

    महरि यशुमति के भयौ सुत बेगि बधाये जाईये। 
    आजुकौ सौ द्यौस सुभ सखी बड़े भागन पाईये ॥ 

    घसि चारु चंदन लीपि आँगन मोतिनु चौक पुराईये। 
    सींक सहित सँवारि सथिया बंदन माल बँधाईये ॥२॥ 

    ललन मुख लखि लै बलैया नैंन हियौ सिराईये। 
    प्रान सर्वसु वारनें करि फूली अंग न माईये ॥३॥ 

    जिय हुती सो दृगन देखी भई सबन मन भाईये। 
    हित अनूप हमारी जीवन विधना तू चिरु ज्याईये ॥४॥

- verseNumber: "23"
  verseIntro: "राग विभास-"
  verseText: |
    आजु हमारे माई मंगल री मदिलरा री बाजैगो। 
    इच्छा पूजी मो मन की सो गहगहाइ कैं गाजैगो ॥ 
    नन्द लला कौ जनम होत ही ब्रज जन आजु बिराजैगो । 
    घर-घर तोरन वंदन माला हित अनूप सुख साजैगो ॥२३॥

- verseNumber: "24"
  verseIntro: "राग विभास-"
  verseText: |
    ढाँढ़िन निर्तत सुलप सुदेश भवन व्रजराज कैं। 
    बरनत वंश निकट जसुमति के पहिरें अद्भुत वेस॥ 
    लटक चलत गति ललित भाल पर श्रम जल शिथिलित केस । 
    मगन भई कछु सुध न सँभारत टूटत मुक्ता हार। 
    जो कछु पायौ सबै लुटायौ भूषन वसन अपार ।। 
    ब्रज रानी ढिंग बोल हिये सौं लाइ लई रिझवार। 
    हित अनूप बैठाई नियरें राखी अपने लार ॥२४॥

- verseNumber: "25"
  verseIntro: "राग हेरी -"
  verseText: |
    सब ग्वाल गावैं रे हेरी-हेरी रे भैया। 

    श्याम सखा प्रगट्यौ भलैं रे खेलेंगे ता साथ। 
    वन-वन धेनु चरें हैं ता सँग गहें हाथ सौं हाथ ॥ रे भैया० ॥ 

    मधुमंगल नाच्यौ भलैं रे ग्वाल मंडली संग। 
    काँधे लकुटी बाँधे फैंटा मुरली नाना रंग॥२॥ 

    चले ग्वाल ब्रजराज कैं रे दई बधाई आइ। 
    तिनकौं पाग जरकसी टोडर पहिराये नंदराइ॥३॥ 

    एक सखा फूल्यौ फिरै रे बरनौं ताकौ नाम। 
    हित अनूप नौनेरे वारौ चाहै दरसन श्याम ॥ रे भैया० ॥२५॥

- verseNumber: "26"
  verseIntro: "राग ईमन-"
  verseText: |
    माई आजु री मदिलरा बाजै रानी जसुमति मोहन सुत जायौ। 
    कही न जात गोकुल की शोभा घर-घर आनँद मंगल मिल गायौ। 
    फूले फिरें नर नारी मन में मगन भारी मनहुँ रंक धन कौ पुंज पायौ। 
    हित अनूप रसिकन की जीवन सुन्दर साँवरौ अपनें ब्रज में आयौ ॥२६॥

- verseNumber: "27"
  verseIntro: "राग विहागरौ -"
  verseText: |
    रानी जसुमति तू अति भाग भरी। 
    या धरनी पर तेरे सम विधि नाहिन और करी ।। 
    तैं जायौ मन मोहन सौ सुत सब उर शूल हरी। 
    तेरे पुण्य पुंज की बेली नीकी भाँति फरी॥ 
    भाग निकाई कहाँ कहाँ लौं बरनत मति बिसरी। 
    हित अनूप तेरेई आँगन सब संपति लै जु धरी ॥२७॥

- verseNumber: "28"
  verseIntro: "श्रीगरीबदासजी कृत-राग विभास"
  verseText: |
    आज बधावौ माई री नंद दरबार। 
    ब्रज वनिता मिलि मंगल गावौ सजि चलौ कंचन थार ॥ 
    धुजा पताका कदली रोपौ द्वारन वंदन वार। 
    सकल सवासिनि धरौ साथिये जसुमति परम उदार ।। 
    कंचन सींक रुपीं अति राजत मुक्ता लगे सुढार। 
    कमल मुखी प्रफुलित भई मानौं दिनकर किरन अधार ॥ 
    कुँवरहिं देखत अति सुख उपज्यौ वारत मणि गन हार। 
    गरीबदास कौं दई है पंजीरी बोलि सकल परिवार ॥२८॥

- verseNumber: "29"
  verseIntro: "राग जैतश्री -"
  verseText: |
    आजु सुहेलरा श्रीनन्द महर घर रानी जायौ है पूत ॥ टेक ॥ 

    जात करम कौं ब्रज पति आये लियें विप्रन की भीर। 
    गाइ सबच्छ पंच लख बोलीं जिनके संग अभीर ॥१॥ 

    नांदी मुख करि दई ब्राह्मनन हरषि असीस सुनाई। 
    पंच शब्द मिलि बाजे बाजैं सब मिलि हेरी गाई॥२॥ 

    जब यह बात सुनी सुख की बरसाने बजी बधाई। 
    कीरति सहित नन्द गृह आये भई है सजन मन भाई॥३॥ 

    तब जसुमति सुनि-सुनि ये बातें अरघ पाँवड़े कीने। 
    मंगल बहुत गवाइ घोष में भान भवन में लीने॥४॥ 

    बालक देखि परिकरमा कीनी टीकौ भेट मग्राई। 
    अति आनन्द भयौ सबहिन के मन में धरी है सगाई ॥५॥ 

    अपनी-अपनी काँवरि काँधे धरें सिरन पर माट। 
    देस-देस के दूव बँधावत विरती सूत रु भाट ॥६॥ 

    रिषि के वचन सत्य करि माने विदा महर पै माँगी। 
    गद गद पुलक रोम भये ठाड़े दरसन दै बड़भागी ॥७॥ 

    गरीबदास कछु यह जस बरन्यौं लघु मति अपनी घातैं। 
    जसुमति बोलि पंजीरी दीनी व्यास वंश के नातें ।॥८॥२९॥

- verseNumber: "30"
  verseIntro: "श्रीकिशेरीदासजी कृत- (बंशावली वर्णन)"
  verseText: |
    दोहा- 
    राग मारू
    श्रीगुरु श्रीगोविन्द पद मंगल हित करौं ध्यान। 
    मंगल श्रीब्रजराज घर ज्यौं पाऊँ सनमान ॥१॥ 

    विघन हरन मंगल करन जे कहियत हैं ओर । 
    तिन हौं चरनन कौं नवौं पूजौ आसा मोर ॥२॥

    श्रीरूप सनातन जीव जुत कीन्हें भक्ति प्रकास। 
    जनम-जनम निजु चरन कौ कीजै मोकौं दास ॥३॥ 

    मित्र बंधु के चरन गहि लैहौं अपने साथ। 
    जातें हौं नीकौ लगौं आदर दैहि ब्रजनाथ ॥४॥ 

    गोप सभा बैठी विशद मध्य नंद ब्रजराइ। 
    सभा सुधर्मा इंद्र की जा देखते लज्याइ ॥५॥ 

    इंद्र के नाम-सक्र सतक्रतु सचीपति संक्रन्दन परहूत। 
    कौशिक वासव वृत्तहा मघवा मातलि सूत ॥६॥ 

    जिस्नु पुरंदर वज्रधर आखंडल रिपु पाक। 
    सोहैं जहाँ ब्रजराज जू को है इंद्र वराक॥७॥ 

    जाचक देस विदेस के जाँचन आये दान। 
    मो आये फीके लगे ज्यौं दीपक उदै भान ॥८॥ 

    मंगल देवन सेवहूँ मंगल सुमिरौं नाम। 
    गोपराज के पुत्र सुनि आयौ ब्रजपति धाम ॥९॥ 

    हँसि बोले ब्रजराज जू ढाँढी होड़ौ आय। 
    मुँह माँग्यौ तुहि दैऊँगौ कछु गोपन कौ जस गाय ।।१०।। 

    (श्री) हरिवंशचंद्र वर सुमिरि कैं मन में कियौ विचार। 
    अपनी मति अनुमान कछु बरनौं ब्रज रस सार ।।११।। 

    कोस चौरासी भूमि कौ को करि सकै बखान। 
    गिरि वन वीथी द्रुम लता लीलामय सब जान ॥१२॥ 

    द्वै राजा या देस के धर्म इष्ट स्व ग्यान। 
    प्रगट नाम तिनके सुनौं श्री नंदराइ-वृषभान।।१३।। 

    तिनकौ वैभव कहन कौं कोऊ सम सरि नाहिं। 
    द्रुम लेखनि मसि सिंधु करि छिति पर लिखे न जाहिं ॥१४॥ 

    लोक चतुर्दस तन धरैं सेवत हैं या ठौर। 
    निजु वैभव बैकुंठ तजि आवत ब्रज में दौर।।१५।। 

    कोटि-कोटि भैस्वर्ज सुख इन व्रज वासिन के द्वार। 
    व्रज वासिन के दास पर कोटि इन्द्र सुख वारि।।१६।। 

    चौपाई - 
    श्री गुरू गोविंद चरन रज बंदौ। 
    मंगल रूप ध्यान आनंदौं ।॥१७॥ 

    पाऊँ श्री हरिवंश सहाय। 
    बरनौं कछु परिकर ब्रज राय ॥१८॥ 

    जद्यपि अलप बुद्धि है मेरी। 
    लीला गुन सागर करि हेरी ॥१९॥ 

    कैसैं करि तरि सकौं अपार। 
    बिना साधु चरनन आधार ॥२०॥ 

    सोई जानि आसरौ कीन। 
    और उपाइ नहीं मन दीन॥२१॥ 

    इनकी कृपा पार भव करै। 
    दुर्लभ सुलभ होहि दुख हरै ॥२२॥ 

    दोहा- 
    परम हंस श्री रूप जू परम कृपा मन धार। 
    बरन्यौ परिकर घोषपति जो ब्रजराज कुँवार ॥ २३॥ 

    सोई भाषो करि कहौं लहौं कृपा इन पास। 
    श्रीहरिवंश प्रताप तें कहत किशोरीदास ॥२४॥ 

    कृपा अनुग्रह जानि कैं घट बढ़ लेहु सँवारि। 
    साधु परम उपकार करि अनुकम्पा मन धारि॥२५॥ 

    सकल बैकुंठन तें सरस नंदीसुर ब्रजराज। 
    कोटि-कोटि जहाँ लक्ष्मी बसत करत कृत काज ॥२६॥ 

    कंचन मय मन्दिर खचित चित्र-चित्र कल मोर। 
    पावन सर आनंद निधि बँध्यौ मनिन चहुँ ओर ॥२७॥ 

    आस पास कुंजैं सुभग अरु अँगनाई चार। 
    मणि कंचन करि खचित भुव द्रुम समूह मंदार ॥२८॥ 

    मनु तीरथ है प्रेम कौ उद्दीपन सुख कार। 
    भाँति-भाँति के विटप नव द्रुम जातिनु में सार ॥२९॥ 

    सैलासन अरु पांडु यह नाम दुहुँन मन आन। 
    महाराज ब्रजराज की प्रगट अथाई जान ॥३०॥ 

    अब वंशावलि नंद की कहौं कछू विस्तार। 
    आगम उक्ति जु संहिता ताकौ अर्थ विचार ॥३१॥ 

    चौपाई - 
    कुल आभीर नृपति महा बाहु। 
    तिनकें कंज नाभि लै चाहु ॥३२॥ 

    भुवबल चित्रसैन जो जानौ। 
    ये राजा अति ही परधानौ ॥३३॥ 

    परम धर्म धुज भक्त सिरोमन। 
    देवमीढ लियौ हरि सेवा पन ॥३४॥ 

    लक्ष्मी अरु नारायन इष्ट। 
    तिनतें वर पायौ जु अभिष्ट ॥३५॥ 

    तिनके पुत्र नाम परजन्य। 
    परम वैष्णव महा अनन्य ॥३६॥ 

    मेघ समान दया सनमान। 
    वरषत सकल प्रजा पर दान ॥३७॥ 

    गुन लक्षन परजन्य समानौं। 
    पतिनी तिन वरेयसी जानौं ।॥३८॥ 

    जथानाम गुन श्रेष्ठ जु महा। 
    दादी कृष्ण चन्द्र गुन लहा॥ ३९ ॥ 

    पाँच पुत्र तिनके कुल दीप। 
    मध्य पुत्र हैं नंद महीप ॥४०॥ 

    बड़े उपनंद औरु अभिनंदन। 
    भैया बड़े बली श्री नंदन ॥४१॥ 

    छोटे हैं सुनंद अरु नंदन। 
    भैया चार नंद जग वंदन ॥४२॥ 

    तुंगी औरु पीगरी जानौ। 
    कुवला अरु अतुला पहिचानौं ।॥४३॥ 

    ये इनकी पतिनी क्रम चारि। 
    परम सुसीला अरु वर नारि ॥४४॥ 

    बहिन सुनंदा नंदिनी नाम। 
    भर्त्ता तासु नील सुभ काम।।४५।। 

    नन्दराइ कुल दीपक धीर। 
    मध्य पुत्र परजन्य गंभीर।॥४६॥ 

    श्री जसुदा जग में विख्यात। 
    जसु की दाता अरु जग मात॥४७॥ 

    गोपन कौ कुल दीपक मानौ। 
    धरैं पतिव्रत सील महानौ ॥४८॥

    ब्रजरानी नंद घरनि विख्यात। 
    तिनके गुन बरने कित जात।।४९॥

    लक्ष्मी अरु नारायन सेइ। 
    तिनकी भक्ति लहे वर एह ॥५०॥

    कृष्ण पुत्र पाये घनस्याम। 
    मन वांछित फल पूरन काम॥५१॥

    अष्टमी कृष्ण पक्ष अधरात। 
    भादौं मास जनम सुख दात ॥५२॥

    इन पायौ नारद उपदेस। 
    इष्ट भजे नंदीश्वर देश।॥५३॥ 

    सुख संतति की करी कामना। 
    नारायन बिन और नाम ना।।५४।।

    अंतरिक्ष वानी जब भई। 
    सुनत वचन तन की सुध गई ॥५५॥

    पाँच पुत्र है हैं या तप करि। 
    तिनमें नन्द विदित सर्वोपरि ॥५६॥

    तिनकें नन्दन है है ऐसौ । 
    ब्रज मंडल त्रिभुवन नहिं तैसौ ।॥५७॥

    देव सेव जाकी निजु करि हैं। 
    चरन रैनु मुकटन पर धरिहैं।॥५८॥

    दोहा- 
    यस सुनि मन संतोष भंयौ बसे सहित परिवार। 
    केशी के डर महावन उतरे जमुना पार।॥५९॥ 

    इनकी प्रिया वरेयसी कसूँभी फूल के रंग। 
    हरित वसन तन ठेंगनी सेत केश शुभ अंग ॥६०॥ 

    दादी गिरधर देव की पुन्य पुंज सुख धाम। 
    पाँच पुत्र संपति बहुत नाती सुन्दर श्याम ॥ ६१ ॥ 

    चौपाई – 
    परजन्यहि लहुरे अरजन्य। 
    तिनहूँ ते लहुरे राजन्य॥६२॥ 

    तिनकी प्रिया नटी अरु सूरा। 
    श्रीहरिराइ प्रेम कौ पूरा ॥६३॥ 

    तिनकी सुजन्या पति गुण वीरा। 
    (श्री) वृषभान राइ के मातुल धीरा ॥६४॥ 

    श्री ब्रजराज जनक हरिजू के। 
    नन्द आनन्दित लोक तिहूँ के ॥६५॥

    नन्दराइ वृषभानहि भावै। 
    किशोरदास यह मंगल गावै॥६६॥

- verseNumber: "31"
  verseIntro: "श्रीखेम हितजी कृत- राग मारू"
  verseText: |
    आजु हौं नन्दहि जाँचन आयौ। 
    जनम सफल करिवे कौं अपनौं रहसि बधावौ गायौ।॥१॥ 

    महरि कहत या बालक कौ गुन किनहूँ न भेद बतायौ। 
    भलौ-भलौ सब लोग कहत हैं सोई ग्रन्थन गायौ।॥२॥ 

    प्रथम रूष संखासुर मास्यौ कमठ पीठ ठहरायौ। 
    श्री बराह नृसिंघ औतस्यौ बलि पाताल पठायौ।॥३॥ 

    परसराम छत्रिनु के कारन कैऊ बार छुटायौ। 
    रघुपति रावन सीस भुजा हति सीता लै घर आयौ ॥४॥ 

    विभीषण कौं राज तिलक दै लंका में बैठायौ। 
    अब श्रीकृष्ण प्रगट पुन्यन तें तुम्हरौ पुत्र कहायौ।॥५॥ 

    बाल केलि सौं केलि करेंगे नटवर वेष बनायौ। 
    कर गोवर्धन सात द्यौस लौं बाँए अग्र उठायौ।॥६॥ 

    रास विलास करैं वृन्दावन गोपिन प्रेम बढ़ायौ। 
    मास्यौ कंस केशी खल मास्यौ औरै साल सवायौ।।७।। 

    जस अपार लीला अनंत ब्रह्मा हू पार न पायौ। 
    महरि कहत यह भलौ जसौंधी॰ सबहिन के मन भायौ।।८।। 

    बाबा जू हँसि कैं मन्दिर तें बकुचा बेगि मगायौ। 
    झगा पगा अरु पाग पिछौरा नीके करि पहिरायौ।॥९॥ 

    हरी दरयाई कौ दगला ऊपर उपनंद उढ़ायौ। 
    सुखानंद सौने कौ टोडर ढाँढी हाथ गहायौ।॥१०॥ 

    महानन्द महँगे मोलन कौ ग्रींव हार पहिरायौ। 
    परमानन्द प्रीति करिकैं कानन कुण्डल चमकायौ ।॥११॥ 

    धरानन्द धाराधर के सम कंचन धन झर लायौ। 
    सीधौ बहुत सुरसुरानन्द ने गाड़ीन भरि पहुँचायौ।॥१२॥ 

    नित्यानन्द सबन सौं कहि कैं सबपै दान दिवायौ। 
    कनक माल कंकन मुंदरी सौं उभै भार भरवायौ ॥१३॥ 

    बड़े नन्द ठठकें बड़ ताजी सेवक हाथ गहायौ। 
    दीनौं बड़ौ डौल कौ हाथी घनघनाइ घन्नायौ ॥१४॥ 

    गाइ भैंस खैलनि के लहड़े गोकुल गाउँ जतायौ। 
    दस हजार मन गेंहुँन कौ तब एकै खेत बतायौ।॥१५॥ 

    बेसक उठ्यौ बंब धरि कैं चढ़ि कैं नीसान बजायौ। 
    ढाँढिनि हूँ पहिरी मन्दिर तें सो दत्त जात न गायौ ॥१६॥ 

    इहि विधि विदा भयौ जब ढाँढी कीरति जस सौं छायौ। 
    ब्रज वासीन विचारि खेम हित लिखि पट्टौ पकरायौ।॥१७॥३१॥

- verseNumber: "32"
  verseIntro: "श्रीयादौ भगतजी कृत राग धनाश्री –"
  verseText: |
    नन्दजू मेरे मन आनन्द भयौ हौं बरसाने तें आयौ। 
    श्रीवृषभान कह्यौ सुनि मोसौं पूत जसोदा जायौ।॥ टेक॥ 

    कीरति जू हू कह्यौ टेरि कैं सुनि रे ढाँढी आइ। 
    जसुमति सौं कहियौ पालागन पाछें बात चलाइ॥ 

    दई करै मेरौ मन भायौ तब मैं पकरौं पाँइ। 
    तीन काल तिहुँ लोक कौ यह सुख नैंनन देखौं आइ ।।१।। 

    तुम तौ परम प्रवीन नन्दजू बड़े गोप के जाए। 
    हौं तुम्हरौ जस कहौं कहाँ लौं वेद पुरानन गाए। 
    जो प्रभु अखिल लोक चूड़ामणि सो घर बैठे पाए। 
    गई सूल ब्रजजन आनन्दित भये सकल मन भाए॥२॥ 

    परबत सात रतन के दीने द्वै लख धैनु न्हवाई। 
    औरौ दान दिये बहुतेरे तिनकौ पार न पाई।। 
    लैहौं सोई जोई हौं जाचौं चिरजीवौ जु कन्हाई। 
    बैठे गोद सभा में राजैं तब हौं देंउ बधाई ॥३॥ 

    पकरि बाँह ढाँढी की लीनीं भीतर भवन पधारे। 
    सुनौं महरि कीरति की बातें ढाँढी कहत सुधारे ॥ 
    जो यह माँगै सोई दीजै जीवन प्राण हमारे। 
    श्रीमोहन प्रभु कौ मुख निरखत जादौ तन मन वारे ॥४॥३२॥

- verseNumber: "33"
  verseIntro: "श्रीहितलालजी कृत-(हेली) बधाई छन्द-"
  verseText: |
    आनन्द ऊग्यौ री हेली मन्दिर नन्द के। 
    हित जल पोषौ री हेली चलि मिलि वृन्द के॥ 
    करि वृन्द चलहि न मंद सजनी द्वन्द्व दुख सबकौ गयौ। 
    यह रूप निधि सुकुमार सुन्दर पुन्य पूरब तें भयौ।। 
    नँदग्राम शोभा अमित बाढ़ी देखि विधि जकि थकि रह्यौ। 
    जहाँ शारदा सुध भूली डोलै, जात कहौ का पर कह्यौ ॥१॥ 

    सरस सुहायौ री हेली है दिन आजु कौ। 
    जन्म बधावौ री हेली श्रीब्रजराज कौ।। 
    ब्रजराज कौ दिन जन्म आली लोक लोकन में छ्यौ । 
    ढिंग आन सुर गन फूल बरसैं गान मन रस नित नयौ। 
    लखि श्याम अति अभिराम की गति सपति रति बौरी भई। 
    कहत न बनें बड़भाग गोकुल संपदा जो प्रभु दई॥२॥ 

    हिय हुलसानौं री हेली मंगल गाय कैं। 
    विलम न लावौ री हेली औसर पाय कैं॥ 
    प्रिय पाय औसर को न फूल्यौ देव दिवि दुन्दुभि बजैं। 
    जहँ होत धुनि चहुँ ओर वासी घोष अबहीं तें गजैं॥ 
    रिझवार रीझीं नारि भीजीं ललित लाल निहारि कें। 
    गहि मौन गोरी नव किशोरी जात बलि तृन वारिकें॥३॥ 

    उद्भव लेखौ री हेली ब्रजपति भाग कौ। 
    इन फल पायौ री हेली पहिली लाग कौ।
    करि लाग कीन्हे जाग तब शिशु लाभ कौं लोचन लह्यौ। 
    तजि नेह जग दिन रैन चिंतत निरधनी लौं धन गह्यौ । 
    जस होहु दूनौ चन्द पूनौ भाँवतौ हरिवंश कौ। 
    चिरुजियौ जसुमति प्रान जीवन (हित) लाल प्यारौ वंश कौ॥४॥३३॥

- verseNumber: "34"
  verseIntro: "राग सारंग-ताल आड़ -"
  verseText: |
    बजत बधाई ब्रजपति मन्दिर प्रगट भयौ सुत स्याम सलौना। 
    महारानी जसुमति बड़ भागिन लाल जन्यौ हिय दूग उरझौना। 
    मंगल रचना भवन-भवन पुर अतिसै ओप नंद जू के भौना। 
    (जै) श्रीहित लाल सकल सुख दायक लायक घोष नृपति कौ छौंना ॥३४॥

- verseNumber: "35"
  verseIntro: "श्रीजन त्रिलोकजी कृत-राग सारंग -"
  verseText: |
    सब ग्वाल गावैं गोपी नाचैं। 
    प्रेम मगन कछु कहत न. बाचैं।॥ 
    नंद महर घर ढोटा जायौ। 
    सुनि सब लोक बधायें आयौ।। 
    दूध दही घृत काँवर जोरी। 
    अक्षत दूव अलंकृत रोरी॥ 
    ताल पखावज दुन्दुभी ढोला। 
    हँसत परस्पर करत कलोला।। 
    हरद दूध दधि छिरकत अंगा। 
    लसत पीत पट वसन सुरंगा अजिर पंक गुलफन चढ़ि आई। 
    रपटत फिरत न पगु ठहराई। 
    वारि-वारि पट भूषन दीने। 
    लटकत चलत महा रस भीने॥ 
    सुध न परत को काकी नारी। 
    हँसि-हँसि देत परस्पर गारी॥ 
    सुर विमान सब कौतिक भूले। 
    जन त्रिलोक आनँद में झूले ॥३५॥

- verseNumber: "36"
  verseIntro: "राग सारंग-"
  verseText: |
    जसुमति मुदित मुदित भयौ गोकुल नन्द मुदित मन अधिक भाव री। 
    खग मृग मुदित मुदित द्रुम बेली महा मुदित जहाँ धरत पाँवरी॥ 
    बालक मुदित भवन में खेलें हलधर मुदित मुदित जु सुभाव री। 
    जुवती मुदित भईं छबि निरखत हमरैं तरन है येही नाव री ॥ 
    जमुना मुदित भई इहि औसर मुदित भये तृन परबत बावरी। 
    जन त्रिलोक प्रभु काहै न मुदित होइ उदित भयौ ब्रज कुल कौ राव री ॥३६॥

- verseNumber: "37"
  verseIntro: "श्रीरामकृष्णदासजी कृत-राग गौरी-"
  verseText: |
    ढाँढिन वारने कीनी लला पर वारने कीनी ॥ टेक ॥ 

    गौर वरन इक स्याम वरन तन दोऊ सोभा के औन। 
    रोग दोष लागौ मेरी अँखियन दृष्टि लगौ जिनि नैन ॥१॥ 

    रतन जटित आँगन में खेलत कब देखौंगी आइ। 
    झूमक नाँच नचौंगी ता दिन मुरि-मुरि लैंउ बलाइ॥२॥ 

    ढाँढिन कौं जसुमति पहिराई ढाँढी कौं नंदराइ। 
    करहल नाँच नचे जब दोऊ रति पति निरखि लजाइ ॥३॥ 

    ब्रज के निकट वास देउ मोकौं नित प्रति आसिष दैहौं। 
    नन्दरानी कीरति रानी पै दूनी बधाई लैहौं ॥४॥ 

    ब्रह्मांदिक सनकादिक सारद नारद से मुनि रीझे। 
    ढाँढी क्यों न भये या ब्रज के 'राम कृष्ण' रस भीजे ॥५॥३७॥

- verseNumber: "38"
  verseIntro: "श्रीलालदासजी कृत-राग गोधनी-गोरी-"
  verseText: |
    चलहु बधाये जाँइ हो ढोटा जायौ नन्द कैं॥ टेक ॥ 

    चली जात ही खिरक कौं हो पंच शब्द पस्यौ कान।
    इक आवत इक जात हैं मागद लै लै दान हो॥ ढोटा ॥१॥ 

    हौं उलटी अति मोद सौं हो सब सौं कह्यौ सुनाइ। 
    चलौ ब चलौ न चलौ कोऊ मोपै रह्यौ न जाय हो।॥२॥ 

    सुनि-सुनि ब्रज बनिता सबै लिये भूषन वसन बनाइ। 
    लाल मुनिनु की छबि लई जनु पिंजरा दई मुकराइ हो ॥३॥ 

    भई सुरत गति पाँगुरी हो निरखि थकित भयौ मैन। 
    जोग जुगति तजि कैं कहैं वारि अपनपौ दैन हो ॥४॥ 

    गोप तरुन बालक लियें हो भान राइ चले धाइ। 
    दूध दही घृत साजि कैं लीने माट भराइ हो ॥५॥ 

    नाँचत गावत आवहीं हो सर्वसु देत निसंक। 
    प्रगट्यौ ससि नसि तम गयौ मनु निधि पाई रंक हो ॥६॥ 

    छिरकत पीत दूध दधि अंगन रंग भरे नर नारि। 
    रानी कीरत जसुमति नंद पै देत व सर्वसु वारि हो ॥७॥ 

    गोकुल गोप बधुन कौ हो आनन्द कह्यौ न जाइ। 
    मनु घर-घर बालक भये दई घर-घर बात लुटाइ हो ॥८॥ 

    अति उदारता नन्द की हो सकुचे इन्द्र कुबेर। 
    जाचक भुवपति हैं भये मानी संक सुमेर हो ॥९॥ 

    पितर कर्म करि नन्द नन्दीमुख पूजे विप्र बुलाइ। 
    लालहि दई कृपा करि नीकैं ब्रज में सदा बसाइ हो ॥१०॥३८॥

- verseNumber: "39"
  verseIntro: "श्रीप्रेमदासजी कृत-राग भैरौं -"
  verseText: |
    अरी सुनि आजु बधाई नन्दराइ कैं बाजत मंदिलरा द्वार। 
    प्रगटे श्री मोहन सोहन अति फूल्यौ ब्रज परिवार॥ 
    आनन्द बढ्यौ तिहूँ पुर छाई दिवि दुन्दुभी झनकार। 
    प्रेम सहित सुत निरखि महर जू दये वारि भंडार ।।३९॥

- verseNumber: "40"
  verseIntro: "राग मधु माधव-"
  verseText: |
    नाचत ब्रज रानी जू कें आगैं मंगल मुखी रँगीले। 
    नन्द सुवन के जनम सोहिले गावत छैल छबीले ॥ 
    चार पदारथ छुबत न हीरा लाल लुटावत लै गरबीले। 
    प्रेम सहित बिनु लखें कुँवर के टरत न हठन हठीले ॥४०॥

- verseNumber: "41"
  verseIntro: "मंगल छंद राग सूहौ बिलावल -"
  verseText: |
    श्री वृन्दावन-बजत बधाई। 
    नवल कुंज नव फूलन छाई॥ 
    वरस गाँठ दंपति की आई। 
    जोरी उबटन उबटि न्हबाई।। 
    न्हबाइ उबटन उबटि जोरी कुसुम भूषन सखि सजें। 
    पहिर पीत दुकूल फूलत गौर स्यामल छबि छजें। 
    बने सुभग सिंगार नख सिख परस्पर छबि यौं बढ़ें। 
    केशरी बागे पहिरि मनौ सूर रति रन कौं चढ़ें ॥१॥ 

    गावत मंगल अली सुहाई। झूमक सारी सजि-सजि आईं। 
    लै कर कुमकु अजिर लिपायौ। गज मोतिनु सों चौक पुरायौ ॥ 
    पुराइ मोतिन चौक चहुँ दिस धुजा रँग-रंग की धरें। 
    रतन बंदन माल बाँधत कुंभकंचन के भरें ॥ 
    कनक कदली रोपि तिनमें धरी चौकी हेम की। 
    तहाँ स्यामा स्याम राजत करत बरषा प्रेम की ॥२॥ 

    नव जुवती केसर घसि ल्याई। लाल भाल पर खौर बनाई। 
    कोऊ अरगज लिये विराजैं। अरस परस छिरकत सुख साजैं ।। 
    साजैं सुखै रँग छिरकि सुंदरि मनौं खेलें फागरी। 
    होत सूहे प्रान सुनि-सुनि कहत सूहौ रागरी ॥ 
    बीनि-बीनि नवीन बीनन परन परबीनन लई। 
    ताल चंग मृदंग बाजत चंद्रगति उपजत भई॥३॥ 

    नाचत अलीं भलीं सुकुँवारी। 
    बदि-बदि अपनी-अपनी वारी॥ 
    जब-जब अलग लाग गति लैहीं। 
    तब-तब रीझि उभय सब दैहीं॥ 
    दैहि रीझि सु उभय अभरन लैंहि इहि चिर सहचरी। 
    नन्द जसुदा भान कीरति कहत तिनकौ जस खरी॥
    करत ये नित चोज सजनी लै पुहुप लावत झरीं। 
    प्रेमदासि हित जुगल वर हँसि गोद सेवन सौं भरीं ॥४॥४१॥

- verseNumber: "42"
  verseIntro: "मंगल छंद राग सूहौ बिलावल -"
  verseText: |
    बधाई माईं नन्द महर घर बाजै। 
    बरसगाँठ आई मन भाई कान्ह कुँवर सुख साजै ॥ 
    टीके भेट समेटि सकत नहिं गृह-गृह मंगल राजै। 
    मोद विनोद समात न तन मन गोपी गोप समाजै ॥ 
    धनि-धनि कूख जसोदा बरनैं चढ़े प्रेम चित छाजै। 
    ब्रज मोहन हित रूप त्रिभंगी रंगी रंगन गाजै ॥४२॥

- verseNumber: "43"
  verseIntro: "श्रीनागरीदासजी कृत-राग जैतश्री-"
  verseText: |
    आजु बधावौ ब्रजराज कैं, प्रगट्यौ आनन्द कंद।।टेक ॥ 

    स्याम सुंदर कमल लोचन जायौ है जसुमति पूत। 
    लाल कुल कौ भाँवतौ री जा बिनु जगत अऊतः ॥१॥ 

    कुँवर सूप अनूप पौढ्यौ दिपत दीपति धाम । 
    ललित मुख के वारने री अँग-अँग अति अभिराम ।।२।। 

    मुदित ब्रजपति भावन आये सकल गोपी गोप। 
    दूब बँधाइ जुहार करि-करि भई है कुटुंब की ओप॥३॥ 

    भुवन मंगल रूप सुत कौ निरखि वारत प्रान। 
    तृन तोरि लेत बलाइ बनिता जीवहु जसुमति जान ॥४॥ 

    छिरकि दधि मुख माँड़ि हरदी माट देत लुढ़ाइ। 
    अजिर गोरस पंक पूरित रपटि टिकत नहीं पाँइ॥५॥ 

    पुलकि तन नर नारि निर्त्तत बाहु कंठ लगाई। 
    मत्त गदगद सुरन गावत हरखि व हियौ सिराइ ॥६॥ 

    कोलाहल कौतूह मंगल महा महोछौ द्वार। 
    नन्दराय अनुराग मगन है रीझि अपनपौ वार॥७॥ 

    हाटक हीर ठाठ गोधन के रतनन कूट लुटाये। 
    जाचक धनिक अजाची कीने मन कामना सिराये ॥८॥ 

    भूषन वसन बंधू पहिरे फिरि तब पाँय गहै। 
    यह सुख सुकृत सुहृद हो तिहारौ लोचन वारि बहे ॥९॥ 

    नागरीदासि कोऊ न गयौ घर सुधबुध विसरी देही। 
    अलभलब्धि प्रापत बड़ भागी सनि रहे सजन सनेही ॥१०॥४३॥ 

- verseNumber: "44"
  verseIntro: "श्रीसूरदासजी कृत-राग आसावरी (नौमी के दिन कौ)"
  verseText: |
    ब्रज भयौ महरि कें पूत जब यह बात सुनी। 
    सुनि आनन्दे सब लोक गोकुल गुनित गुनी ॥ 
    ग्रह लगन नक्षत्र बल सोधि कीनी वेद धुनी। 
    सुभ पूरब पूरे पुन्य रची कुल अटल थुनी ॥१॥ 

    सुनि धाईं सब ब्रज नारि सहज सिंगार किये। 
    कर कंकन कंचन थार मंगल साज लिये ।। 
    तन पहिरे नौतन चीर काजर नैन दिये। 
    कसि कंचुकी तिलक लिलाट शोभित हार हिये ॥२॥ 

    सब अपने-अपने मेल निकसीं भाँति भली। 
    मनौं लाल मुनिनु की पाँति पिंजरन चूरि चली। 
    हँसि गावत मंगल गीत मिलि दस पाँच अली। 
    मनु भोर भये रवि देखि फूलीं कमल कली ॥३॥ 

    दोऊ शोभित तरल तरौंना बैनी सिथिल गुही। 
    मुख माँड़े रोरी रंग सैंदुर माँग छुही ॥ 
    उर अंचल उड़त न जानैं सारी सुरंग सुही। 
    अति श्रम जल मुखहि प्रस्वेद मानौं मेघ फुही ॥४॥ 

    इक पहिलें पहुँचीं आइ अति आनन्द भरीं। 
    लई भीतर भवन बुलाइ सबै शिशु पाँइ परीं ॥ 
    ते वदन उघारि निहारि देत अशीश खरीं। 
    चिरुजियौ यशोदा नन्द पूरन काम करीं ॥५॥ 

    धनि-धनि दिन धनि यह रात धनि यह पहर धरी। 
    धनि धन्य महरि की कूख भाग सुहाग भरी ॥
    जिन जायौ ऐसौ पूत सब सुख फलन फरी। 
    थिरु थाप्यौ सब परिवार मन की सूल हरी ॥६॥ 

    सुनि ग्वालिन गाइ बहोरि बालक बोलि लये। 
    गुहि गुंजा घसि वन धातु अंगन चित्र ठये। 
    सिर दधि माखन के माट काँवर कन्ध लये। 
    इक झाँझ मृदंग बजावत सब नन्द भवन गये॥७॥ 

    इक नाचत करत कुलाहल छिरकत हरद दही। 
    मनु बरषत भादौं मास नदी घृत दूध बही ॥ 
    जाकौ जहीं-जहीं मन जाय कौतुक तहीं-तहीं। 
    अति आनन्द मगन जु ग्वाल काहू बदत नहीं ॥८॥ 

    इक धाइ नन्द पै जाय पुनि-पुनि पाँइ परें। 
    इक आपु आपुही माँहि हँसि-हँसि अंक भरें ॥ 
    इक दधि रोचन अरु दूब सबन के सीस धरैं। 
    इक अंबर और मँगाइ देत न संक करें।॥९॥ 

    जब न्हाइ नन्द भये ठाड़े अरु कुश हाथ धरे । 
    नाँदीमुख पितर पुजाइ अंतर सोच हरे ॥ 
    वर गुरु जन द्विज पहिराइ सबन कें पाँइ परे। 
    घसि चंदन चारु मँगाइ सबन कें तिलक करे ॥१०॥ 

    गन गैयाँ गनी न जाँय तरुन ते बच्छ बढ़ीं। 
    ते चरैं जमुन के कूल दूने दूध चढ़ीं। 
    खुर रूपे ताँमे पीठ सौने सींग मढ़ीं। 
    ते दीनीं द्विजन बुलाइ हरषि अशीस पढ़ी ॥११॥ 

    तब अपने मित्र सुबन्धु हँसि-हँसि बोलि लिये। 
    मथि मृगमद मलय कपूर माथै तिलक किये ॥ 
    उरमणि माला पहिराइ वसन विचित्र दिये। 
    मनु वरषत मास असाढ़ दादुर मोर जिये ॥१२॥ 

    वर बंदी मागद सूत आँगन भवन भरे। 
    ते बोले लै-लै नाम हित कोऊ नहिं बिसरे ॥ 
    ते दान मान परिधान पूरन काम करे। 
    जिन जोई जाँच्यौ सोई पायौ रस नन्दराइ ढरे ॥१३॥ 

    तब अंबर और मँगाइ सारी सुरंग बनी। 
    ते दीनीं बधुन बुलाइ जैसी जाहि बनी॥ 
    ते अति रुचि सौं हित मानि निज गृह गोप धनी। 
    ते निकसीं देत असीस रुचि अपनी-अपनी ॥१४॥ 

    तब घर-घर भेरि मृदंग पटह निसान बजे। 
    वर बाँधी वंदन माल कंचन कलश सजे ।। 
    ते ता दिन तें वे लोग सुख संपति न तजे। 
    कहि सूर सबन की यह गति जिन हरि चरन भजे॥१५॥४४॥

- verseNumber: "45"
  verseIntro: "असीस कौ पद-"
  verseText: |
    माई तेरौ चिरुजीवौ गोपाल। 
    बेगि बढ़ौ बढ़ि होहु वृद्ध लट महरि मनोहर ग्वाल।। 
    उपजि पस्यौ इहि कूख कमल तें सिंधु सीप ज्यों लाल। 
    सब गोकुल के प्राण जीवन धन बैरिनु के उर साल ॥ 
    सूर कितौ जिय सुख पावत है निरखत श्याम तमाल। 
    आरज रज लागौ मेरौ अँखियन रोग दोष जंजाल ।॥४५॥

- verseNumber: "46"
  verseIntro: "राग बिलावल-"
  verseText: |
    आजु नन्द के द्वारे भीर। 
    इक आवत इक जात विदा है इक ठाड़े मन्दिर के तीर ॥ 
    एकन दान देत गाइनु कौ एकन कौं पहिरावत चीर। 
    एकन माथे दूब रोचना एकन कौं वंदत है धीर । 
    एक जु वंदनमाला बाँधत पौरिन सथिया देत अहीर। 
    सूरदास मिलि सब ब्रजवासी नाचत गावत गुन गंभीर ॥४६॥

- verseNumber: "47"
  verseIntro: "राग बिलावल-"
  verseText: |
    राग आसावरी-
    देखौ अद्भुत अवगति की गति कैसौ वेष धस्यौ है हो। 
    तीन लोक जाके भवन उदर सोई सूप के कौन पस्यौ है हो ॥१॥

    जाके नाल भयौ ब्रह्मादिक सकल विस्व वस साधें हो। 
    ताकौ नाल छेदि ब्रज जुवती बाँटि तगा सौं बांधें हो ॥२॥ 

    जा मुख कौं सनकादिक तप कियौ सकल चातुरी सानैं हो। 
    सो मुख स्तन पान करावत दूध धार लपटानैं हो।॥३॥ 

    जिन श्रवनन सुनि गज की आपदा गरुड़ासन तजि धाये हो। 
    तिन श्रवनन के निकट जसोदा हरषि-हरषि हुलसाये हो ॥४॥ 

    जो व्यापक पूरन अविनासी पलना माँझ पस्यौ है हो। 
    सकल लोक जाकी आस करें सो तौ सूप के कौन पस्यौ है हो।॥५॥ 

    जिन भुज बल प्रहलाद उबारे हिरणकसिप उर फारे हो। 
    तिन भुज पकरि कहैं ब्रज जुवती ठाड़े होहु दुलारे हो।।६।। 

    सुर नर मुनि जाकौ ध्यान धरत हैं शिव समाधि नहिं टारी हो। 
    ते अब सूर प्रगट या ब्रज में गोकुल गोप विहारी हो।॥७॥४७॥

- verseNumber: "48"
  verseIntro: "राग मलार-"
  verseText: |
    री हौं तौ इक बात भली सुनि आई। 
    महरि जसोदा बालक जायौ आँगन बजत बधाई ।। 
    कहियै कहा कहत नहिं आवैं रतन भूमि सब छाई। 
    नाचत बृद्ध तरुन अरु बालक गोरस कीच मचाई ॥ 
    द्वारैं भीर गोप बालन की बरनौं कहा री बड़ाई। 
    सूरदास प्रभु अंतरजामी नन्द सुवन सुखदाई॥४८॥

- verseNumber: "49"
  verseIntro: "राग विलावल-"
  verseText: |
    मोद विनोद आजु घर नन्द। 
    कृष्णपक्ष भादौं निस आठें प्रगटे हैं गोकुल के चंद। 
    भवन द्वार गोमय वर मंडित वरषत कुसुम उमापति इंद। 
    गोपी ग्वाल परस्पर गावत पुलकित विहरत मत्त गयंद ॥ 
    बंदनवारै वृन्द मनोहर बीच बन्यौ पट कीर सुछद। 
    सूरदास हरदी दधि मधु घृत रंजित पान करत मकरंद ॥४९॥

- verseNumber: "50"
  verseIntro: "राग देवगंधार (दाई कौ वरनन)-"
  verseText: |
    जसोदा नाल न छेदन दैहौं। 
    मणिमय जटित हार ग्रीवा कौ वहै आजु हौं लैहौं। 
    औरन कैं हैं लक्ष गोप मेरैं गृह एक तुम्हारौ। 
    मिटि जु गये संताप जनम के देख्यौ नन्द दुलारौ ॥ 
    बहुत दिनन की आसा लागी झगरन झगरौ कीनौ।॥ 
    मनमें विहँसि तबै नन्दरानी हार हिये कौ दीनौ ॥ 
    जाके नाल आदि ब्रह्मादिक सकल विस्व आधार। 
    सूरदास प्रभु गोकुल प्रगटे मेंटन कौं भुव भार ॥५०॥

- verseNumber: "51"
  verseIntro: "राग देवगंधार-"
  verseText: |
    झगरन तैं हौं बहुत खिझाई। 
    कंचन थार दियौ नहि मानत तुही अनोंखी दाई । 
    बेगि तू नाल छेदि बालक कौ जात है व्यार भराई। 
    सत संजम तीरथ व्रत कीने तब यह संपति पाई॥ 
    करिये विदा जाऊँ घर अपने कहत साँझ की आई।
    सूरदास प्रभु गोकुल प्रगटे भक्तन कौं सुखदाई ॥५१॥

- verseNumber: "52"
  verseIntro: "राग आसावरी-"
  verseText: |
    धन्य जसोदा भाग तिहारौ जिन भैसौ सुत जायौ। 
    जाके दरस परस सुख तन-मन कुल कौ तिमिर नसायौ ।। 
    विप्र सुजन बन्दी चारन जन सबै नन्द गृह आये। 
    करतल सुभग दूध हरदी दधि हरषि असीस पढ़ाये। 
    गर्ग निरूप कह्यौ सब लक्षन अवगति है अविनासी। 
    सूरदास प्रभु जनम होत ही आनंदे ब्रजवासी ॥५२॥

- verseNumber: "53"
  verseIntro: "राग आसावरी-"
  verseText: |    
    मैं तौ तिहारे घर कौ ढाँढ़ी मो सरि करै को आन। 
    सोई लैहौं जोई मन भावै नन्दराइ की आन ॥ढाँढी०॥टेक॥१॥ 

    धन्य भूमि ब्रजवासी धनि-धनि आनन्द करत अभूत। 
    धन्य नन्दजू धन्य जसोदा धनि-धनि जायौ पूत ॥२॥ 

    घर-घर होत आनन्द बधाई जहाँ तहाँ मागद सूत। 
    मणि मानिक पाटंबर लै-लै देत बनै न कहूत ॥३॥ 

    हय गय सहित भंडार दिये सब फेरि भरे सब भाँति। 
    तबै देत हीं फिरि देखत ही संपति घर न समात॥४॥ 

    ते मोहि मिले जात अपने गृह मैं बूझी तब बात। 
    हँसि-हँसि दौरि मिले अंकन भरि हम तुम एकै जात।।५।। 

    संपति देहु लेंउ नहिं एकौ अन्न वस्त्र किहिं काज। 
    जो हौं तुमपै माँगन आयौ सोई लैहौं ब्रजराज ॥६॥ 

    अपने सुत कौं वदन दिखावौ बड़े महा सिरताज। 
    तुम साहिब मैं ढाँढी तुम्हरौ प्रभु मेरे नन्दराज ॥७॥ 

    कृष्ण वदन दर्शन संपति दै सो लै मैं घर जाऊँ। 
    जो संपति सनकादिक दुर्लभ सो सब तुम्हरे ठाऊँ ॥८॥ 

    जाकौं नेति-नेति श्रुति गावत तेई कमल पद ध्याऊँ। 
    हौं तौ तिहारे जनम कौ ढाँढी सूरदास मेरौ नाऊँ।॥९॥५३॥

- verseNumber: "54"
  verseIntro: "श्रीसूरदास मदनमोहनजी कृत-राग धनाश्री-"
  verseText: |   
    नन्दजू मेरे मन आनन्द भयौ हौं गोवरधन तें आयौ । 
    तुम्हरें पुत्र भयौ हौं सुनि कैं अति आतुर उठि धायौ।॥ टेक ॥ 
    बन्दीजन अरु भिक्षुक सुनि-सुनि देस-देस तें आये। 
    इक पहलैं ही आसा लागे बहुत दिनन तें छाये ।। 
    तें पहिरें कंचन मणि मुक्ता नाना वसन अनूप। 
    मोहि मिले मारग में मानौं जात कहूँ के भूप ॥१॥ 

    तुम तौ परम उदार नन्दजू जोई माँग्यौ सोई दीनौ। 
    जैसौ और कौन त्रिभुवन में तुम सरि साकौ कीनौ । 
    लक्ष देहु तौ पस्यौ रहौं हौं बिन देखे नहिं जैहौं। 
    नन्दराइ सुनि विनती मेरी तबहिं विदा भलै है हौं ।॥२॥ 

    दीजै मोहि कृपा करि सोई जो हौं आयौ माँगन। 
    जसुमति सुत अपने पाँइन चलि खेलत आवै आँगन।। 
    जब तुम मोहन कहि देरौ यह सुनि हौं घर जाऊँ। 
    हौं तौ घर कौ ढाँढी सूरदास मेरौ नाऊँ।॥३॥५४॥

- verseNumber: "55"
  verseIntro: "श्रीगोविंद स्वामीजी कृत-राग सारंग-"
  verseText: |   
    महर के मन्दिर बेगि चलौ री, नन्दरानी सुत जायौ ॥टेक॥ 
    चली जाउ उहि धाम साँमुही जाकी ऊँची पौरी ॥१॥ 

    माली बंदन माल बनाई बीच आम की मौरी। 
    देत महावर पाँइन चाइन नाइन डोलै दौरी ॥२॥ 

    उठौ सदन तें वदन पखारौ भूषन-वसन सजौ री। 
    बींधि बधायें काज पराये ढील न कीजै बौरी ॥३॥ 

    हाथन कंचन थार लेहु सजि मधि मोती सौ-सौ री। 
    गावत आवत मंगल मानौं पूजत शंकर-गौरी ॥४॥ 

    सब बनितन की सुभग मंडली सिमिटि भई इक ठौरी। 
    बालक विर्द्ध तरुन अरु तिनमें कोऊ-कोऊ लरकौरी ॥५॥ 

    उठि आईं ब्रजपति के आँगन किनहुँ न कीनी बौरी। 
    जन गोविंद बलवीर दरस की सबहिन लागी ढौरी ॥६॥५५॥

- verseNumber: "56"
  verseIntro: "श्रीअग्रदासजी कृत-राग सारंग-"
  verseText: |  
    आजु ब्रज अतिशय है आनन्द । 
    सुत जायौं घर नन्द गोप कें बिसरि गये दुख द्वंद ॥१॥ 

    झुंडन-झुंडन नारि अलंकृत मंगल गावत आईं। 
    कनक थार गोरोचन अक्षत दधि अरु दूब बँधाई॥२॥ 

    पुनि-पुनि पाँइ परत रानी के बधू परस्पर हरपैं। 
    एक कहें देखौ री देखौ सुत सोभा मुख बरषै ।।३।। 

    धाम वाम हथिया जुत साजे बंदनवार बनावैं। 
    अहली महली फिरत टहल में चंदन चौक पुरावैं ॥४॥ 

    आपुन बनैं बनावैं गोधन आये नन्द दुवारैं। 
    गोकुल मध्य भीर भई भारी गोप न पावत पारैं ।।५।। 

    विहँसि-विहँसि संपति सब खरचैं एक-एक तें आगर। 
    छिरकत हरद दही अरु माखन है व रह्यौ पय सागर ॥६॥ 

    बाजत बैन बाँसुरी महुवर जहाँ-जहाँ निर्त्तत ग्वाल। 
    हेरी दै-दै टेरि सुनावैं भयौ नन्द के लाल ॥७॥ 

    विधि विधान जो कहत गरग रिषि सोव करत ब्रजराज। 
    भूमि दान गोदान द्विजन कौं देत रतन नग बाज॥८॥ 

    मागद सुत भाट बंदीजन परिपूरन भये काम। 
    अग्रदास त्रैलोक मुदित भये कृष्ण जनम सुख धाम ॥९॥५६॥

- verseNumber: "57"
  verseIntro: "श्रीकल्यान मुकुन्दजी कृत-राग धनाश्री-"
  verseText: | 
    हौं ब्रज माँगनौं जू ब्रज तजि अनत न जाऊँ।।टेक॥ 

    बड़े-बड़े भूपति भूतल पर दाना सूर सुजान जू। 
    कर न पसारौं सीस न नाऊँ या ब्रज के अभिमान जू॥१॥ 

    सुरपति नरपति नाग लोक पति मेरे रंक समान जू। 
    भाँति-भाँति मेरी आसा पुजवत ये ब्रज जन जजमान जू॥२॥ 
    
    मैं अपनौं मन भायौ लैहौं मौकौं कत बहरावत जू । 
    औरन कौं धन घन लौं वरषत मो देखे हँसि जावत जू॥३॥ 
    
    मैं व्रत करि-करि देव मनाये अपनी घरनि सँजूत जू। 
    दियौः विधाता सब सुखदाता गोकुलपति कें पूत जू॥४॥ 
    
    अष्ट सिद्धि नव निधि मेरे मन्दिर तुव प्रताप ब्रजईस जू। 
    कहि कल्यान मुकुन्द तात कर कमल धरौ मो सीस जू॥५॥५७॥

- verseNumber: "58"
  verseIntro: "श्रीहरिकृष्णदासजी कृत-राग देवगंधार-"
  verseText: |     
    आजु बधाई गोकुल बाजत। 
    पुत्र भयौ जसुमति रानी कें विप्र वेद धुनि गाजत । 
    गृह-गृह तें आईं सुंदरि कर कंचन थारन साजत। 
    फरहरात अंचल चंचल वर अंग-अंग छबि छाजत।। 
    विविध वसन टोडर रतनन के धरे अधिक ढिंग राजत। 
    नन्दराइ लै-लै पहिरावत नाचत सकल सु भ्राजत॥ 
    उमगि कहत नर नारि सबै भैया आजु भलौ दिन लागत। 
    हरिकृष्णदास प्रभु कमल नैन की छबि निरखत दुख भागत ॥५८॥

- verseNumber: "59"
  verseIntro: "श्रीठाकुरदासजी कृत-राग आसावरी (नौमी कौ नन्दगाव में)-"
  verseText: | 
    बाला मैं जोगी जस गाया। 
    धन्य जसोदा तेरे तन कौं, जिन ऐसा सुत जाया ॥१॥ 

    गुनन बड़ौ छोटौ जिन जानौं, अलख पुरुष घर आया। 
    जाकौ ध्यान धरत हैं मुनि जन, निगमन खोज न पाया ॥२॥ 

    जो चाहै सो लीजै रावल, कीजै अपनी दाया। 
    देहु असीस मेरे या सुत कौं, बाढ़े अविचल काया ॥३॥ 

    ना लैहौं मैं पाट पटम्बर, ना लैहौं मैं कंचन माया। 
    अपने सुत कौ दरस दिखावौ, जो मोहि गुरु नें बताया।४।। 

    विनती कियें कहत नन्द रानी, सुनि जोगिन के राया। 
    तोहि न देखन दैऊँ दिगम्बर, बालक जाय डराया।।५।। 

    माता जाकी दृष्टि सकल जग ऊपर, सो क्यौं जाय डिठाया। 
    अलख पुरुष है मेरा स्वामी, सो तेरे भवन छिपाया।॥६॥ 

    बालकृष्ण कौं लाय जसोदा, करि अंचल की छाया। 
    दरसन पाय चरन रज बंदी, सींगी नाद बजाया।।७।। 

    निरखि-निरखि मुख पंकज लोचन नैनन नीर बहाया। 
    देखत बैन कहत नहिं आवत, नाटक भला बनाया।।८।। 

    ठाकुरदास महा प्रभु लीला महादेव लौ लाया। 
    लीला ललित ललित गुन अटक्यौ, चित नहीं चलत चलाया।॥९॥५९॥

- verseNumber: "60"
  verseIntro: "श्रीभगवानदासजी कृत-राग विहागरौ-"
  verseText: | 
    श्रवन सुनि सजनी बाजै मंदिलरा आजु निसि लागत परम सुहाई। 
    अति आबेस होत तन मन यह गोकुल बजत बधाई ॥१॥ 

    दै-दै कान सुनैं अरु फूलैं रावल के नर नारी। 
    ब्रजरानी ढोटा जायौ है होत कुलाहल भारी ॥२॥ 

    अति ऊँचे चढ़ि-चढ़ि टेरत हैं पसर उठे जे ग्वाला। 
    गैया बगदावौ रे भैयो भयौ महर के लाला ॥३॥ 

    खग मृग नग द्रुम दिस नभसबही दिखियत हैं सुख साने। 
    प्रानन के आयें इन्द्री ज्यौं यौं व्रजजन हुलसाने ॥४॥ 

    आनन्द भरि अकुलाइ चलीं सब सहज सुंदरी गोपीं। 
    आविर्भाव जसोदा सुत कौं तासौं तन मन ओपीं ॥५॥ 

    मंगल साज सिंगार मंगल मुख चंचल कुंडल हारा। 
    हाथन कंचन थार विराजत पग नूपुर झनकारा ॥६॥ 

    बरषत कच कुसुमन सोभित अलीं दरस चौंप जिय धाईं। 
    गावत गीत पुनीत करत जग जसुमति मन्दिर आईं।॥७॥ 

    धनि दिन धनि यह रात आजु शुभ कछु धनि-धनि कहैं गोरी। 
    स्यामसुंदर चंदहि देखत भईं अँखियाँ त्रिषित चकोरी ॥८॥ 

    सोभा जुत आईं कीरति अपने घर मानि बधायौ। 
    जाचक धन घन लौं बरषत वृषभान नन्द पै आयौ ॥९॥ 

    आइ जुरे सब गोप ओप सौं भयौ जु मन कौ भायौ। 
    पंचामृत सीसन ढोरत नाचत गहि नन्द नचायौ ॥१०॥ 

    नाचत शिव सनकादिक नारद हरद दही भरे राजैं। 
    इत निसान उत देव दुन्दुभी हरषि परस्पर बाजैं ॥११॥ 

    अति उदार ब्रजराज नन्द जिन जोई माँग्यौ सोई पायौ। 
    जाकें औसौ पूत होइ ताकौ न्याइ जगत जस छायौ ॥१२॥ 

    धुज वंदनमालानि अलंकृत नन्द भवन अति सोहै। 
    व्योम विमानन छाइ रह्यौ देखि अमरन कौ मन मोहै ॥१३॥ 

    जाकौ सुख सुमिरैं सनकादिक यौं विलसैं ब्रज ग्रेही।
    कहि भगवान हित रामराइ प्रभु प्रगट्यौ श्याम सनेही ॥१४॥६०॥

- verseNumber: "61"
  verseIntro: "राग मारू-"
  verseText: |
    ढाँढी नन्द कौ बन्यौ सुरपति की छबि जीत्यौ। 
    फूल्यौ अंग समात न सुंदर भयौ जु मन कौ चीत्यौ ॥ १ ॥ 

    सुंदर स्याम कमल दल लोचन नन्दरानी सुत जायौ। 
    यह सुनि तन मन वारि आपुनौ नन्दहि जाँचन आयौ ॥२॥ 

    जसुमति के भागन कौं बरनत मगन भयौ कहा गावै । 
    अष्ट सिद्धि नव निद्धि मुकति सब चरनन लगीं बतावैं ।।३।। 

    ढाँढी गोप सभा परसंसत सबै कृष्ण रंग भीने। 
    उनके गुन इनके गुन आगैं गाइ सुनावत हीने ॥४॥ 

    जिन जो माँग्यौ तिन सो पायौ अति उदार ब्रज ईश। 
    रामराइ प्रभु गिरधर की रज भगवानैं बकसीस॥५॥६१॥

- verseNumber: "62"
  verseIntro: "श्रीगदाधरभट्टजी कृत-राग मारू-"
  verseText: |
    आजु कहाँ तें या गोकुल में अद्भुत बरषा आई रे। 
    मणि गन हार हेम धारा की ब्रजपति अति झर लाई रे ।।१।। 

    वानी वेद वदत द्विज दादुर हियें हरख हरियारी रे। 
    दधि घृत छीर नीर नाना रंग बहि चले खार पनारी रे॥२॥ 

    पटह निसान भेरि सहनाई महा गरज की घोर रे। 
    मागद सूत वदत पिक चात्रक बोलत बन्दी मोर रे॥३॥ 

    आनन्द भरि नाचत ब्रजनारी पहिरें रंग-रंग सारी रे। 
    बरन बरन बादरन लपेटी विद्युत न्यारी-न्यारी रे ॥४॥ 

    भूषन वसन अमोल नन्द जू नारी नर पहिराये रे। 
    साखा दल फल फूलन मानौं उपवन झालर आये रे॥५॥ 

    दरिद दवानल बुझे सबन के जाचक सरवर पूरे रे। 
    बाढ़ी सुभग सुजस की सरिता दुरित तीर तरु चूरे रे॥६॥ 

    उलह्यौ ललित तमाल बाल इक भई सबन मन फूल रे।
    छाया हित अकुलाइ गदाधर तक्यौ चरन कौ मूल रे।॥७॥६२॥

- verseNumber: "63"
  verseIntro: "श्रीगोपालस्यामदासजी कृत-राग चैती गौरी (दाई वरनन)"
  verseText: |
    जसुमति बोलै हरवाई। एहो वचन सुहाई। सखी पुनि धाई। लै दाई है आई॥ 
    अहो पौढ़ी महल ब्रजरानी आनि पग परसई ॥१॥ 

    तिहिं छिन काढ्यौ है तेलै । सरस फुलेलै । तुरत सिर मेलै। खरो मत बेलै ॥ 
    अहो मरदन सुभग सुहायौ कह्यौ अनखाइ कैं ॥२॥ 

    भादौं निसि अँधियारी। घन बरषै भारी। दामिनि दुति न्यारी। वार बुध वारी ॥ 
    अहो रोहनी नक्षत्र संजोग तौ आई है सुभ घरी ॥३॥ 

    जसुमति पलक लगाई। नींद उपजाई। जोग माया आई। गयौ गर्भ विसराई ॥ 
    अहो मोह्यौ सब परिवार सु कोऊ न जागई ॥४॥ 

    वसुदेव ठाढ़े द्वारै। लियें प्रान अधारै। खुले वज्र किवारै। भयौ भवन उज्यारै ॥ 
    अहो मोहन सिज्या स्वाइ सु कन्या लै चले ॥५॥ 

    नन्दरानी तब जागी। सु अति बड़ भागी। परम अनुरागी। चरन हरि लागी ॥ 
    अहो लीने नन्द बुलाइ आइ दरसन करौ ॥ ६ ॥ 

    सुवरन भाजन मँगाये। नग रतन जराये। मन मुदित भराये। तामें लालहिं न्हवाये ॥ 
    अहो गज मोतिनु सौं पूरित दाई कौं दये।॥७॥ 

    कर जोरि बिनवै दाई। बोलत हरवाई। बातन की सुहाई। माँगत है बधाई ॥ 
    अहो देहु समद ब्रजराज बधाई लाल की॥८॥ 

    नख सिख भूषन साज। देहु ब्रजराज । पुत्र हित काज। धन्य दिन आज ॥ 
    अहो सो गहनौं नन्द रानी आइ सब सौंपियौ ।॥९॥ 

    पहिरत भई पुनीत । गाइ गुन गीत। पुजई मन चीत। देत विधि रीत ।। 
    अहो अरुन चीर परिधान तौ सोरह सिंगार लै ।।१०।। 

    अहो-अहो जसुमति गोरी। सुह्वद मन भोरी। हरि-हलधर जोरी। जिवौ जुग कोरी ॥ 
    अहो तीन लोक प्रभु होहु असीस दाई दई ।।११।। 

    जो यह दाई गावै । अति हरि मन भावै। प्रेम उपजावै। वृन्दावन बसावै।। 
    अहो दिव्य गुपाल स्याम की चरन रज पावई ॥१२॥६३॥

- verseNumber: "64"
  verseIntro: "श्रीमाधौदासजी कृत-राग चैती गौरी-"
  verseText: |
    आजु बधायौ ब्रजराज कैं। 
    अहो रानी जायौ है मोहन पूत ॥ बधावौ ०॥ टेक ॥ 

    मास भादौं द्यौस आठें रोहिनी बुधवार। 
    जसोदा की कूख जनमे कृष्ण लियौ अवतार ॥१।। 

    बहुत नारि सुहाग सुंदरि और गोप कुँवारि। 
    सजन प्रीतम नाम लै लै देत परस्पर गारि ॥२॥ 

    साथिये दीये नन्द द्वारैं सात सींक बनाइ। 
    नव किशोरी मुदित है-है लगत जसोदा जू के पाँइ ॥३॥ 

    बहुत मगन उमंग लीला करहिं गोपी ग्वाल। 
    माट माखन दूध दधि लै छिरकत सब ब्रजबाल।॥४॥ 

    करि अलंकृत गोपिका पहिराइ नौतन चीर। 
    गाइ बच्छ सिंगार लाये ग्वालन की भई भीर ॥५॥ 

    एक हेरी दै-दै नाचें एक भेंटहिं धाइ । 
    एक वदत न गनत काहू एक खिलावत गाइ॥६॥ 

    एक तरुन किशोर बाला एक जोवन जोग। 
    कृष्ण जनमत प्रेम सागर क्रीड़त ब्रज के लोग।॥७॥ 

    पुत्र मानौं भये घर-घर निर्त्त ठावैं ठाँव। 
    नन्द द्वारैं भेट लै-लै उमह्यौ है गोकुल गाँव॥८॥ 

    चौक चंदन पूरि कैं आरतौ धस्यौ है सँजोइ। 
    कहत गोप कुँवारि औसौ मंगल जो नित होइ ॥९॥ 

    मुकुंद के प्रभु नित्त नौतन करौ भोग विलास। 
    देखि व्रज की संपदा जन फूले हैं माधौदास ॥१०॥६४॥ 

- verseNumber: "65"
  verseIntro: "श्रीनन्ददासजी कृत-राग आसावरी (नौमी के दिन)"
  verseText: |
    सुंदर ब्रज की बाला, जुरि चलीं हैं बधाये नन्द महर घर। 
    कंचन थार हार चंचल छबि कही न परत तिहिं काला॥ जुरि चली ०॥टेक ॥१॥ 

    डहडहे मुख कुमकुम रँग रंजित राजत रस के भैना। 
    कंजन पर खेलत जुग खंजन अंजन जुत बने नैना ॥२॥ 

    दमकत कंठ पदिक मणि कुंडल नवल प्रेम रस बोरी। 
    आतुर गति जैसैं चंद उदै भये धावत त्रिषित चकोरी ॥३॥ 

    खसि-खसि परत कुसुम सीमन तें उपमा कौन बखानौं। 
    चरन चलन पर रीझि चिकुर वर बरषत फूलन मानौं ॥४॥ 

    गावत गीत पुनीत करत जग जसुमति मन्दिर आईं। 
    वदन विलोकि बलैयाँ लै-लै देत असीस सुहाई ॥५॥ 

    मंगल कलश निकट दीपावलि ठाँइ-ठाँइ देखि मन भूल्यौ। 
    माँनहुँ आगम नन्द सुवन के सौने फूल ब्रज फूल्यौ ॥६॥ 

    ता पाछें गन गोप ओप सौं आये अतिसै सोहैं। 
    परमानन्द कंद रस भीने निकर पुरंदर को हैं॥७॥ 

    आनन्द घन ज्यौं गाजत राजत बाजत दुन्दुभी भेरी। 
    राग रागिनी गावत हरषत बरषत सुख की ढेरी ॥८॥

    परम धाम सुख धाम स्याम अभिराम सुगोकुल आये। 
    मिटि गये द्वंद नन्ददासन के भये मनोरथ भाये ॥९॥६५॥

- verseNumber: "66"
  verseIntro: "राग धनाश्री-"
  verseText: |
    आजु बधाई री माई। 
    ब्रज की नारि सबै मिलि आईं।।१।। 

    सुंदर नन्द महर जू के मन्दिर। 
    प्रगट्यौ पूत सकल सुख कंदर ॥२॥ 

    जनमत ढोटा ब्रज की सोभा। 
    देखहु सखी कछु औरै ओभा॥३॥ 

    द्वार बुहारत फिरत अष्ट सिधि। 
    कौरिन सथिया चीतत नव निधि ॥४॥

    लक्ष्मी-सी जहाँ मालिन लोलै। 
    बंदन माला बाँधत डोलै ॥५॥ 

    कंचन कलश जगमगे नग के। 
    भागे सकल अमंगल जग के ॥ ६ ॥

    गृह-गृह तैं गोपी गवनीं जब। 
    रँगीली गलिन बिच भीर भई तब।।७।। 

    हाथन कंचन थार रहे लसि। 
    कमलनि चढ़ि आये मानौं ससि ।।८।। 

    बीथी प्रेम नदी छबि पावैं। 
    नन्द सदन सागर कौं धावैं ॥९॥ 

    परम उदार नन्द रस भीने। 
    परबत सात रतन के दीने ॥१०॥ 

    कामधेनु तें नैंकु न हीनी। 
    द्वै लख धेनु द्विजन कौं दीनी॥११॥
    
    फूले ग्वाल मनौं रन जीते। 
    भये सबन के मन के चीते ।।१२।। 

    नन्द द्वार जे माँगन आये। 
    ते बहुस्यौ माँगन न कहाये ॥१३॥ 

    घर के ठाकुर कैं सुत जायौं। 
    नन्ददास तहाँ सब कछु पायौ।॥१४॥६६॥

- verseNumber: "67"
  verseIntro: "श्रीपरमानन्ददासजी कृत-राग देवगंधार-"
  verseText: |
    आजु नन्द कैं आनन्द भायौ। 
    नाँचत गोपी ग्वाल परस्पर मंगलचार बधायौ ॥१॥ 

    राती पीरी चोली पहिरैं नौतन झूमक सारी। 
    चोबा चंदन अंग लगाए सैंदुर माँग सँवारी॥२॥ 

    माखन दूध दही भरि भाजन सकल गोप लै आए। 
    बाजत बैन विशाल महुवरी गावत गीत सुहाए॥३॥ 
    
    हरद दूध अक्षत दधि कुमकुम आँगन बाढ़ी कीच। 
    हँसत परस्पर प्रेम मगन तन लागि-लागि भुज बीच॥४॥ 
    
    चहूँ वेद धुनि करत महामुनि पंच शब्द धुनि बोल। 
    परमानन्द बढ्यौ गोकुल में आनन्द हृदै कलोल॥५॥६७॥

- verseNumber: "68"
  verseIntro: "राग सारंग-"
  verseText: |
    आज बधाई कौ दिन नीकौ। 
    नन्द घरनि जसुमति जायौ है लाल भाँवतौ जीकौ ॥१॥ 

    पंच शब्द बाजे बाजत घर-घर तें आयौ टीकौ। 
    मंगल कलश लियें ब्रज सुंदरि ग्वाल बनावत छीकौ॥२॥ 

    देत असीस सकल ब्रज सुंदरि जीवौ कोटि बरीसौ। 
    परमानन्ददास कौ ठाकुर गोप वेष जगदीसौ ॥३॥६८॥

- verseNumber: "69"
  verseIntro: "राग सारंग-"
  verseText: |
    यह धन धर्म ही तें पायौ। 
    नीकै राखि जसोदा मैया नारायण गृह आयौ ॥१॥ 

    जा धन कौं मुनि तप साधत हैं वेद उपनिषद गायौ। 
    सोई धन बसत क्षीर सागर में ब्रह्मा जाइ जगायौ ॥२॥ 

    जा धन कौं खोजत सनकादिक नारद मुनि जन गायौ। 
    सोई धन भक्तन प्रतिपालक जसुदा हाथ बँधायौ ॥३॥ 

    जोई धन भक्तन के बस सब बिगरे काज सँवारै। 
    सो धन हिये दास परमानन्द बारहूँ बार सम्हारै ॥४॥६९॥

- verseNumber: "70"
  verseIntro: "राग धनाश्री-"
  verseText: |
    ब्रज रानी आपुन मंगल गावै । 
    आजु लाल कौ जनम द्यौस है मोतिनु चौक पुरावै ॥ 

    गाँव-गाँव तें ग्याति आपनी ग्वालन न्योति बुलावै। 
    नाम करन कौं गरग परासर तिनपै वेद पढ़ावै।। 

    हरद दूव दधि अक्षत रोरी सबके सीस धरावै।
    अपने लाल पर करि न्यौछावर जन परमानन्द पावै॥७०॥

- verseNumber: "71"
  verseIntro: "राग सारंग-"
  verseText: |
    गोकुल में बाजत कहा बधाई। 
    भीर भई अति नन्द दुवारैं अष्ट सिद्धि महा आई ॥ 

    ब्रह्मादिक इन्द्रादिक जाकी चरन रेनु नहीं पाई। 
    सोई नन्द कौ पुत्र कहावत कौतुक सुनि मेरी माई॥ 

    ध्रुव अंबरीष प्रहलाद विभीषन नित्य महातम गाई। 
    सो हरि परमानन्द कौ ठाकुर ब्रज जन केलि कराई ॥७१॥

- verseNumber: "72"
  verseIntro: "श्रीनागरीदासजी कृत-राग काफी (नागरियाजी )-"
  verseText: |
    बाजैं बधाइयाँ वो सैंयो नन्द दे दरबार। 
    हुवा सुत सोहना वो मनदा मोहना सुकुँवार ॥ 
    आई सब गोपियाँ वो हिलमिल गावैंदी खुसियाल॥ 
    जुरे सब लोक मंगल वो गुनी गन बोलैं दै-दै ताल ॥ 

    गुनी दै लाला नाचैं ।। वाह वा।। 
    आँगन पहपट माचें।। वाह वा॥ 
    खुसी दिल पावाँ झूमा। वाह वा। 
    लाल दी टुन्नी चूमाँ। वाह वा ॥ 
    उसीदा मंगल गावाँ।। वाह वा।। 
    दान दुपट्टे पावाँ । वाह वा ।। 

    पावा पट दान मोती वो जावाँ दिल फूल दे घर माँहि ॥ 
    असाढा हथ्य टोडर वो बाजूबन्द झूल दै बिच बाँह ॥ 
    तुझ पर घोलियाँ वो जसोदे बोलियाँ दे सुनाय॥ 
    धनि-धनि आजदा दिन वो देदी दान क्यौं न मँगाइ।। 

    महरि ने दान मँगाया।। वाह वा॥ 
    कंचन झर बरषाया।। वाह वा॥ 
    है बड़भागिन तूरी।। वाह वा॥
    करी मुरादाँ पूरी ॥ वाह वा ॥ 
    बीच खुशी दिन गाढ़े। वाह वा। 
    मंगल मुखी तुसाढे ॥ वाह वा ।। 
    जनम जनम गुन गावाँ ॥ वाह वा ।। 
    नागर दरसन पावाँ ।। वाह वा ॥७२॥

- verseNumber: "73"
  verseIntro: "श्रीनागरीदासजी कृत-राग काफी (नागरियाजी )-"
  verseText: |
    आजु ब्रजराज कैं सुत भयौ सुनि सखी, 
    उमग उपहार लै चल्यौ महरावनौं। 

    थार कर हार भर भार लचकत लंक, 
    वसन असम्हार उर फब्यौ फहरावनौं ॥ 

    इतहिं सुनि गान अरु मंगल निसान धुनि उतहिं नीकौ लगत घनन घहरावनौं। 
    नागरीदास ब्रजचंद प्रगटत भयौ नन्द हिय सिंधु आनन्द लहराबनौं ॥७३॥ 

- verseNumber: "74"
  verseIntro: "कवित्त-"
  verseText: |
    नन्द गोपराज अहो औरैं ब्रज ओप आज तेरे पुत्र भयौ भैया पुन्य फल जाप कौ। 
    ब्रह्मा रिषि द्वारा बहु देवता विमानन पै छायौ सुर वेद गान भेद के अलाप कौ ॥ 

    घर-घर संपदा अपार बढ़ी देखियत हम पै न कीनों जात बर्नन प्रताप कौ। 
    नागरिया बेर-बेर ग्वार कहैं टेर-टेर तेरौ घर मानों परमेश्वर के बाप कौ॥७४॥

- verseNumber: "75"
  verseIntro: "कवित्त-"
  verseText: |
    अबहीं नेकु पौढ़ीं हैं ब्रजरानी। 
    पुत्र जनम उत्सव रस सानी आनन्दित अरसानी ॥ 
    लालन हू पालन में सोये अबहीं कर पय पानी। 
    नागरि गोपी गान मनोहर फिर करियौ सुखदानी॥७५॥

- verseNumber: "76"
  verseIntro: "कवित्त-"
  verseText: |
    हेली आजु की घरी छिन भलियाँ। 
    घन आनन्द सकल ब्रज बरसत जसुमति बेलि सुफलियाँ ।। 
    पूरन काम श्याम तन प्रगटे हिय आनन्द कलमलियाँ। 
    नागरिया मूरति अति लौंनी हौंनी हैं रँग रलियाँ ॥ ७६ ॥

- verseNumber: "77"
  verseIntro: "श्रीब्रजनिधिजी कृत-बधाई-"
  verseText: |
    आज उन्मादियाँ वे बधाई दै दाँ ब्रज भूपाल। 
    हुआ ब्रज चन्द छौना वे सलौना साँवला गोपाल ॥ 
    ब्रज में सादियाँ वे कराई जादियाँ कुल रीति । 
    उतारैं नोंन राई वे सखी सब गावैं मंगल गीत॥ 

    सखी सब मंगल गावैं॥ वाह वा ॥ 
    गुणी मिल चोहल मचावैं॥ वाह वा॥ 
    बजावैं ढोलक झाँझैं । वाह वा॥ 
    मजे से गावैं माँझें । वाह वा ॥ 
    सुनावैं बात अछूती ।। वाह वा॥ 
    सदा तू रहौ सपूती। वाह वा।। 
    लाल के सदकें जावाँ ।। वाह वा॥ 
    कुँवर पर घोल घुमावाँ। वाह वा॥ 

    इस दी बलाईयाँ वे परौ खारे समुंदर जाइ। 
    रहौ दिन रात खुशियाँ वे लड़ावौ लाड़ गोकुल राय ॥ 
    करौ नित रंग रलियाँ वे खिलावैं कान्है कंठ लगाय। 
    यहै अरदास मैं दीवे तुसाढ़ा कुँवर नें दिखलाय॥ 

    खुलाया माल खजाना।। वाह वा ।। 
    लुटाया माल अमाना।। वाह वा॥ 
    भरे सो भये न रीते। वाह वा॥ 
    गुणी सब भये निचीते॥ वाह वा। 
    कहीं वे फेर न नच्चे ।।। वाह वा ॥ 
    भये हैं ब्रज निधि सच्चे। वाह वा॥७७॥

- verseNumber: "78"
  verseIntro: "श्रीकृष्णजीवनजी कृत-बधाई (नकल ढाढी व गान)-"
  verseText: |
    मोहि नन्द घर लै चलौ ढाँढ़िनियाँ मचल रही।॥ टेक ॥ 

    पुत्र भयौ सब जग नें जानी, तैनें मोसों नाय कही। 
    मोहि मिलैगौ नख सिख लौं गहनौं लाऊँ तौ बात सही। 
    जरदोजी के वस्त्र मिलेंगें फरिया चोली नई। 
    कृष्ण जीवन बिन सब जग सून्यौ जिन मेरी बाँह गही।॥७८॥

- verseNumber: "79"
  verseIntro: "भाँड़-"
  verseText: |
    गोप सभा में आये भँडेला सबकी नकल बनावैं। 
    जैसौ जाकौ होवै मौढ़ौ तैसौ ताहि दिखावैं ।। 
    हम प्रोहित जिजमान बानियाँ कबहु न न्यौत जिमावैं। 
    वृन्दावन हित रूप लाल के विमल-विमल जस गावैं॥७९॥

- verseNumber: "80"
  verseIntro: "पद-"
  verseText: |
    नन्द के आनन्द भये जय कन्हैया लाल की। 
    हाथी दिये घोड़ा दिये और दीनी पालकी ॥ 
    साल दिये दोसा दियौ वह भी नई मोल की। 
    पाट दिये पाटम्बर दिये वह भी सवा लाख की। 
    बहली और छकडे दिये वह भी नये हाल की। 
    वाह वाहजी, वाह वाहजी, वाह वाहजी॥८०॥

- verseNumber: "81"
  verseIntro: "श्रीआनन्दघनजी कृत-बधाई-"
  verseText: |
    गोकुल बधाई माई बगर-बगर। 
    प्रेम चुहल मची डगर-डगर॥ 
    ब्रज कौ चन्द नन्द प्रगट्यौ चहूँ दिस होत जोति जगर-जगर। 
    सोभा सदन वदन मोहन कौ देखि-देखि जिय ढगर-ढगर॥ 
    जसुमति भाग धन्य आनन्दघन जस कौ वितान छायौ नगर-नगर ॥८१॥

- verseNumber: "82"
  verseIntro: "श्रीचतुर्भुजदासजी कृत-राग देवगंधार-"
  verseText: |
    नैन भरि देखौ नन्द कुमार। 
    जसुमति कूख चन्द्रमा प्रगट्यौ या ब्रज कौ उजियार ।। 

    वन जिनि जाहु भैया रे लावौ गो सुत गाइ रु ग्वार। 
    अपने अपने भेष सबै बनि लावौ विविध सिंगार ।। 

    हरद दूव अक्षत दधि कुमकुम मंडित करहू दुवार। 
    पूरौ चौक विविध मुक्तावलि गावहु मंगल चार।। 

    करत वेद धुनि सबै महा मुनि होत नक्षत्र विचार। 
    ऊग्यो पुन्य कौ पुंज साँवरौ सकल सिद्धि दातार।। 

    गोकुल बधू निरखि आनंदित सुन्दरता कौ सार। 
    दास चतुर्भुज प्रभु चिरुजीवौ गिरिधर प्रान अधार ॥८२॥

- verseNumber: "83"
  verseIntro: "श्रीप्रेमदासजी कृत-कवित्त-"
  verseText: |
    एक नव रस रूप लाल प्रगट्यौ है शुभकाल, 
    लोचन विशाल देखौ कहा नीकौ लाल है। 
    चल हैं मराल चाल सोहैगी गुंज माल, 
    बैरिन कौ उर साल संतन कौ पाल है। 
    कीरति की सुता बाल जोरी जुर है रसाल, 
    जैसे हेम डाल और साँवरौ तमाल है। 
    सुनौं नन्द तत्काल कोई प्रेम रूप जाल, 
    ग्वालन के नाल खेल करैगौ निहाल है॥८३॥

- verseNumber: "84"
  verseIntro: "श्रीनारायणदासजी कृत-"
  verseText: |
    नन्दजू तेरै सुख दुख गयौ सबन कौ देव पितर भलौ मान्यौ । 
    तेरौ पुत्र प्रान सबही कौ भुवन चतुर्दश जान्यौ॥ 

    हौं तेरौ वृद्ध पुरातन ढाँढी नाम सुनै सुख पाऊँ। 
    गिरि गोवर्धन वास हमारौ गिरि तज अनत न जाऊँ॥ 

    ढाँढिन मेरी झाँझ बजावै हौंहूँ हुरक बजाऊँ। 
    मेरौ चीत्यौ भयौ तिहारें जो जाचौं सो पाऊँ॥ 

    अब तुम मोकौं करौं अजाची जो कहू करन पसारौं। 
    द्वारे देह एक मोहि मन्दिर श्याम सुरूप निहारौं॥

    महा प्रसाद तिहारे घर कौ बिनु माग्यौ जो पाऊँ। 
    जब-जब जनम धरौं ढाँढी कौ जनम करम गुन गाऊँ॥

    लै ढाँढी कंचन मणि मुक्ता और वसन मन भाये। 
    टोडर और पटंबर अंबर मोहि सबै पहिराये॥

    हँस बोली ढाँढिन ढाँढी सों अब कछु बरन बधाई। 
    ऐसौ दियौ न दैहै कोऊ जैसी जसुमति हौं पहिराई॥ 

    हौं पहिरी पहिस्यौ मेरौ ढाँढी दान मान की थान। 
    नन्द उदार भये पहिरावत जनम करम रुचि मान॥ 

    बालक बली भयौ नारायन दास निरख निधि पाई। 
    भक्ति करौं पालने झुलाऊँ यह मन अनत न जाई ॥८४॥

- verseNumber: "85"
  verseIntro: "चाचा वृन्दावनदासजी कृत-राग विलावल-"
  verseText: |
    इहि ब्रज घर-घर आजु बधाई। 
    नन्द सदन नभ चन्द उदै भयौ मिट्यौ ताप तम जग कौ माई॥

    सुकृत पुंज सुत जसुमति जायौ बरनौं कहा बड़ भाग निकाई। 
    प्रफुलित गोपी गोप कुमुद गन त्रिभुवन सुजस चाँदनी छाई॥ 

    दान मान द्विज गुरु पद बंदे ब्रजपति सबकी आस पुजाई। 
    बलि हित रूप सकल सुख मन्दिर वृन्दावन हित कुँवर कन्हाई॥८५॥

- verseNumber: "86"
  verseIntro: "राग आसावरी ताल रूपक-"
  verseText: |
    भूर भाग ब्रज गोपी, आजु सब सुख ओपी । 
    कृष्ण जनम दिन आतुर धाईं देत बधाई जिन कुल थूनी रोपी ॥ 
    कृष्ण जनम दिन ॥ टेक ॥१॥ 

    लखि मषि रेख विशेष ठनी दृग गोकुल गलिनु रवानी। 
    भूषन वसन लसनि अंगन की उपमा लखि बिलखानी ॥ २ ॥

    अति कमनी गवनी गति भामिनि अभिरामिनि
    नव बाला। मानौं घन घनश्याम ऊँनये दरसी दामिनि माला॥३॥

    सौरभ स्वाद नदत अलि आवत उपमा बरनौं आछै । 
    मानौं देह चली हरि देखन प्रान पुकारत पाछें ॥४॥ 

    गान रचत कटि लचत मचत छबि नचत नासिकन मोती। 
    मानौं कृष्ण उदित गोकुल विधु चले हैं जुहारी गोती ॥५॥

    सीस फूल चंद्रिका चलन में हलन भली छबि पाई। 
    हरि प्रगटत सौभाग्य मंजरी कै रूप धुजा फहराई॥६॥ 

    फूले वदन चपल गति लोचन लट ताटंक बिलोलैं।
    मानौं राहु दिनेश कमल ससि नन्द सदन सँग डोलैं।॥७॥ 

    कर वर भेंट सोहिले गावैं जसुमति कूख मल्हावैं। 
    रति ठकुराइन-सी ब्रज बनिता नन्द भवन कौं आवैं ॥८॥ 

    मन्दिर पैठि स्याम अवलोके करज चटक मन फूलीं। 
    मनु आनन्द हिंडोर रच्यौ विधि प्रेम हिलोरन झूलीं ॥९॥

    इक दिस ओप गोप गन राजैं गाजैं जाचक द्वारें। 
    चाहत नहीं अष्ट सिधि नव निधि जद्यपि लागीं लारें ॥१०॥

    जा लीला कौं रमा उमा नित दरस चाह मन माहीं। 
    ता गृह दान मान को बरनैं सारद विधि सकुचाहीं ॥११॥ 

    देत अखिल आनन्द स्याम घन प्रमुदित गोप कुमारा। 
    वृन्दावन हित रूप स्वामि की लीला ललित उदारा ॥१२॥८६॥

- verseNumber: "87"
  verseIntro: "राग आसावरी-"
  verseText: |
    ए चलि ब्रजपति मन्दिर बेगि मोहन जनम लियौ। 
    आजु मंगल विपुल उदोत घर-घर घोष कियौ। 
    दृग देखन कौ जो लाभ विधि वांछित जु दियौ। 
    अँग-अंग परम अभिराम महरि सिसु हरत हियौ ॥१॥ 

    वे करि-करि सुभग सिंगार घर-घर तें उमहीं। 
    इक आतुर है तिहि काल उठि उठि गैल गहीं।॥ 
    इक सुनत भईं वस प्रेम जे छिन गनत रहीं। 
    वर बानक बनिता वृन्द बरनी जात नहीं॥२॥ 

    धन न्यारौ प्यारौ एक खरचन लै जु चली। 
    इक मंगल साज बनाइ सोभित करत गली॥ 
    इक मल्हकि मल्हावत आज हरि ससि उगन थली। 
    वर बीथिनु सोभा भीर बाढ़ी रंग रली ॥३॥ 

    इक निरखन के चित चाइ मारुत गति गवनी। 
    जहाँ उड़े हैं असुभ तृन तूर निधि सिधि वरषि घनी॥ 
    दुलरावत जसुमत कूख वल्लव कुल रवनी। 
    उनयौ धाराधर रूप सींचत दूग अवनी ॥४॥ 

    मिलि गई हैं महरि के धाम धनि-धनि कहत भईं। 
    अवलोकत सुंदर स्याम तन सुध विसर गईं। 
    अति मोहन सोहन रूप सब आश्चर्य मई। 
    ते बिनवत हैं कर जोरि भाग्यनु दयौ दई ॥५॥ 

    सब देत बधाई ताहि विधि दाहिनौं भयौ। 
    जाके पुत्र जनम जग माहिं दुख दुरि-दुरि गयौ ॥ 
    ब्रज भस्यौ परम अनुराग पुर-पुर मोद नयौ। 
    रुचि बरषत कुसुमन देव व्योम विमान छ्यौ ।। ६ ।। 

    गोकुल पति सदन सुदेश रचना विविध रची। 
    मणि माणिक कुंदन माहिं मन्दिर - अजिर खची ।। 
    मनु रमा रवन पुर जीति सोभा आनि सची। 
    तहाँ प्रमुदित गोपी ग्वाल हरद दधि कीच मची॥७॥ 
    
    द्विज सोधत ज्योतिष भेद लगन नक्षत्र सबै। 
    संकल्पत गोधन वृन्द नन्द उदार तबै।। 
    रथ हय गय भवन भंडार देत सम्हारि अबै। 
    ब्रजईश दोऊ कर जोरि विप्रन चरन नवै ॥८॥ 
    
    यह हितू हेत की बात सुनि कीरति धाई। 
    तब निज पुर सहित समाज जसुमति गृह आई॥ 
    अति करत महरि सनमान जब यह सुध पाई। 
    मिलि बाढ्यौ अतिसै रंग मोहन लखि माई ॥९॥ 
    
    रावल पति गोकुल राइ कंचन झर बरसैं। 
    सर सरिता जाचक वृन्द पूरन है सरसैं ।। 
    दोऊ सजन सच्चिदानन्द रूप दृगनि परसैं। 
    सुख प्रापत पूरन काम मिलि चित आकरपैं ॥ १०॥ 

    पट भूषन वारत देत रावल पति घरनी। 
    अति सजल नैन भरि भेटत जग मंगल करनी ॥ 
    हरि जननी जनक महामुनि महिमा मन हरनी। 
    ब्रजरानी अति बड़भाग निगमन हू बरनी ॥११॥ 
    
    कहुँ चाइनु खेलत गाइ थनन तें दूध श्रये । 
    कहुँ हेरी गावत ग्वाल निर्त्तत नाच नये ।। 
    कहुँ रचना कौतिक रूप ठाठ विचित्र ठये। 
    कहुँ मान सहित बहु दान वन्दी जनन दये ॥१२॥ 
    
    पहिराईं गोपी गोप. जाचक और जिते। 
    मणि भूषन वसन अमोल गनत न बनत तिते ।। 
    दिये खोल कनक नग कोष बरनौं साज किते। 
    गोकुल पति पुन्न प्रताप रंचक नाहिं रिते ।।१३।।

    जस गावत चारन भाट अपने भवन चले। 
    बनिता मुरि देति असीस बोलत वचन भले ।। 
    जियौ जुग जुग गोकुल चंद जसुमति भाग फले। 
    ब्रज देहु अखिल-आनन्द सबके दूरित दले ॥१४॥ 
    
    श्री कृष्ण जनम ब्रजराज मन्दिर होत अरी। 
    सुख संपति नव निधि सिद्धि घर-घर सुभर भरी।। 
    नित बंदौं हरि हित रूप चरित सरिता गहरी। 
    वृन्दावन हित व्रज-भूमि लीला ललित करी ॥१५॥८७॥

- verseNumber: "88"
  verseIntro: "राग धनाश्री ताल रूपक आड़-चौतालौं (श्रीजसोदांजू को दसमास गर्भ बरनन)-"
  verseText: |
    मेरे री मन कौ भायौ आजु । 
    नन्द घर सोहिलौ ।। 
    नाचि हौं मणि अजिर मुरि-मुरि सफल भये सब काज।
    नन्द घर सोहिलौ ॥ टेक ॥ 

    श्री कृष्ण जसुमति गर्भ आये प्रथम मास पुनीत। 
    ता दिन तें मन दै रमापति मैं भजे रस रीति ॥ 
    मास दूजे सगुन मोकौं सब भये चित चीत। 
    अब भयौ विधि दाहिनौं नित गाइहौं मंगल गीत ॥ नन्द घर० ॥१॥ 

    मास तीजौ लगत हरषी हौं सहित परिवार। 
    इष्ट कौं आराधि सुचि रुचि करौं यही विचार॥ 
    होहि सुत ब्रजईश कैं सब जनन प्रान अधार। 
    जाइ मुख लखि ताप तन कौ बिनवत बारहूँ बार।। नन्द घर० ॥२॥ 

    मास चौथें मैं मनायौ देव ब्रज गिरि राइ। 
    दूध काचे नित न्हवाऊँ भोग पाक धराइ ॥ 
    तिन दियौ वर मोहि साँचौ सबहि भेद बताइ। 
    जा चरित प्यारे देव मुनि सो प्रगटै महर घर आइ ॥ नन्द घर० ।।३।। 

    पाँचये मास विचारि जसुमति मोहि निकट बुलाइ। 
    कियौ मंगल भूर सकल सवासिनी पहिराइ ॥ 
    द्विजन कौं बहु दान दीयौ आसिका पढ़वाइ। 
    पुत्र फल तुम लहौ रानी नारायन जु सहाइ ।। नन्द घर० ।।४।। 

    छह मास बीते छबि न थोरी नन्द घरनी अंग।  
    कुंदन अमल मनु छिप्यौ झलकै स्याम नग कौ रंग।। 
    सोभा न बरनी जाइ जा उर दिपत कृष्ण अभंग। 
    सातयें मास अनेक बनिता सेवत मन दै संग।। नन्द घर०॥५॥ 

    आठवें मास विलोकि ब्रज पति भवन बानिक नई। 
    मंगल अमित अंकुरित जित कित भूमि हरषित भई॥ 
    पय श्रवत सुरभी आपु रस हरि जनम आगम ठई। 
    बड़ भाग विप्र प्रसाद जसुमति लखि आनन्द छई। नन्द घर०॥६॥ 

    नवयें मास गये सबनि के ताप तन मन दूरि। 
    अष्ट सिद्धि नव निद्धि घर-घर रही ब्रज में पूरि ॥ 
    अभिलाष दूग नियरे भये सब दुरित डारे चूरि। 
    नन्द मन्दिर दास दासी सब फिरैं प्रेम गरूर ॥ नन्द घर०॥७॥ 
    
    आरम्भ दसयौं मास भादौं अष्टमी अधरात। 
    दमकैं तौ दामिनि मेघ बरपैं ऊनई घन पाँति ॥ 
    जनमत ब्रजेश कुमार आनन्द कह्यौ कापै जात। 
    सब लोक अपु वस बजे बाजे जे जहाँ जिहि भाँति ।। नन्द घर०॥८॥ 
    
    दै मान ब्रजपति विप्र बोले जनमपत्र लिखाइ। 
    बहु दान विधि सौं धेनु दीनी प्रेम सागर न्हाइ ॥ 
    आईं सकल पुर बधू मंगल साज विविध बनाइ। 
    अवलोकि लौनौं ललन कौ मुख वंर्दै महरिजू के पाँइ ॥ नन्द घर०॥९॥ 
    
    ब्रजराज अनुजा धरत कौरिनु साथिये हित मान। 
    इक बाँधि बंदन बार जलज वितान रुचि सौं तान।। 
    इक महरि कूख मल्हावहीं रस रीति सौं करि गान। 
    इक रीझि वारत आपनौं धन विपुल बढ़वत मान॥ नन्द घर० ॥१०॥ 
    
    व्रत नेम साधन गिरि-अराधन फली मेरी आस । 
    अब देहु जसुमति नन्द मो मन भाँवतौ गृह वास ॥ 
    टहल चित चाइनु करौं सुत निरखि अधिक हुलास। 
    वृन्दावन हित रूप वन्दौं कीरति पठइ हौं पास ॥ नन्द घर सोहिलौ ॥११॥८८॥

- verseNumber: "89"
  verseIntro: "राग धनाश्री ताल मूल (जगा बरनन)"
  verseText: |
    लैहौं मन भाँवतौ भयौ कुल मंडन सुंदर स्याम। 
    हौं कुल जगा उदौ नित चाहौं पोथी लिखिहौं नाम ॥ टेक ॥ 

    गोप वंश कौं जाचौं राचौं ब्रज मंडल में वास । 
    पुत्र बड़े घर भयौ सुनत मो हिय में बढ्‌यौ हुलास ॥ 
    गोकुल ग्राम भवन ब्रजपति कैं दरस्यौ विपुल प्रकाश। 
    भयौ कुल इष्ट दाहिनौं मोकौं सब विधि पूजी आस ॥ लैहौं० ॥१॥ 

    लला नाम लिखवाई लैहौं बड़े खिरक भरि गाइ। 
    सब पहिले जु ख्यात की दीजै गल घंटा पहिराइ ॥ 
    सिर मणि पट्टी पगन पैजनीं देहु इक बरन मँगाइ। 
    सुन्दर ग्वाल संग करि देहु जे लावैं दूध दुहाइ॥ लैहौ० ॥२॥ 

    दादी नाम वरेयसी रानी दादौ श्री परजन्य। 
    देवमीढ़ परदादौ सो जदुवंश भयौ उतपन्य॥ 
    नन्द महा मति पिता जसोमति जननी भई धनि धन्य । 
    सुत सोहिले दान आदर सौं देहु मो व्रत जु अनन्य ॥ लैहौं० ॥३॥ 

    ब्रजपति सुतहि गोद लै बैठे सादर जगा बुलायौ। 
    सोधि सुभ घरी चौक पूरि मणि पट्टा महरि बिछायौ ।। 
    मंगल गावत वधू रोहिनी आगें अरघ बढ़ायौ। 
    कर गहि कैं उपनन्द महा मन मुदित है जु बैठायौ ।। लैहौं० ॥४॥ 

    बड़ौ नगर इक देहु महाराजा तब हौं पोथी खोलौं। 
    कनक रतन अनगिनती देहु भरि-भरि जु तराजू तोलौं । 
    कृष्ण जनक कौं जाँचि कहा अब गाम-गाम हौं डोलौं। 
    यह दत पाइ घोष पति घर तें विरद सोम कुलं बोलौं ।॥ लैहौं ।॥५॥ 

    जगा नाम पोथी में लिखि गोपन तें वांछित पायौ। 
    महरि वारि दीने मणि भूषन पुनि बागौ पहिरायौ ।। 
    इच्छा भोजन दै बड़भागिन बूढ़ौ जगा जिमायौ। 
    सुखित भयौ सब भाँति आसिका दै हिय अधिक सिहायौ ।। लैहौं० ॥६॥ 

    सुमुख नाम नाना कौ लिखि कैं लिखी जु पटुला नानी। 
    जिनकी सुता परम बड़भागिन नन्द महर की रानी ॥ 
    ताकै सुत त्रैलोक्य महामणि जा गति निगम न जानी। 
    छकि गयौ वदन विलोकि लाल कौ गदगद निसरत बानी।। लैहौं० ॥७॥ 

    पीहर पूरी की कल कीरति बरनि असीस सुनाई। 
    बड़े सजन घर होहि बेगि दै रानी सुत जु सगाई ॥ 
    श्रीहरिवंश प्रसंस करन कौं जोरी विधि जु बनाई। 
    वृन्दावन हित रूप मोहि यह सगुन परीक्षा आई ॥ लैहौं० ॥८॥८९॥

- verseNumber: "90"
  verseIntro: "राग काफी (भाँड़ बरनन)"
  verseText: |
    हाँ छगन मगनुवा जीवौ । 
    हाँ लला पयं धापि जु पीवौ ॥१॥

    हाँ भाग्य भाँड़न के आयौ। 
    हाँ सवन पै दान दिवायौ ॥२॥

    हाँ उदार लला की मौसी । 
    हाँ फिरत है हौंसी-हौंसी ॥३॥ 

    हाँ बहुत आदर दै बोली। 
    हाँ पँजीरी भरि दई ओली ॥४॥

    हाँ नइनियाँ पहपट दैनी। 
    हाँ करत कछु सैना-बैनी ॥५॥

    हाँ पुजायौ दाई खपरा। 
    हाँ लियौ भरि धन सौं टपरा॥६॥

    हाँ मलिनिया डोलत रूरी। 
    हाँ अधिक भागन की पूरी ॥७॥

    हाँ महर घर मिली बधाई। 
    हाँ प्रेम छकि गई महाई ॥८॥

    हाँ बड़े घर ढोटा जायौ। 
    हाँ सबनि मनवांछित पायौ ॥९॥

    हाँ बड़ौ यह भाँड़न लहनौ। 
    हाँ सबन पहिरावौ गहनौ ॥१०॥

    हाँ देवता भाँड़ कहावैं। 
    हाँ जे पूजें ते फल पावैं ॥११॥

    हाँ हँसे हर-हर गोपाला। 
    हाँ नन्द दई मोतिनु माला ॥१२॥

    हाँ भाँड़ भये हरषित हीये। 
    हाँ महर मणि कुंडल दीये ॥१३॥

    हाँ कहत जीवौ जुग लाला। 
    हाँ दिये गोपन जु दुशाला ॥१४॥

    हाँ आसिका जसुमति लीजौ। 
    हाँ लला की अँगुली दीजौ ॥१५॥

    हाँ कुँवर की पटुला नानी। 
    हाँ बड़ी दाता महारानी ॥१६॥

    हाँ कछु अब गहरु न कीजै। 
    हाँ कोरचा कौ धन दीजै ॥१७॥

    हाँ बड़ी-बड़ी थौंदन वारे। 
    हाँ सबै जजमान हमारे ॥१८॥

    हाँ मनोरथ सबके रूरे। 
    हाँ बिधाता पारे पूरे ।।१९।।

    हाँ महा मंगल इहि राचौ । 
    हाँ सबै उठि कै अब नाचौ ॥२०॥

    हाँ नचतु छोटे रु बड़ेरे । 
    हाँ प्रेम सबके उर प्रेरे ॥२१॥

    हाँ दुहूँ कर पटकें ताला। 
    हाँ दैहि हेरी गोपाला॥२२॥

    हाँ भाँड़ भँड़ कूट्यौ लावैं। 
    हाँ बदन बाँके जु दिखावैं ॥२३॥

    हाँ कहैं को हम सम तपसी । 
    हाँ जिमावौ भाँड़न लपसी ॥२४॥

    हाँ बजत हैं ढोलक-ढोला। 
    हाँ पढ़त पंछी मिठ बोला ॥२५॥

    हाँ लला की पाई बधाई। 
    हाँ भाँड़ भये मुदित महाई॥२६॥ 
    
    हाँ भये प्रफुलित मुख वारिज । 
    हाँ कहत चिरुजीवौ आरज ॥२७॥ 
    
    हाँ तुरंगन भाँड़ चढ़ाये। 
    हाँ जाचकन मान बढ़ाये ॥२८॥ 
    
    हाँ सोहिलौ नन्द कुँवर कौ। 
    हाँ जहाँ भयौ आनन्द भर कौ॥२९॥ 
    
    हाँ महा मंगल यह गायौ। 
    हाँ जनम हित रूप लड़ायौ ॥३०॥ 
    
    हाँ भाल मणि ब्रजजन जागी। 
    हाँ भये सबही अनुरागी ॥३१॥ 
    
    हाँ वृन्दावन हित यह पावै । 
    हाँ भान ब्रजपति जस गावै॥३२॥९०॥

- verseNumber: "91"
  verseIntro: "राग जैतश्री-"
  verseText: |
    कृष्ण जनम आजु मंगल माई। 
    उमगि लग्यौ आनन्द घोष झर जसुमति रानी कूखि सिराई ॥१॥ 

    वह दिखि धवल महल ब्रजपति कैं सुंदर पीत धुजा फहराई। 
    सुरँग वितान मोतियन झालर अवनी रंग बिछौनन छाई॥२॥ 

    कनक कलश उद्दोत रतन खचि जहाँ तहाँ सौरभ छिरकाई। 
    फहर-फहर फहरात पताका बहु विधि रचना रुचिर बनाई ॥३॥ 

    मणिमय देहरि सदन अलंकृत द्वारनि बंदनमाल सुहाई। 
    कृष्ण जनम मनु हँसत मोद भरि कौतिक शोभा बरनि न जाई ॥४॥ 

    भाँति-भाँति पुर नन्द अलंकृत कमला हू उझकत बौराई। 
    हरि आगम ब्रजभूमि हरखि भयौ कहा कहौं। इहिं भाग्य निकाई ॥५॥ 

    आवत वधू सोहिले गावत सब मन ढ़ोरी प्रेम लगाई। 
    अस भई भीर गलिनु में मानौं सोभा सिमिटि तिहूँ पुर आई ॥६॥ 

    ज्यौं-ज्यौं रुकत रंग त्यौं सरसत कहा कहौं उतकंठा अधिकाई। 
    भूषन खसत वदन श्रम जलकन नेह ललक लीयें सो जाई ॥७॥ 
    
    आगें है- है लेत रोहिनी दै आदर मन्दिर बैठाई। 
    देखत मुख जसुमति नंदन कौ हरषत मनहुँ रंक निधि पाई॥८॥ 
    
    धनि-धनि भादौं मास कृष्ण पछ धन्य अष्टमी तिथि वरदाई। 
    री यह धन्य नक्षत्र रोहिनी जिन जसुमति की आस पुजाई ॥९॥ 
    
    गरजनि गहर गंभीर चहूँदिशि घुमड़ी स्याम घटा जु महाई। 
    बहस परी ब्रजराज इन्द्र कौं उन जल इन रतननि झर लाई॥१०॥ 
    
    उर सर सरिता भरे नीर बहु इन जाँचकता भूख मिटाई। 
    उन करीं हरित मही तरु बेली इन त्रिभुवन जन हरख बढ़ाई ॥११॥ 
    
    उन तोरीं मेंड़ें बारू की इननि प्रेम बल विधि जु बहाई। 
    उन रोके जु पंथ पथिकनि के इननि प्रेम कौ पथ दरसाई ॥१२॥ 
    
    जयति-जयति ब्रजईश पुत्र के जनमत संपति अधिक लुटाई। 
    इक पहिरे पहिरावत एकन आइ-आइ इक देत बधाई ॥१३॥ 
    
    पट-भूषन बनितन दिये जसुमति पुनि बहु मेवा गोद भराई। 
    सब मिलि देत असीस महरि सुत जुग जुग जीवौ कुँवर कन्हाई॥१४॥ 
    
    बार-बार मुख देखि कुँवर कौ है रहीं चकित कौन घर जाई। 
    वृन्दावन हित रूप जाउँ बलि, पलक धरन हूँ गति बिसराई॥१५॥११॥ 

- verseNumber: "92"
  verseIntro: "राग चैती गौरी (जसोदा जू कौ दस मास गर्भ बरनन तथा दाई)-"
  verseText: |   
    ब्रज बनितनि मणि गोपी। हरि उर धरि ओपी ॥ 
    सूल हिय लोपी। कुल थूनी है रोपी ॥ 
    अहो प्रथम मास आरंभ सु लाग्यौ सुकृत फल॥१॥ 

    निगम नेति-नेति गायौ । आगम हूँ बतायौ ॥
    अन्त नहिं पायौ। गर्भ सोई आयौ । 
    अहो दुतिय मास ब्रज मंगल अमित उदै भयौ ॥२॥ 

    ग्यानी खोजत ग्यानैं। शिव धरैं जाकौ ध्यानैं। 
    विरंचि हू के प्रानैं। शुक-सारद वखानैं ।॥ 
    अहो सो ब्रजरानी की कूखि मास तीजौ लग्यौ ॥३॥ 

    चौथै मास अंग-अंगै। छबि बढ़ी है अभंगै ।। 
    सखीजन संगै । भरीं रस रंगै ॥ 
    अहो प्राची दिशि ज्यौं चंद यौं कृष्ण उदर धरे ॥४॥ 

    कहत सखी अभिरामिनि।। सुनि मेरी स्वामिनि ।। 
    तूव वर भामिनि । कहा दिन जामिनि ॥ 
    अहो पँचये मासकी है बिरियाँ अछन पग धारियै ॥५॥ 

    छठवें मास अंग रवनीं। वदन राजै कमनी ॥ 
    कंचुकी कसि बनी। कूख सुख श्रवनी ॥ 
    अहो अमल कनक मनुः छिप्यौ स्याम नग जगमगै ॥६॥ 

    सतयें मास मन सरसै। अंग छबि बरसै ।। 
    मुकर उर दरसै। अवनि नहिं परसै ।। 
    अहो राजै सदन ब्रजरानी सखी सेवा करें।॥७॥ 

    अठयें मास ब्रज तरुनी। रमा मन हरनी ॥ 
    बूझत नन्द घरनी। रानी मंगल करनी ॥ 
    अहो बहुत दिनन की मन साध सु कबहिं पुजाइहौ।॥८॥ 

    नवयें मास गोपी आईं। सब बोलि पठाईं। 
    बहु विधि पहिराईं। ते देति बधाईं ॥ 
    अहो हम मन भायौ होहु विनय प्रभु सौं करी ॥९॥ 

    दसयौ मास अभिरामै । गिनत छिन जामै। 
    सब ब्रज की भामै । जसुमति पौढ़ी धामैं।॥ 
    अहो भादौं मास तिथि आठें कृष्ण पछ अरध निसि ॥१०॥ 

    आई दाई भवन में। लाल जब जनमे ॥ 
    धनि महरि त्रियन में। मुदित गोपी मन में॥ 
    अहो स्याम अंग अभिराम कुँवर कौतिक जन्यौं ॥११॥ 

    दाई लला जू की लौनी। सब गुनन सलौनी ॥ 
    धरि रही मुख मौनी। ऐसी भई हू न हौनी ॥ 
    अहो भाग भरी सुख भरी ललन मुख निरखई ॥१२॥ 

    बोली सो तिहिं काला। सुनौं ब्रजबाला। 
    जसुमति जन्यौं लाला। गावौ गीत रसाला॥ 
    अहो लैहौं आपु मन भायौ तब वदन दिखाइहौं ॥१३॥ 

    अहो अहो जसुमति रानी। सुनत मुसिकानी ॥ 
    कहत मृदु वानी। बोलौ सखीयै सयानी ॥ 
    अहो देहु मेरौ उर हार रतन खपरा भरौ ॥१४॥ 

    बड़े गोप की जाई। नन्दिनी बुलाई॥ 
    निकट सो आई। रानी कहि समुझाई ॥ 
    अहो बेटी कौरिनु रोपौ साथिये लेहु मन भाँवतौ ॥१५॥ 

    अहो मेरी भाभी उदारा। तेरौ बढ़ौ परिवारा।। 
    जियौ प्रान अधारा। लैहौं बहु परकारा॥ 
    अहो मेरौ जीबहु घोषपति वीर सु ता घर बधावनौं ।॥१६॥ 

    नन्द भवन में बुलाये। द्विजवर लै आये।॥ 
    वेद पढ़वाये। बहु दान कराये ॥ 
    अहो जनमपत्र द्विज लिखत प्रेम पूरित भये ॥१७॥ 

    गरजि गरजि घन आवैं। सुर दुंदुभी बजावैं ।। 
    पुहुप वरषावैं। देव नारी गावैं॥ 
    अहो अखिल लोक ब्रजईश सुजस पूरित भयौ ॥१८॥ 

    दाई विदा जब कीनी। असीस तिन दीनी ।। 
    हियें रस भीनी ॥ भई रूप लौ लीनी ॥ 
    अहो दाई रीझि लला पै कियौ सर्वसु वारनें ॥१९॥ 

    परी रहौं दरबारैं। सुनि नृपति उदारै ॥ 
    देखौं प्रान अधारै। पुनि-पुनि यौं पुकारै ॥ 
    अहो मो दृग भये हैं चकोर चन्द्र बिनु क्यौं जियें ॥२०॥ 

    रूप बसौ मेरे नैना। नाम रटौं बैंना ।। 
    आन गति है ना। यहै दान दैना ।। 
    अहो श्रीहरिवंश धरन ब्रज मंडन प्रगटियौ ॥२१॥ 

    बास मेरौ बरसानैं। विदित जग जानें।। 
    मेरे जजमानैं। गोप वृषभानैं ॥ 
    अहो तिन घर है है कन्या तब जैहौं तिलक करि ॥२२॥ 

    उदौ दुहुँ घर जाँचौं। हित रूप गुन राचौं ॥ 
    भजन धन साँचौं । मगन है तब नाँचौं ॥ 
    अहो वृन्दावन हित गावै दुहूँ कुल सुजस नित ॥२३॥९२॥

- verseNumber: "93"
  verseIntro: "राग गौरी-"
  verseText: |  
    बाजत बधाई आजु नन्द जू के धाम री। 
    प्रगट भये हरि सुंदर स्याम री ॥१॥ 

    अष्टमी अँधेरी भादौ मास आधी रात री। 
    रोहिनी नक्षत्र आये घन ऊनै पाँत री ॥२॥ 

    गाइ उठीं बनिता सिहाइ उठी मात री। 
    जसुमति भागनु की कहा कहौं बात री ॥३॥ 

    ताही छिन परे हैं निसानन घाव री। 
    देखत लला कौ रूप भई प्रेम बाबरी ॥४॥ 

    दाई हूँ रही है चौंधि पायौ फल नैन री। 
    झूमत सी घूमत सी कहै मृदु बैन री ॥५॥ 

    रूप की अवधि ढोटा जायौ धनि भाग री। 
    जाकौ मुख देखें जग बादै अनुराग री ॥६॥ 

    गोकुल की मणि मुनि करहिं प्रसंस री। 
    सुकृत फल्यौ है आज गोपन कौ वंश री ॥७॥

    सुनि ब्रजरानी मन मुदित अपार री। 
    रीझि कैं दयौ है ताहि आपु हिय हार री ॥८॥

    गावत बधाये बाला लै-लै कुल नाम री। 
    घर-घर मंगल नंदीश्वर ग्राम री ॥९॥ 

    नाचत हैं गोपीं अरु गोपन समूह री। 
    गगन विमान छाये परम कौतूह री ॥१०॥ 

    माची दधिकाँदौं रही तन न सम्हार री। 
    भवन-भवन बहे गोरस के खार री ॥११॥

    गाइनु सिंगार आये हेरी देत ग्वार री। 
    भूषन-वसन दीने नंद जू उदार री ॥१२॥ 

    देत हैं असीसैं गोपीं भरीं हैं हुलास री। 
    जुग जुग फलौ ब्रजरानी जू की आस री ॥१३॥ 

    पुनि-पुनि बंदत हैं नन्द जू के पाँइ री। 
    पुत्र जनम देखें कौतिक न अघाइ री ॥१४॥ 

    वृन्दावन हित भयौ नन्द जू कैं पूत री। 
    लोकन आनंद बढ्‌यौ परम अभूत री ॥१५॥९३॥

- verseNumber: "94"
  verseIntro: "राग परज-मंगल छंद-"
  verseText: | 
    रूप जलद कौ री हेली धुरवा ऊनयौ। 
    व्योम मनोहर री हेली नन्द भवन भयौ ।। 
    व्योम नन्द निकेत बरषत आजु परमानंद है। 
    चहुँ ओर मारुत प्रेम बाढ्यौ प्रबल उरन अमंद है। 
    केकी कुलाहल सूत मागद गरज बहु बाजे मनौं। 
    जन घोष चात्रक मुदित अति हिय लाग सुख कहाँ लौं भनौं ॥१॥ 

    रुचिर अलंकृत री हेली ब्रज तरुनी भईं। 
    इन्द्रबधू सीरी हेली मिलि मन्दिर गईं ॥ 
    गईं मन्दिर गोप बनिता दामिनी दुति देह की। 
    नदी सागर मिलत उपमा आजु ब्रजपति ग्रेह की।। 
    रोमाञ्च मानौं महीरुह नर नारि ब्रज एकत भये। 
    बरषा अभूत विलोकि व्योम विमान कृष्ण जनम छये।॥२॥ 

    प्रीति अलौकिक री हेली सब हिय देखिये। 
    गगन महीतल री हेली सगुन विशेषिये ।। 
    विशेषिये शुभ सगुन दिसि-दिसि संपदा बरनौं कहा। 
    आगमन गोकुल चंद मंगल निकर ब्रज प्रगटे महा। 
    गोप सभा बनाइ बैठे नन्द अति शोभित भये। 
    मुनि देव दुर्लभ सुधन पायौ विविध दान द्विजन दये।॥३॥

    मुरि-मुरि गोपी री हेली देत असीस हित। 
    विधि तन गोदी री हेली ओटत जियहु नित।। 
    नित जियहु देत असीस जसुमति बन्दि पद सुख में झिलीं। 
    गावत बधाये विविध पूरित प्रेम सब सादर मिलीं॥ 
    वृन्दावन हित रूप निरवधि लाभलोचन पाइयौ। 
    ब्रजईस सुत जनमत सिमिटि सब घोष कौतिक आइयौ ।।४।॥९४॥

- verseNumber: "95"
  verseIntro: "राग परज मंगल छन्द-"
  verseText: |
    आनँद वरषत री हेली मन्दिर महरि के। 
    क्रीड़त ब्रज जन री हेली सुख-निधि गहर के ॥ 
    गहर के सुख-सिन्धु क्रीड़त बढ़तु छिन-छिन चावरौ। 
    भयौ प्रगट जसुमति कूख कमनी दूगनि कौ उरझावरौ ॥ 
    सुत-जनम कै चेटक सखी कियौ प्रेम नें मनु घावरौ । 
    घर-घर परम कौतूह ब्रज में निरखि ब्रजपति छावरौ ॥१॥ 

    यह अनहौंतौ री हेली लाभ दई दयौ। 
    वैस बड़ी में री हेली वंश उदै भयौ ॥ 
    भयौ वंश उदोत वानी सत्य कीरति की फली। 
    होहु विधि अनुकूल उनकी कूख अब जनमौं लली ।। 
    इत उत बढ़ौ नित नयौ मंगल सबहि भाग्य विशेखि हैं। 
    कौतिकन कौ उद्भव महा सुकृती दृगनि भरि देखि हैं।॥२॥ 

    सब दूग फूले री हेली सब मन हरखहीं। 
    सुदिन सोहिलौ री हेली सब धन वरखहीं।। 
    वरखहीं धन प्रेम पन गोकुल सुघमड्यौ रंग है। 
    इहि लाल वदन विलोकि सजनी होत गति मति पंग है। 
    झूमरिनु दै-दै गोप गोपी नचत दधि काँदौं मची। 
    अनुराग चहलैं प्रेम दहलैं महा मंगल विधि रची ॥३॥ 

    रंग सतगुने री हेली भई हिय पट चढ़न। 
    नेह लपेटन री हेली भई शोभा बढ़न ॥ 
    भई शोभा बढ़त अवनी व्योम दिसि जगमग महा। 
    नर नारि मन उत्साह जेतौ कहन समरथ विधि कहा।। 
    पूजी सकल अभिलाष साखा नन्द कुल जु हरी भई। 
    वृन्दावन हित रूप सरसनि आजु हौं बलि-बलि गई।।४।॥९५॥

- verseNumber: "96"
  verseIntro: "राग विहागरौ -"
  verseText: |
    आजु ब्रज मंगल ठावैं ठाँम अहा कहा गोकुल रंग रली है। 
    मैं जानी रानी जसुमति की सुकृत कूख फली है ।। अहा कहा गोकुल॥ टेक ॥१॥ 

    बाजत गहकि दुन्दुभी धुनि सुनि आतुर गति सहनाई। 
    अतिसै भाग भलौ दिन सजनी ब्रजपति सदन बधाई ।।२।। 

    हुलसि चलीं भामिनि अभिरामिनि नौतन साजि सिंगारा। 
    रचि रचि सरस सोहिले गावत आवत रूप उदारा ॥३॥ 

    रवकत चरन धरत कटि लचकत वीथिनु बनिता धावैं। 
    मनहुँ रूप धाराधर बरषत कृष्ण जनम यौं आवैं ॥४॥ 

    फरहरात अंबर मारुत बस श्रमकन वदन भले हैं। 
    मानहुँ कोटिक चन्द धुजा धरि अमृत श्रवत चले हैं ॥५॥ 

    लोचन चपल दरस उतकंठा सहत न पलक धरन कौं। 
    अरबरात मनु मीन चढ़े ससि हरि छबि सिन्धु तरन कौं ॥६॥ 

    गहरे नाद किंकिनी बाजत यौं आवत मन माहैं। 
    मानौं प्रान खिझत चरनन सौं आतुर चलन उमाहैं॥७॥

    सीचीं भलीं गलीं सौरभ जल विविध वितान तने हैं। 
    मानौं आजु मही ब्रजमंडल भाग जागि उफने हैं॥८॥ 

    मंगल मूरतिवंत विराजत रचना रुचिर सँवारी। 
    जित तित अगनित रूप रमा धरि वैभव ब्रज विस्तारी ।।९।। 

    परसे जाइ चरन जसुमति के गहकि बधाई दीनीं। 
    देत असीस लाल चिरुजीवौ हियें प्रेम सुख भीनीं ॥१०॥ 

    खेलत हरद दही मिलि मेलत मुरि-मुरि नाँचन लागीं। 
    कृष्ण जनम दिन मंगल क्रीड़त ब्रजगोपी बड़भागीं ।।११।। 

    दियौ नन्द वसु विदित जगत जसु - लोक-लोक सुनियत है। 
    जाकें पुत्र पुरुष पुरुषोत्तम निगमन हूँ गुनियत है।॥१२॥ 

    सो लीला सुख सहज भोगवत ये ब्रजजन अनुरागी। 
    वृन्दावन हित रूप जाउँ बलि भूरि भाग्य मणि जागी ।।१३।।९६।।

- verseNumber: "97"
  verseIntro: "राग मारू प्रथम आलाप चारी के दोहा-(वंशवली श्रीनारायणजी तें बरनन)"
  verseText: |
    श्रीहरिवंश सरोज पद सुमिरौं चित्त लगाइ। 
    सोम-वंश कौं बरनिहौं कृपा जथामति पाइ।।१।। 

    श्रीरूपलाल गुरु गुन गहर परम धर्म दृढ़ टेक। 
    अगनित जन पावन किये व्रत अनन्य बल एक ॥२॥ 

    ते सुदृष्टि मो तन करौ बरनौं ब्रजपति वंश। 
    सुर नर मुनि ब्रह्मादि शिव जाकी करत प्रसंश ।।३।। 

    श्रीभागौत जु शुक कह्यौ सोम वंश विस्तार। 
    तिन राजन कौ विपुल जस विदित सकल संसार ।।४।। 

    या कुल तें जानी परत वैश्य वंश की ओप। 
    श्रीपरजन्य ब्रजईश के नन्दादिक सुत गोप ।।५।। 

    जिनके नामन आदि तें कहीँ सुनौं जजमान। 
    कृष्ण जनम मंगल भयौ मान सहित देहु दान।।६।। 

    ढाँढी बल्लव वंश कौ उदौ ईश-कुल जान। 
    परम भागवत नृपन के नामन करत बखान ॥७॥ 

    राग मारू- 
    ढाँढी कृष्ण जनम सुनि आयौ। 
    बरनत आदि सोम कुल निर्मल ब्रज पति कौं सिर नायौ।।टेक ॥ 

    श्रीनारायण नाभि कमल तें ब्रह्मा जनम जु लीयौ। 
    तिनकें भये अत्रि रिषि जिहि कुल सोम उदोत जु कीयौ। 
    तिनकें बुद्ध विपुल मति नन्दन औल इला सुत जायौ। 
    तिनकें आयु महाबल के सुत नहुष सुरेश कहायौ ॥१॥ 

    नृप जजादि तप तेज उग्र अति धर्म महा रति ज्ञाता। 
    पाँच पुत्र तिनके जग पालक कीरति जदु विख्याता। 
    तिनकें भयौ क्रोष्टा नन्दन ब्रजनवान सुत ताकौ। 
    स्वाहिः सुपुत्र तासु घर जनम्यौ सेक सु कुलधर जाकौ ॥२॥ 

    तिनकें भये चित्र रथ भुव पति तिन जातक ससि वृन्द। 
    पृथुश्रवा सुत धर्म प्रगट भयौ उसना तासु नरिंद॥ 
    ताकें भयौ रुचीक महारथ ज्यामघ पुत्र विदर्भ । 
    तिनकें कृथु तें कुंति घरनि सुत विस्नि प्रगट भयौ गर्भ ॥३॥ 

    विस्नि सुवन निर्वृत्ति नाम सुनि सारह तिन कुल दीप। 
    जाकें व्यौम जीमूत तासु सुत ताकें विकृति महीप । 
    तिनकें भयौ भीमरथ नन्दन नवरथ सुत बलवान। 
    दसरथ तिनकें शकुनि बंश धर तासु करंभी जान ॥४॥ 

    देवरात जाके कुल उतपति देवछत्र तिन वंश । 
    मधु सुत तें कुरबस सुत प्रगट्यौ ताके अनु सु प्रसंश॥ 
    अनु कें सुत पुरहोत्र भयौ नृप आयु पुत्र तिन धीर। 
    तिनकें सात्वत पर्म धर्म रति तिन कुल अंधक बीर ॥५॥ 

    अंधक कें भजमान तासु कें शिनि सुत परम उदार। 
    ताके स्वयंभु सुभग गुन लक्षन हृदीक सुत दातार ।। 
    देवमीढ़ तिन सुवन विदित जग द्वै जिन घर पटरानी। 
    एक वैश्य कुल तें जु विवाही दुतिय जानि छत्रानी ॥६॥ 

    तातें सुरसैंन सुत जनमे पावन जस नर भूप। 
    तिनके श्रीवसुदेव प्रगट भये मुनि गन मुदित अनूप ॥ 
    जिनके जनम देव मन हरषे बाजे गहकि बजाये। 
    श्रीदेवकी घरनि बड़भागिनि वासुदेव सुत जाये ॥७॥ 

    जदुकुल जस निर्मल विस्तारन सुजन बढ़ावन मोद। 
    अब बरनौं कुल गोप जहाँ प्रभु पूरन प्रेम विनोद ॥ 
    वैश्य-सुता तें देवमीड़ कुल पुत्र भये उतपन्य। 
    जनक समान सबै गुन लक्षन वेद विदित परजन्य॥८॥ 

    तिनके नव नंदन जु महा मति तिनमें नन्द ब्रजेश। 
    जाके भूरि भाग की महिमा बरनत हास्यौ शेष ।। 
    सुकृत पुंज की मूरति तिन घर श्रीजसुदा जस धाम। 
    ताकी कूख कलपतरु प्रगट्‌यौ स्याम परम अभिराम ॥९॥ 

    जाके जनम गोप बलि बैठे समसरि उपमा कौंन। 
    कंचन मणिमय जटित अथाई सुरपुर कीनौं गौंन ।। 
    बरसत ब्रज वैभव जाचक सर सब विधि सुभर भरे हैं। 
    मैं पूज्यौ गिरि देव गोवर्द्धन अब मन काज सरे हैं।॥१०॥ 

    बड़ी वैस मन वाञ्छित विधना यह सुख मोहि दिखायौ। 
    त्रिभुवन जन लोचन कौ भूषन नन्द घरनि सुत जायौ।। 
    गहकि बजे बाजे सब लोकन कृष्ण जनम दिन आज । 
    इत ब्रज परम मुदित नारी नर घर-घर मंगल साज ॥११॥

    नन्द जनक परजन्य नृपति कुल बेली फली अभूत। 
    गुन लावन्य रूप हद जा घर दियौ रमापति पूत ॥ 
    बरन्यौ वंश जनम सुत वरन्यौं ब्रजपति रीझि बुलायौ। 
    अपनौं जानि पीठि कर वर धरि आदरु दै पहिरायौ ।।१२।। 

    तब बोल्यौ ढाँढ़ी असीस दै अब मन भायौ पाऊँ। 
    जनम जनम कीरति तुव सुत की प्रेम विवस नित गाऊँ। 
    टेरि-टेरि सबहीन सुनावत गोप इन्द्र मन भायौ। 
    कछु इक टेर सुनी जसुमति तब सुत मुख बोलि दिखायौ ॥१३॥ 

    अब हरि जननी भाग प्रसंसत बड़े गोप की जाई। 
    जाकौ पुत्र उफनि उठ्‌यौ वारिध लोकन जस न समाई ॥ 
    बलि हित रूप ब्रजेश कुँवर मुख निरखि परम अनुराग्यौ। 
    वृन्दावन हित भानवंश अब उदौ मनावन लाग्यौ ॥१४।९७।।

- verseNumber: "98"
  verseIntro: "टेर सिपाहीरा की तरह में-"
  verseText: |
    महरि जसोदा हो धनि-धनि तेरी कूख अहो रानी जग मोहन सुत जाइयौ हो। 
    ब्रजपति रानी हो दृगनि जगाई भूख अहो रानी आनन्द उदधि बड़ाइयौ हो ॥१॥ 

    अति बड़भागिनि हो शोभित चहुँ दिसि बाट अहो रानी वृंदन गोपी आवईं हो। 
    हरि उर धरनी हो कीनों मंगल ठाट अहो रानी सुर नर मुनि जस गांवईं हो॥२॥ 

    पीहर पूरी हो धन्य सुमुख तो तात अहो रानी धनि पटुला कुल ओपनी हो। 
    ब्रज सुख वर्द्धनि हो कहा कहौं इहिं मुख बात अहो रानी सुजस धुजा ब्रज गोपनी हो।॥३॥ 

    विरद बुलावन हो सबकी फली है असीस अहो रानी इहि घर विपुल बधावनौं हो। 
    लोक उजागर हो कियौ गोकुल कौ ईश अहो रानी दुर्लभ अस सुत जावनौं ॥४॥ 

    पुत्र जनम दिन हो सुकृत मोटे भाल अहो रानी तामें गोकुल भूप कैं हो। 
    उमड्यौ आनंद हो मो मन जो इहिं काल अहो रानी लखि कुल मंडन रूप कैं हो ॥५॥ 

    आरज गोपिनु हो तू चूड़ामणि आजु अहो रानी सबकौ दृग वाञ्छित कियौ हो। 
    सर्वोपरि भये हो धनि-धनि अब ब्रजराज अहो रानी अलभि लाभ प्रभु फल दियौ हो॥६॥

    सुविध मनायौ हो तुम नारायन देव अहो रानी धन्य-धन्य भुव तल भई हो। 
    भूर मनोरथ हो पायौ करि जिहिं सेव अहो रानी निर्मल कीरति निर्मई हो ॥७॥ 

    ब्रज जीवन जन्यौ हो तुव गुन जगत प्रसंश अहो रानी जगमग तेरे धामरे हो। 
    रचौ सवासिनि हो सथिया ओप्यौ वंश अहो रानी आनन्द वरषत ग्राम रे हो॥८॥

    नन्द महामन हो गोपसभा के माँहिं अहो रानी बैठे अति छबि पावहीं हो। 
    दान विविध विधि हो दीने उपमा नाहिं अहो रानी सुरपति सभा लज्यावहीं हो ॥१९॥ 

    तेरे मन्दिर हो रचना रची है अभूत अहो रानी लोकन संपति वारनै हो। 
    होहु गोपालक हो सब अंग लौनों पूत अहो रानी बहु व्रत किये तिहि कारनैं हो ॥१०॥ 

    तो करनी की हो जसुमति मिलत न थाह अहो रानी अस कौतूहल नगर में हो। 
    अतिसै बाढ्‌यौ हो सब उर प्रेम प्रवाह अहो रानी आवत छेह न डगर में हो ॥११॥ 

    को जप को तप हो को दत बरनौं बैन अहो रानी को पूजन कहौं इष्ट कौ हो।
    कौन अपूरव हो सुत मुख देख्यौ नैंन अहो रानी उद्भव तत्व गरिष्ट कौ हो ॥१२॥ 

    जिन ब्रज बनितन हो उझकि न देखी पौरि अहो रानी बींधि बधाये न मग चलीं हो। 
    ते सब आवत हो तेरे मन्दिर दौरि अहो रानी अति शोभित गोकुल गलीं हो ॥१३॥ 

    बैठि अजिर में हो विधि तन अंचल लेत अहो रानी देव मनावत नेम सौं हो । 
    अजर अमर होहु हो गहकि असीसै देति अहो रानी पुनि हिय भीजीं प्रेम सौं हो ।॥१४॥ 

    महा अचरजमय हो कूख अमी कौ खेत अहो रानी जहाँ यह रतन प्रगट भयौ हो। 
    परम डहडह्यौ हो बिरवा उपज्यौ हेत अहो रानी जग नीरसता मिटि गयौ हो॥१५॥ 

    आईं कीरति हो श्री जुत तेरे धाम अहो रानी तन मन अति ही हरषहीं हो। 
    निरखि मुदित भईं हो शोभानिधि मुख स्याम अहो रानी रावलपति धन वरषहीं हो॥१६॥ 

    अब विधि करिहै हो सत्य वचन सुनि लेहु अहो रानी बेगि बधाई सजन घर हो। 
    इत उत बढ़िहै हो दिन दिन अधिक सनेहु अहो रानी जिहि सुख भीजैं नारि नर हो॥१७॥ 

    लोक मुकटमणि हो जोरी दोऊ वंश अहो रानी लीला जिनकी रसमई हो। 
    तिन जस गाइक हो कोविद हित हरिवंश अहो रानी सगुन परीक्षा मैं लई हो ॥१८॥ 

    कीरति जसुमति हो सुनि ये वचन अनूप अहो रानी प्रेम उदधि पैरति मनौं हो। 
    यह आनन्द लखि हो बलि-बलि श्रीहित रूप अहो हित वृन्दावन सुख कहा भनौं हो॥१९॥९८॥

- verseNumber: "99"
  verseIntro: "राग झंझौटी गौरी-"
  verseText: |
    मंगल कृष्ण जनम यह देख्यौ। 
    मैं तौ जनम सफल करि लेख्यौ ।॥१॥

    बिरवा जहाँ रूप भयौ है। 
    रानी पोष सनेह दयौ है।॥२॥

    देख्यौ धन्य सुदिन कौ सोहिलौ। 
    पायौ निगमन जो सुख दोहिलौ ॥३॥

    भई धन्य-धन्य जग माहीं। 
    ऐसौ सुत त्रिभुवन में नाहीं ॥४॥

    कहा लिखौं भाग की पाती। 
    परमानंद मय पाई थाती ॥५॥

    तब कष्ट ध्यान नहिं आयौ । 
    सो बिनु श्रम घर बैठें पायौ ॥६॥

    ऐसौ घर बन्यौ है बधावनौं। 
    मन देवन हूँ ललचावनौं ।॥७॥

    ऊग्यौ जग तिमिर नसावनौं । 
    गोपी गोपन मन भावनौ ॥८॥

    मन्दिरं छबि जोति प्रकासी। 
    कहैं धन्य-धन्य नभ वासी ॥९॥

    यह प्रबल पुन्न की बिरिया। 
    रानी गोद आजु विधि भरिया ॥१०॥

    मैं तौ बाजेनु धुनि सुनि फूली। 
    सुख प्रेम हिंडोरैं झूली ॥११॥

    मोहि मिली लला की दाई। 
    हँसि-हँसि सो कंठ लगाई ॥१२॥

    कर चूँमि वारनौ लीनौं। 
    मैं तौ वारि अपनुपौ दीनौं ।॥१३॥

    मोहि मिली सवासिनि पौरी। 
    फिरै रचत साथिये दौरी ॥१४॥

    लगि-लगि चरनन मुख देखौं। 
    हौं तौ अपनौ भाग्य विशेखौं ॥१५॥

    निरखी छबि ब्रजपति ग्रह की। 
    मोहि विसरी सुध बुध देह की ॥१६॥

    गई जहाँ जसोदा मैया। 
    मैं तौ पुनि-पुनि लई बलैया ।।१७।।

    मुख खोलि दिखायौ साँवरौ । 
    भरि प्रेम भयौ तन ताँवरौ ।॥१८॥

    कौतिक कौ कौतिक लाला। 
    बरनौं कहा रूप रसाला ।।१९।।

    विधना रचि रेख जु काढ़ी। 
    लखि इकटक रहि गई ठाढ़ी ॥२०॥

    मेरी सी गति सबकी भई। 
    छबि चेटक धाम दयौ दई ॥२१॥

    भई भीर नन्द कैं अँगना। 
    सुर दुदुभि बाजैं गगना ॥२२॥

    मंगल धुनि बगर-बगर में। 
    कौतूहल बढ्यौ नगर में ।। २३॥

    हरदी दधि छिरकै नारी। 
    भवनन बहि चलीं पनारी ।।२४॥

    रचि प्रेम बधायौ गायौ। 
    मोहि रीझि निकट बैठायौ ।। २५॥

    मन भायौ दैहुँ तोहि एरी। 
    सुनि बात कान दै मेरी ।। २६॥

    जाइ कीरति कौं लै आवौ । 
    मेरौ सुख उनहिं सुनावौ ।।२७॥

    ताही छिन हौं उठि धाई। 
    मैं दीनी गहकि बधाई ।।२८॥

    यह सुनि कीरति भईं राजी। 
    नौबत वृषभानु घर बाजी ।।२९॥

    लियै अगनित सँग ब्रजबाला। 
    कीरति आई तिहिं काला ।॥३०॥

    अंग-अंग जिनकै श्री वरषै। 
    पग धरतें अवनी हरषै ।। ३१ ।।

    मंगल धुनि सौं ब्रज छायौ । 
    कीरति बहु दर्वि लुटायौ ।॥३२॥

    छबि तेज पुंज तन सोहना । 
    जसुमति ढिंग निरख्यौ मोहना ॥३३॥

    मिलीं हरषि-हरषि दोऊ रानी। 
    गाथा कछु गूढ़ बखानी ।।३४॥

    कीरति जसुमति की बतियाँ। 
    मैं लिखीं आपनी छतियाँ ।। ३५ ।।

    वे जानत कै हिय हौंहीं। 
    हित करैं महरि अपु गौहीं ।॥ ३६॥

    अभिलाष दुरी यह हीये। 
    हौं चलौं दुहुँ रुख लीये ।।३७।।

    सेॐ नित चित जु हुलासा। 
    हित रूप उदै की आसा ।।३८॥

    दुहुँ रानीनु कही है पहेरी। 
    मुहि राख्यौ अपनैं नेरी ॥३९॥

    नित प्रेम प्रसादहि पावै। 
    जो गोपन कुल जस गावै ॥४०॥

    वृषभानु नन्द कुल जाचौं। 
    वृन्दावन हित रंग राचौं ।॥४१॥९९॥

- verseNumber: "100"
  verseIntro: "राग जोगिया आसावरी- (नाइन कौ झगरौ)-"
  verseText: |
    रानी ! अब चरन महावर दैहौं। 
    फली असीस लाल तुम जायौ मन भायौ सब लैहौं ।॥ १ ॥ 

    स्यौ गहने देहु बसन उतीरन तब जु बुलाये जैहौं। 
    हौं नाइन तुम मो ठाकुराइन तदपि न आजु डरैहौं ।॥२॥ 

    सब तें लीक सतगुनी लैहौं जा दिन तुम्हें न्हवैहौं। 
    एड़ी माँजि सँवारौं नख तब रतनन थार भौंहौं ।॥ ३ ॥ 

    गूँथौं केश सिंगारौं नखसिख लै आरसी दिखैहौं । 
    पति-परिवार सहित पहिरौंगी पुनि-पुनि माथौ नैहौं ।॥४॥ 

    जा दिन सुतहिं गोद लै बैठौ ता दिन दान अधैहौं। 
    छठी पूजनी मंगल बिरियाँ हौं धनवंत कहैहौं।॥५॥ 

    नामकरन जब होहि लाल कौ उमगि-उमगि गुन गैहौं। 
    जा दिन आवै छोछक ता दिन फूली अंग न मैहौं।॥६॥ 

    काकी-ताई जितीं कुँवर की तिनकौं सुविधि रिझैहौं। 
    न्यौंछावरि सौं भवन भरौंगी दारिद धोइ बहैहौं।।७।। 

    पुर-बनितनि की हौं जु भाँवती तिनतें वाञ्छित पैहौं। 
    वृन्दावन हित रूप व्याह दिन देखनि उदौ मनैहौं ।॥८॥१००॥

- verseNumber: "101"
  verseIntro: "राग (पटविन कौ झगरौ) - राग जोगिया आसावरी-"
  verseText: |
    पटविन ! तो भायौ जु भयौ है। 
    मेरें लाल मोहना प्रगट्यौ विधि सुदृष्टि चितयौ है ॥१॥ 

    सुकृत उदोत भयौ ब्रजपति जो पूरब सुविधि बयौ है। 
    बाँधि पाट की वंदनमाला कुल मणि जनम लयौ है॥२॥ 

    मो घर भयौ सोहिलौ सब मन बाढ्यौ मोद नयौ है। 
    देवनि हू मान्यौं मंगल लखि व्योंम विमान छ्यौ है॥३॥ 

    यह सुनि वंदनमाला बाँधत प्रेम हियौ भिजयौ है। 
    इतौ दियौ ब्रजरानीं ताकौं नसि दारिद्र गयौ है ॥४॥ 
    
    ब्रजपति-भवन अलंकृत करिकैं जसुमति कौं रिझयौ है। 
    वृन्दावन हित रूप अवधि सुत वदन दिखाइ दयौ है॥५॥१०१॥

- verseNumber: "102"
  verseIntro: "(बढ़इन कौ झगरी)- राग जोगिया आसावरी-"
  verseText: |    
    बढ़इनि मंगल गावति आई। 
    चित्र विचित्र करी बहु रचना ऐसौ पलना लाई॥१॥ 

    पाँइ लगी जसुमति कैं पुनि-पुनि रहसी देति बधाई। 
    करज चटकि कैं लेति वारनैं विधि तन गोद उचाई ॥२॥ 

    नैंननि भूख गई मुख देखत लौनौं लाल महाई। 
    पलना में पौढ़ाइ लाल कौं डोरी हाथ गहाई॥ 

    भाग्य भरी वह लगी झुलावन फूली अंग न माई। 
    वृन्दावन हित रूप महरि पट-भूषन दै पहिराई ॥४॥१०२॥

- verseNumber: "103"
  verseIntro: "(दाई कौ झगरौ)- राग जोगिया-आसावरी-"
  verseText: |
    झगरति जसुमति आगैं दाई। 
    सुनि लाइक मोहन की मैया मैं तुम कूखि सिराई ॥१॥ 

    छेदयौ नाल तगा सौं बाँध्यौ कीनी बहु चतुराई। 
    शशि तें वदन सतगुनौं बालक मैं दियौ दृग दरसाई ॥२॥ 

    और लीक पुनि लैहौं प्रथमहिं खपरा देहु पुजाई। 
    देहु सभागिनि मोकौं इहिं घर जैसी तुम प्रभुताई ॥ ३ ॥ 

    मैं हूँ देव मनाये इहि दिन दीयौ दई दिखाई। 
    शोभा सौं भरि गयौ भवन कहा कहौं शिशु-सुंदरताई ॥४॥ 

    को है भाग बली जगं मो सी शोधि शुभ घरी आई। 
    रतन अमोलक कूख-सिन्धु तें हाथ लग्यौ री माई ॥५॥ 

    बैठी मचेलि नन्द-मन्दिर में हिय जिय मुदित महाई। 
    महरि करति मनुहारि लेहु तू मन वाञ्छित जु बधाई॥६॥ 

    स्यौ गहने दिये वसन उतीरन नख-शिख लौं पहिराई।
    रतनन खपरा पूजि पँजीरी गोदी भरि जु दिखाई ॥७॥ 
    
    अलभलाभ दरसायौ मोकौं विधि तोहि प्रेरि पठाई। 
    तेरौ नाम होहि धनवंती दैहुँ धन भार भराई ॥८॥ 
    
    बड़े गुमान भरी जु सोहिले ऐसी संपति पाई। 
    वारौं अमर नगर की यापै लखि तन की सुथराई ॥९॥ 
    
    हौं चाहौं सनमान नन्द तें कहति प्रेम-बौराई। 
    उर भरि गई रूप मादकता कहा कहौं भाग निकाई ॥१०॥ 
    
    चटकत करज वारनैं लैकैं दूग-सुख-वारि बहाई। 
    वृन्दावन हित रूप विलोकति पुनि-पुनि कुँवर कन्हाई ॥११॥१०३॥ 

- verseNumber: "104"
  verseIntro: "(दरजिन कौ झगरौ)- राग जोगिया आसावरी-"
  verseText: |
    लाल-जनम सुनि तन-मन फूली दरजिन नन्द महरि की री। 
    वंदनमाला रचीं मनोहर रंग-रंग पाटंवर की री ॥१।। 

    हय-हाथी-शुक-सारौ-मैना सुभग जरी वस्तर की री। 
    करी कसीदा बहु विधि रंचना सारी पीतांबर की री ॥२॥ 

    हिय जिय बड़ी अधिक उतकण्ठा देखन स्यामसुंदर की री। 
    लै चलीं भेंट राज घर कौं सब बनिता जोरि नगर की री ॥३॥ 

    गावत चलौ सोहिले देखौ गलिनु भीर भई भर की री। 
    महरिः पाँइ लगि सुत-सुख निरख्यौ रूप-चटक उर अरकी री ॥४॥ 

    रानी कौं दरसावति बहु विधि रचना अपनैं कर की री। 
    कृष्ण जनम सुख भींजी वरनत प्रीति जु उर अंतर की री ॥५॥ 

    सदननि-वदन अलंकृत कीने होत प्रसंस उघर की री। 
    पंछिन की सैंनी मालनि में लरी फौंदनन लर की री ॥ ६ ॥ 

    बैठी मचलि महरि कैं आँगन माँगति लीक अगर की री। 
    नित उठि उदौ मनाऊँ तुव कुल हौं भूखी आदर की री ॥७॥ 

    विविध खिलौना धरति पालनैं आवति है ढिंग सरकी री। 
    दृग अरुझे जु स्याम शिशु छबि में, बात न आवत तरकी री ॥८ ॥ 

    रानी जू ! दास्य दीजिये मोकौं टहल करौं तुम घर की री। 
    आदरु दै पहिरावत ताकौं जननी जो हलधर की री ॥९॥ 

    जाकौ प्रेम देखि धनि-धनि कहें बनिता नगर अमर की री। 
    तन-मन चहली दहली दृग जक लागी टगर-टगर की री ॥१०॥ 

    वरनौं कहा प्रेम भुवतल में यह गति भई थिर-चर की री। 
    वृन्दावन हित रूप मगन अस सुधि नहिं डगर-बगर की री ॥११॥१०४।।

- verseNumber: "105"
  verseIntro: "राग सोरठ ताल आड़-"
  verseText: |
    अरी हेली नौबत बाजी नन्द घर उठि चलि आलस डारि। 
    धन्य सुदिन भयौ आजु कौ हेली धनि यह राति निहारि ॥ हेली ०॥१॥ 

    अति कौतिक देखें बनें हेली जो गवनैं मो संग। 
    नगर नंदीस्वर सुख सन्यौं हेली बरसतु है रस रंग ॥ हेली ० ॥२॥ 

    गाँव-गाँव तें नव वधू हेली आवत शोभित बाट। 
    नन्दनँदन के जनम दिन हेली भई मणि उदित लिलाट ॥ हेली० ॥३॥ 

    गहकि-गहकि गावत सबै हेली कोकिल कण्ठी बाल। 
    लोचन-भूख गई तबै हेली रूप अवधि लखि लाल ।। हेली० ॥४॥ 

    वंदनमाला थरहरैं हेली धुजा फरहरैं द्वार। 
    आजु भवन ब्रजराज कैं हेली सुर-मुनि कौतिकहार ॥ हेली ०॥५॥ 

    चंद्रमुखीं नव जोवनी हेली मुरि-मुरि नाँचति नारि। 
    पहिरावत तिनकौं महरि हेली बहुत करति मनुहारि ॥ हेली ०॥६॥ 

    पुर कौतिक, कौतिक सदन हेली रचना रची है अभूत। 
    तामें पुनि कौतिक अवधि हेली जसुमति जायौ पूत ॥ हेली ०॥७॥ 

    महा भाग ब्रजराज कौ हेली वरनों कौंन समान। 
    शिव-विधि देव नरेश भुव हेली जाँचत जा घर दान ॥ हेली०॥८॥ 

    रमा रवनपुर छाँड़िकैं हेली खेलति है ब्रज माँहिं। 
    कृष्ण-जनम अब गोप-कुल हेली महिमा की मित नाहिं ॥ हेली० ॥९॥ 

    निरखि-निरखि मुख लाल कौ हेली भूरि बलैया लेति । 
    वृन्दावन हित रूप बलि हेली मुदित असीसनि देति ॥ हेली० ॥१०॥१०५॥ 

- verseNumber: "106"
  verseIntro: "राग आसावरी ताल आड़ (श्रीनारदजू कौ आइवौ बरनन)-"
  verseText: |
    मो घर आयौ री वैरागी उझकतु डोलत इत उत। 
    गावत फिरत चरित श्रीपति के सुनि-सुनि किलकत री सुत॥१॥ 

    माल तिलक काँधे धरै बीना लखियतु अति अनुरागी चतुर चेटकी सौ कछु दीसत सुरति स्याम सौं लागी ॥२॥ 

    मधुर-मधुर बीना बजाइ पुनि तन पुलकित भयौ भारी। 
    मुख तें पढ़त मंत्र से मृदु-मृदु नाचत दै-दै तारी ॥३॥ 

    नैननि तें पानी सौ वरषतु दैउ सु चितवत नाहीं। 
    किधौं उनमत्त किधौं यह भोरौ किधौं कौतुक या माँहीं ॥४॥ 

    जब तब देखत मेरे सुत तन को चिन्हार धौं यासौं । 
    लोटत फिरत अजिर में सजनी विदा होहि कहि तासौं ॥५॥ 

    इक आवति दस-बीस जुरीं जब घर-घर तें ब्रजवाला। 
    इहि नगरी किहिं काज पधारे कहौ अंवधूत कृपाला॥६॥ 

    सुनि माता पूरब पुन्यनि ते तैं सुंदर सुत जायौ। 
    जाके जनम आइ जिन जाँच्यौ तिन मन वाञ्छित पायौ ॥७॥ 

    मुहि दै बहुत पँजीरी अँगुली अरु सुत बदन दिखाई।
    लै नख-बाघ बाँधि बालक कैं दीठ लगै नहिं माई ॥८॥ 

    तब अति मुदित भई ब्रजरानी लाल गोद लै आई। 
    फेस्यौ हाथ सीस-चरननि लगि लीनौं प्रेम दबाई ॥९॥ 

    कहुँ बीना कहूँ आपु परे धुकि तन की सुधि बिसराई। 
    जसुमति देखि दया उर भींजी किलके कुँवर कन्हाई ॥१०॥ 

    पुनि सचेत है कहत महरि सौं अग्या देव दई है। 
    कबहुँ न डरिहै बालक तेरौ वानी सत्य भई है।॥११॥ 

    सींच्यौ बहुत सुगंध नीर तन औरु दियौ मन भायौ। 
    तब बीना धरि भाग महरि कौ प्रेम छकनि सौं गायौ ॥१२॥ 

    बार-बार सुत के शुभ लक्षन बूझति है ब्रजरानी। 
    वृदावन हित रूप नाम-गुन बरनत हैं मुनि ग्यानी ॥१३॥१०६॥

- verseNumber: "107"
  verseIntro: "राग आसावरी ताल आड़ (ब्रह्मा जू कौ आइबौ बरनन)-"
  verseText: |
    पंडित नन्द महर घर आयौ तिन कछु बाँचि सुनायौ। 
    आसन दियौ हरषि ब्रजरानी आदर करि बैठायौ ।॥१॥ 

    आठ मैंन मुख चारि सखी री आगम बात बखानैं। 
    सुनन चाह बाढ़ी सबहिनु कैं बहुत कछू यह जानें ॥२॥ 

    सुनि-सुनि नर-नारी उठि धाये बूझत ताके नामैं। 
    अचिरज सौ तिनकौं लागतु है तजि-तजि आवत धामैं॥३॥ 

    नंदहि आइ आसिका दीनी जसुमति-भाग मल्हावै। 
    बीच-बीच मुख निरखि स्याम कौ विप्र परम सुख पावै ॥४।। 

    बार-बार किलकत है बालक या तन रहत निहारी। 
    भरि-भरि आवत हियौ प्रेम सौं विप्र विवस अति भारी ॥५॥ 

    बरनत है लक्षन शुभ जे-जे कछु मन हीं मन गावै । 
    देखि-देखि कर-चरन लाल के विपुल प्रताप बतावै॥६॥ 

    पुस्तक हाथ विचारत पुनि-पुनि परखतु है मृदु अंगा। 
    ब्रज जन सकल कलेश तरेंगे रानी तुव सुत संगा ॥७॥ 

    जननीं ! महिमा महत भाग्य सुनि कहतु ललाट निहारी। 
    तुव सुत आस करेंगे तेऊ जिननि तजे फल चारी॥८॥ 

    चकित थकित सौ है रहै कबहूँ भरि उर अधिक हुलासा। 
    कबहूँ नंद-सदन की रज लै धरि सिर भरि बड़ स्वासा ॥९॥ 

    इक कौतुक रानी सुत जायौ दूजौ कौतिक एहा। 
    विप्र कि आयौ नगर पेखनौं परम कुलाहल गेहा॥१०॥ 

    दै-दै कान सुनत है बालक रिषि के मधुरे बैंना। 
    चितवत भरत हूँकरा पुनि-पुनि गूंगे की सी सैंना ॥११॥ 

    नाम चौमुखा या द्विजवर कौ लखियत परम सुजानैं। 
    कौन पुरुष आयौ ब्रजपति-घर देति महरि बहु दानें ॥१२॥ 

    हरि-हलधर दोउनि पय पालौ कहत विप्र सुनौं माई। 
    बड़ौ रोग कोउ देखि सखी याके नैंननि-नीर चुचाई ॥१३॥ 

    जुग जुग बदलतु रंग बहुत यह नाना रूप धरे हैं। 
    अब तुव सुत साँवरौ प्रथम इन साके बहुत करे हैं।।१४। 

    जननी निकट लाउ बालक कौं मो असीस सुनि लीजै। 
    करिहौं जाप होहि बड़भागी मोहि विदा अब दीजै ॥१५॥ 

    पीत उपरना पाट धोवती अरु धन वाञ्छित देई। 
    चार वदन की विविध आसिका महरि ओटि पट लेई ॥१६॥ 

    अग्या अचल गुपाल लाल की धरैं गोप सब सीसा। 
    चिरुजीवी तेरौ सुत रानी कहि भयौ विदा मुनीसा॥१७॥ 

    नगर दाहिनौं दै फिरि आयौ ग्वालन संग लगाई। 
    पुर पौरी ब्रजराज नन्द की पुनि-पुनि रज में न्हाई ॥१८॥ 

    कौतिक भईं सुखित ब्रजबाला मुनि जु अपूरव देख्यौ । 
    वृन्दावन हित रूप स्याम लखि धन्य जनम विधि लेख्यौ ।।१९।।१०७।।

- verseNumber: "108"
  verseIntro: "राग आसावरी ताल आड़ (श्रीमहादेवजू कौ आइवौ )-"
  verseText: |
    माता ! जंत्र करनि हौं आया। 
    सुत कौ वदन दिखाय जसोदा ज्यौं न लगै तन छाया ।।१ ॥

    तू जिनि जानैं देश बसत इहि नहिं प्रयाग नहिं काशी। 
    उत्तराखंड तहाँ कौ जोगी महा विकट गिरि वासी ॥२॥

    सिंह-सर्प मेरे ढिंग खेलैं रंचक शंक न मानौं। 
    गुरु प्रताप तें मैं सब पायौ जंत्र मंत्र बहु जानौं ।॥३॥

    राखि प्रतीति वचन मेरे की जो कछु मन में भाया। 
    तनक भभूत पिंड लपटाउँ तौ अजर अमर होय काया ॥४॥ 

    पलना तें ललना कौं रंचक लाउ मानि मो बानी। 
    रचि बाँधौं गंडा बालक कैं सुनि ब्रजपति की रानी ॥५॥ 

    मैं अब लगि जाँचौ नहिं कोई औघर नाथ कहाऊँ। 
    अलख पुरुष व्रत करि तैं पूज्यौ तब तोकौं समुझाऊँ।॥६॥ 

    बाघंबर काँधें कर डौंरु भस्म लगायें अंगा। 
    लोचन अरुन चन्द्रमा माथै झरत जटनि तें गंगा ॥७॥ 

    देखति भई चकृत नँदरानी जोगी चेटकधारी। 
    जो माँगै सो देहु रोहिनी हौं संकत जिय भारी ॥८॥ 

    मचले कान्ह कुँवर गोदी में पुनि-पुनि रुदन कराई। 
    नाथ कहत लै आउ बेगि दै मैं तोहि पहिल चिताई ॥९॥
    
    राख्यौ रहतु न बालक क्यौं हूँ बहुत जतन करि हारी। 
    तब डरि चरन लगीं रावल के आनि जुरीं ब्रजनारी ॥१०॥ 

    अलख पुरुष रक्ष्या करें याकी सुनौं सकल ब्रजबाला। 
    फेरत हाथ बजावतु डौंरू कहत जियौ जुग लाला ॥११॥ 

    सीस जटा लै चरन छुवावत मुदित नाथ मन माँहीं। 
    आदि नाथ कौ वंदन कीजौ। अब डरपन कौ नाहीं ॥ १२ ॥ 

    देखि-देखि जोगी तन किलकत जननी-गोद कन्हाई। 
    पूरित प्रेम भये उर अंतर सींगी गहकि बजाई ।।१३।। 

    हठकैं लीनी पीत अँगुलिया खपरा हरषि भरायौ। 
    इहि ब्रज राज करै नंदनंदन मैं आगम लखि पायौ ।।१४।। 

    करि मिस मंत्र चरन-रज लै लै चुटकी दै दुलरावै। 
    अपने स्वामी बाल विनोदी लीला लखि सचु पावै ॥१५॥

    नीकें पय पालौ नित जननी पुत्र परम बड़भागी। 
    देत असीस चले मन्दिर तें रावल अति अनुरागी ॥१६॥ 

    यौं सुख विवस भये गोकुलपति-पौरी वंदन कीयौ। 
    वृन्दावन हित रूप स्याम कौ प्रेम विलोवत हीयौ ।।१७।।१०८॥

- verseNumber: "109"
  verseIntro: "राग आसावरी ताल आड़ (महादेव लीला)-"
  verseText: |
    री ! इक जोगी मचल्यौ मेरे आँगन मानत नहिं समुझायौ। 
    भिक्षा लेइ न मुख तें बोलै इन को मतौ उपायौ ॥१॥ 

    बूढ़ी बड़ी भेद कहौ याकौ मुहि संन्देह दबायौ। 
    पुंत्र भये पै पहिलैं कबहूँ काहू कैं हौ आयौ ॥२॥ 

    सुन्यौं न देख्यौ ऐसौ कबहूँ जैसौ भेष बनायौ। 
    पलना ओर चितै कै इन कछु आक-धतूरौ खायौ ॥३॥ 

    देखि जटनि तें वरषत पानी गरौं नाग लपटायौ। 
    चंदा सौ चमकत है माथै सब तन भसम लगायौ ॥४॥ 

    बाघंबर ओढ़ें यह सजनी डौंरू हाथ बजायौ। 
    किलकत है सुनि कुँवर कन्हैया ऐसौ इन कछु गायौ॥५॥ 

    आवौ री आवौ सब बूझौ कौंन बात हठ लायौ। 
    जिहि तिहि भाँति टरै मो घर तें देहु याहि मन भायौ।॥६॥ 

    हौं शंकति धीरज धरि तद्यपि तुमकौं टेरि बुलायौ। 
    बालक की जो दृष्टि परैगौ निश्चै जाइ डरायौ ॥७॥ 

    तब बोलीं गोपी सुख ओपी मधुरौ वचन सुनायौ। 
    कौंन काम तुम नाथ ! हमारी नगरी मन विरमायौ ॥ ८ ॥ 

    मैं तपसी वनखंड निवासी जनमत जोग कमायौ। 
    ताकौ फल लाग्यौ इहि नगरी सुधि पायें उठि धायौ ॥९॥ 

    कौंन वृक्ष अरु बेलि लग्यौ फल ताकौं तुम जु बतायौ। 
    नहिं वन नहीं बाग ह्याँ चलि जाउ आसन जहाँ जमायौ ॥१०॥ 

    हर हर हँसे नाथ यह सुनिकैं लाग्यौ वचन सुहायौ। 
    कौंन वृक्ष को बाग बताऊँ जसुमति भवन-दुरायौ ॥११॥ 

    सुकृत-पुंज की लता जसोमति परम तत्व फल पायौ। 
    मोहि देखि मणि मन्दिर रानी मोरि कपाट छिपायौ ॥१२॥ 

    अलख पुरुष मेरौ अंतरजामी तिन मोहि प्रेरि पठायौ। 
    बहुत जतन करि जंत्र मंत्र सौं गंडा इक रचि लायौ ॥१३॥

    पुत्र जनम तैं दान बहुत दियौ सुजस सकल जग छायौ। 
    तेरे भूरि भाग की महिमा बरबस चित्त चुरायौ ॥१४॥ 

    काया अमर करन तुव सुत की मेरौ मन अकुलायौ। 
    खोजि विकट गिरि बूटी लायौ तें आदरु न दिवायौ ॥१५॥ 

    मेरी वानी अमृत-सानी जो न मोद उपजायौ। 
    तौ पाछें सुधि करिहै रानी आगम तोहि जतायौ ।॥१६॥ 

    उझकि-उझकि देखति मन्दिर तें जननी-मन ललचायौ। 
    सुनौं रोहिनी रावल बानी महापुरुष दरसायौ ॥१७॥ 

    नाथ समुझि सींगी में रुचि सौं राधा नाम सुनायौ। 
    पहिल लाल नें भस्यौ हूँकरा पुनि कै रुदन करायौ ॥१८॥ 

    'कहाँ-कहाँ' यौं कहत स्याम घन रावल मरम जनायौ। 
    रवकि पालने तें तब मैया गोदी धरि दुलरायौ ।॥१९॥ 

    गहरे लेत उसास अतिलड़ौ समुझि नाथ मुसिकायौ। 
    महरि अधिक शंकित है जोगी बोलि हाथ फिरवायौ ॥२०॥ 

    महा मंत्र स्यामा नामावलि शिव रसना सरसायौ । 
    लाल अमी श्रवननि पीयौ पुनि-पुनि हूँकरा भरायौ ॥२१॥ 

    तब रानी अंचल उघारि कैं सुत-विधु-वदन दिखायौ। 
    चितये दृष्टि जोरि रावल तन अंतर प्रेम घुमायौ ॥२२॥ 

    माता ! मेरे सीस जंत्र है यौं कहि चरन धरायौ। 
    वेपथ भये अजिर में लोटत नाथ सिन्धु सुख न्हायौ।॥२३॥ 

    बड़ी वार में चेत्यौ रावल गंडा गर पहिरायौ । 
    लै कर चरन निहारत पुनि-पुनि मन करि माथौ नायौ ॥२४॥ 

    तनक भभूति काड़ि बटुआ तें नख पुनि नाभि छुवायौ। 
    माता! अमर भयौ यह बालक मेरैं गुरू लखायौ ॥२५॥ 

    आदि नाथ की धुजा चढ़ाई पुनि खपरा भरवायौ। 
    हठिकैं लई पँजीरी-अँगुली सींगी नाद करायौ ॥२६॥ 

    देत असीस जियौ सुत जुग जुग मो अभिलाष पुजायौ। 
    वृन्दावन हित रूप चरित लखि उर आनंद बढ़ायौ ।।२७।।१०९॥

- verseNumber: "110"
  verseIntro: "राग गौरी-दोहा-टेक बंध ताल मूल-"
  verseText: |
    ब्रजरानी अस सुत जायौ। 
    जोगिन जागत ना मिल्यौ सो जसुमति सोवत पायौ ॥ टेक ॥ 

    कहा धौं अधिक विशेषिये दाई भाग अनूप। 
    और लीक पाछें रही यह पहिलैं छकि गई रूप ॥१॥ 

    पहिलैं पारस रूप कौं रावर बनिता लेति। 
    चटकति हैं करजावली न्यौछावर प्रान जु देति॥२॥ 

    गृह-अँगना जगमग रह्यौ लला माइ कैं अंक । 
    मनहुँ कनक-गिरि तें सखी भये उदित जु निकर मयंक ॥३॥ 

    अरबरात पय-पान कौं कौतिक परम अभूत। 
    सब रचना जातें भई सो भयौ नन्द घर पूत ॥४॥ 

    सुत जायौ कै मोहनी सबै कहैं अस बैंन। 
    निगम अगोचर जो भन्यौ ताहि देखत भरि-भरि नैंन।।५।। 

    तत्व-तत्व कौ छानिकैं विधना काहू और। 
    शोभा की सीवाँ रच्यौ नंदलाल लोक-सिरमौर ॥६॥ 

    सब मन ढौरी यह लगी चलौ नन्द के धाम। 
    मेवनि गोद भरावहीं दुलरावैं सुंदर स्याम ॥७॥ 

    तात-मात आनंद कौ कीजै कहा प्रमान। 
    दैन बधाई आवहीं ते भूले सब घर जान ॥८॥ 

    न्याइ प्रेम ब्रज जन छके यह जु बात अनुकूल। 
    दुंदुभि देव बजावहीं भये मगन जु वरपैं फूल ॥९॥ 

    ऐसे सुत के वारनैं हूजै बारंबार। 
    दूजौ नहिं विधि-सृष्टि में अस को याकौ करतार ॥१०॥ 

    धन्य-धन्य जननी भई लाल अनौंखौ पाइ। 
    अति लौनौं दूग लागनौं कुल-मंडल गोकुलराइ ॥११॥ 

    बड़े सजन घर अब रचौ विधाना इहि सम जोर। 
    मन-क्रम-वचन असीस दै कहैं लै-लै अंचल-छोर ॥१२॥ 

    और कहाँ लगि कीजिये या सुख की परसंश। 
    रस-मूरति अहिलादिनी होहु स्वामिनि श्रीहरिवंश ॥१३॥ 

    वचन जसोमति-रोहिनी सुन्यौं वधुनि कौ कान। 
    प्रबल प्रेम हिय में बढ्यौ ताकी सबपै फिरि गई आन ॥१४॥ 

    लाल हूँकरा भस्यौ पुनि बानी भई अकास। 
    सब मुख वचन अमी श्रवै चाहें भानु-वंश-परकास ॥१५॥ 

    कमनी वपु धस्यौ गोप-गृह कौतिक रचन अनंत। 
    वृन्दावन हित रूप रस-जस गावौ रसिक गुनवंत ॥१६॥११०॥ 

- verseNumber: "111"
  verseIntro: "राग जैतश्री-"
  verseText: |
    सब मिलि आवौ मंगल गावौ आजु भाग अनुकूल्यौ जू। 
    नन्द सुकृत की बेलि लहलही देखि सकल ब्रज फूल्यौ जू॥१॥ 

    बाढ़ी गहकि लोक-लोकनि में फैलि गई हरियारी जू। 
    सींची नेह-नीर छिन-छिन प्रति गोभा उलही भारी जू॥२॥ 

    सोभा अवधि-अवधि सब सुख की ऐसौ फल दरसायौ जू। 
    भयौ न हौनौं ढोटा लौनौं धनि ऐसौ सुत जायौ जू॥३॥ 

    जाके जनम महा मंगल दिन घोष सिमिटि सब आयौ जू। 
    शिव-समाधि कौ तत्व निगम-गथ बिनुहीं श्रम सो पायौ जू॥४॥ 

    री यह ब्रजजन-लोचन-थाती धनि विधना जिन दीनी जू। 
    अति कमनीय वदन बानिक की हौं न्यौछावर कीनी जू॥५॥ 

    पट उघारि मुख अंक महर कैं भटू ! देखि हौं आई जू। 
    मेरी दसा भई कछु औरै बैंननि बरनी न जाई जू॥६॥ 

    नीकी विधि पूरब कोऊ पूजन कीनौं है ब्रजरानी जू। 
    ता कृत कौ फल पूरन पायौ मैं निश्चै जिय जानी जू॥७॥ 
    
    दरसतु है ब्रज प्रेम नई विधि सरसत हैं हीये जू। 
    बरसतु है अति रंग अलौकिक बनत न उपमा दीयें जू॥८॥ 
    
    ये देखि मगन भये सुर कौतिक व्योंम विमाननि छायौ जू। 
    इत ब्रजपति कौ धाम अलंकृत विधि विस्मय उपजायौ जू॥९॥ 
    
    कृष्ण-आगमन इहि ब्रज-अवनीं बरसति जहाँ तहाँ सोभा जू। 
    वृन्दावन हित रूप प्रेम की उलही सब मन गोभा जू॥१०॥१११॥

- verseNumber: "112"
  verseIntro: "कवित्त-"
  verseText: |
    मर्कतमणि ओभा किधौं सोभा हू की सोभा कै, 
    सिंगार तरु-गोभा किधौं प्रेम-उरझाँवरौ । 
    सुकृत कौ सार कै अधार प्रान जसोमति कै, 
    रसमय स्वरूप किधौं जन-सुख-थाँवरौ ॥ 

    किधौं वपु लाड़ किधौं चाड़ ब्रजजन फली, 
    किधौं घन घुमड्यौ अनुराग कौ धाँवरौ। 
    नन्द कौ आनन्द-निधि लोक-लोक उफन्यौ कै, 
    वृन्दावन हित कैधौं रूप बीज साँवरौ ।।११२॥ 

- verseNumber: "113"
  verseIntro: "राग चैती गौरी-"
  verseText: |
    अहो आजु नन्द भवन आनंद बधाई बाजै रँग भरी। 
    अहो चलि निरखौ गोकुल चंद धन्य यह शुभ घरी ॥ टेक ॥१॥ 

    चलीं मिलि ब्रजसुंदरी उर बढ्‌यौ अधिक हुलास। 
    भई जोति उदोत मन्दिर कियौ कुल कुँवर प्रकास । बधाई बाजैं० ॥२॥ 

    गावैं तौ गीत सुहावने लै गोप कुल के नाम। 
    साजे हैं मंगल साज सबहिनु आईं नन्द जू के धाम ॥३॥ 

    मणि फटिक जटित अमोल नग जगमगत ऊँचे द्वार। 
    तने हैं कुसुम वितान जहाँ तहाँ सौरभ की उदगार ॥४॥ 

    गौर तन प्रतिबिंब तिनमें दामिनी ज्यौं कौंध। 
    पग धरै जकि थकि रहें नैंननि छाई है चकचौंध ॥५॥ 

    बैठीं भवन भरपूरि सुंदरि सकल गुन अभिराम। 
    महरि-कूखि मल्हावहीं जिन जायौ है सुंदर स्याम ॥ ६ ॥ 

    इक भानु घर की ढाँढिनी यौं कहति वचन सुनाइ। 
    आगम कथौं सबही सुनौं जाहि सुनत ही हियौ सिराइ ॥७॥ 

    जजमान मेरौ महाराजा भानु गोप नरेश। 
    तिहिं भवन कीरति कूखि कन्या कीनौं है परवेश ॥८ ॥ 

    दस-पाँच दिन बीतें प्रगटि है जासु राधा नाम। 
    शेष-शिव-विधि-सेव्य कन्या वे स्यामा ये स्याम ॥९॥ 

    महा भाग्य महरि जसोदा सुनत हरषी हीय। 
    लई कर गहि भवन ढाँढिनि पुत्र-दरस ताकौं दीय ॥१०॥ 

    दधि दूध माखन भरे भाजन हरद कुमकुम घोरि। 
    नन्द मन्दिर छिरकहीं नर-नारीं करि बरजोरि ॥११॥ 

    चुहचुहे चीर अमोल भूषन कंचुकी बहु भाँति। 
    मुदित द्वै पहिराइ रानी फूली अंग न माति ॥१२॥ 

    अवलोकि स्यामहिं सुंदरी दुहुँ करनि अंचल लेत। 
    होहु ब्रज सिरमौर सबकौ हरषि असीसहिं देत॥१३॥ 

    जै श्रीरूपलाल कृपाल जीवनि अवतरे नंदनंद। 
    बढ्यौ जस सब लोक पावन छायौ है ब्रज आनंद ॥१४॥ 

    धन्य नन्द महरि जसोदा सुत जन्यौं ब्रजईस। 
    होहु भूषन पाद-पल्लव वृन्दावन हित सीस ॥१५॥११३॥

- verseNumber: "114"
  verseIntro: "सारंग तथा सोरठ-"
  verseText: |
    नन्दजू कौ चिरुजीवौ यह छैया। 
    आँगन बैठि बेगदै खेलौ हरि हलधर दोऊ भैया। 
    सुकृत उदौ कोऊ भयौ पाछिलौ लरज्यौ है मन दैया। 
    वृन्दावन हित रूप महरि जानौं परमेश्वर की मैया ॥११४॥

- verseNumber: "115"
  verseIntro: "राग सोरठ (असीस)-"
  verseText: |
    लला चिरुजीवनौं रानीं। 
    हित सौं देति असीस वधूजन अमी श्रवत वानी ॥ 
    गोकुलपति-मन्दिर कौ गहनौं ब्रजजन सुखदानी। 
    वृन्दावन हित रूप कौतिकी है है हम जानी ॥११५॥

- verseNumber: "116"
  verseIntro: "राग देव गन्धार-"
  verseText: |
    जियौ माई जुग जुग गोकुल चंद। 
    गहगही देत असीसैं हित सौं मुरि-मुरि बनिता वृंद ॥१ ॥ 

    जाके जनम पवित्र गोप-जस गावत रिषि श्रुति-छंद री ! 
    यह होहु सकल ब्रज-भूषन जीवन जसुदानंद ॥२॥ 

    वौँ मान साधु द्विज-गुरुजन देहु अखिल आनंद। 
    वृन्दावन हित रूप महर-सुत वन्दहु सनक-सनक ॥३॥११६॥


- verseNumber: "117"
  verseIntro: "राग देव गन्धार-"
  verseText: |
    महा मुनि देत असीस ब्रजेश। 
    चिरुजीवौ कुल-मंडन तेरौ सुबस बसौ यह देश ॥१॥ 

    बाढ़ौ धर्म-धाम-धन गोधन नासौ सकल कलेश। 
    बाढ़ौ आयु विपुल तुव सुत की, गावौ सुजस महेश ॥२॥ 

    बढ़ौ प्राताप नंदनंदन ज्यौं, शुकल पक्ष राकेश। 
    निधि-सिधि रहौ भवन नित सेवत, लछिमी करहु प्रवेश ॥३॥

    हरि हित रूप नाम-गुन नित नव, कहौ सहस मुख सेश। 
    वृन्दावन हित सीस चरन-रज, बंदौ भूमि-नरेश ।।४।।११७।।

- verseNumber: "118"
  verseIntro: "माँझ, प्रथम दोहा-"
  verseText: |
    आमहरि भाग कहाँ लगि कहौं त्रिभुवन सम कोउ नाहिं। 
    शिव-विधि करत प्रसंस अस रतन कढ्यौ उर माँहिं ॥१॥ 

    त्रिभुवन बाजे बाजनैं भाजन धातु सँजूत। 
    मंगल-निधि जनम्यौं जबहिं नन्द महर घर पूत ॥२॥ 

    मन-क्रम-वच करि देत हैं गोपी सबहि असीस। 
    होहु घोष जन लाड़िली प्रान सुधन ब्रजईस ॥३॥ 

    रूप बढ़े छिन-छिन सखी यह अचरज कहै कौंन । 
    इहिं घर भावै आइवौ भूलीं अपने भौंन ॥४॥ 

    (गाइवे की टेक) 
    श्रीकृष्ण जनम गुन गावैं ब्रज जन अनुरागी। 
    प्रेम-छके दुलरावैं धनि-धनि बड़भागी। 

    (छन्द माँझ के) 
    आविर्भाव नन्दनन्दन कौ रचैं सोहिले भल्ले। 
    गोकुलपति की सिंहपौरि पै घाव निसाननि घल्ले । 
    सजैं सिंगार भेंट लियें आवति ब्रज-बनितन के रल्ले। 
    वृन्दावन हित रूप असीसत लै कर अंचल पल्ले ॥१॥ 

    अहो जसोदे ! हम कहा बरनैं भाग तुम्हारौ मोटा। 
    अजिर रूप कौ बाग फूलि है हरि-हलधर कौ जोटा। 
    सकल गुननि करि कहत बड़ौ मुनि तुम जिन जानौं छोटा। 
    वृन्दावन हित रूप हू जियौ ब्रज-पालक तुम ढोटा ॥२॥ 

    गरग कहि गयौ गोप सभा याहि नारायन सम जानौं। 
    जनम्यौं बली नक्षत्र रोहिनी गुन कहाँ लगि जु बखानौं।। 
    सुरपति से विधि से नै चलिहैं सत्य वचन रिषि मानौं। 
    वृन्दावन हित रूप असीसैं देतजु हियौ सिहानौं ॥३॥ 

    कृष्ण-जनम-सुख गहरौ सागर कोऊथाह न पावैं। 
    ब्रजजन सबहि करत मन-मज्जन उमगि-उमगि जस गावैं॥ 
    ब्रह्मादिक-शिवादि नारद-शुक मनहिं अधिक दौरावैं। 
    वृन्दावन हित रूप महा गरुवौई सबहि बतावैं ॥४॥ 

    दै असीस घर जाहिं बहुरि दैवे कौं दौरी आवैं। 
    लाल-जनम लखि प्रेम छकीं सब हुलसीं मंगल गावैं॥ 
    रूप कलपतरु कूख महरि की पुनि-पुनि ताहि मल्हावैं। 
    वृन्दावन हित रूप-सिन्धु में नैन-मीन पैरावैं ॥६॥११८॥

- verseNumber: "119"
  verseIntro: "(बरस गाँठ) राग विलावल"
  verseText: |
    बरसगाँठ नंदलाल की आजु उबटि न्हवावौ। 
    मोतिनु चौक पुराइकैं मणि-चौकी बिछावौ॥१॥ 

    घसि-घसि सकल सुगन्धि कौं केसरि जु मिलावौ। 
    शोधि शुभ घरी श्याम कैं लै अंग लगावौ ॥२॥ 

    मंगल कलश वितान रचि लै धुजा धरावौ। 
    विप्रनि वेद पढ़ाइ कैं अभिषेक करावौ॥३॥ 

    सुन्दर अंग अँगोछि कैं सुचि पट पहिरावौ। 
    मणि-भूषण अँग-अँग सचौ रचि तिलक बनावौ॥४॥ 

    विविध पाक मेवा विविध मोहनहिं जिमावौ। 
    त्रिपित होहि मेरौ लाड़िलौ लै जल अँचवावौ॥५॥ 

    रोरी-अछत लाल के माथें जु लगावौ। 
    बोलौ भूवा नन्दिनी आरतौ सजवावौ॥६॥ 

    पंच शब्द जै धुनि करौ कुसुमनि बरसावौ। 
    सुख ओपीं सब भामिनीं मिलि मंगल गावौ॥७॥ 

    द्विज-भिक्षुक आये घने तिन आस पुजावौ। 
    बोलौ श्रीब्रजराज जू बहु दर्वि लुटावौ॥८॥ 

    आवौ सजि मंगलमुखी गुन सबहि दिखावौ। 
    मागद-चारन-भाट मिलि कुल-सुजस बुलावौ ॥९॥ 

    लेहु मनवाञ्छित जुवतिजन मोपै जुरि आवौ। 
    मो कुल वर्द्धन स्याम कौं जु असीस सुनावौ ॥१०॥ 

    चोबा-चंदन-अरगजा सब तन चरचावौ । 
    वीथीं नीर गुलाब सौं चहुँ दिसि छिरकावौ ॥११॥ 

    कौतिक नाना विधि रचौ मेरे ललहिं दिखावौ। 
    दूध-दही घट भरि घने तुम खेल मचावौ ॥१२॥ 

    धाँम-गाँम मंगल महा मन मोद बढ़ावौ। 
    पट भूषन-सेवा बधुनि दै गोद भरावौ॥१३॥ 

    करहु सुखित पुरजन सबै मेरे सदन बधावौ । 
    वृन्दावन हित रूप बलि अतिलड़ दुलरावौ ॥१४॥११९॥

- verseNumber: "120"
  verseIntro: "राग चैती गौरी-साथिये (सवासिनि बरनन)-"
  verseText: |
    आजु कौ सोहिलौ॥ 
    अहो भई गोप-वंश अति ओप॥ 
    लला कौ सोहिलौ ।॥ टेक ॥ 

    अहो बेटी ! सुनहु सुता परजन्य की बेटी ! सथिये धरहु बनाइ॥ 
    अहो बेटी ! सुभ दिन विधना दाहिनौं बेटी ! लीकनि लेहु गनाइ॥ लला० ॥१॥ 

    अहो भाभी ! हौं नित उदौ मनावती भाभी ! पूजत ही गिरिराज । 
    अहो भाभी ! जिहि सुकृत इहि फल फली भाभी। मो झगरंन दिन आज॥ लला० ॥२॥ 

    अहो भाभी विप्रनि के पद वंदती भाभी माँगत ही पट ओटि। 
    अहो भाभी गोधन खिरकनि पूजती भाभी और जतन किये कोटि ॥ लला० ॥ ३॥ 

    अहो भाभी पुत्र जनम घर वीर कै भाभी जाँचत ही दिन रैंन । 
    अहो भाभी ब्रजपति-पुन्य-प्रताप तें भाभी यह दिन देख्यौ नैंन।।लला० ॥४॥ 

    अहो बेटी कुल परजन्य सफल कियौ बेटी साधन बहु विध साधि। 
    अहो बेटी विपुल बधावौ वीर-घर बेटी तुम कियौ प्रभु आराधि ॥ लला० ॥ ५॥ 

    अहो बेटी पहिरि कुँवर के जनम दिन बेटी जो मन इच्छा होइ । 
    अहो बेटी ! वीर तुम्हारौ देशपति बेटी वस्तु न दुर्लभ कोइ ॥ लला०॥ ६॥ 

    अहो भाभी धनि तेरौ जनक उदार अति भाभी धनि तेरी पटुला माइ। 
    अहो भाभी तुम मोहि अति सनमान सौं भाभी सब विधि देहु गनाइ ॥ लला० ॥ ७॥ 

    अहो भाभी इक बरनी दै धैनु लख भाभी इतने ही पट आभरन। 
    अहो भाभी बाँटौंगी घर आपनैं भाभी तुम जस जग विस्तरन।। लला०॥ ८॥ 

    अहो भाभी ग्वाल सिंगार संग तिन भाभी बहु दासी मो लार ॥ 
    अहो भभी रतन देहु बहु सकट भरि भाभी इतनौंई सुवरन भार॥ लला० ॥९॥ 

    अहो भाभी घोष नृपति परजन्य कैं भाभी जब जनम्यौ मो वीर। 
    अहो भाभी देवमीढ़ नृप की सुता भाभी लिये सकट सत चीर ।। लला० ।।१०।। 

    अहो भाभी ! मो जननी बहु विधि दिये भाभी पट-भूषन-गो-रतन।
    अहो भाभी कृष्ण जनम हौं चौगुनौं भाभी लैहौं हठि बहु जतन ।। लला०॥ ११॥ 

    अहो बेटी ! इतनैं कौ कहा माँगनौं बेटी ब्रजपति प्रबल प्रताप ॥ लला० ॥ 
    अहो बेटी ! खोलि बड़े नग कोष कौं बेटी लै मन भायौ आपु ॥ लला० ॥ १२॥ 

    अहो बेटी गोधन ब्रजमंडल छये बेटी इक बरनीं गनि लेहु । 
    अहो बेटी कंचन दासी ग्वाल बहु बेटी लेहु असीसनि देहु ॥ लला० ॥१३॥ 

    अहो भाभी ! जो माँग्यौ सो-सो दियौ भाभी ! सुनहु असीस अनेक ॥ 
    अहो भाभी ! सब जन पालक स्याम घन भाभी होहु कुल मंडन एक ॥ लला० ॥१४॥ 

    अहो भाभी ! इहि सम जो अब विधि रचै भाभी ! बड़े हो सजन घर जोर ॥ 
    अहो भाभी ! त्यौं ही सबनि मनाइहौं भाभी लै कर अंचल-छोर।। लला०॥१५॥ 

    अहो भाभी ! स्याम सुभग हित रूप के भाभी चिंतत सुखद उपाइ ॥ 
    अहो भाभी ! वेगि दृगनि भरि देखिहौं भाभी सत्य कहौं समुझाइ ॥ लला० ॥१६॥ 

    अहो भाभी ! तब मन भायौ माँगिहौं भाभी हौं परकारज नीक ॥ 
    अहो भाभी वृन्दावन हित दुहुँनि की भाभी दासि देहु लिखि लीक ॥ लला०।।१७।॥१२०॥

- verseNumber: "121"
  verseIntro: "(दाई बरनन) राग चैती गौरी-"
  verseText: |
    पौढ़ी भवन नन्द-घरनी। जगत जस करनी ॥ 
    कृष्ण उर धरनीं। भाग्य बड़ बरनी ॥ 
    अहो सुपनैं अचिरज देखि सखीय जगाइयौ ॥१॥ 
        
    सुनि री भटू ! हितकारी। कहाँ थौं कहा री ॥ 
    इहि औसर बारी। अचंभौ महा री ॥ 
    अहो पुत्र-जनम की है वेर सु गहरु न कीजिये ॥२॥ 

    इहि छिन सुपनौं आयौ। मोहन सुत जायौ। 
    हँसि कण्ठ लगायौ। जगि तोहि जगायौ ॥ 
    अहो यह सुपनौं सखि साँचौ उठि आलस छाँड़िकें ॥३॥

    भयौ री कुलाहल भारी। जगे नर-नारी ।। 
    रैंनि अँधियारी। दामिनि कौंधै न्यारी ॥ 
    अहो ऊँचैं चढ़ि-चढ़ि टेरै तौ दाई बुलाइयौ ॥४॥

    दाई मन्दिर आई। सु कूखि सिराई ॥ 
    भई मन भाई। भवन छबि छाई॥ 
    अहो मिलि दस-पाँच सहेलिनु मंगल गाइयौ ॥५॥ 

    मनु छबि तन धरि आई। लला जू की दाई॥ 
    भरी चतुराई॥ तियनि-मन भाई ॥ 
    अहो को बरनैं ताके भाग प्रथम दरसन कियौ ॥६॥

    तिहि छिन ऊग्यौ है चंदा। प्रगटे नन्दनन्दा।। 
    सकल सुखकंदा। तिमिर भयौ मंदा ॥ 
    अहो निरखि वदन छबि-सदन सबै विस्मय भईं ॥७॥ 

    दृष्टि न थिरु ठहराई। चकचौंधी छाई ॥ 
    अंगनि की लुनाई। शोभा हूँ लजाई ॥ 
    अहो त्रिभुवन उपमा कौंन सु तिहिं सम दीजिये।॥८॥ 

    रूप लाल कौ देखें। जनम शुभ लेखें ॥ 
    सु भाग्य विशेखें। लगत न निमेखें ॥ 
    अहो रही है अपुनयौ हारि रूप-चहलैं परी ॥९॥ 

    सोवत नन्द जगाये। आतुर उठि धाये ॥ 
    सु विप्र बुलाये। नक्षत्र सुधाये ॥ 
    अहो जनमपत्र लिखवाइ दान अगनित दये॥१०॥ 

    बोलत द्विज शुभ वानी। सुनौं नन्दरानी ॥ 
    पुनीत कहानी। पुत्र सुखदानी ॥ 
    अहो अखिल लोक कौ ईश सुतौ तुम उर धास्यौ ।॥११॥

    बन्दी विरद उचारैं। खरे दरबारैं ।। 
    गुननि विस्तारैं। नाम लै पुकारें ॥ 
    अहो धनि गोकुल के ईश कीरति जग जगमगै ॥१२॥ 

    नन्दराइ जू की पौरी। सबै उठि दौरीं।। 
    नव गोप-किशोरी। नवल रस बोरी ॥ 
    अहो विधि तन गोद पसारि महरि पद बंदहीं ॥१३॥ 

    जसुमति नन्द बुलाये। पुत्र-ढिंग आये।। 
    लाल अन्हवाये। परम सचु पाये।॥ 
    अहो धूप-दीप आरतौ सु धस्यौ है सँजोइकैं ।॥ १४ ॥ 

    मुदित जसोमति मैया। पुनि लेत बलैया। 
    जियौ मेरौ छैया। यह कुँवर कन्हैया ॥ 
    अहो लगत विप्र के पाँइ महरि बड़भागिनी ॥१५॥ 

    रतननि खपरा भरायौ । गनि नेग धरायौ।। 
    दियौ मन भायौ। अभिलाष पुजायौ ॥ 
    अहो दाई देति असीस विदा है घर चली ॥१६॥

    चिरुजियौ नन्द-दुलारौ। यह प्रान पियारौ ॥ 
    अरी ! तेरौ वारौ। तुब भवन उज्यारौ ।। 
    अहो ब्रजजन मुदित चकोर उदित कुल चंद्रमा ॥१७॥ 

    जै-जै धुनि परकासी। कहत नभ-वासी ॥ 
    सु श्रवत सुधा सी। धन्य ब्रजवासी ॥ 
    अहो धन्य भयानौं देस सदा मंगल जहाँ ॥१८॥ 

    नन्द-सदन सुख जैसौ। सुन्यौं न देख्यौ तैसौ ॥ 
    पावै जो अज वैसौ। कहि न सकै लेसौ ॥ 
    अहो श्रीहरिवंश-कृपा बल लघु मति कछु कयौ ॥१९॥

    कृष्ण-जनम जस वरनैं। हित रूप मन हरनैं ।॥ 
    जग मंगल करनैं। देहु पद सरनैं ।॥ 
    अहो वृन्दावन हित रूप पावै बधाई बास वन ॥२०॥१२१॥

- verseNumber: "122"
  verseIntro: "राग चैती गौरी (खिचरी बरनन)-"
  verseText: |
    हँसि ब्रजरानी बोली। वचन निरमोली ॥ 
    ग्रन्थि हिय खोली। विधि तन करि ओली ॥ 
    अहो खिचरी देहु ब्रजराज लला कैं सोहिले ॥१॥ 

    सुनत नन्द मुसिकाये। वचन मन भाये ।। 
    निकट चलि आये। बड़ भाग्य मनाये ॥ 
    अहो किहि विधि खिचरी चहियै कहौ समुझाइकैं ॥२॥ 

    दाख-चिरौंजी मिलामैं। पिस्ता-बादामैं॥ 
    कोपरा तामैं। मेवा सब जामैं॥ 
    अहो सचे हैं तुम्हारें भवन हमें गनि दीजिये ॥३॥ 

    ब्रजपति सब विधि करत। हियै सुख भरत।। 
    प्रेम-अरवरत। रंग-रस ढ़रत॥ 
    अहो मेवा सकल मँगाइ घोष रानीं दियौ ॥४॥ 

    अहो-अहो ! गोकुलराइ। सुनौं चित लाइ॥ 
    बरेयसी बुलाइ। तुम्हारी माइ ॥ 
    अहो चरुवा आनि चढ़ावै तौ भाग्य उदै भयौ ॥५॥ 

    भाग्य भरी सो आई। जबहि सुधि पाई॥ 
    सब देति बधाई। मंगल धुनि छाई ॥ 
    अहो जननी नंद ब्रजेश प्रेम पूरित भई॥६॥ 

    आनँद हिय न समात। लाल ढिंग जात।। 
    निरखि छबि गात। कहति यह बात।। 
    अहो धन्य जसुमति तेरी कूखि भवन-भूषन जन्यौं ।॥७॥ 

    चरुवा चीति चढ़ायौ। मुनि वेद पढ़ायौ।। 
    मन मोद बढ़ायौ। दान झर लायौ।। 
    अहो पहिरत कर मणि-कंकन पुत्र बधू दये ॥८ ॥ 

    विप्र-वधुनि धन देत । असीसनि लेत।। 
    जनम सुत हेत। दया कौ निकेत ॥ 
    अहो दादी मोहनलाल सुजस-मूरति मनौं ॥९॥ 

    खिचरी चरुवा गान। महरि सुनि कान॥ 
    देति सनमान। यहै चाहौं दान ॥ 
    अहो वृन्दावन हित रूप स्याम दृग-देखिवौ ॥१०॥१२२॥

- verseNumber: "123"
  verseIntro: "राग चैती गौरी-"
  verseText: |
    गोप-नृपति-घर सोहिलौ। 
    अहो आजु सफल फली ब्रजरानी ।। नृपति घर०॥ टेक ॥ 

    जिहि छिन ब्रजेश-कुमार जनम्यौ सुभ महूरत पाइ। 
    भुव ओक लोक अनंत बाजे बाजत अपने चाइ ॥ नृपति घर०॥१॥ 

    ब्रज-मही सुख-सरिता बही मति रही अचिरज पेखि। 
    गोविन्द गोकुल-गोप-नंदन चलि सखि नैंननि देखि ॥२॥ 

    इक भवन गवनीं रूप-रवनीं चलति आतुर चाल। 
    इक लहति लोचन लाभ पहिलैं निरखति मुख नंदलाल ॥३॥ 

    अजिर बनिता-वृन्द राजैं रचत मंगल साज। 
    ब्रजराज-अनुजा लाग अपनीं माँगत है हठ आज ॥४॥ 

    मेरी भाग भरी सुहाग भाभी घोष ईश उदार। 
    लैंउँगी मन भाँवतौ कियौ मो वाञ्छित करतार ॥५॥ 

    सुनि मुदित जसुमति विधि मनावत लगति पुनि-पुनि पाँइ। 
    हरि-जनक-जननीं मान वर्द्धत पहिरावत चित चाइ ॥६॥ 

    पढ़त बन्दी विरद पौरी विप्र उचरत वेद। 
    गोप टेरी देत नाँचत गोपीं सुगतिनु भेद ॥७॥ 

    इक छकीं जसुमति-भाग्य-महिमा देखि परम अभूत। 
    इक लेत हरखि बलाइ कहि यौं महरि-पुन्य-फल पूत ॥८॥ 

    इक बैठि खरचति चाइ भाइनु आपुनौं धन खोलि। 
    इक देति सकल सवासिनिनु कौं पट-आभूषन बोलि ॥९॥ 

    बलि जाउँ हरि हित रूप जनमत असुभ डारे चूरि। 
    वृन्दावन हित सकल ब्रज तें गये हैं सबै दुख दूरि ॥१०॥१२३॥

- verseNumber: "124"
  verseIntro: "राग गौरी-दोहा टेक बंध हेरी की तरह में (गोपी गोप ग्वारन की निर्त्त)"
  verseText: |
    दिन सोहनौं भैया दिन सोहनौं भैया ॥ टेक ॥ 

    आजु भयौ दिन सोहनौं हो पसर जाहू जिन ग्वाल। 
    लै चलौ ग्वाल सिंगारि कैं रानी जसुमति जायौ लाल ॥ रे भैया० ॥१॥ 

    जुरि मिलि ग्वाल सबै गये हो, कहत सुनौं ब्रज भूप। 
    दान देहु उठि द्विजन कौं जनम्यौं कुँवर अनूप ॥२॥ 

    मागद-चारन जस पढ़ें हो ढ़ाँढ़ी बरनतु वंश। 
    प्रगट्यौ सुंदर साँवरौ देव करत परसंश॥ रे भैया० ॥३॥ 

    सुर-नर-मुनि नाँचत बाबा नंद॥ रे भैया०॥४॥ 

    अग्रज-अनुजन-मध्य में हो विहँसत गोकुलराइ। 
    कंचन गिरि सौ तन लसै हलै थोंदा सहज सुभाइ ॥ रे भैया० ॥५॥ 

    हरी दूब सिर पर लसै हो रोरी तिलक जु भाल। 
    कृष्ण-जनक मुरि-मुरि नचै उर रुरत जलज-मणि माल ॥ रे भैया० ॥६॥ 

    बाहु ढुरैं ग्रीवाँ मुरै हो सजल प्रेम सौं नैंन। 
    मनहुँ कृपा मूरति धरै गदगद निसरत बैंन ॥ रे भैया० ॥७॥ 

    पीत उपरना राजहीं हो दीरघ तन कमनीय। 
    सुकृत-पुंज ब्रजपति लह्यौ धन्य जनम अवनीय ॥ रे भैया० ॥८॥ 

    आनन अति ही डहडह्यौ हो पुत्र-जनम उत्साह। 
    भवन भंडार लुटावतें मन गोकुलपति जु उमाह ॥ रे भैया० ॥९॥ 

    मणि मन्दिर अति जगमगै हो जहाँ धुजा फहरात। 
    कृष्ण-जनम छबि मन बढ़ी लोकन जीतन जात॥ रे भैया० ॥१०॥ 

    गौर वरन शोभा-धरन हो सब गोपनि-सिरमौर। 
    प्रभु सुख-सींव जहाँ रची उपमा कौं नहिं ठौर ॥ रे भैया० ॥११॥ 

    नौ जु नन्द नौ भानु मिलि हो अरु सब गोप-समाज। 
    हरद-दही सौं तन `सने झूमक निर्त्तत आज॥ रे भैया० ॥१२॥ 

    नाँचत गोपी भवन में हो गोप अजिर कैं माँह। 
    गावत करतल पटकिकै झुकि लागत गरबाँह ॥१३॥ 

    सिर-टोपीं कटि-काछिनी हो तनियाँ परसत पाँइ । 
    धरै पिछौरी लकुट पर नचत ग्वाल-समुदाइ ॥ रे भैया० ॥१४॥ 

    माखन के लौंदा चलैं हो दधि की होत उलैंड़। 
    सिन्धु बढ़ि चल्यौ प्रेम कौ नैंम बहाई मैंड ॥ रे भैया० ॥१५॥ 

    गाइ छवाईं गोइरैं हो चीते जिनके अंग। 
    मनौं सरस्वती रवि-सुता चकफेर बही मनु गंग।। रे भैया० ॥१६॥ 

    जरी वितान जु झलमलैं हो मोतिनु झालरि कोर। 
    कृष्ण-जनम मनु मोद भरि हँस्यौ गगन छबि-जोर ।। रे भैया० ॥१७॥ 

    सुर-नर-शिव-मुनि-शेष-विधि हो खोजत जाकी बाट। 
    सो जसुमति गोदी धरै कोधौं सुकृत ललाट ।।१८।। 

    कहाँ लगि बरनि सुनाइये हो मंगल ब्रजपति-धाम। 
    वृन्दावन हित रूप जहाँ पय पीवन जनम्यौं स्याम।। रे भैया दिन सोहिनौं ॥१९॥१२४।।

- verseNumber: "125"
  verseIntro: "सवासिनी-हेरी की तरह में -"
  verseText: |
    भयौ री मन भाँवतौ मन भाँवतौ भयौ ॥ टेक ॥ 

    आजु भयौ मन भाँवतौ हो बीरन-वंश उदोत। 
    नौबत बाजी गहकि कैं घर-अँगना जगमग होत ॥ री भयौ० ॥१॥ 

    भाभी-कूख सफल भई हो शुभलक्षन कौ मूल। 
    सुत जायौ ब्रज मुकुटमणि लखि घर-घर बाढ़ी फूल॥ री भयौ० ॥२॥ 

    लाल-जनम कुल वीर कैं हो दई दिखायौ मोहि। 
    हिय आनँद बिनुमित सखी जाकी गिनती कापै होहि ॥ री भयौ०॥३॥ 

    मैं व्रत-नेम बहुत किये हो मन-क्रम-वचन संजूत । 
    अलभि लाभ भाभी लहह्यौ ता कृत कौ फल पूत ॥ री भयौ०॥४॥ 

    तब धारिहौं रचि साथिये हो लैंहौं गनि सब साज।
    हौं बेटी परजन्य की भाभी ! मोहि झगरनि दिन आज । री भयौ०॥५॥ 

    चरन लागि जसुमति कहह्यौ हो ब्रजपति कहह्यौ दै मान। 
    जो भावै सो लीजिये रचि मंगल विधि जु विधान।। री भयौ०॥६॥ 

    पट-भूषन गोधन-रतन हो दीने नन्द उदार। 
    सानन्दा अरु नन्दिनी सथिये चीतति द्वार ।। री भयौ ॥७॥ 

    आँगन खेलौ वेगि दै हो नित-नित बढ़ौ उछाह। 
    भाभी ! नंदन चिरुजियौ होहु त्रेगि दै हो नित-नित बढ़ौ उछाह। 
    भाभी ! नंदन चिरुजियौ होहु वेगि दै व्याह ॥ री भयौ० ॥८॥ 

    कीरति-जसुमति के वचन हो हौंहिं बज्र की लीक । 
    मोहि सगुन सब लखि परे सत्य जानियौं ठीक ॥ री भयौ०॥९॥ 

    पहिरीं सकल सवासिनी हो मन वाञ्छित सब पाइ। 
    वृन्दावन हित रूप की लई दासि लिखवाइ ॥१०॥१२५॥

- verseNumber: "126"
  verseIntro: "राग देव गन्धार-"
  verseText: |
    महरि पट ओटि असीसनि लेति । 
    सत्य होहु वानी तुम मुख की हँसि बहु आदर देति ॥१॥ 

    महा भाग मन मुदित जसोमति पूरन प्रेम-निकेत। 
    पहिरावत परिजन्य-सुता कौं भूषन वसन समेत॥२॥ 

    बलि हित रूप चरित प्रभु कौतिक जननी वारिध हेत। 
    वृन्दावन हित तिहि पय पालत निगम कहत जिहि नेत॥३॥१२६ ॥



