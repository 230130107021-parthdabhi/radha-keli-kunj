- verseNumber: "1"
  verseIntro: "गो० श्रीहितहरिवंशचन्द्र महाप्रभुजी कृत - राग विहागरौ - (सावन सुदी तीज से यह पद नित्य होय है)"
  verseText: |
    झूलत दोऊ नवल किशोर ।
    रजनी जनित रंग सुख सूचत अंग-अंग उठि भोर ॥ 
    अति अनुराग भरे मिलि गावत सुर मंदर कल घोर । 
    बीच-बीच प्रीतम चित चोरत प्रिया नैन की कोर ॥ 
    अवला अति सुकुमारि डरत मन वर हिंडोर झकोर । 
    पुलकि-पुलकि प्रीतम उर लागत दै नव उरज अकोर ॥ 
    अरुझी विमल माल कंकन सों कुण्डल सों कच डोर ।
    बेपथ जुत क्यौं बनैं विवेचत आनंद बढ्यौ न थोर ॥ 
    निरखि-निरखि फूलत ललितादिक विवि मुख चंद्र चकोर । 
    दै असीस श्रीहरिवंश प्रसंसत करि अंचल की छोर ॥1॥

- verseNumber: "2"
  verseIntro: "श्रीसहचरिसुखजी कृत - (सावन सुदी तीज कौ)"
  verseText: |
    श्री वृषभान की पौरी रच्यौ है हिंडोरना ।
    ब्रज मोहन सोहन कौ है चित चोरना ॥
    चित चोर मोहन छैल कौ मन मोहनी मन कों छलै ।
    मरुवे मयारिनु लसत थंमन रतन अवनी झलमलै ॥
    पटुली पिरोजा पदक खचि डाँड़ी रची मुक्तान की ।
    बलि सहचरी सुख रच्यौ हिंडोरौ पौरि श्रीवृषभान की ॥1॥

    झूलन आई हैं गोरी नव-नव गोप किशोरी । 
    ते सब वैसन भोरी श्याम रंग में बोरी ॥ 
    बोरी किशोरी वैस भोरी लसत जोवन लहलहैं । 
    अरविंद चंद सु मंद दुति उपमा कहा कहि कवि कहैं ॥   
    पचरंग पहिरैं चूँनरी अँग-अंग रूप समान की ।
    बलि सहचरी सुख रच्यौ हिंडोरौ पौरि श्रीवृषभान की ॥2॥ 

    श्यामा जू संग सहेली फूलीं प्रीति ही की बेली । 
    सब छवि पायन पेली हैं सुहाग अलवेली ॥ 
    सुंदर सहेली प्रीति बेली झरत राग पराग कौं । 
    सिंगार कली खिलीं चहुँ दिसि अति रसिक बड़भाग कौं । 
    मुसकात नैनन बंक भौंहन झलक कछु उर मान की ।
    बलि सहचरी सुख रच्यौ हिंडोरौ पौरि श्रीवृषभान की ॥3॥

    रस छकी रमनी रमकै मदन चंद्रिका-सी चमकैं । 
    हँसत दसन दुति दमकै पाइन नूपुर झमकै ॥ 
    रमकैं कुँवरि दमकै दुतिन झमकैं जु पाइल पाँय की । 
    बिछुआ सुरन सौं मिलि बजैं जेहरैं जटित जराय की ॥ 
    कंचन चुरी कटि किंकिनी रव रीझ कान्ह सुजान की । 
    वलि सहचरी सुख रच्यौ हिंडोरौ पौरि श्रीवृषभान की ॥4॥

    खिसत कुसुम छूटीं अलकै भालन श्रमकन झलकैं । 
    लाल के लोइन ललकैं देखत लगत न पलकें ॥ 
    विथुरी अलक श्रमकन झलक अधरन ललक मधुपान की । 
    दुहुँघाँ मचन में लचत कटि गति-मति हरत प्रमदान की ॥ 
    थहरात पिंडी फहरात पट वरषा दुरे अँग दान की । 
    बलि सहचरी सुख रच्यौ हिंडोरौ पौरि श्रीवृषभान की ॥5॥

    बीन प्रबीन बजावैं मुदित मलारहिं गावैं ।
    स्वर श्रवनन में छावैं हरि जू कौ हियौ चुरावैं ॥ 
    वीना बजावैं मधुर गावैं सरस तीज सुहावनी । 
    लपटावनी कर पाँय पिय अपनपौ दियौ रिझावनी ॥ 
    बस कियौ गोकुल चंद्रमा अब कहा चली है आन की । 
    बलि सहचरी सुख रच्यौ हिंडोरौ पौरि श्रीवृषभान की ॥6॥

- verseNumber: "3"
  verseIntro: "चाचा श्रीवृदावनदासजी कृत (सावन सुदी चौथ कौ) - राग मेवारौ धनाश्री छंद -"
  verseText: |
    सावन सुहावनौ हो राधा जू तुम कियौ । 
    आयौ है कुशल सों हो पटुली पग दियौ ॥ 
    दियौ पटुली पाँउ विहसन कहा बरनों वदन की । 
    बिना उद्यम निरख सैना धुकि परी धरु मदन की । 
    प्रेम की मूरति सखी स्वर ग्राम साधें लेत हैं । 
    भरीं मन उत्साह अति सनमान प्यारी देत हैं । 
    सुनत मधु रव गान हुतौ जु अचेत तद्यपि पुनि जियौ । 
    सावन सुहावनौ हो राधा जू तुम कियौ ॥1॥

    रतन हिंडोरना हो अति सोभा बढ़ी । 
    कर गहि डाँड़ी हो जब नागरि चढ़ी । 
    चढ़ी नागरि गुनन आगरि कहा कहौं फूलन अंग की । 
    मुख किरन भयौ प्रकाश चहुँ दिसि थिरकै चूनरि रंग की । 
    श्रम स्वेद कछुक ललाट पट पै देखि सब उपमा भगैं । 
    मनहुँ राका चंद में सीपज अलौकिक जगमगैं ॥ 
    सीतल करत प्राणेश दृग धनि धन्य विधिना जिन गढ़ी । 
    रतन हिंडोरना हो अति सोभा बढ़ी ॥2॥

    सखी झुलावत हो पूरित नेहरा । 
    मंद-मंद गरजन हो बरसै मेहरा । 
    मंद-मंद जु मेह बरसैं झूल अति लाँबी चली । 
    कोउ बरजत कोउ झुलावत कोउ गावत गति भली । 
    हंस कूजें मोर बोलें कोकिला कूकें महा । 
    सकल कानन प्रेम चहचर कहों सो बानिक कहा । 
    खसि परी मल्ली माल टूट्यौ देख री मोतिनु हरा । 
    सखी झुलावत हो पूरति नेहरा ॥3॥

    मोहन मोहे हो ग्रीवा ढुरन में । 
    फूल झरत हैं हो बैंनी रुरन में ॥ 
    रुरन बैनी ढुरन ग्रीवा रूप अति सींवा भई । 
    पावस जु सुख उपज्यौ अलौकिक आज की रमकन नई ॥ 
    हरित बेली तरु जु अवनी दामिनीं चहुँ दिसि लसैं । 
    मनहुँ जीती वाद भामिनि लोल दृग हर-हर हँसैं ॥
    वृन्दावन हित रूप अलि रहि वदत कृश कटि मुरन में । 
    मोहन मोहे हो ग्रीवा दुरन में ॥4॥

- verseNumber: "4"
  verseIntro: "श्रीरघुनन्दनजी कृत - (सावन सुदी पंचमी कौ) - राग सोरठ -"
  verseText: |
    सुरँग हिंडोरना माई श्री वृषभानुजू के धाम ।  
    ब्रज नारि नैन निहारि सोभा वारत कोटिक काम ॥ 
    द्वै खंभ कंचन कलित नग जगमगत डाँड़ी चारु । 
    पटुली विचित्र सुचित्र रचि मानों कनक कलस मयार ॥ 
    मरुवे मनोहर मोर लटकत जटित सुक पिक सार । 
    झूलैं कुँवरि वृषभान की श्री राधे जू राजकुँवारि ॥1॥

    चहुँ ओर नवल किशोरि सजनी सुघर सब ब्रजवाल । 
    सिंगार षट दस वैस षट दस राग तान रसाल ॥ 
    बीना मृदंग मलार धुनि सुनि नव कुँवर नँदलाल । 
    नव सखी वेष बनाय देखन आये मदन गोपाल ॥2॥ 

    जब नव बधू छवि देखि अद्भुत निकट बोली वाम । 
    किहि गोप की कवनी कुँवरि रमनीय काकी भाम ॥ 
    किहि वास किहि पुर किहि नगर ह्याँ आई है किहि काम । 
    अबलौं न मैं देखी कहूँ सखि कहौ कृपा करि नाम ॥3॥

    मृदु मंद मुसकि मुख चंद शुभ मुख वधू बोली बैन । 
    श्री नंद गाम सुठाम तिहि ठाँ बसत हौं सुख चैन ॥ 
    सुनि भाष जिय अभिलाष उपजी झूलिये तुम ऐन । 
    करि प्रेम प्रीति प्रतीति दोउ मिलि सोईये सुख सैन ॥4॥

    यह सुनत श्रीललिता विशाखा कह्यौ श्रवन समझाय । 
    यह वाम नाहिन श्यामसुंदर हैं कुँवर नँदराय ॥
    तुम दरस परसन काज कामिनि सखी वेष बनाय । 
    सनमान करि दै पान प्यारी पियहि संग झुलाय ॥5॥

    सुनि-सुनि वचन रस रचन सब नवबधू लईं बुलाय । 
    मिलि भेंटि हँसि हिंडोरे झूलें बैन मधुरे गाय ॥
    ब्रजबधू सुर बधू मन-मन रीझि लेत बलाय । 
    सुख देत रघुनन्दन रसिक रस लेत हेत अघाय ॥6॥

- verseNumber: "5"
  verseIntro: "श्रीकृष्णदासजी कृत - (सावन सुदी छठकौ) - राग मलार -"
  verseText: |
    सुरँग हिंडोरना माई झूलत गोकुल चन्द ॥ टेक ॥
    दोऊ खंभ कंचन के मनोहर रतन जटित सुरंग । 
    जाकी चारु डाँड़ी सरल सुन्दर निरखि लजत अनंग ॥ 
    पटुली पिरोजा लाल लटकत झूमका बहु रंग । 
    मरुवे तौ मनि चुन्नी लगीं बिच-बीच हीर तरंग ॥1॥

    कलपद्रुम तरु छाँह सीतल त्रिविध मंद समीर । 
    लता लटकत भार कुसुमित परसि जमुना नीर ॥ 
    हंस मोर चकोर चातक कोकिला अलि कीर । 
    नव नेह नवल किशोर राधे नव रंग गिरधर धीर ॥2॥

    ललिता विसाखा देत झोटा फूली अंग न मात । 
    लाड़िली सुकुमारि डरपत स्याम उर लपटात ॥ 
    गौर स्यामल अंग मिलि दोउ भए एक ही भाय । 
    नील पीत दुकूल राजत दामिनी दुरि जाय ॥3॥

    नव कुंज-कुंज झुलाय झुलवत सहचरी चहुँ ओर । 
    मानौं कमोदिनी कमल फूले निरखि जुगल किशोर ॥ 
    ब्रजबधू तृण तोरि डारत देत प्रान अकोर । 
    कृष्णदास कों ब्रजवास दीजै नागर नंद किशोर ॥4॥

- verseNumber: "6"
  verseIntro: "श्रीनागरीदासजी कृत - राग धनाश्री - (सावन सुदी छठ कौ) -"
  verseText: |
    झूलत फूलत पति हियें, हिंडोरना । बलि दामिनि घन कोटि, हिंडोरना ।
    लाल ललक लालच बढ्यौ, हिंडोरना । विलसत निधि पिय पोट, हिंडोरना ॥
    मुक्त माल बग पंकती, हिंडोरना । धनु घूँघट पच रंग, हिंडोरना ॥ 
    धुरवा अलक आनंद झरें, हिंडोरना । मनु घन हिमकर इक संग, हिंडोरना ॥ 
    कोकिला कूजें चातक रटें, हिंडोरना । मेह नेह छये घूँम, हिंडोरना ॥
    केकी किलकि कौतिक नचैं, हिंडोरना । घटा दिसनदिस झूम, हिंडोरना ॥ 
    गर्व गहल कंकन घुरें, हिंडोरना । नूपुर किंकिनी वलय बाज, हिंडोरना ॥ 
    स्याम दसन चपला दिपै, हिंडोरना । गंभीर मंगली गाज, हिंडोरना ॥ 
    अलक लड़ी लाइन लड़ै, हिंडोरना । दुलरावत कल कंत, हिंडोरना ॥   
    दरस परस परिरंभना, हिंडोरना । चुंबन मद मय मंत, हिंडोरना ॥ 
    प्रमुदित बदन सुधा पियें, हिंडोरना । मदन गुमानी बैन, हिंडोरना ॥ 
    कुंडल झलक कपोलनी, हिंडोरना । चपल चारु चारौ नैन, हिंडोरना ॥ 
    लटक मटक कृश कटि डुलै, हिंडोरना । ललित लुलित अब चाइ, हिंडोरना ॥ 
    मद मंथर गति गुनवती, हिंडोरना । देखत नैन लुभाइ, हिंडोरना ॥ 
    विलसत हिये विनोदिनी, हिंडोरना । हुलसि सुखन सुकुमार, हिंडोरना ॥ 
    नागरी दासी वारने, हिंडोरना । आनंद उदित उदार, हिंडोरना ॥

- verseNumber: "7"
  verseIntro: "चाचा श्रीवृन्दावनदासजी कृत (सावन सुदी सप्तमी कौ) म० सो० मिली छंद -"
  verseText: |
    कमनी वंशीवट में बरषत रंग है । 
    झूलत रविजा तट में भरी उमंग है ॥
    भरी परम उमंग झूलत रूप सीवाँ राधिका । 
    वनीं वेष विचित्र सखी स्वर तान ताल जु साधिका ॥ 
    झूलें झुलावें मधुर गावें फबी नव रंग चूनरी । 
    आभास धुनि सुर बधू मोहीं करत हाँ पुनि हूँ न री ॥ 
    वैसंधि बाला छबि विशाला वृन्द सहचरि संग है । 
    कहा कहौं बानिक आज की वरषै महा रस रंग है ॥1॥

    अतरौटा रंग गहरें कनक तनी बनी । 
    पीत कंचुकी पहिरें सोंधे सों सनी ॥ 
    सनी सोंधे कंचुकी विविध भूषन नग खचे । 
    मँहदी रचे कर कमल जावक चित्र चरनन में रचे ॥
    तन तें छुटें जु सुगंध रेलें बदन ससि जीती कला । 
    दमकै जु बेंदी भाल रमकें हलें चंचल अंचला ॥ 
    ऊँचे गहैं फल फूल बढ़ि-बढ़ि फैलि रही सोभा घनी । 
    जोवन जु जोर मरोर झूलें भामिनी कनक तनी बनी ॥2॥

    रसिक कुँवर सँग बाला दिपत सुहाग मनि । 
    झोटा दें तिहि काला बदैं सखि भाग धनि ॥ 
    धनि धन्य भाग बदैं सहेली सावन सब सुख पाईयौ । 
    गौर स्यामल सुभग जोरी हरषि-हरषि झुलाईयो ॥
    उत सजल घन गंभीर गरजन दामिनी अतिसै लसै । 
    इत निरखि उपमा सबहिं वारों प्रिया पिय अंकनि बसैं ॥
    कोकिला कूकें मोर बोलें चात्रक जहाँ पिय-पिया भनि । 
    हरी हरी भूमि विलोकि रमकैं श्री राधा जू परम सुहाग मनि ॥3॥

    झुकि रहीं यमुना जल में द्रुम साखा हरी । 
    पाँति कलप तरु थल में अवनी छबि भरी ॥  
    भरी छबि अवनी अलौकिक तहाँ चहचर प्रेम कौ । 
    नग कांति भाँति अनेक जगमग रच्यौ हिंडोरा हेम कौ ॥ 
    किलकैं कुलाहल करें अबला सबल रितु पावस महा । 
    वृन्दावन हित रूप बलि-बलि अतुल सुख बरनों कहा ॥
    नहिं लोक ओकन लेश संपति जो विपिन बीथिन धरी । 
    हिंडोर झूलें कुँवरि फूलें साखा निरखि हरी-हरी ॥4॥

- verseNumber: "8"
  verseIntro: "श्रीनंददासजी कृत - (सावन सुदी अष्टमी कौ) - राग सोरठ -"
  verseText: |
    गोकुल राइ की पौरी रच्यौ है हिंडोरना । 
    कंचन खंभ बनाये चित के चोरना ॥ 
    चित चोरना विवि खंभ बानक रतन डाँड़ी सोहिनी । 
    चौकी कनक की तिहि बनक की बनी मन की मोहिनी ॥ 
    आईं नवल ब्रजवधू झूलन सबै एक बनाय की । 
    बलि नंद बन्यौ सुन्यौं हिंडोरौ पौरि गोकुल राय की ॥1॥

    गावत चढ़ी हैं हिंडोरें सारी सूही सोहैं । 
    डहडहे मुख रँग भीने सरद ससि को हैं ॥
    को हैं सरद ससि मुख रहे लसि चपल नैना सोहने । 
    चलैं कौने कछु लजौने मैंन मन के मोहने ॥ 
    सीतल मधुर धुनि गान सुनि उघरे सुघन घुरि आवहीं । 
    बलि नंद अति आनन्द बाढ्यौ चढ़ि हिंडोरें गावही ॥2॥

    आये तहाँ नंदलाला पहिरें फूलन माला । 
    चढ़ि गए रँगीले हिंडोरें कहा री कहौं तिहि काला ॥ 
    तिहिं काल ब्रज वर बाल मदन गोपाल दुति परत न गनी । 
    सिंगार सुंदर तरु के ढिंग-ढिंग मनौं छबि बेली बनी ॥
    कहत न बनै देखत बनै भए दृगन मनके भाए । 
    बलि नंददास विलास निधि नंदलाल जब तहाँ आए ॥3॥

    चली हैं बड़ेड़ी झूलें झलकैं चंदा मोर के । 
    खिसत सिरन तें फूलें दियें झकझोर के ॥
    झकझोर झपट सुगंध लपटें उठत कछु घन घोर से । 
    फरकैं तौ अंचल ओर चंचल दामिनी के छोर से ॥
    वारत जसोमति भूषनन अवलोकि सुत सोभा भली । 
    बलि नंद श्री गोविंद चंद की झूल जब बड़ड़ी चली ॥4॥

- verseNumber: "9"
  verseIntro: "गो० श्रीरूपलालजी कृत - (सावन सुदी नौमी कौ) - राग मलार छंद -"
  verseText: |
    झूलत रंग हिंडोरें श्रीराधा मोहन । 
    भँवर भ्रमत चहुँ औरें श्री राधा मोहन ॥
    गावत अलि सुर जोरें श्री राधा मोहन । 
    रीझि-रीझि तृन तोरें श्री राधा मोहन ॥ टेक ॥
    मन भावन हरषावन आवन सावन तीज सुहाई । 
    चावन गावन रीझि रिझावन दंपति रति दरसाई ॥ 
    चढ़े हिंडोरें नैनन जोरें चित चोरें सुखदाई ।
    जुगल चंद रस कंद किरन लखि जै श्री रूपलाल बलि जाई ॥1॥

    रमकि झमकि झुकि चमकि दमकि झूलत फूलत अभिरामा । 
    नागर रूप उजागर आगर छबि सागर सुख धामा ॥ 
    अली भली रस रली झुलावैं गावैं गुन गन ग्रामा । 
    जै श्री रूपलाल हित ललिता रस सलिता सँग पुजये सब कामा ॥2॥

    सूहे बागे रति रस पागे अनुरागे दोऊ झूलैं । 
    मृदु बोलैं चित ग्रंथिन खोलें करत कलोलें अँग-अँग फूलें ॥ 
    बनक बनावें सुरन मिलावैं गावैं रस अनुकूलें । 
    जै श्री रूपलाल हित दंपति संपति लखि सखि गति-मति भूलें ॥3॥

    कबहुँक झुकि झुकि झमकि झुलावें गावें रीझि रिझावैं । 
    मन भावैं नैनन दरसावें प्रेम सिंधु सरसावें ॥ 
    नेह बढ़ावें विवि सचु पावें रस निधि रस वरसावें । 
    जै श्री रूपलाल हित निकट बुलावें अलि बलि नैन सिरावें ॥4॥

- verseNumber: "10"
  verseIntro: "श्रीदामोदर स्वामीजी कृत - (सावन सुदी दसमी कौ) राग मलार, ताल आड़-चौतालौ"
  verseText: |
    सुहाबनौ साँवन भावन आज । 
    झूलें सु दंपति रसिक संपति बन्यौ सरस समाज ॥ टेक ॥ 
    चारु सजल नवीन नीरद गगन उनये बने । 
    मनों मदन वितान छबि सों युगल ऊपर तने ॥ 
    बग पाँति मुक्ता माल झालर झलमल्यौ आकास । 
    लहलहत है दामिनी दृग देखि परम हुलास ॥1॥

    ललित कूल कलिंदजा कुल कीर कोकिल नाद । 
    कुहुक केकी गुंज मधुकर करत हिय अहिलाद ॥ 
    हरषि अवनी पुलक तन हित परसि पद जलजात । 
    मुदित प्रीतम संग झूलें नवल तन नव सात ॥2॥

    लहलही नव लता नव द्रुम फूल सोभा देत । 
    रहे सीस नवाइ छबि सों नवल प्रेम सहेत ॥ 
    सीत मंद समेत सौरभ बहत विशद समीर । 
    बरन बरन सुरंग सारी संग युवती भीर ॥3॥

    गावें झुलावें प्रीति भरि हिय खरीं चहुँ दिसि वृन्द । 
    गौर स्यामल अंग झलकन रमकनी आनंद ॥ 
    विमल अंबर अमल भूषन जलज कमल सुनैन । 
    हित दामोदर बसौ मम हिय रसिक जन सुख दैन ॥4॥

- verseNumber: "11"
  verseIntro: "चाचा श्रीवृन्दावनदासजी कृत (सावन सुदी एकादसी कौ) राग धनाश्री"
  verseText: |
    झूलत प्रिया सभागी मुरलीधरन की ।
    बल्लव' राजदुलारी गोरे बरन की ॥
    गौर बरन विशाल नैनी नवल जोवन उलहनी ।
    जसोमति जो लाड़ भाजन तासु प्यारी दुलहनी ॥ 
    प्रेम सरवर झुके तरुवर महा कमनी तीर में । 
    सुथरता किहि विधि रची तन लसै कसूँभी चीर में ॥ 
    सोभा न बरनी जात मोपै अंचला फरहरन की ।
    वृन्दावन हित रूप झूलत प्रिया मुरलीधरन की ॥1॥ 

    रमकन बरनी न जाई डोरी करन है । 
    फटिक मणिनु की पटुली चाँपैं चरन हैं ॥ 
    चरन चाँपैं मुख अलापैं सुर सुधा वरर्षे अहा ।
    सावन जु सुख विस्तरन राधा कहौं इक रसना कहा ॥  
    तरुवन ललाई बढ़ि चली ज्यों सबल झोटा लेत है । 
    जगि-जगि उठत मुख ज्योति घूँघट खुलन अति छबि देत है ॥  
    त्रैलोक्य सुन्दर मदन मोहन तासु चित वित हरन हैं । 
    वृन्दावन हित रूप झूलत मृदुल डोरी करन हैं ॥2॥

    पावस मान बढ़ावन तो सम को सखी । 
    भानुवंश यश वर्द्धन में नीकें लखी ॥ 
    लखी मैं नीकें हिंडोरो विलस सुख तू जानहीं । 
    श्रीदाम अनुजा चिरजियौ कहा और अधिक बखानहीं ॥  
    गृह गोप अरु कानन रवानौ होत है तेरौ कियौ । 
    आई सहेली साँवरी तो यस सुनत हुलस्यौ हियौ ॥  
    कुल बड़े की दरसत मिलन तोहि लाज जिन पाछे नखी । 
    वृन्दावन हित मान सब कौं दैन को तो सम सखी ॥3॥

    मो हित इकली आई मूरति नेह की । 
    मरकत मणि दुति जीतत आभा देह की ॥ 
    देह की दुति निकर सोभा स्यामा जू संग झुलाईयो । 
    पाहुनी गोप कुमारि ताके मन सौं मन जु मिलाईयो ॥  
    झूलें करें पुनि बात रुख लै कुशल अपनी गौं ढ़हैं । 
    लपटात झोटा बढ़न में कछु नये से कौतिक करें ॥  
    मुरि देखिये बलि जाऊँ गिरि दिसि झमकि आवन मेह की । 
    वृन्दावन हित रूप बोली साँवल सींव सनेह की ॥4॥ 

    चलि बलि सघन कुंज में जहाँ बूँद न परें । 
    दुरि बैठें सबहिनु तें रस बतियाँ करें ॥ 
    करें रस बतियाँ सँदेसौ तो प्रीतम तोसों कह्यौ । 
    अधिक जिय में चटपटी बिनु कहे अब जात न रह्यौ ॥   
    तुम हौ कुशल मति अहो नागरि कह्यौ मेरौ कीजिये । 
    नियरे जु आयौ मेह अब क्यों चढ़ि हिंडोरे भीजिये ॥ 
    भोरी प्रिया अति चतुर पिय एकान्त मिलि सुख विस्तरें । 
    वृन्दावन हित रूप कमनी कुंज जहाँ बूँद न परें ॥5॥

- verseNumber: "12"
  verseIntro: "गो० श्रीगोवर्धनलालजी कृत - राग मलार (सावन सुदी एकादसी दिवस कौ)"
  verseText: |
    श्रीहित कुंज भवन में झूलत राधा लाड़ी, एरी हाँ संग सखी री ॥
    झुलवै पिय प्यारौ गहें जो मनोहर डाँड़ी, एरी हाँ संग सखी री ॥1॥ 
    झोटा तरल सुहावने झिझकें अति सुकुमारि । 
    हंस सुता तट नीर लों रमकें बढ़त अपार ॥ एरी हाँ० ॥2॥ 
    चहूँ ओर सखियाँ खड़ी हित की चितवन हार ।
    नैन फिरैं चकडोर ज्यों मन में करत बिचार ॥ एरी हाँ० ॥3॥ 
    हित आली प्रीतम गहे विवि मिलि झूलहु आप । 
    चढ़ि झूलन लागे दोऊ युग ससि संग मिलाप ॥ एरी हाँ० ॥4॥ 
    घनस्याम घन सोहईं चपला अतिलड़ राज । 
    मुरलिका गरजै मनौं बजत पखावज साज ॥ एरी हाँ० ॥5॥ 
    स्याम बरन सारी लसै कंचुकि कसूँभी सुरंग । 
    दामिनि पचरंगी मनौं इन्द्रधनुष छबि संग ॥ एरी हाँ० ॥6॥ 
    रक्त पाग पटुका हरौ तड़ित पीतांबर जोत । 
    आभूषण मिलि राजहीं जगमग अति ही होत ॥ एरी हाँ० ॥7॥ 
    बर्हापीड़ सु झुकि रह्यौ नटवर नंद कुमार । 
    चंद्रकांत मणि चंद्रिका अलकलड़ी सिर धार ॥ एरी हाँ० ॥8॥ 
    कहि न सकौं सोभा घनी उभै रूप रस जाल । 
    लोचन कैं रसना नहीं लखि छबि होत निहाल ॥ एरी हाँ० ॥9॥ 
    हित सजनी चौंरी लियें सींचत दृग हिय खेत । 
    व्यजना श्रीवनचंदजू कर फेरत सुख लेत ॥ एरी हाँ० ॥10॥ 
    कृष्णचंद्र पानन डबा अतरदान गोपीनाथ । 
    मोहन जल झारी लियें जल अचवावत हाथ ॥ एरी हाँ० ॥11॥ 
    इक डाँड़ी सुंदर गहें इक राधावल्लभ दास । 
    ब्रजभूषण जू तीसरी तुर्य नागरवर पास ॥ एरी हाँ० ॥12॥ 
    लियें सुगंध रूमाल कौं सेवक हित रस लीन । 
    पिक दानी कर व्यास कें प्रवोधानंद स्वर बीन ॥ एरी हाँ० ॥13॥ 
    गावत श्रीहरिदास जू सावन सुघर अलाप । 
    नरवाहन जु मृदंग लै परन बजावत थाप ॥ एरी हाँ० ॥14॥ 
    निर्त्तत नागरीदास जू हितध्रुव छबि में छाक । 
    बहु बाजंत्र बजावहीं सबै रसिक चित चाक ॥ एरी हाँ० ॥15॥ 
    संध्या समय सु जानि के विविध भाँति पकवान । 
    कंचन थार भराइ कें बहु मेवन युत आन ॥ एरी हाँ० ॥16॥ 
    भोग लगायौ हित सखी जल अचवन दै पान । 
    फेरत हित सों आरती मणिन जटी सुख दान ॥ एरी हाँ० ॥17॥ 
    लखि शोभा छबि में छके प्रान करत बलिहार । 
    झुकि झूमें आलस भरे भूषन वसन उतार ॥ एरी हाँ० ॥18॥ 
    केलि खेल रस झेलहीं विवि मुख रहे मिलाय । 
    विविध भाँति क्रीड़ा करें निरखि सखी बलि जाँय ॥ एरी हाँ० ॥19॥ 
    लै प्रसाद दीयौ जु हित टेर सकल परिवार । 
    जै श्री हित गोवर्धन लाल कौं देत हैं विविध प्रकार ॥ एरी हाँ सखीरी० ॥20॥

- verseNumber: "13"
  verseIntro: "श्रीसहचरिसुखजी कृत - राग मलार (सावन सुदी पूर्णमासी कौ)"
  verseText: |
    रच्यौ है हिंडोरना हो वंशीवट की छाँह । रंग दैन चैन सुनैन मैन झकोर कुंजन माँह ॥ टेक ॥ 
    द्वै खंभ हेम भराय जरे हैं जराय जमुना तीर । 
    मरुवे मयारन मनि लगीं पन्नान पंकति कीर ॥ 
    मुकतान डाँड़ी चारु माड़ी श्रवत अमृत सीर । 
    पटुली पिरोजा झूमकन झलमलत लालऽरु हीर ॥1॥

    दोऊ बसन पहिरें तीज के राधा रसिक बलबीर । 
    रमकत तहाँ दमकत दुतिन मिलि गौर स्याम शरीर ॥ 
    ललित झोटा देत अलि ललितादिकन की भीर । 
    रस झर दुहूँ दिसि हियन घुमड़ी रूप घटा गंभीर ॥2॥

    इकटक निहारत वदन पल सहि सकत पलक न पीर । 
    तिय परसि पुलकत पीत पट पिय परसि सुन्दर चीर ॥ 
    हँसत लपटत खिलत सकुचत धरकि होत अधीर । 
    लड़कान ललना की सँभारत लाल गहि-गहि धीर ॥3॥

    सावन अवनि हरियावनौ घन सघन बरसत नीर । 
    नव फूल फूलत द्रुमन बेली त्रिविध बहत समीर ॥ 
    संगीत उघटत किंकिनी मुख गहें मौन मंजीर । 
    सुखसखी देत असीस अचल बिहार कुंज कुटीर ॥4॥

- verseNumber: "14"
  verseIntro: "श्रीसहचरिसुखजी कृत-राग मलार"
  verseText: |
    झूलत रसिक दोऊ कुंजन माँहि । जमुना तट वंशी वट छाँह ॥ 
    दुहुँन के रूप दुहुँन के फंद । दोऊ ही रसिक दोऊ रस के कंद ॥ टेक ॥ 
    राधा कुँवरि कुँवर नंदनंद । दोऊ ससि मुख दोऊ जीतत चंद ॥1॥ 

    दोऊ चातक दोऊ अमृत मेह । हरित होत दोऊ वरषत नेह ॥ 
    दोऊ भिजवत दोऊ भीजत देह । दोऊ लहत मन मोद अछेह ॥2॥ 

    झलकत स्याम गौर दोऊ अंग । रंगे हैं दोऊ हिय तन के रंग ॥ 
    रमकत दोऊ दमकत दृग संग । दुहुँ मुख फूली है तीज उमंग ॥3॥
    
    दोऊ ही तकत दोऊ जिय में लजात । दोऊ सकत दोऊ मुसिकत जात ॥ 
    दोऊ धन पाइ जियहिं इतरात । दोऊ सैंनन करें रति की बात ॥4॥ 

    दोऊ भुज-भुज गहें पलकन भूल । दोऊ छके छबि में सनमुख फूल ॥ 
    दोऊ झुकें अंकन गज लौं झूल । दोऊ तिय पिय है रहैं अनुकूल ॥5॥ 

    दोऊ ही दोउन के करत सिंगार । दोऊ ही रिझावत विविध बिहार ॥ 
    दोऊ वन दरसत रीझ अपार । दोऊ दोऊन पर होत बलिहार ॥6॥ 

    दोऊ ही राग में सरस प्रवीन । दोऊ ही बजावत वंशी बीन ॥
    दोऊ मृग लों सुर श्रवनन लीन । दोऊ ही दुहुँन के अति आधीन ॥7॥ 

    दोऊ ही मिले अति आनंद दैन । दोऊ हरिवंश हिये के चैन ॥ 
    जो देखे सहचरि सुख नैन । ज्यौं के त्यौं कहि परत बनैंन ॥8॥



- verseNumber: "15"
  verseIntro: "गो० श्रीहितहरिवंशचन्द्र महाप्रभुजी कौ (यह पद भेट कौ है) राग मलार -"
  verseText: |
    प्रीतम दोऊ झूलत हैं संकेत । 
    उतहिं कुँवर इत कुँवरि राधिका ललिता झोटा देत ॥ 
    दोऊ मिलि मुदित परस्पर गावत अलापत राग मलार । 
    खिसि खिसि परत नील पीतांबर नाहिन अंग सम्हार ॥ 
    बरषत मेह सकल वन रंजित अवलोकत छबि देत । 
    जै श्रीहित हरिवंश परस्पर झूलत सखी बलैयाँ लेत ॥

- verseNumber: "16"
  verseIntro: "गो० श्रीकृष्णचन्द्रजी कृत - राग मलार"
  verseText: |
    झूलत उभय नवल किशोर । 
    विविध हास विलास अद्भुत प्रेम सिंधु झकोर ॥ 
    कपिस नील वसन विराजत पवन विचलित छोर । 
    किमपि खसत मुकुट सुसोभित शिथिल केशन डोर ॥ 
    उरज कनक कलश विलोकत स्वास मानस चोर । 
    प्रिया मुख विधु मृदु कला युत पीय नैंन चकोर ॥ 
    सरस गति मति देखि मनमथ बँध्यौ भृकुटी कोर । 
    जै श्रीकृष्णदास हितालि निरखत दुरहिं दोऊ हिंडोर ॥

- verseNumber: "17"
  verseIntro: "गो० श्रीहितगोपीनाथजी कृत - राग विहागरौ"
  verseText: |
    रँगीले हिंडोर रँगीले बिहारी रँगीली प्रिया कौं झुलावत माई ।
    रँगीले आभूषण अँग अँग साजैं रँगीली मँहदी प्यारी हाथ रचाई ॥
    रँगीली चहुँ ओर सहचरि गावैं रँगीली सावन तीज सुहाई ।
    जै श्रीहित गोपीनाथ रँगीली छबि बाढ़ी कहा री कहूँ कछू कही न जाई ॥

- verseNumber: "18"
  verseIntro: "गो० श्री दामोदरवरजी कृत - राग मलार"
  verseText: |
    नवल हिंडोरना हो झूलत जुगल किशोर । 
    वर भामिनि रस भरे मन मोहन हँसत लसत चित चोर ॥ 
    स्याम तमाल लाल रस लंपट गान करत कल घोर । 
    पुलकि-पुलकि तन अंस बाहु कसि निरखत सुख नहि थोर ॥ 
    नीलांबर पीतांबर अंचल चंचल चलत झकोर ।
    जै श्रीदामोदर हित प्रीतम की छवि सदा बसौ मन मोर ॥ 

- verseNumber: "19"
  verseIntro: "राग कान्हरौ -"
  verseText: |
    आज झूली री रंग हिंडोरे प्यारी पिय के संग । 
    गोरे तन फबि सुरँग चूनरी पीत वसन सोहै सुभग साँवरे अंग ॥ 
    तैसेई बदरा घुमड़ि रहे तैसी बरन-बरन सारी पहिरें गावै ललितादिक भीनी रंग । 
    जै श्रीदामोदर हित रसिक विहारी-विहारिनि की छबि पर वारी रति अनंग ॥

- verseNumber: "20"
  verseIntro: "गो० श्रीकमलनैनजी कृत - राग मलार"
  verseText: |
    झूलत नवल प्रिया संग प्रीतम झोटा झकोरत हा-हा खाई । 
    हरषत हँसत उर लावत मोहन चौंप बढ़ावत वदन की माई ॥ 
    तैसीये तरुणाई तैसी अंग अरुनाई तैसीये सुरंग सूही सारी सुहाई । 
    जै श्रीकमलनैंन हित सखी सचु पावत गावत झुलवत लेत बलाई ॥

- verseNumber: "21"
  verseIntro: "गो० श्रीहित हरिलालजी कृत - राग मलार"
  verseText: |
    झूलत रंग भरे पिय प्यारी । 
    झूमत घन घूमत सहचरि गण मन हरषन मनुहारी ॥ 
    गावत रस सरसावत गोरी पहिर केशरी सारी । 
    लाल पाग नीमा छबि सीमा राजत लाल विहारी ॥ 
    भुज जोरैं चित चोरें दोऊ वन छबि छाई भारी । 
    जै श्रीहित हरिलाल बाल अद्भुत सुख निरखि रूप बलिहारी ॥ 

- verseNumber: "22"
  verseIntro: "गो० श्रीनवनीतलालजी कृत - राग देव गंधार"
  verseText: |
    अद्भुत वरषा आई देखौ माई । 
    स्याम सरूप घटा घहराई प्रिय चपला चमकाई ॥ 
    हित की सखी उज्ज्वल रस भीनी बग पंकति छबि छाई । 
    नूपुर शब्द पपीहा दादुर कोकिल मोर कुहुकाई ॥ 
    हरिवंशी धुनि मनौं गरजत घन लरजत धन अकुलाई । 
    डरपी जानि प्रिया प्रीतम नैं पुनि-पुनि लै उर लाई ॥ 
    हलत हिंडोर झकोर पवन की करत कलोल मन भाई । 
    जै श्रीहित नवनीत परम रस वरषत निरखत नैन सिराई ॥

- verseNumber: "23"
  verseIntro: " गो० श्रीरूपलाल कृत - राग अड़ानों - (सन्ध्या आरती पश्चात यह पद नित्य होता है)
"
  verseText: |
    हिंडोरे दोऊ झूलत री सुरंग चूनरी पहिरैं । 
    झुलवत ललन बिहारी प्यारी, उठत छबिनु की लहरें । 
    घन गरजन झुकि अलि गन गावत तान तरंगन गहरैं । 
    जै श्रीरूपलाल हित रस बस दंपति लखि उपमा नहिं ठहरें ॥

- verseNumber: "24"
  verseIntro: "राग मलार -"
  verseText: |
    सुभग हिंडोरना माई रहसि रच्यौ सुख रासि ॥ टेक ॥
    सघन घन वन झूमि आये रहे जित-तित छाइ । 
    बनी सरस कदंब खंडी प्रेम सर झलराइ ॥ 
    जुही जाती मालती प्रफुलित चहूँदिसि आइ ॥ 
    पचरंग डोरी हेम सूतन निरखि हियौ सिराइ । 
    तापर विराजत लाड़िली पिय मुरि-मुरि देत झुलाइ ॥ 
    पिक मोर कोकिल मधुर बोलैं करें दादुर सोर । 
    घटन में बग पाँति झलकै दामिनी चहुँ ओर ॥ 
    हरषि झुकि-झुकि गीत गावैं सखी तान मरोर । 
    ताल बीन मृदंग उपजें मिलि चलें चित चोर ॥ 
    जुगल चंद विलोकि फूले कुमुद नैन चकोर ॥ 
    छबि रासि रसिक विचित्र विवि पहिरें कसुंभी दुकूल । 
    अँग अंग भूषन विविध साजें हिये आनंद फूल । 
    रमकि झमकि झुलाइ झूलें प्रेम बल्ली मूल ॥ 
    चितै मृदु मुसिकान सों बतरान दंपति भूल । 
    जै श्रीरूपलाल निहारि हित चित भयौ है अनुकूल ॥

- verseNumber: "25"
  verseIntro: "राग मलार छंद -"
  verseText: |
    आली री झूलत लाड़िली लाल । श्याम सुंदर सुंदरी बने रूप रंग रसाल ॥ टेक ॥ 
    रतन खंभ मयार मरुवे चारु डाँडी हीर । 
    पाटुली मणि लाल पन्नन दिपत दुति गंभीर ॥
    चहुँ ओर साज समाज सहचरि अरुन सोभित चीर । 
    गाबत लड़ावत स्वरन सुनि चुप रहे कोकिल कीर ॥1॥

    प्रफुलित झुकीं द्रुम लता दिसि दिसि निकट जमुना हेरि । 
    हरित भूमि सुहावनी जित तित मयूरन टेर ॥ 
    घुरि घुमड़ि घन बरषत फुहारन चमकि चपला बेरि । 
    झिझकि झुकि लपटात ललना लाल सुखहिं सकेरि ॥2॥ 
    दोऊ लेत रमकन अंग झमकन स्वरन राग मलार । 
    मुख भरे पानन झलक आनन दृगन मदन विहार ॥ 
    बतरान प्रेम बिकान दंपति रसन के उदगार । 
    जै श्रीलाल रूप विलोकि हित तन प्रान करि बलिहार ॥3॥

- verseNumber: "26"
  verseIntro: " राग मलार छन्द -"
  verseText: |
    रंग हिंडोरना माई झूलत जुगल किशोर । 
    विवि चंद आनंद कंद रसिक सुछंद प्रेम हिलोर ॥ टेक ॥ 
    तरु लता चहुँ दिसि लहलहें प्रफुलित सुमन वन राज । 
    पिक मोर कोकिल कीर दादुर धुनि मदन मन लाज ॥ 
    घन घोर चपला चमक वरषि फुहार पावस साज । 
    हरित भूमि पर वीरबहूटी निरखि सुख दृग आज ॥1॥

    कूल कालिंदी रच्यौ बहु रतन जटित सुरंग । 
    कल चित्र खंभ मयार मरुवें चार डाँड़ी संग ॥ 
    पटुली नगन मन मगन लखि उपज्यौ जु प्रेम अभंग । 
    चढ़ि हरखि झमकि झुलाइ झूलें दुहुँन बढ़ी उमंग ॥2॥ 
    पीत अरुन दुकूल राजैं फरहरान अनूप । 
    भूषनन भूषित करत अंग रस सिंधु रोमन कूप ॥ 
    ललितादि सजि-सजि साज सहित समाज राग सरूप । 
    गान तान तरंग रंगंन नेह नव रस भूप ॥3॥

    छबि रासि रसिक विचित्र विवि छाके छबिनु के धाम । 
    झलक पानन भरे आनन लसत स्यामा स्याम ॥ 
    मुसिकान मृदु बतरान कुटिल कटाक्ष वेधन काम । 
    (जै श्री) हित रूप दंपति भूप लखि सखि सुमिर आठौ जाम ॥4॥

- verseNumber: "27"
  verseIntro: "राग मलार -"
  verseText: |
    सखी मिलि पिय सँग झूल झुलावैं । 
    गरजि-गरजि घन चपला चमकै नेह नीर झर लावैं ॥ 
    बढ़ि-बढ़ि लेत लड़ैती झोटा डारन छ्वै-छ्वै आवै । 
    जै श्री हित चित रूपलाल ललना दोऊ राग मलारहि गावैं ॥

- verseNumber: "28"
  verseIntro: "राग मलार -"
  verseText: |
    उमगि रस रंग हिंडोरे झूलैं । 
    घन दामिनि घनश्याम भामिनी हरखि वरषि अनुकूलैं ॥ 
    अरस परस विवि सरस परस ह्वै उर-उर भुज-भुजमूलें । 
    जै श्री हित अलि रूप अनूप प्रेम छकि छाके दृग-दृग फूलें ॥

- verseNumber: "29"
  verseIntro: "राग मलार -"
  verseText: |
    री झूलत श्यामा-श्याम हिंडोरें । 
    गरजत घन बरसत रस बूँदन गावत अलि चहुँओरैं ॥ 
    अंग-अंग तन दीपति झलकत चितवनि मदन मरोरैं । 
    बिच-बिच अधर खंड मिल पावत पानन आनन जोरैं ॥ 
    रमकन लेत परस्पर प्रीतम उठत सुगंध झकोरैं । 
    'जै श्री रूपलाल हित छकन छके विवि रूप सिंधु मन बोरैं ॥

- verseNumber: "30"
  verseIntro: "राग मलार -"
  verseText: |
    लड़ैती जू गहवर शिखर हिंडोरैं । 
    सहचरि भेष लाल ललितादिक झुलवत प्रेम हिलोरैं ॥ 
    गरज-गरज घन बरस फुहारन दामिनि दुति चहुँ ओरैं । 
    साज समाजन राग रंग लहि गहि नव नेह निहोरैं ॥ 
    हाव भाव लावण्य प्रभा सुख निरख अली तृन तोरैं । 
    जै श्री हित चित रूप छकन छकि दंपति चपल नैंन की कोरैं ॥

- verseNumber: "31"
  verseIntro: "श्रीहरिराम व्यासजी कृत - राग मलार -"
  verseText: |
    झूलत कुंज निकुंज किशोर । 
    सुरत रंग सुख सैंनन सूचत नैन रंगीले भोर ॥1॥ 
    सिथिल पलक में बंक विलोकन विहँसन चितवन चोर । 
    फिरि-फिरि उर लपटात समात न फूले तन कुच कोर ॥2॥ 
    अधर मधुर मधु प्याय जिवाये विवि वर वदन चकोर । 
    मादिक रस रसना न अघावत लहत मंडल चल छोर ॥3॥ 
    बीच बीच नाचत मिलि गावत सुर मंदर कल घोर । 
    रीझि पुलकि चुंबन करि पुलकित झुलवत जोवन जोर ॥4॥ 
    हरिवंशी फूलत हरिदासी निरखत सुरत हिंडोर । 
    व्यासदास चंचल अंचल करि मोद विनोद न थोर ॥5॥

- verseNumber: "32"
  verseIntro: "श्रीहरिराम व्यासजी कृत - राग मलार -"
  verseText: |
    हिंडोरना झूलत जुगल किशोर । 
    बरषत मेघ हरियालौ सावन जहाँ तहाँ नाचत मोर ॥1॥ 
    दामिनि दुरत भामिनि छवि निरखत चंचल अंचल छोर । 
    डोलत बग बोलत पिक चातक सुनत मंद घन घोर ॥2॥ 
    हिय सों पियहि लगाय मचायौ अवला जोवन जोर । 
    सीखत श्याम गिरत तें उबरे कर गहि उरज कठोर ॥3॥ 
    पट भूषन लट उरझि न छूटत बाढ़ी प्रीति न थोर । 
    कच गहि चुंबन कर मुख देखत सुख सागर झकझोर ॥4॥ 
    नाचत गावत सखी झुलावत गति उपजत चित चोर । 
    राच्यौ रंग व्यास की स्वामिनि रति रस सिंधु हिलोर ॥5॥

- verseNumber: "33"
  verseIntro: "श्रीध्रुवदासजी कृत - राग मलार -"
  verseText: |
    रस भरे सुरँग हिंडोरे झूलत । 
    अति सुकुमार रूप निधि दोऊ सो छबि देख परस्पर फूलत ॥1॥ 
    नवल तरुनता अँग-अँग भूषण लसत सुभग उरजन मणिमाल । 
    उभय सिंधु मनौं बढ़े रूप के बिच-बिच झलकत रंग रसाल ॥2॥ 
    रुचिर नील पट पीत पवन बस उड़त उठत मनौं लहर तरंग । 
    हित ध्रुव दिनहिं मीन सखियन दृग तृषित फिरत रस में तिन संग ॥3॥ 

- verseNumber: "34"
  verseIntro: "राग मलार -"
  verseText: |
    गरजन घन अरु दमकन दामिनि चातक पिक शुक बोलत मोरन । 
    स्याम घटा काजर हूँ ते कारी उमड़ि-उमड़ि आई चहुँ ओरन ॥ 
    नान्हीं-नान्हीं बूँदन बरषन लाग्यौ तैसिये रोचक पवन झकोरन । 
    हित ध्रुव प्यारी प्यार सौं झूलत पियहि झुलावत नैनन कोरन ॥

- verseNumber: "35"
  verseIntro: "कवित्त -"
  verseText: |
    अति अलबेली भाँति झूलैं अलबेली प्रिये, सहज छबीली छबि नवल निहारहीं ।
    सा री सुही सुरंग परत खसि-खसि सखी, बार-बार प्यारौ पिय फूल से सँवारहीं । 
    जेही ओर अंग पट भूषन खिसत पिय, तेही ओर मुरि-मुरि प्रान ज्यौं सँभारहीं । 
    हित ध्रुव प्रीतम के नाहिं और दूजी गति, छिन-छिन तिनही के सुखहि विचारहीं ॥ 

- verseNumber: "36"
  verseIntro: "श्रीकल्याण पुजारीजी कृत -राग जैतश्री-"
  verseText: |
    घुरि आये री बादर काजरे, वन बोलत चात्रक मोर री, घन गरजन आज सुहावनी ॥ टेक ॥ 
    वर भूमि हरी वृन्दाटबी छबि देखत लाजै काम री । 
    रंग भाँतिनु-भाँतिनु को गने कल कोमलता कौ धाम री ॥ 
    श्रीराधा कौं आराधि कें पिय बोलत मीठे बोल री । 
    नंदलाल लाड़िलौ लालची तुम लेहु प्रिया मोहि मोल री ॥ 
    दोऊ कुंज हिंडोरे झूलहीं नव फूल न अंग समाइ री । 
    रमकावत गावत गोपिका उर आनँद सिंधु बढ़ाइ री । 
    पट नील पीत फहरात हैं कहि को बरनैं इहि भाँति री । 
    घन दामिनि की उपमा कहा यह अधिक अनूपम काँति री ॥ 
    दोऊ मिले अँग-अँग सों गसे बसौ मेरे उर यह रूप री । 
    पिउ पीवत अधर सुधा बदै प्रिये कियौ हौं रंक तें भूप री ॥ 
    श्रीस्याम रूप रस रासि हैं नित राधा के आधीन री । 
    रितु पावस प्रेम नदी भरी सींवा न कली मन मीन री ॥

- verseNumber: "37"
  verseIntro: "श्रीकल्याणरायजी कृत -राग मलार-"
  verseText: |
    झूलैं माई जुगल किशोर हिंडोरें । 
    सँग झूलत वृषभानु नंदिनी बैठे प्रेम रति जोरैं ॥ 
    कियौ सिंगार सकल ब्रज सुन्दरि ठाड़ी भईं चहुँ ओरैं । 
    मानौं मदन अखारौ रोप्यौ गावत तान मरोरैं ॥ 
    तैसेई घुमड़ि रहे हैं बादर मंद-मंद घन घोरैं । 
    कल्यान के प्रभु रमकि-रमकि झूलें निरखि मदन तृन तोरैं ॥

- verseNumber: "38"
  verseIntro: " श्रीदामोदर स्वामीजी कृत -राग धनाश्री-"
  verseText: |
    हौं बलि-बलि या रमकन की, सरस हिंडोरें झुलावत लाल ॥ टेक ॥ 
    नवल रंगीली अति अभिराम । सोहन सारी सूही वाम ॥
    रुरकत उर मुक्ता मनि दाम । झलक पदक ग्रीवा छवि धाम ॥ 
    गुहि बैंनी सुठि सुकर सुहात । नाना रँग कुसुमन की पाँति ॥ 
    सोभित पाछें आछी भाँति । रूप लता मनौं फूली डुलाति ॥ 
    सुंदर रंग सिंदूर सीमंत । रची सँभारि मनोहर कंत ॥ 
    सीस फूल कल तिलक सुदेस । मुख राजत लाजत राकेस ॥ 
    श्रुति कुंडल गंडन झलकै । झूलत फूल झरें अलकैं ॥ 
    पिय हिय उपजत नई ललकैं । देखत दृग न लगें पलकें ॥ 
    खंजन से अंजन जुत नैन । विसद विशाल सुखद रस भैन ॥  
    चितबन बरषत सुधा सुभाय । निरखत लालन मन न अघाय ॥ 
    दामोदर हित भरी रस रंग । अँग-अँग छबि की उठत तरंग ॥ 
    बसौ निरंतर ये मन मोर । रसिक कुँवर वर जुगल किशोर ॥

- verseNumber: "39"
  verseIntro: " राग सारंग -"
  verseText: |
    आई परम सुहाई पावस रितु सुखदाई, तैसौई वृन्दावन मिलि छबि पाई । 
    त्रिविध समीर चलाई तैसिये कोकिल कुहुकाई झूलत हिंडोरे पिय प्यारी मन भाई ॥
    तैसिये दामिनि कौंधत तैसिये गरज घन तैसिये किशोर किशोरी मलार गाई । 
    अद्भुत छबि छाई ज्यौं-ज्यौं सखी देत झुलाई दामोदर हित कछु मनहि समाई ॥

- verseNumber: "40"
  verseIntro: "कवित्त -"
  verseText: |
    झूलत किशोर जोर मधुर बोलत मोर दामिनी दमकैं घन मंद-मंद घोरें ।
    चलत समीर धीर लवँग लता पटीर परसि आवत सौरभ की झकोरें ॥ 
    सखी जन गन तीर-तीर बाढ़ी सोभा भीर गावत झुलावत रंग हिंडोरें । 
    लोचन चपल चारु अंचल चंचल माई कहै कौन कवि छबि स्याम तन गोरें ॥ 
    नीकी भाँति रमकन दसन सु दमकन मृदुल-मृदुल हँसि-हँसि चित चोरें । 
    रस भरे रंग भरे प्रेम भरे गुण भरे दामोदर हित नित बसौ मन मोरें ॥

- verseNumber: "41"
  verseIntro: "श्रीकृष्णदासजी कृत -राग लूम-"
  verseText: |
    तेरी झूलन अति रस सानी सुख दानी श्रीराधावल्लभ लाड़िले । 
    सब सिंगार अरु हार फूलन के प्यारी कूँ झुलावत अति जिय चाड़िले ॥ 
    गावत बजावत रिझावत प्रिया कूँ तान तरंगन आड़िले । 
    राधा बलि कृष्ण हित रूप झड़ी लागी विपिन बसावौ अनत न छाँड़िले ॥

- verseNumber: "42"
  verseIntro: "राग मलार -"
  verseText: |
    झूलत सुरंग हिंडोरे मुकुट धरि बैठे हैं नन्दलाल । 
    लाल काछनी कटि पर बाँधे उर शोभित वनमाल ॥ 
    बाम भाग वृषभान नन्दनी चंचल नैन विशाल । 
    कृष्णदास दंपति छबि निरखत अँखियाँ भई निहाल ॥

- verseNumber: "43"
  verseIntro: "राग ईमन -"
  verseText: |
    लटकि लगत एड़िनु सौं तू अंचल लै री लै ।
    जिन उरझें पटुली पग ऊलत झूलत आवत है भै री भै ॥ 
    कै बैठौ भरि अंक झुलाऊँ कै मेरे अंसन भुज दै री दै । 
    कृष्णदास हित चतुर स्वामिनी द्वै तें एकै है री है ॥

- verseNumber: "44"
  verseIntro: "श्रीजगन्नाथजी कृत -राग मलार-"
  verseText: |
    दोऊ रीझे भीजे झूलत रस रंग हिंडोरें । 
    नेह खंभ डाँड़ी चतुराई हाव भाव मरुवे बेलन चौंप पटुली अनूप बनी कटाक्ष रमकैं चित चोरें ॥ 
    रस उन्नत सुख बरषत मंद हँसन गरज दसन चमक चपला हुलास रस पवन झकोरें ।
    बलित वलय नूपुर मानौं विहंग बोलें जगन्नाथ कविराय प्रभु जात काम रस भोरै ॥

- verseNumber: "45"
  verseIntro: "श्रीसुघररायजी कृत -राग केदारौ-"
  verseText: |
    हौं तौ झूली री हिंडोरें रमकि-रमकि प्रीतम प्यारे के संग । 
    तैसेई बादर ओल्हर आए सुहाए इकलौं उठी री दामिनि दमकि-दमकि ॥  
    कबहूँ-कबहुँ नान्ही-नान्ही बूँदें डारत झमकि-झमकि । 
    सुघरराय प्रभु रस बस करि लीनौं अब कहा करि है काम तमकि-तमकि ॥

- verseNumber: "46"
  verseIntro: "श्रीचत्रभुजदासजी कृत -राग विहागरौ-"
  verseText: |
    मुदित झुलावैं अप अपने ओसरे माई नवल हिंडोरे झूलैं नवल किशोर । 
    नवल कसूँभी सारी पहिरें नवल बधू प्यारी नव भूमि हरियारी सोभित चहुँ ओर ॥ 
    राधे जू चूनरी नव पट पीत सुंदर स्याम के ढिंग मनि गन खचित पटुली बैठे एक जोर ।
    नवल घटा सुहाई परत थोरी-थोरी बूँदै बीच-बीच नव घन की घोर ॥ 
    नवल गीत झुंडन गावत कंचन खंभ के ढिंग नवल वृन्दावन में बोलत हैं मोरी-मोर ।
    चत्रभुज दास प्रभु कौं सखी मिलि झोटा देत मदन रोर ॥

- verseNumber: "47"
  verseIntro: "श्रीनागरीदासजी कृत -राग विहागरौ-"
  verseText: |
    एहो लाल झूलिये नेक धीरें-धीरें । 
    काहे कौं इतनी रमक बढ़ावत द्रुम उलझत चीरें-चीरें ॥ 
    जो तुम झुकि-झुकि झोटन के मिस आवत हौ नीरें-नीरें । 
    हम बरजत मानत नही नागर लेत भुजन भीरें-भीरें ॥

- verseNumber: "48"
  verseIntro: "श्रीनागरीदासजी कृत -राग विहागरौ-"
  verseText: |
    झूलत रसिक मोहन राय । 
    संग भामिनि दामिनी घन बीच मनों दरसाय ॥ 
    कटि लचकि मचकन चलत अद्भुत लेत चित कौं चोर । 
    बढ़ि गई झूलन झनन झनझन किंकिनी धुनि सोर ॥ 
    नील पीत दुकूल फहरत तुटी नव वनमाल । 
    गयौ अंचल छूटि उर डर मिलत झुकि-झुकि बाल ॥ 
    छई चहुँ दिसि मेघ माला छ्यौ राग मलार । 
    दास नागरि तिहिं समय सुख बढ्‌यौ विपिन विहार ॥

- verseNumber: "49"
  verseIntro: "श्रीगदाधर भट्टजी कृत-राग विहागरौ-"
  verseText: |
    झूलत नागरी नागर लाल । 
    मंद-मंद सब सखी झुलावत गावत गीत रसाल ॥ 
    फरहरान पट नील-पीत की, अंचल चंचल चाल । 
    मनौं परस्पर उमगि ध्यान छवि प्रगट भई तिहिं काल ॥ 
    सिलसिलान अति प्रिया सीस तें लटकत बैनी नाल । 
    मनु पिय मुकुट बरह-बरही भ्रम व्याली विकल विहाल ॥ 
    मल्ली माल प्रिया जू की अरुझी पिय तुलसी दल माल । 
    मनु सुरसरी तरनि तनया मिलि किधौं शुक श्रेणि मराल । 
    साँवल गौर परस्पर प्रति छबि सोभा विशद विशाल । 
    निरखि गदाधर कुँवरि-कुँवर कौं मन पस्यौ रस जंजाल ॥

- verseNumber: "50"
  verseIntro: "राग धनाश्री-"
  verseText: |
    माई री, झूलहिं कुँवरि गोपरायन की मधि राधे सुंदरि सुकुमारि ॥ टेक ॥ 
    प्रथमहि रितु पावस आरम्भ । श्री वृषभानु मँगाय खंभ ॥ 
    काढ़ि भवन तें रतन अमोल । रचि पचि रुचिर रच्यौ हिंडोल ॥  
    एक तें एक सुंदरि सुकुमारि । मनहु रची विधि कुमकुम गारि ॥ 
    जगमगात नव जोवन जोति । निरखि नैन चकचौंधी होत ॥ 
    बरन-बरन चूँनरी सुरंग । फबि लौंने सौंने से अंग ॥ 
    राजत मणि अभरन रमनीय । जुही गुही कबरी कमनीय ॥ 
    गावत सरस सुघर सुर गीत । दुलरावत मन मोहन मीत ॥
    प्रेम विवस भईं सकत न गाय । उमग्यौ आनँद उर न समाय ॥ 
    दुरि देखत गोकुल के राइ । सोभा निरखत मन न अघाइ ॥ 
    मुदित गदाधर नंद किशोर । लोचन भये भोर के चोर ॥

- verseNumber: "51"
  verseIntro: "राग गौरी -"
  verseText: |
    हिंडोरना झूलत जुगलकिशोर । हिंडोरना राजत जोवन जोर ॥ टेक ॥ 
    अगनित मणि मानिक लागे । जाहि निरखि नैन अनुरागे ॥ 
    ऊपर चंद्रातप' तानें । व्योम में उनए घन जानें ॥ 
    पचरंग पाट झबा तहाँ झूलें । जनों रंग-रंग पंकज फूलैं ॥ 
    मोतिन के लटकन-लटकैं । लखि जिन नक्षत्र गन सटकैं ॥ 
    ये चपल झिलमिली झलकैं । देखत नहि लागत पलकैं ॥ 
    मणि चौक रचे वर धरनी । यह सौभा जात न वरनी ॥ 
    मृदु पवन उड़त रज रूरी । कुंकुम कपूर कस्तूरी ॥ 
    कुसुमित उपवन चहुँ पासा । तहाँ भूले भँवर सुवासा ॥  
    तहाँ कोकिल कीर कलापी । मृदु बोलत मधुरालापी ॥ 
    जहाँ जूथ-जूथ ब्रज नारी । जनु कुंकुम गारि सँवारी ॥ 
    वे मधुर-मधुर स्वर गावैं । वे कुँवरि-कुँवर कौं लड़ावें ॥ 
    दंपति मुख सोभा देखें । लांगत नहीं नैन निमेखें। ॥ 
    जब झूलें थोरै-थोरैं । आवैं सुभग सुगंध झकोरें ॥  
    पट नील पीत फहराहीं । जनु घन दामिनि निर्त्त कराहीं ॥ 
    सुर बनिता फूलन बरषै । वे ढिंग आवन कौं तरसैं ॥ 
    जहाँ रंग बढ्‌यौ अति भारी । तन की गति सबन बिसारी ॥ 
    गुन गाय गदाधर जीजै । मन प्रेम रंग सों भीजै ॥

- verseNumber: "52"
  verseIntro: "राग आड़ाना -"
  verseText: | 
    राधे जू झूलत रमकि-रमकि । 
    मणि कंचन कौ सुरंग हिंडोरौ ता मधि दामिनि चमकि-चमकि ॥ 
    गावत गुन गिरिधरन लाल के उठत दसन दुति दमकि-दमकि । 
    बाढ्यौ रंग गदाधर प्रभु जहाँ गयौ है मदन असि तमकि-तमकि ॥

- verseNumber: "53"
  verseIntro: "राग मलार -"
  verseText: |
    सुखद वृन्दावन सुखद यमुना तट सुखद कुंज भवन रच्यौ है हिंडोरौ । 
    सुखद कलपतरु सुखद फूल फल सुखद बहत सीतल पवन झकोरौ ॥ 
    सुखद रँगीले संग सुखद रँगीली राधा सुखद करत केलि रति पति जोरौ ।
    सुखद सखी झुलावैं सुखद गीत गावैं सुखद गरजि बरसत थोरौ-थोरौ ॥  
    सुखद हरित भूमि सुखद बूँदन रंग सुखद कोकिला कल सारस चकोरौ । 
    सुखद बजावैं बैन सुखद सुजस सुनि सुखद गदाधर चित कौ चोरौ ॥
  
- verseNumber: "54"
  verseIntro: "राग मारू -"
  verseText: |
    निज सुख पुंज वितान कुंज हिंडोरना झूलत स्याम सुजान । 
    संग स्यामा जू परम प्रवीन जासौं सदा रसिक आधीन ॥ टेक ॥ 
    कंचन खंभ पेच बबरैंड़ा जटित जराऊ सँग री । 
    पन्ना खचित पिरोजा बिच-बिच कनक कलश जगमग री ॥  
    गज-मोतिन सौं डाँड़ी गूँथी चौकी चमक सुरंगी । 
    रमकत झमकत गहि-गहि लटकत मोहन मदन त्रिभंगी ॥ 
    मरुवे बेलन ध्वजा झालरी दुति गहरें परसि सु तरुणी । 
    चौका रतन झोटन में जानी कोकिल शब्द उचरणी ॥ 
    चहुँ ओर द्रुम बेली प्रफुलित लता सघन गंभीर । 
    जब रमकत झमकत दामिनि-ज्यौं झलमल जमुना नीर ॥ 
    सारस हंस चातक चकोर पिक नेह धरे ह्वै पैठे । 
    झूलत लता द्रुमन तन दीसत ऐसे जुरि-जुरि बैठे ॥ 
    विजै सुभाव किये घन संपति उल्हर विपिन पर आए । 
    गरजत तरजत मधुर राग लिये सखि केकी कूक सुहाए ॥ 
    सहचरि गान करत ऊँचे सुर श्रीवृन्दावन राजें । 
    मधुर मँजीर गगन उघटत सम सुभट पखावज बाजें ॥ 
    नीलांबर पहरैं नव नागरि लाल कंचुकी सोहै । 
    भीजि गई श्रम जल सौं उरजन प्रीतम कौ मन मोहै ॥ 
    लट सगबगी सु लाल वदन पर सीस फूल लपटानौं । 
    प्रियाजू की चौकी गिरिधर कौ चन्द्रहार अति सोभित अरुझानौं ॥ 
    दृग रसाल रस भरी भौंह सौं हँसि-हँसि अर्थ जनावैं । 
    मुरन दुरन में चित आकरषत लालची मन ललचावैं ॥ 
    फैलि रह्यौ सौरभ सगरें सखि कुंकुम कृष्णागर कौ । 
    कहाँ लगि कहै मत्त भयौ बरनै भाव गदाधर उर कौ ॥

- verseNumber: "55"
  verseIntro: "श्री बल्लभरसिकजी कृत - राग मलार"
  verseText: |
    झुलवहिं सहचरि रंग रँगीली रंग रँगीले दोऊ झूलैं हो । 
    दसन रँगीली वसन रँगीली दरसन रसन रँगीली हो ॥ 
    नव जोवन के जोरन मोर मरोरन छबि अंगन में । 
    नई बाँधनू तन में लखि पिय लई बाँधनू' मन में ॥ 
    लहरैं लेंहि लहरिया सारी रूप समुद्र के जोरैं । 
    जाइ किनारे लगे जु तारे तिनहूँ कौं लै बोरें ॥  
    हरी-हरी चुन्नी पर बूँदे लाल चुनी सी सोहैं । 
    लाल चुनी पर हरी-हरी बूँदें रूँदे मन कों मोहैं ॥ 
    लाल चुनी इहि लालच नीकें बाल चुनीन सँभाले ।
    रँगी जानि रंगीन लाल ये रँगी न रंगनवाले ॥ 
    लाल-हरे अतरोंटन की दुति लाल-हरे मनि को हैं । 
    लाल-हरे मनि जाय लगे तहाँ लाल हरे ह्वै जोहैं ॥ 
    मुलकट चोली बनी धनी के अतुल पुलक उपजावैं । 
    चुकी न टूक-टूक करतें कंचुकी टुकी सुभावैं ॥ 
    भाग भरी भामिनी अनुरागिनि राग मलारहि छावैं । 
    संभ्रम दामिनि जानि स्यामघन झूमि-झूमि पर आवैं ॥ 
    एक मृदंग तरंग धरैं इक बीण प्रवीण बजावैं । 
    सुवरण रंजित चूरे एकन तंबूरे परन मिलावैं ॥ 
    झूलि-झूलि झुलवहिं गहि सहचरि चहचर जोर मचावैं । 
    एक कहैं छिन रहि री धीरी बीरी पान खबावैं ॥ 
    झुलवहिं वीरबहूटी सी जु बधूटी भूषन बाजैं । 
    बल्लभ रसिक अलिन के अंग मनौं अनंग दुहाई गाजैं ॥

- verseNumber: "56"
  verseIntro: "राग मलार -"
  verseText: |
    आज दोऊ झूलत रति रस साने । 
    ठाड़े मचकैं लचकि तरुनि के गहि फल फूलन आनें ॥ 
    सूहे पट पहिरैं द्वै पटुली बैठे साँवल गोरी । 
    अलिनु रँगीली तिय पद अँगुली पिय डोरी सों जोरी ॥ 
    श्याम काम वस झूलि फूलि पग मूलन झूल बढ़ाहीं । 
    कामिनि चरन तामरस छुटि अलि काम लूटि मचि जाहीं ॥ 
    जोवन मधि जोवन मद झुलए झूलन फंदन जानैं । 
    बल्लभ रसिक सखी के नैना एही झूल झुलानैं ॥

- verseNumber: "57"
  verseIntro: "राग मलार -"
  verseText: |
    ललित कदंब हिंडोरे झूलैं । 
    रसिक कदंब सिरोमणि दंपति वन संपत्ति लखि फूलें ॥ 
    सोहैं सूहे वसन सु बनितन मणि गण भूषण राजैं । 
    जोवन चैनन बढ़े नैन चल चढ़े मैन के छाजैं ॥
    रँगी हिंडोरे की डोरी गोरी गहि उमहि झुलावैं । 
    भाव सहित पावस रितु गीतन मीत अमी रस प्यावैं ॥ 
    ह्वै आरूढ़ मसृण तृण भूपर बूढ़ प्रौढ़ छबि छाई । 
    पावस रितु झूलन मंगल में  गिलमें आणि बिछाई ॥  
    घन अम्बर पर संवरारी पक्षीण लक्षण रंग लाये । 
    मित्र स्याम घन  हित तनु चित्र विचित्र वितान तनाये ॥ 
    अधर धरै मुरलीधर मुरली मधि सूहौ सुर रागैं । 
    धुर बादर लौं जाय लगे सुर धुरवा छूटन लागैं ॥
    इन्द्र धनुष आवै बनि-बनि पुनि छिन-छिन में दुरिजात । 
    पचरंग सारी धारी छबि लखि मन-मन मनौं लजात ॥ 
    नव लालित्यन सौं नवला नव लाल मलारहि गावैं । 
    घन दामिनि के भोर-मोर नाचैं राचैं सु रचावैं ॥ 
    बैठे आय हिंडोरे कोकिल कल कंठन के बोलें । 
    निजकुल संभ्रम बोलि-बोलि सुर रहें मधुरता तोलैं ॥ 
    झूलन रमकन दामिनि दमकन रिमझिम झमकन घन में । 
    झूलन दावन झूलन लावन मिलि झिलमिल अंगन में । 
    फूलन लाल गुही सुरही के पेचन मेचक बैनी । 
    झूलत पाछें-पाछें लगि आछें मनु बँधी त्रिबैनी ॥ 
    घन- अँधियारी यारी कीनी पिय प्यारी सों जोर । 
    दामिनि उजियारी बिच-बिच न्यारी सखियाँरी ओर ॥ 
    मोर छलन सों फिरैं मोर फिर जोर छलन कौं ठानै । 
    चंचल चंचरीक एक आकुल रंच न हटक्यौ मानै ॥ 
    गहत उरवसी बन्द जरकसी कंचुकि उरज कसी । 
    सुपटु कसे उकसे दबि ऊपर छबि तब फबि निकसी ॥ 
    नेह मेह सरसें उरसें बरसें रस टूटे बंद ॥ 
    भीजि वसन मन धरनि भरन अंकुरित रोम आनंद ॥ 
    इहिं झूलन झुलवन मद छाकी थाकी मति कत चलई । 
    बल्लभ रसिक अली अब निसदिन झुलवत झूलत रहई ॥

- verseNumber: "58"
  verseIntro: "श्रीतानसैनजी कृत - राग मलार"
  verseText: |
    रमकि झूलत हैं री लाल बाल रहसि रहसि संग । 
    ज्यौं-ज्यौं डरपत प्यारी त्यौं-त्यौं कर गहत मोहन आली मोहि अति रस बाढ्यौ तातें भेटत भुज भरि अंग ॥ 
    सावन तीन सुहावनी लागत झुलवत सहचरि करत रंग । 
    तानसैन पिय प्यारी की छबि पर वारौं कोटि अनंग ॥

- verseNumber: "59"
  verseIntro: "श्री आनन्दघन जी कृत - राग मलार"
  verseText: |            
    गौर स्याम धारिन कौ लहरिया झूलत लहरें लेत । 
    पहिर्यो  परम चौंप सौं स्यामा उघरि पर्यौ हिय हेत ॥ 
    उफनि उठ्यौ संगम सुख सागर लौने अंग दिखाई देत । 
    पिय मन मगन होत अभिलाषन बँधत न धीरज सेत ॥ 
    मधुर-मधुर गावत मलार धुनि सुनि रीझत भीजत चित चेत । 
    छुटे चिकुर आनँद घन बरषत भरत मनोरथ खेत ॥

- verseNumber: "60"
  verseIntro: "श्रीरामरायजी कृत - राग मेघ"
  verseText: |  
    सखी झूलत श्यामा श्याम हिंडोरे रंग सौं । 
    सखी नवल छबीली वाम महा अभिराम झुलावें सुखधाम हिंडोरे रंग सौं ॥
    सखी रेशम पचरंग डोर गही कर जोर किशोरी किशोर हिंडोरे रंग सौं ।
    सखी गरजत घन घोर कुहक पिक मोर दामिनि चहुँ ओर हिंडोरे रंग सौं ॥ 
    सखी बरषत रस की धार गावत सुकुमार विहारी विहार हिंडोरे रंग सौं । 
    सखी भीज रहीं सब बाल उमँगि रस जाल कोकिल सु रसाल हिंडोरे रंग सौं ॥ 
    सखी रमक हिलोर विशाल सु मोहन लाल प्रिया हिय माल हिंडोरे रंग सौं ।
    सखी जमुना तीर गंभीर मदन मद पीर रसिक वर बीर हिंडोरे रंग सौं ॥ 
    सखी अनुपम अखिल सिंगार सुरत सुख सार परस्पर प्यार हिंडोरे रंग सौं ॥ 
    सखी रामराय उद्‌गार हिये न सम्हार गावत जु मलार हिंडोरे रंग सौं ॥

- verseNumber: "61"
  verseIntro: "राग मलार -"
  verseText: |
    सघन निकुंज सुहावनी सखी झूलत दोऊ सुकुमार । 
    अंसन उरजन भुज दियें हिय हरनी हिय हार ॥ 
    अँग-अँग उझलत झूलत अधरामृत आहार । 
    पुलकित अरुझी माल कर कंकन कुंडल बार ॥ 
    गावत मिलि कलरव भरे भूल परत रिझवार । 
    वेपथु जुत विग्रह बने आनन्द वृष्टि अपार ॥ 
    श्रमकन प्रशमित करत है ललिता अंचल ब्यार । 
    श्री रामराय सुललित महा सुरत हिंडोर विहार ॥

- verseNumber: "62"
  verseIntro: "श्रीनन्ददासजी कृत - राग जैजैवंती"
  verseText: |
    माई री झूलत नवल बाल झुलावत नंद लाल कालिंदी के तीर माई रच्यौ है हिंडोरना ।
    तैसेई बोलें मोर क्रीड़ा करें चहुँ ओर तैसौई मधुर धुनि लाग्यो घन घोरना ॥ 
    तैसेई फूले री फूल हरत मन के सूल अलिन के जूथ मनौं मद के मदोरना । 
    नन्ददास प्रभु प्यारी जोरी अद्भुत भारी देखबौई कीजै जैसे चंद कौं चकोरना ॥

- verseNumber: "63"
  verseIntro: "राग मलार -"
  verseText: |
    हिंडोर माई झूलत जुगल किशोर । 
    ललिता चंपकलता विशाखा देत हैं प्रेम झकोर ॥ 
    तैसिये पावस रितु सुख दायक मंद-मंद घन घोर । 
    तैसौई गान करत ब्रज सुंदरि निरखि पिया की ओर ॥ 
    कोटि-कोटि दरसन छबि उपजत होत सखी मन भोर । 
    नन्ददास प्रभु गिरधर राधा प्रीति निबाहत ओर ॥

- verseNumber: "64"
  verseIntro: "राग मलार -"
  verseText: |
    दूलह दुलहिनि सुरत हिंडोरे झूलें, प्रथम समागम अहो गठजोरें । 
    चरन खंभ भुज कर मयार डाँड़ी चार कमल कर हुलसें दोऊ ओरें ॥
    सुभग सेज पटुली सुख बरसत मरुवा बेलन प्राची ओरें । 
    नन्ददास प्रभु रस बरसत जहाँ नव घन - दामिनि की अनुहोरें ॥

- verseNumber: "65"
  verseIntro: "राग विहागरौ -"
  verseText: |
    झूलत दोऊ रस रंग भरे । 
    नँद नंदन वृषभानु नंदिनी राजत अँग-अँग रंग ढरे ॥ 
    सोभित मणिमय माला भूषण चमकत चंचल चारु खरे । 
    मानौ सुरँग दुरंग वसन बिच जलचर बालक जाल परे ॥ 
    कुंडल कल ताटंक सु अलकैं झलकै लोल कपोल अरे । 
    मंद हँसन अरु दमक दसन छबि कोटि मदन के मान हरे ॥ 
    बड़ी झूल में डरन प्रिया की पिय मन मोहन वस जु करे । 
    नंददास प्रभु की यह सोभा नैनन निरखि निमिष विसरे ॥

- verseNumber: "66"
  verseIntro: "राग जैजैवंती"
  verseText: |  
    फूल कौ हिंडोरौ बन्यौ फूलि रही जमुना । 
    सुनतहि सब दौरि आईं  झूलिवे कौं ललना ॥ 
    फूलन के खंभा दोऊ डाँड़ी चारु फूलन की चौकी बनी जगमग लगना । 
    चहूँ दिसि सखी फूलीं फूलीं-फूलीं गावहिं नंददास प्रभु फूले फूलि रहे मगना ॥

- verseNumber: "67"
  verseIntro: "श्रीरसिक प्रीतमजी कृत - राग कान्हरौ"
  verseText: |
    झूलत तेरे नयन हिंडोरें । 
    खंभ भ्रू भई मयार दृष्टि करन डाँड़ी चहूँ ओरें ॥ 
    पटुली अधर कपोल सिंघासन बैठे युगल रूप रति जोरें । 
    कच घन आड़ दामिनी दमक मानौं इंद्र धनुष अनुहोरें ॥ 
    दुरि देखत अलकावलि अलि कुल लेत सुगंधन पवन झकोरें । 
    बरुणी चमर ढुरत चहुँ दिसि तें लर लटकन फुंदना चित चोरें ॥ 
    थकित भये मंडल युवतिन के युग ताटंक लाज मुख मोरें । 
    रसिक प्रीतम रस भाव झुलावत रीझ-रीझ तानन तृण तोरें ॥

- verseNumber: "68"
  verseIntro: "श्रीरसिक प्रीतमजी कृत - राग कान्हरौ"
  verseText: |
    कौन चढ़े पहले सुरँग हिंडोरें । 
    सोई करत मनुहार हिये हित, रमक देत जोरा जोरैं ॥  
    गावत राग तान मधुरे स्वर कोटि काम चित चोरैं । 
    रसिक प्रीतम यह होड़ प्रिया परी, रीझि देत तृण तोरैं ॥

- verseNumber: "69"
  verseIntro: "राग सोरठ -"
  verseText: |
    झूलत साँवरे संग गोरी । 
    अमित रूप गुण सहज माधुरी शोभा सिन्धु झकोरी ॥ 
    उत सिर मोर मुकुट की लटकन इत बेंदी छबि रोरी । 
    कुंडल लोल कपोलन की छबि इतहि बनी कच डोरी ॥ 
    नक बेसर मुक्ता की झाँई चौंप परी दुहुँ ओरी । 
    रसिक प्रीतम बल्लभ कटाक्ष छबि हाव भाव चित चोरी ॥

- verseNumber: "70"
  verseIntro: "राग सोरठ -"
  verseText: |
    प्यारी झूलन पधारौ झुकि आये बदरा । 
    साजौ सकल श्रृंगार नैनन धारौ कजरा ॥ 
    ऐसौ मान नहि कीजै, हठ तजिये अली । 
    तू तौ परम सयानी हो वृषभानु की लली ॥ 
    रसिक प्रीतम मग जोवत खड़े । 
    दोऊ कर जोरे तेरे चरनन पड़े ॥

- verseNumber: "71"
  verseIntro: "श्रीरसिक विहारीजी कृत - राग सोरठ"
  verseText: |
    रसिया पिय झुलावै छै हो, प्यारी जू नैं ।
    रंग भरे झोटा दै श्याम, नैन सों नैन मिलावै छै हो । 
    बरषि रह्यौ रस रंग हिंडोरौ मिलि मलार सुर गावै छै हो । 
    ये बातें सामलिया म्हानैं रसिक विहारी वर भावै छै हो ॥

- verseNumber: "72"
  verseIntro: "राग कल्याण -"
  verseText: |  
    झूलत स्याम प्रिया संग रंग हिंडोरना । 
    बरन-बरन अंबर तन पहिरें नव युवती जन गावत कल गीतन चित चोरना ॥ 
    तैसीये रितु सावन मन भावन हरियारी भूमि मंद-मंद गरजन घन घोरना । 
    तैसेई पिक चात्रक बन गान करत प्रेम मुदित केकी कीर कुलाहल कौ ओर ना ॥ 
    सहचरी चहुँ ओर तें झुलावत अति आनंदित पटतर घन दामिनी दुति जोरना । 
    पिय बिहारी लाल ललित दंपति ललितादिक निरखि प्रेम विवस जानत निसि भोर ना ॥
          
- verseNumber: "73"
  verseIntro: "राग मलार -"
  verseText: |  
    हिंडोरा हेली रंग रह्यौ सरसाय । 
    एजी मैं तौ वारी जी वारीजी हौं छबि देखि ॥ हिंडोरा० ॥ 
    झोटन में झुकि झूमि रह्यौ पिय प्यारी जूरौ रूप लुभाय ॥ हिंडोरा० ॥ 
    तन भीजें तरुवर चुवै हो गलबैयाँ लपटाय ॥ हिंडोरा० ॥ 
    श्री रसिक बिहारीजी तेरौ झूलनों जी म्हारे मन में झोटा खाय ॥ हिंडोरा० ॥

- verseNumber: "74"
  verseIntro: "राग मलार -"
  verseText: |  
    बिहारी नेंक धीरें झूलौ राज । 
    स्यामा प्यारी झूलै छै थारे लार ॥  
    घन रमकन म्हारौ जियौ लरजै छै ये छै अति सुकुमार ।
    लचकत मचकत रंग हिंडोरे भूषण लागे भार । 
    मद छके छैला श्रीरसिक बिहारी नैना अतिशय रसाल ॥

- verseNumber: "75"
  verseIntro: "श्री रसिक गोविन्दजी कृत - राम मलार"
  verseText: |  
    तेरी झमकि झूलन कटि लचक जात रमक रंगीली अति सोहै री। । तेरी० ॥ 
    तू है गुण रूप जीवन रंग रस भरी तेरी उपमा कूँ कोहै री ॥ तेरी० ॥ 
    हाथन चुरी महावर मेंहदी चटक चौगुनी सोहै री ॥ तेरी० ॥ 
    रसिक गोविन्द अभिराम श्याम घन, तू दामिनि मन मोहै री ॥ तेरी० ॥

- verseNumber: "76"
  verseIntro: "श्री रसिक गोविन्दजी कृत - राम मलार"
  verseText: |
    कैसे झूलौं री हिंडोरे बतियाँ मानै ना हरी । 
    बरज्यौ न मानत यह काहू कौ, लोक की लाज टरी ॥ 
    हा-हा खात ये तौ पैयाँ परत है, प्रेम के फन्द परी । 
    रसिक गोविंद अभिराम स्याम नै भुज भरि अंक भरी ॥

- verseNumber: "77"
  verseIntro: "श्रीविठ्ठलनाथजी की भेंट (श्रीगंगाबाईजी कृत) राग मलार -"
  verseText: |
    बोलें माई श्रीवृन्दावन में मोरवा । 
    हरित भूमि जमुना तट ठाड़े उमड़ि घुमड़ि घन घोरवा ॥ 
    अरस परस दोऊ झूलैं झुलावैं, पचरंग सरस हिंडोरवा । 
    कसूँभी पाग सीस खिरकिन की उड़त पीत पट छोरवा ॥ 
    मधुरे सुर मल्हार आलापत मीठी तान चित चोरवा । 
    श्री विठ्ठल रसिक दोऊ झूलत सुखद पवन चहुँ ओरवा ॥

- verseNumber: "78"
  verseIntro: "राग मलार -"
  verseText: |
    गोकुल चंद हिंडोरे झूलत नटवर भेष किये । 
    तीन चंद्रिका माथे मुरली करहि लिये ॥ 
    कसूँभी पाग सुरंग पिछौरा मुक्ता माल हिये । 
    रमकि-रमकि झूलत राधा सँग ब्रज जन सुखहि दिये ॥ 
    निरखि-निरखि फूलत ब्रज सुंदरि यह सुख नैन पिये । 
    श्रीविठ्ठल गिरधरन लाल की यह छबि देख जिये ॥

- verseNumber: "79"
  verseIntro: "राग मलार -"
  verseText: |
    मोहन झूलत रंग हिंडोरें । 
    रंग महल में रंग हिंडोरौ हरित भूमि चहुँ ओरैं ॥ 
    नव वन नव घन नव चातक पिक नवल सु पवन झकोरें । 
    बाजत ताल मृदंग मधुर सुर नव मुरली घन घोरैं ॥ 
    नई-नई नारि झुलावत गावत भूषण अंगन गोरैं । 
    नई कंचुकी नव रंग सारी अँगिया सौंधे बोरें। ॥ 
    लाड़िली डरपत लाल उर लपटत झकझोरा झकझोरैं । 
    श्रीविठ्ठल गिरधरन लाल सँग सोभित चंद चकोरैं ॥

- verseNumber: "80"
  verseIntro: "श्रीपरवतजी कृत - राग मलार"
  verseText: |
    सुरंग हिंडोरना माई झूलत नंद कुमार । 
    हरिण नयनी मंद गवनी सजि सकल सिंगार ॥ टेक ॥ 
    द्वै खंभ बने कदंब के मलय मरुवे सुढार । 
    लाल डाँड़ी डहडही पचि रची है सूतधार । 
    कनक पटुली जटित हीरा गढ़ी सरस सुढार । 
    चहुँ ओर तरुणी अरुण वसनी किंकिनी झनकार ॥
    रंग भरे उतंग उरजन उरन झलकत हार । 
    चलत चख फहरात अंचल लसत लाँबे बार ॥ 
    मृगमद अगर करपूर कुंकुम बास की उदगार । 
    मुख भरे पानन स्याम स्यामा दोऊ परम उदार । 
    गीत गावैं सुकवि के रस रीति की टकसार । 
    ग्राम सुर घट गाँस साधें तान ताल अपार ॥ 
    रीझ रीझे जलहि भीजे जम्यौ राग मलार । 
    शुक मोर कूका कोकिलन में सुरन परी हटतार । 
    मेघ बरसें रस भरे जल फुहीं बारम्बार । 
    लाज तजि लपटात लालहि तज्यौ लोक विचार ॥ 
    छबि फबी मधुसूदनहि बलिहार कोटिक मार । 
    चिरजियौ परवत प्राण पति ब्रज जनन प्रान अधार ॥

- verseNumber: "81"
  verseIntro: "श्रीछीतस्वामीजी कृत राग अड़ानौ -"
  verseText: |
    रमकि झमकि झूलन में झमकि मेह आयौ नहीं सुरझत बातन तें । 
    नव पल्लव संकुलित फूल फल नवल-नवल द्रुम लता तरें झूलत भयौ है बचाव पातन तें ॥ 
    मंद-मंद झूलत थंभन लागे अंबर ओढ़ें जलजातन तें । 
    छीत स्वामी गिरधारी तऊ भीज्यौ बागौ सारी भौरन की भीर भारी टारी न टरत क्यों हूँ छूटी है छबीली छटा गातन तें ॥

- verseNumber: "82"
  verseIntro: "श्रीबलिहारीजी कृत - राग झंझौटी जंगला"
  verseText: |
    मन मोहन रंग हिंडोरना । 
    रहसि झुलाय रसिया सामन तीज निहोरना ॥  
    चलौ सखी मिलि झूलन जैयै वृन्दावन निज ठौरना । 
    मिलि झूलैं बलिहारी उड़त पीत पट चोलना ॥

- verseNumber: "83"
  verseIntro: "श्रीइच्छारामजी कृत - राग झंझौटी-जंगला"
  verseText: |
    प्यारे प्यारी झूलैं कदम की डारियाँ । 
    घन गरजै अरु दामिनि दमकै चहुँ दिस गोप कुमारियाँ ॥  
    गौर स्याम मुखचंद परस्पर रहत निहारि निहारियाँ । 
    इच्छाराम गिरधर नव गोरी छबि पर बलि-बलिहारियाँ ॥

- verseNumber: "84"
  verseIntro: "श्रीगोकुलनाथजी कृत - राग बिहागरौ"
  verseText: |
    हा-हा हरि नेंक हरें-हरें झूलौ ।
    हौं वारी विहारी जू सारी सँवारौ पटुली पगु ठहरत नाहीं थहरात पिंडुरी फहरात दुकूलौ॥ 
    टूट्यौ हार गजरा गिर गयौ छूटी है बैनी खिस्यौ सीसफूलौ । 
    गोकुल नाथ जू प्यारी तिहारी सम्हारत नाहीं अहो अजू हूलौ ॥
- verseNumber: "85"
  verseIntro: "श्रीभगवतमुदितजी कृत - राग विहागरौ"
  verseText: |
    हा-हा बलि नेंक हरें-हरें झूलो, यौं कहत विहारी प्यारी सौं । 
    देखौई चाहत वदन माधुरी सु मदन मनोहर फूल्यौ ॥ 
    अति आतुर चातुर चित चंचल कौतिक काम छुवत भुजमूलौ । 
    भगवत मुदित झुलाय भाय रति लाय लई दुलहिनि अरु दूल्हौ ॥

- verseNumber: "86"
  verseIntro: "श्रीसूरदासमदनमोहनजी कृत - राग ईमन"
  verseText: |                      
    माई री झूलत रंग हिंडोरें । सोभा तन स्याम गोरें। ॥ 
    नील पीत पट घन दामिनि के भोरैं । गोपी जन चहुँ ओरें ॥ 
    झुलवत थोरें । पवन गमन आवै सौंधे की झकोरें ॥ 
    सोभा सिंधु मन बोरैं । नैनन सों नैन जोरैं रीझि प्राण वारैं छबि पर तृण तोरैं ॥ 
    सूरदास मदन मोहन चित चोरैं । मुरली की धुनि सुनि सुर बधू सीस ढोरैं ॥

- verseNumber: "87"
  verseIntro: "श्रीहित मकरंदजी (मीठा जी) कृत - राग केदारौ"
  verseText: |  
    सुरत रंग हिंडोर झूलत, सुरत रंग हिंडोर । 
    मदन सदन सुवदन उमगन नेह मेह झकोर ॥ 
    नील नीरद रसद दामिनि चख रुखन की डोर । 
    पुलक वस कसि अंग अँग पिय दिये उरज अकोर ॥ 
    अलक अलकन ग्रन्थि दै छबि नील पीतन छोर । 
    रूप पानिप श्रोत बाढ़ी ओतप्रोत न ओर ॥ 
    झमकि झोटन संक लखि पिय संक वच चख कोर । 
    छीनकटि उर-उर उदधि भर भाम भृकुटी मरोर ॥ 
    संधि हित मकरन्द थाँभै रटी मनमथ रोर ॥

- verseNumber: "88"
  verseIntro: "गोस्वामी श्रीकिशोरीलालजी कृत - राग खमाइची"
  verseText: |
    सावन तीज सुहाई माई दोऊ मिलि झूलहीं हो । 
    गौर स्याम अभिराम परस्पर चढ़े हिंडोरें फूलहीं हो ॥  
    चहुँ ओर ललितादिक निरखत इक टक पलकन भूलहीं हो । 
    जै श्रीकिशोरीलाल हित प्रमुदित ह्वै - ह्वै मचकत गहि भुज मूलहीं हो ॥

- verseNumber: "89"
  verseIntro: "श्रीसूरदासजी कृत - राग मलार"
  verseText: |
    आली री झूलत स्यामा-स्याम ॥ध्रुव ॥ 
    द्वै खंभ मर्कत मणि मनोहर काम कुंद चढ़ाय । 
    हरित चुन्नी जड़ित नग बहु लाल हीरा लाय ॥ 
    बहुत मुक्ता बहुत विद्रुम ललित लटकें मोर । 
    बहु रंग रेशम बरही बरुहा होत राग झकोर ॥ 
    तहाँ स्याम स्यामा संग झूलैं सखी देत झुलाय । 
    सबै सरस श्रृंगार कीने रूप न बरन्यौ जाय ॥ 
    नील सारी लाल लहँगा पीत अँगिया अंग । 
    रोमावली मानौं होत यमुना त्रिवलि तरल तरंग ॥ 
    बहुत युवती यूथ ठाड़े कहूँ ठाड़े ग्वाल । 
    विहँसि मधुरे गीत गावैं करत बहु बिधि ख्याल ॥ 
    कहूँ चातक कहूँ दादुर कहूँ बोलत मोर । 
    चहुँ ओर चितै चकोर रहि गये देखि इनकी ओर ॥ 
    दसन दुति अनार की सी हँसत जब मुसिकाय । 
    दमक दामिनि निरखि लज्जित बहुरि गई छिपाय ॥ 
    कंज खंजन मीन मानौं उड़त नाहिन भौर । 
    बिंब के ढिंग कीर बैठ्यौ गहि न पावै ठौर ॥ 
    लखि अलक कह्यौ न जाय सखी री अंक देखियत चार । 
    भ्रू देखि भ्रमरा गये बन कटि गयौ केहरि हार ॥ 
    चाल देखि मराल लज्जित गये सर तजि गेह । 
    जानि कैं अभिमान गज सिर अजहुँ डारत खेह ॥ 
    देखि सखी री उरज कंचन कलस धरे बनाय । 
    नहीं होय श्रीफल इतौ सुंदर नहि कमल कली सुहाय । 
    बीच मुक्ता माल मानौं सुरसरी धसि धाय । 
    बार चकवा पार चकई दिन हूँ मिलत न आय ॥ 
    सबै राग मल्हार गावैं सरस गौड़ मल्हार । 
    सूहौ सारंग सरस टोड़ी भैरवी केदार ॥ 
    मालवौ श्रीराग गौरी होत आसावरी राग । 
    कान्हरौ हिंडोल कौतुक तान बहु विध लाग ॥ 
    एक अचिरज देखि सखी री राहु शशि इक ठौर । 
    उड़त अंचल लपट बैनी रपट झपटे मोर ॥ 
    कनक जटित जराय बेंदी कवि जो उपमा गाय । 
    सूर शशि यह राहु ब्रज में प्रगट तीन्यौ आय ॥

- verseNumber: "90"
  verseIntro: "राग मलार -"
  verseText: |
    झूलत लाड़िलौ नवल बिहारी । 
    सीस सेहरौ अति छबि राजत उपरेना जरतारी ॥ 
    मुक्ता माल उर ऊपर सखी री लागत परम सुहाई । 
    मानौं सुरसरि स्वर्ग लोक ते चली धरनि पर आई । 
    सब सिंगार अद्भुत सखि शोभित उपमा बरनि न जाई । 
    सूर प्रभू के रोम-रोम पर बार-बार बलि जाई ॥

- verseNumber: "91"
  verseIntro: "राग मलार - छंद"
  verseText: |
    अजर जम्बूनद' खंभ हिंडोरना विद्रुम रची है मयारि । 
    जनु रवि सुतहिं दिखावत भुव भुज युगल पसारि ॥ टेक ॥ 
    लाल मणि बिलना बन्यौ बिच मिली मर्कत डार । 
    उगत रवि रथ तें चलीं मनौं यमुन ह्वै विवि धार ॥ 
    विवि धार धारा धसी अधिकौ फटिक पटुली संग । 
    तिहि बीच तिरछी ह्वै मिली है गगन तें मनु गंग ॥ हिंडोरना० ॥1॥

    प्रतिफलित मणि मंजीर जहाँ तहाँ चरन पंकज रंग । 
    हिलमिलत सब प्रतिविंब सोभित सरसुती अनुरंग ॥ 
    अरध ऊर्ध झकोर इत उत झलक लोचन कोर । 
    वदन विधु सौं लुब्ध मनौं उड़ि-उड़ि मिलत चकोर ॥ 
    उड़ि मिलत जहाँ चकोर अति छबि ललित चलत सुनैन । 
    मनहुँ पंकज वास कौं सँग लगी मधुकर सैंन ॥2॥
    
    मणिमय महल आँगन रच्यौ नव रंग-रंग हिंडोर । 
    जहाँ कोटि मनमथ मोद मोहन नवल नन्द किशोर ॥ 
    ललित वलित विशाल अति छबि झलक मुक्तन हार । 
    पिय संग राजत लाड़िली वृषभानु गोप कुमारि ॥ 
    जहाँ कुँवरि श्रीवृषभानु सोभित नंद नंदन संग । 
    मनौं नव घन जलद में अति तड़ित तरल तरंग ॥3॥

    अनिमेष दृग जहाँ कियें निरखत मंडली ब्रज नारि । 
    मनु सिंगार सुलता की विधि रची है कंचन बार ॥ 
    इत उतै छबि सिंधु विवि मुख झलक मुक्ता माल । 
    समैं सावन जानि जनु बग पाँति उड़त विशाल ॥ 
    उड़ि लाल अंचल चूँनरी उत पीत पट फहरान । 
    सूर सम उपमा सखी मोपै न जाति बखान ॥4॥

- verseNumber: "92"
  verseIntro: "श्रीरसिकदासजी कृत - पद"
  verseText: |
    झूलन चलौ हिंडोरना वृषभानु नन्दिनी । 
    सावन की तीज आई घन घोर घटा छाई, मेघन झरी लगाई, परैं बूँद मन्दिनी । 
    सुन्दर कदम की डारी झूला पर्यौ है प्यारी, देखौ कुँवरि किशोरी री, सब दुख निकन्दनी ।
    पहिरौ सुरंग सारी मानौं विनय हमारी, मुखचन्द की उजारी मृदु हास फन्दिनी ॥ 
    मम मान सीख लीजै सुंदरि न देर कीजै, हम तो विलोकि जीजै, तू गति गयन्दिनी ।
    शोभा लखौ बिपिन की फूली लता द्रुमन की, सुन अरज रसिक जन की, करौं चरण वंदिनी ॥

- verseNumber: "93"
  verseIntro: "राग मलार - छन्द-"
  verseText: |
    ललित हिंडोरना दोऊ झूलत कुंज दुवार । 
    ललित खंभ सुवलित मणि गण जटित मरुवे मयार ॥ टेक ॥ 
    लाल डाँड़ी लाल लालनु झलक झलकत चार । 
    पटुली सुचित्रन मिली रचना केलि कल छबि सार ॥ 
    बनी कंचन तनी पहिरें सुरंग कसूँभी सार । 
    जगमगैं अभरन हरन मन नवल पिय सुकुमार ॥1॥ 

    रंग पानन झलक आनन महक सौरभ अंग । 
    चपल चख मणि तरल कुंडल अलक बेसर संग ॥ 
    चलत झोटा लुलित बैंनी किरत कुसुम सुरंग । 
    उड़त चीर समीर वस घन बरसि रंग बिरंग ॥2॥ 

    गान तान समान स्वर अति जील शील अथोर । 
    मिले प्रेम मलार भेदन हंस कोकिल मोर ॥ 
    चमकि चपला कला लखि सुनि गरज अति ही घोर । 
    लपटि पिय हिय वदत भय वर नेह नैनन कोर ॥3॥ 

    लगी सावन झरी मन भावन सकल सुख रास । 
    अँग अंग भीजे अनंग रस दोऊ विवस परसि विलास॥ ॥ 
    निरखि हरषत सहचरी रस भरी चहुँ दिसि पास । 
    रसिक दासि हुलास सौं सब देत आसिष दास ॥4॥

- verseNumber: "94"
  verseIntro: "राग मलार -"
  verseText: |
    ए विवि झूलत-झूलत भानुजा के तीर । ए जुवती-जुवती जन गन भीर ॥ 
    जुवती जन गन भीर चीर सुरंग विविध सुहावने । 
    मोर तानन घोर सुर कल कोकिलान लजावने ॥ 
    मुदित चित अति श्रुतिन दै नव नागरी वर धीर । 
    हित चितकन झुलाय झुलवत लसत भानुजा तीर ॥1॥ 

    ए बहै त्रिविध-त्रिविध मंद समीर । ए चंचल-चंचल अंचल धीर ॥ 
    चल चीर चख कुंडल सुमंडल माल मुक्ता सोहनी । 
    उर उतंग नितंब कच लचि भार कटि पिय मोहनी ॥ 
    थरहरत जानु सुजंघ कदली रहत नहि ह्वै धीर । 
    फरहरत नीवी वसन जब बहै त्रिविध मंद समीर ॥2॥ 

    ए बजें नूपुर-नूपुर झुन झुनकार । ए अंग-मचकि-मचकि लटकि सुढार ॥ 
    सुढार अंगन मचक लचकन दरस दुति न कही परै । 
    तरक तड़ि घन घोर मोरन सोर बहु वन विस्तरै ॥ 
    डरपि अंगन रंग अवला लपटि गहि भुज भार । 
    तरल गति अति सरल तन बहु नूपुरन झनकार ॥3॥ 

    ए निरखि-निरखि गति पिय औरै । ए लखि थके-थके रसिक सिरमौरै ॥ 
    रसिक थकि लखि अंग गहि परिरंभ दै उर लाईये । 
    मिले दंपति सुरत संपति रंग हिंडोर झुलाईये ॥ 
    निरखि सुख मन हरखि रसिक सुदासि मति भई बौरै । 
    प्याय अधर सुधाहिं सजनी निरखि पिय गति औरै ॥4॥

- verseNumber: "95"
  verseIntro: "श्रीरूपरसिकजी कृत - राग मलार"
  verseText: |
    झूलत लाड़िली लाल हिंडोरें । 
    उर पर उरज करज करजन सों सोहत दृगन की कोरें ॥ 
    नील वसन पीताम्बर सोहै तन घन दामिनि भोरें । 
    किलकत झलकत दसन वसन कल सौंधे विविध झकोरें । 
    कूजत कुंज महल में नूपुर अद्भुत सुर थोरें-थोरें । 
    ललित रसिक लालन ललचान्यौं निरखि रूप तृन तोरें ॥

- verseNumber: "96"
  verseIntro: "श्रीस्वामी हरिदासजी कृत - राग विभास"
  verseText: |
    हिंडोरे व झूलत लाल दिन दूलह दुलहिनि विहारिनि देखौ री ललना । 
    गौर स्याम छबि अति द्युति बहु भाँति री वलना । 
    नीलांबर पीताम्बर अंचल चलत धुजा फहरात कल  कलना । 
    श्रीहरिदास के स्वामी स्यामा कुंजविहारी श्रीविहारिनि अबचलना ॥

- verseNumber: "97"
  verseIntro: "राग देव गंधार (यह पद भेंट कौ है) –"
  verseText: |
    झूलत दोऊ सुन्दर रंग हिंडोरें । 
    स्याम बरन तन रसिक सिरोमनि कुँवरि बरन तन गोरें ॥ 
    नीलांबर पीताम्बर पहिरें घन चपला के भोरें । 
    श्रीहरिदास के स्वामी स्यामा कुंजबिहारी मृदु मुसकत थोरें-थोरें ॥


- verseNumber: "98"
  verseIntro: "(यह पद भेंट कौ है)-"
  verseText: |
    झूलत कमल नैन सुकुमार । 
    गावत गीत पुनीत मनोहर आस पास ब्रज नारि ॥ 
    भूषण वसन विविध रंग पहिरें मनौं फूली फुलवारि । 
    श्रीहरिदास के स्वामी स्यामा कुंजविहारी काम विवस मुखचंद निहारि ॥

- verseNumber: "99"
  verseIntro: "श्रीविहारिनदासजी कृत - राग मलार"
  verseText: |
    हरियारौ सावन सुहावनौ मन भावनौ लागत अति नीकौ । 
    इन-उन मन में बदरन की छैयाँ गहि बहियाँ बोलत डोलत वन वन तैसौई संग सबही कौ ॥ 
    जहाँ-जहाँ झुलावत आवत अनुराग भरे रागरंग प्यारी पीकौ । 
    श्रीविचित्र विहारिनदासि कहत दरसत जे यह सुख दिन धन्य धनि भाग त्रिया तिनही कौ ॥

- verseNumber: "100"
  verseIntro: "श्रीविहारिनदासजी कृत - राग मलार"
  verseText: |
    रस भरे प्रान पिय झूलत फूलत अंग संग सरस हिंडोरे । 
    अति आतुर आसक्त भये बस भृकुटी कटाक्ष झकोरे ॥ 
    छूट टूट गये हार बार बँद छोरत छबि बहु भाँति निहोरें । 
    श्रीविहारिनदासि सुख देत निरंतर पिय प्यारी यों हँसि मुख सों मुख जोरें ॥

- verseNumber: "101"
  verseIntro: "श्रीविहारिनदासजी कृत - राग मलार"
  verseText: |
    हिंडोरे व झूलन आईं नई रितु सावन तीज सुहाई । 
    कुंज-कुंज तें निकसि हरी भूमि अरुन बरन मानौं इन्द्रवधू सी श्रीस्यामाजू हरषि बुलाई ॥ 
    अपने-अपने मेल मिलीं अनुराग मल्हारहि गावत तानन रुचि उपजाई । 
    श्रीविहारिनिदासि स्वामिनी स्याम के संग बढ्यौ रँग अँग-अँग रीझि रिझाई ॥

- verseNumber: "102"
  verseIntro: "श्रीविहारिनदासजी कृत - राग मलार"
  verseText: |
    हरषि हिंडोरना री झूलत नवल किशोरी किशोर । 
    रहस बहस हँसि-हँसि उर लागत अनुरागत झोटा व देत जोवन जोर ॥ 
    श्रमित न राखे रहैं गूढ़ गुन गाढ़े गहें चित्त चुभि रहे चंचल अंचलन के छोर । 
    श्रीविहारिनदासि सु बिलास विवस दंपति दरसत एहि तन-मन मगन निशि भोर ॥

- verseNumber: "103"
  verseIntro: "श्रीविहारिनदासजी कृत - राग मलार"
  verseText: |
    प्यारी झूलत अति रस माती । 
    पिय के अंक निसंक हिंडोरे लपटि लटकि लड़काती ॥ 
    पुलकि-पुलकि प्रीतम उर लागत अति रस रसिक अघाती । 
    श्रीविहारी विहारिनदासि रहसि रस विपिन अंग संग समाती ॥

- verseNumber: "104"
  verseIntro: "श्रीविहारिनदासजी कृत - राग मलार"
  verseText: |
    दूलह दुलहिनि के संग झूलहु । 
    गावत मिलत तार सुर संच सों तान मान जिन भूलहु ॥ 
    लियें सुभाव सहज सुन्दरि कौ प्रतिकूलत अनुकूलहु । 
    श्रीविहारिनदासि ह्वै स्याम रस वश कुंज केलि मिलि फूलहु ॥

- verseNumber: "105"
  verseIntro: "श्रीनागरीदासजी कृत-राग कान्हरौ"
  verseText: |
    अपनी नवल प्रिया संग नवल लाल झूलत हैं हिंडोर ॥ टेक ॥ 
    वृन्दावन घन सहज सोभा आनन्द सिंधु न थोर । 
    सुभग जमुना कूल कमल जु सारस हंस चकोर ॥ 
    बोलत मधुर सुहावने अति मधुप कलरव घोर । 
    नव कुंज कोकिल कीर चातक गावत जस चहुँ ओर ॥1॥

    तैसी पावस रितु भली घन मंद गरजन थोर । 
    तैसीये दामिनि चहुँ दिसि बोलत मोरी मोर । 
    तैसीये भूमि सुहावनी सखी हरित नाना भाँति । 
    रही अति छबि छाइ जित तित इंद्रवधून की पाँति ॥2॥

    नव लता ललित तमाल पल्लव विविध नाना जाति । 
    प्रेम भरि अनुराग झूमी फूल-फल बहु काँति ॥ 
    रचित कुसुम वितान नाना बहत त्रिविध समीर । 
    निरखि संपति विवस ह्वै मन बढ़त मनमथ पीर ॥3॥

    रच्यौ रंग हिंडोरना सखी सहज चंपक कुंज । 
    नव केलि नाना सुखद संपति सरस सौरभ पुंज ॥ 
    रमकि झूलत नवल दोऊ गौर स्यामल गात । 
    पीत पट छबि सुरंग सारी अंचल धुजा फहरात ॥4॥

    सप्त स्वर मिलि मधुर दोऊ करत हैं गुणगान । 
    तैसीये सहचरी संग गावत संच सुर बंधान ॥ 
    राग रागिनि मिली प्यारी लेत विकट सुतान । 
    सुनि थकित नागर चरन गहि सखि रीझि वारत प्रान ॥5॥

    बढ़त अति अनुराग छिन छिन करत नव-नव रंग । 
    सुरत सागर मधुर जोरी सहज संग अभंग ॥ 
    तैसीय सुखद विहारिनि स्वामिनि दासि नागरि संग । 
    तोरि तृण वलि जात छबि पर वारत कोटि अनंग ॥6॥

- verseNumber: "106"
  verseIntro: "श्रीसरसदासजी कृत - पद"
  verseText: |
    झूलत दोऊ नवल हिंडोले । 
    विमल पुलिन कल कमल कुंज मधि चितवत नैन सलोलें ॥ 
    जोवन जोर झकोरन देत आलिंगन करत कलोलें । 
    सरसदासि सुख रासि रहसि नव सुनत मधुर मृदु बोलें ॥

- verseNumber: "107"
  verseIntro: "श्रीसरसदासजी कृत - पद"
  verseText: |
    झूलत फूलत सुरत हिंडोरें । 
    पुलकि-पुलकि किलकत हिलंमिल मन जोवन जोर झकोरें ॥
    छूटी लट पट शिथिल भये अँग-अंग अनंग निहोरें । 
    रहसत विहसत हँसत परस्पर उर कर चिबुक टटोरें ॥ 
    अति रस भरे खड़े डाँड़ी गहें चितवत विवि मुख ओरें । 
    सरसदास दरसत विलास नित अति चंचल चित चोरें ॥

- verseNumber: "108"
  verseIntro: "श्रीपीतांबरदासजी कृत - पद"
  verseText: |
    यह रस रंग हिंडोल सहचरी हरियल सुही सुहाग लहरिया ।
    पहिरें वसन सुरंग दुलहिनी कंचन नील निचोल गहरिया ॥ 
    दूलह घन दामिनि लपटाने तन मन सजि पट पीत पहरिया । 
    सहचरि रसिक देखि छबि ढाँपत पीतांबर जुग रूप ठहरिया ॥

- verseNumber: "109"
  verseIntro: "श्रीभगवतरसिकजी कृत - राग मलार"
  verseText: |
    ललना लाल हिंडोरे झूलैं । 
    सावन में मन भावन मन की मन भावन करि फूलैं ॥ 
    नीरद नवल नाहु उर ऊपर दामिनि भामिनि भूलें । 
    भगवत रसिक झुलावत गावत गहि डाँड़ी भुज मूलें ॥

- verseNumber: "110"
  verseIntro: "श्रीभगवतरसिकजी कृत - राग मलार"
  verseText: |
    झूलत दोउ नव निकुंज मधि ठाढ़े । 
    झोटा देत गहें भुज डाँड़ी अंग अनंगन बाढ़े ॥
    नवसत साजि श्रृंगार सहचरी भूषण ग्यारह साढ़े । 
    भगवत रसिक प्रेम परिपूरण देत अलिंगन गाढ़े ॥

- verseNumber: "111"
  verseIntro: "श्रीभगवतरसिकजी कृत - राग मलार"
  verseText: |
    मेरी अलक लड़ी अलबेली । 
    झूलत रति विपरीत हिंडोरा नाहु अंस भुज मेली ॥ 
    मचतक जोवन जोर परस्पर परिरम्भन पग पेली । 
    गावत राग मलार मनोहर भगवत रसिक सहेली ॥

- verseNumber: "112"
  verseIntro: "श्रीब्रजजीवनजी कृत - राग रेखता"
  verseText: |
    झूलैं हैं रंग हिंडोरना दोऊ रंग गुलाबी । 
    झलकें भूषण वसन देखि रंग गुलाबी ॥
    बाजै ता धिन धुमकत ता थेई मृदंग गुलाबी । 
    गावैं स्वर भरी तानें अली रंग गुलाबी ॥ 
    बाढ़ी हिय हरि सहचरि उमंग गुलाबी । 
    ब्रजजीवना प्यारा लगै सतसंग गुलाबी ॥

- verseNumber: "113"
  verseIntro: "राग रेखता -"
  verseText: |
    मच्यौ है रंग हिंडोरना दोऊ रंग सौं झूलें । 
    वन फूल्यौ चहुँ ओरना, दोऊ रंग सौं झूलैं ॥ 
    उमगी घटा घन घोरना । दोऊ० ॥ नाचें हैं मोरी मोरना । दोऊ० ॥ 
    पहिरें अंचल पट छोरना । दोऊ० ॥ गावैं तानें रंग बोरना । दोऊ० ॥ 
    हरि सहचरी दृग कोरना ॥ दोऊ० ॥ ब्रज जीवना तृण तोरना ॥ दोऊ० ॥

- verseNumber: "114"
  verseIntro: "राग अडानौ -"
  verseText: |
    सो तू राखि लै री, (सो तू राखि लै री) झोटा तरल भये ।
    इत नव कुंज कदंब परसि कैं उत जमुना लौं गये । 
    आवत जात लता निरवारत ऊपर सुरंग वितान छये ।
    कल्यान के प्रभु गिरधरन किये वस झूलत नये-नये ॥

- verseNumber: "115"
  verseIntro: "राग झंझोटी -"
  verseText: |
    तैंड़ा झुलावना मैनू भावै । हौलें हौलें तू झुलावै ॥ 
    दै दी स्यावास ब्रज जीवना नू लड़ैती लाल खड़ा मुसिक्यावै ॥

- verseNumber: "116"
  verseIntro: "राग परज -"
  verseText: |
    लाल मेरी पिंडरी पिरान लगी । 
    अब न झूलौंगी, ब्रज जीवना तेरी सौं मेरे नैंनन नींद खगी ॥

- verseNumber: "117"
  verseIntro: "राग मलार -"
  verseText: |
    करपै कर धरि दोऊ उतरे । 
    झूले हिंडोरें ब्रज जीवना प्यारी क्या खूब नैनी लग सुथरे ॥

- verseNumber: "118"
  verseIntro: "चाचा श्रीवृन्दावनदासजी कृत - राग भैरौं"
  verseText: | 
    लाल गाय चराइकै गिरि धार्यौ  झूलन समझ कहा है । 
    अति सुकुमार प्रिया गौरंगी ता संग झूल्यौ चाहत हौ मन माहैं । 
    हम जु सिखावैं तैसे सीखौ कहा फिरत हौ भरे उमाहैं । 
    वृन्दावन हित रूप रसिकता तव कछु पैहौ यह छल कारज नाहैं ॥

- verseNumber: "119"
  verseIntro: "राग विहागरौ -"
  verseText: |
    रच्यौ है विचित्र हिंडोरना झूलत श्रीराधा ।
    अति कमनी रविजा तीर री झूलत श्रीराधा ॥ 
    यूथ अनंत सखिन लियें ॥ झूलत० ॥ 
    पहिरे तन नव रंग चीर री ॥झूलत० ॥1॥ 
    
    परम रम्य कानन बन्यौ ॥ झूलत० ॥ 
    तहाँ कलप द्रुमन की छाँह री ॥ झूलत० ॥ 
    मोहत कोटिक मदन कौं ॥ झूलत० ॥ 
    पिय सहित मुदित मन माँह री ॥ झूलत० ॥2॥ 

    जरतारी सारी फबी ॥ झूलत० ॥ 
    बन्यौ अतरौटा अति रंग री ॥ झूलत० ॥ 
    सौंधे भीनी कंचुकी ॥ झूलत० ॥ 
    खमकि बनीं तन संग री ॥ झूलत० ॥3॥ 

    रमकि-झमकि कृश कटि मुरै ॥ झूलत० ॥ 
    नूपुर किंकिनी झनकार री ॥ झूलत० ॥ 
    पवन गवन अंचल चलै ॥ झूलत० ॥ 
    उरझत उर वर हार री ॥ झूलतः ॥4॥ 

    विलुलित बैनी पीठ पै ॥ झूलत० ॥ 
    ताकी उपमा बनत सुभाय री ॥ झूलत० ॥ 
    मनहु कनक धरु चौहटे ॥झूलत० ॥ 
    विहरत व्यालिनि सचु पाइ री ॥ झूलत०॥5॥ 
    
    कुसुम किरत हैं सीस तें ॥ झूलत० ॥ 
    गई तरकि कंचुकी फूँद री ॥ झूलत० ॥ 
    मनु सोभा घन ऊनयौ ॥ झूलत० ॥ 
    परत बड़ी-बड़ी बूँद री ॥ झूलत० ॥6॥ 

    पिय बढ़ि झोटा देत हैं । झूलत० ॥ 
    कहैं राखि प्रिया मृदु बैंन री ॥ झूलत० ॥ 
    लपटि-लपटि उर जात हैं । झूलत० ॥ 
    यह निरखि भाग्य फल नैन री ॥ झूलत० ॥7॥ 
    
    पीतांबर कटि तें खस्यौ ॥ झूलत० ॥ 
    दुहुँ चरन रह्यौ लपटाइ री ॥ झूलत० ॥ 
    छबि पर रीझी दामिनी ॥ झूलत० ॥ 
    मनहुँ परी पग आय री ॥ झूलत० ॥8॥ 

    ललिता हँसि पटुली गही ॥ झूलत० ॥ 
    पौंछत अंचल मुख वारि री ॥ झूलत० ॥
    वृन्दावन हित रूप बलि ॥ झूलत० ॥ 
    तृन तोरि पिबत जल वारि री ॥ झूलत०॥9॥

- verseNumber: "120"
  verseIntro: "राग गौरी छंद-"
  verseText: |
    झूलत मोहन राधा लाल । अब छबि बढ़ी है अगाधा लाल । 
    अब छबि बढ़ी अगाधा राधा मोहन रंग भरे झूलें । 
    पचरंग पाट गहें कर डोरी अमल कमल मुख फूलें ॥ 
    फरकत छोर पीत पट सारी नील वसन छबि ऐसें । 
    कौंधि-कौंधि मनु दुरत सजल घन ओपी दामिनि जैसें ॥ 
    बहस परी बातन रस घातन पुजवत सब मन साधा । 
    तीर तरनिजा रच्यौ हिंडोरौ झूलत मोहन-राधा ॥1॥ 

    खंभ जटित बहु भाँती लाल । झुकी है कलपतरु पाँती लाल ॥ 
    झुकी कलपतरु पाँती सुरंगित तहाँ हिंडोर बनायौ । 
    बढ़ि-बढ़ि लहर बहत जहाँ रविजा नव घन ओल्हर आयौ । 
    महमहात कानन अति सौरभ ललित भूमि हरियारी । 
    इन्द्रवधू छबि पावै कोकिल केकी कलरव भारी ॥ 
    जरी वितान मोतियन झालर फैलि रही वन काँती । 
    मरुवे कनक मयार लगे नग खंभ जटित बहु भाँती ॥2॥

    रमकत हैं भुज जोरे लाल । देत कबहुँ झकझोरे लाल ॥ 
    देत कबहुँ झकझोरे हँसि-हँसि लपटत परम सनेही । 
    मनसिज उदित होत रोमांचित प्रान एक द्वै देही ॥ 
    झोटा देत ललित ललितादिक नैनन कौ फल लैहीं । 
    झरि-झरि परत कुसुम मणि भूषन मदन विथा मन दैहीं ॥ 
    बाला भईं माला सोभा की गावत हैं चहुँ ओरें । 
    झुरमुट प्रेम लग्यौ रितु पावस रमकत हैं भुज जोरें ॥3॥
     
    चंद्रिका ढरकन सोहै लाल ॥ मुकुट लटक मन मोहै लाल ॥ 
    मुकुट लटक मन मोहै सोहैं अलकैं घूँघर वारी । 
    बेसर हलन चलन दृग चंचल बेधत मरम विहारी ॥ 
    कढ़न-बढ़न डारिनु तें पुनि-पुनि झूल महा छबि पावैं । 
    गौर घटा अरु मनौं सजल घन झुके अवनि पर आवैं ॥ 
    प्रीतम लाड़ भरी उर लागी दैउँ सु उपमा को है । 
    वृन्दावन हित रूप बढ्यौ अति झुकन चंद्रिका सोहै ॥4॥

- verseNumber: "121"
  verseIntro: "राग मलार ताल आड़-"
  verseText: |
    लटकि-लटकि झूलन में चुनरिया फहर-फहर फरकी है । 
    पिय भुज जोरि लेत जब झोटा कंचुकि उर तरकी है । चुनरिया॥टेक ॥1॥ 
    ग्रीवा दुरन मुरन कृश कटि मुख अलकावलि ढरकी है । 
    जोवन जोर मरोरन तन हिय मदन भीर भर की है ॥2॥ 
    होड़ा होड़ी बढ़त अलोलन पटुली पग सरकी है । 
    वृन्दावन हित रूप सिन्धु सुख मोहन मति गरकी है। ॥3॥

- verseNumber: "122"
  verseIntro: "राग मलार सोरठ -छंद-"
  verseText: |
    श्रीराधा जू सुरतरु छाँही झूलत रंग में । 
    सब गुन रूप गहेली सहचरि संग में ॥ 
    संग में सहचरि नवेली वृन्द वृन्दन दुति घनी । 
    मनहु सोभा ससि प्रिया की किरन चहुँ दिसि यों बनी ॥ 
    फहरात अंबर कनक तारन झलक गोरे अंग में । 
    वृन्दावन हित परम कौतिक राधा जू झूलत रंग में ॥1॥ 

    रमक झमक अति भारी मणि आभरन की । 
    अलक रुरत छबि न्यारी कुसुमन झरन की॥ 
    कुसुम झरत सुदेस बैनी हाल नागरि पीठ पै । 
    अति भयौ सोभा भार प्रीतम थकित उठत न दीठ पै ॥ 
    नख सिख विलोकत रसिक पिय गति रही पलकन धरन की ।
    वृन्दावन हित रूप बलि अति झमक मणि आभरन की ॥2॥ 

    रमकत लाड़ भरी हैं परसत डार हैं । 
    अंचल आड़ खुलन में सरकत हार हैं ।
    हार रुरकै कटि जु मुरकै वदन कछु श्रमकन दिपैं । 
    छूटे जु कच मुख यों लसै मनु राहु ग्रह उड़पति छिपै ॥ 
    उघरैं दुरैं कै स्याम घन विधु कैं पस्यौ तम जार है । 
    वृन्दावन हित लाड़ भरि रमकत जु परसत डार है ॥3॥

    छबि बरषत चहुँ ओरै झोटा लैन में । 
    निकर अनंगन चौंधे दुमची दैन में ॥ 
    दैन दुमची मैन चौंधे सरस तन उपमा महा । 
    सावन जु मन उत्साह राधा कहौं सो बानिक कहा ॥ 
    जल फुहीं बरषत मंद गरजत दामिनी भुव पै नमैं । 
    वृन्दावन हित रूप उझल्यौ बड़े झोटा लैंन में ॥4॥ 

    अरी मेरी प्रानन प्यारी झूलहु मंद गति । 
    पटुली पग न डिगै ज्यों झोटा लेत अति ॥ 
    अति लेत झोटा वदत श्रीहित रूप सजनी मुद भरी । 
    खसि-खसि परत जरी तार सारी विवस लखि नागर हरी ॥ 
    गावत भरी अनुराग त्यों-त्यों प्रेम हलहत प्रानपति । 
    वृन्दावन हित बलि गई पग राखि झूलहु मंद गति ॥5॥

- verseNumber: "123"
  verseIntro: "राग मलार सोरठ छंद-"
  verseText: |
    चित्र विचित्र बनायौ सुभग हिंडोरना । 
    बहु मणि नगन जरायौ सोभा थोर ना ॥ 
    थोर ना सोभा अधिक बाढ़ी ऊपर जरी वितान है । 
    लसें मोतिन झालरी रसना न होत बखान है । 
    हंसजा तीरैं कलप तरु अवनी कनक छबि ओर ना । 
    वृन्दावन हित रूप बलि जहाँ रच्यौ सुभग हिंडोरना ॥1॥

    चोंप चौगुनी हीये - गुन आगरी । 
    अगनित सखी संग लिये राधा नागरी ॥ 
    नागरी आभरन पहिरें फबी नव रंग चूँनरी । 
    लाडु सरसत रंग बरसत रमक छबि बढ़ी दूनरी ॥ 
    डाँड़ी गहैं पिय नेह दहलत वदत अनुपम भाग री । 
    वृन्दावन हित रूप बलि श्रीराधा जू सब गुन आगरी ॥2॥ 

    पाग कसूँभी ढरकी झोटा बढ़न में । 
    कछुक चंद्रिका सरकी डारिनु कढ़न में ॥ 
    कढ़न डारिनु बढ़न झोटन हँसि पिंडी थहरान में ।
    चौंधि मनमथ पर्यौ  चरनन पीत पट फहरान में ॥  
    मिलि जात अंक समात पिय तब बदन पानिप चढ़न में । 
    वृन्दावन हित रूप उमड्यौ विहँसि झोटा बढ़न में ॥3॥ 

    उत नव जलधर घोरे कौंधत दामिनी । 
    इत बल हरत मरोरें मोहन भामिनी ॥ 
    भामिनी मोहन मोहनी सावन भरी उत्साह सों । 
    झूलत हिंडोरे रंग बाढ्‌यौ आज सुंदर नाह सों। ॥ 
    इत अचल नित प्रति देत सुख सखि लाल प्रिय अभिरामिनी  । 
    वृन्दावन हित रूप बलि घनघोर कौंधत दामिनी ॥4॥

    यह सुख बरन्यौ न जाई लपटन नेह की । 
    कानन छबि जु महाई आवन मेह की ॥ 
    मेह आवन उमगि गावन जील अरु स्वर घोर हैं । 
    कुहुक कोकिल नदत दादुर बन झिंगारत मोर हैं ॥ 
    नीठ समझे परत अस दुति गौर-साँवल देह की ।
    वृन्दावन हित रूप बलि कहा कहों लपटन नेह की ॥5॥ 

- verseNumber: "124"
  verseIntro: "राग मलार सोरठ मिली -छंद-"
  verseText: |
    बनी है कदंब तरु पाँती भूमि हरी-हरी । गोप सुता तहाँ झूलें बहु लाड़न भरी ॥ 
    भरी लाड़न चोंप चाड़न बसन भूषन तन सजें । 
    कहा बरनों रूप तिनकौ निकर मनसिज लखि लजैं ॥ 
    रमकत भरी अनुराग गावत कौंन विधि रचि पचि करी ।
    इंद्रवधुन विलोक सोभा जहाँ भूमि हरी-हरी ॥1॥ 

    तिनमें मुकट मणि राधा सींवा रूप की । अति ही लाड़ गहेली रावल भूप की ॥ 
    भूप रावल अति लड़ी चढ़ी सुभग हिंडोरना । 
    जहाँ मुख मयंक मयूख फैलीं कोटि रवि ससि जोर ना ॥ 
    बिथकित विहंगम पशु जहाँ देखि कुँवरि गुनन अनूप की । 
    सावन सुहाई तीज खेलत राधा सींवा रूप की ॥2॥ 

    अति चटकीली फरकै चूँनरि अंग की । नग भूषन दुति थिरकै भरी उमंग की । 
    उमंग हिय जिय बैस लघु मनु पूतरी मृदु हेम की । 
    अनुराग अंकुर उर भयौ दिन बढ़न गरुवे प्रेम की ॥ 
    मृदु चरन कर गहरे रचे मँहदी फबी अति रंग की । 
    जोवन छकी झूलैं रु फूलै फरकै चूनरि अंग की ॥3॥ 

    परम रसिक नंदनंदन यह छबि देखि कें । भरे परम आनंदन प्रेम विशेख कें ।
    विशेष प्रेम किशोर घूमत कुँवर गोकुल राइ कौ ।
    मन डोरि श्रीराधा गही पर्यौ पेंच यह रस दाइ कौ ॥ 
    बरषै उलेड़न रूप भींजत रहे विसरि निमेष कें ।
    वृन्दावन हित रूप बलि नँद नंद छके छबि देखि कें ॥4॥

- verseNumber: "125"
  verseIntro: " राग गौरी-"
  verseText: |
    झूलत लड़ैती राधा भरी अनुराग री । साँवन कौ सुख जाके दरसतु भाग री ॥ 
    घूमें अतरौटा औरु नव रंग चीर री । थकित भये हैं पिय दृग छबि भीर री ॥ 
    झोटा हँसि लेत प्यारी प्रीतम के संग री । सोभा के उदधि मानौं उठत तरंग री ॥ 
    रमक रँगीली बाढ़ी इत-उत जात री । रूप के जलद मानौं झोका खात री ॥ 
    अंगन की कांति नग भूषन की जोत री । वदन विलोकें नैन अचिरज होत री ॥ 
    चहूँ दिस गावें सखी जोरें भुज ग्रीव री । मनहुँ रची है सोभा सींव हू की सींव री ॥ 
    नित नव नेह बाढ़े झूलत हिंडोर री । वृन्दावन हित रूप सुखहिं न ओर री ॥

- verseNumber: "126"
  verseIntro: "राग मलार आड़-चौतालौ -"
  verseText: |
    रंग हिंडोरना माई बन्यौ है तरनिजा तीर । 
    कमनीय कानन तरु लता जहाँ नदत कोकिल कीर ॥ टेक ॥ 
    झूलैं श्रीराधा अति लड़ी आलीनु लीये संग । 
    सिंगार षटदस जाहि सोहैं चूँनरी नव रंग ॥ 
    सावन लिख्यौ सुख भाल जाके हिये अधिक उमंग ।
    बानी न बरनत बनै सोभा-सींव जाके अंग ॥1॥

    खीन कटि अरु पीन उर कर गहैं डाँड़ी चार । 
    रमकै रँगीली नागरी मनु नवत छबि के भार ॥ 
    प्रीतम बढ़ावत चौंप विहँसत प्रिया बारंबार । 
    झोटा बढ़ें त्यौं-त्यौं अधिक मन मथत कोटिक मार ॥2॥
    
    दमकै खएला नग जटित चमकैं मणिनु की चूरि । 
    सजनी सजैं बहु जंत्र जागरि गान विद्या भूरि ॥ 
    उद्दित बदन विधु चाँदनी रही सकल कानन पूरि । 
    कहैं लाल परसौ प्रिया वे कुसुमन झबा लगे दूरि ॥3॥ 

    इत अवधि द्रुम की डार लगि उत अवधि रविजा वारि । 
    पटुली जु टारौ चरन बल बदि होड़ बचन विचारि ॥ 
    लपटें जु तन झपटैं कुसुम हुलसीं हिये सुकुँवारि । 
    जीतीं तरुणिमणि कहैं सखि कौतिक विचित्र निहारि ॥4॥ 

    कहा बरनौं परस्पर दृग देखिवे की लाग । 
    कहि सकौं क्यों एक रसना राधा विपुल सुहाग ॥ 
    वृन्द अगनित सहचरी मनु रूप फूल्यौ बाग । 
    वृन्दावन हित रूप सावन बढ्‌यौ अति अनुराग ॥5॥

- verseNumber: "127"
  verseIntro: "राग विहागरौ-"
  verseText: |
    झूलत दोऊ फूलत रंग भरे हैं । 
    रविजा तीर सुभग वृन्दावन जहँ द्रुम हरे-हरे हैं। ॥1॥ 
    भँवरी पिकी चकोरी मोरिनु मीठे स्वर उचरे हैं । 
    सुनि-सुनि राधा लाल मुदित अति झोटा लेत खरे हैं । 
    किलकत करत कुलाहल प्रीतम अपनी गौं जु ढरे हैं ।
    परसि-परसि सरसत मन मनसिज अमित भाव उघरे हैं ॥  
    झूल बढ़न में खुलि बैंनी तें मल्ली कुसुम झरे हैं । 
    कबहूँ द्वै कबहूँ इक दरसत भुज-भुज अंस धरे हैं ॥ 
    तन तें उठत सुगंध झकोरें दंपति विहँसि परे हैं । 
    वृन्दावन हित रूप सिंधु में अलि दृग मीन तरे हैं ॥

- verseNumber: "128"
  verseIntro: "राग विहागरौ-"
  verseText: |
    चलैं झोटा तिरछोंहे जितहिं सघन द्रुम राखि-राखि री राखि ।
    हौं बरजत प्यारी नहिं मानत एहो ललिता आनि भरौ तुम साखि ॥ 
    हा-हा री अधिक अरबीली मया करि मेरी विनती न इतउत नाखि । 
    वृन्दावन हित रूप रसिक लाल तुमही बिरमि रहौ हौं गुन मानौं सत्य सुनावत भाखि ॥

- verseNumber: "129"
  verseIntro: "राग गौरी-"
  verseText: |
    राधा झूलैं री पीरी पोखर पार । 
    अद्भुत तान गान कोकिल सुनि रही मौन मुख धार ॥ 
    रमकन में दमकें नग भूषन सोभा बढ़ी अपार । 
    चौका की चमकन के ऊपर कोटि दामिनी वार ॥  
    सजनी एक साँवरी आई झूलन कौं रिझवार । 
    ताके सँग झूलत हैं प्यारी करत अधिक मनुहार ॥ 
    थिरकत है अतलस अतरौटा सिर पर सूही सार । 
    खमकि बनी अति पीत कंचुकी मुख पर श्रमकन वारि ॥ 
    कौन गाँव को नाम तिहारौ कहिये कृपा विचार । 
    चतुरन में दीखत अति सुंदरि तरुनिनु में बड़नार ॥ 
    ललिता कहैं बोल री सुंदरि नातर दैउ उतार । 
    राज सुता सँग झूलन आई दियौ दीठ डर डार ॥ 
    सैनन में समुझावै मुख सौं वचन न सकै उचार । 
    नंदगाँव की ओर बतावत ऊँचौ हाथ पसार ॥ 
    अँचरा की सरकन में कौस्तुभ मणि की भई चिन्हार । 
    हर-हर हँसत सकल ब्रज सुंदरि एरी बड़ी खिलवार ॥  
    डोरी गहि लीनी ललिता नें दोऊ लईं उतार । 
    कोऊ कर चटकि बलैयाँ लै-लै कोऊ पीवत जल वार ॥  
    नई पाहुनी भई खिलौना बैठी घूँघट मार । 
    वृन्दावन हित रूप निहारत डारत तन मन वार ॥

- verseNumber: "130"
  verseIntro: "राग सोरठ-"
  verseText: |
    झूलन लड़ैती राधा प्रेम सर आई री । साँवरी सहेली एक बैठी तहाँ पाई री ॥ 
    नैनन नचाइ वह मृदु मुसिकाई री । भूखी हौं सनेह की फिरत बौराई री ॥ 
    भूली वन देखि तुम्हें अति हरषाई री । मोसों करौ प्रीति स्यामा बाबा की दुहाई री॥ 
    जानी ढीठ तौहू राखी आपनी बड़ाई री । करुणा कुशल राधा संग लै झुलाई री ॥ 
    उघरि परी है ताकी उर चतुराई री । कहै भरौ अंक हौं तौ अधिक डराई री ॥ 
    दरकी है चोली दियौ छद्म दिखाई री । सकुचे से नैन मन जीत सी जनाई री ॥ 
    सजनी कहत केती भरी लँगराई री । छलबल ही में रस लबधि मनाई री ॥ 
    गावें मीठे स्वर भये मगन महाई री । वृन्दावन हित रूप अलि बलि-बलि जाई री ॥

- verseNumber: "131"
  verseIntro: "राग सोरठ-"
  verseText: |
    चुनरिया झूलत खमकि बनी ।
    फहर-फहर फहरात गौर तन फैली छबि जु घनी ॥ 
    पीत दरयाई की सौंधे सौं कंचुकी सुभग सनी । 
    तैसीये ललित करन स्यामा के मँहदी रँग रचनी ॥ 
    तैसौई फब्यौ भाग सुख सावन उदित सुहाग मनी । 
    तैसौई लसत वदन विधु पानिप सोभा निधि उफनी ॥ 
    तैसौई रंग हिंडोरौ कौतिक जहाँ हरित अवनी । 
    तैसीये झुकी तरुन की पाँती बानिक परै न गनी ॥ 
    गावत जील घोर सुर जोरें कुँवरि संग सजनी । 
    वृन्दावन हित लग्यौ रूप झर पिवैं दृग ओक धनी ॥

- verseNumber: "132"
  verseIntro: "राग देवस-"
  verseText: |
    सुहावन सावन राधा सुख तिहारे बाँट पर्यौ  । 
    यह जो सत गुन रूप अंग सँग झूलन में उघर्यौ ॥ 
    यह जु चौगुनौ चाव कौन विधि भागन तें जु बढ्‌यौ । 
    वृन्दावन हित रूप रसिक कौ लहनों सुकृत कर्यौ ॥

- verseNumber: "133"
  verseIntro: "राग गौरी-"
  verseText: |
    रच्यौ है हिंडोरौ आली परम अनूप री । झूलत हैं राधा तहाँ बरषत रूप री ॥
    परसि-परसि आवें द्रुमन की डार री । खुलि गई बैनी उर उरझत हार री ॥ 
    रमकि-रमकि पियु झूलत हैं संग री । बढ़ि-बढ़ि झोटा लेत लपटत अंग री ॥ 
    तन तें सुवास फैली पवन झकोर री । अलिनु की सैंना झुकि आईं चहुँ ओर री ॥
    झिझकन बाढ़ी सोभा नैन सलोल री । राखि- राखि बदै प्यारी प्रीतम सों बोल री ॥
    भुजन समानी पिय पुलकित गात री । वृन्दावन हित बनें कहत न बात री ॥

- verseNumber: "134"
  verseIntro: "राग काफी-"
  verseText: |
    हरखि झुलईयै मन भावन । 
    उघरि परै हिय नेह गहगहौ झोटा देहु चित चावन ॥ 
    यह जु कल्पतरु यह रविजा तट यह नव घन झुकि आवन । 
    वृन्दावन हित रूप बलि गई यह हरियारौ साँवन ॥

- verseNumber: "135"
  verseIntro: "राग मलार आड़ चौतालौ-"
  verseText: |
    माई री आज नवल निकुंज मंजुल रच्यौ हिंडोरौ स्याम । 
    कमनीय रतन जराइ रोपे खंभ अति अभिराम ॥ टेक ॥ 
    लसत सुभग मयार मुक्ता झालरी छबि देत  । 
    मरुवे तौ रंग विरंग डाँड़ी अरुन बिच-बिच सेत ॥ 
    पटुली जटी बहु भाँति नग जगमगत मन हर लेत । 
    मन दै सँवास्यौ रसिक नागर प्रिया झूलन हेत ॥1॥ 

    चहुँ ओर सखियन मंडली मधि राधिका सुकुमार । 
    मिलि चलीं सावन तीज खेलन चतुर परम उदार ॥ 
    रंग-रंग सारी चूँनरी कंचुकी उरन सुढारं । 
    पग धरत धरनि उठाइ लचकत कटि जु जोवन भार ॥2॥ 

    मृदु मुसकि बोले प्रान वल्लभ नागरी प्रति बैन  । 
    आजु बन्यौ है रंग हिंडोरना सुख देखिये भरि नैन। ॥ 
    बैठे हिंडोरे धन-धनी रस रासि सोभा ऐन । 
    हँसि-हँसि धरत भुज मूल अंसन निरखि विथकित मैन ॥3॥ 

    इक मुदित मन दुलरावहीं मोहन रँगीली बाल । 
    इक सजैं बीन मृदंग गावत गीत परम रसाल ॥ 
    इक रहीं सर्वसु हारि अपनौं परीं सोभा जाल । 
    इक देत हरखि असीस ये चिरजियौ ललना-लाल ॥4॥ 

    सजल घन तन स्याम के पट पीत यों फहरात । 
    अँग-अंग राजै कुँवरि राधे दामिनी दरसात ॥ 
    श्रीहित रूप कुशल किशोर दोऊ परस्पर लपटात । 
    वृन्दावन हित सोभा झर लखि सखिन नैन सिरात ॥5॥

- verseNumber: "136"
  verseIntro: "राग मलार आड़ चौतालौ-"
  verseText: |
    बन्यौ है हिंडोरना माई राधा जू झूलन हेत । 
    सरसत परम आनन्द दरसत लाल दृग सुख देत ॥ टेक ॥ 
    रँग खचित मणि नग खचित खंभन जोति जगमग बढ़ी । 
    मानौं अलंकृत भुजा अवनी परम हित सों कढ़ी ॥ 
    मरुवे मयारिनु रतन दुति डाँड़ीनु लाली चढ़ी । 
    पटुली तौ चित्र-विचित्र रचना अहा किन बिधि गढ़ी ॥1॥ 

    पचरंग तन्यौ है बितान तापर कनक सूतन कोर । 
    विद्रुमन झूमक लसत मोतिनु झालरी चहुँ ओर ॥ 
    हरित भूमि सुहावनी बोलत जु शुक पिक मोर । 
    पहिरैं तो नव रंग चूँनरी रमकत जु जोवन जोर ॥2॥ 

    गावत भरी अनुराग बाला बनी एक समान । 
    फूल्यौ फल्यौ छबि बाग उपमा दियें बनत न आन ॥ 
    सौभाग सींवा गुन अवधि अति लड़ी श्री वृषभानु । 
    दुमचीनु राख्यौ रंग हँसि-हँसि हरत मनमथ मान ॥3॥

    होत कौतूहल परम सुख फब्यौ सावन भाल । 
    बढ़ि-बढ़ि जु झोटा देत बोलत राखि बलि इहि काल ॥ 
    तिनमें सहेली साँवरी लखि वदत भाल विशाल । 
    घन गौर वरषत रूप दमकत दसन दामिनि माल ॥4॥ 

    हलत बैनी पीठ पै मनु विषधरन गोती । 
    खुलत घूँघट बदन सोभा देख अनहोती ॥  
    ताटंक विलुलित श्रवन नाचत नासिका मोती । 
    वृन्दावन हित रूप निरवधि फैलि रही जोती ॥5॥

- verseNumber: "137"
  verseIntro: "श्रीगोविन्दस्वामीजी कृत राग मलार-"
  verseText: |
    हिंडोरे झूलत हैं पिय-प्यारी । 
    तैसीय रितु पावस सुख दायक तैसिये भूमि हरियारी ॥ 
    घन गरजत तैसिए दामिनि कोंधत फुही परत सुखकारी । 
    अवला अति सुकुमार डरत मन पुलकि भरत अँकवारी ॥ 
    मदन गोपाल तमाल श्याम तन कनक बेलि सुकुमारी । 
    गिरधर लाल रसिक राधा पर गोविन्द जन वलिहारी ॥

- verseNumber: "138"
  verseIntro: "श्री (भोलानाथ) भोरी सखीजी कृत -राग मलार -"
  verseText: |
    नैना नैंन हिंडोरे झूलें । 
    नैनन ही में रमकै नैना नैंनन फूलन फूलें ॥ 
    नैंनन वरषन नैंनन भींजन नैंना रस अनुकूलें । 
    भोरी सखी हित नैंनन साँवन फहरन रंग दुकूलें ॥

- verseNumber: "139"
  verseIntro: "चाचा हित वृन्दावनदासजी कृत -राग ईमन"
  verseText: |
    झूलन लागी हो आज नवल दुलहिया चढ़ बढ़ झोटा लेत । 
    द्रुम डारन परसत मन सरसत दरसत तन दुति रमकन शोभा देत ॥ 
    गावत कछु अनुराग भरी मन जामें भर्यो है अधिक रस हेत । 
    वृन्दावन हित रूप स्वामिनी छबि धाराधर पिय पर बरसत भीजत होत अचेत ॥

- verseNumber: "140"
  verseIntro: "राग विहागरौ -"
  verseText: |
    नव सत सजि अंग-अंग निकस-निकस हरित भूमि झूलत हैं कुँवरि राधा उठत लपट सौंधे । 
    नील वसन छबि छनकैं गौर तेज किरन बढ़ी लपट रही मेघ ओपी दामिनि मनु कौंधे ॥ 
    आवत जात झोटन में गावत हैं उमग-उमग मीठी धुनि मदन प्रान वेधत मन रौंधें । 
    कौतिक हित वृन्दावन प्रीतम हू विवस भये अस कछू प्रकाश रूप निरख नैन चौंधें ॥

- verseNumber: "141"
  verseIntro: "राग विहागरौ -"
  verseText: |
    रतन जटित मणिन कौ हिंडोरना अलौकिक अति पिय के अनुराग भरी झूलत वनरानी । 
    मंद-मंद गरजत घन दामिनि चहुँ ओर चमक नान्हीं-नान्हीं बूँद विपिन बरसत है पानी ॥
    हरित भूमि शोभित वन परम रम्य पावस रितु जहाँ तहाँ केकि कीर कोकिल मृदु वानी ।
    बलि-बलि वृन्दावन हित रूप अली झोटा देत घूँघट के खुलतहि छबि लाल हिय समानी ॥

- verseNumber: "142"
  verseIntro: "राग मालकोश-"
  verseText: |
    झूल-झूल फूलत है तन मन रच्यौ है हिंडोरौ रविजा तट में । 
    रूप जोत झकुरात पवन मानों यौं तन लसत कसूँभी पट में । 
    ज्यौं-ज्यौं झोटा देत रसिक पिय त्यौं-त्यौं प्रेम बढ़त उर घट में । 
    कौतिक परम विलोक सखी री बेसर उरझि सुभग इक लट में ॥ 
    या शोभा कौ लाल जोहरी परखन कौ गुन नागर नट में । 
    वृन्दावन हित रूप उझल पर्यौ अति सुख बरसत वंशीवट में ॥

- verseNumber: "143"
  verseIntro: "राग मालकोश-"
  verseText: |
    झूल विहारिनि भाग्य अति बली । 
    रूप गुमानी प्रीतम बाला शोभा देखत ता मधि दहली ॥ 
    फटिक मणिनु की पटुली तामें लसत ललाई मृदुल पग तली । 
    वृन्दावन हित रूप बढ्यौ अति ज्यौं-ज्यों तेरी रमक बढ़ चली ॥

- verseNumber: "144"
  verseIntro: "राग गौरी गोधनी-"
  verseText: |
    अहो प्यारी रावलपति आनंदिनी रानी कीरति प्रान अधार हो । 
    आज साँवन तीज सुहावनी लै निकसी सखियन लार हो ॥ 
    आज कौतिक रच्यौ है हिंडोरना झूलत फूलत सुकुँवार हो ॥ टेक ॥ 

    सखि गोपन राज कुमारिका सजीं नख सिख परम अनूप हो । 
    सखि इन विधिना जानों ना रचीं लख अचिरज जिनकौ रूप हौ ॥1॥ 

    सखि वदन मयंकन छबि छटा अरु वन घन तिमिर विदार हो । 
    प्यारी रूप गहरता अंग-अंग पग धरत लचत कटि भार हो ॥2॥ 

    प्यारी तिन मधि श्यामा नागरी छवि आगरि गुन अभिराम हो । 
    सखि पिता भयाने देशपति दुलरावत लै लै नाम हो ॥3॥ 

    सखि अति कमनी अवनी जहाँ केकी शुक पिक छबि देत हो  । 
    प्यारी द्रुम बेलिन श्रेनी बनीं पुनि निज मंदिर संकेत हो ॥4॥ 

    प्यारी राधे पगु पटली धर्यौ सखि चाइन झोटा देत हो । 
    प्यारी रमक रँगीली भाइ सौं बढ़ी परसन डारिन हेत हो ॥5॥ 

    प्यारी सारी सरकी सीस तैं मुख इन्दु जगमगत जोत हो । 
    सखि कानन छबि पूरित भई सकुचे सब दुतिधर गोत हो ॥6॥ 

    प्यारी कुसुम किरत कच फरहरत मुख झाँपत उलटत झूल हो । 
    सखि मनहु कुहू' तम कुपित है शशि ग्रासत बरसत फूल हो ॥7॥ 

    प्यारी दृग दीरघ चंचल ढरैं पल-वसन भरहरैं गात हो । 
    सखि मनहुँ बाज रति राज के तज कुलह तकत बहु घात हो ॥8॥ 

    सखि ढुरन मुरन अति खीन कटि यों किंकिनि करत विवाद हो । 
    सखि राख-राख साखी भरत डरि उचरत पुनि-पुनि नाद हो ॥9॥ 

    लाल निकट निरखि द्रुम ओट तैं भये विवस कुँवर नँद नंद हो । 
    प्यारी ललिता स्वास भरत सुने तब रच्यौ है कछुक छंदबंद हो ॥10॥ 

    लाल सहचरि भेष बनाइ कैं राधे सौं आन मिलाइ हो । 
    सखि रमकत दृग-दृग जोर कैं सुख बरनत न बरन्यौ जाइ हो ॥11॥ 

    प्यारी पुनि कुंजन कौतिक चलीं बदि फूल फलनं कौ हेत हो । 
    सखि बलि हित रूप विनोद पै मन भाये मिलि सुख लेत हो ॥12॥ 

    सखि रस संकेत हिंडोरना यों विलसत श्यामा श्याम हो । 
    वृन्दावन हित कमनीय वन बिच बरसाने-नंदग्राम हो ॥13॥