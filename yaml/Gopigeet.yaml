  verseText: | 
    गोप्य ऊचुः

    जयति तेऽधिकं जन्मना व्रजः श्रयत इन्दिरा शश्वदत्र हि।
    दयित दृश्यतां दिक्षु तावकास्त्वयि धृतासवस्त्वां विचिन्वते ॥1॥
 
    व्याख्या - गोपियाँ विरहावेश में गान कर रही हैं – प्यारे ! तुम्हारे जन्म के कारण वैकुण्ठ आदि लोकों से भी व्रज की महिमा बढ़ गयी है। तभी तो सौन्दर्य और मृदुलता की देवी लक्ष्मी जी अपना निवास स्थान वैकुण्ठ छोड़कर यहाँ नित्य-निरन्तर निवास करने लगी हैं, इसकी सेवा करने लगी हैं। परन्तु प्रियतम ! देखो तुम्हारी गोपियाँ जिन्होंने तुम्हारे चरणों में ही अपने प्राण समर्पित कर रखे हैं, वन-वन में भटककर तुम्हें ढूँढ़ रही हैं।

    शरदुदाशये साधुजातसत् सरसिजोदरश्रीमुषा दृशा।
    सुरतनाथ तेऽशुल्कदासिका वरद निघ्नतो नेह किं वधः ॥2॥

    व्याख्या - हमारे प्रेमपूर्ण हृदय के स्वामी ! हम तुम्हारी बिना मोल की दासी हैं। तुम शरत्कालीन जलाशय में सुन्दर-से-सुन्दर सरसिज की कर्णिका के सौन्दर्य को चुराने वाले नेत्रों से हमें घायल कर चुके हो। हमारे मनोरथ पूर्ण करने वाले प्राणेश्वर! क्या नेत्रों से मारना वध नहीं है? अस्त्रों से हत्या करना ही वध है?।

    विषजलाप्ययाद्व्यालराक्षसाद् वर्षमारुताद्वैद्युतानलात्।
    वृषमयात्मजाद्विश्वतोभयादृषभ ते वयं रक्षिता मुहुः ॥3॥

    व्याख्या - पुरुषशिरोमणे ! यमुना जी के विषैले जल से होने वाली मृत्यु, अजगर के रूप में खाने वाले अघासुर, इन्द्र की वर्षा, आँधी, बिजली, दावानल, वृषभासुर और व्योमासुर आदि से एवं भिन्न-भिन्न अवसरों पर सब प्रकार के भयों से तुमने बार-बार हमलोगों की रक्षा की है।
    
    न खलु गोपिकानन्दनो भवानखिलदेहिनामन्तरात्मदृक्।
    विखनसार्थितो विश्वगुप्तये सख उदेयिवान्सात्वतां कुले ॥4॥

    व्याख्या - तुम केवल यशोदानन्दन ही नहीं हो; समस्त शरीरधारियों के हृदय में रहने वाले उनके साक्षी हो, अन्तर्यामी हो। सखे ! ब्रह्माजी की प्रार्थना से विश्व की रक्षा करने के लिये तुम यदुवंश में अवतीर्ण हुए हो।
    
    विरचिताभयं वृष्णिधुर्य ते चरणमीयुषां संसृतेर्भयात्।
    करसरोरुहं कान्त कामदं शिरसि धेहि नः श्रीकरग्रहम् ॥5॥
    
    व्याख्या - अपने प्रेमियों की अभिलाषा पूर्ण करने वालों में अग्रगण्य यदुवंश शिरोमणे ! जो लोग जन्म-मृत्यु रूप संसार के चक्कर से डरकर तुम्हारे चरणों की शरण ग्रहण करते हैं, उन्हें तुम्हारे करकमल अपनी छत्र-छाया में लेकर अभय कर देते हैं। हमारे प्रियतम ! सबकी लालसा-अभिलाषाओं को पूर्ण करने वाला वही करकमल, जिससे तुमने लक्ष्मीजी का हाथ पकड़ा है, हमारे सिर पर रख दो।
    
    व्रजजनार्तिहन्वीर योषितां निजजनस्मयध्वंसनस्मित।
    भज सखे भवत्किङ्करीः स्म नो जलरुहाननं चारु दर्शय ॥6॥
    
    व्याख्या - व्रजवासियों के दुःख दूर करने वाले वीरशिरोमणि श्यामसुन्दर ! तुम्हारी मन्द-मन्द मुसकान की एक उज्ज्वल रेखा ही तुम्हारे प्रेमीजनों के सारे मान-मद को चूर-चूर कर देने के लिये पर्याप्त है। हमारे प्यारे सखा! हमसे रूठो मत, प्रेम करो। हम तो तुम्हारी दासी हैं, तुम्हारे चरणों पर निछावर हैं। हम अबलाओं को अपना वह परम सुन्दर साँवला-साँवला मुखकमल दिखलाओ।

    प्रणतदेहिनां पापकर्शनं तृणचरानुगं श्रीनिकेतनम्।
    फणिफणार्पितं ते पदांबुजं कृणु कुचेषु नः कृन्धि हृच्छयम् ॥7॥
    
    व्याख्या - तुम्हारे चरणकमल शरणागत प्राणियों के सारे पापों को नष्ट कर देते हैं। वे समस्त सौन्दर्य, माधुर्य की खान हैं और स्वयं लक्ष्मी जी उनकी सेवा करती रहती हैं। तुम उन्हीं चरणों से हमारे बछड़ों के पीछे-पीछे चलते हो और हमारे लिये उन्हें साँप के फणों तक पर रखने में भी तुमने संकोच नहीं किया। हमारा हृदय तुम्हारी विरहव्यथा की आग से जल रहा है तुम्हारी मिलन की आकांक्षा हमें सता रही है। तुम अपने वे ही चरण हमारे वक्षःस्थल पर रखकर हमारे हृदय की ज्वाला को शान्त कर दो।
    
    मधुरया गिरा वल्गुवाक्यया बुधमनोज्ञया पुष्करेक्षण।
    विधिकरीरिमा वीर मुह्यतीरधरसीधुनाऽऽप्याययस्व नः ॥8॥

    व्याख्या - कमलनयन ! तुम्हारी वाणी कितनी मधुर है! उसका एक-एक पद, एक-एक शब्द, एक- एक अक्षर मधुरातिमधुर है। बड़े-बड़े विद्वान् उसमें रम जाते हैं। उस पर अपना सर्वस्व निछावर कर देते हैं। तुम्हारी उसी वाणी का रसास्वादन करके तुम्हारी आज्ञाकारिणी दासी गोपियाँ मोहित हो रही हैं। दानवीर ! अब तुम अपना दिव्य अमृत से भी मधुर अधर-रस पिलाकर हमें जीवन-दान दो, छका दो। 
    
    तव कथामृतं तप्तजीवनं कविभिरीडितं कल्मषापहम्।
    श्रवणमङ्गलं श्रीमदाततं भुवि गृणन्ति ते भूरिदा जनाः ॥9॥

    व्याख्या - प्रभो ! तुम्हारी लीलाकथा भी अमृतस्वरूप है। विरह से सताये हुए लोगों के लिये तो वह जीवन सर्वस्व ही है। बड़े-बड़े ज्ञानी महात्माओं - भक्त कवियों ने उसका गान किया है, वह सारे पाप-ताप तो मिटाती ही है, साथ ही श्रवण मात्र से परम मंगल - परम कल्याण का दान भी करती है। वह परम सुन्दर, परम मधुर और बहुत विस्तृत भी है। जो तुम्हारी उस लीला-कथा का गान करते हैं, वास्तव में भूलोक में वे ही सबसे बड़े दाता हैं।
    
    प्रहसितं प्रिय प्रेमवीक्षणं विहरणं च ते ध्यानमङ्गलम्।
    रहसि संविदो या हृदिस्पृशः कुहक नो मनः क्षोभयन्ति हि ॥10॥

    व्याख्या - प्यारे ! एक दिन वह था, जब तुम्हारी प्रेमभरी हँसी और चितवन तथा तुम्हारी तरह-तरह की क्रीडाओं का ध्यान करके हम आनन्द में मग्न हो जाया करती थीं। उनका ध्यान भी परम मंगलदायक है, उसके बाद तुम मिले। तुमने एकान्त में हृदयस्पर्शी ठिठोलियाँ कीं, प्रेम की बातें कहीं। हमारे कपटी मित्र ! अब वे सब बातें याद आकर हमारे मन को क्षुब्ध किये देती हैं।
    
    चलसि यद् व्रजाच्चारयन्पशून् नलिनसुन्दरं नाथ ते पदम्।
    शिलतृणाङ्कुरैः सीदतीति नः कलिलतां मनः कान्त गच्छति ॥11॥

    व्याख्या - हमारे प्यारे स्वामी! तुम्हारे चरण कमल से भी सुकोमल और सुन्दर हैं। जब तुम गौओं को चराने के लिये व्रज से निकलते हो तब यह सोचकर कि तुम्हारे वे युगल चरण कंकड़, तिनके और कुश-काँटे गड़ जाने से कष्ट पाते होंगे, हमारा मन बेचैन हो जाता है। हमें बड़ा दुःख होता है।
    
    दिनपरिक्षये नीलकुन्तलैर्वनरुहाननं बिभ्रदावृतम्।
    घनरजस्वलं दर्शयन्मुहुर्मनसि नः स्मरं वीर यच्छसि ॥12॥
    
    व्याख्या - दिन ढलनेपर जब तुम वन से घर लौटते हो, तो हम देखती हैं कि तुम्हारे मुखकमल पर नीली-नीली अलकें लटक रही हैं और गौओं के खुर से उड़-उड़कर घनी धूल पड़ी हुई है। हमारे वीर प्रियतम ! तुम अपना वह सौन्दर्य हमें दिखा-दिखाकर हमारे हृदय में मिलन की आकांक्षा-प्रेम उत्पन्न करते हो।
    
    प्रणतकामदं पद्मजार्चितं धरणिमण्डनं ध्येयमापदि।
    चरणपङ्कजं शन्तमं च ते रमण नः स्तनेष्वर्पयाधिहन् ॥13॥
    
    व्याख्या - प्रियतम ! एकमात्र तुम्हीं हमारे सारे दुःखों को मिटाने वाले हो। तुम्हारे चरणकमल शरणागत भक्तों की समस्त अभिलाषाओं को पूर्ण करनेवाले हैं। स्वयं लक्ष्मी जी उनकी सेवा करती हैं और पृथ्वी के तो वे भूषण ही हैं। आपत्ति के समय एकमात्र उन्हीं का चिन्तन करना उचित है, जिससे सारी आपत्तियाँ कट जाती हैं। कुंजविहारी ! तुम अपने वे परम कल्याण स्वरूप चरणकमल हमारे वक्षःस्थल पर रखकर हृदय की व्यथा शान्त कर दो।
    
    सुरतवर्धनं शोकनाशनं स्वरितवेणुना सुष्ठु चुम्बितम्।
    इतररागविस्मारणं नृणां वितर वीर नस्तेऽधरामृतम् ॥14॥
    
    व्याख्या - वीरशिरोमणे ! तुम्हारा अधरामृत मिलन के सुख को – आकांक्षा को बढ़ाने वाला है। वह विरहजन्य समस्त शोक-सन्ताप को नष्ट कर देता है। यह गाने वाली बाँसुरी भलीभाँति उसे चूमती रहती है। जिन्होंने एक बार उसे पी लिया, उन लोगों को फिर दूसरों और दूसरों की आसक्तियों का स्मरण भी नहीं होता। हमारे वीर ! अपना वही अधरामृत हमें वितरण करो, पिलाओ।
    
    अटति यद्भवानह्नि काननं त्रुटिर्युगायते त्वामपश्यताम्।
    कुटिलकुन्तलं श्रीमुखं च ते जड उदीक्षतां पक्ष्मकृद्दृशाम् ॥15॥
    
    व्याख्या - प्यारे ! दिनके समय जब तुम वन में विहार करने के लिये चले जाते हो, तब तुम्हें देखे बिना हमारे लिये एक-एक क्षण युग के समान हो जाता है और जब तुम सन्ध्या के समय लौटते हो तथा घुँघराली अलकों से युक्त तुम्हारा परम सुन्दर मुखारविन्द हम देखती हैं, उस समय पलकों का गिरना हमारे लिये भार हो जाता है और ऐसा जान पड़ता है कि इन नेत्रों की पलकों को बनाने वाला विधाता मूर्ख है।
    
    पतिसुतान्वयभ्रातृबान्धवानतिविलङ्घ्य तेऽन्त्यच्युतागताः।
    गतिविदस्तवोद्गीतमोहिताः कितव योषितः कस्त्यजेन्निशि ॥16॥
    
    व्याख्या - प्यारे श्यामसुन्दर ! हम अपने पति-पुत्र, भाई-बन्धु और कुल-परिवार का त्यागकर, उनकी इच्छा और आज्ञाओं का उल्लंघन करके तुम्हारे पास आयी हैं। हम तुम्हारी एक-एक चाल जानती हैं, संकेत समझती हैं और तुम्हारे मधुर गान की गति समझकर, उसी से मोहित होकर यहाँ आयी हैं। कपटी ! इस प्रकार रात्रि के समय आयी हुई युवतियों को तुम्हारे सिवा और कौन छोड़ सकता है।
    
    रहसि संविदं हृच्छयोदयं प्रहसिताननं प्रेमवीक्षणम्।
    बृहदुरः श्रियो वीक्ष्य धाम ते मुहुरतिस्पृहा मुह्यते मनः ॥17॥
    
    व्याख्या - प्यारे ! एकान्त में तुम मिलन की आकांक्षा, प्रेम-भाव को जगाने वाली बातें करते थे। ठिठोली करके हमें छेड़ते थे। तुम प्रेमभरी चितवन से हमारी ओर देखकर मुसकरा देते थे और हम देखती थीं तुम्हारा वह विशाल वक्षःस्थल, जिस पर लक्ष्मीजी नित्य-निरन्तर निवास करती हैं। तबसे अबतक निरन्तर हमारी लालसा बढ़ती ही जा रही है और हमारा मन अधिकाधिक मुग्ध होता जा रहा है।
    
    व्रजवनौकसां व्यक्तिरङ्ग ते वृजिनहन्त्र्यलं विश्वमङ्गलम्।
    त्यज मनाक् च नस्त्वत्स्पृहात्मनां स्वजनहृद्रुजां यन्निषूदनम् ॥18॥
    
    व्याख्या - प्यारे ! तुम्हारी यह अभिव्यक्ति व्रज-वनवासियों के सम्पूर्ण दुःख-ताप को नष्ट करने वाली और विश्व का पूर्ण मंगल करने के लिये है। हमारा हृदय तुम्हारे प्रति लालसा से भर रहा है। कुछ थोड़ी-सी ऐसी ओषधि दो, जो तुम्हारे निजजनों के हृदय रोग को सर्वथा निर्मूल कर दे।
    
    यत्ते सुजातचरणाम्बुरुहं स्तनेषु भीताः शनैः प्रिय दधीमहि कर्कशेषु।
    तेनाटवीमटसि तद्व्यथते न किंस्वित् कूर्पादिभिर्भ्रमति धीर्भवदायुषां नः ॥19॥
    
    व्याख्या - तुम्हारे चरण कमल से भी सुकुमार हैं। उन्हें हम अपने कठोर स्तनों पर भी डरते-डरते बहुत धीरे से रखती हैं कि कहीं उन्हें चोट न लग जाय। उन्हीं चरणों से तुम रात्रि के समय घोर जंगल में छिपे-छिपे भटक रहे हो ! क्या कंकड़, पत्थर आदि की चोट लगने से उनमें पीड़ा नहीं होती? हमें तो इसकी सम्भावना मात्र से ही चक्कर आ रहा है। हम अचेत होती जा रही हैं। श्रीकृष्ण ! श्यामसुन्दर ! प्राणनाथ ! हमारा जीवन तुम्हारे लिये है, हम तुम्हारे लिये जी रही हैं, हम तुम्हारी हैं।
    
    इति: गोप्य: प्रगायंत्य: प्रलपंत्यंश्च चित्रधा।
    रुरुदु: सुस्वरं राजन! कृष्णदर्शनलालसा:॥

    तासामाविरभूच्छौरिः स्मयमानमुखाम्बुजः।
    पीताम्बरधरः स्त्रग्वी साक्षान्मन्मथमन्मथः॥